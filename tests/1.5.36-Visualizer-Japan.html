    <script>
      const config = {
            headers: ["strId", "EN", "Japan", "State", "Notes"],
            rawData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +&lt;color=&quot;#1e8852&quot;&gt;8&lt;/color&gt;", "回復効果+&lt;color=&quot;#1e8852&quot;&gt;8&lt;/color&gt;", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +&lt;color=&quot;#1e8852&quot;&gt;1&lt;/color&gt;", "レイジ自然回復+&lt;color=&quot;#1e8852&quot;&gt;1&lt;/color&gt;", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -&lt;color=&quot;#1e8852&quot;&gt;2&lt;/color&gt;", "コスト-&lt;color=&quot;#1e8852&quot;&gt;2&lt;/color&gt;", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +&lt;color=&quot;#1e8852&quot;&gt;300&lt;/color&gt;", "攻撃力が&lt;color=&quot;#1e8852&quot;&gt;300&lt;/color&gt;増加する。", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +&lt;color=&quot;#1e8852&quot;&gt;8%&lt;/color&gt;", "貫通が&lt;color=&quot;#1e8852&quot;&gt;8%&lt;/color&gt;増加する。", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "かすかな光でさえ、闇を払いのける。", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "光は、私たちが勇気を持って育てる場所でこそ芽吹く。", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "地に嵐が迫ろうとも、私は信じることを選ぶわ。予言が何だというの？真実は、自らの内にあるものよ。", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "予言が何だというの？真実は、自らの内にあるものよ。", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "すべては、光の御前に明らかになる。", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "この牙……だんだん研ぎ澄まされてきたわね。", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "脱皮するたびに、私は「より強く、より美しく」なるのよ。", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "ひれ伏しなさい、哀れな下郎……私こそ、神をも超える存在よ。", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "私の毒に、解毒剤なんて存在しないのよ。", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent&#x27;s will!", "混沌も秩序も、存在しない……あるのはただ、蛇の意志だけよ！", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "ダメージ増加", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "静寂の息吹", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "ダメージ+{20,num/100}%（同じステータスの既存のバフ/デバフより効果が高い場合のみ有効。）", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "毎秒、自身の攻撃力の{30,num}%分のシールドを獲得し、最大で攻撃力の{31,num}%分までスタックする。", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "2秒ごとにデバフを1つ解除する。アイリスが静寂の息吹で味方を回復すると、追加で{30,num}%の回復効果ボーナスを得る。静寂の息吹の効果を受けられる味方は最大2体まで。", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "飛行ユニットを含む前方の最大{31,num}体の敵に1回、範囲魔法ダメージを与える。さらに、マイティスラストが敵に{32,num}%の脆弱（魔法ダメージ）増加を{33,num}秒間付与する。", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy&#x27;s DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "炎槍は敵の防御力を{30,num}%無視する。ユニバースリングは追加で{31,num}回跳ね返り、同じ対象に複数回命中できる。陰陽剣はHPが{32,num}%未満の通常モンスターを処刑する。", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "装備レイドIに参加してトロフィーを獲得し、報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "装備レイドIIに参加してトロフィーを獲得し、報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "装備レイドIIIに参加してトロフィーを獲得し、報酬と交換しましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "ヒーローを召喚してトロフィーを獲得し、ランダムな報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes&#x27; skills to win trophies and redeem rewards.", "ヒーローをレベルアップ、スターアップ、昇格、またはヒーロースキルをアップグレードさせてトロフィーを獲得し、報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "アーティファクト素材レイドに参加してトロフィーを獲得し、報酬を引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "装備レイドIに参加してトロフィーを獲得し、報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "ヒーローの降臨アルティメットリーダーボード", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "失われし遺産", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "砂の宝物庫", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "失われた場所", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "ヒーローの降臨", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "ヒーロートレーニング", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "アーティファクトの謎", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "失われし遺産", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "ストーリーチャプター", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "チャレンジチャプター", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "パブリックドメインIP", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "ゾンビ侵攻", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "チャンネル切り替え中...", "", ""], ["CommonText_mMessage_24292", "Challenges", "チャレンジ", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;試練の要石&lt;/color&gt;\\n試練の要石は様々なゲームモードから入手できる。これらの要石にはそれぞれ異なる種類とレベルがあり、固有の古代の刻印が含まれている。祭壇に挿入すると、対応する試練への道が開かれる。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;チャレンジルール&lt;/color&gt;\\n各バトルは複数のモンスターウェーブで構成される。各ウェーブを倒すとチェストが報酬として得られる。バトル開始後は再開できない。途中で退出した場合、現在のバトル進行状況に基づいて報酬が決済される。試練チャレンジでは月に最大200個の要石を消費できる。この上限に達すると、その月はそれ以上チャレンジを行うことができない。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;要石エネルギー&lt;/color&gt;\\n各要石は特定のエネルギーを持っている。&lt;color=&quot;#fdbe36&quot;&gt;試練1回の挑戦につき1エネルギーが消費される。&lt;/color&gt;バトル終了時に要石にエネルギーが残っている場合、報酬を放棄して退出し、再度エネルギーを消費して試練を再開することができる。エネルギー消費は月間要石制限にカウントされない。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;要石破壊&lt;/color&gt;\\n破壊レベル要件を満たす要石を破壊できる。要石を破壊しても報酬は得られず、月間要石消費制限にもカウントされない。\\n&lt;color=&quot;#fd4540&quot;&gt;試練の要石にはストレージ制限がある。満杯になると、これ以上要石を入手できなくなる。スペースを確保するため定期的に使用してください。&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "モスクリスタル", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "溶岩クリスタル", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "バトル開始後は再スタートできません。途中で退出すると即座に精算が行われ、消費されたエネルギーは返還されません！", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "アポカリプス時に溶岩がサージする火山地域。アポカリプスの邪悪な勢力を撃退するため、より多くのプラットフォームヒーローが必要とされている。", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;このプレイヤーを司令官のポジションから解雇しますか？&lt;/color&gt;\\n各ギルドごとに最大{num1}名の司令官を任命でき、1名につき1ラウンドごとに{num2}回の追加攻撃が発動します。", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "ラウンドポイント", "", ""], ["CommonText_mMessage_26126", "Destroy", "破壊", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "{name}を破壊しますか？\\n&lt;color=&quot;#fd4540&quot;&gt;破壊された要石は復元できず、アイテムも獲得できません。&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "要石が破壊されました。", "", ""], ["CommonText_mMessage_26129", "Energy:", "エネルギー：", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "諦めて退出", "", ""], ["CommonText_mMessage_26131", "Claim", "受け取る", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "残り要石エネルギー：", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "バトルギャラリー", "", ""], ["CommonText_mMessage_26134", "Guides", "ガイド", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "出現要石：", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "モスクリスタル", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "溶岩クリスタル", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "現在の要石タグのみ表示", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "最も人気のヒーローはヒーローの選択率に基づいて計算されており、参考程度のものになっています。", "", ""], ["CommonText_mMessage_26140", "Search", "検索", "", ""], ["CommonText_mMessage_26141", "Search Results", "検索結果", "", ""], ["CommonText_mMessage_26142", "Loading data...", "データロード中…", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "ヒーローデータ収集", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "少なくとも{num}文字入力してください", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "一致するタグが見つかりませんでした。", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "現在の要石レベルでは、オートバトルを使用できません。", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "ウェーブ{num}を手動でクリアすると、オートバトル記録をアップロードできます。", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "要石のタグが異なるため、オートバトルに失敗する可能性があります。オートバトルを続行しますか？", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "このバトルを新しいオートバトル記録としてアップロードしますか？", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "要石のタグにばらつきがあるため、オートバトルのアップロードには可能な限り包括的な編成を選択することをお勧めします！", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "要石ストレージがいっぱいです。さらに購入する前に要石を使用してください。", "", ""], ["CommonText_mMessage_26152", "Go Clean", "整理する", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "ストレージに未開封のランダム要石チェストが検出されました。今すぐ開きますか？", "", ""], ["CommonText_mMessage_26154", "Go", "Go", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "レベル{num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level&#x27;s Keystone cannot be destroyed.", "このレベルの要石は破壊できません。", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Keystone(s)?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "&lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt;個の要石を破壊しますか？\\n&lt;color=&quot;#fd4540&quot;&gt;この操作は取り消せず、アイテムも獲得できません。&lt;/color&gt;", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "要石を{num}個破壊しました。", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "今月の使用量：", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "要石には毎月チャレンジ制限があります。上限に達すると、それ以上は挑戦できません。", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?\\n&lt;color=&quot;#e04242&quot;&gt;During the event, you can only choose one difficulty per day to claim rewards.&lt;/color&gt;", "現在の難易度に受け取り可能な報酬があります。本当に他の難易度に挑戦しますか？\\n&lt;color=&quot;#e04242&quot;&gt;イベント期間中、1日につき1つのみ難易度を選択して報酬を受け取ることができます。&lt;/color&gt;", "", ""], ["CommonText_mMessage_26162", "Don&#x27;t remind me again.", "再度通知しない", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "要石ストレージがいっぱいです。先に使用してからアンロックしてください。", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "リプレイバージョンが現在のバージョンとマッチングしないため、表示できません。", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "最大{num}文字まで入力できます。", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "人気ヒーロー", "", ""], ["CommonText_mMessage_26167", "Tag", "タグ", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "試練の要石のストレージがいっぱいです", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater&#x27;s Movement Spd. by 30. They are &lt;color=&quot;#fd4540&quot;&gt;immune to Slow&lt;/color&gt;.", "魂喰いの移動速度を30減少させる。魂喰いは&lt;color=&quot;#fd4540&quot;&gt;減速に対して耐性を持つ&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73003", "White Tower&#x27;s Scholar enters &lt;color=&quot;#fd4540&quot;&gt;Invisibility&lt;/color&gt; and becomes visible when blocked.", "ホワイトタワーの学者は&lt;color=&quot;#fd4540&quot;&gt;透明化&lt;/color&gt;し、ブロックされた時に可視化する。", "", ""], ["Difficulty_mDetail_73004", "White Tower&#x27;s Scholar becomes &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "ホワイトタワーの学者は&lt;color=&quot;#fd4540&quot;&gt;魔法ダメージに対して耐性を持つ&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains &lt;color=&quot;#fd4540&quot;&gt;unyielding effect&lt;/color&gt; for 3 sec upon death and becomes &lt;color=&quot;#fd4540&quot;&gt;immune to Control and Slow&lt;/color&gt;.", "スモールアラクニドは死亡時に3秒間&lt;color=&quot;#fd4540&quot;&gt;不屈効果&lt;/color&gt;を得て、&lt;color=&quot;#fd4540&quot;&gt;コントロールと減速に対して耐性を持つ&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 5 sec.", "スモールアラクニドは5秒ごとに&lt;color=&quot;#fd4540&quot;&gt;HPを50%回復する&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "ライトニングガードの&lt;color=&quot;#fd4540&quot;&gt;移動速度が30増加する&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is &lt;color=&quot;#fd4540&quot;&gt;immune to DMG taken&lt;/color&gt;, but loses 5% HP per sec.", "ライトニングガードは&lt;color=&quot;#fd4540&quot;&gt;被ダメージ無効&lt;/color&gt;だが、毎秒HPが5%減少する。", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace&#x27;s Fatigue becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "暗黙の脅威の疲労が&lt;color=&quot;#fd4540&quot;&gt;永久に持続&lt;/color&gt;する。", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is &lt;color=&quot;#fd4540&quot;&gt;immune to CC Effects&lt;/color&gt;.", "プレートコモドが&lt;color=&quot;#fd4540&quot;&gt;コントロール効果に対して免疫を持つ&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction &lt;color=&quot;#fd4540&quot;&gt;when blocked&lt;/color&gt;.", "プレートコモドは&lt;color=&quot;#fd4540&quot;&gt;ブロックされた時&lt;/color&gt;、物理と魔法ダメージ軽減が追加で30%増加する。", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;summons an extra&lt;/color&gt; Ice Vermin.", "フローズンクレリックが&lt;color=&quot;#fd4540&quot;&gt;追加で&lt;/color&gt;アイスヴァーミンを1体召喚する。", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;spawns&lt;/color&gt; 3 Ice Vermin &lt;color=&quot;#fd4540&quot;&gt;upon death&lt;/color&gt;.", "フローズンクレリック&lt;color=&quot;#fd4540&quot;&gt;死亡時&lt;/color&gt;にアイスヴァーミンを3体&lt;color=&quot;#fd4540&quot;&gt;召喚する&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. +50&lt;/color&gt;.", "サンダーガードが攻撃を停止し、&lt;color=&quot;#fd4540&quot;&gt;移動速度が50上昇&lt;/color&gt;する。", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;ATK is increased by 100%&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;when attacking shields&lt;/color&gt;, deducts 50% of its HP.", "サンダーガードの&lt;color=&quot;#fd4540&quot;&gt;攻撃力が100%増加する&lt;/color&gt;が、&lt;color=&quot;#fd4540&quot;&gt;シールドを攻撃すると&lt;/color&gt;、HPが50%減少する。", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "フォグボーン・デッドアイは&lt;color=&quot;#fd4540&quot;&gt;魔法ダメージに対して免疫を持つ&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores &lt;color=&quot;#fd4540&quot;&gt;10% HP&lt;/color&gt; with each ATK.", "ミスト：セイラム男爵が攻撃するたび、&lt;color=&quot;#fd4540&quot;&gt;HPを10%&lt;/color&gt;回復する。", "", ""], ["Difficulty_mDetail_73018", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;Cooldown is reduced by 100%&lt;/color&gt;.", "インキュベーターの加速した孵化の&lt;color=&quot;#fd4540&quot;&gt;クールダウンが100%減少する&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73019", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;spawns 2 extra Suicides&lt;/color&gt;.", "インキュベーターの加速した孵化が&lt;color=&quot;#fd4540&quot;&gt;追加でスーサイドを2体生成する&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;drains 10% of the target&#x27;s Rage&lt;/color&gt;.", "対象にダメージを与えると、雷の司祭が&lt;color=&quot;#fd4540&quot;&gt;対象のレイジを10%吸収する&lt;/color&gt;。", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;permanently reduces their Max HP by 10%&lt;/color&gt;. This effect can be stacked.", "雷の司祭が対象にダメージを与えると、&lt;color=&quot;#fd4540&quot;&gt;対象の最大HPを永続的に10%減少させる&lt;/color&gt;。この効果はスタックする。", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces &lt;color=&quot;#fd4540&quot;&gt;healing&lt;/color&gt; received by &lt;color=&quot;#fd4540&quot;&gt;all units in range&lt;/color&gt; by 50%.", "スコージは&lt;color=&quot;#fd4540&quot;&gt;範囲内のすべてのユニット&lt;/color&gt;の被&lt;color=&quot;#fd4540&quot;&gt;回復量&lt;/color&gt;を50%減少させる。", "", ""], ["Difficulty_mDetail_73023", "Scourge&#x27;s DMG range expands to &lt;color=&quot;#fd4540&quot;&gt;adjacent 2 tiles&lt;/color&gt;.", "スコージのダメージ範囲が&lt;color=&quot;#fd4540&quot;&gt;隣接する2タイル&lt;/color&gt;に拡大する。", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to &lt;color=&quot;#fd4540&quot;&gt;blocked targets&lt;/color&gt;.", "ミスト：スーペリア・アビスビホルダーが倒れた時、&lt;color=&quot;#fd4540&quot;&gt;ブロックした対象&lt;/color&gt;に攻撃力の100%の魔法ダメージを与える。", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes &lt;color=&quot;#fd4540&quot;&gt;unblockable&lt;/color&gt;.", "狂暴なミュータントローデントが&lt;color=&quot;#fd4540&quot;&gt;ブロック不可&lt;/color&gt;になる。", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent &lt;color=&quot;#fd4540&quot;&gt;increases Movement Spd. by 30&lt;/color&gt;.", "狂暴なミュータントローデントの&lt;color=&quot;#fd4540&quot;&gt;移動速度が30上昇&lt;/color&gt;する。", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "セイラム男爵はHPを20%失うごとに、&lt;color=&quot;#fd4540&quot;&gt;防御力と魔法耐性を20%獲得&lt;/color&gt;する。", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "シャドーキャスターの&lt;color=&quot;#fd4540&quot;&gt;移動速度が30上昇&lt;/color&gt;する。", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "シャドーキャスターはHPを20%失うごとに、&lt;color=&quot;#fd4540&quot;&gt;防御力と魔法耐性が20%増加&lt;/color&gt;する。", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers&#x27; DEF and M. RES. by 30%. &lt;color=&quot;#fd4540&quot;&gt;When under CC Effects, reduces by 50%&lt;/color&gt;.", "コモンデストロイヤーの防御力と魔法耐性を30%増加させる。&lt;color=&quot;#fd4540&quot;&gt;コントロール効果下では50%減少&lt;/color&gt;する。", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when &lt;color=&quot;#fd4540&quot;&gt;stunned or frozen&lt;/color&gt;.", "コモンデストロイヤーは、&lt;color=&quot;#fd4540&quot;&gt;スタンまたは凍結している間&lt;/color&gt;、ダメージを受けない。", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an &lt;color=&quot;#fd4540&quot;&gt;initial Hitcount Shield&lt;/color&gt;.", "アンコモンデストロイヤーは、&lt;color=&quot;#fd4540&quot;&gt;初期ヒット数シールド&lt;/color&gt;を獲得する。", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer &lt;color=&quot;#fd4540&quot;&gt;gains 5 Movement Spd. each time taking DMG&lt;/color&gt;. にバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "ジャイアントゴーレムはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "スケルトンアーチャーはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "雨の巫女はウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "金色の守護者はウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "金律の審問官はウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "スーサイドはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "サンドテイカーはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "ヒーリングフライはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "ツイステッドサイコファントはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero&#x27;s DMG by 10% for 8 sec, stacking up to 5 times.", "（3部位）通常攻撃がクリティカルヒットすると、このヒーローのダメージが8秒間10%増加する。最大5スタック。", "", ""], ["HeroStory_mStory_2209", "&quot;She walks like a memory I have not earned, yet always long for.&quot;\\n-Rivenhald\\n\\nThey sent her north, where the snows upon her brow might bend her once more to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "「彼女は、まだ手にしたことのない、けれど永遠に恋い焦がれる記憶のように歩く。」\\n―リヴェンハルド\\n\\n彼女は北方の地へ送られた。 眉に積もる雪が、再び彼女を自分たちの味方に戻せることを願って。 \\n\\nかつてエリンディスの神殿で祈りを捧げ、古の儀式の中心に立っていた巫女、エイリスは、その声で神々の息吹と共鳴していた。しかし、ある日、口にすることが許されない決断をしたことにより、神殿に許されることはなかった。\\n\\nエルフの都市は、モリデンの襲撃後、数か月もの間傷を癒していた。戦の波は退けられたものの、都市には深い傷跡が残った。そして恐ろしい事実を思い知らされる。もはや、かつてのように安全な存在ではないということを。 塔はひび割れ、神話は血に染まった。エリンディスは、公には動けない場所で任務を果たせる影の存在を求めた。予見者たちは密かに視線を外へ向け、古き地図にも記されぬ地を探し始める。それは、戦の再来に備え、彼らが身を隠せる場所を見つけるために。\\n\\n荒れ果てた寒冷地、ティアの北方が、雪から突き出る刃のように予見者たちの視に映った。ハルツのことは知っていたが、その名声を持つ者との争いを避けたかった。一方でリヴェンハルドは、エリンディスの偵察部隊も知らぬ極寒の地を支配していた。彼は肩書こそ持たぬが戦王のような存在であり、ただ己の冠だけに従う君主だった。その力を操れるのか、彼を事前に知る必要があった。あるいは、必要とあらばどれほど容易く打ち砕けるのか。\\n\\nエイリスこそが彼らの答えだった。味方もなく、外交官でも諜報員でもない、もっと静かな存在。彼女は真実のすべては告げられぬまま、ただ神への誓いだけを与えられ、送り出された。「彼の信頼を得よ。魂を読み取れ。遠くからでは見えぬものを報告せよ。」と。白い衣に身を包み、その存在は和平のためと説明された。放浪する癒し手。氷の巫女。 そして誰も信じぬリヴェンハルドが、彼女を信じた。\\n\\n彼女は己を有用な存在とした。傷を癒し、兆しを読み解き、裏の目的を悟られる痕跡は一切残さなかった。彼は彼女を見つめ、彼女もまた彼を見つめ返した。互いに視線を逸らさず、沈黙のまま探り合った。\\n\\n時間と共に、二人の境界は次第に曖昧になった。絡み合いながらも、互いへの距離は完全には崩れない。彼女は彼の沈黙の意味を知り、怒りの形を理解し、その奥に隠された奇妙な慈悲を見つけた。夜では、焚き火が弱く燃える中、誰もいない一人の時、彼女は時折、ほんの少し信頼できるかもしれない未来、彼が自分にとって特別な存在になるかもしれない未来を思い描いた。しかし朝の光は、いつもその夢を焼き尽くしてしまった。\\n\\nリヴェンハルドと同じように、彼女もまた結末の夢を見る。吹雪の中に立つ二つの影、揺るがず、譲らず。一つの刃が落ち、一つの大義が消える。 血煙が風に流される前に、二人は生き残る代償と、互いが本当は何者であるかを知るだろう。\\n\\nしかし、エイリスは知っていた。エリンディスの予見者たちが決して告げなかったこと。北の地は誰のものでもない。王のものでも、都市のものでも、ましてや自分のような幽霊のものでもない。二人を待つ未来が何であれ、それは信頼の上に築かれるのではなく、すべてが失われた後に残るものの上に築かれるだろう。\\n\\n彼女は二つの嵐の間にある沈黙そのものであり、どちらかが他を打ち破る時を静かに待っている。", "", ""], ["HeroStory_mStory_2321", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "「あなたはいずれ食らわれたいと自ら願うでしょう……そのときは、ほんの少しだけ情けをかけてあげる。」\\n—木陰から響く嘶き\\n\\nティアの翡翠の密林で、根が血を啜り、木々が生きとし生けるものを絞め殺すその地に、かつて毒と影の精霊が蠢いていた。シスラとしか呼ばれぬ蛇であったが、当時の彼女にはまだ肉体がなかった。ただ牙と、飢えと、名前の記憶があるだけだった。\\n\\n黒曜石の都市が天蓋を分かち、谷間を隔てていた古代文明スケイルキン帝国は、とうの昔に緑豊かな広がりの中に姿を消していた。しかし、最期の時に彼らは最後の魔力を聳え立つ偶像に注ぎ込んだ。力ある生物を刻んだ石像に献身を込めて彫り、赤土と灰で彩色し、密林の精霊への供物として残したのだ。自分たちの嘆願が聞き届けられることを願って。\\n\\nだが、そこにあったのは沈黙だけだった。\\n\\n都市が崩れ落ち、葉群れのオンスロートに飲み込まれる中、これらの偶像だけは苔に覆われ、半ば朽ちながらも、安らぎなき残響と共に生き続けた。実際、これらの小像の内部には精霊が宿っていた。密林の精霊への贈り物として捧げられた生者の魂が、スケイルキンの魔術によって封じ込められていたのだ。この緑の迷宮をさまよう不運で無知な放浪者たちが、そうした小像に出くわすと即座に命を落とした。それらは実際、強力なディエティを召喚できる生贄の祭壇だったからだ。シスラもそうしたディエティの一柱、蛇の女神であり、古き帝国の名残であり、意志薄弱で傷ついた者の心に響く嘶きだった。\\n\\nそれでも彼女は精霊のままだった—ダッソーミが彼女を見つけるまでは。\\n\\n名高いスケイルキンの神秘主義者は長らく、夢こそがより大いなる真理への橋だと信じていた。世界の忘れられた片隅で失われたウィズダムを求め、ダッソーミは蛇と祭壇の幻視に導かれて密林にやって来た。半ば記憶された深い夢のように、蔦に覆われた神殿に引き寄せられたのだ。その廃墟の中心で、彼は香を焚き、世界の間を滑り抜けた—そしてシスラが応えた。\\n\\nしかし、二人の間に何が起こったかの記録は残されていない。ダッソーミが自らを捧げたのか、それとも単に扉を開きすぎたのか、結果は同じだった。シスラは無形の状態を脱ぎ捨て、この世に再生したのだ。毒蛇の抱擁は再び動き出したのだ。\\n\\n密林の掟に従い、シスラは優越を主張する者すべてを狩る—正義の者、清純な者、不屈の者を。彼女は神殿や宮殿に忍び込み、最後の選択を迫る。従うか、喰われるか。シスラは自らの蛇の王朝が再び立ち上がることを望んでいる。牙を持ち栄光に満ち、密林と骨で戴冠した王朝を。蔦と毒に血管を巡らされた城塞を、その上を歩く者すべてが弱さを脱ぎ捨て、彼女の毒を深く飲み、苦痛の中で美しく生まれ変わった世界を夢見ている。\\n\\n今日でもシスラは崇拝されているが、その教団は散らばり秘密に包まれ、ダッソーミ自身が率いているとも言われる。彼らは自らを牙で印し、舌に毒を滴らせ、苦痛を通じた恍惚を夢見て、崇拝を神聖なものとする。彼らは餌食に選ばれることを祈る—選ばれることは見られること、狩られること、愛されることだからだ。蛇に口づけされることは、魂に力が巻きつくのを感じること—皮のように弱さを脱ぎ捨て、新たに生まれ変わることなのだ。彼女の噛みつきを生き延びた者は、彼女の女狩人となる。死をもたらし、美しく、そして完全に献身的な存在に。\\n\\nそして呼吸と噛みつきの間の神聖なる瞬間に、矢が心臓の真上に留まる時、彼らは皆同じことを囁くのだ。\\n「ありがとう。」", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "雪のヴェール", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "最も甘美な毒", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "ヒーロー：アイリス", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "ヒーロー：シスラ", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "イベントに参加する限定ヒーローを1体選択。選択した限定ヒーローは排出率が上昇し、200回以内の召喚で必ず獲得できる！", "", ""], ["Item_mItemDesc_31097", "&lt;color=&quot;#eadca2&quot;&gt;Special Summon Offer&lt;/color&gt;\\n\\nGet the necessary materials for Hero Summon", "&lt;color=&quot;#eadca2&quot;&gt;スペシャル召喚オファー&lt;/color&gt;\\n\\nヒーロー召喚に必要な素材を獲得", "", ""], ["Item_mItemDesc_3334", "&lt;color=&quot;#498a40&quot;&gt;Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).&lt;/color&gt;", "&lt;color=&quot;#498a40&quot;&gt;ヒーローの降臨アルティメットリーダーボード（サーペントボーンシーズン）の限定アバターフレーム。&lt;/color&gt;", "", ""], ["Item_mItemDesc_3519", "Unknown Clue o ne-Tailed Fox transforms and summons a large number of foxes.", "九尾の狐が致命的なダメージを受けると、彼女は戦場から逃げて、フィールド上の尻尾を起動して攻撃する。尻尾が倒されると、九尾の狐はバトルフィールドに戻ってくる。フィールド上のすべての尻尾が倒された後、九尾の狐は変身し、大量の狐を召喚する。", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "バトルフィールドで最後に配置されたユニットに魔法ダメージを与える。ディフェンダーを優先する。", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "バトルフィールドで最後に配置されたユニットに魔法ダメージを与える。ディフェンダーを優先する。", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally within the Basic ATK Range and immediately grants this ally a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; of their Max HP for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec. The effect can only be triggered 1 time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "通常攻撃範囲内の味方&lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt;体が受ける致命的なダメージを1回免れ、即座に&lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt;秒間、最大HPの&lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;のシールドを獲得する。この効果は&lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt;秒毎に1回だけ発動できる。", "", ""], ["Skill_mSkillDesc_219001_1", "Deals &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG to up to &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; enemies.", "最大&lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt;体の敵に&lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;のダメージを与える。", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, and gains &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Grants allies of the same faction Elddr&#x27;s Talent temporarily. The Ultimate lasts for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "攻撃力が&lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;増加し、&lt;color=&quot;#28d37c&quot;&gt;[321900 on a rampage, these Mutant Rodents. &lt;color=#ff4500&gt;Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.&lt;/color&gt;", "突然変異を起こし、暴走状態となったミュータントローデント。&lt;color=#ff4500&gt;攻撃を受けると狂乱状態に陥り、移動速度が上昇する。&lt;/color&gt;", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "巨大な斧を持つスケルトンの戦士。恨みの力で重い攻撃を繰り出す。", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "蜘蛛の女王は糸を吐くことや、蜘蛛の子を生み出して操ったりすることができる。", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "巨大なメイスで行く手にあるものを容赦なく屠る。", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "ダンジョンを徘徊する狂気の戦士。人々の首を斬ることを楽しんでいる。", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "巨大なメイスで行く手にあるものを容赦なく屠る。", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "巨大な骨のハサミを操る、冷酷無比な人喰いの守護者。敵を容赦なく切り裂き、血しぶきを舞い起こす。", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "巨大な骨のハサミを操る、冷酷無比な人喰いの守護者。敵を容赦なく切り裂き、血しぶきを舞い起こす。", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "ブロックも減速も効かない幽霊の残存物。速やかに排除せねばならない。", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "バトルで戦死した兵士が変化したもの。", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "酸で満たされた袋を持つ。スーサイドは丸まって前に転がる習性がある。", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "突然変異を起こし、暴走状態となったミュータントローデント。攻撃を受けると移動速度が上昇する。", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "巨大な斧を持つスケルトンの戦士。恨みの力で重い攻撃を繰り出す。", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "地底に住んでいる彼女は、蜘蛛を生み出して操り、戦闘中は全ての蜘蛛のあらゆるステータスを高めることができる。その様は正に女王だ。その糸は非常に丈夫で、一度閉じ込められると簡単に抜け出すことはできない。", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "追放されたエルフの女司祭アイリス。祈りで重傷を癒やし、デバフを解除、瀕死の仲間を救い、チームのレイジ回復を加速させる。", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "旧世界の残滓、毒蛇の抱擁シスラはジャングルをさまよう。苦悶の魂を召喚し、攻撃の凶暴さを増しながら防御を無視して敵を喰らう。", "", ""], ["Unit_mHeroDesignation_2209", "Winter&#x27;s Mercy", "氷雪の泉", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent&#x27;s Embrace", "毒蛇の抱擁", "", ""], ["Unit_mName_17200", "Knight of Destruction", "破壊の騎士", "", ""], ["Unit_mName_17218", "Fallen Chopper", "フォーレンチョッパー", "", ""], ["Unit_mName_17219", "Slaughter", "スローター", "", ""], ["Unit_mName_17221", "Maw", "マウ", "", ""], ["Unit_mName_17222", "Maw", "マウ", "", ""], ["Unit_mName_2209", "Eirlys", "アイリス", "", ""], ["Unit_mName_2321", "Sythra", "シスラ", "", ""], ["Unit_mName_34100", "Soul Eater", "魂喰い", "", ""], ["Unit_mName_34103", "Suicide", "スーサイド", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "スケルトンエクセキューショナー", "", ""], ["Unit_mName_37114", "Queen Spider", "蜘蛛の女王", "", ""], ["Unit_mName_37115", "Spider Cocoon", "蜘蛛の繭", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "私のそばにいなさい。私があなたを守るわ。", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "教えて……欲しくてたまらないくせに、怖いのかしら？", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "フレンジーレイダーの特別イベント期間中は、通常の2倍のスタミナを消費することで、2倍の報酬が得られるオートバトルを実行できます。いつもより効率的なバトルを実現しましょう！\n\nオートバトルボーナス\n1. イベント期間中、{name2}でオートバトルを行う際、コマンダーはイベントボーナスを有効にするかどうかを選択できます。有効にした場合、通常の{num3}倍のスタミナを消費し、{num3}倍の報酬を獲得できます。これは素材の獲得効率を向上させることを目的としています。\n2. 挑戦が失敗した場合、消費したスタミナは返還されます。\n3. イベント期間中、イベントボーナスを有効にしている場合、スタミナ消費に関連するクエストは実際に消費されたスタミナに基づいて計算されます。\n4. ただし、クリア回数に関連するクエストはイベントボーナスの影響を受けません。\n5. イベントボーナスはオートバトルが可能なステージにのみ適用されるため、初回クリア報酬はボーナスの対象外となります。\n6. ボーナスが有効な場合、報酬は1回分の結果を単純に2倍にするのではなく、それぞれ個別に計算されて生成されます。\n7. 勇者の旅イベントにおいて、装備/アーティファクト素材レイドのオラクルトライアルのスコアは装備/メテオライトのドロップと同様に、ステージクリア後に獲得した装備/メテオライトのレアリティと数量に基づいて計算されます。\n8. ご注意ください：ボーナス適用中でも、ステージでランダムにドロップするイベントトークン（夢のオデッセイのサイコロなど）はボーナスの影響を受けません。", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "フレンジーレイダーがアーティファクト素材レイドに登場しました。イベント中、オートバトルのコストが2倍になり、報酬も2回得られます。", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "期間限定でレジェンドヒーロー【ヌーメラ】＆【アイリン】の確率アップ！", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "期間限定でレジェンドヒーロー【ヴォーン】＆【アルテミス】の確率アップ！", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "期間限定でレジェンドヒーロー【ニクス】＆【マルヴィラ】の確率アップ！", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "ドリームサーペントスキンバンドル", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "&quot;Tya&#x27;s Champion&quot; Valkyra", "「ティアの勇者」ヴァルキラ", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "&quot;The Hollow Husk&quot; Aracha", "「虚ろな抜け殻」アラチャ", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "シスラのスキンバンドル", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "ヒーローゲームプレイ：アイリス", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "ヒーローゲームプレイ：シスラ", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;この神聖召喚イベントでは、&lt;color=#fdbe36&gt;全レジェンドヒーロー&lt;/color&gt;の出現確率が元の確率の&lt;color=#b490fc&gt;2&lt;/color&gt;倍になり、さらに以下のヒーローの出現確率が同レアリティの他のヒーローと比べて&lt;color=#b490fc&gt;20&lt;/color&gt;倍になります。同レアリティの他のヒーローの出現確率は均等です。&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;このイベント召喚では、確率アップ対象外のレジェンドヒーローを獲得した場合、次の召喚からさらに確率アップ対象ヒーローの出現確率*が上昇します。&lt;/color&gt;詳細は以下の通りです：\n1．確率アップ対象外のレジェンドヒーローを初めて獲得すると、以降の召喚で確率アップ対象ヒーローの出現確率*が&lt;color=#b490fc&gt;10&lt;/color&gt;倍上昇します。\n2．さらに確率アップ対象外のレジェンドヒーローを獲得すると、確率アップ対象ヒーローの出現確率*が再び&lt;color=#b490fc&gt;10&lt;/color&gt;倍上昇します。この確率上昇は確率アップ対象ヒーローを獲得するまで継続します。\n&lt;color=#91887c&gt;*ここでの出現確率とは、他のヒーローと比較した確率アップ対象ヒーローの相対的な確率を指します。&lt;/color&gt;\n\n&lt;color=#df161f&gt;注意：この確定保護は本イベント中1回のみ発動します。&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "回復効果+<span style=\"color: #1e8852;\">8</span>", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "レイジ自然回復+<span style=\"color: #1e8852;\">1</span>", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -<span style=\"color: #1e8852;\">2</span>", "コスト-<span style=\"color: #1e8852;\">2</span>", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +<span style=\"color: #1e8852;\">300</span>", "攻撃力が<span style=\"color: #1e8852;\">300</span>増加する。", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "貫通が<span style=\"color: #1e8852;\">8%</span>増加する。", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "かすかな光でさえ、闇を払いのける。", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "光は、私たちが勇気を持って育てる場所でこそ芽吹く。", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "地に嵐が迫ろうとも、私は信じることを選ぶわ。予言が何だというの？真実は、自らの内にあるものよ。", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "予言が何だというの？真実は、自らの内にあるものよ。", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "すべては、光の御前に明らかになる。", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "この牙……だんだん研ぎ澄まされてきたわね。", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "脱皮するたびに、私は「より強く、より美しく」なるのよ。", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "ひれ伏しなさい、哀れな下郎……私こそ、神をも超える存在よ。", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "私の毒に、解毒剤なんて存在しないのよ。", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent's will!", "混沌も秩序も、存在しない……あるのはただ、蛇の意志だけよ！", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "ダメージ増加", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "静寂の息吹", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "治癒の祈り", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "苦悶する魂", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "ダメージ+{20,num/100}%（同じステータスの既存のバフ/デバフより効果が高い場合のみ有効。）", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "毎秒、自身の攻撃力の{30,num}%分のシールドを獲得し、最大で攻撃力の{31,num}%分までスタックする。", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "2秒ごとにデバフを1つ解除する。アイリスが静寂の息吹で味方を回復すると、追加で{30,num}%の回復効果ボーナスを得る。静寂の息吹の効果を受けられる味方は最大2体まで。", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "保有者のHPが{30,num}%未満になると、即座に保有者の攻撃力{31,num}%分のHPを回復し、この効果は解除される。効果時間が自然に終了、または更新されたとき、保有者のHPを発動者の攻撃力{32,num}%分回復する。この効果は解除不可。", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "飛行ユニットを含む前方の最大{31,num}体の敵に1回、範囲魔法ダメージを与える。さらに、マイティスラストが敵に{32,num}%の脆弱（魔法ダメージ）増加を{33,num}秒間付与する。", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "炎槍は敵の防御力を{30,num}%無視する。ユニバースリングは追加で{31,num}回跳ね返り、同じ対象に複数回命中できる。陰陽剣はHPが{32,num}%未満の通常モンスターを処刑する。", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "所有者の攻撃範囲内の敵1体を高速で射撃し、初期は{30,num}回射撃でき、毎回{31,num}%のダメージを与える。すべての射撃を使い切ると、苦悶する魂は消滅する。空中の敵を優先して狙う。矢が撃破済みの対象に命中するたびに、射撃回数を1回分回復する。フィールド上に最大{32,num}体まで存在可能。", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "装備レイドIに参加してトロフィーを獲得し、報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "装備レイドIIに参加してトロフィーを獲得し、報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "装備レイドIIIに参加してトロフィーを獲得し、報酬と交換しましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "ヒーローを召喚してトロフィーを獲得し、ランダムな報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "ヒーローをレベルアップ、スターアップ、昇格、またはヒーロースキルをアップグレードさせてトロフィーを獲得し、報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "アーティファクト素材レイドに参加してトロフィーを獲得し、報酬を引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "装備レイドIに参加してトロフィーを獲得し、報酬と引き換えましょう。", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "ヒーローの降臨アルティメットリーダーボード", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "失われし遺産", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "砂の宝物庫", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "失われた場所", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "ヒーローの降臨", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "ヒーロートレーニング", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "アーティファクトの謎", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "失われし遺産", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "ストーリーチャプター", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "チャレンジチャプター", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "パブリックドメインIP", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "ゾンビ侵攻", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "チャンネル切り替え中...", "", ""], ["CommonText_mMessage_24292", "Challenges", "チャレンジ", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">試練の要石</span><br>試練の要石は様々なゲームモードから入手できる。これらの要石にはそれぞれ異なる種類とレベルがあり、固有の古代の刻印が含まれている。祭壇に挿入すると、対応する試練への道が開かれる。<br><br><span style=\"color: #cec2b1;\">チャレンジルール</span><br>各バトルは複数のモンスターウェーブで構成される。各ウェーブを倒すとチェストが報酬として得られる。バトル開始後は再開できない。途中で退出した場合、現在のバトル進行状況に基づいて報酬が決済される。試練チャレンジでは月に最大200個の要石を消費できる。この上限に達すると、その月はそれ以上チャレンジを行うことができない。<br><br><span style=\"color: #cec2b1;\">要石エネルギー</span><br>各要石は特定のエネルギーを持っている。<span style=\"color: #fdbe36;\">試練1回の挑戦につき1エネルギーが消費される。</span>バトル終了時に要石にエネルギーが残っている場合、報酬を放棄して退出し、再度エネルギーを消費して試練を再開することができる。エネルギー消費は月間要石制限にカウントされない。<br><br><span style=\"color: #cec2b1;\">要石破壊</span><br>破壊レベル要件を満たす要石を破壊できる。要石を破壊しても報酬は得られず、月間要石消費制限にもカウントされない。<br><span style=\"color: #fd4540;\">試練の要石にはストレージ制限がある。満杯になると、これ以上要石を入手できなくなる。スペースを確保するため定期的に使用してください。</span>", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "モスクリスタル", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "溶岩クリスタル", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "バトル開始後は再スタートできません。途中で退出すると即座に精算が行われ、消費されたエネルギーは返還されません！", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "アポカリプス時に溶岩がサージする火山地域。アポカリプスの邪悪な勢力を撃退するため、より多くのプラットフォームヒーローが必要とされている。", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">このプレイヤーを司令官のポジションから解雇しますか？</span><br>各ギルドごとに最大{num1}名の司令官を任命でき、1名につき1ラウンドごとに{num2}回の追加攻撃が発動します。", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "ラウンドポイント", "", ""], ["CommonText_mMessage_26126", "Destroy", "破壊", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "{name}を破壊しますか？<br><span style=\"color: #fd4540;\">破壊された要石は復元できず、アイテムも獲得できません。</span>", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "要石が破壊されました。", "", ""], ["CommonText_mMessage_26129", "Energy:", "エネルギー：", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "諦めて退出", "", ""], ["CommonText_mMessage_26131", "Claim", "受け取る", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "残り要石エネルギー：", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "バトルギャラリー", "", ""], ["CommonText_mMessage_26134", "Guides", "ガイド", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "出現要石：", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "モスクリスタル", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "溶岩クリスタル", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "現在の要石タグのみ表示", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "最も人気のヒーローはヒーローの選択率に基づいて計算されており、参考程度のものになっています。", "", ""], ["CommonText_mMessage_26140", "Search", "検索", "", ""], ["CommonText_mMessage_26141", "Search Results", "検索結果", "", ""], ["CommonText_mMessage_26142", "Loading data...", "データロード中…", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "ヒーローデータ収集", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "少なくとも{num}文字入力してください", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "一致するタグが見つかりませんでした。", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "現在の要石レベルでは、オートバトルを使用できません。", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "ウェーブ{num}を手動でクリアすると、オートバトル記録をアップロードできます。", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "要石のタグが異なるため、オートバトルに失敗する可能性があります。オートバトルを続行しますか？", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "このバトルを新しいオートバトル記録としてアップロードしますか？", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "要石のタグにばらつきがあるため、オートバトルのアップロードには可能な限り包括的な編成を選択することをお勧めします！", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "要石ストレージがいっぱいです。さらに購入する前に要石を使用してください。", "", ""], ["CommonText_mMessage_26152", "Go Clean", "整理する", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "ストレージに未開封のランダム要石チェストが検出されました。今すぐ開きますか？", "", ""], ["CommonText_mMessage_26154", "Go", "Go", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "レベル{num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level's Keystone cannot be destroyed.", "このレベルの要石は破壊できません。", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "<span style=\"color: #fd4540;\">{num}</span>個の要石を破壊しますか？<br><span style=\"color: #fd4540;\">この操作は取り消せず、アイテムも獲得できません。</span>", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "要石を{num}個破壊しました。", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "今月の使用量：", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "要石には毎月チャレンジ制限があります。上限に達すると、それ以上は挑戦できません。", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "現在の難易度に受け取り可能な報酬があります。本当に他の難易度に挑戦しますか？<br><span style=\"color: #e04242;\">イベント期間中、1日につき1つのみ難易度を選択して報酬を受け取ることができます。</span>", "", ""], ["CommonText_mMessage_26162", "Don't remind me again.", "再度通知しない", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "要石ストレージがいっぱいです。先に使用してからアンロックしてください。", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "リプレイバージョンが現在のバージョンとマッチングしないため、表示できません。", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "最大{num}文字まで入力できます。", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "人気ヒーロー", "", ""], ["CommonText_mMessage_26167", "Tag", "タグ", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "試練の要石のストレージがいっぱいです", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "魂喰いの移動速度を30減少させる。魂喰いは<span style=\"color: #fd4540;\">減速に対して耐性を持つ</span>。", "", ""], ["Difficulty_mDetail_73003", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "ホワイトタワーの学者は<span style=\"color: #fd4540;\">透明化</span>し、ブロックされた時に可視化する。", "", ""], ["Difficulty_mDetail_73004", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "ホワイトタワーの学者は<span style=\"color: #fd4540;\">魔法ダメージに対して耐性を持つ</span>。", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "スモールアラクニドは死亡時に3秒間<span style=\"color: #fd4540;\">不屈効果</span>を得て、<span style=\"color: #fd4540;\">コントロールと減速に対して耐性を持つ</span>。", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "スモールアラクニドは5秒ごとに<span style=\"color: #fd4540;\">HPを50%回復する</span>。", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "ライトニングガードの<span style=\"color: #fd4540;\">移動速度が30増加する</span>。", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is <span style=\"color: #fd4540;\">immune to DMG taken</span>, but loses 5% HP per sec.", "ライトニングガードは<span style=\"color: #fd4540;\">被ダメージ無効</span>だが、毎秒HPが5%減少する。", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace's Fatigue becomes <span style=\"color: #fd4540;\">permanent</span>.", "暗黙の脅威の疲労が<span style=\"color: #fd4540;\">永久に持続</span>する。", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is <span style=\"color: #fd4540;\">immune to CC Effects</span>.", "プレートコモドが<span style=\"color: #fd4540;\">コントロール効果に対して免疫を持つ</span>。", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction <span style=\"color: #fd4540;\">when blocked</span>.", "プレートコモドは<span style=\"color: #fd4540;\">ブロックされた時</span>、物理と魔法ダメージ軽減が追加で30%増加する。", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric <span style=\"color: #fd4540;\">summons an extra</span> Ice Vermin.", "フローズンクレリックが<span style=\"color: #fd4540;\">追加で</span>アイスヴァーミンを1体召喚する。", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric <span style=\"color: #fd4540;\">spawns</span> 3 Ice Vermin <span style=\"color: #fd4540;\">upon death</span>.", "フローズンクレリック<span style=\"color: #fd4540;\">死亡時</span>にアイスヴァーミンを3体<span style=\"color: #fd4540;\">召喚する</span>。", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains <span style=\"color: #fd4540;\">Movement Spd. +50</span>.", "サンダーガードが攻撃を停止し、<span style=\"color: #fd4540;\">移動速度が50上昇</span>する。", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard's <span style=\"color: #fd4540;\">ATK is increased by 100%</span>, but <span style=\"color: #fd4540;\">when attacking shields</span>, deducts 50% of its HP.", "サンダーガードの<span style=\"color: #fd4540;\">攻撃力が100%増加する</span>が、<span style=\"color: #fd4540;\">シールドを攻撃すると</span>、HPが50%減少する。", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "フォグボーン・デッドアイは<span style=\"color: #fd4540;\">魔法ダメージに対して免疫を持つ</span>。", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores <span style=\"color: #fd4540;\">10% HP</span> with each ATK.", "ミスト：セイラム男爵が攻撃するたび、<span style=\"color: #fd4540;\">HPを10%</span>回復する。", "", ""], ["Difficulty_mDetail_73018", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">Cooldown is reduced by 100%</span>.", "インキュベーターの加速した孵化の<span style=\"color: #fd4540;\">クールダウンが100%減少する</span>。", "", ""], ["Difficulty_mDetail_73019", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">spawns 2 extra Suicides</span>.", "インキュベーターの加速した孵化が<span style=\"color: #fd4540;\">追加でスーサイドを2体生成する</span>。", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">drains 10% of the

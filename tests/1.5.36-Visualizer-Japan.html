イドはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "サンドテイカーはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "ヒーリングフライはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "ツイステッドサイコファントはウェーブごとにバトルフィールドのランダムな位置に出現する。", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "（3部位）通常攻撃がクリティカルヒットすると、このヒーローのダメージが8秒間10%増加する。最大5スタック。", "", ""], ["HeroStory_mStory_2209", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "「彼女は、まだ手にしたことのない、けれど永遠に恋い焦がれる記憶のように歩く。」<br>―リヴェンハルド<br><br>彼女は北方の地へ送られた。 眉に積もる雪が、再び彼女を自分たちの味方に戻せることを願って。 <br><br>かつてエリンディスの神殿で祈りを捧げ、古の儀式の中心に立っていた巫女、エイリスは、その声で神々の息吹と共鳴していた。しかし、ある日、口にすることが許されない決断をしたことにより、神殿に許されることはなかった。<br><br>エルフの都市は、モリデンの襲撃後、数か月もの間傷を癒していた。戦の波は退けられたものの、都市には深い傷跡が残った。そして恐ろしい事実を思い知らされる。もはや、かつてのように安全な存在ではないということを。 塔はひび割れ、神話は血に染まった。エリンディスは、公には動けない場所で任務を果たせる影の存在を求めた。予見者たちは密かに視線を外へ向け、古き地図にも記されぬ地を探し始める。それは、戦の再来に備え、彼らが身を隠せる場所を見つけるために。<br><br>荒れ果てた寒冷地、ティアの北方が、雪から突き出る刃のように予見者たちの視に映った。ハルツのことは知っていたが、その名声を持つ者との争いを避けたかった。一方でリヴェンハルドは、エリンディスの偵察部隊も知らぬ極寒の地を支配していた。彼は肩書こそ持たぬが戦王のような存在であり、ただ己の冠だけに従う君主だった。その力を操れるのか、彼を事前に知る必要があった。あるいは、必要とあらばどれほど容易く打ち砕けるのか。<br><br>エイリスこそが彼らの答えだった。味方もなく、外交官でも諜報員でもない、もっと静かな存在。彼女は真実のすべては告げられぬまま、ただ神への誓いだけを与えられ、送り出された。「彼の信頼を得よ。魂を読み取れ。遠くからでは見えぬものを報告せよ。」と。白い衣に身を包み、その存在は和平のためと説明された。放浪する癒し手。氷の巫女。 そして誰も信じぬリヴェンハルドが、彼女を信じた。<br><br>彼女は己を有用な存在とした。傷を癒し、兆しを読み解き、裏の目的を悟られる痕跡は一切残さなかった。彼は彼女を見つめ、彼女もまた彼を見つめ返した。互いに視線を逸らさず、沈黙のまま探り合った。<br><br>時間と共に、二人の境界は次第に曖昧になった。絡み合いながらも、互いへの距離は完全には崩れない。彼女は彼の沈黙の意味を知り、怒りの形を理解し、その奥に隠された奇妙な慈悲を見つけた。夜では、焚き火が弱く燃える中、誰もいない一人の時、彼女は時折、ほんの少し信頼できるかもしれない未来、彼が自分にとって特別な存在になるかもしれない未来を思い描いた。しかし朝の光は、いつもその夢を焼き尽くしてしまった。<br><br>リヴェンハルドと同じように、彼女もまた結末の夢を見る。吹雪の中に立つ二つの影、揺るがず、譲らず。一つの刃が落ち、一つの大義が消える。 血煙が風に流される前に、二人は生き残る代償と、互いが本当は何者であるかを知るだろう。<br><br>しかし、エイリスは知っていた。エリンディスの予見者たちが決して告げなかったこと。北の地は誰のものでもない。王のものでも、都市のものでも、ましてや自分のような幽霊のものでもない。二人を待つ未来が何であれ、それは信頼の上に築かれるのではなく、すべてが失われた後に残るものの上に築かれるだろう。<br><br>彼女は二つの嵐の間にある沈黙そのものであり、どちらかが他を打ち破る時を静かに待っている。", "", ""], ["HeroStory_mStory_2321", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "「あなたはいずれ食らわれたいと自ら願うでしょう……そのときは、ほんの少しだけ情けをかけてあげる。」<br>—木陰から響く嘶き<br><br>ティアの翡翠の密林で、根が血を啜り、木々が生きとし生けるものを絞め殺すその地に、かつて毒と影の精霊が蠢いていた。シスラとしか呼ばれぬ蛇であったが、当時の彼女にはまだ肉体がなかった。ただ牙と、飢えと、名前の記憶があるだけだった。<br><br>黒曜石の都市が天蓋を分かち、谷間を隔てていた古代文明スケイルキン帝国は、とうの昔に緑豊かな広がりの中に姿を消していた。しかし、最期の時に彼らは最後の魔力を聳え立つ偶像に注ぎ込んだ。力ある生物を刻んだ石像に献身を込めて彫り、赤土と灰で彩色し、密林の精霊への供物として残したのだ。自分たちの嘆願が聞き届けられることを願って。<br><br>だが、そこにあったのは沈黙だけだった。<br><br>都市が崩れ落ち、葉群れのオンスロートに飲み込まれる中、これらの偶像だけは苔に覆われ、半ば朽ちながらも、安らぎなき残響と共に生き続けた。実際、これらの小像の内部には精霊が宿っていた。密林の精霊への贈り物として捧げられた生者の魂が、スケイルキンの魔術によって封じ込められていたのだ。この緑の迷宮をさまよう不運で無知な放浪者たちが、そうした小像に出くわすと即座に命を落とした。それらは実際、強力なディエティを召喚できる生贄の祭壇だったからだ。シスラもそうしたディエティの一柱、蛇の女神であり、古き帝国の名残であり、意志薄弱で傷ついた者の心に響く嘶きだった。<br><br>それでも彼女は精霊のままだった—ダッソーミが彼女を見つけるまでは。<br><br>名高いスケイルキンの神秘主義者は長らく、夢こそがより大いなる真理への橋だと信じていた。世界の忘れられた片隅で失われたウィズダムを求め、ダッソーミは蛇と祭壇の幻視に導かれて密林にやって来た。半ば記憶された深い夢のように、蔦に覆われた神殿に引き寄せられたのだ。その廃墟の中心で、彼は香を焚き、世界の間を滑り抜けた—そしてシスラが応えた。<br><br>しかし、二人の間に何が起こったかの記録は残されていない。ダッソーミが自らを捧げたのか、それとも単に扉を開きすぎたのか、結果は同じだった。シスラは無形の状態を脱ぎ捨て、この世に再生したのだ。毒蛇の抱擁は再び動き出したのだ。<br><br>密林の掟に従い、シスラは優越を主張する者すべてを狩る—正義の者、清純な者、不屈の者を。彼女は神殿や宮殿に忍び込み、最後の選択を迫る。従うか、喰われるか。シスラは自らの蛇の王朝が再び立ち上がることを望んでいる。牙を持ち栄光に満ち、密林と骨で戴冠した王朝を。蔦と毒に血管を巡らされた城塞を、その上を歩く者すべてが弱さを脱ぎ捨て、彼女の毒を深く飲み、苦痛の中で美しく生まれ変わった世界を夢見ている。<br><br>今日でもシスラは崇拝されているが、その教団は散らばり秘密に包まれ、ダッソーミ自身が率いているとも言われる。彼らは自らを牙で印し、舌に毒を滴らせ、苦痛を通じた恍惚を夢見て、崇拝を神聖なものとする。彼らは餌食に選ばれることを祈る—選ばれることは見られること、狩られること、愛されることだからだ。蛇に口づけされることは、魂に力が巻きつくのを感じること—皮のように弱さを脱ぎ捨て、新たに生まれ変わることなのだ。彼女の噛みつきを生き延びた者は、彼女の女狩人となる。死をもたらし、美しく、そして完全に献身的な存在に。<br><br>そして呼吸と噛みつきの間の神聖なる瞬間に、矢が心臓の真上に留まる時、彼らは皆同じことを囁くのだ。<br>「ありがとう。」", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "雪のヴェール", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "最も甘美な毒", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "ヒーロー：アイリス", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "ヒーロー：シスラ", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaranteed within 200 summons!", "イベントに参加する限定ヒーローを1体選択。選択した限定ヒーローは排出率が上昇し、200回以内の召喚で必ず獲得できる！", "", ""], ["Item_mItemDesc_31097", "<span style=\"color: #eadca2;\">Special Summon Offer</span><br><br>Get the necessary materials for Hero Summon", "<span style=\"color: #eadca2;\">スペシャル召喚オファー</span><br><br>ヒーロー召喚に必要な素材を獲得", "", ""], ["Item_mItemDesc_3334", "<span style=\"color: #498a40;\">Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).</span>", "<span style=\"color: #498a40;\">ヒーローの降臨アルティメットリーダーボード（サーペントボーンシーズン）の限定アバターフレーム。</span>", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen's Clues 1-5.", "二郎神の未知の手がかり。入手すると、自動的に二郎神の手がかり1～5のうちランダムな1つに変換される。", "", ""], ["Item_mItemDesc_3521", "Erlang Shen's Clue 2.<br><span style=\"color: #498a40;\">Usage: Consume this item via Fate's Chapters to unlock the corresponding clue.</span>", "二郎神の手がかり2。<br><span style=\"color: #498a40;\">使用方法：運命のチャプターでこのアイテムを消費し、対応する手がかりを解放する。</span>", "", ""], ["Item_mItemDesc_3522", "Erlang Shen's Clue 3.<br><span style=\"color: #498a40;\">Usage: Consume this item via Fate's Chapters to unlock the corresponding clue.</span>", "二郎神の手がかり3。<br><span style=\"color: #498a40;\">使用方法：運命のチャプターでこのアイテムを消費し、対応する手がかりを解放する。</span>", "", ""], ["Item_mItemDesc_3523", "Erlang Shen's Clue 4.<br><span style=\"color: #498a40;\">Usage: Consume this item via Fate's Chapters to unlock the corresponding clu span> ally in ATK Range can be immune to <span style=\"color: #4A9DF2;\">1</span> instance of fatal DMG. If the ally triggering this effect is with <span style=\"color: #28d37c;\">[322090,param1]</span>, also gains <span style=\"color: #4A9DF2;\">immunity</span> to all DMG for <span style=\"color: #4A9DF2;\">{skm1}</span> sec. This effect can be triggered at most <span style=\"color: #4A9DF2;\">1</span> time every <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "攻撃範囲内の<span style=\"color: #4A9DF2;\">1</span>体の味方は、<span style=\"color: #4A9DF2;\">1</span>回の致命的なダメージを無効化できる。この効果を発動した味方が<span style=\"color: #28d37c;\">[322090,param1]</span>を有している場合、さらに<span style=\"color: #4A9DF2;\">{skm1}</span>秒間、すべてのダメージに<span style=\"color: #4A9DF2;\">耐性</span>を得る。この効果は<span style=\"color: #4A9DF2;\">{skm2}</span>秒ごとに最大<span style=\"color: #4A9DF2;\">1</span>回まで発動可能。", "", ""], ["Skill_mSkillDesc_220906_2", "DMG Immunity Duration +{sk1}", "ダメージ無効化持続時間+{sk1}", "", ""], ["Skill_mSkillDesc_220906_3", "Trigger Interval -{sk1} sec", "発動間隔-{sk1}秒", "", ""], ["Skill_mSkillDesc_220906_4", "DMG Immunity Duration +{sk1}", "ダメージ無効化持続時間+{sk1}", "", ""], ["Skill_mSkillDesc_220906_5", "Trigger Interval -{sk1} sec", "発動間隔-{sk1}秒", "", ""], ["Skill_mSkillDesc_220916_1", "While the hero is on the field, allies recover an additional <span style=\"color: #4A9DF2;\">{skm1}%</span> Rage per sec. Allies with <span style=\"color: #28d37c;\">[322090,param3]</span> recover <span style=\"color: #4A9DF2;\">{skm2}%</span> Rage per sec instead.", "ヒーローがフィールド上にいる間、味方は毎秒追加で<span style=\"color: #4A9DF2;\">{skm1}%</span>のレイジを回復する。<span style=\"color: #28d37c;\">[322090,param3]</span>を有する味方は、代わりに毎秒<span style=\"color: #4A9DF2;\">{skm2}%</span>のレイジを回復する。", "", ""], ["Skill_mSkillDesc_220916_2", "Recovery +{sk1}%", "回復力+{sk1}%", "", ""], ["Skill_mSkillDesc_220916_3", "Recovery +{sk1}%", "回復力+{sk1}%", "", ""], ["Skill_mSkillDesc_220916_4", "Recovery +{sk1}%", "回復力+{sk1}%", "", ""], ["Skill_mSkillDesc_220916_5", "Re <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. Her next Basic ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target.", "範囲内でユニットが撤退、死亡、またはヒーローの召喚が消滅すると、攻撃力が<span style=\"color: #4A9DF2;\">{skm1}%</span>増加し、<span style=\"color: #4A9DF2;\">{skm2}</span>秒間持続する。次の通常攻撃は<span style=\"color: #4A9DF2;\">{skm3}%</span>のダメージを与え、対象に<span style=\"color: #fd4540;\">[200052,param15]</span>を付与する。", "", ""], ["Skill_mSkillSimpleDesc_232150_1", "When a unit retreats, dies, or the hero's summon perishes in range, her ATK increases by <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. Her next Basic ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target. If triggered when the hero's HP is below <span style=\"color: #4A9DF2;\">{skm4}%</span>, the duration is extended by <span style=\"color: #4A9DF2;\">{skm5}</span> sec, and the ATK Increase is raised to <span style=\"color: #4A9DF2;\">{skm6}%</span>.", "範囲内でユニットが撤退、死亡、またはヒーローの召喚物が死ぬと、攻撃力が<span style=\"color: #4A9DF2;\">{skm1}%</span>、<span style=\"color: #4A9DF2;\">{skm2}</span>秒間増加する。次の通常攻撃は<span style=\"color: #4A9DF2;\">{skm3}%</span>のダメージを与え、対象に<span style=\"color: #fd4540;\">[200052,param15]</span>を与える。ヒーローのHPが<span style=\"color: #4A9DF2;\">{skm4}%</span>未満の时に発動すると、持続時間が<span style=\"color: #4A9DF2;\">{skm5}</span>秒延長され、攻撃力増加が<span style=\"color: #4A9DF2;\">{skm6}%</span>に向上する。", "", ""], ["Skill_mSkillSimpleDesc_232160_1", "<span style=\"color: #28d37c;\">[23211,1]</span>'s ATK has a(n) <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to increase the number of shots by <span style=\"color: #4A9DF2;\">{skm2}</span>. Killing a target can increase it by <span style=\"color: #4A9DF2;\">{skm3}</span> time(s).", "<span style=\"color: #28d37c;\">[23211,1]</span>の攻撃力が<span style=\"color: #4A9DF2;\">{skm1}%</span>の確率で射撃回数を<span style=\"color: #4A9DF2;\">{skm2}</span>回増加させる。対象を倒すと<span style=\"color: #4A9DF2;\">{skm3}</span>回まで増加できる。", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero's DMG by <span style=\"color: #4A9DF2;\">{skm1}%</span>, with an additional <span style=\"color: #4A9DF2;\">{skm2}%</span> against Elite and Boss units, lasting for <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "タレント発動時、ヒーローのダメージを<span style=\"color: #4A9DF2;\">{skm1}%</span>増加させ、エリートとボスユニットに対しては追加で<span style=\"color: #4A9DF2;\">{skm2}%</span>増加する。<span style=\"color: #4A9DF2;\">{skm3}</span>秒間持続する。", "", ""], ["Skill_mSkillSimpleDesc_232180_1", "Every <span style=\"color: #4A9DF2;\">{skm1}</span> time(s) the hero's Basic ATK deals DMG, it also triggers the Talent effect.", "ヒーローの通常攻撃が<span style=\"color: #4A9DF2;\">{skm1}</span>回ダメージを与えるごとに、タレント効果も発動する。", "", ""], ["Skill_mSkillSimpleDesc_232198_1", "Increases DMG in the Arena by <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "アリーナでのダメージが<span style=\"color: #4A9DF2;\">{skm1}%</span>増加する。", "", ""], ["Skill_mSkillSimpleDesc_630614_1", "Jungle Master heals 2 allies at a time.", "ジャングルマスターは同時に2体の味方を回復する。", "", ""], ["Skin_mSkinName_2209000", "Default", "デフォルト", "", ""], ["Skin_mSkinName_2321000", "Default", "デフォルト", "", ""], ["Stage_mStageDesc_9102013", "Only heroes of the following faction can be deployed: The Nightmare Council.", "次の勢力のヒーローのみを配置できます：ナイトメアカウンシル。", "", ""], ["Stage_mStageDesc_9102014", "Only heroes of the following faction can be deployed: The Nightmare Council.", "次の勢力のヒーローのみを配置できます：ナイトメアカウンシル。", "", ""], ["Stage_mStageDesc_9102015", "Only heroes of the following faction can be deployed: The Nightmare Council.", "次の勢力のヒーローのみを配置できます：ナイトメアカウンシル。", "", ""], ["Stage_mStageDesc_9102016", "Only heroes of the following faction can be deployed: The Nightmare Council.", "次の勢力のヒーローのみを配置できます：ナイトメアカウンシル。", "", ""], ["Stage_m

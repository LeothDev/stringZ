ing Bonus. Up to 2 allies with Serene Breath can be on the field.", "Dissipe 1 malus toutes les 2 s. Lorsqu&#x27;Eirlys soigne ses alliés avec Souffle serein, elle obtient {30,num} % de bonus de soin supplémentaire. Jusqu&#x27;à 2 alliés avec Souffle serein peuvent être présents sur le terrain.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Lorsque les PV du porteur tombent en dessous de {30,num} %, restaure immédiatement des PV égaux à {31,num} % de l&#x27;ATQ du lanceur et retire cet effet. Lorsque la durée d&quot;effet prend fin naturellement ou se réinitialise, restaure des PV égaux à {32,num} % de l&#x27;ATQ du lanceur pour le porteur. Cet effet ne peut pas être dissipé.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Lorsque les PV du porteur tombent en dessous de {30,num} %, restaure immédiatement des PV égaux à {31,num} % de l&#x27;ATQ du lanceur et retire cet effet. Lorsque la durée d&quot;effet prend fin naturellement ou se réinitialise, restaure des PV égaux à {32,num} % de l&#x27;ATQ du lanceur pour le porteur. Cet effet ne peut pas être dissipé.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This e érit après avoir effectué tous les tirs. Priorise les cibles aériennes. Chaque fois que la flèche touche une cible éliminée, elle récupère un compte de retour. Jusqu&#x27;à {32,num} peuvent exister sur le champ de bataille.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Tire rapidement sur 1 ennemi à portée d&#x27;ATQ de son propriétaire, pouvant initialement tirer {30,num} fois, infligeant {31,num} % de DGT à chaque tir. L&#x27;Âme tourmentée périt après avoir effectué tous les tirs. Priorise les cibles aériennes. Chaque fois que la flèche touche une cible éliminée, elle récupère un compte de retour. Jusqu&#x27;à {32,num} peuvent exister sur le champ de bataille.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Tire rapidement sur 1 ennemi à portée d&#x27;ATQ de son propriétaire, pouvant initialement tirer {30,num} fois, infligeant {31,num} % de DGT à chaque tir. L&#x27;Âme tourmentée périt après avoir effectué tous les tirs. Priorise les cibles aériennes. Chaque fois que la flèche touche une cible éliminée, elle récupère un compte de retour. Jusqu&#x27;à {32,num} peuvent exister sur le champ de bataille.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Tire rapidement sur 1 ennemi à portée d&#x27;ATQ de son propriétaire, pouvant initialement tirer {30,num} fois, infligeant {31,num} % de DGT à chaque tir. L&#x27;Âme tourmentée périt après avoir effectué tous les tirs. Priorise les cibles aériennes. Chaque fois que la flèche touche une cible éliminée, elle récupère un compte de retour. Jusqu&#x27;à {32,num} peuvent exister sur le champ de bataille.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participez au Raid d&#x27;équipement I pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Participez au Raid d&#x27;équipement II pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Participez au Raid d&#x27;équipement III pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Invoquez des héros pour remporter des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes&#x27; skills to win trophies and redeem rewards.", "Améliorez le niveau, le niveau d&#x27;étoile, le grade ou les compétences des héros pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Participez à des raids de matériaux d&#x27;artefacts pour gagner des trophées à échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participez au Raid d&#x27;équipement I pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Classement ultime de l&#x27;Arrivée des héros", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "L&#x27;héritage perdu", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Chambre forte des sables", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Palais oublié", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Arrivée des héros", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Entraînement de héros", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Mystère d&#x27;artefacts", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "L&#x27;héritage perdu", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Chapitre d&#x27;histoire", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Chapitre des défis", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "IP du domaine public", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Invasion de zombies", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Changement de chaînes en cours...", "", ""], ["CommonText_mMessage_24292", "Challenges", "Défis", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;Clés de voûte d&#x27;épreuve&lt;/color&gt;\\nLes clés de voûte d&#x27;épreuve peuvent être obtenues dans divers modes de jeu. Ces clés existent en différents types et niveaux, chacune contenant des inscriptions anciennes uniques. Insérez-les dans l&#x27;autel pour ouvrir des chemins vers leurs épreuves correspondantes. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Règles de défi&lt;/color&gt;\\nChaque combat comporte plusieurs vagues de monstres. Vaincre chaque vague vous permet d&#x27;obtenir un coffre au trésor. Une fois le combat lancé, il ne peut pas être recommencé. Si vous quittez le combat avant la fin, les récompenses seront calculées en fonction de votre progression actuelle. Vous pouvez consommer jusqu&#x27;à 200 clés de voûte par mois pour les défis d&#x27;épreuve. Une fois cette limite atteinte, aucun autre défi n&#x27;est possible pendant le mois en cours.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Énergie des clés de voûte&lt;/color&gt;\\nChaque clé de voûte possède une énergie spécifique. &lt;color=&quot;#fdbe36&quot;&gt;1 point d&#x27;énergie est consommé par tentative d&#x27;épreuve.&lt;/color&gt; À la fin du combat, si la clé de voûte possède encore de l&#x27;énergie restante, vous pouvez choisir de renoncer aux récompenses et partir, puis consommer à nouveau de l&#x27;énergie pour recommencer l&#x27;épreuve. La consommation d&#x27;énergie ne compte pas dans la limite mensuelle de clés de voûte.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Détruire une clé de voûte&lt;/color&gt;\\nVous pouvez détruire les clés de voûte qui répondent aux exigences de niveau de destruction. La destruction des clés de voûte ne donne aucune récompense et ne compte pas dans la limite mensuelle de consommation de clés de voûte.\\n&lt;color=&quot;#fd4540&quot;&gt;Les clés de voûte d&#x27;épreuve ont une limite d&#x27;inventaire. Une fois plein, vous ne pourrez plus obtenir d&#x27;autres clés de voûte. Veuillez les utiliser régulièrement pour garder de l&#x27;espace disponible.&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Cristal moussu", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Cristal ardent", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Une fois le combat lancé, il ne peut pas être recommencé. Si vous quittez en cours de combat, le règlement sera immédiatement effectué et l&#x27;énergie consommée ne sera pas restituée !", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Une région volcanique où la lave jaillit pendant l&#x27;apocalypse. Davantage de héros de plateforme sont nécessaires pour repousser les forces maléfiques apocalyptiques.", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;Voulez-vous vraiment renvoyer ce joueur du poste de maréchal ?&lt;/color&gt;\\nChaque guilde peut avoir jusqu&#x27;à {num1} maréchaux, chacun obtenant {num2} attaque(s) supplémentaire(s) par tour.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Points du tour", "", ""], ["CommonText_mMessage_26126", "Destroy", "Détruire", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "Voulez-vous détruire {name} ?\\n&lt;color=&quot;#fd4540&quot;&gt;Les clés de voûte détruites ne peuvent pas être récupérées et ne donnent aucun objet.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "Clé de voûte détruite.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Énergie :", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Abandonner et quitter", "", ""], ["CommonText_mMessage_26131", "Claim", "Récupérer", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Énergie de clé de voûte restante :", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Galerie de combat", "", ""], ["CommonText_mMessage_26134", "Guides", "Guides", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Clé de voûte en apparition :", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Cristal moussu", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Cristal ardent", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Afficher uniquement les tags de la clé de voûte actuelle", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Les héros les plus populaires sont calculés selon les taux de sélection, à titre indicatif uniquement.", "", ""], ["CommonText_mMessage_26140", "Search", "Recherche", "", ""], ["CommonText_mMessage_26141", "Search Results", "Résultats de recherche", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Chargement des données...", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Collecte des données de héros", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Veuillez saisir au moins {num} caractère(s)", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "Aucun tag correspondant trouvé.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "Le combat auto. n&#x27;est pas disponible pour le niveau actuel de clé de voûte.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Vous pouvez télécharger des enregistrements de combat auto. après avoir manuellement terminé la vague {num}.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "Le combat auto. peut échouer en raison de tags de clé de voûte différents. Souhaitez-vous continuer avec le combat auto. ?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Télécharger cette bataille comme nouvel enregistrement de combat auto. ?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "En raison des tags de clés de voûte différents, nous vous recommandons de sélectionner la formation la plus complète possible pour télécharger le combat auto. !", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "L&#x27;inventaire de clés de voûte est plein. Utilisez-en certaines avant d&#x27;en acheter davantage.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Nettoyer", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "Des coffres de clés de voûte aléatoires non ouverts ont été détectés dans votre inventaire. Voulez-vous les ouvrir maintenant ?", "", ""], ["CommonText_mMessage_26154", "Go", "Aller", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Niv. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level&#x27;s Keystone cannot be destroyed.", "La clé de voûte de ce niveau ne peut pas être détruite.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Keystone(s)?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "Êtes-vous sûr de vouloir détruire &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Clé(s) de voûte ?\\n&lt;color=&quot;#fd4540&quot;&gt;Les Clés de voûte détruites ne peuvent pas être récupérées et n&#x27;accorderont aucun objet.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "{num} clé(s) de voûte détruite(s).", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Utilisation mensuelle :", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Les clés de voûte ont une limite mensuelle de défis. Aucune tentative supplémentaire n&#x27;est permise après avoir atteint cette limite.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?\\n&lt;color=&quot;#e04242&quot;&gt;During the event, you can only choose one difficulty per day to claim rewards.&lt;/color&gt;", "Des récompenses sont disponibles pour la difficulté actuelle. Voulez-vous vraiment essayer une difficulté différente ?\\n&lt;color=&quot;#e04242&quot;&gt;Pendant l&#x27;événement, vous ne pouvez choisir qu&#x27;une seule difficulté par jour pour récupérer des récompenses.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26162", "Don&#x27;t remind me again.", "Ne pas me rappeler.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "L&#x27;inventaire de clés de voûte est plein. Veuillez en utiliser avant d&#x27;en débloquer d&#x27;autres.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "La version de la rediffusion ne correspond pas à la version actuelle et ne peut pas être visionnée.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Veuillez saisir jusqu&#x27;à {num} caractère(s).", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Héros populaires", "", ""], ["CommonText_mMessage_26167", "Tag", "Tag", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Inventaire de clés de voûte d&#x27;épreuve plein", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater&#x27;s Movement Spd. by 30. They are &lt;color=&quot;#fd4540&quot;&gt;immune to Slow&lt;/color&gt;.", "Réduit la vit. de déplacement du Dévoreur d&#x27;âme de 30. Il est &lt;color=&quot;#fd4540&quot;&gt;immunisé contre le ralentissement&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73003", "White Tower&#x27;s Scholar enters &lt;color=&quot;#fd4540&quot;&gt;Invisibility&lt;/color&gt; and becomes visible when blocked.", "Le Savant de la Tour Blanche entre en &lt;color=&quot;#fd4540&quot;&gt;état d&#x27;invisibilité&lt;/color&gt; et devient visible lorsqu&#x27;il est bloqué.", "", ""], ["Difficulty_mDetail_73004", "White Tower&#x27;s Scholar becomes &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "Le Savant de la Tour Blanche devient &lt;color=&quot;#fd4540&quot;&gt;immunisé contre les DGT M.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains &lt;color=&quot;#fd4540&quot;&gt;unyielding effect&lt;/color&gt; for 3 sec upon death and becomes &lt;color=&quot;#fd4540&quot;&gt;immune to Control and Slow&lt;/color&gt;.", "Le Petit arachnidé gagne un &lt;color=&quot;#fd4540&quot;&gt;effet d&#x27;inflexibilité&lt;/color&gt; pendant 3 s après sa mort et devient &lt;color=&quot;#fd4540&quot;&gt;immunisé contre le contrôle et le ralentissement&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 5 sec.", "Le Petit arachnidé &lt;color=&quot;#fd4540&quot;&gt;récupère 50 % de ses PV&lt;/color&gt; toutes les 5 s.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "La &lt;color=&quot;#fd4540&quot;&gt;vit. de déplacement du Garde de foudre est augmentée de 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is &lt;color=&quot;#fd4540&quot;&gt;immune to DMG taken&lt;/color&gt;, but loses 5% HP per sec.", "Le Garde de foudre est &lt;color=&quot;#fd4540&quot;&gt;immunisé contre les DGT subis&lt;/color&gt;, mais perd 5 % de PV par seconde.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace&#x27;s Fatigue becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "La Fatigue de la Menace obscure devient &lt;color=&quot;#fd4540&quot;&gt;permanente&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is &lt;color=&quot;#fd4540&quot;&gt;immune to CC Effects&lt;/color&gt;.", "Le Komodo blindé est &lt;color=&quot;#fd4540&quot;&gt;immunisé contre les effets de contrôle de foule&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction &lt;color=&quot;#fd4540&quot;&gt;when blocked&lt;/color&gt;.", "Le Komodo blindé gagne une réduction supplémentaire de 30 % aux DGT P. et M. &lt;color=&quot;#fd4540&quot;&gt;lorsqu&#x27;il est bloqué&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;summons an extra&lt;/color&gt; Ice Vermin.", "Le Prêtre gelé &lt;color=&quot;#fd4540&quot;&gt;invoque une&lt;/color&gt; Vermine de glace supplémentaire.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;spawns&lt;/color&gt; 3 Ice Vermin &lt;color=&quot;#fd4540&quot;&gt;upon death&lt;/color&gt;.", "Prêtre gelé &lt;color=&quot;#fd4540&quot;&gt;fait apparaître&lt;/color&gt; 3 Vermines de glace &lt;color=&quot;#fd4540&quot;&gt;lorsqu&#x27;il meurt&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. +50&lt;/color&gt;.", "Le Garde de tonnerre cesse d&#x27;attaquer et sa &lt;color=&quot;#fd4540&quot;&gt;vit. de déplacement augmente de 50&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;ATK is increased by 100%&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;when attacking shields&lt;/color&gt;, deducts 50% of its HP.", "&lt;color=&quot;#fd4540&quot;&gt;L&#x27;ATQ du Garde de tonnerre augmente de 100 %&lt;/color&gt;, mais &lt;color=&quot;#fd4540&quot;&gt;lorsqu&#x27;il attaque les boucliers&lt;/color&gt;, il perd 50 % de ses PV.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "L&#x27;Œil-mort brumeux est &lt;color=&quot;#fd4540&quot;&gt;immunisé contre les DGT M.&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores &lt;color=&quot;#fd4540&quot;&gt;10% HP&lt;/color&gt; with each ATK.", "Brume : Baron Salem régénère &lt;color=&quot;#fd4540&quot;&gt;10 % de PV&lt;/color&gt; à chaque ATQ.", "", ""], ["Difficulty_mDetail_73018", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;Cooldown is reduced by 100%&lt;/color&gt;.", "Le temps de recharge de l&#x27;Incubation accélérée de l&#x27;incubateur &lt;color=&quot;#fd4540&quot;&gt;est réduit de 100 %&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73019", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;spawns 2 extra Suicides&lt;/color&gt;.", "L&#x27;Incubation accélérée de l&#x27;incubateur génère &lt;color=&quot;#fd4540&quot;&gt;2 kamizraks supplémentaires&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;drains 10% of the target&#x27;s Rage&lt;/color&gt;.", "Lorsqu&#x27;il inflige des DGT à une cible, le Prêtre du tonnerre &lt;color=&quot;#fd4540&quot;&gt;absorbe 10 % de la rage de la cible&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;permanently reduces their Max HP by 10%&lt;/color&gt;. This effect can be stacked.", "Lorsqu&#x27;il inflige des DGT à une cible, le Prêtre du tonnerre &lt;color=&quot;#fd4540&quot;&gt;réduit de façon permanente ses PV max de 10 %&lt;/color&gt;. Cet effet peut être cumulé.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces &lt;color=&quot;#fd4540&quot;&gt;healing&lt;/color&gt; received by &lt;color=&quot;#fd4540&quot;&gt;all units in range&lt;/color&gt; by 50%.", "Le Fléau réduit les &lt;color=&quot;#fd4540&quot;&gt;soins&lt;/color&gt; reçus par &lt;color=&quot;#fd4540&quot;&gt;toutes les unités à portée&lt;/color&gt; de 50 %.", "", ""], ["Difficulty_mDetail_73023", "Scourge&#x27;s DMG range expands to &lt;color=&quot;#fd4540&quot;&gt;adjacent 2 tiles&lt;/color&gt;.", "La portée des DGT du Fléau s&#x27;étend aux &lt;color=&quot;#fd4540&quot;&gt;2 cases adjacentes&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to &lt;color=&quot;#fd4540&quot;&gt;blocked targets&lt;/color&gt;.", "Quand Brume : l&#x27;Observateur des abysses supérieur meurt, il inflige des DGT M. égaux à 100 % de son ATQ aux &lt;color=&quot;#fd4540&quot;&gt;cibles bloquées&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes &lt;color=&quot;#fd4540&quot;&gt;unblockable&lt;/color&gt;.", "Le Rongeur mutant enragé devient &lt;color=&quot;#fd4540&quot;&gt;imparable&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent &lt;color=&quot;#fd4540&quot;&gt;increases Movement Spd. by 30&lt;/color&gt;.", "Le Rongeur mutant enragé &lt;color=&quot;#fd4540&quot;&gt;augmente sa vit. de déplacement de 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "Pour chaque tranche de 20 % de PV perdus, le Baron Salem &lt;color=&quot;#fd4540&quot;&gt;gagne 20 % de DÉF et de Rés. M.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "La &lt;color=&quot;#fd4540&quot;&gt;vit. de déplacement du Maître des ombres est augmentée de 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "Pour chaque tranche de 20 % de PV perdus, le Maître des ombres &lt;color=&quot;#fd4540&quot;&gt;gagne 20 % de DÉF et de Rés. M.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers&#x27; DEF and M. RES. by 30%. &lt;color=&quot;#fd4540&quot;&gt;When under CC Effects, reduces by 50%&lt;/color&gt;.", "Augmente la DÉF et la Rés. M. des Destructeurs communs de 30 %. &lt;color=&quot;#fd4540&quot;&gt;Sous l&#x27;effet du contrôle de foule, cette augmentation est réduite de 50 %&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when &lt;color=&quot;#fd4540&quot;&gt;stunned or frozen&lt;/color&gt;.", "Le Destructeur commun est immunisé contre les DGT lorsqu&#x27;il est &lt;color=&quot;#fd4540&quot;&gt;étourdi ou gelé&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an &lt;color=&quot;#fd4540&quot;&gt;initial Hitcount Shield&lt;/color&gt;.", "Le Destructeur inhabituel obtient un &lt;color=&quot;#fd4540&quot;&gt;bouclier de nombre de coups initial&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer &lt;color=&quot;#fd4540&quot;&gt;gains 5 Movement Spd. each time taking DMG&lt;/color&gt;.", "Le Destructeur inhabituel &lt;color=&quot;#fd4540&quot;&gt;augmente sa vit. de déplacement de 5&lt;/color&gt; chaque fois qu&#x27;il subit des DGT.", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee&#x27;s Ultrasonic Wave &lt;color=&quot;#fd4540&quot;&gt;DMG increases by 100%&lt;/color&gt; and does not inflict Poison.", "L&#x27;Onde ultrasonique de la banshee chauve-souris &lt;color=&quot;#fd4540&quot;&gt;augmente ses DGT de 100 %&lt;/color&gt; et n&#x27;inflige pas de poison.", "", ""], ["Difficulty_mDetail_73035", "Batwings Banshee&#x27;s Poison effect becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "L&#x27;effet de poison de la banshee chauve-souris devient &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73036", "Golden Guard &lt;color=&quot;#fd4540&quot;&gt;forcibly removes targets&lt;/color&gt; upon collision.", "Le Garde d&#x27;or &lt;color=&quot;#fd4540&quot;&gt;expulse violemment les cibles&lt;/color&gt; lors d&#x27;une collision.", "", ""], ["Difficulty_mDetail_73037", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 15 sec.", "Le Destructeur suprême &lt;color=&quot;#fd4540&quot;&gt;régénère 50 % de ses PV&lt;/color&gt; toutes les 15 s.", "", ""], ["Difficulty_mDetail_73038", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;Movement Sp es emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7004", "Giant Golem appears at fixed positions in battle.", "Le Golem géant apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7007", "Skeleton Archer appears at fixed positions in battle.", "L&#x27;Archer squelette apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7010", "Priestess of Rain appears at fixed positions in battle.", "La Prêtresse de la pluie apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7013", "Gilded Warden appears at fixed positions in battle.", "Le Gardien doré apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7016", "Aureate Inquisitor appears at fixed positions in battle.", "L&#x27;Inquisiteur doré apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7019", "Suicide appears at fixed positions in battle.", "Le Kamizrak apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7022", "Sandtaker appears at fixed positions in battle.", "Le Fossoyeur des dunes apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7025", "Healing Fly appears at fixed positions in battle.", "La Mouche guérisseuse apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7028", "Twisted Sycophant appears at fixed positions in battle.", "Le Sycophante diabolique apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7031", "Thunder Beacon appears at fixed positions in battle.", "La Balise du tonnerre apparaît à des emplacements fixes au combat.", "", ""], ["Difficulty_mStrategyDesc_7101", "Golden Guard appears randomly on the battlefield each wave.", "Le Garde d&#x27;or apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "Le Golem géant apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "L&#x27;Archer squelette apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "La Prêtresse de la pluie apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "Le Gardien doré apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "L&#x27;Inquisiteur doré apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "Le Kamizrak apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "Le Fossoyeur des dunes apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "La Mouche guérisseuse apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "Le Sycophante diabolique apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero&#x27;s DMG by 10% for 8 sec, stacking up to 5 times.", "(3 équipements) En infligeant un coup crit. avec une ATQ basique, augmente les DGT du héros de 10 % pendant 8 s, cumulable jusqu&#x27;à 5 fois.", "", ""], ["HeroStory_mStory_2209", "&quot;She walks like a memory I have not earned, yet always long for.&quot;\\n-Rivenhald\\n\\nThey sent her north, where the snows upon her brow might bend her once more to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "&quot;Elle se déplace comme un souvenir que je n&#x27;ai pas mérité, mais que je convoite éternellement.&quot;\\n-Rivenhald\\n\\nIls l&#x27;ont envoyée vers le nord, où les neiges qui tombaient sur son front pourraient la plier de nouveau à leur cause.\\n\\nAutrefois prêtresse d&#x27;Elyndris, Eirlys officiait au cœur des rites ancestraux, sa voix entrelacée dans le souffle même des dieux. Mais quelque chose s&#x27;est brisé. Elle a fait un choix que personne n&#x27;osait nommer, et le sanctuaire ne pardonnait pas sans exiger son tribut.\\n\\nLa cité elfique avait passé des mois à panser ses plaies après les flammes de l&#x27;assaut dévastateur de Moriden. Bien que le raz-de-marée ait été repoussé, les cicatrices demeuraient, et avec elles, une révélation terrifiante : ils n&#x27;étaient plus intouchables. Leurs tours majestueuses s&#x27;étaient fissurées. Leurs mythes avaient saigné. Elyndris avait désormais besoin d&#x27;ombres pour se faufiler là où les étendards ne pouvaient plus s&#x27;aventurer. Alors les voyants tournèrent leur regard vers l&#x27;horizon. Silencieusement. Méticuleusement. Cherchant des refuges au-delà des cartes anciennes, où leur peuple pourrait se dissimuler si la guerre resurgissait.\\n\\nLe Nord de Tya, glacial et désolé, s&#x27;éleva dans leurs augures tel un glaive émergeant des neiges éternelles. Ils connaissaient Harz, mais n&#x27;osaient pas provoquer un homme d&#x27;une telle renommée. Rivenhald, en revanche, régnait sur des contrées glaciales inconnues de leurs éclaireurs. C&#x27;était un seigneur de guerre sans en porter le titre, un monarque qui ne s&#x27;inclinait devant aucune couronne hormis la sienne. Ils devaient percer ses mystères. Découvrir si sa puissance pouvait être détournée. Ou, si nécessaire, si elle pouvait être brisée aisément.\\n\\nEirlys était leur réponse. Sans attaches, elle n&#x27;était ni diplomate ni espionne, mais quelque chose de plus subtil. Elle fut envoyée armée de demi-vérités et d&#x27;un serment sacré : gagner sa confiance, lire dans son âme, et rapporter ce qui demeure invisible de loin. Elle arriva drapée de blanc, sa présence justifiée comme une mission de maintien de la paix. Une guérisseuse errante. Une prêtresse du givre. Et Rivenhald, qui se méfiait de tout le monde, lui accorda sa confiance.\\n\\nElle sut se rendre indispensable. Soigna les blessures, déchiffra les présages, ne laissa filtrer aucune trace d&#x27;intentions dissimulées. Il l&#x27;observait. Elle lui rendait son regard. Aucun des deux ne cillait.\\n\\nLes frontières entre eux s&#x27;estompèrent avec le temps, s&#x27;entremêlant tout en demeurant inébranlables. Elle apprit à décrypter ses silences, les contours de sa colère, l&#x27;étrange miséricorde qu&#x27;il enfouissait sous sa rudesse. La nuit, quand le feu se consumait lentement et qu&#x27;aucun message ne pouvait être envoyé, elle imaginait parfois un avenir où il pourrait presque mériter sa confiance, où il pourrait signifier davantage pour elle... mais l&#x27;aube consumait invariablement ces chimères.\\n\\nComme Rivenhald, elle aussi entrevoit comment tout finira : deux silhouettes dans la neige, impassibles et inflexibles. Une lame doit tomber. Une cause doit s&#x27;éteindre. Et dans la brume sanglante avant que le vent n&#x27;emporte tout, ils comprendront le prix de la survie... et ce qu&#x27;ils représentent véritablement l&#x27;un pour l&#x27;autre.\\n\\nMais Eirlys sait ce que les voyants d&#x27;Elyndris ne lui ont jamais révélé. Le Nord n&#x27;appartient à personne. Ni aux rois. Ni aux cités. Et certainement pas à des fantômes comme elle. Quel que soit l&#x27;avenir qui les attend, il ne sera pas bâti sur la confiance, mais sur ce qui survit une fois celle-ci anéantie. \\n\\nElle incarne le silence entre deux tempêtes, guettant l&#x27;heure où l&#x27;une devra inévitablement briser l&#x27;autre.", "", ""], ["HeroStory_mStory_2321", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "&quot;Tu me supplieras de te dévorer. Et je t&#x27;accorderai la merci.&quot;\\n—Sifflé depuis les feuillages\\n\\nDans les jungles de jade de Tya, où les racines s&#x27;abreuvent de sang et les arbres étranglent les vivants, rampait jadis un esprit d&#x27;ombre et de venin, un serpent dont le nom n&#x27;était prononcé qu&#x27;en murmures : Sythra... bien qu&#x27;à cette époque, elle n&#x27;eût point de chair. Seulement des crocs, la faim, et le souvenir d&#x27;un nom.\\n\\nL&#x27;Empire lézardin, une civilisation antique dont les cités d&#x27;obsidienne fendaient autrefois la canopée et divisaient les vallées, s&#x27;était depuis longtemps évanoui dans l&#x27;étendue verdoyante. Cependant, dans leur ultime heure, ils avaient déversé leur dernière magie dans d&#x27;imposantes idoles, des statues de puissantes créatures sculptées avec dévotion, ornées d&#x27;ocre et de cendre, abandonnées en offrande aux esprits de la jungle, dans l&#x27;espoir que leurs suppliques soient entendues.\\n\\nHélas, seul le silence leur répondit.\\n\\nPourtant, alors que la métropole s&#x27;effondrait, engloutie par l&#x27;assaut de la végétation, ces idoles perdurèrent, voilées de mousse, à demi consumées, mais vivantes d&#x27;échos agités. En effet, des esprits habitaient ces figurines : les âmes des vivants données en offrande aux esprits de la jungle, enchaînées par la sorcellerie des lézardins. Les malheureux et naïfs errants de ce labyrinthe feuillu qui tombaient sur ces figurines connaissaient une fin rapide, car il s&#x27;agissait en réalité d&#x27;autels sacrificiels, capables d&#x27;invoquer de puissantes divinités. Sythra était l&#x27;une de ces divinités, une déesse serpentine et vestige de l&#x27;ancien empire, un sifflement qui s&#x27;enroulait dans l&#x27;esprit des faibles et des blessés.\\n\\nPourtant, elle demeurait pure essence... jusqu&#x27;à ce que Dassomi la trouve.\\n\\nLe célèbre mystique lézardin avait longtemps cru que les rêves étaient un pont vers de plus grandes vérités. En quête de sagesse perdue dans les recoins oubliés du monde, Dassomi s&#x27;aventura dans la jungle, suivant des visions de serpents et d&#x27;autels, attiré vers un temple envahi par la végétation comme dans un rêve profond à demi remémoré. Là, au cœur de cette ruine, il brûla de l&#x27;encens et glissa entre les mondes... et Sythra répondit.\\n\\nAucune trace ne subsiste de ce qui se passa entre eux. Que Dassomi se soit offert lui-même, ou qu&#x27;il ait simplement ouvert un portail trop grand, le résultat resta le même : Sythra abandonna son incorporéité pour renaître dans le monde. L&#x27;Étreinte du serpent fut réanimée.\\n\\nObéissant à la loi de la jungle, Sythra chasse tous ceux qui revendiquent la supériorité : les vertueux, les purs, les inflexibles. Elle se glisse dans leurs temples et leurs palais, leur offrant un dernier choix : se soumettre... ou être dévorés. Sythra espère voir sa dynastie serpentine s&#x27;élever à nouveau, crochets acérés et glorieuse, couronnée de jungle et d&#x27;os. Elle rêve de citadelles tapissées de lierre et de venin, d&#x27;un monde foulé uniquement par ceux qui ont abandonné leur faiblesse, bu profondément son poison, et dont la souffrance les rend magnifiques.\\n\\nSythra reste vénérée à ce jour, bien que ses cultes soient dispersés et secrets... et à en croire certains, menés par Dassomi en personne. Ils se marquent de crocs, glissent du venin sur leurs langues, et rêvent d&#x27;extase à travers la douleur, dans une adoration rendue divine. Ils prient pour être choisis pour le festin, car être choisi, c&#x27;est être vu, être chassé, être aimé. Être embrassé par le Serpent, c&#x27;est sentir le pouvoir s&#x27;enrouler autour de son âme, abandonner la faiblesse comme une peau morte, et renaître. Ceux qui survivent à sa morsure deviennent ses chasseresses : mortelles, magnifiques et entièrement dévouées.\\n\\nEt dans cet instant sacré entre le souffle et la morsure, quand la flèche plane juste au-dessus de leur cœur, ils murmureront tous la même chose :\\n&quot;Merci.&quot;", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Voile de neige", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "Le plus doux des poisons", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Héroïne : Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Héros : Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "Sélectionnez 1 héros exclusif à l&#x27;événement pour rejoindre l&#x27;événement. Le héros exclusif sélectionné a un taux d&#x27;obtention augmenté et est garanti sous 200 invocations !", "", ""], ["Item_mItemDesc_31097", "&lt;color=&quot;#eadca2&quot;&gt;Special Summon Offer&lt;/color&gt;\\n\\nGet the necessary materials for Hero Summon", "&lt;color=&quot;#eadca2&quot;&gt;Offre spéciale d&#x27;invocation&lt;/color&gt;\\n\\nObtenez les matériaux nécessaires pour l&#x27;invocation de héros.", "", ""], ["Item_mItemDesc_3334", "&lt;color=&quot;#498a40&quot;&gt;Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).&lt;/color&gt;", "&lt;color=&quot;#498a40&quot;&gt;Cadre d&#x27;avatar exclusif pour le classement ultime de l&#x27;Arrivée des héros (Saison des Nés-du-serpent).&lt;/color&gt;", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen&#x27;s Clues 1-5.", "Indice inconnu d&#x27;Erlang Shen. Une fois obtenu, il se transformera automatiquement en un indice aléatoire parmi les indices 1 à 5 d&#x27;Erlang Shen.", "", ""], ["Item_mItemDesc_3521", "Erlang Shen&#x27;s Clue 2.\\n&lt;color= er. Lorsque les queues sont vaincues, la Renarde à neuf queues revient sur le champ de bataille. Quand toutes les queues sur le terrain sont vaincues, la Renarde à neuf queues se transforme et invoque un grand nombre de renards.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige des DGT M. à la dernière unité déployée sur le champ de bataille, en ciblant prioritairement les Gardiens.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige des DGT M. à la dernière unité déployée sur le champ de bataille, en ciblant prioritairement les Gardiens.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally within the Basic ATK Range and immediately grants this ally a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; of their Max HP for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec. The effect can only be triggered 1 time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "Immunise 1 fois &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; allié à portée d&#x27;ATQ basique contre les DGT mortels, et lui confère immédiatement un bouclier égal à &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt; de ses PV max pendant &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; s. Cet effet ne peut être déclenché qu&#x27;une fois toutes les &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; s.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG to up to &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; enemies.", "Inflige &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt; de DGT à jusqu&#x27;à &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; ennemis.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, and gains &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Grants allies of the same faction Elddr&#x27;s Talent temporarily. The Ultimate lasts for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "Augmente l&#x27;ATQ de &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt;, et obtient &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Confère temporairement le talent d&#x27;Elddr aux alliés de la même faction. L&#x27;Ultime dure &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; s.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "Augmentation d&#x27;ATQ +{sk1} %", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "Augmentation d&#x27;ATQ +{sk1} %", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; chance to trigger Thunder Hammer, dealing an extra &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; DMG. If the hero has no shield, Thunder Hammer has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; chance to grant a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; ATK.", "L&#x27;ATQ basique a &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt; de chances de déclencher Marteau de tonnerre, infligeant &lt;color=&quot;#4A9DF2&quot;&gt;{skm2} %&lt;/color&gt; de DGT supplémentaires. Si le héros ne possède pas de bouclier, Marteau de tonnerre a &lt;color=&quot;#4A9DF2&quot;&gt;{skm3} %&lt;/color&gt; de chances de générer un bouclier égal à &lt;color=&quot;#4A9DF2&quot;&gt;{skm4} %&lt;/color&gt; de l&#x27;ATQ.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally in range.", "Applique &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt; de &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt; à &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; allié à portée.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "Multiplicateur de soin +{sk1} %", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "Multiplicateur de soin +{sk1} %", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "Multiplicateur de soin +{sk1} %", "", ""], ["Skill_mSkillDesc_220901_5", "Healing Multiplier +{sk1}%", "Multiplicateur de soin +{sk1} %", "", ""], ["Skill_mSkillDesc_220903_1", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322091,param1]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range.", "Applique &lt;color=&quot;#28d37c&quot;&gt;[322091,param1]&lt;/color&gt; à &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; allié avec le pourcentage de PV le plus bas à portée.", "", ""], ["Skill_mSkillDesc_220903_2", "Healing Prayer&#x27;s Healing Multiplier +{sk1}%", "Multiplicateur de soin de Prière de soin +{sk1} %", "", ""], ["Skill_mSkillDesc_220903_3", "Skill Cost -{sk1}", "Coût de compétence -{sk1}", "", ""], ["Skill_mSkillDesc_220903_4", "Healing Prayer&#x27;s Healing Multiplier +{sk1}%", "Multiplicateur de soin de Prière de soin +{sk1} %", "", ""], ["Skill_mSkillDesc_220903_5", "Skill Cost -{sk1}", "Coût de compétence -{sk1}", "", ""], ["Skill_mSkillDesc_220906_1", "&lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally in ATK Range can be immune to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; instance of fatal DMG. If the ally triggering this effect is with &lt;color=&quot;#28d37c&quot;&gt;[322090,param1]&lt;/color&gt;, also gains &lt;color=&quot;#4A9DF2&quot;&gt;immunity&lt;/color&gt; to all DMG for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec. This effect can be triggered at most &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "&lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; allié dans la portée d&#x27;ATQ peut être immunisé contre &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; instance de DGT mortel. Si l&#x27;allié qui déclenche cet effet est avec &lt;color=&quot;#28d37c&quot;&gt;[322090,param1]&lt;/color&gt;, il obtient également &lt;color=&quot;#4A9DF2&quot;&gt;l&#x27;immunité&lt;/color&gt; contre tous les DGT pendant &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; s. Cet effet peut être déclenché au plus &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; fois toutes les &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; s.", "", ""], ["Skill_mSkillDesc_220906_2", "DMG Immunity Duration +{sk1}", "Durée d&#x27;immunité aux DGT +{sk1}", "", ""], ["Skill_mSkillDesc_220906_3", "Trigger Interval -{sk1} sec", "Intervalle de déclenchement -{sk1} s", "", ""], ["Skill_mSkillDesc_220906_4", "DMG Immunity Duration +{sk1}", "Durée d&#x27;immunité aux DGT +{sk1}", "", ""], ["Skill_mSkillDesc_220906_5", "Trigger Interval -{sk1} sec", "Intervalle de déclenchement -{sk1} s", "", ""], ["Skill_mSkillDesc_220916_1", "While the hero is on the field, allies recover an additional &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; Rage per sec. Allies with &lt;color=&quot;#28d37c&quot;&gt;[322090,param3]&lt;/color&gt; recover &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; Rage per sec instead.", "Lorsque le héros est sur le terrain, les alliés récupèrent &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; de rage supplémentaire par seconde. Les alliés avec &lt;color=&quot;#28d37c&quot;&gt;[322090,param3]&lt;/color&gt; récupèrent &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; de rage par seconde à la place.", "", ""], ["Skill_mSkillDesc_220916_2", "Recovery +{sk1}%", "Récupération +{sk1} %", "", ""], ["Skill_mSkillDesc_220916_3", "Recovery +{sk1}%", "Récupération +{sk1} %", "", ""], ["Skill_mSkillDesc_220916_4", "Recovery +{sk1}%", "Récupération +{sk1} %", "", ""], ["Skill_mSkillDesc_220916_5", "Recovery +{sk1}%", "Récupération +{sk1} %", "", ""], ["Skill_mS ,param3]&lt;/color&gt;.", "Les soins directs de l&#x27;ATQ basique et de &lt;color=&quot;#28d37c&quot;&gt;[322091,param3]&lt;/color&gt; appliquent &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; instance(s) supplémentaire(s) de &lt;color=&quot;#4A9DF2&quot;&gt;{skm2} %&lt;/color&gt; de soins à tous les alliés avec &lt;color=&quot;#28d37c&quot;&gt;[322090,param3]&lt;/color&gt;.", "", ""], ["Skill_mSkillDesc_220970_1", "When &lt;color=&quot;#28d37c&quot;&gt;[322091,param3]&lt;/color&gt; triggers healing after the bearer&#x27;s HP drops below 50%, grants &lt;color=&quot;#28d37c&quot;&gt;[100251,param3]&lt;/color&gt; to all allies with &lt;color=&quot;#28d37c&quot;&gt;[322090,param3]&lt;/color&gt;. When &lt;color=&quot;#28d37c&quot;&gt;[322091,param3]&lt;/color&gt; triggers healing upon natural expiration or refresh, grants &lt;color=&quot;#28d37c&quot;&gt;[100106,param3]&lt;/color&gt; to all allies with &lt;color=&quot;#28d37c&quot;&gt;[322090,param3]&lt;/color&gt;.", "Lorsque &lt;color=&quot;#28d37c&quot;&gt;[322091,param3]&lt;/color&gt; déclenche un soin après que les PV du porteur soient tombés en dessous de 50 %, confère &lt;color=&quot;#28d37c&quot;&gt;[100251,param3]&lt;/color&gt; à tous les alliés avec &lt;color=&quot;#28d37c&quot;&gt;[322090,param3]&lt;/color&gt;. Lorsque &lt;color=&quot;#28d37c&quot;&gt;[322091,param3]&lt;/color&gt; déclenche un soin lors de son expiration naturelle ou de son rafraîchissement, confère &lt;color=&quot;#28d37c&quot;&gt;[100106,param3]&lt;/color&gt; à tous les alliés avec &lt;color=&quot;#28d37c&quot;&gt;[322090,param3]&lt;/color&gt;.", "", ""], ["Skill_mSkillDesc_220980_1", "When &lt;color=&quot;#4A9DF2&quot;&gt;Sanctuary of Light&lt;/color&gt; is triggered, reduces the hero&#x27;s ATK Interval by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "Lorsque &lt;color=&quot;#4A9DF2&quot;&gt;Sanctuaire de lumière&lt;/color&gt; est déclenché, réduit l&#x27;in

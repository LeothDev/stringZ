.", "Un vestige spectral imparable immunisé contre les effets de contrôle.", "", ""], ["Unit_mDescribe_34102", "Turned from soldiers killed in battle.", "Issus de soldats tués au combat.", "", ""], ["Unit_mDescribe_34103", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "Se sacrifie volontiers pour le bien de sa race, explosant en rencontrant des ennemis et infligeant des DGT massifs aux ennemis à proximité.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. &lt;color=#ff4500&gt;Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.&lt;/color&gt;", "Mutés et déchaînés, ces rongeurs mutants. &lt;color=#ff4500&gt;Ils entrent dans une folle frénésie lorsqu&#x27;ils sont attaqués, augmentant leur vit. de déplacement.&lt;/color&gt;", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Des guerriers squelettes armés de haches géantes, animés par un ressentiment rendant leur attaque encore plus puissante.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "La reine arachné est capable de cracher de la soie et d&#x27;engendrer de nombreuses petites araignées dont elle renforce les attributs.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Il massacre sans pitié tout ce qui se trouve sur son chemin de sa lourde masse.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Un combattant fou qui erre dans le donjon et aime décapiter les gens.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Il massacre sans pitié tout ce qui se trouve sur son chemin de sa lourde masse.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Avec sa tenaille en os géante, cet impitoyable gardien cannibale inflige un saignement continu à ses ennemis.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Avec sa tenaille en os géante, cet impitoyable gardien cannibale inflige un saignement continu à ses ennemis.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Un vestige spectral qui ne peut être ni bloqué ni ralenti et qui doit être éliminé rapidement.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Issus de soldats tués au combat.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Pleins de sacs d&#x27;acide, les Kamizraks aiment se recroqueviller et rouler vers l&#x27;avant.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "Mutés et déchaînés, ces rongeurs mutants se déplacent plus rapidement lorsqu&#x27;ils sont attaqués.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Des guerriers squelettes armés de haches géantes, animés par un ressentiment rendant leur attaque encore plus puissante.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "Vivant sous terre, elle y est le véritable monarque, capable de reproduire et de contrôler les petites araignées dont elle renforce les attributs durant les batailles. Sa soie est si résistante qu&#x27;une fois pris au piège, il est quasiment impossible de s&#x27;en libérer.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "Eirlys, prêtresse elfe exilée. Soigne les blessures graves par ses prières, dissipe les malus, sauve ses alliés au bord de la mort et accélère la régén. de rage de l&#x27;équipe.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "Un vestige de l&#x27;ancien monde, Sythra, l&#x27;Étreinte du serpent, erre dans la Jungle. Elle invoque des âmes tourmentées pour attaquer avec une férocité croissante, ignorant la DÉF pour dévorer ses ennemis.", "", ""], ["Unit_mHeroDesignation_2209", "Winter&#x27;s Mercy", "Clémence de l&#x27;hiver", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent&#x27;s Embrace", "Étreinte du serpent", "", ""], ["Unit_mName_17200", "Knight of Destruction", "Chevalier de la destruction", "", ""], ["Unit_mName_17218", "Fallen Chopper", "Bourreau déchu", "", ""], ["Unit_mName_17219", "Slaughter", "Carnage", "", ""], ["Unit_mName_17221", "Maw", "Maw", "", ""], ["Unit_mName_17222", "Maw", "Maw", "", ""], ["Unit_mName_2209", "Eirlys", "Eirlys", "", ""], ["Unit_mName_2321", "Sythra", "Sythra", "", ""], ["Unit_mName_34100", "Soul Eater", "Dévoreur d&#x27;âme", "", ""], ["Unit_mName_34103", "Suicide", "Kamizrak", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "Bourreau spectral", "", ""], ["Unit_mName_37114", "Queen Spider", "Reine Arachné", "", ""], ["Unit_mName_37115", "Spider Cocoon", "Cocon d&#x27;araignée", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "Restez à mes côtés, et vous survivrez.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "Dis-moi, crains-tu l&#x27;objet de tes désirs ?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "Pendant notre événement spécial pour l&#x27;Aventurier invétéré, vous pouvez effectuer 1 combat auto. et obtenir deux fois les récompenses au prix d&#x27;une endurance doublée. Rendez vos batailles plus efficaces que jamais !\n\nBonus de combat auto.\n1. Pendant l&#x27;événement, lors des combats auto. dans {name2}, les capitaines peuvent choisir d&#x27;activer le bonus d&#x27;événement : chaque combat consomme {num3} fois l&#x27;endurance mais octroie {num3} fois les récompenses. Ceci vise à améliorer l&#x27;efficacité d&#x27;acquisition de matériaux.\n2. En cas d&#x27;échec d&#x27;un défi, l&#x27;endurance correspondante sera remboursée.\n3. Pendant l&#x27;événement, si le bonus d&#x27;événement est activé, les quêtes de consommation d&#x27;endurance seront calculées selon l&#x27;endurance réellement consommée.\n4. Cependant, les quêtes liées au nombre de victoires ne seront pas affectées par le bonus d&#x27;événement.\n5. Le bonus d&#x27;événement ne s&#x27;applique qu&#x27;aux étapes permettant le combat auto., les Récompenses de première victoire ne sont donc pas incluses dans le bonus de récompense.\n6. Lorsque le bonus est activé, les récompenses seront générées selon des calculs distincts, plutôt que par simple doublement du résultat de 1.\n7. Pour l&#x27;événement Conquête de bravoure, le score de l&#x27;Épreuve de l&#x27;Oracle du Raid de matériaux d&#x27;artefacts/d&#x27;équipement est cohérent avec les obtentions d&#x27;équipement/Météorite, calculé selon la rareté et la quantité d&#x27;équipement/Météorite obtenues après avoir terminé les étapes.\n8. Veuillez noter : pendant le bonus, si les étapes comportent des obtentions aléatoires de jetons d&#x27;événement (comme les dés dans l&#x27;Odyssée des rêves), ces jetons ne seront pas affectés par le bonus.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "L&#x27;Aventurier invétéré est maintenant disponible dans le Raid de matériaux d&#x27;artefacts. Pendant l&#x27;événement, les combats auto. coûtent deux fois plus d&#x27;endurance, mais vous font gagner deux fois plus de récompenses.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "Taux augmenté à durée limitée pour les héros légendaires Numera et Aylin !", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "Taux augmenté à durée limitée pour les héros légendaires Vorn et Artémis !", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "Taux augmenté à durée limitée pour les héros légendaires Nyx et Malvira !", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "Lot d&#x27;apparence &quot;Serpent onirique&quot;", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "&quot;Tya&#x27;s Champion&quot; Valkyra", "Valkyra &quot;Championne de Tya&quot;", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "&quot;The Hollow Husk&quot; Aracha", "Aracha &quot;Coquille creuse&quot;", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "Lot d&#x27;apparence de Sythra", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "Mécaniques de héros : Eirlys", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "Mécaniques de héros : Sythra", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;Dans cet événement d&#x27;invocation divine, les taux d&#x27;obtention de &lt;color=#fdbe36&gt;tous les héros légendaires&lt;/color&gt; sont &lt;color=#b490fc&gt;2&lt;/color&gt; fois supérieurs aux taux d&#x27;origine, et les taux d&#x27;obtention des héros suivants sont multipliés par &lt;color=#b490fc&gt;20&lt;/color&gt; par rapport aux autres héros de la même rareté. Les taux d&#x27;obtention sont égaux entre les autres héros de la même rareté.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;Dans cet événement d&#x27;invocation, lorsque vous obtenez un héros légendaire qui n&#x27;est PAS actuellement à taux augmenté, le taux d&#x27;obtention* de tous les héros à taux augmenté augmentera lors de vos prochaines invocations.&lt;/color&gt; Voici les détails :\n1. La première fois que vous obtenez un héros légendaire qui n&#x27;est PAS à taux augmenté, le taux d&#x27;obtention* de tous les héros à taux augmenté sera multiplié par &lt;color=#b490fc&gt;10&lt;/color&gt; dans vos futures invocations;\n2. Si vous obtenez à nouveau un héros légendaire qui n&#x27;est PAS à taux augmenté, le taux d&#x27;obtention* de tous les héros à taux augmenté sera à nouveau multiplié par &lt;color=#b490fc&gt;10&lt;/color&gt;. Ce bonus cumulatif se poursuivra jusqu&#x27;à ce que vous invoquiez avec succès n&#x27;importe quel héros à taux augmenté.\n&lt;color=#91887c&gt;*Le taux d&#x27;obtention mentionné ci-dessus fait référence à la probabilité relative des héros à taux augmenté par rapport aux autres héros.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Remarque : ce compteur de grâce ne se déclenche qu&#x27;UNE SEULE FOIS pendant cet événement.&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "Effet de soin +<span style=\"color: #1e8852;\">8</span>", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "Régén. de rage (auto) +<span style=\"color: #1e8852;\">1</span>", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -<span style=\"color: #1e8852;\">2</span>", "Coût -<span style=\"color: #1e8852;\">2</span>", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +<span style=\"color: #1e8852;\">300</span>", "ATQ +<span style=\"color: #1e8852;\">300</span>", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "Pénétration +<span style=\"color: #1e8852;\">8 %</span>", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "Même les rayons les plus ténus chassent les ténèbres.", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "La lumière s'épanouit là où nous osons la cultiver.", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "Même face aux tempêtes qui s'amoncellent à l'horizon, ma foi demeure inébranlable.", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "Ne ployez pas sous le joug des prophéties, car la vérité authentique réside en vous.", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "Dans l'éclat de la lumière, tout sera révélé.", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "Ces crocs commencent à s'affûter...", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "Chaque mue me transforme en quelque chose de plus sublime.", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "À genoux, misérable mortel... Je transcende la divinité même.", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "Mon pouvoir n'a point d'antidote.", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent's will!", "Ni chaos, ni ordre... seule règne la volonté du serpent !", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "Augmentation de DGT", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "Souffle serein", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "Prière de soin", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "Prière de soin", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "Prière de soin", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "Prière de soin", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "Prière de soin", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "Âme tourmentée", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "Âme tourmentée", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "Âme tourmentée", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "Âme tourmentée", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "Âme tourmentée", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "DGT +{20,num/100} % (Prend seulement effet si plus puissant que le bonus/malus actuel sur le même attribut.)", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "Confère un bouclier égal à {30,num} % de l'ATQ par seconde, cumulable jusqu'à {31,num} % de l'ATQ.", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "Dissipe 1 malus toutes les 2 s. Lorsqu'Eirlys soigne ses alliés avec Souffle serein, elle obtient {30,num} % de bonus de soin supplémentaire. Jusqu'à 2 alliés avec Souffle serein peuvent être présents sur le terrain.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Lorsque les PV du porteur tombent en dessous de {30,num} %, restaure immédiatement des PV égaux à {31,num} % de l'ATQ du lanceur et retire cet effet. Lorsque la durée d\"effet prend fin naturellement ou se réinitialise, restaure des PV égaux à {32,num} % de l'ATQ du lanceur pour le porteur. Cet effet ne peut pas être dissipé.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Lorsque les PV du porteur tombent en dessous de {30,num} %, restaure immédiatement des PV égaux à {31,num} % de l'ATQ du lanceur et retire cet effet. Lorsque la durée d\"effet prend fin naturellement ou se réinitialise, restaure des PV égaux à {32,num} % de l'ATQ du lanceur pour le porteur. Cet effet ne peut pas être dissipé.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Lorsque les PV du porteur tombent en dessous de {30,num} %, restaure immédiatement des PV égaux à {31,num} % de l'ATQ du lanceur et retire cet effet. Lorsque la durée d\"effet prend fin naturellement ou se réinitialise, restaure des PV égaux à {32,num} % de l'ATQ du lanceur pour le porteur. Cet effet ne peut pas être dissipé.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Lorsque les PV du porteur tombent en dessous de {30,num} %, restaure immédiatement des PV égaux à {31,num} % de l'ATQ du lanceur et retire cet effet. Lorsque la durée d\"effet prend fin naturellement ou se réinitialise, restaure des PV égaux à {32,num} % de l'ATQ du lanceur pour le porteur. Cet effet ne peut pas être dissipé.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Lorsque les PV du porteur tombent en dessous de {30,num} %, restaure immédiatement des PV égaux à {31,num} % de l'ATQ du lanceur et retire cet effet. Lorsque la durée d\"effet prend fin naturellement ou se réinitialise, restaure des PV égaux à {32,num} % de l'ATQ du lanceur pour le porteur. Cet effet ne peut pas être dissipé.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "Inflige des DGT M. de ZdE 1 fois jusqu'à {31,num} ennemis devant, y compris les unités en l'air. Poussée puissante inflige {32,num} % de vulnérabilité (DGT M.) aux ennemis pendant {33,num} s.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "Lance embrasée ignore {30,num} % de la DÉF de l'ennemi. Anneau uNiversel rebondit {31,num} fois supplémentaire(s) et peut toucher la même cible plusieurs fois. Lame yin-yang exécute les monstres normaux avec des PV inférieurs à {32,num} %.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Tire rapidement sur 1 ennemi à portée d'ATQ de son propriétaire, pouvant initialement tirer {30,num} fois, infligeant {31,num} % de DGT à chaque tir. L'Âme tourmentée périt après avoir effectué tous les tirs. Priorise les cibles aériennes. Chaque fois que la flèche touche une cible éliminée, elle récupère un compte de retour. Jusqu'à {32,num} peuvent exister sur le champ de bataille.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Tire rapidement sur 1 ennemi à portée d'ATQ de son propriétaire, pouvant initialement tirer {30,num} fois, infligeant {31,num} % de DGT à chaque tir. L'Âme tourmentée périt après avoir effectué tous les tirs. Priorise les cibles aériennes. Chaque fois que la flèche touche une cible éliminée, elle récupère un compte de retour. Jusqu'à {32,num} peuvent exister sur le champ de bataille.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot { e la flèche touche une cible éliminée, elle récupère un compte de retour. Jusqu'à {32,num} peuvent exister sur le champ de bataille.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participez au Raid d'équipement I pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Participez au Raid d'équipement II pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Participez au Raid d'équipement III pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Invoquez des héros pour remporter des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "Améliorez le niveau, le niveau d'étoile, le grade ou les compétences des héros pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Participez à des raids de matériaux d'artefacts pour gagner des trophées à échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participez au Raid d'équipement I pour gagner des trophées et échanger des récompenses.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Classement ultime de l'Arrivée des héros", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "L'héritage perdu", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Chambre forte des sables", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Palais oublié", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Arrivée des héros", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Entraînement de héros", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Mystère d'artefacts", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "L'héritage perdu", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Chapitre d'histoire", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Chapitre des défis", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "IP du domaine public", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Invasion de zombies", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Changement de chaînes en cours...", "", ""], ["CommonText_mMessage_24292", "Challenges", "Défis", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">Clés de voûte d'épreuve</span><br>Les clés de voûte d'épreuve peuvent être obtenues dans divers modes de jeu. Ces clés existent en différents types et niveaux, chacune contenant des inscriptions anciennes uniques. Insérez-les dans l'autel pour ouvrir des chemins vers leurs épreuves correspondantes. <br><br><span style=\"color: #cec2b1;\">Règles de défi</span><br>Chaque combat comporte plusieurs vagues de monstres. Vaincre chaque vague vous permet d'obtenir un coffre au trésor. Une fois le combat lancé, il ne peut pas être recommencé. Si vous quittez le combat avant la fin, les récompenses seront calculées en fonction de votre progression actuelle. Vous pouvez consommer jusqu'à 200 clés de voûte par mois pour les défis d'épreuve. Une fois cette limite atteinte, aucun autre défi n'est possible pendant le mois en cours.<br><br><span style=\"color: #cec2b1;\">Énergie des clés de voûte</span><br>Chaque clé de voûte possède une énergie spécifique. <span style=\"color: #fdbe36;\">1 point d'énergie est consommé par tentative d'épreuve.</span> À la fin du combat, si la clé de voûte possède encore de l'énergie restante, vous pouvez choisir de renoncer aux récompenses et partir, puis consommer à nouveau de l'énergie pour recommencer l'épreuve. La consommation d'énergie ne compte pas dans la limite mensuelle de clés de voûte.<br><br><span style=\"color: #cec2b1;\">Détruire une clé de voûte</span><br>Vous pouvez détruire les clés de voûte qui répondent aux exigences de niveau de destruction. La destruction des clés de voûte ne donne aucune récompense et ne compte pas dans la limite mensuelle de consommation de clés de voûte.<br><span style=\"color: #fd4540;\">Les clés de voûte d'épreuve ont une limite d'inventaire. Une fois plein, vous ne pourrez plus obtenir d'autres clés de voûte. Veuillez les utiliser régulièrement pour garder de l'espace disponible.</span>", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Cristal moussu", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Cristal ardent", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Une fois le combat lancé, il ne peut pas être recommencé. Si vous quittez en cours de combat, le règlement sera immédiatement effectué et l'énergie consommée ne sera pas restituée !", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Une région volcanique où la lave jaillit pendant l'apocalypse. Davantage de héros de plateforme sont nécessaires pour repousser les forces maléfiques apocalyptiques.", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">Voulez-vous vraiment renvoyer ce joueur du poste de maréchal ?</span><br>Chaque guilde peut avoir jusqu'à {num1} maréchaux, chacun obtenant {num2} attaque(s) supplémentaire(s) par tour.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Points du tour", "", ""], ["CommonText_mMessage_26126", "Destroy", "Détruire", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Voulez-vous détruire {name} ?<br><span style=\"color: #fd4540;\">Les clés de voûte détruites ne peuvent pas être récupérées et ne donnent aucun objet.</span>", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "Clé de voûte détruite.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Énergie :", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Abandonner et quitter", "", ""], ["CommonText_mMessage_26131", "Claim", "Récupérer", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Énergie de clé de voûte restante :", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Galerie de combat", "", ""], ["CommonText_mMessage_26134", "Guides", "Guides", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Clé de voûte en apparition :", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Cristal moussu", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Cristal ardent", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Afficher uniquement les tags de la clé de voûte actuelle", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Les héros les plus populaires sont calculés selon les taux de sélection, à titre indicatif uniquement.", "", ""], ["CommonText_mMessage_26140", "Search", "Recherche", "", ""], ["CommonText_mMessage_26141", "Search Results", "Résultats de recherche", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Chargement des données...", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Collecte des données de héros", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Veuillez saisir au moins {num} caractère(s)", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "Aucun tag correspondant trouvé.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "Le combat auto. n'est pas disponible pour le niveau actuel de clé de voûte.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Vous pouvez télécharger des enregistrements de combat auto. après avoir manuellement terminé la vague {num}.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "Le combat auto. peut échouer en raison de tags de clé de voûte différents. Souhaitez-vous continuer avec le combat auto. ?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Télécharger cette bataille comme nouvel enregistrement de combat auto. ?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "En raison des tags de clés de voûte différents, nous vous recommandons de sélectionner la formation la plus complète possible pour télécharger le combat auto. !", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "L'inventaire de clés de voûte est plein. Utilisez-en certaines avant d'en acheter davantage.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Nettoyer", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "Des coffres de clés de voûte aléatoires non ouverts ont été détectés dans votre inventaire. Voulez-vous les ouvrir maintenant ?", "", ""], ["CommonText_mMessage_26154", "Go", "Aller", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Niv. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level's Keystone cannot be destroyed.", "La clé de voûte de ce niveau ne peut pas être détruite.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Êtes-vous sûr de vouloir détruire <span style=\"color: #fd4540;\">{num}</span> Clé(s) de voûte ?<br><span style=\"color: #fd4540;\">Les Clés de voûte détruites ne peuvent pas être récupérées et n'accorderont aucun objet.</span>", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "{num} clé(s) de voûte détruite(s).", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Utilisation mensuelle :", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Les clés de voûte ont une limite mensuelle de défis. Aucune tentative supplémentaire n'est permise après avoir atteint cette limite.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "Des récompenses sont disponibles pour la difficulté actuelle. Voulez-vous vraiment essayer une difficulté différente ?<br><span style=\"color: #e04242;\">Pendant l'événement, vous ne pouvez choisir qu'une seule difficulté par jour pour récupérer des récompenses.</span>", "", ""], ["CommonText_mMessage_26162", "Don't remind me again.", "Ne pas me rappeler.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "L'inventaire de clés de voûte est plein. Veuillez en utiliser avant d'en débloquer d'autres.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "La version de la rediffusion ne correspond pas à la version actuelle et ne peut pas être visionnée.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Veuillez saisir jusqu'à {num} caractère(s).", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Héros populaires", "", ""], ["CommonText_mMessage_26167", "Tag", "Tag", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Inventaire de clés de voûte d'épreuve plein", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "Réduit la vit. de déplacement du Dévoreur d'âme de 30. Il est <span style=\"color: #fd4540;\">immunisé contre le ralentissement</span>.", "", ""], ["Difficulty_mDetail_73003", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "Le Savant de la Tour Blanche entre en <span style=\"color: #fd4540;\">état d'invisibilité</span> et devient visible lorsqu'il est bloqué.", "", ""], ["Difficulty_mDetail_73004", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "Le Savant de la Tour Blanche devient <span style=\"color: #fd4540;\">immunisé contre les DGT M.</span>", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "Le Petit arachnidé gagne un <span style=\"color: #fd4540;\">effet d'inflexibilité</span> pendant 3 s après sa mort et devient <span style=\"color: #fd4540;\">immunisé contre le contrôle et le ralentissement</span>.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "Le Petit arachnidé <span style=\"color: #fd4540;\">récupère 50 % de ses PV</span> toutes les 5 s.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "La <span ars randomly on the battlefield each wave.", "Le Garde d'or apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "Le Golem géant apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "L'Archer squelette apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "La Prêtresse de la pluie apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "Le Gardien doré apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "L'Inquisiteur doré apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "Le Kamizrak apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "Le Fossoyeur des dunes apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "La Mouche guérisseuse apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "Le Sycophante diabolique apparaît aléatoirement sur le champ de bataille à chaque vague.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "(3 équipements) En infligeant un coup crit. avec une ATQ basique, augmente les DGT du héros de 10 % pendant 8 s, cumulable jusqu'à 5 fois.", "", ""], ["HeroStory_mStory_2209", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "\"Elle se déplace comme un souvenir que je n'ai pas mérité, mais que je convoite éternellement.\"<br>-Rivenhald<br><br>Ils l'ont envoyée vers le nord, où les neiges qui tombaient sur son front pourraient la plier de nouveau à leur cause.<br><br>Autrefois prêtresse d'Elyndris, Eirlys officiait au cœur des rites ancestraux, sa voix entrelacée dans le souffle même des dieux. Mais quelque chose s'est brisé. Elle a fait un choix que personne n'osait nommer, et le sanctuaire ne pardonnait pas sans exiger son tribut.<br><br>La cité elfique avait passé des mois à panser ses plaies après les flammes de l'assaut dévastateur de Moriden. Bien que le raz-de-marée ait été repoussé, les cicatrices demeuraient, et avec elles, une révélation terrifiante : ils n'étaient plus intouchables. Leurs tours majestueuses s'étaient fissurées. Leurs mythes avaient saigné. Elyndris avait désormais besoin d'ombres pour se faufiler là où les étendards ne pouvaient plus s'aventurer. Alors les voyants tournèrent leur regard vers l'horizon. Silencieusement. Méticuleusement. Cherchant des refuges au-delà des cartes anciennes, où leur peuple pourrait se dissimuler si la guerre resurgissait.<br><br>Le Nord de Tya, glacial et désolé, s'éleva dans leurs augures tel un glaive émergeant des neiges éternelles. Ils connaissaient Harz, mais n'osaient pas provoquer un homme d'une telle renommée. Rivenhald, en revanche, régnait sur des contrées glaciales inconnues de leurs éclaireurs. C'était un seigneur de guerre sans en porter le titre, un monarque qui ne s'inclinait devant aucune couronne hormis la sienne. Ils devaient percer ses mystères. Découvrir si sa puissance pouvait être détournée. Ou, si nécessaire, si elle pouvait être brisée aisément.<br><br>Eirlys était leur réponse. Sans attaches, elle n'était ni diplomate ni espionne, mais quelque chose de plus subtil. Elle fut envoyée armée de demi-vérités et d'un serment sacré : gagner sa confiance, lire dans son âme, et rapporter ce qui demeure invisible de loin. Elle arriva drapée de blanc, sa présence justifiée comme une mission de maintien de la paix. Une guérisseuse errante. Une prêtresse du givre. Et Rivenhald, qui se méfiait de tout le monde, lui accorda sa confiance.<br><br>Elle sut se rendre indispensable. Soigna les blessures, déchiffra les présages, ne laissa filtrer aucune trace d'intentions dissimulées. Il l'observait. Elle lui rendait son regard. Aucun des deux ne cillait.<br><br>Les frontières entre eux s'estompèrent avec le temps, s'entremêlant tout en demeurant inébranlables. Elle apprit à décrypter ses silences, les contours de sa colère, l'étrange miséricorde qu'il enfouissait sous sa rudesse. La nuit, quand le feu se consumait lentement et qu'aucun message ne pouvait être envoyé, elle imaginait parfois un avenir où il pourrait presque mériter sa confiance, où il pourrait signifier davantage pour elle... mais l'aube consumait invariablement ces chimères.<br><br>Comme Rivenhald, elle aussi entrevoit comment tout finira : deux silhouettes dans la neige, impassibles et inflexibles. Une lame doit tomber. Une cause doit s'éteindre. Et dans la brume sanglante avant que le vent n'emporte tout, ils comprendront le prix de la survie... et ce qu'ils représentent véritablement l'un pour l'autre.<br><br>Mais Eirlys sait ce que les voyants d'Elyndris ne lui ont jamais révélé. Le Nord n'appartient à personne. Ni aux rois. Ni aux cités. Et certainement pas à des fantômes comme elle. Quel que soit l'avenir qui les attend, il ne sera pas bâti sur la confiance, mais sur ce qui survit une fois celle-ci anéantie. <br><br>Elle incarne le silence entre deux tempêtes, guettant l'heure où l'une devra inévitablement briser l'autre.", "", ""], ["HeroStory_mStory_2321", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "\"Tu me supplieras de te dévorer. Et je t'accorderai la merci.\"<br>—Sifflé depuis les feuillages<br><br>Dans les jungles de jade de Tya, où les racines s'abreuvent de sang et les arbres étranglent les vivants, rampait jadis un esprit d'ombre et de venin, un serpent dont le nom n'était prononcé qu'en murmures : Sythra... bien qu'à cette époque, elle n'eût point de chair. Seulement des crocs, la faim, et le souvenir d'un nom.<br><br>L'Empire lézardin, une civilisation antique dont les cités d'obsidienne fendaient autrefois la canopée et divisaient les vallées, s'était depuis longtemps évanoui dans l'étendue verdoyante. Cependant, dans leur ultime heure, ils avaient déversé leur dernière magie dans d'imposantes idoles, des statues de puissantes créatures sculptées avec dévotion, ornées d'ocre et de cendre, abandonnées en offrande aux esprits de la jungle, dans l'espoir que leurs suppliques soient entendues.<br><br>Hélas, seul le silence leur répondit.<br><br>Pourtant, alors que la métropole s'effondrait, engloutie par l'assaut de la végétation, ces idoles perdurèrent, voilées de mousse, à demi consumées, mais vivantes d'échos agités. En effet, des esprits habitaient ces figurines : les âmes des vivants données en offrande aux esprits de la jungle, enchaînées par la sorcellerie des lézardins. Les malheureux et naïfs errants de ce labyrinthe feuillu qui tombaient sur ces figurines connaissaient une fin rapide, car il s'agissait en réalité d'autels sacrificiels, capables d'invoquer de puissantes divinités. Sythra était l'une de ces divinités, une déesse serpentine et vestige de l'ancien empire, un sifflement qui s'enroulait dans l'esprit des faibles et des blessés.<br><br>Pourtant, elle demeurait pure essence... jusqu'à ce que Dassomi la trouve.<br><br>Le célèbre mystique lézardin avait longtemps cru que les rêves étaient un pont vers de plus grandes vérités. En quête de sagesse perdue dans les recoins oubliés du monde, Dassomi s'aventura dans la jungle, suivant des visions de serpents et d'autels, attiré vers un temple envahi par la végétation comme dans un rêve profond à demi remémoré. Là, au cœur de cette ruine, il brûla de l'encens et glissa entre les mondes... et Sythra répondit.<br><br>Aucune trace ne subsiste de ce qui se passa entre eux. Que Dassomi se soit offert lui-même, ou qu'il ait simplement ouvert un portail trop grand, le résultat resta le même : Sythra abandonna son incorporéité pour renaître dans le monde. L'Étreinte du serpent fut réanimée.<br><br>Obéissant à la loi de la jungle, Sythra chasse tous ceux qui revendiquent la supériorité : les vertueux, les purs, les inflexibles. Elle se glisse dans leurs temples et leurs palais, leur offrant un dernier choix : se soumettre... ou être dévorés. Sythra espère voir sa dynastie serpentine s'élever à nouveau, crochets acérés et glorieuse, couronnée de jungle et d'os. Elle rêve de citadelles tapissées de lierre et de venin, d'un monde foulé uniquement par ceux qui ont abandonné leur faiblesse, bu profondément son poison, et dont la souffrance les rend magnifiques.<br><br>Sythra reste vénérée à ce jour, bien que ses cultes soient dispersés et secrets... et à en croire certains, menés par Dassomi en personne. Ils se marquent de crocs, glissent du venin sur leurs langues, et rêvent d'extase à travers la douleur, dans une adoration rendue divine. Ils prient pour être choisis pour le festin, car être choisi, c'est être vu, être chassé, être aimé. Être embrassé par le Serpent, c'est sentir le pouvoir s'enrouler autour de son âme, abandonner la faiblesse comme une peau morte, et renaître. Ceux qui survivent à sa morsure deviennent ses chasseresses : mortelles, magnifiques et entièrement dévouées.<br><br>Et dans cet instant sacré entre le souffle et la morsure, quand la flèche plane juste au-dessus de leur cœur, ils murmureront tous la même chose :<br>\"Merci.\"", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Voile de neige", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "Le plus doux des poisons", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Héroïne : Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Héros : Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaranteed within 200 summons!", "Sélectionnez 1 héros exclusif à l'événement pour rejoindre l'événement. Le héros exclusif sélectionné a un taux d'obtention augmenté et est garanti sous 200 invocations !", "", ""], ["Item_mItemDesc_31097", "<span style=\"color: #eadca2;\">Special Summon Offer</span><br><br>Get the necessary materials for Hero Summon", "<span style=\"color: #eadca2;\">Offre spéciale d'invocation</span><br><br>Obtenez les matériaux nécessaires pour l'invocation de héros.", "", ""], ["Item_mItemDesc_3334", "<span style=\"color: #498a40;\">Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).</span>", "<span style=\"color: #498a40;\">Cadre d'avatar exclusif pour le classement ultime de l'Arrivée des héros (Saison des Nés-du-serpent).</span>", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen's Clues 1-5.", "Indice inconnu d'Erlang Shen. Une fois obtenu, il se transformera automatiquement en un indice aléatoire parmi les indices 1 à 5 d'Erlang Shen.", "", ""], ["Item_mItemDesc_3521", "Erlang Shen's Clue 2.<br><span style=\"color: #498a40;\">Usage: Consume this item via Fate's Chapters to unlock the corresponding clue.</span>", "Indice 2 d'Erlang Shen.<br><span style=\"color: #498a40;\">Utilisation : à consommer dans Chapitres du destin pour débloquer l'i entent en fonction du nombre de cumuls de Peste spectrale. Les ennemis atteints par 5 cumuls de Peste spectrale seront immédiatement éliminés.", "", ""], ["Skill_mSkillDesc_1908301_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Donne un coup de griffes, infligeant des DGT à tous les héros à 1 case vers l'avant.", "", ""], ["Skill_mSkillDesc_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Donne un coup de griffes, infligeant des DGT à tous les héros à 1 case vers l'avant.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Lorsque la Renarde à neuf queues subit des DGT mortels, elle s'enfuit du champ de bataille et active ses queues sur le terrain pour attaquer. Lorsque les queues sont vaincues, la Renarde à neuf queues revient sur le champ de bataille. Quand toutes les queues sur le terrain sont vaincues, la Renarde à neuf queues se transforme et invoque un grand nombre de renards.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige des DGT M. à la dernière unité déployée sur le champ de bataille, en ciblant prioritairement les Gardiens.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige des DGT M. à la dernière unité déployée sur le champ de bataille, en ciblant prioritairement les Gardiens.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for <span style=\"color: #4A9DF2;\">1</span> ally within the Basic ATK Range and immediately grants this ally a shield equal to <span style=\"color: #4A9DF2;\">{skm1}%</span> of their Max HP c ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target.", "Lorsqu'une unité bat en retraite, meurt, ou que l'invocation de l'héroïne périt à portée, son ATQ augmente de <span style=\"color: #4A9DF2;\">{skm1} %</span> pendant <span style=\"color: #4A9DF2;\">{skm2}</span> s. Sa prochaine ATQ basique inflige <span style=\"color: #4A9DF2;\">{skm3} %</span> de DGT et applique <span style=\"color: #fd4540;\">[200052,param15]</span> à la cible.", "", ""], ["Skill_mSkillSimpleDesc_232150_1", "When a unit retreats, dies, or the hero's summon perishes in range, her ATK increases by <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. Her next Basic ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target. If triggered when the hero's HP is below <span style=\"color: #4A9DF2;\">{skm4}%</span>, the duration is extended by <span style=\"color: #4A9DF2;\">{skm5}</span> sec, and the ATK Increase is raised to <span style=\"color: #4A9DF2;\">{skm6}%</span>.", "Lorsqu'une unité bat en retraite, meurt, ou que l'invocation de l'héroïne périt à portée, son ATQ augmente de <span style=\"color: #4A9DF2;\">{skm1} %</span> pendant <span style=\"color: #4A9DF2;\">{skm2}</span> s. Sa prochaine ATQ basique inflige <span style=\"color: #4A9DF2;\">{skm3} %</span> de DGT et applique <span style=\"color: #fd4540;\">[200052,param15]</span> à la cible. Si cet effet se déclenche quand les PV de l'héroïne sont inférieurs à <span style=\"color: #4A9DF2;\">{skm4} %</span>, la durée est prolongée de <span style=\"color: #4A9DF2;\">{skm5}</span> s, et l'augmentation d'ATQ passe à <span style=\"color: #4A9DF2;\">{skm6} %</span>.", "", ""], ["Skill_mSkillSimpleDesc_232160_1", "<span style=\"color: #28d37c;\">[23211,1]</span>'s ATK has a(n) <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to increase the number of shots by <span style=\"color: #4A9DF2;\">{skm2}</span>. Killing a target can increase it by <span style=\"color: #4A9DF2;\">{skm3}</span> time(s).", "L'ATQ de <span style=\"color: #28d37c;\">[23211,1]</span> a <span style=\"color: #4A9DF2;\">{skm1} %</span> de chances d'augmenter le nombre de tirs de <span style=\"color: #4A9DF2;\">{skm2}</span>. Éliminer une cible peut multiplier les chances par <span style=\"color: #4A9DF2;\">{skm3}</span>.", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero's DMG by <span style=\"color: #4A9DF2;\">{skm1}%</span>, with an additional <span style=\"color: #4A9DF2;\">{skm2}%</span> against Elite and Boss units, lasting for <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "Lorsque le talent est déclenché, augmente les DGT du héros de <span style=\"color: #4A9DF2;\">{skm1} %</span>, avec <span style=\"color: #4A9DF2;\">{skm2} %</span> supplémentaires contre les unités d'élite et de boss, durant <span style=\"color: #4A9DF2;\">{skm3}</span> s.", "", ""], ["Skill_mSkillSimpleDesc_232180_1", "Every <span style=\"color: #4A9DF2;\">{skm1}</span> time(s) the hero's Basic ATK deals DMG, it also triggers the Talent effect.", "L'ATQ basique du héros déclenche également l'effet de talent toutes les <span style=\"color: #4A9DF2;\">{skm1}</span> fois qu'elle inflige des DGT.", "", ""], ["Skill_mSkillSimpleDesc_232198_1", "Increases DMG in the Arena by <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "DGT dans l'arène augmentés de <span style=\"color: #4A9DF2;\">{skm1} %</span>.", "", ""], ["Skill_mSkillSimpleDesc_630614_1", "Jungle Master heals 2 allies at a time.", "Le Maître de la jungle soigne 2 alliés à la fois.", "", ""], ["Skin_mSkinName_2209000", "Default", "Par défaut", "", ""], ["Skin_mSkinName_2321000", "Default", "Par défaut", "", ""], ["Stage_mStageDesc_9102013", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Seuls les ès avoir accumulé de la puissance.", "", ""], ["Unit_mDescribe_17221", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "Autrefois paladin vertueux dévoué au soleil, il a été mystérieusement corrompu.", "", ""], ["Unit_mDescribe_17222", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "Autrefois paladin vertueux dévoué au soleil, il a été mystérieusement corrompu.", "", ""], ["Unit_mDescribe_34100", "An unblockable spectral remnant immune to Control effects.", "Un vestige spectral imparable immunisé contre les effets de contrôle.", "", ""], ["Unit_mDescribe_34102", "Turned from soldiers killed in battle.", "Issus de soldats tués au combat.", "", ""], ["Unit_mDescribe_34103", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "Se sacrifie volontiers pour le bien de sa race, explosant en rencontrant des ennemis et infligeant des DGT massifs aux ennemis à proximité.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. <color=#ff4500>Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.</color>", "Mutés et déchaînés, ces rongeurs mutants. <color=#ff4500>Ils entrent dans une folle frénésie lorsqu'ils sont attaqués, augmentant leur vit. de déplacement.</color>", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Des guerriers squelettes armés de haches géantes, animés par un ressentiment rendant leur attaque encore plus puissante.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "La reine arachné est capable de cracher de la soie et d'engendrer de nombreuses petites araignées dont elle renforce les attributs.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Il massacre sans pitié tout ce qui se trouve sur son chemin de sa lourde masse.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Un combattant fou qui erre dans le donjon et aime décapiter les gens.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Il massacre sans pitié tout ce qui se trouve sur son chemin de sa lourde masse.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Avec sa tenaille en os géante, cet impitoyable gardien cannibale inflige un saignement continu à ses ennemis.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Avec sa tenaille en os géante, cet impitoyable gardien cannibale inflige un saignement continu à ses ennemis.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Un vestige spectral qui ne peut être ni bloqué ni ralenti et qui doit être éliminé rapidement.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Issus de soldats tués au combat.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Pleins de sacs d'acide, les Kamizraks aiment se recroqueviller et rouler vers l'avant.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "Mutés et déchaînés, ces rongeurs mutants se déplacent plus rapidement lorsqu'ils sont attaqués.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Des guerriers squelettes armés de haches géantes, animés par un ressentiment rendant leur attaque encore plus puissante.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "Vivant sous terre, elle y est le véritable monarque, capable de reproduire et de contrôler les petites araignées dont elle renforce les attributs durant les batailles. Sa soie est si résistante qu'une fois pris au piège, il est quasiment impossible de s'en libérer.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team's Rage Regen.", "Eirlys, prêtresse elfe exilée. Soigne les blessures graves par ses prières, dissipe les malus, sauve ses alliés au bord de la mort et accélère la régén. de rage de l'équipe.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent's Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "Un vestige de l'ancien monde, Sythra, l'Étreinte du serpent, erre dans la Jungle. Elle invoque des âmes tourmentées pour attaquer avec une férocité croissante, ignorant la DÉF pour dévorer ses ennemis.", "", ""], ["Unit_mHeroDesignation_2209", "Winter's Mercy", "Clémence de l'hiver", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent's Embrace", "Étreinte du serpent", "", ""], ["Unit_mName_17200", "Knight of Destruction", "Chevalier de la destruction", "", ""], ["Unit_mName_17218", "Fallen Chopper", "Bourreau déchu", "", ""], ["Unit_mName_17219", "Slaughter", "Carnage", "", ""], ["Unit_mName_17221", "Maw", "Maw", "", ""], ["Unit_mName_17222", "Maw", "Maw", "", ""], ["Unit_mName_2209", "Eirlys", "Eirlys", "", ""], ["Unit_mName_2321", "Sythra", "Sythra", "", ""], ["Unit_mName_34100", "Soul Eater", "Dévoreur d'âme", "", ""], ["Unit_mName_34103", "Suicide", "Kamizrak", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "Bourreau spectral", "", ""], ["Unit_mName_37114", "Queen Spider", "Reine Arachné", "", ""], ["Unit_mName_37115", "Spider Cocoon", "Cocon d'araignée", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "Restez à mes côtés, et vous survivrez.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "Dis-moi, crains-tu l'objet de tes désirs ?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid's Oracle's Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "Pendant notre événement spécial pour l'Aventurier invétéré, vous pouvez effectuer 1 combat auto. et obtenir deux fois les récompenses au prix d'une endurance doublée. Rendez vos batailles plus efficaces que jamais !\n\nBonus de combat auto.\n1. Pendant l'événement, lors des combats auto. dans {name2}, les capitaines peuvent choisir d'activer le bonus d'événement : chaque combat consomme {num3} fois l'endurance mais octroie {num3} fois les récompenses. Ceci vise à améliorer l'efficacité d'acquisition de matériaux.\n2. En cas d'échec d'un défi, l'endurance correspondante sera remboursée.\n3. Pendant l'événement, si le bonus d'événement est activé, les quêtes de consommation d'endurance seront calculées selon l'endurance réellement consommée.\n4. Cependant, les quêtes liées au nombre de victoires ne seront pas affectées par le bonus d'événement.\n5. Le bonus d'événement ne s'applique qu'aux étapes permettant le combat auto., les Récompenses de première victoire ne sont donc pas incluses dans le bonus de récompense.\n6. Lorsque le bonus est activé, les récompenses seront générées selon des calculs distincts, plutôt que par simple doublement du résultat de 1.\n7. Pour l'événement Conquête de bravoure, le score de l'Épreuve de l'Oracle du Raid de matériaux d'artefacts/d'équipement est cohérent avec les obtentions d'équipement/Météorite, calculé selon la rareté et la quantité d'équipement/Météorite obtenues après avoir terminé les étapes.\n8. Veuillez noter : pendant le bonus, si les étapes comportent des obtentions aléatoires de jetons d'événement (comme les dés dans l'Odyssée des rêves), ces jetons ne seront pas affectés par le bonus.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "L'Aventurier invétéré est maintenant disponible dans le Raid de matériaux d'artefacts. Pendant l'événement, les combats auto. coûtent deux fois plus d'endurance, mais vous font gagner deux fois plus de récompenses.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera & Aylin!", "Taux augmenté à durée limitée pour les héros légendaires Numera et Aylin !", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn & Artemis!", "Taux augmenté à durée limitée pour les héros légendaires Vorn et Artémis !", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx & Malvira!", "Taux augmenté à durée limitée pour les héros légendaires Nyx et Malvira !", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "Lot d'apparence \"Serpent onirique\"", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "\"Tya's Champion\" Valkyra", "Valkyra \"Championne de Tya\"", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "\"The Hollow Husk\" Aracha", "Aracha \"Coquille creuse\"", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "Lot d'apparence de Sythra", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "Mécaniques de héros : Eirlys", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "Mécaniques de héros : Sythra", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&amp;X15_Desc_01", "<color=#91887c>In this Divine Summoning event, the drop rates of <color=#fdbe36>all Legendary heroes</color> are <color=#b490fc>2</color> times the original rates, and the drop rates of the following heroes are multiplied by <color=#b490fc>20</color> compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.</color>\n\n<color=#91887c><color=#b3732b>In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.</color> Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by <color=#b490fc ement.</color></color>", "", ""]],

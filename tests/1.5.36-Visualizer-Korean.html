s no chaos, no order… only the serpent&#x27;s will!", "질서도 혼돈도 잊어버리고 뱀의 의지에 굴복하여라!", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "피해 증가", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "고요한 숨결", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "피해 {20,num/100}% 증가, 동일 유형 효과 중 가장 높은 효과만 적용", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "1초마다 자신 공격력의 {30,num}%만큼 실드를 획득한다. 실드량은 자신의 공격력 {31,num}%를 초과할 수 없다.", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "2초마다 디버프 효과 1개를 제거한다. 에일리스가 고요한 숨결을 보유한 아군을 치유할 시, 치유 보너스가 추가로 {30,num}% 상승한다. 필드에 최대 2명의 고요한 숨결을 보유한 아군이 존재할 수 있다.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "소지자의 HP가 {30,num}% 이하로 감소할 시, 즉시 시전 rewards.", "장비 던전 III에 참여해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "영웅을 소환해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes&#x27; skills to win trophies and redeem rewards.", "영웅을 레벨업, 승급, 진급시키고 스킬을 레벨업하여 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "아티팩트 재료 던전에 참여해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "장비 던전 I에 참여해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "영웅 강림 정상 랭킹", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "잃어버린 유산", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "모래바다 보물창고", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "잃어버린 땅", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "영웅 강림", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "영웅 육성", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "아티팩트 비경", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "잃어버린 유산", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "스토리 챕터", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "도전 챕터", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "퍼블릭 도메인 IP", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "좀비 포위 완료!", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "채널 전환 중", "", ""], ["CommonText_mMessage_24292", "Challenges", "전투 회차", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;시련의 석판&lt;/color&gt;게임 내 다양한 콘텐츠를 통해 시련의 석판을 획득할 수 있습니다. 석판은 여러 유형과 등급이 있으며, 석판마다 서로 다른 별자리 암호가 담겨있습니다. 이를 제단에 장착하면 해당 시련으로 향하는 통로가 열립니다.&lt;color=&quot;#cec2b1&quot;&gt;도전 설명&lt;/color&gt;각 전투는 여러 웨이브의 몬스터가 있으며, 웨이브를 클리어할 때마다 보물상자 보상을 획득합니다. 전투 시작 후에는 재시작이 불가능하며, 도중 퇴장할 시 현재까지의 전투 진행도에 따라 결산됩니다. 매월 200개의 석판을 소모하여 시련에 도전할 수 있으며, 상한에 도달하면 해당 월에는 더 이상 도전할 수 없습니다.&lt;color=&quot;#cec2b1&quot;&gt;석판 에너지&lt;/color&gt;각 석판은 특정 에너지를 보유하고 있으며, &lt;color=&quot;#fdbe36&quot;&gt;시련 진입 시마다 에너지 1pt가 차감됩니다.&lt;/color&gt; 전투 종료 시 석판에 에너지가 남아있다면, 이번 보상을 포기하고 퇴장한 뒤 에너지를 다시 소모하여 시련을 재개할 수 있습니다. 에너지 소모는 월간 석판 소모량에 포함되지 않습니다.&lt;color=&quot;#cec2b1&quot;&gt;석판 파괴&lt;/color&gt;파괴 조건에 부합하는 석판을 파괴할 수 있습니다. 석판 파괴 시에는 어떤 보상도 획득하지 못하며, 월간 석판 소모량에도 포함되지 않습니다.&lt;color=&quot;#fd4540&quot;&gt;보유할 수 있는 석판에는 수량 제한이 있습니다. 석판 가방이 가득 차면 더 이상 획득할 수 없으니, 제때 사용해 주시기 바랍니다.&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "비밀 열쇠", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "용암 석판", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "전투 시작 후에는 재시작이 불가능하며, 도중에 퇴장 시 즉시 결산되어 소모된 에너지가 반환되지 않습니다!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "종말이 찾아와 용암이 들끓는 화산 지대입니다. 종말의 사악한 힘을 저지하기 위해서는 더 많은 플랫폼 영웅이 필요합니다.", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;해당 플레이어의 통솔자 직책을 해임하시겠습니까?&lt;/color&gt;\\n각 길드는 최대 {num1}명의 통솔자를 보유할 수 있으며, 통솔자는 각 라운드에서 공격 횟수가 {num2}회 증가합니다.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "이번 포인트", "", ""], ["CommonText_mMessage_26126", "Destroy", "파괴", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "{name}을(를) 파괴하시겠습니까?\\n&lt;color=&quot;#fd4540&quot;&gt;석판 파괴 후에는 복구할 수 없으며, 아이템을 획득하지 못합니다.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "석판이 파괴됐습니다.", "", ""], ["CommonText_mMessage_26129", "Energy:", "에너지:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "포기하고 나가기", "", ""], ["CommonText_mMessage_26131", "Claim", "보상 수령", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "석판 남은 에너지:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "전투 도감", "", ""], ["CommonText_mMessage_26134", "Guides", "공략", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "등장 석판:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "어둠의 비밀 열쇠", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "용암 석판", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "현재 석판의 태그만 표시", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "인기도는 영웅의 출전 상황에 따른 단순 참고용 수치입니다.", "", ""], ["CommonText_mMessage_26140", "Search", "검색", "", ""], ["CommonText_mMessage_26141", "Search Results", "결과 검색", "", ""], ["CommonText_mMessage_26142", "Loading data...", "데이터 로딩 중", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "영웅 데이터 수집 중", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "최소 {num}자를 입력해 주세요.", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "매칭되는 태그가 없습니다.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "현재 레벨의 석판은 자동 전투가 활성화되지 않았습니다.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "수동으로 {num}번째 웨이브 클리어 후, 자동 전투 기록을 업로드할 수 있습니다.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "석판의 태그가 일치하지 않아 자동 전투가 실패할 수 있습니다. 자동 전투를 진행하시겠습니까?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "이번 전투를 새로운 자동 전투 기록으로 업로드하시겠습니까?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "석판의 태그가 일치하지 않습니다. 종합적인 라인업을 선택하여 자동 전투를 업로드하는 것을 권장해 드립니다!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "석판 가방이 가득 찼습니다. 일정량을 소모한 후에 구매해 주세요.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "정리하기", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "창고에 오픈하지 않은 랜덤 석판 보물상자가 있습니다. 오픈하러 가시겠습니까?", "", ""], ["CommonText_mMessage_26154", "Go", "이동", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Lv.{num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level&#x27;s Keystone cannot be destroyed.", "해당 레벨의 석판은 파괴할 수 없습니다.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Keystone(s)?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "&lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt;개의 석판을 파괴하시겠습니까?\\n&lt;color=&quot;#fd4540&quot;&gt;석판 파괴 후에는 복구할 수 없으며, 아이템을 획득하지 못합니다.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "{num}개의 석판이 파괴됐습니다.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "당월 소모:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "석판은 월간 도전 횟수 상한이 있으며, 상한에 도달하면 더 이상 도전할 수 없습니다.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?\\n&lt;color=&quot;#e04242&quot;&gt;During the event, you can only choose one difficulty per day to claim rewards.&lt;/color&gt;", "현재 난이도에 수령 가능한 보상이 있습니다. 다른 난이도로 이동하여 도전하시겠습니까?\\n&lt;color=&quot;#e04242&quot;&gt;이벤트 기간에는 매일 한 개의 난이도에서만 보상을 수령할 수 있습니다.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26162", "Don&#x27;t remind me again.", "다시 보지 않기", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "석판 가방이 가득 찼습니다. 일정량을 소모한 후에 사용해 주세요.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "영상의 버전이 현재 버전과 일치하지 않아 확인할 수 없습니다.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "최대 {num}자까지 입력할 수 있습니다.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "인기 영웅 등장", "", ""], ["CommonText_mMessage_26167", "Tag", "태그", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "시련의 석판 가방이 가득 찼습니다", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater&#x27;s Movement Spd. by 30. They are &lt;color=&quot;#fd4540&quot;&gt;immune to Slow&lt;/color&gt;.", "영혼 포식자의 이동 속도가 30 감소하며, &lt;color=&quot;#fd4540&quot;&gt;감속 제어 효과를 면역한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73003", "White Tower&#x27;s Scholar enters &lt;color=&quot;#fd4540&quot;&gt;Invisibility&lt;/color&gt; and becomes visible when blocked.", "백탑 학자가 &lt;color=&quot;#fd4540&quot;&gt;은신&lt;/color&gt;을 획득하며, 가드를 받은 후에 모습을 드러낸다.", "", ""], ["Difficulty_mDetail_73004", "White Tower&#x27;s Scholar becomes &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "백탑 학자가 &lt;color=&quot;#fd4540&quot;&gt;마법 피해&lt;/color&gt;를 면역한다.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains &lt;color=&quot;#fd4540&quot;&gt;unyielding effect&lt;/color&gt; for 3 sec upon death and becomes &lt;color=&quot;#fd4540&quot;&gt;immune to Control and Slow&lt;/color&gt;.", "아라크니드가 사망하면 3초간 &lt;color=&quot;#fd4540&quot;&gt;불굴&lt;/color&gt;을 획득하며, &lt;color=&quot;#fd4540&quot;&gt;제어와 감속을 면역한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 5 sec.", "아라크니드가 5초마다 &lt;color=&quot;#fd4540&quot;&gt;자신의 HP를 50% 회복한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "번개 수비병의 &lt;color=&quot;#fd4540&quot;&gt;이동 속도가 30 증가한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is &lt;color=&quot;#fd4540&quot;&gt;immune to DMG taken&lt;/color&gt;, but loses 5% HP per sec.", "번개 수비병은 &lt;color=&quot;#fd4540&quot;&gt;받는 피해를 면역&lt;/color&gt;하지만, 1초마다 HP가 5% 감소한다.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace&#x27;s Fatigue becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "뒤틀린 혀의 허약 효과가 &lt;color=&quot;#fd4540&quot;&gt;영구적&lt;/color&gt;으로 지속된다.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is &lt;color=&quot;#fd4540&quot;&gt;immune to CC Effects&lt;/color&gt;.", "갑옷 코모도가 &lt;color=&quot;#fd4540&quot;&gt;제어 효과를 면역한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction &lt;color=&quot;#fd4540&quot;&gt;when blocked&lt;/color&gt;.", "갑옷 코모도가 &lt;color=&quot;#fd4540&quot;&gt;가드를 받을 때&lt;/color&gt; 물리 및 마법 피해 감소를 추가로 30% 획득한다.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;summons an extra&lt;/color&gt; Ice Vermin.", "서리 사제가 서리 폭발충 1마리를 &lt;color=&quot;#fd4540&quot;&gt;추가로 소환&lt;/color&gt;한다.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;spawns&lt;/color&gt; 3 Ice Vermin &lt;color=&quot;#fd4540&quot;&gt;upon death&lt;/color&gt;.", "서리 사제 &lt;color=&quot;#fd4540&quot;&gt;사망 시&lt;/color&gt;, 서리 폭발충 3마리를 생성한다.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. +50&lt;/color&gt;.", "천둥 수비병이 공격을 멈추고, &lt;color=&quot;#fd4540&quot;&gt;이동 속도가 50 증가한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;ATK is increased by 100%&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;when attacking shields&lt;/color&gt;, deducts 50% of its HP.", "천둥 수비병의 &lt;color=&quot;#fd4540&quot;&gt;공격력이 100% 상승하지만&lt;/color&gt;, &lt;color=&quot;#fd4540&quot;&gt;실드를 공격할 때&lt;/color&gt; 자신의 HP가 50% 차감된다.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "안개 데드아이는 &lt;color=&quot;#fd4540&quot;&gt;마법 피해를 면역한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores &lt;color=&quot;#fd4540&quot;&gt;10% HP&lt;/color&gt; with each ATK.", "안개-세일럼 남작이 공격할 때마다 &lt;color=&quot;#fd4540&quot;&gt;HP를 10% 회복한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73018", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;Cooldown is reduced by 100%&lt;/color&gt;.", "인큐어터의 급속 부화 &lt;color=&quot;#fd4540&quot;&gt;쿨타임이 100% 감소한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73019", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;spawns 2 extra Suicides&lt;/color&gt;.", "인큐어터의 급속 부화가 &lt;color=&quot;#fd4540&quot;&gt;추가로 2마리의 폭발충을 생성한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;drains 10% of the target&#x27;s Rage&lt;/color&gt;.", "번개의 제사장이 대상에게 피해를 입힐 때, &lt;color=&quot;#fd4540&quot;&gt;대상의 분노를 10% 흡수한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;permanently reduces their Max HP by 10%&lt;/color&gt;. This effect can be stacked.", "번개의 제사장이 대상에게 피해를 입힐 때, &lt;color=&quot;#fd4540&quot;&gt;대상의 HP 최대치가 영구적으로 10% 감소하며&lt;/color&gt;, 중첩 가능하다.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces &lt;color=&quot;#fd4540&quot;&gt;healing&lt;/color&gt; received by &lt;color=&quot;#fd4540&quot;&gt;all units in range&lt;/color&gt; by 50%.", "스커지가 &lt;color=&quot;#fd4540&quot;&gt;범위 내 모든 유닛&lt;/color&gt;의 받는 &lt;color=&quot;#fd4540&quot;&gt;치유량&lt;/color&gt;을 50% 감소시킨다.", "", ""], ["Difficulty_mDetail_73023", "Scourge&#x27;s DMG range expands to &lt;color=&quot;#fd4540&quot;&gt;adjacent 2 tiles&lt;/color&gt;.", "스커지의 피해 범위가 &lt;color=&quot;#fd4540&quot;&gt;주위 2바퀴&lt;/color&gt;로 확대된다.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to &lt;color=&quot;#fd4540&quot;&gt;blocked targets&lt;/color&gt;.", "안개-고급 심연의 눈이 사망할 시, &lt;color=&quot;#fd4540&quot;&gt;가드한 대상&lt;/color&gt;에게 &lt;color=&quot;#fd4540&quot;&gt;공격력 100%의 마법 피해&lt;/color&gt;를 입힌다.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes &lt;color=&quot;#fd4540&quot;&gt;unblockable&lt;/color&gt;.", "광폭한 변이 쥐가 &lt;color=&quot;#fd4540&quot;&gt;가드 불가&lt;/color&gt; 상태가 된다.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent &lt;color=&quot;#fd4540&quot;&gt;increases Movement Spd. by 30&lt;/color&gt;.", "광폭한 변이 쥐의 &lt;color=&quot;#fd4540&quot;&gt;이동 속도가 30 증가한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "세일럼 남작의 HP가 20% 감소할 때마다, &lt;color=&quot;#fd4540&quot;&gt;물리 및 마법 방어력이 20% 증가한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "워록의 &lt;color=&quot;#fd4540&quot;&gt;이동 속도가 30 증가한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "워록의 HP가 20% 감소할 때마다, &lt;color=&quot;#fd4540&quot;&gt;물리 및 마법 방어력이 20% 증가한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers&#x27; DEF and M. RES. by 30%. &lt;color=&quot;#fd4540&quot;&gt;When under CC Effects, reduces by 50%&lt;/color&gt;.", "초급 파멸자의 물리 및 마법 저항이 30% 상승하며, &lt;color=&quot;#fd4540&quot;&gt;제어 효과를 받으면 50% 감소한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when &lt;color=&quot;#fd4540&quot;&gt;stunned or frozen&lt;/color&gt;.", "초급 파멸자가 &lt;color=&quot;#fd4540&quot;&gt;기절 또는 빙결 상태일 때&lt;/color&gt; 피해를 면역한다.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an &lt;color=&quot;#fd4540&quot;&gt;initial Hitcount Shield&lt;/color&gt;.", "중급 파멸자가 &lt;color=&quot;#fd4540&quot;&gt;초기 횟수 실드&lt;/color&gt;를 획득한다.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer &lt;color=&quot;#fd4540&quot;&gt;gains 5 Movement Spd. each time taking DMG&lt;/color&gt;.", "중급 파멸자가 &lt;color=&quot;#fd4540&quot;&gt;공격받을 때마다 이동 속도가 5 증가한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee&#x27;s Ultrasonic Wave &lt;color=&quot;#fd4540&quot;&gt;DMG increases by 100%&lt;/color&gt; and does not inflict Poison.", "배트윙 밴시의 초음파 &lt;color=&quot;#fd4540&quot;&gt;피해가 100% 증가하며&lt;/color&gt;, 중독을 부여하지 않는다.", "", ""], ["Difficulty_mDetail_73035", "Batwings Banshee&#x27;s Poison effect becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "배트윙 밴시의 중독 효과가 &lt;color=&quot;#fd4540&quot;&gt;영구적으로 지속된다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73036", "Golden Guard &lt;color=&quot;#fd4540&quot;&gt;forcibly removes targets&lt;/color&gt; upon collision.", "골든 가드가 대상과 부딪치면, &lt;color=&quot;#fd4540&quot;&gt;대상을 강제로 제거한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73037", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 15 sec.", "고급 파멸자가 15초마다 &lt;color=&quot;#fd4540&quot;&gt;HP를 50% 회복한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73038", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. increases by 50&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;loses 3% HP&lt;/color&gt; per sec.", "고급 파멸자의 &lt;color=&quot;#fd4540&quot;&gt;이동 속도가 50 증가&lt;/color&gt;하지만, 1초마다 &lt;color=&quot;#fd4540&quot;&gt;HP가 3% 감소한다&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73039", "Smasher Guard&#x27;s ATK will &lt;color=&quot;#fd4540&quot;&gt;forcibly remove targets&lt;/color&gt;.", "망치 수비병의 공격이 &lt;co e to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "&#x27;마치 내가 가진 적 없지만, 영원히 갈망하는 추억처럼.&#x27; \\n—레이븐 홀드\\n\\n그들은 그녀를 북쪽 경계로 보내 극한의 서리와 눈으로 그녀의 의지를 꺾어 다시 &#x27;정도&#x27;로 돌아가게 하려고 했다. \\n\\n에일리스는 한때 에린디스의 성가 사제였다. 고대 의식의 중심에 엄숙히 서서, 그녀의 노랫소리는 신들의 숨결과 어우러졌다. 그러나 신앙이 무너졌을 때, 그녀의 선택은 모든 이가 꺼리는 금기가 되었고, 성소가 용서할 수 없는 배신으로 되었다. \\n\\n모리던 전투 이후 수개월 동안, 에린디스는 전쟁의 잿더미 위에서 재건에 힘썼다. 비록 명계의 신의 군대를 성공적으로 물리쳤지만, 상처 하나하나가 영원히 새겨져 있으며, 이는 요정의 성이 더 이상 견고하지 않다는 충격적인 현실을 일깨웠다. 고향의 탑들이 무너지고 요정의 영광이 피를 흘리는 가운데, 에린디스의 요정들은 족민을 전란의 침입으로부터 보호할 은밀한 피난처를 찾아야 했다. 예언자들은 조용히 시선을 멀리 돌려, 맵 너머 황무지에서 전쟁이 다시 타오를 때의 은신처를 신중히 찾고 있었다. \\n\\n점술의 수정이 갑작스레 북쪽 경계의 윤곽을 비춰주었다. 추위와 황무지, 마치 대륙 끝에 매달린 차가운 고독의 칼날 같았다. 북방 서리의 왕 할츠는 명성이 자자했으며, 그들은 감히 침범할 엄두를 낼 수 없었다. 그리고 요정 정탐꾼들조차 발을 들여놓지 못한 극한의 추위 속에서, 레이븐 홀드가 이 혹한 설원을 지배하고 있었다. 이 용맹한 지도자는 왕관을 쓴 적 없지만, 그의 통치 지위는 흔들림 없었다. 요정들은 이 무관의 왕에 대해 더 깊이 알아야 했다: 요정의 전력으로 그의 권세를 뒤엎을 수 있는가? 정말로 그의 통치를 완전히 무너뜨린다면, 그 대가는 얼마나 될 것인가? \\n\\n그리하여 에일리스가 가장 적합한 바둑알이 되어 버렸다. 사절도 간첩도 아닌, 정교하게 위장된 버림패였다. 족내에서는 그럴듯한 이유로 그녀더러 가라고 명령했고, 신에게 맹세하도록 했다: 레이븐 홀드의 신뢰를 얻고, 그의 인품을 파악하여, 일급 정보를 먼 고향으로 전달하라고. 그리하여 그녀는 순백의 옷을 입고 나타나, 자신이 서리를 관장하는 사제이자 평화를 위해 온 유랑 의사라고 거짓말했다. 하지만 타인을 쉽게 믿지 않는 이 영웅 레이븐 홀드는 정말로 그녀를 받아들인 것이다. \\n\\n그녀는 상처를 치료하고 점을 치며 타향에서 묵묵히 자신의 가치를 증명했고, 은밀한 목적을 깊이 숨겼다. 그는 조용히 지켜보았고, 그녀는 무언으로 바라보았다. 시선이 스치며, 말로 표현할 수 없는 어떤 얽힘이 은밀히 자라나기 시작했다. \\n\\n시간은 서로의 경계를 흐릿하게 만들었지만, 두 사람이 얽힌 운명은 오히려 입장의 대립을 더욱 선명하게 드러냈다. 그녀는 점차 그의 침묵 속에 담긴 깊은 뜻을 읽어내고, 분노가 지닌 온도, 그리고 차갑고 단단한 겉모습 아래 숨겨진 서툰 온기를 느꼈다. 모닥불이 꺼져가고, 밀서조차 전해지기 어려운 깊은 밤에 그녀는 가끔 마음속으로 한 장면을 그려보곤 했다. 어쩌면, 이제는 안심하고 그에게 의지해도 좋을지도 모른다. 어쩌면, 그는 이미 자신에게 더없이 중요한 인연이 되었을지도 모른다... 그러나, 눈부신 새벽빛은 늘 남은 꿈을 불태워 없앤다. \\n\\n레이븐 홀드와 마찬가지로, 그녀 역시 설원 위에서 서로를 향해 결연히 맞선 꿈을 꾼 적이 있다. 아마 그것이 두 사람의 종막일 것이다. 언젠가 한쪽은 칼날을 휘둘러야 하고, 한쪽의 미래는 그 순간 사라질 운명을 지닌다. 찬바람이 피 안개를 걷어내는 순간, 그들은 생존의 대가를 깨닫고, 서로 존재의 의미를 꿰뚫어 보게 될 것이다. \\n\\n에일리스는 예언자들이 명시하지 않은 진실을 분명히 알고 있었다: 북쪽 경계는 결코 누구의 것도 아니다. 어쩌면 누군가가 이곳에서 왕이 되어 패권을 쥐고, 성을 세울 수 있을지 모르겠지만, 북쪽 경계는 결코 그것으로 정복되지 않는다. 그리고 그녀 같은 뿌리 없는 부평초는 결국 그저 스쳐 가는 나그네일 뿐이다. 두 사람을 기다리는 것이 어떤 미래든, 신뢰는 모두 타버릴 것이고, 운명의 수레바퀴는 잿더미를 짓밟고 굴러갈 것이다. \\n\\n그녀는 두 폭풍 사이 틈새의 적막으로, 그중 한쪽이 찢겨 삼켜지는 결말을 고요히 기다리고 있다.", "", ""], ["HeroStory_mStory_2321", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "&quot;넌 내게 삼켜달라 애걸할 것이다. 그리고 나는 네게 자비를 내리겠지.&quot; \\n--정글에서 들려오는 속삭임\\n\\n티야의 초록 정글 속, 뿌리는 피를 마시고, 고목이 뒤얽히며 자란다. 푸른 그림자가 겹겹이 드리운 곳. 그곳에 독과 그림자로 이루어진 영혼 하나가 숨어 있었다. 형체도, 육체도 없었으며, 오직 송곳니와 굶주림, 그리고... 시슬라라는 희미한 이름만을 가지고 있는 존재였다. \\n\\n그녀가 깨어나기 전, 정글은 본래 어느 위대한 고대 제국--스케일킨 제국에 속해 있었다. 흑요석으로 성을 짓고 수관보다도 높은 탑이 있었으며, 냇물이 깊은 계곡을 가로질렀다. 하지만 문명의 마지막 빛 속에서, 스케일킨은 남은 마력을 거대한 석상들에 쏟아부었다. 황토와 재로 기원의 문양을 새겨 넣은 석상은 신수의 형상을 하고 있었으며, 그들은 이를 제물 삼아 정글의 신에게 응답을 구하였다. \\n\\n하지만 응답은 없었다. 오직 침묵뿐이었다. \\n\\n제국은 결국 덩굴에 삼켜져 버렸고, 성은 무너져 버렸다. 모든 것은 다시 숲으로 돌아갔고, 오직 그 석상들만이 숲에 가만히 서 있었다. 석상에는 이끼가 가득했고 반쯤 땅에 묻혀 있었으나, 여전히 속삭임이 들려오는 것만 같았다. 그 신상들 속에는 일찍이 사람의 영혼이 봉인되어 있었다. 스케일킨이 신에게 바치기 위한 공물로 삼기 위해 마법으로 살아있는 사람의 혼을 가둬뒀기 때문이었다. 그리고 실수로 정글에 들어선 여행자가 가까이 다가가기라도 하면, 대부분 그 자리에서 목숨을 잃었다. 이 &#x27;신상&#x27;들은 본래 제사용 그릇이자, 신을 부르는 문이기 때문이었다. 시슬라는 이에 응한 신 중 하나였다. 그녀는 독사의 여신이자 옛 세상의 잔영이었으며, 다친 자와 약한 이들의 꿈에 스며들어 속삭이는 이였다. \\n\\n하지만 그녀도 한때는 그저 망령에 불과했다. 다스미가 그녀를 찾아내기 전까지는 말이다. \\n\\n이 유명한 신비주의자 스케일킨은 꿈이야말로 더 깊은 진리로 통하는 길이라고 믿었다. 그는 잃어버린 지혜를 찾기 위해 정글에 발을 들였고, 뱀과 제단의 환상을 쫓다가 덩굴에 덮인 사원에 이끌렸다. 마치 깊은 꿈에 잠겨있는 것 같은 느낌이었다. 그는 폐허의 중심에서 향을 피웠고, 그 의식은 현실과 환상을 넘나들었다. 그리고 시슬라는 저편에서 부름에 응하여 이곳에 도달했다. \\n\\n그 누구도 그들 사이에 무슨 일이 있었는지 알지 못한다. 다스미가 기꺼이 몸을 바쳤던 걸까? 아니면 실수로 너무 깊은 곳의 문을 열어버린 걸까? 어쨌든 결과는 같았다. 허무에서 빠져나온 시슬라는 다시 세상으로 돌아왔다. 독사의 그림자가 다시 강림한 것이다. \\n\\n이제 그녀는 밀림의 법칙을 따르며 스스로를 고귀하다 여기는 모든 이들을 사냥한다. 정직하고 순수하다던 이들도, 확고하다던 이들도... 모두 그녀의 손아귀에서 벗어날 수 없다. 그녀는 신전과 궁전에 스며들어 마지막 선택지를 제시한다. 굴복할 것인가? 아니면 삼켜질 것인가? 그녀는 송곳니를 드러내고 정글의 왕관을 쓰며, 백골을 왕좌로 삼아 뱀 왕조의 영광을 다시 부활시키고자 한다. 그녀는 덩굴과 독액이 어우러지는 도시를 꿈꾸고 있다. 또한, 만민이 나약함을 버리고 자신의 극독을 마신 뒤, 고통 속에서 새로운 삶을 얻는 모습을 꿈꾸고 있다. \\n\\n그리고 지금도 그녀는 누군가에게 숭배받는다. 신도들은 곳곳으로 흩어져 몸을 숨기고 있지만, 다스미는 여전히 남몰래 이들을 이끌고 있다. 그들은 피부에 송곳니 각인을 새기고 혀끝에 독을 떨어뜨리며, 고통을 제물 삼아 신에 대한 경배 속에서 극한의 쾌락을 쫓는다. 그들은 선택받기를 기도하고 먹이가 되기를 원한다. 왜냐하면 &#x27;선택받는다&#x27;라는 건 신의 눈에 띄어 사냥당할 수 있다는 뜻이며, 그래야만 여신의 은총을 받을 수 있기 때문이다. 독사의 입맞춤을 받는 이는 영혼을 감싸는 힘을 느낄 수 있다. 그리고 마치 뱀이 허물을 벗는 것처럼 나약함을 벗어던지고 새롭게 태어난다. 그녀의 입맞춤에서 살아남는 이들은 그녀에게 선택받아 사냥꾼이 된다. 치명적이고 아름다우며 절대적인 충성을 바치는 존재가 되는 것이다. \\n\\n독의 입맞춤이 소리 없이 숨을 앗아가고, 화살이 심장을 찌르려는 그 순간에... 그들은 &#x27;고마워&#x27;\\n라고 속삭인다. &quot;", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "눈의 베일", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "가장 달콤한 독약", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "영웅: 에일리스", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "영웅: 시슬라", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "한정 영웅 1명을 선택하여 이벤트에 참여할 수 있으며, 선택한 한정 영웅의 드롭 확률이 상승하고, 뽑기 200회 이내에 확정으로 획득한다!", "", ""], ["Item_mItemDesc_31097", "&lt;color=&quot;#eadca2&quot;&gt;Special Summon Offer&lt;/color&gt;\\n\\nGet the necessary materials for Hero Summon", "&lt;color=&quot;#eadca2&quot;&gt;영웅 소환 혜택&lt;/color&gt;\\n\\n영웅 소환의 필수 자원을 획득한다.", "", ""], ["Item_mItemDesc_3334", "&lt;color=&quot;#498a40&quot;&gt;Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).&lt;/color&gt;", "&lt;color=&quot;#498a40&quot;&gt;정상 랭킹-뱀의 혈통 시즌 전용 한정 프레임&lt;/color&gt;", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen&#x27;s Clues 1-5.", "알 수 없는 이랑신의 스토리 단서, 획득 시 이랑신 스토리 단서 1~5 중 1개로 자동 및 랜덤으로 전환된다.", "", ""], ["Item_mItemDesc_3521", "Erlang Shen&#x27;s Clue 2.\\n&lt;color=&quot;#498a40&quot;&gt;Usage: Consume this item via Fate&#x27;s Chapters to unlock the corresponding clue.&lt;/color&gt;", "이랑신의 스토리 단서 2.\\n&lt;color=&quot;#498a40&quot;&gt;사용 방법: [운명의 챕터] 이벤트. 해당 아이템을 소모해 대응하는 단서 해제&lt;/color&gt;", "", ""], ["Item_mItemDesc_3522", "Erlang Shen&#x27;s Clue 3.\\n&lt;color es. Dealing increased DMG based on the number of Spectral Plague stacks. Enemies with 5 stacks of Spectral Plague will be immediately removed.", "정글 몽크가 적의 그림자 독소를 폭발시킨다. 그림자 독소의 스택 수가 높을수록 입히는 피해가 증가하며, 5스택일 경우 바로 제거된다.", "", ""], ["Skill_mSkillDesc_1908301_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "날카로운 발톱을 휘둘러, 앞에 있는 1칸 범위 내 모든 영웅 유닛에게 피해를 입힌다.", "", ""], ["Skill_mSkillDesc_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "날카로운 발톱을 휘둘러, 앞에 있는 1칸 범위 내 모든 영웅 유닛에게 피해를 입힌다.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "구미호는 치명 피해를 받을 때마다 전장을 이탈하며, 동시에 필드에 있는 꼬리가 활성화되어 공격을 시전한다. 꼬리를 처치하면, 구미호가 다시 등장한다. 필드에 있는 모든 꼬리를 처치하면, 구미호는 변신하며 대량의 여우를 소환한다.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "필드에 가장 마지막에 배치된 유닛에게 마법 피해를 입히며, 수호자 직업을 우선으로 선택한다.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "필드에 가장 마지막에 배치된 유닛에게 마법 피해를 입히며, 수호자 직업을 우선으로 선택한다.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally within the Basic ATK Range and immediately grants this ally a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; of their Max HP for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec. The effect can only be triggered 1 time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "일반 공격 범위 내의 아군 &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt;명은 1회의 치명 피해를 면역할 수 있는 기회가 있으며, 즉시 해당 아군 최대 HP의 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;만큼 실드를 획득한다. &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt;초간 지속되며, 스킬은 &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt;초마다 최대 1회 발동된다.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG to up to &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; enemies.", "최대 &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt;명의 적에게 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;의 피해를 입힌다.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, and gains &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Grants allies of the same faction Elddr&#x27;s Talent temporarily. The Ultimate lasts for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "공격력이 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; 증가한다. 자신이 &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;을(를) 획득하며, 필드에 있는 아군 중 같은 진영의 유닛이 일시적인 에르드 재능 효과를 획득한다. 궁극기는 &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt;초간 지속된다.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "공격력 상승 +{sk1}%", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "공격력 상승 +{sk1}%", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; chance to trigger Thunder Hammer, dealing an extra &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; DMG. If the hero has no shield, Thunder Hammer has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; chance to grant a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; ATK.", "일반 공격 시, &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;의 확률로 썬더 해머가 발동되어, 추가로 &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt;의 피해를 입힌다. 자신에게 실드가 없을 경우, 썬더 해머 발동 시 &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt;의 확률로 공격력의 &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt;만큼 실드를 획득한다.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally in range.", "범위 내 아군 &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt;명에게 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;의 &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt;을(를) 부여한다.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_5", "Healing Multiplier +{sk1}%", "치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_1", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322091,param1]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range.", "범위 내 HP 비율이 가장 낮은 아군 &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt;명에게 &lt;color=&quot;#28d37c&quot;&gt;[322091,param1]&lt;/color&gt;을(를) 부여한다.", "", ""], ["Skill_mSkillDesc_220903_2", "Healing Prayer&#x27;s Healing Multiplier +{sk1}%", "유합의 기도 치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_3", "Skill Cost -{sk1}", "스킬 소모 -{sk1}", "", ""], ["Skill_mSkillDesc_220903_4", "Healing Prayer&#x27;s Healing Multiplier +{sk1}%", "유합의 기도 치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_5", "Skill Cost -{sk1}", "스킬 소모 -{sk1}", "", ""], ["Skill_mSkillDesc_220906_1", "&lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally in ATK Range can be immune to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; instance of fatal DMG. If the ally triggering this effect is with &lt;color=&quot;#28d37c&quot;&gt;[322090,param1]&lt;/color&gt;, also gains &lt;color=&quot;#4A9DF2&quot;&gt;immunity&lt;/color&gt; to all DMG for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec. This effect can be triggered at most &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt gt;의 피해를 입히며, 동시에 대상에게 &lt;color=&quot;#fd4540&quot;&gt;[200052,param15]&lt;/color&gt;을(를) 부여하는 효과로 전환된다. 자신의 HP가 &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; 이하일 때 발동되면, 지속 시간이 &lt;color=&quot;#4A9DF2&quot;&gt;{skm5}&lt;/color&gt;초 증가하며, 공격 상승 효과가 &lt;color=&quot;#4A9DF2&quot;&gt;{skm6}%&lt;/color&gt;까지 증가한다.", "", ""], ["Skill_mSkillSimpleDesc_232160_1", "&lt;color=&quot;#28d37c&quot;&gt;[23211,1]&lt;/color&gt;&#x27;s ATK has a(n) &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; chance to increase the number of shots by &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt;. Killing a target can increase it by &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; time(s).", "&lt;color=&quot;#28d37c&quot;&gt;[23211,1]&lt;/color&gt; 공격이 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; 확률로 사격 횟수가 &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt;회 증가하며, 대상 처치 시 &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt;회 증가 가능하다.", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero&#x27;s DMG by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, with an additional &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; against Elite and Boss units, lasting for &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "재능 발동 시, 자신의 피해가 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; 증가하고, 정예와 보스 유닛에 대한 피해가 추가로 &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; 증가하며, &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt;초간 지속된다.", "", ""], ["Skill_mSkillSimpleDesc_232180_1", "Every &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; time(s) the hero&#x27;s Basic ATK deals DMG, it also triggers the Talent effect.", "영웅 자신의 일반 공격으로 피해를 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt;회 입힐 때마다, 재능 효과가 발동된다.", "", ""], ["Skill_mSkillSimpleDesc_232198_1", "Increases DMG in the Arena by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;.", "아레나에서 피해가 &lt;color=&quot;#4A9DF2&quot;&gt;{skm

erClimbTalent_mName_40121_47", "Healer HP Booster", "힐러 HP 증폭", "", ""], ["TowerClimbTalent_mName_40121_48", "Healer HP Booster", "힐러 HP 증폭", "", ""], ["TowerClimbTalent_mName_40121_49", "Healer HP Booster", "힐러 HP 증폭", "", ""], ["TowerClimbTalent_mName_40121_50", "Healer HP Booster", "힐러 HP 증폭", "", ""], ["UILanguage_mKeyValue_Panel_WearPreviewPanel_SubTitle", "Sort", "정렬", "", ""], ["Unit_mDescribe_17200", "He mercilessly butchers everything in his path with a massive mace.", "거대한 망치를 휘두르며 앞을 가로막는 모든 자를 냉정하게 학살한다.", "", ""], ["Unit_mDescribe_17218", "Deals extremely high DMG to the target after charging power.", "차징 후 공격하면, 대상에게 극히 높은 피해를 입힌다.", "", ""], ["Unit_mDescribe_17221", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "한때 태양의 힘을 추종하는 성기사였으나, 이제는 알 수 없는 이유로 타락했다.", "", ""], ["Unit_mDescribe_17222", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "한때 태양의 힘을 추종하는 성기사였으나, 이제는 알 수 없는 이유로 타락했다.", "", ""], ["Unit_mDescribe_34100", "An unblockable spectral remnant immune to Control effects.", "가드할 수 없는 영체의 잔해. 제어를 면역한다.", "", ""], ["Unit_mDescribe_34102", "Turned from soldiers killed in battle.", "전장에서 전사한 병사가 변하여 탄생한 존재.", "", ""], ["Unit_mDescribe_34103", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "적을 만나면 자폭하여 종족을 지키며, 주위의 유닛에게 대량의 피해를 입힌다.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. &lt;color=#ff4500&gt;Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.&lt;/color&gt;", "광폭 상태인 변이 쥐. &lt;color=#ff4500&gt;공격을 받을 경우 난폭에 빠져 이동 속도가 증가한다&lt;/color&gt;.", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "거대한 도끼를 든 스켈레톤 전사. 원한에 조종당해 공격력이 더욱 강해졌다.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "수많은 소형 거미를 부화하는 스파이더 퀸. 거미줄을 내뿜으며, 필드 위 거미의 속성을 강화한다.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "거대한 망치를 휘두르며 앞을 가로막는 모든 자를 냉정하게 학살한다.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "지하성을 떠도는 미친 광전사. 다른 사람의 머리를 베는 것을 낙으로 여긴다.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "거대한 망치를 휘두르며 앞을 가로막는 모든 자를 냉정하게 학살한다.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "잔혹한 식인마 수호자. 거대한 뼈 집게로 적을 공격해 출혈이 멈추지 않게 만든다.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "잔혹한 식인마 수호자. 거대한 뼈 집게로 적을 공격해 출혈이 멈추지 않게 만든다.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "가드할 수 없는 영체의 잔해. 감속되지 않으니, 빠르게 처치해야 한다.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "전장에서 전사한 병사가 변하여 탄생한 존재.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "폭발충이 가득 자란 산액낭, 한껏 움츠려 앞으로 굴러간다.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "광폭 상태인 변이 쥐. 공격을 받으면 가속한다.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "거대한 도끼를 든 스켈레톤 전사. 원한에 조종당해 공격력이 더욱 강해졌다.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "지하 세계의 진정한 여왕. 막강한 부화 능력을 가지고 있어, 부화한 소형 거미에 명령하여 적을 공격하며, 필드 위 모든 거미의 다양한 속성을 강화한다. 매우 튼튼한 거미줄을 내뿜어, 한번 휘감기면 벗어나는 건 거의 불가능하다.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "추방당한 요정 사제 에일리스. 기도로 중상을 치료해 디버프 효과를 제거하고, 동료를 죽음에서 구해내며, 팀 전체의 분노 회복을 가속시킨다.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "구세계의 잔영, 독사의 그림자 시슬라가 정글에서 배회한다. 뱀의 입맞춤을 소환해 공격하며, 점점 거세지는 공세로 방어를 무시하고 적을 탐식한다.", "", ""], ["Unit_mHeroDesignation_2209", "Winter&#x27;s Mercy", "겨울의 자비", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent&#x27;s Embrace", "독사의 그림자", "", ""], ["Unit_mName_17200", "Knight of Destruction", "파멸 나이트", "", ""], ["Unit_mName_17218", "Fallen Chopper", "타락한 처형자", "", ""], ["Unit_mName_17219", "Slaughter", "슬로터", "", ""], ["Unit_mName_17221", "Maw", "마우", "", ""], ["Unit_mName_17222", "Maw", "마우", "", ""], ["Unit_mName_2209", "Eirlys", "에일리스", "", ""], ["Unit_mName_2321", "Sythra", "시슬라", "", ""], ["Unit_mName_34100", "Soul Eater", "영혼 포식자", "", ""], ["Unit_mName_34103", "Suicide", "폭발충", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "스켈레톤 집행자", "", ""], ["Unit_mName_37114", "Queen Spider", "스파이더 퀸", "", ""], ["Unit_mName_37115", "Spider Cocoon", "거미 고치", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "내 곁에 머물러라, 네가 있는 한 그 어떤 위험도 허락하지 않겠다.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "네가 빠져든 욕망이 두려운 적은 없었어?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "보물쟁탈전 오픈! 이벤트 기간에 자동 전투를 1회 진행할 경우, 2배의 체력을 소모하여 2회의 보상을 받아 전투 효율을 높일 수 있습니다!\n\n[자동 전투 배율 보너스]\n1. 이벤트 기간 동안 {name2}에서 자동 전투를 진행할 경우, 이벤트 보너스 적용 여부를 선택할 수 있습니다. 전투 1회당 체력이 {num3}배로 소모되며, {num3}회의 보상을 획득하여 재료 획득 효율이 상승합니다.\n2. 도전 실패 시 대응하는 체력을 반환합니다.\n3. 이벤트 기간에 보너스를 적용할 경우, 체력 소모 관련 퀘스트는 배율이 적용된 체력 소모량으로 계산됩니다.\n4. 이벤트 기간 동안 클리어 횟수 관련 퀘스트는 이벤트 보너스를 적용해도 실제 클리어 횟수로 계산됩니다.\n5. 이벤트 보너스는 자동 전투가 가능한 스테이지에만 적용되므로, 스테이지 첫 클리어 보상은 배율 보너스가 적용되지 않습니다.\n6. 이벤트 드롭 보너스에 확률성 보상이 포함된 경우, 1회 자동 전투에 대해 2회의 판정이 이루어지며 특정 전투의 보상 내용이 복제되지 않습니다.\n7. 용사의 원정 이벤트에서 장비/아티팩트 재료 던전 주제인 오라클 시련의 포인트와 장비/운석 드롭은 동일하게 유지되며, 스테이지 종료 후 드롭된 장비/운석의 등급과 수량에 따라 포인트가 계산됩니다.\n8. 배율 보너스 기간 동안 스테이지에서 이벤트 토큰이 랜덤 드롭되는 경우(신기한 여행의 주사위 등), 이벤트 토큰에는 배율 보너스가 적용되지 않으니 이 점에 유의해 주시기 바랍니다.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "아티팩트 재료 던전 보물쟁탈전 오픈! 이벤트 기간 동안 자동 전투를 1회 진행할 시 2배의 체력을 소모하여 2회의 보상을 받을 수 있습니다.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "레전더리 영웅 「누메라 및 에일린」 기간 한정 확률 UP", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "레전더리 영웅 「페르네 및 아르테미스」 한정 UP", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "레전더리 영웅 「닉스 및 말비라」 기간 한정 확률 UP", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "&#x27;드림 스네이크&#x27; 스킨 패키지", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "&quot;Tya&#x27;s Champion&quot; Valkyra", "바크라-극광의 심판", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "&quot;The Hollow Husk&quot; Aracha", "아라샤-허무한 잔재", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "시슬라 스킨 패키지", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "영웅 콘텐츠: 에일리스", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "영웅 콘텐츠: 시슬라", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;이번 신성 소환 이벤트에서는 &lt;color=#fdbe36&gt;모든 5성 레전더리 영웅&lt;/color&gt;의 소환 획득 확률이 &lt;color=#b490fc&gt;2&lt;/color&gt;배 상승합니다. 동시에 다음 확률 UP 영웅들의 소환 획득 확률이 동일 등급의 다른 영웅들보다 &lt;color=#b490fc&gt;20&lt;/color&gt;배 상승합니다. 동일 등급의 다른 영웅들의 드롭 확률은 모두 동일합니다.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;본 카드 풀에서 소환 시, 획득한 레전더리 영웅이 확률 UP 영웅이 아닐 경우, 모든 확률 UP 영웅의 소환 확률*이 후속 소환에서 추가로 상승됩니다.&lt;/color&gt;자세한 규칙은 다음과 같습니다:\n1. 본 카드 풀에서 최초로 획득한 레전더리 영웅이 확률 UP 영웅이 아닐 경우, 후속 소환 시 모든 확률 UP 영웅의 소환 확률*이 기존 기준에서 &lt;color=#b490fc&gt;10&lt;/color&gt;배 상승합니다;\n2. 다시 소환하여 획득한 레전더리 영웅이 여전히 확률 UP 영웅이 아닐 경우, 후속 소환 시 모든 확률 UP 영웅의 소환 확률*이 다시 &lt;color=#b490fc&gt;10&lt;/color&gt;배 상승합니다. 이와 같이 확률 UP 영웅을 획득할 때까지 반복됩니다.\n&lt;color=#91887c&gt;위 텍스트의 소환 확률*은 모두 확률 UP 영웅이 다른 영웅들과 비교했을 때의 소환 획득 확률을 의미합니다.&lt;/color&gt;\n\n&lt;color=#df161f&gt;주의: 해당 메커니즘은 본 카드 풀에서 1회만 적용됩니다.&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "치유 효과 +<span style=\"color: #1e8852;\">8</span>", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "자연 분노 회복 +<span style=\"color: #1e8852;\">1</span>", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -<span style=\"color: #1e8852;\">2</span>", "비용 -<span style=\"color: #1e8852;\">2</span>", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +<span style=\"color: #1e8852;\">300</span>", "공격력 +<span style=\"color: #1e8852;\">300</span>", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "관통 +<span style=\"color: #1e8852;\">8%</span>", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "아무리 미약한 빛이라도 어둠을 꿰뚫을 수 있다.", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "마음에 불씨가 있다면, 빛은 스스로 피어난다.", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "폭풍이 몰아쳐도 이 마음만은 흔들리지 않으리.", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "예언에 맹목적으로 따를 이유가 있는가? 참된 진리는 마음 깊은 곳에서 우러난다.", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "빛이 머무는 곳에 어둠이 발 디딜 틈은 없다.", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "더 날카로운 독니, 더 치명적인 나.", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "변화를 받아들이고 새로운 자신을 마주해 봐.", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "비천한 벌레 따위에게는 나의 지고한 위엄을 우러러보는 것도 과분하지.", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "내 극독은 해독제가 없어.", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent's will!", "질서도 혼돈도 잊어버리고 뱀의 의지에 굴복하여라!", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "피해 증가", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "고요한 숨결", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "유합의 기도", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "뱀의 입맞춤", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "피해 {20,num/100}% 증가, 동일 유형 효과 중 가장 높은 효과만 적용", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "1초마다 자신 공격력의 {30,num}%만큼 실드를 획득한다. 실드량은 자신의 공격력 {31,num}%를 초과할 수 없다.", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "2초마다 디버프 효과 1개를 제거한다. 에일리스가 고요한 숨결을 보유한 아군을 치유할 시, 치유 보너스가 추가로 {30,num}% 상승한다. 필드에 최대 2명의 고요한 숨결을 보유한 아군이 존재할 수 있다.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "소지자의 HP가 {30,num}% 이하로 감소할 시, 즉시 시전자 공격력의 {31,num}%만큼 치유를 제공하며 해당 상태를 제거한다. 상태의 지속 시간이 종료되거나 초기화될 때, 소지자에게 시전자 공격력의 {32,num}%만큼 치유를 제공한다. 해당 상태는 제거할 수 없다.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "소지자의 HP가 {30,num}% 이하로 감소할 시, 즉시 시전자 공격력의 {31,num}%만큼 치유를 제공하며 해당 상태를 제거한다. 상태의 지속 시간이 종료되거나 초기화될 때, 소지자에게 시전자 공격력의 {32,num}%만큼 치유를 제공한다. 해당 상태는 제거할 수 없다.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "소지자의 HP가 {30,num}% 이하로 감소할 시, 즉시 시전자 공격력의 {31,num}%만큼 치유를 제공하며 해당 상태를 제거한다. 상태의 지속 시간이 종료되거나 초기화될 때, 소지자에게 시전자 공격력의 {32,num}%만큼 치유를 제공한다. 해당 상태는 제거할 수 없다.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "소지자의 HP가 {30,num}% 이하로 감소할 시, 즉시 시전자 공격력의 {31,num}%만큼 치유를 제공하며 해당 상태를 제거한다. 상태의 지속 시간이 종료되거나 초기화될 때, 소지자에게 시전자 공격력의 {32,num}%만큼 치유를 제공한다. 해당 상태는 제거할 수 없다.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "소지자의 HP가 {30,num}% 이하로 감소할 시, 즉시 시전자 공격력의 {31,num}%만큼 치유를 제공하며 해당 상태를 제거한다. 상태의 지속 시간이 종료되거나 초기화될 때, 소지자에게 시전자 공격력의 {32,num}%만큼 치유를 제공한다. 해당 상태는 제거할 수 없다.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "전방의 최대 {31,num}명의 적에게 범위 마법 피해를 1회 입힌다. 공중 대상을 공격할 수 있으며, 신성한 찌르기는 적에게 {32,num}%의 마법 취약을 부여하고, {33,num}초간 지속된다.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "화첨창이 적의 방어를 {30,num}% 무시한다. 건곤권이 추가로 {31,num}회 바운스 공격하며, 같은 대상에게 중복으로 바운스할 수 있다. 음양검이 HP가 {32,num}% 미만인 일반 몬스터를 참살한다.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "주인의 공격 범위 내 적 1명을 빠르게 사격하며, 초기 상태에서는 {30,num}회 사격 가능하여 매회 {31,num}%의 피해를 입힌다. 모든 횟수를 소모하면, 뱀의 입맞춤은 소멸한다. 공중 대상을 우선 공격한다. 화살이 사망한 대상을 명중하면 횟수가 반환된다. 필드에 최대 {32,num}개까지 존재할 수 있다.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "주인의 공격 범위 내 적 1명을 빠르게 사격하며, 초기 상태에서는 {30,num}회 사격 가능하여 매회 {31,num}%의 피해를 입힌다. 모든 횟수를 소모하면, 뱀의 입맞춤은 소멸한다. 공중 대상을 우선 공격한다. 화살이 사망한 대상을 명중하면 횟수가 반환된다. 필드에 최대 {32,num}개까지 존재할 수 있다.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "주인의 공격 범위 내 적 1명을 빠르게 사격하며, 초기 상태에서는 {30,num}회 사격 가능하여 매회 {31,num}%의 피해를 입힌다. 모든 횟수를 소모하면, 뱀의 입맞춤은 소멸한다. 공중 대상을 우선 공격한다. 화살이 사망한 대상을 명중하면 횟수가 반환된다. 필드에 최대 {32,num}개까지 존재할 수 있다.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "주인의 공격 범위 내 적 1명을 빠르게 사격하며, 초기 상태에서는 {30,num}회 사격 가능하여 매회 {31,num}%의 피해를 입힌다. 모든 횟수를 소모하면, 뱀의 입맞춤은 소멸한다. 공중 대상을 우선 공격한다. 화살이 사망한 대상을 명중하면 횟수가 반환된다. 필드에 최대 {32,num}개까지 존재할 수 있다.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "주인의 공격 범위 내 적 1명을 빠르게 사격하며, 초기 상태에서는 {30,num}회 사격 가능하여 매회 {31,num}%의 피해를 입힌다. 모든 횟수를 소모하면, 뱀의 입맞춤은 소멸한다. 공중 대상을 우선 공격한다. 화살이 사망한 대상을 명중하면 횟수가 반환된다. 필드에 최대 {32,num}개까지 존재할 수 있다.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "장비 던전 I에 참여해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "장비 던전 II에 참여해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "장비 던전 III에 참여해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "영웅을 소환해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "영웅을 레벨업, 승급, 진급시키고 스킬을 레벨업하여 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "아티팩트 재료 던전에 참여해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "장비 던전 I에 참여해 트로피를 얻고 보상으로 교환하세요!", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "영웅 강림 정상 랭킹", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "잃어버린 유산", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "모래바다 보물창고", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "잃어버린 땅", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "영웅 강림", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "영웅 육성", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "아티팩트 비경", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "잃어버린 유산", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "스토리 챕터", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "도전 챕터", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "퍼블릭 도메인 IP", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "좀비 포위 완료!", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "채널 전환 중", "", ""], ["CommonText_mMessage_24292", "Challenges", "전투 회차", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">시련의 석판</span>게임 내 다양한 콘텐츠를 통해 시련의 석판을 획득할 수 있습니다. 석판은 여러 유형과 등급이 있으며, 석판마다 서로 다른 별자리 암호가 담겨있습니다. 이를 제단에 장착하면 해당 시련으로 향하는 통로가 열립니다.<span style=\"color: #cec2b1;\">도전 설명</span>각 전투는 여러 웨이브의 몬스터가 있으며, 웨이브를 클리어할 때마다 보물상자 보상을 획득합니다. 전투 시작 후에는 재시작이 불가능하며, 도중 퇴장할 시 현재까지의 전투 진행도에 따라 결산됩니다. 매월 200개의 석판을 소모하여 시련에 도전할 수 있으며, 상한에 도달하면 해당 월에는 더 이상 도전할 수 없습니다.<span style=\"color: #cec2b1;\">석판 에너지</span>각 석판은 특정 에너지를 보유하고 있으며, <span style=\"color: #fdbe36;\">시련 진입 시마다 에너지 1pt가 차감됩니다.</span> 전투 종료 시 석판에 에너지가 남아있다면, 이번 보상을 포기하고 퇴장한 뒤 에너지를 다시 소모하여 시련을 재개할 수 있습니다. 에너지 소모는 월간 석판 소모량에 포함되지 않습니다.<span style=\"color: #cec2b1;\">석판 파괴</span>파괴 조건에 부합하는 석판을 파괴할 수 있습니다. 석판 파괴 시에는 어떤 보상도 획득하지 못하며, 월간 석판 소모량에도 포함되지 않습니다.<span style=\"color: #fd4540;\">보유할 수 있는 석판에는 수량 제한이 있습니다. 석판 가방이 가득 차면 더 이상 획득할 수 없으니, 제때 사용해 주시기 바랍니다.</span>", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "비밀 열쇠", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "용암 석판", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "전투 시작 후에는 재시작이 불가능하며, 도중에 퇴장 시 즉시 결산되어 소모된 에너지가 반환되지 않습니다!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "종말이 찾아와 용암이 들끓는 화산 지대입니다. 종말의 사악한 힘을 저지하기 위해서는 더 많은 플랫폼 영웅이 필요합니다.", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">해당 플레이어의 통솔자 직책을 해임하시겠습니까?</span><br>각 길드는 최대 {num1}명의 통솔자를 보유할 수 있으며, 통솔자는 각 라운드에서 공격 횟수가 {num2}회 증가합니다.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "이번 포인트", "", ""], ["CommonText_mMessage_26126", "Destroy", "파괴", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "{name}을(를) 파괴하시겠습니까?<br><span style=\"color: #fd4540;\">석판 파괴 후에는 복구할 수 없으며, 아이템을 획득하지 못합니다.</span>", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "석판이 파괴됐습니다.", "", ""], ["CommonText_mMessage_26129", "Energy:", "에너지:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "포기하고 나가기", "", ""], ["CommonText_mMessage_26131", "Claim", "보상 수령", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "석판 남은 에너지:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "전투 도감", "", ""], ["CommonText_mMessage_26134", "Guides", "공략", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "등장 석판:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "어둠의 비밀 열쇠", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "용암 석판", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "현재 석판의 태그만 표시", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "인기도는 영웅의 출전 상황에 따른 단순 참고용 수치입니다.", "", ""], ["CommonText_mMessage_26140", "Search", "검색", "", ""], ["CommonText_mMessage_26141", "Search Results", "결과 검색", "", ""], ["CommonText_mMessage_26142", "Loading data...", "데이터 로딩 중", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "영웅 데이터 수집 중", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "최소 {num}자를 입력해 주세요.", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "매칭되는 태그가 없습니다.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "현재 레벨의 석판은 자동 전투가 활성화되지 않았습니다.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "수동으로 {num}번째 웨이브 클리어 후, 자동 전투 기록을 업로드할 수 있습니다.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "석판의 태그가 일치하지 않아 자동 전투가 실패할 수 있습니다. 자동 전투를 진행하시겠습니까?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "이번 전투를 새로운 자동 전투 기록으로 업로드하시겠습니까?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "석판의 태그가 일치하지 않습니다. 종합적인 라인업을 선택하여 자동 전투를 업로드하는 것을 권장해 드립니다!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "석판 가방이 가득 찼습니다. 일정량을 소모한 후에 구매해 주세요.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "정리하기", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "창고에 오픈하지 않은 랜덤 석판 보물상자가 있습니다. 오픈하러 가시겠습니까?", "", ""], ["CommonText_mMessage_26154", "Go", "이동", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Lv.{num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level's Keystone cannot be destroyed.", "해당 레벨의 석판은 파괴할 수 없습니다.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "<span style=\"color: #fd4540;\">{num}</span>개의 석판을 파괴하시겠습니까?<br><span style=\"color: #fd4540;\">석판 파괴 후에는 복구할 수 없으며, 아이템을 획득하지 못합니다.</span>", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "{num}개의 석판이 파괴됐습니다.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "당월 소모:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "석판은 월간 도전 횟수 상한이 있으며, 상한에 도달하면 더 이상 도전할 수 없습니다.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "현재 난이도에 수령 가능한 보상이 있습니다. 다른 난이도로 이동하여 도전하시겠습니까?<br><span style=\"color: #e04242;\">이벤트 기간에는 매일 한 개의 난이도에서만 보상을 수령할 수 있습니다.</span>", "", ""], ["CommonText_mMessage_26162", "Don't remind me again.", "다시 보지 않기", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "석판 가방이 가득 찼습니다. 일정량을 소모한 후에 사용해 주세요.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "영상의 버전이 현재 버전과 일치하지 않아 확인할 수 없습니다.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "최대 {num}자까지 입력할 수 있습니다.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "인기 영웅 등장", "", ""], ["CommonText_mMessage_26167", "Tag", "태그", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "시련의 석판 가방이 가득 찼습니다", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "영혼 포식자의 이동 속도가 30 감소하며, <span style=\"color: #fd4540;\">감속 제어 효과를 면역한다</span>.", "", ""], ["Difficulty_mDetail_73003", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "백탑 학자가 <span style=\"color: #fd4540;\">은신</span>을 획득하며, 가드를 받은 후에 모습을 드러낸다.", "", ""], ["Difficulty_mDetail_73004", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "백탑 학자가 <span style=\"color: #fd4540;\">마법 피해</span>를 면역한다.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "아라크니드가 사망하면 3초간 <span style=\"color: #fd4540;\">불굴</span>을 획득하며, <span style=\"color: #fd4540;\">제어와 감속을 면역한다</span>.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "아라크니드가 5초마다 <span style=\"color: #fd4540;\">자신의 HP를 50% 회복한다</span>.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "번개 수비병의 <span style=\"color: #fd4540;\">이동 속도가 30 증가한다</span>.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is <span style=\"color: #fd4540;\">immune to DMG taken</span>, but loses 5% HP per sec.", "번개 수비병은 <span style=\"color: #fd4540;\">받는 피해를 면역</span>하지만, 1초마다 HP가 5% 감소한다.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace's Fatigue becomes <span style=\"color: #fd4540;\">permanent</span>.", "뒤틀린 혀의 허약 효과가 <span style=\"color: #fd4540;\">영구적</span>으로 지속된다.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is <span style=\"color: #fd4540;\">immune to CC Effects</span>.", "갑옷 코모도가 <span style=\"color: #fd4540;\">제어 효과를 면역한다</span>.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction <span style=\"color: #fd4540;\">when blocked</span>.", "갑옷 코모도가 <span style=\"color: #fd4540;\">가드를 받을 때</span> 물리 및 마법 피해 감소를 추가로 30% 획득한다.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric <span style=\"color: #fd4540;\">summons an extra</span> Ice Vermin.", "서리 사제가 서리 폭발충 1마리를 <span style=\"color: #fd4540;\">추가로 소환</span>한다.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric <span style=\"color: #fd4540;\">spawns</span> 3 Ice Vermin <span style=\"color: #fd4540;\">upon death</span>.", "서리 사제 <span style=\"color: #fd4540;\">사망 시</span>, 서리 폭발충 3마리를 생성한다.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains <span style=\"color: #fd4540;\">Movement Spd. +50</span>.", "천둥 수비병이 공격을 멈추고, <span style=\"color: #fd4540;\">이동 속도가 50 증가한다</span>.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard's <span style=\"color: #fd4540;\">ATK is increased by 100%</span>, but <span style=\"color: #fd4540;\">when attacking shields</span>, deducts 50% of its HP.", "천둥 수비병의 <span style=\"color: #fd4540;\">공격력이 100% 상승하지만</span>, <span style=\"color: #fd4540;\">실드를 공격할 때</span> 자신의 HP가 50% 차감된다.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "안개 데드아이는 <span style=\"color: #fd4540;\">마법 피해를 면역한다</span>.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores <span style=\"color: #fd4540;\">10% HP</span> with each ATK.", "안개-세일럼 남작이 공격할 때마다 <span style=\"color: #fd4540;\">HP를 10% 회복한다</span>.", "", ""], ["Difficulty_mDetail_73018", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">Cooldown is reduced by 100%</span>.", "인큐어터의 급속 부화 <span style=\"color: #fd4540;\">쿨타임이 100% 감소한다</span>.", "", ""], ["Difficulty_mDetail_73019", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">spawns 2 extra Suicides</span>.", "인큐어터의 급속 부화가 <span style=\"color: #fd4540;\">추가로 2마리의 폭발충을 생성한다</span>.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">drains 10% of the target's Rage</span>.", "번개의 제사장이 대상에게 피해를 입힐 때, <span style=\"color: #fd4540;\">대상의 분노를 10% 흡수한다</span>.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">permanently reduces their Max HP by 10%</span>. This effect can be stacked.", "번개의 제사장이 대상에게 피해를 입힐 때, <span style=\"color: #fd4540;\">대상의 HP 최대치가 영구적으로 10% 감소하며</span>, 중첩 가능하다.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces <span style=\"color: #fd4540;\">healing</span> received by <span style=\"color: #fd4540;\">all units in range</span> by 50%.", "스커지가 <span style=\"color: #fd4540;\">범위 내 모든 유닛</span>의 받는 <span style=\"color: #fd4540;\">치유량</span>을 50% 감소시킨다.", "", ""], ["Difficulty_mDetail_73023", "Scourge's DMG range expands to <span style=\"color: #fd4540;\">adjacent 2 tiles</span>.", "스커지의 피해 범위가 <span style=\"color: #fd4540;\">주위 2바퀴</span>로 확대된다.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to <span style=\"color: #fd4540;\">blocked targets</span>.", "안개-고급 심연의 눈이 사망할 시, <span style=\"color: #fd4540;\">가드한 대상</span>에게 <span style=\"color: #fd4540;\">공격력 100%의 마법 피해</span>를 입힌다.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes <span style=\"color: #fd4540;\">unblockable</span>.", "광폭한 변이 쥐가 <span style=\"color: #fd4540;\">가드 불가</span> 상태가 된다.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent <span style=\"color: #fd4540;\">increases Movement Spd. by 30</span>.", "광폭한 변이 쥐의 <span style=\"color: #fd4540;\">이동 속도가 30 증가한다</span>.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "세일럼 남작의 HP가 20% 감소할 때마다, <span style=\"color: #fd4540;\">물리 및 마법 방어력이 20% 증가한다</span>.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "워록의 <span style=\"color: #fd4540;\">이동 속도가 30 증가한다</span>.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "워록의 HP가 20% 감소할 때마다, <span style=\"color: #fd4540;\">물리 및 마법 방어력이 20% 증가한다</span>.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers' DEF and M. RES. by 30%. <span style=\"color: #fd4540;\">When under CC Effects, reduces by 50%</span>.", "초급 파멸자의 물리 및 마법 저항이 30% 상승하며, <span style=\"color: #fd4540;\">제어 효과를 받으면 50% 감소한다</span>.", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when <span style=\"color: #fd4540;\">stunned or frozen</span>.", "초급 파멸자가 <span style=\"color: #fd4540;\">기절 또는 빙결 상태일 때</span> 피해를 면역한다.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an <span style=\"color: #fd4540;\">initial Hitcount Shield</span>.", "중급 파멸자가 <span style=\"color: #fd4540;\">초기 횟수 실드</span>를 획득한다.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer <span style=\"color: #fd4540;\">gains 5 Movement Spd. each time taking DMG</span>.", "중급 파멸자가 <span style=\"color: #fd4540;\">공격받을 때마다 이동 속도가 5 증가한다</span>.", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee's Ultrasonic Wave <span style=\"color: #fd4540;\">DMG increases by 100%</span> and does not inflict Poison.", "배트윙 밴시의 초음파 <span style=\"color: #fd4540;\">피해가 100% 증가하며</span>, 중독을 부여하지 않는다.", "", ""], ["Difficulty_mDetail_73035", "Batwings Banshee's Poison effect becomes <span style=\"color: #fd4540;\">permanent</span>.", "배트윙 밴시의 중독 효과가 <span style=\"color: #fd4540;\">영구적으로 지속된다</span>.", "", ""], ["Difficulty_mDetail_73036", "Golden Guard <span style=\"color: #fd4540;\">forcibly removes targets</span> upon collision.", "골든 가드가 대상과 부딪치면, <span style=\"color: #fd4540;\">대상을 강제로 제거한다</span>.", "", ""], ["Difficulty_mDetail_73037", "Supreme Destroyer <span style=\"color: #fd4540;\">restores 50% HP</span> every 15 sec.", "고급 파멸자가 15초마다 <span style=\"color: #fd4540;\">HP를 50% 회복한다</span>.", "", ""], ["Difficulty_mDetail_73038", "Supreme Destroyer <span style=\"color: #fd4540;\">Movement Spd. increases by 50</span>, but <span style=\"color: #fd4540;\">loses 3% HP</span> per sec.", "고급 파멸자의 <span style=\"color: #fd4540;\">이동 속도가 50 증가</span>하지만, 1초마다 <span style=\"color: #fd4540;\">HP가 3% 감소한다</span>.", "", ""], ["Difficulty_mDetail_73039", "Smasher Guard's ATK will <span style=\"color: #fd4540;\">forcibly remove targets</span>.", "망치 수비병의 공격이 <span style=\"color: #fd4540;\">대상을 강제로 제거한다</span>.", "", ""], ["Difficulty_mDetail_73040", "When losing 80% HP, Smasher Guard will fall into Petrification for 15 sec, gaining <span style=\"color: #fd4540;\">massive DMG Reduction</span> and continuously <span style=\"color: #fd4540;\">restoring HP</span> during Petrification.", "망치 수비병이 HP의 80%를 잃으면, 15초간 석화 상태에 빠진다. 석화 기간 동안 <span style=\"color: #fd4540;\">대량의 피해 감소</span>를 획득하며, 지속적으로 <span style=\"color: #fd4540;\">HP를 회복한다</span>.", "", ""], ["Difficulty_mDetail_74001", "Jungle Master's Basic ATK hits <span style=\"color: #fd4540;\">5</span> enemy targets each time.", "정글 몽크의 일반 공격이 매번 <span style=\"color: #fd4540;\">5</span>개의 대상을 선택한다.", "", ""], ["Difficulty_mDetail_74002", "While Jungle Master is on the battlefield, restores <span style=\"color: #fd4540;\">50% HP to all enemies</span> on the battlefield every 10 sec.", "정글 몽크가 필드에 있을 때, 10초마다 필드에 있는 <span style=\"color: #fd4540;\">모든 적의 HP를 50% 회복시킨다</span>.", "", ""], ["Difficulty_mDetail_74003", "When Jungle Master dies, all enemies on the battlefield gain <span style=\"color: #fd4540;\">Invincibility for 10 sec</span>.", "정글 몽크 사망 시, 전장의 모든 적이 <span style=\"color: #fd4540;\">10초간 무적</span>을 획득한다.", "", ""], ["Difficulty_mDetail_74004", "Enemies <span style=\"color: #fd4540;\">adjacent</span> to Jungle Master gain <span style=\"color: #fd4540;\">25% HP Regen per sec</span>.", "정글 몽크 <span style=\"color: #fd4540;\">주위 한 바퀴</span> 범위 내 적이 <span style=\"color: #fd4540;\">초당 HP 25% 회복</span>을 획득한다.", "", ""], ["Difficulty_mDetail_74005", "Queen Spider's snare targets increase to <span style=\"color: #fd4540;\">3</span>.", "스파이더 퀸의 속박 대상이 <span style=\"color: #fd4540;\">3</span>명으로 증가한다.", "", ""], ["Difficulty_mDetail_74006", "Queen Spider spawns <span style=\"color: #fd4540;\">3 Suicides</span> each time she enters spawning.", "스파이더 퀸이 산란할 때마다, <span style=\"color: #fd4540;\">폭발충 3마리</span>를 생성한다.", "", ""], ["Difficulty_mDetail_74007", "Queen Spider spawns <span style=\"color: #fd4540;\">8 Small Arachnids</span> each time she enters spawning.", "스파이더 퀸이 산란할 때마다, <span style=\"color: #fd4540;\">아라크니드 8마리</span>를 생성한다.", "", ""], ["Difficulty_mDetail_74008", "Queen Spider spawns <span style=\"color: #fd4540;\">2 Suicides</span> when she dies.", "스파이더 퀸 사망 시, <span style=\"color: #fd4540;\">폭발충 2마리</span>를 생성한다.", "", ""], ["Difficulty_mDetail_74009", "Enemies <span style=\"color: #fd4540;\">adjacent</span> to Scythe of Doom gain <span style=\"color: #fd4540;\">80% DMG Reduction</span>.", "파멸의 낫 <span style=\"color: #fd4540;\">주위 한 바퀴</span> 범위 내 적군이 <span style=\"color: #fd4540;\">80%의 피해 감소</span>를 획득한다.", "", ""], ["Difficulty_mDetail_74010", "Scythe of Doom's Acidic Venom <span style=\"color: #fd4540;\">instantly creates a toxic bloodstain</span> at hit locations.", "파멸의 낫의 독 숨결을 맞은 대상은 그 위치에 <span style=\"color: #fd4540;\">즉시 독혈이 생성된다</span>.", "", ""], ["Difficulty_mDetail_74011", "Scythe of Doom leaves <span style=\"color: #fd4540;\">a toxic bloodstain</span> when it dies.", "파멸의 낫 사망 시, <span style=\"color: #fd4540;\">독혈 1개</span>를 남긴다.", "", ""], ["Di c_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "강철 심판관은 웨이브마다 전장에 랜덤으로 출현한다.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "폭발충은 웨이브마다 전장에 랜덤으로 출현한다.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "매장자는 웨이브마다 전장에 랜덤으로 출현한다.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "치유 벌레는 웨이브마다 전장에 랜덤으로 출현한다.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "비뚤어진 추종자는 웨이브마다 전장에 랜덤으로 출현한다.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "(3종 세트) 일반 공격으로 치명타를 입힐 시, 자신의 피해 +10%, 8초간 지속되며, 최대 5스택 중첩 가능", "", ""], ["HeroStory_mStory_2209", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "'마치 내가 가진 적 없지만, 영원히 갈망하는 추억처럼.' <br>—레이븐 홀드<br><br>그들은 그녀를 북쪽 경계로 보내 극한의 서리와 눈으로 그녀의 의지를 꺾어 다시 '정도'로 돌아가게 하려고 했다. <br><br>에일리스는 한때 에린디스의 성가 사제였다. 고대 의식의 중심에 엄숙히 서서, 그녀의 노랫소리는 신들의 숨결과 어우러졌다. 그러나 신앙이 무너졌을 때, 그녀의 선택은 모든 이가 꺼리는 금기가 되었고, 성소가 용서할 수 없는 배신으로 되었다. <br><br>모리던 전투 이후 수개월 동안, 에린디스는 전쟁의 잿더미 위에서 재건에 힘썼다. 비록 명계의 신의 군대를 성공적으로 물리쳤지만, 상처 하나하나가 영원히 새겨져 있으며, 이는 요정의 성이 더 이상 견고하지 않다는 충격적인 현실을 일깨웠다. 고향의 탑들이 무너지고 요정의 영광이 피를 흘리는 가운데, 에린디스의 요정들은 족민을 전란의 침입으로부터 보호할 은밀한 피난처를 찾아야 했다. 예언자들은 조용히 시선을 멀리 돌려, 맵 너머 황무지에서 전쟁이 다시 타오를 때의 은신처를 신중히 찾고 있었다. <br><br>점술의 수정이 갑작스레 북쪽 경계의 윤곽을 비춰주었다. 추위와 황무지, 마치 대륙 끝에 매달린 차가운 고독의 칼날 같았다. 북방 서리의 왕 할츠는 명성이 자자했으며, 그들은 감히 침범할 엄두를 낼 수 없었다. 그리고 요정 정탐꾼들조차 발을 들여놓지 못한 극한의 추위 속에서, 레이븐 홀드가 이 혹한 설원을 지배하고 있었다. 이 용맹한 지도자는 왕관을 쓴 적 없지만, 그의 통치 지위는 흔들림 없었다. 요정들은 이 무관의 왕에 대해 더 깊이 알아야 했다: 요정의 전력으로 그의 권세를 뒤엎을 수 있는가? 정말로 그의 통치를 완전히 무너뜨린다면, 그 대가는 얼마나 될 것인가? <br><br>그리하여 에일리스가 가장 적합한 바둑알이 되어 버렸다. 사절도 간첩도 아닌, 정교하게 위장된 버림패였다. 족내에서는 그럴듯한 이유로 그녀더러 가라고 명령했고, 신에게 맹세하도록 했다: 레이븐 홀드의 신뢰를 얻고, 그의 인품을 파악하여, 일급 정보를 먼 고향으로 전달하라고. 그리하여 그녀는 순백의 옷을 입고 나타나, 자신이 서리를 관장하는 사제이자 평화를 위해 온 유랑 의사라고 거짓말했다. 하지만 타인을 쉽게 믿지 않는 이 영웅 레이븐 홀드는 정말로 그녀를 받아들인 것이다. <br><br>그녀는 상처를 치료하고 점을 치며 타향에서 묵묵히 자신의 가치를 증명했고, 은밀한 목적을 깊이 숨겼다. 그는 조용히 지켜보았고, 그녀는 무언으로 바라보았다. 시선이 스치며, 말로 표현할 수 없는 어떤 얽힘이 은밀히 자라나기 시작했다. <br><br>시간은 서로의 경계를 흐릿하게 만들었지만, 두 사람이 얽힌 운명은 오히려 입장의 대립을 더욱 선명하게 드러냈다. 그녀는 점차 그의 침묵 속에 담긴 깊은 뜻을 읽어내고, 분노가 지닌 온도, 그리고 차갑고 단단한 겉모습 아래 숨겨진 서툰 온기를 느꼈다. 모닥불이 꺼져가고, 밀서조차 전해지기 어려운 깊은 밤에 그녀는 가끔 마음속으로 한 장면을 그려보곤 했다. 어쩌면, 이제는 안심하고 그에게 의지해도 좋을지도 모른다. 어쩌면, 그는 이미 자신에게 더없이 중요한 인연이 되었을지도 모른다... 그러나, 눈부신 새벽빛은 늘 남은 꿈을 불태워 없앤다. <br><br>레이븐 홀드와 마찬가지로, 그녀 역시 설원 위에서 서로를 향해 결연히 맞선 꿈을 꾼 적이 있다. 아마 그것이 두 사람의 종막일 것이다. 언젠가 한쪽은 칼날을 휘둘러야 하고, 한쪽의 미래는 그 순간 사라질 운명을 지닌다. 찬바람이 피 안개를 걷어내는 순간, 그들은 생존의 대가를 깨닫고, 서로 존재의 의미를 꿰뚫어 보게 될 것이다. <br><br>에일리스는 예언자들이 명시하지 않은 진실을 분명히 알고 있었다: 북쪽 경계는 결코 누구의 것도 아니다. 어쩌면 누군가가 이곳에서 왕이 되어 패권을 쥐고, 성을 세울 수 있을지 모르겠지만, 북쪽 경계는 결코 그것으로 정복되지 않는다. 그리고 그녀 같은 뿌리 없는 부평초는 결국 그저 스쳐 가는 나그네일 뿐이다. 두 사람을 기다리는 것이 어떤 미래든, 신뢰는 모두 타버릴 것이고, 운명의 수레바퀴는 잿더미를 짓밟고 굴러갈 것이다. <br><br>그녀는 두 폭풍 사이 틈새의 적막으로, 그중 한쪽이 찢겨 삼켜지는 결말을 고요히 기다리고 있다.", "", ""], ["HeroStory_mStory_2321", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "\"넌 내게 삼켜달라 애걸할 것이다. 그리고 나는 네게 자비를 내리겠지.\" <br>--정글에서 들려오는 속삭임<br><br>티야의 초록 정글 속, 뿌리는 피를 마시고, 고목이 뒤얽히며 자란다. 푸른 그림자가 겹겹이 드리운 곳. 그곳에 독과 그림자로 이루어진 영혼 하나가 숨어 있었다. 형체도, 육체도 없었으며, 오직 송곳니와 굶주림, 그리고... 시슬라라는 희미한 이름만을 가지고 있는 존재였다. <br><br>그녀가 깨어나기 전, 정글은 본래 어느 위대한 고대 제국--스케일킨 제국에 속해 있었다. 흑요석으로 성을 짓고 수관보다도 높은 탑이 있었으며, 냇물이 깊은 계곡을 가로질렀다. 하지만 문명의 마지막 빛 속에서, 스케일킨은 남은 마력을 거대한 석상들에 쏟아부었다. 황토와 재로 기원의 문양을 새겨 넣은 석상은 신수의 형상을 하고 있었으며, 그들은 이를 제물 삼아 정글의 신에게 응답을 구하였다. <br><br>하지만 응답은 없었다. 오직 침묵뿐이었다. <br><br>제국은 결국 덩굴에 삼켜져 버렸고, 성은 무너져 버렸다. 모든 것은 다시 숲으로 돌아갔고, 오직 그 석상들만이 숲에 가만히 서 있었다. 석상에는 이끼가 가득했고 반쯤 땅에 묻혀 있었으나, 여전히 속삭임이 들려오는 것만 같았다. 그 신상들 속에는 일찍이 사람의 영혼이 봉인되어 있었다. 스케일킨이 신에게 바치기 위한 공물로 삼기 위해 마법으로 살아있는 사람의 혼을 가둬뒀기 때문이었다. 그리고 실수로 정글에 들어선 여행자가 가까이 다가가기라도 하면, 대부분 그 자리에서 목숨을 잃었다. 이 '신상'들은 본래 제사용 그릇이자, 신을 부르는 문이기 때문이었다. 시슬라는 이에 응한 신 중 하나였다. 그녀는 독사의 여신이자 옛 세상의 잔영이었으며, 다친 자와 약한 이들의 꿈에 스며들어 속삭이는 이였다. <br><br>하지만 그녀도 한때는 그저 망령에 불과했다. 다스미가 그녀를 찾아내기 전까지는 말이다. <br><br>이 유명한 신비주의자 스케일킨은 꿈이야말로 더 깊은 진리로 통하는 길이라고 믿었다. 그는 잃어버린 지혜를 찾기 위해 정글에 발을 들였고, 뱀과 제단의 환상을 쫓다가 덩굴에 덮인 사원에 이끌렸다. 마치 깊은 꿈에 잠겨있는 것 같은 느낌이었다. 그는 폐허의 중심에서 향을 피웠고, 그 의식은 현실과 환상을 넘나들었다. 그리고 시슬라는 저편에서 부름에 응하여 이곳에 도달했다. <br><br>그 누구도 그들 사이에 무슨 일이 있었는지 알지 못한다. 다스미가 기꺼이 몸을 바쳤던 걸까? 아니면 실수로 너무 깊은 곳의 문을 열어버린 걸까? 어쨌든 결과는 같았다. 허무에서 빠져나온 시슬라는 다시 세상으로 돌아왔다. 독사의 그림자가 다시 강림한 것이다. <br><br>이제 그녀는 밀림의 법칙을 따르며 스스로를 고귀하다 여기는 모든 이들을 사냥한다. 정직하고 순수하다던 이들도, 확고하다던 이들도... 모두 그녀의 손아귀에서 벗어날 수 없다. 그녀는 신전과 궁전에 스며들어 마지막 선택지를 제시한다. 굴복할 것인가? 아니면 삼켜질 것인가? 그녀는 송곳니를 드러내고 정글의 왕관을 쓰며, 백골을 왕좌로 삼아 뱀 왕조의 영광을 다시 부활시키고자 한다. 그녀는 덩굴과 독액이 어우러지는 도시를 꿈꾸고 있다. 또한, 만민이 나약함을 버리고 자신의 극독을 마신 뒤, 고통 속에서 새로운 삶을 얻는 모습을 꿈꾸고 있다. <br><br>그리고 지금도 그녀는 누군가에게 숭배받는다. 신도들은 곳곳으로 흩어져 몸을 숨기고 있지만, 다스미는 여전히 남몰래 이들을 이끌고 있다. 그들은 피부에 송곳니 각인을 새기고 혀끝에 독을 떨어뜨리며, 고통을 제물 삼아 신에 대한 경배 속에서 극한의 쾌락을 쫓는다. 그들은 선택받기를 기도하고 먹이가 되기를 원한다. 왜냐하면 '선택받는다'라는 건 신의 눈에 띄어 사냥당할 수 있다는 뜻이며, 그래야만 여신의 은총을 받을 수 있기 때문이다. 독사의 입맞춤을 받는 이는 영혼을 감싸는 힘을 느낄 수 있다. 그리고 마치 뱀이 허물을 벗는 것처럼 나약함을 벗어던지고 새롭게 태어난다. 그녀의 입맞춤에서 살아남는 이들은 그녀에게 선택받아 사냥꾼이 된다. 치명적이고 아름다우며 절대적인 충성을 바치는 존재가 되는 것이다. <br><br>독의 입맞춤이 소리 없이 숨을 앗아가고, 화살이 심장을 찌르려는 그 순간에... 그들은 '고마워'<br>라고 속삭인다. \"", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "눈의 베일", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "가장 달콤한 독약", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "영웅: 에일리스", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "영웅: 시슬라", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaranteed within 200 summons!", "한정 영웅 1명을 선택하여 이벤트에 참여할 수 있으며, 선택한 한정 영웅의 드롭 확률이 상승하고, 뽑기 200회 이내에 확정으로 획득한다!", "", ""], ["Item_mItemD c_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "날카로운 발톱을 휘둘러, 앞에 있는 1칸 범위 내 모든 영웅 유닛에게 피해를 입힌다.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "구미호는 치명 피해를 받을 때마다 전장을 이탈하며, 동시에 필드에 있는 꼬리가 활성화되어 공격을 시전한다. 꼬리를 처치하면, 구미호가 다시 등장한다. 필드에 있는 모든 꼬리를 처치하면, 구미호는 변신하며 대량의 여우를 소환한다.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "필드에 가장 마지막에 배치된 유닛에게 마법 피해를 입히며, 수호자 직업을 우선으로 선택한다.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "필드에 가장 마지막에 배치된 유닛에게 마법 피해를 입히며, 수호자 직업을 우선으로 선택한다.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for <span style=\"color: #4A9DF2;\">1</span> ally within the Basic ATK Range and immediately grants this ally a shield equal to <span style=\"color: #4A9DF2;\">{skm1}%</span> of their Max HP for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. The effect can only be triggered 1 time every <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "일반 공격 범위 내의 아군 <span style=\"color: #4A9DF2;\">1</span>명은 1회의 치명 피해를 면역할 수 있는 기회가 있으며, 즉시 해당 아군 최대 HP의 <span style=\"color: #4A9DF2;\">{skm1}%</span>만큼 실드를 획득한다. <span style=\"color: #4A9DF2;\">{skm2}</span>초간 지속되며, 스킬은 <span style=\"color: #4A9DF2;\">{skm3}</span>초마다 최대 1회 발동된다.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals <span style=\"color: #4A9DF2;\">{skm1}%</span> DMG to up to <span style=\"color: #4A9DF2;\">5</span> enemies.", "최대 <span style=\"color: #4A9DF2;\">5</span>명의 적에게 <span style=\"color: #4A9DF2;\">{skm1}%</span>의 피해를 입힌다.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and gains <span style=\"color: #28d37c;\">[321900]</span>. Grants allies of the same faction Elddr's Talent temporarily. The Ultimate lasts for <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "공격력이 <span style=\"color: #4A9DF2;\">{skm1}%</span> 증가한다. 자신이 <span style=\"color: #28d37c;\">[321900]</span>을(를) 획득하며, 필드에 있는 아군 중 같은 진영의 유닛이 일시적인 에르드 재능 효과를 획득한다. 궁극기는 <span style=\"color: #4A9DF2;\">{skm2}</span>초간 지속된다.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "공격력 상승 +{sk1}%", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "공격력 상승 +{sk1}%", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to trigger Thunder Hammer, dealing an extra <span style=\"color: #4A9DF2;\">{skm2}%</span> DMG. If the hero has no shield, Thunder Hammer has a <span style=\"color: #4A9DF2;\">{skm3}%</span> chance to grant a shield equal to <span style=\"color: #4A9DF2;\">{skm4}%</span> ATK.", "일반 공격 시, <span style=\"color: #4A9DF2;\">{skm1}%</span>의 확률로 썬더 해머가 발동되어, 추가로 <span style=\"color: #4A9DF2;\">{skm2}%</span>의 피해를 입힌다. 자신에게 실드가 없을 경우, 썬더 해머 발동 시 <span style=\"color: #4A9DF2;\">{skm3}%</span>의 확률로 공격력의 <span style=\"color: #4A9DF2;\">{skm4}%</span>만큼 실드를 획득한다.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies <span style=\"color: #4A9DF2;\">{skm1}%</span> <span style=\"color: #28d37c;\">[310001]</span> to <span style=\"color: #4A9DF2;\">1</span> ally in range.", "범위 내 아군 <span style=\"color: #4A9DF2;\">1</span>명에게 <span style=\"color: #4A9DF2;\">{skm1}%</span>의 <span style=\"color: #28d37c;\">[310001]</span>을(를) 부여한다.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_5", "Healing Multiplier +{sk1}%", "치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_1", "Applies <span style=\"color: #28d37c;\">[322091,param1]</span> to <span style=\"color: #4A9DF2;\">1</span> ally with the lowest HP percentage in range.", "범위 내 HP 비율이 가장 낮은 아군 <span style=\"color: #4A9DF2;\">1</span>명에게 <span style=\"color: #28d37c;\">[322091,param1]</span>을(를) 부여한다.", "", ""], ["Skill_mSkillDesc_220903_2", "Healing Prayer's Healing Multiplier +{sk1}%", "유합의 기도 치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_3", "Skill Cost -{sk1}", "스킬 소모 -{sk1}", "", ""], ["Skill_mSkillDesc_220903_4", "Healing Prayer's Healing Multiplier +{sk1}%", "유합의 기도 치유 배율 +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_5", "Skill Cost -{sk1}", "스킬 소모 -{sk1}", "", ""], ["Skill_mSkillDesc_220906_1", "<span style=\"color: #4A9DF2;\">1</span> ally in ATK Range can be immune to <span style=\"color: #4A9DF2;\">1</span> instance of fatal DMG. If the ally triggering this effect is with <span style=\"color: #28d37c;\">[322090,param1]</span>, also gains <span style=\"color: #4A9DF2;\">immunity</span> to all DMG for <span style=\"color: #4A9DF2;\">{skm1}</span> sec. This effect can be triggered at most <span style=\"color: #4A9DF2;\">1</span> time every <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "일반 공격 범위 내 아군 <span style=\"color: #4A9DF2;\">1</span>명이 치명 피해를 <span style=\"color: #4A9DF2;\">1</span>회 면역할 수 있다. 해당 아군이 이 효과를 발동할 때 <span style=\"color: #28d37c;\">[322090,param1]</span>을(를) 보유하고 있다면, 동시에 모든 피해를 <span style=\"color: #4A9DF2;\">면역</span>하는 효과를 얻으며, <span style=\"color: #4A9DF2;\">{skm1}</span>초간 지속된다. 해당 효과는 <span style=\"color: #4A9DF2;\">{skm2}</span>초마다 최대 <span style=\"color: #4A9DF2;\">1</span>회 발동할 수 있다.", "", ""], ["Skill_mSkillDesc_220906_2", "DMG Immunity Duration +{sk1}", "피해 면역 시간 +{sk1}", "", ""], ["Skill_mSkillDesc_220906_3", "Trigger Interval -{sk1} sec", "발동 시간 간격 -{sk1}초", "", ""], ["Skill_mSkillDesc_220906_4", "DMG Immunity Duration +{sk1}", "피해 면역 시간 +{sk1}", "", ""], ["Skill_mSkillDesc_220906_5", "Trigger Interval -{sk1} sec", "발동 시간 간격 -{sk1}초", "", ""], ["Skill_mSkillDesc_220916_1", "While the hero is on the field, allies recover an additional <span style=\"color: #4A9DF2;\">{skm1}%</span> Rage per sec. Allies with <span style=\"color: #28d37c;\">[322090,param3]</span> recover <span style=\"color: #4A9DF2;\">{skm2}%</span> Rage per sec instead.", "자신이 필드에 있을 때, 필드의 아군이 1초마다 추가로 <span style=\"color: #4A9DF2;\">{skm1}%</span>의 분노를 회복한다. 만약 <span style=\"color: #28d37c;\">[322090,param3]</span>을(를) 보유하고 있다면, 1초마다 추가로 <span style=\"color: #4A9DF2;\">{skm2}%</span>의 분노를 회복한다.", "", ""], ["Skill_mSkillDesc_220916_2", "Recovery +{sk1}%", "회복량 +{sk1}%", "", ""], ["Skill_mSkillDesc_220916_3", "Recovery +{sk1}%", "회복량 +{sk1}%", "", ""], ["Skill_mSkillDesc_220916_4", "Recovery +{sk1}%", "회복량 +{sk1}%", "", ""], ["Skill_mSkillDesc_220916_5", "Recovery +{sk1}%", "회복량 +{sk1}%", "", ""], ["Skill_mSkillDesc_220930_1", "When healing allies, applies <span style=\"color: #28d37c;\">[322090,param1]</span> to them and grants <span style=\"color: #28d37c;\">[100224]</span> and <span style=\"color: #28d37c;\">[100227]</span> to allies with <span style=\"color: #28d37c;\">[322090,param1]</span>.", "아군을 치유할 때, 해당 아군에게 <span style=\"color: #28d37c;\">[322090,param1]</span>을(를) 부여하며, <span style=\"color: #28d37c;\">[322090,param1]</span>을(를) 보유한 아군에게 <span style=\"color: #28d37c;\">[100224]</span>와(과) <span style=\"color: #28d37c;\">[100227]</span>을(를) 부여한다.", "", ""], ["Skill_mSkillDesc_220950_1", "When healing allies, applies <span style=\"color: #28d37c;\">[322090,param1]</span> to them and grants <span style=\"color: #28d37c;\">[100224]</span> and <span style=\"color: #28d37c;\">[100227]</span> to allies with <span style=\"color: #28d37c;\">[322090,param1]</span>. When healing allies with <span style=\"color: #28d37c;\">[322090,param1]</span>, restores <span style=\"color: #4A9DF2;\">{skm2}%</span> Rage to the caster.", "아군을 치유할 때, 해당 아군에게 <span style=\"color: #28d37c;\">[322090,param1]</span>을(를) 부여하며, <span style=\"color: #28d37c;\">[322090,param1]</span>을(를) 보유한 아군에게 <span style=\"color: #28d37c;\">[100224]</span>와(과) <span style=\"color: #28d37c;\">[100227]</span>을(를) 부여한다. <span style=\"color: #28d37c;\">[322090,param1]</span>을(를) 보유한 아군을 치유할 시, 추가로 자신에게 <span style=\"color: #4A9DF2;\">{skm2}%</span>의 분노를 회복한다.", "", ""], ["Skill_mSkillDesc_220960_1", "Direct healing from Basic ATK and <span style=\"color: #28d37c;\">[322091,param3]</span> applies an additional <span style=\"color: #4A9DF2;\">{skm1}</span> instance(s) of <span style=\"color: #4A9DF2;\">{skm2}%</span> healing to all allies with <span style=\"color: #28d37c;\">[322090,param3]</span>.", "일반 공격과 <span style=\"color: #28d37c;\">[322091,param3]</span>(으)로 발생하는 직접적인 치유는 <span style=\"color: #28d37c;\">[322090,param3]</span>을(를) 보유한 모든 아군에게 <span style=\"color: #4A9DF2;\">{skm2}%</span>의 추가 치유를 <span style=\"color: #4A9DF2;\">{skm1}</span>회 부여한다.", "", ""], ["Skill_mSkillDesc_220970_1", "When <span style=\"color: #28d37c;\">[322091,param3]</span> triggers healing after the bearer's HP drops below 50%, grants <span style=\"color: #28d37c;\">[100251,param3]</span> to all allies with <span style=\"color: #28d37c;\">[322090,param3]</span>. When <span style=\"color: #28d37c;\">[322091,param3]</span> triggers healing upon natural expiration or refresh, grants <span style=\"color: #28d37c;\">[100106,param3]</span> to all allies with <span style=\"color: #28d37c;\">[322090,param3]</span>.", "<span style=\"color: #28d37c;\">[322091,param3]</span>이(가) 소지자의 HP가 50% 미만일 때 치유를 발동하면, <span style=\"color: #28d37c;\">[322090,param3]</span>을(를) 보유한 모든 아군에게 <span style=\"color: #28d37c;\">[100251,param3]</span>을(를) 부여한다. <span style=\"color: #28d37c;\">[322091,param3]</span>의 지속 시간이 종료되거나 초기화되어 치유를 발동하면, <span style=\"color: #28d37c;\">[322090,param3]</span>을(를) 보유한 모든 아군에게 <span style=\"color: #28d37c;\">[100106,param3]</span>을(를) 부여한다.", "", ""], ["Skill_mSkillDesc_220980_1", "When <span sty o <span style=\"color: #4A9DF2;\">{skm5}</span> stack(s).", "자신이 대상의 방어력을 <span style=\"color: #4A9DF2;\">{skm1}%</span> 무시하며, 자신 또는 주위 2칸 범위 내에 HP가 <span style=\"color: #4A9DF2;\">{skm3}%</span> 이하인 아군이 <span style=\"color: #4A9DF2;\">{skm2}</span>명 있을 때마다, 추가로 <span style=\"color: #4A9DF2;\">{skm4}%</span>의 무시 효과를 획득한다. 최대 <span style=\"color: #4A9DF2;\">{skm5}</span>회 중첩 가능하다.", "", ""], ["Skill_mSkillSimpleDesc_232130_1", "When a unit retreats, dies, or the hero's summon perishes in range, her ATK increases by <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. Her next Basic ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target.", "공격 범위 내 유닛이 철수, 사망 또는 자신의 소환물이 소멸할 시, 공격력이 <span style=\"color: #4A9DF2;\">{skm1}%</span> 상승하며, <span style=\"color: #4A9DF2;\">{skm2}</span>초간 지속된다. 또한 다음 일반 공격은 <span style=\"color: #4A9DF2;\">{skm3}%</span>의 피해를 입히며, 동시에 대상에게 <span style=\"color: #fd4540;\">[200052,param15]</span>을(를) 부여하는 효과로 전환된다.", "", ""], ["Skill_mSkillSimpleDesc_232150_1", "When a unit retreats, dies, or the hero's summon perishes in range, her ATK increases by <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. Her next Basic ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target. If triggered when the hero's HP is below <span style=\"color: #4A9DF2;\">{skm4}%</span>, the duration is extended by <span style=\"color: #4A9DF2;\">{skm5}</span> sec, and the ATK Increase is raised to <span style=\"color: #4A9DF2;\">{skm6}%</span>.", "공격 범위 내 유닛이 철수, 사망 또는 자신의 소환물이 소멸할 시, 공격력이 <span style=\"color: #4A9DF2;\">{skm1}%</span> 상승하며, <span style=\"color: #4A9DF2;\">{skm2}</span>초간 지속된다. 또한 다음 일반 공격은 <span style=\"color: #4A9DF2;\">{skm3}%</span>의 피해를 입히며, 동시에 대상에게 <span style=\"color: #fd4540;\">[200052,param15]</span>을(를) 부여하는 효과로 전환된다. 자신의 HP가 <span style=\"color: #4A9DF2;\">{skm4}%</span> 이하일 때 발동되면, 지속 시간이 <span style=\"color: #4A9DF2;\">{skm5}</span>초 증가하며, 공격 상승 효과가 <span style=\"color: #4A9DF2;\">{skm6}%</span>까지 증가한다.", "", ""], ["Skill_mSkillSimpleDesc_232160_1", "<span style=\"color: #28d37c;\">[23211,1]</span>'s ATK has a(n) <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to increase the number of shots by <span style=\"color: #4A9DF2;\">{skm2}</span>. Killing a target can increase it by <span style=\"color: #4A9DF2;\">{skm3}</span> time(s).", "<span style=\"color: #28d37c;\">[23211,1]</span> 공격이 <span style=\"color: #4A9DF2;\">{skm1}%</span> 확률로 사격 횟수가 <span style=\"color: #4A9DF2;\">{skm2}</span>회 증가하며, 대상 처치 시 <span style=\"color: #4A9DF2;\">{skm3}</span>회 증가 가능하다.", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero's DMG by <span style=\"color: #4A9DF2;\">{skm1}%</span>, with an additional <span style=\"color: #4A9DF2;\">{skm2}%</span> against Elite and Boss units, lasting for <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "재능 발동 시, 자신의 피해가 <span style=\"color: #4A9DF2;\">{skm1}%</span> 증가하고, 정예와 보스 유닛에 대한 피해가 추가로 <span style=\"color: #4A9DF2;\">{skm2}%</span> 증가하며, <span style=\"color: #4A9DF2;\">{skm3}</span>초간 지속된다.", "", ""], ["Skill_mSkillSimpleDesc_232180_1", "Every <span style=\"color: #4A9DF2;\">{skm1}</span> time(s) the hero's Basic ATK deals DMG, it also triggers the Talent effect.", "영웅 자신의 일반 공격으로 피해를 <span style=\"color: #4A9DF2;\">{skm1}</span>회 입힐 때마다, 재능 효과가 발동된다.", "", ""], ["Skill_mSkillSimpleDesc_232198_1", "Increases DMG in the Arena by <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "아레나에서 피해가 <span style=\"color: #4A9DF2;\">{skm1}%</span> 증가한다.", "", ""], ["Skill_mSkillSimpleDesc_630614_1", "Jungle Master heals 2 allies at a time.", "정글 몽크가 한 번에 2명의 적을 치유한다.", "", ""], ["Skin_mSkinName_2209000", "Default", "기본", "", ""], ["Skin_mSkinName_2321000", "Default", "기

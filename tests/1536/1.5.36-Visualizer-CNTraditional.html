, "", ""], ["Awakening_mProphecyDesc_2321_3", "卑微的蝼蚁只配仰望我的无上威仪。", "Kneel, wretched cur… I am beyond divinity.", "卑微的螻蟻，只配仰望我的無上威儀。", "", ""], ["Awakening_mProphecyDesc_2321_4", "我的剧毒，无药可解。", "There is no antidote for my power.", "我的劇毒，無藥可解。", "", ""], ["Awakening_mProphecyDesc_2321_5", "忘却秩序与混沌，臣服于蛇的意志吧！", "There is no chaos, no order… only the serpent&#x27;s will!", "忘卻秩序與混沌，俯首臣服於蛇之意志吧！", "", ""], ["BUFFAttribute_mName_100251", "伤害提升", "DMG Increase", "傷害提升", "", ""], ["BUFFAttribute_mName_322090", "静谧之息", "Serene Breath", "靜謐之息", "", ""], ["BUFFAttribute_mName_322091", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_322092", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_322093", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_322094", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_322095", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_323210", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mName_323211", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mName_323212", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mName_323213", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mName_323214", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mTips_100251", "伤害增加{20,num/100}%，同类效果取最高", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "傷害增加{20,num/100}%，同類型效果中只會保留最高效果", "", ""], ["BUFFAttribute_mTips_321900", "每秒获得自身攻击力{30,num}%的护盾，最多获得自身攻击力{31,num}%的护盾。", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "每秒獲得相當於自身攻擊力{30,num}%的護盾，最多可獲得相當於自身攻擊力{31,num}%的護盾。", "", ""], ["BUFFAttribute_mTips_322090", "每2秒驱散1个减益效果。艾尔莉丝治疗携带静谧之息的友方时，额外提升{30,num}%治疗加成。场上最多存在2个携带静谧之息的友方。", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "每2秒驅散1個減益效果。艾 rne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", "", ""], ["BUFFAttribute_mTips_323211", "快速对主人攻击范围内的1名敌人射击，初始状态可以射击{30,num}次，每次造成{31,num}%的伤害。次数耗尽后蛇吻者会自然消亡。优先攻击空中目标。箭矢击中已阵亡的目标时会返回次数。场上最多存在{32,num}个。", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", "", ""], ["BUFFAttribute_mTips_323212", "快速对主人攻击范围内的1名敌人射击，初始状态可以射击{30,num}次，每次造成{31,num}%的伤害。次数耗尽后蛇吻者会自然消亡。优先攻击空中目标。箭矢击中已阵亡的目标时会返回次数。场上最多存在{32,num}个。", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", "", ""], ["BUFFAttribute_mTips_323213", "快速对主人攻击范围内的1名敌人射击，初始状态可以射击{30,num}次，每次造成{31,num}%的伤害。次数耗尽后蛇吻者会自然消亡。优先攻击空中目标。箭矢击中已阵亡的目标时会返回次数。场上最多存在{32,num}个。", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", _mChampionshipName_844", "沙海宝库", "Vault in the Sands", "沙海寶庫", "", ""], ["ChampionshipPlan_mChampionshipName_845", "迷失之地", "Forgotten Palace", "迷失之地", "", ""], ["ChampionshipPlan_mChampionshipName_846", "英雄降临", "Arrival of Heroes", "英雄降臨", "", ""], ["ChampionshipPlan_mChampionshipName_847", "英雄培养", "Hero Training", "英雄培養", "", ""], ["ChampionshipPlan_mChampionshipName_848", "神器秘境", "Mystery of Artifacts", "神器秘境", "", ""], ["ChampionshipPlan_mChampionshipName_849", "失落遗产", "The Lost Legacy", "失落遺產", "", ""], ["Chapter_mChapterName_9032", "故事章节", "Story Chapter", "故事章節", "", ""], ["Chapter_mChapterName_9033", "挑战章节", "Challenge Chapter", "挑戰章節", "", ""], ["ChapterType_mChapterName_214", "公版IP", "Public Domain IP", "公版IP", "", ""], ["ChapterType_mChapterName_801", "僵尸被我包围了(买量)", "Zombie Invasion", "殭屍被我包圍了", "", ""], ["CommonText_mMessage_1539", "频道切换中", "Switching channels...", "頻道切換中", "", ""], ["CommonText_mMessage_24292", "战斗场次", "Challenges", "戰鬥場次", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;试炼石板&lt;/color&gt;\\n在游戏中各处玩法，可以获得试炼石板，石板有多种类型，多个等级，每个石板都包含了不同的星象暗语，将其嵌入祭坛中，可以开启前往该试炼的通路。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;挑战说明&lt;/color&gt;\\n每一场战斗均有多波怪物，每消灭一波怪物，都将获得宝箱奖励；战斗开启后，无法重新开始，如中途退出将按照当前的战斗进度进行结算。每月可消耗200个石板进行试炼挑战，达到上限后当月不可再进行挑战。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;石板能量&lt;/color&gt;\\n每个石板都拥有特定的能量，&lt;color=&quot;#fdbe36&quot;&gt;每次进入试炼都将扣除1点能量，&lt;/color&gt;战斗结束时，如石板仍有能量，可以选择放弃此次奖励离开，重新消耗能量开启试炼。能量消耗不计入每月石板消耗。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;石板销毁&lt;/color&gt;\\n可以将符合销毁等级的石板进行销毁，销毁石板不会获得任何奖励，不计入每月石板消耗。\\n&lt;color=&quot;#fd4540&quot;&gt;拥有的石板有容量上限，当石板背包已满时，将无法再获得石板，请注意即时使用。&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;試煉石板&lt;/color&gt;\\n在遊戲中各處玩法，可以獲得試煉石板，石板有多種類型，多個等級，每個石板都包含了不同的星象暗語，將其嵌入祭壇中，可以開啟前往該試煉的通路。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;挑戰說明&lt;/color&gt;\\n每一場戰鬥均有多波怪物，每消滅一波怪物，都將獲得寶箱獎勵；戰鬥開啟後，無法重新開始，如中途退出將按照目前的戰鬥進度進行結算。每月可消耗200個石板進行試煉挑戰，達到上限後當月不可再進行挑戰。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;石板能量&lt;/color&gt;\\n每個石板都擁有特定的能量，&lt;color=&quot;#fdbe36&quot;&gt;每次進入試煉都將扣除1點能量，&lt;/color&gt;戰鬥結束時，如石板仍有能量，可以選擇放棄此次獎勵離開，重新消耗能量開啟試煉。能量消耗不計入每月石板消耗。\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;石板銷毀&lt;/color&gt;\\n可以將符合銷毀等級的石板進行銷毀，銷毀石板不會獲得任何獎勵，不計入每月石板消耗。\\n&lt;color=&quot;#fd4540&quot;&gt;擁有的石板有容量上限，當石板背包已滿時，將無法再獲得石板，請注意即時使用。&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "幽潮密钥", "Mossy Crystal", "幽影狂潮密鑰", "", ""], ["CommonText_mMessage_25384", "熔火岩板", "Molten Crystal", "熔火岩板", "", ""], ["CommonText_mMessage_25602", "进入战斗后，将不可重新开始，中途退出立刻结算，已消耗的能量不会返还！", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "進入戰鬥後，將不可重新開始，中途退出立即結算，已消耗的能量不會返還！", "", ""], ["CommonText_mMessage_25702", "末日时熔岩涌动的火山地带，需要更多的高台英雄，阻击末世的邪恶力量。", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "末日時熔岩湧動的火山地帶，需要更多的高台英雄，阻擊末世的邪惡力量。", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;确定卸任该玩家的统帅职位吗？&lt;/color&gt;\\n每个公会最多有{num1}名统帅，统帅每轮进攻次数可增加{num2}次。", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;確定卸任該玩家的統帥職位嗎？&lt;/color&gt;\\n每個公會最多有{num1}名統帥，統帥每輪進攻次數可增加{num2}次。", "", ""], ["CommonText_mMessage_25931", "本次积分", "Points of the Round", "本次積分", "", ""], ["CommonText_mMessage_26126", "销毁", "Destroy", "銷毀", "", ""], ["CommonText_mMessage_26127", "是否确认销毁{name}？\\n&lt;color=&quot;#fd4540&quot;&gt;石板销毁后不可恢复，且不会获得物品。&lt;/color&gt;", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "是否確認銷毀{name}？\\n&lt;color=&quot;#fd4540&quot;&gt;石板銷毀後不可回復，且不會獲得物品。&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "石板已被销毁", "Keystone has been destroyed.", "石板已被銷毀", "", ""], ["CommonText_mMessage_26129", "能量：", "Energy:", "能量：", "", ""], ["CommonText_mMessage_26130", "放弃并离开", "Give up and leave", "放棄並離開", "", ""], ["CommonText_mMessage_26131", "领取奖励", "Claim", "领取奖励", "", ""], ["CommonText_mMessage_26132", "石板剩余能量：", "Remaining Keystone Energy:", "石板剩餘能量：", "", ""], ["CommonText_mMessage_26133", "战斗图鉴", "B 151", "石板背包已满，请先消耗后，再进行购买", "Keystone storage is full. Use some Keystones before buying more.", "石板背包已滿，請先消耗後，再進行購買", "", ""], ["CommonText_mMessage_26152", "前往清理", "Go Clean", "前往清理", "", ""], ["CommonText_mMessage_26153", "检测到您的仓库中，有尚未开启的随机石板宝箱，是否前往开启", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "偵測到您的倉庫中，有尚未開啟的隨機石板寶箱，是否前往開啟？", "", ""], ["CommonText_mMessage_26154", "前往", "Go", "前往", "", ""], ["CommonText_mMessage_26155", "等级{num1}-{num2}", "Lvl. {num1}-{num2}", "等級{num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "该等级石板不可销毁", "This level&#x27;s Keystone cannot be destroyed.", "該等級石板不可銷毀", "", ""], ["CommonText_mMessage_26157", "是否确认销毁&lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt;个石板？\\n&lt;color=&quot;#fd4540&quot;&gt;石板销毁后不可恢复，且不会获得物品。&lt;/color&gt;", "Are you sure you want to destroy &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Keystone(s)?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "是否確認銷毀&lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt;個石板？\\n&lt;color=&quot;#fd4540&quot;&gt;石板銷毀後不可恢復，且不會獲得物品。&lt;/color&gt;", "", ""], ["CommonText_mMessage_26158", "已销毁{num}个石板", "Destroyed {num} Keystone(s).", "已銷毀{num}個石板", "", ""], ["CommonText_mMessage_26159", "当月消耗：", "Monthly Usage:", "當月消耗：", "", ""], ["CommonText_mMessage_26160", "石板每月有挑战上限，达到上限后不可再挑战", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "石板每月有挑戰上限，達到上限後不可再挑戰", "", ""], ["CommonText_mMessage_26161", "当前难度有可以领取的奖励，是否确认前往其他难度进行尝试\\n&lt;color=&quot;#e04242&quot;&gt;活动期间，每日仅可以选择一个难度领取奖励&lt;/color&gt;", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?\\n&lt;color=&quot;#e04242&quot;&gt;During the event, you can only choose one difficulty per day to claim rewards.&lt;/color&gt;", "目前難度有可以領取的獎勵，是否確認前往其他難度進行嘗試\\n&lt;color=&quot;#e04242&quot;&gt;活動期間，每日僅可  "治癒飛蟲每波會隨機出現在戰場中", "", ""], ["Difficulty_mStrategyDesc_7110", "扭曲的佞幸每波会随机出现在战场中", "Twisted Sycophant appears randomly on the battlefield each wave.", "扭曲的佞幸每波會隨機出現在戰場中", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "（3件套）普通攻击暴击时，自身伤害+10%，持续8秒，最多叠加5层", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero&#x27;s DMG by 10% for 8 sec, stacking up to 5 times.", "（3件套裝）普通攻擊出現暴擊時，自身傷害+10%，效果持續8秒，最多可疊加5層", "", ""], ["HeroStory_mStory_2209", "“恍如一段我未曾拥有，却永世渴求的回忆。”\\n——瑞文霍德\\n\\n他们将她遣至北境，企图用极寒的霜雪压折她的意志，迫其重归“正道”。\\n\\n艾尔莉丝曾是埃林蒂斯的圣咏祭司。肃立于古老仪典的中央，她的吟唱与诸神呼吸交织。可当信仰崩塌，她的选择成为了人人避讳的禁忌，圣所难以饶恕的背叛。\\n\\n莫里登之战后的数月里，埃林蒂斯在战火屠戮的余烬上修补重建。虽成功击退冥神大军，一道道伤痕却永远烙印，也警醒着触目惊心的现实：精灵城不再牢不可破。家园高塔倾裂，精灵荣光泣血，埃林蒂斯的精灵们需找寻一方隐秘角落，让族人免受战乱侵袭。先知们悄悄将目光投向远方，谨慎地在地图之外的荒芜中寻找战火重燃时的栖身之所。\\n\\n占卜的水晶兀然映出北境的轮廓——寒冷、荒芜，如一把森冷的孤刃悬于大陆尽头。北霜之王哈尔兹威名远扬，他们不敢贸然进犯；而在精灵探子未能踏足的极寒之境，瑞文霍德统御着这片冰天雪地。这位骁勇善战的领袖未曾加冕，但他的统治地位无可撼动。精灵们需要更深入地了解这位无冕之王：精灵的战力是否足够掀翻他的权势？若真要彻底瓦解他的统治，代价几何？\\n\\n于是艾尔莉丝成为了最合适的棋子。并非使臣，亦非间谍，而是一枚被精心伪装的弃子。族内以冠冕堂皇的理由命她前去，令其向神明起誓：取得瑞文霍德的信任，摸清他的为人，将第一手情报传递回遥远的故土。于是她身裹素白而至，谎称自己是司掌寒霜的祭司，为和平而来的游医。而瑞文霍德，这个从不轻信他人的枭雄，竟真的接纳了她。\\n\\n治疗伤病，卜卦解兆，她在异乡默默地证明自己的价值，将隐秘的目的深深藏匿。他默默注视，她无声回望。视线交织，某种不可言说的纠葛便悄然生长。\\n\\n时光模糊了彼此的界限，二人交织的命运却也让立场的对立愈发清晰。她逐渐读懂了他沉默中的深意，感受到怒火的温度，以及深藏于冷硬表象之下那别扭的温柔。在篝火将熄、密信难传的深夜，她偶尔会悄悄在心里描绘着一个未来——或许，自己真的可以放心依赖他；或许，他也成为了自己更重要的牵绊……但，刺眼晨光总会焚尽残梦。\\n\\n与瑞文霍德一样，她也曾梦见雪原上彼此决绝对峙的身影，恐怕这便是二人的终章。注定有一方将挥下刀刃，必有一方的未来会被扼杀。当寒风卷散血雾前的刹那，他们将彻悟生存的代价，也参透彼此存在的意义。\\n\\n艾尔莉丝很清楚先知们从未言明的真相：北境从不属于任何人。或许有人可以在此争王称霸，建立城池，但北境永远不会因此被征服。而她这般无根浮萍，终究只是过客。无论等待二人的是怎样的未来，信任都将焚烧殆尽，而命运的车轮将会碾过余烬，滚滚向前。\\n\\n她是两股风暴夹缝间的死寂，静待其中一方被撕碎吞没的结局。", "&quot;She walks like a memory I have not earned, yet always long for.&quot;\\n-Rivenhald\\n\\nThey sent her north, where the snows upon her brow might bend her once more to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "「恍如一段我未曾擁有，卻永世渴求的回憶。」\\n——瑞文霍德\\n\\n他們將她遣至北境，企圖用極寒的霜雪壓折她的意志，迫其重歸「正道」。\\n\\n艾爾莉絲曾是埃林蒂斯的聖詠祭司。肅立於古老儀典的中央，她的吟唱與諸神呼吸交織，聲聲入魂。可當信仰崩塌，她的選擇成為了人人避諱的禁忌——聖所難以饒恕的背叛。\\n\\n莫里登之戰後的數月裡，埃林蒂斯在戰火屠戮的餘燼上修補重建。雖成功擊退冥神大軍，一道道傷痕卻永遠烙印在族人心中，也警醒著觸目驚心的現實：精靈城不再牢不可破。家園高塔傾裂，精靈榮光泣血，埃林蒂斯的精靈們亟需找尋一方隱秘角落，讓族人免受戰亂侵襲。先知們悄悄將目光投向遠方，謹慎地在地圖之外的荒蕪中尋找戰火重燃時的棲身之所。\\n\\n占卜的水晶兀然映出北境的輪廓——寒冷、荒蕪，如一把森冷的孤刃懸於大陸盡頭。北霜之王哈爾茲威名遠揚，他們不敢貿然進犯；而在精靈探子未能踏足的極寒之境深處，瑞文霍德統御著這片冰天雪地。這位驍勇善戰的領袖未曾加冕，但他的統治地位無可撼動。精靈們需要更深入地瞭解這位無冕之王：精靈的戰力是否足夠掀翻他的權勢？若真要徹底瓦解他的統治，代價幾何？\\n\\n於是艾爾莉絲成為了最合適的棋子。並非使臣，亦非間諜，而是一枚被精心偽裝的棄子。族內以冠冕堂皇的理由命她前去，令其向神明起誓：取得瑞文霍德的信任，摸清他的為人，將第一手情報傳遞回遙遠的故土。於是她身裹素白而至，謊稱自己是司掌寒霜的祭司，為和平而來的遊醫。而瑞文霍德——這個從不輕信他人的梟雄，竟真的接納了她。\\n\\n治療傷病，卜卦解兆，她在異鄉默默地證明自己的價值，將隱秘的目的深深藏匿。他默默注視，她無聲回望。視線交織間，某種不可言說的糾葛便悄然生長。\\n\\n時光模糊了彼此的界限，二人交織的命運卻也讓立場的對立越發清晰。她逐漸讀懂了他沉默中的深意，感受到怒火背後的溫度，以及深藏於冷硬表象之下那份彆扭的溫柔。在篝火將熄、密信難傳的深夜，她偶爾會悄悄在心裡描繪著一個未來——或許，自己真的可以放心依賴他；或許，他也成為了自己更重要的牽絆……\\n\\n但刺眼的晨光，總會焚盡殘夢。\\n\\n與瑞文霍德一樣，她也曾夢見雪原上彼此決絕對峙的身影——恐怕這便是二人的終章。注定有一方將揮下刀刃，必有一方的未來會被扼殺。當寒風卷散血霧前的剎那，他們將徹悟生存的代價，也參透彼此存在的意義。\\n\\n艾爾莉絲很清楚先知們從未言明的真相：北境從不屬於任何人。或許有人可以在此爭王稱霸，建立城池，但北境永遠不會因此被征服。而她這般無根浮萍，終究只是過客。無論等待二人的是怎樣的未來，信任都將焚燒殆盡，而命運的車輪將會碾過餘燼，滾滾向前。\\n\\n她是兩股風暴夾縫間的死寂，靜待其中一方被撕碎吞沒的結局。", "", ""], ["HeroStory_mStory_2321", "“你会哀求我吞噬你。而我，将赐予你怜悯。”\\n——密林中传来的嘶嘶低语\\n\\n在泰亚的翠绿丛林中，根须饮血，古木缠生。绿影重重之处，曾潜伏着一个由毒与影构成的精魂。它无形无体，只有獠牙、饥饿，以及一个模糊不清的名字——希瑟拉。\\n\\n在她苏醒之前，丛林曾属于一座伟大的古帝国——蜥蜴人帝国。黑曜铸城，高塔刺破林冠，流溪划断幽谷。但在他们文明最后的余晖中，蜥蜴人将残余的魔力倾注于一尊尊巨像之中——以神兽为形，用赭石与灰烬绘制祝祷，制作成祭品恳求丛林中的神明垂怜回应。\\n\\n回应从未降临。只有沉默。\\n\\n帝国终被藤蔓吞噬，城池崩塌，万物归林，唯那一座座神像仍佇立林间，布满青苔，半掩半埋，却似仍低语未止。那些神像内早已封印着灵体——蜥蜴人用法术将活人之魂困于像中，作为贡品献给神灵。而不幸误入密林的旅人若靠近其中，往往命丧当场，因这些“神像”本就是献祭之器，是召神之门。希瑟拉，便是回应的神祇之一。她是毒蛇女神，是旧世的残影，是爬入伤者与弱者梦中的低语者。\\n\\n但她曾经只是幽魂一缕，直到达苏弥找到了她。\\n\\n这位著名的神秘主义者蜥蜴人坚信，梦是通往更深层真理的桥梁。为探寻失落的智慧，他踏入丛林，追随蛇与祭坛的幻象，被一座藤蔓覆盖的庙宇吸引，如同身处深梦之中。在那废墟的中心，他焚香引梦，意识悄然游离于现实与幻境之间——而希瑟拉，在彼岸应声而至。\\n\\n无人知晓他们之间究竟发生了什么。是达苏弥自愿献身，还是误开了太深的门扉？总之结果相同：希瑟拉挣脱了虚无，重归世间。蛊蛇魅影再度降临。\\n\\n如今，她遵循着密林的法则，狩猎所有自诩高贵之人——所谓正直纯粹者，坚定不移者，皆逃不出她的掌心。她潜入神殿王宫，给予他们最后的选择：屈服，或被吞噬。她渴望重振她蛇裔王朝的荣光——獠牙毕露，以丛林为冠，白骨为座。她梦见藤蔓与毒液交织的城池，梦见万民舍弃软弱，饮下她的剧毒，在痛苦中获得新生。\\n\\n如今，她仍被人敬拜。尽管信徒早已分散匿形，传言说达苏弥仍在暗中领导。他们在皮肤上刻下獠牙印记，舌尖滴毒，以痛苦为祭，在神圣的敬奉中追寻极乐。他们祈求被选中，祈求成为食物，因为“被选中”即意味着能被看见，被追猎，方能享受女神的无上恩泽。被毒蛇亲吻者，会感受到力量缠绕灵魂，如蛇蜕皮一般摆脱软弱，焕然重生。那些能在她毒吻中活下来的人，会被她选中，化为她的猎手——致命、绝美，且绝对忠诚。\\n\\n而在毒吻无声夺去呼吸，箭矢飞抵心脏咫尺时，他们都会轻声低喃：\\n“谢谢你。”", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "「你終將哀求我吞噬你，而我，亦將施予憐憫。」\\n——密林中傳來的嘶嘶私語\\n\\n泰亞翠綠的原始叢林中，根鬚渴血，古木盤生。於層層疊疊的綠影之下，曾潛伏著一縷由毒與影編織而成的精魂。她無形無體，僅餘獠牙與飢餓，以及一個難以辨識的名字——希瑟拉。\\n\\n在她甦醒以前，此叢林隸屬於一個偉大的古帝國——蜥蜴人帝國。黑曜鑄城，高塔刺破林冠，溪澗切開幽谷。文明最後的餘暉中，蜥蜴人將殘存的魔力傾注於一座座巨像——以神獸為形，赭石摻灰燼描繪祝禱——祈求叢林諸神垂憐回應。\\n\\n回應從未降臨，唯有沉默。\\n\\n帝國終為藤蔓吞噬，城池崩塌，萬物歸林；唯獨那些神像仍佇立林間，滿覆苔衣，半掩半埋，彷彿依舊細語不止。巨像體內封印著被活祭的靈魂——蜥蜴人以巫術將生者之魄禁錮於石，獻作供品。誤闖密林的旅人若靠近，往往橫屍當場；這些「神像」本就是獻祭之器，是召神之門。希瑟拉，便是回應的神祇之一。她是毒蛇女神，是舊世的殘影，亦是爬入傷者與弱者夢中的低語者。\\n\\n然而，她曾只是幽魂一縷，直至達蘇彌發現了她。\\n\\n這位聲名遠播的神秘學者深信夢境是通往真理更深層的橋梁。為追尋失落的智慧，他踏入叢林，循蛇影與祭壇幻象而行，終被一座藤蔓覆蓋的古廟吸引，如墜深夢。於廢墟之心，他焚香引夢，意識遊離於現實與幻境之隙——希瑟拉亦在彼岸應聲而來。\\n\\n無人知曉兩者間究竟發生了什麼。是達蘇彌自願獻身，抑或誤開過深之門？結局無異——希瑟拉掙脫虛無，重返現世；蠱蛇魅影，再度降臨。\\n\\n如今，她循密林法則而行，狩獵一切自詡高貴之輩——所謂正直純粹、堅定不移者，皆難逃她掌心。她潛入神殿與王宮，賜予他們最後的抉擇：屈服，或被吞噬。她渴望重振蛇裔王朝的榮光——獠牙為權冠，叢林作王座，白骨築高座。她夢見藤蔓與毒液交織成城，夢見眾生捨棄軟弱，飲下她的劇毒，在痛楚中獲得新生。\\n\\n她仍受人祀奉。傳聞達蘇彌遊走暗處，領導散落各方的信徒。他們在肌膚上刻下獠牙印記，舌尖蘸毒，以痛苦為祭，於神聖狂喜中追尋極樂。他們祈求被選中，祈求成為獵物——因為唯有成為「獵物」，才意味著被她注視、被她追獵，才能享受女神無上的恩澤。被毒蛇親吻者，將感受力量纏繞靈魂，猶如蛇蛻般褪去軟弱，煥然重生。那些能於毒吻中存活者，會被她選中，成為她的獵手——致命、絕美，且絕對效忠。\\n\\n當毒吻無聲奪走呼吸、箭矢飛抵心臟咫尺之時，他們都會輕聲低語：\\n「謝謝你。」", "", ""], ["HeroStory_mTitle_2209", "雪之纱", "Veil of Snow", "雪之紗", "", ""], ["HeroStory_mTitle_2321", "最甜美的毒药", "The Sweetest Poison", "最甘美的毒藥", "", ""], ["Item_mItemDesc_20209", "英雄：艾尔莉丝", "Hero: Eirlys", "英雄：艾爾莉絲", "", ""], ["Item_mItemDesc_20321", "英雄：希瑟拉", "Hero: Sythra", "英雄：希瑟拉", "", ""], ["Item_mItemDesc_31096", "可自选一名限定英雄参与活动，自选的限定英雄掉落概率提升&amp;200抽内必得！", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "可自選一名限定英雄參與活動，自選的限定英雄掉落機率提升＆200抽內必得！", "", ""], ["Item_mItemDesc_31097", "&lt;color=&quot;#eadca2&quot;&gt;英雄召唤特惠&lt;/color&gt;\\n\\n获得英雄召唤的必需资源", "&lt;color=&quot;#eadca2&quot;&gt;Special Summon Offer&lt;/color&gt;\\n\\nGet the necessary materials for Hero Summon", "&lt;color=&quot;#eadca2&quot;&gt;英雄召喚特惠&lt;/color&gt;\\n\\ ", "曾经是信仰太阳的圣骑士，如今因未知的原因而堕落。", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "曾經是信仰太陽的聖騎士，如今因未知的原因而墮落。", "", ""], ["Unit_mDescribe_34100", "无法阻挡的灵体残骸，免疫控制。", "An unblockable spectral remnant immune to Control effects.", "無法阻擋的靈體殘骸，免疫控制。", "", ""], ["Unit_mDescribe_34102", "战场阵亡的士兵转化而成。", "Turned from soldiers killed in battle.", "戰場陣亡的士兵轉化而成。", "", ""], ["Unit_mDescribe_34103", "遇到敌人时会自爆来为族群谋取生路，对周围单位造成大量伤害", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "遇到敵人時會自爆來為族群謀取生路，會對周圍單位造成大量傷害。", "", ""], ["Unit_mDescribe_34105", "狂暴化的变异巨鼠，&lt;color=#ff4500&gt;被攻击后会陷入癫狂，移动速度提高&lt;/color&gt;。", "Mutated and on a rampage, these Mutant Rodents. &lt;color=#ff4500&gt;Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.&lt;/color&gt;", "狂暴化的變異巨鼠，&lt;color=#ff4500&gt;被攻擊後會陷入癲狂，移動速度提高&lt;/color&gt;。", "", ""], ["Unit_mDescribe_34156", "手持巨斧的骷髅战士，受怨念的驱使，拥有更强的攻击力。", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "手持巨斧的骷髏戰士，受到怨念的驅使，擁有更強的攻擊力。", "", ""], ["Unit_mDescribe_37114", "孕育无数小型蜘蛛的蛛后，喷吐蛛丝，还可强化场上蜘蛛属性。", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "孕育無數小型蜘蛛的蛛后，會噴吐出蛛絲，還能強化場上蜘蛛的屬性。", "", ""], ["Unit_mFeature_17200", "挥舞巨大的钉头锤，无情屠戮阻挡在他面前的一切。", "He mercilessly butchers everything in his path with a massive mace.", "揮舞巨大的錘矛，無情屠戮阻擋在他面前的一切。", "", ""], ["Unit_mFeature_17218", "游荡在地下城的疯狂战士，以砍下他人头颅的为乐。", "A mad fighter roaming in the dungeon enjoys beheading people.", "遊蕩在地下城中的瘋狂戰士，以砍下他人的頭顱為樂。", "", ""], ["Unit_mFeature_17219", "挥舞巨大的钉头锤，无情屠戮阻挡在他面前的一切。", "He mercilessly butchers everything in his path with a massive mace.", "揮舞巨大的錘矛，無情屠戮阻擋在他面前的一切。", "", ""], ["Unit_mFeature_17221", "残酷的食人魔守护者，巨大的骨钳可轻易让敌人流血不止。", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "殘酷的食人魔守護者，巨大的骨鉗能夠輕易地讓敵人血流不止。", "", ""], ["Unit_mFeature_17222", "残酷的食人魔守护者，巨大的骨钳可轻易让敌人流血不止。", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "殘酷的食人魔守護者，巨大的骨鉗能夠輕易地讓敵人血流不止。", "", ""], ["Unit_mFeature_34100", "无法阻挡的灵体残骸，不可减速，只能快速击杀。", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "無法阻擋的靈體殘骸，無法被緩速，只能快速擊殺。", "", ""], ["Unit_mFeature_34102", "战场阵亡的士兵转化而成。", "Turned from soldiers killed in battle.", "戰場陣亡的士兵轉化而成。", "", ""], ["Unit_mFeature_34103", "爆虫长满酸液的囊，蜷缩成一团滚动前行。", "Full of acid sacs, Suicides like to curl up and roll forward.", "爆蟲長滿酸液囊腫，蜷縮成一團並滾動前行。", "", ""], ["Unit_mFeature_34105", "狂暴化的变异巨鼠，受到攻击后会加速。", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "狂暴化的變異巨鼠，受到攻擊後會加速。", "", ""], ["Unit_mFeature_34156", "手持巨斧的骷髅战士，受怨念的驱使，拥有更强的攻击力。", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "手持巨斧的骷髏戰士，受到怨念的驅使，擁有更強的攻擊力。", "", ""], ["Unit_mFeature_37114", "居住于地底世界的真正王后，拥有强大的孕育能力，可孕育并指挥小型蜘蛛敌人，增强在场的全体蜘蛛的各项属性。其喷吐的蛛丝十分坚韧，一旦被困极难挣脱。", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "居住在地底世界中的真正王后，擁有強大的孕育能力，可孕育並指揮小型蜘蛛，增強場上全體蜘蛛的各項屬性。她噴吐的蛛絲十分堅韌，一旦被蛛絲束縛就很難掙脫。", "", ""], ["Unit_mGetDesc_2209", "被放逐的精灵祭司艾尔莉丝。用祷告愈合重伤，驱散减益效果，拯救队友于死亡中，加速全队回怒。", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "被放逐的精靈祭司艾爾莉絲。用禱告癒合重傷，驅散減益效果，拯救隊友於死亡中，加速全隊回怒。", "", ""], ["Unit_mGetDesc_2321", "旧世的残影，蛊蛇魅影希瑟拉在丛林游荡。召唤蛇吻者攻击，攻势愈打愈烈，无视防御，吞噬敌人。", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "舊世的殘影，蠱蛇魅影希瑟拉在叢林遊蕩。召喚蛇吻者攻擊，攻勢愈打愈烈，無視防禦，吞噬敵人。", "", ""], ["Unit_mHeroDesignation_2209", "心愈霜梦", "Winter&#x27;s Mercy", "心癒霜夢", "", ""], ["Unit_mHeroDesignation_2321", "蛊蛇魅影", "The Serpent&#x27;s Embrace", "蠱蛇魅影", "", ""], ["Unit_mName_17200", "毁灭爵士", "Knight of Destruction", "毀滅爵士", "", ""], ["Unit_mName_17218", "堕落处刑者", "Fallen Chopper", "墮落處刑者", "", ""], ["Unit_mName_17219", "屠杀", "Slaughter", "屠殺", "", ""], ["Unit_mName_17221", "玛乌", "Maw", "瑪烏", "", ""], ["Unit_mName_17222", "玛乌", "Maw", "瑪烏", "", ""], ["Unit_mName_2209", "艾尔莉丝", "Eirlys", "艾爾莉絲", "", ""], ["Unit_mName_2321", "希瑟拉", "Sythra", "希瑟拉", "", ""], ["Unit_mName_34100", "噬魂者", "Soul Eater", "噬魂者", "", ""], ["Unit_mName_34103", "爆虫", "Suicide", "爆蟲", "", ""], ["Unit_mName_34156", "骷髅行刑者", "Skeleton Executioner", "骷髏行刑者", "", ""], ["Unit_mName_37114", "蛛后", "Queen Spider", "蛛后", "", ""], ["Unit_mName_37115", "蜘蛛茧", "Spider Cocoon", "蜘蛛繭", "", ""], ["Unit_mShare_2209", "留在我身边，我会护你周全。", "Stay near me, and you just might survive.", "留在我身邊，我會護你周全。", "", ""], ["Unit_mShare_2321", "你所痴迷的欲望，可曾令你感到恐惧？", "Tell me, do you fear what you desire?", "那令你沉溺的慾望，可曾讓你心生畏懼？", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "夺宝狂潮开启，指挥官可在活动期间进行一次自动战斗消耗双倍体力，获得2次奖励，提升效率！\n\n【自动战斗倍率加成】\n1.活动期间，在{name2}自动战斗时，指挥官可选择是否使用活动加成：每一局将消耗{num3}倍体力，并获得{num3}次奖励，提升获取材料效率。\n2.若挑战失败，将会返还活动期相应的体力数量。\n3.活动期间，若勾选了活动加成，则有关体力消耗的任务，计算的是倍率提升后的体力消耗数量。\n4.活动期间，有关通关次数的任务，即使勾选了活动加成，计数仍为实际通关次数。\n5.活动提升仅针对可自动战斗的关卡，因此关卡首通奖励不包含在奖励的倍率加成中。\n6.活动掉落加成中，如包括概率获得的奖励，单次自动战斗会进行2次判定，而非复制某次战斗奖励内容。\n7.勇者征途活动，装备/神器材料副本主题神谕之征的积分与装备/陨星掉落保持一致，根据关卡结束后掉落装备/陨星的品质和数量进行计分。\n8.如倍率加成期间，关卡有活动代币的随机掉落（如神奇旅途的骰子等），活动代币不享受倍率加成，请指挥官注意。", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "奪寶狂潮開啟，指揮官可在活動期間進行一次自動戰鬥消耗雙倍體力，獲得2次獎勵，提升效率！\n\n【自動戰鬥倍率加成】\n1、活動期間，在{name2}自動戰鬥時，指揮官可選擇是否使用活動加成：每一局將消耗{num3}倍體力，並獲得{num3}次獎勵，提升獲得材料效率。\n2、若挑戰失敗，將會返還活動期相應的體力數量。\n3、活動期間，若勾選了活動加成，則有關體力消耗的任務，計算的是倍率提升後的體力消耗數量。\n4、活動期間，有關通過次數的任務，即使勾選了活動加成，計數仍為實際通過次數。\n5、活動提升僅針對可自動戰鬥的關卡，因此關卡首通獎勵不包含在獎勵的倍率加成中。\n6、活動掉落加成中，如包括機率獲得的獎勵，單次自動戰鬥會進行2次判定，而非複製某次戰鬥獎勵內容。\n7、勇者征途活動，裝備/神器材料副本主題神諭之征的積分與裝備/隕星掉落保持一致，根據關卡結束後掉落裝備/隕星的品質和數量進行計分。\n8、如倍率加成期間，關卡有活動代幣的隨機掉落（如神奇旅途的骰子等），活動代幣不享受倍率加成，請指揮官注意。", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "神器材料副本开启夺宝狂潮，活动期间，消耗一次自动战斗消耗2倍体力，可获得2次奖励", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "神器材料副本開啟奪寶狂潮。活動期間，進行一次自動戰鬥，可消耗2倍體力，獲得2次獎勵。", "", ""], ["LANG_STRID_push_summon_Numera", "传说英雄「努梅拉&amp;艾莉恩」限时UP", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "傳說英雄「努美拉」＆「艾莉恩」召喚機率限時提升", "", ""], ["LANG_STRID_push_summon_Fuen", "传说英雄「弗恩&amp;阿耳忒弥斯」限时UP", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "傳說英雄「弗恩」＆「阿緹密斯」召喚機率限時提升", "", ""], ["LANG_STRID_push_summon_Nyx2", "传说英雄「尼克斯&amp;玛尔蔚拉」限时UP", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "傳說英雄「尼克斯」＆「瑪爾蔚拉」召喚機率限時提升", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "“梦蛇”皮肤礼包", "Dream Serpent Skin Bundle", "「夢蛇」造型禮包", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "瓦尔基拉·极光圣裁", "&quot;Tya&#x27;s Champion&quot; Valkyra", "瓦爾基拉・極光聖裁", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "阿拉夏·蜕身枯骸", "&quot;The Hollow Husk&quot; Aracha", "阿拉夏・蛻身枯骸", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "希瑟拉皮肤礼包", "Sythra Skin Bundle", "希瑟拉造型禮包", "", ""], ["LANG_STRID_notice_aelsgl", "艾尔莉丝玩法推荐", "Hero Gameplay: Eirlys", "艾爾莉絲玩法推薦", "", ""], ["LANG_STRID_notice_xslgl", "希瑟拉玩法推荐", "Hero Gameplay: Sythra", "希瑟拉玩法推薦", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;在本期神圣召唤活动中，&lt;color=#fdbe36&gt;所有5星传说英雄&lt;/color&gt;的召唤获取概率提升&lt;color=#b490fc&gt;2&lt;/color&gt;倍。同时，以下up英雄的召唤获取概率相比同品质的其他英雄提升&lt;color=#b490fc&gt;20&lt;/color&gt;倍。同品质的其他英雄掉落概率均等。&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;在本卡池召唤时，当获得的传说英雄并非是UP英雄时，则所有UP英雄召唤概率*在后续召唤中将额外获得提升。&lt;/color&gt;具体规则如下：\n1、首次从本卡池中获得的传说英雄并非是UP英雄时，则后续召唤时所有UP英雄的召唤概率*将在原有的基础上提升&lt;color=#b490fc&gt;10&lt;/color&gt;倍；\n2、若再次召唤获得的传说英雄仍然不是UP英雄时，则后续召唤时所有UP英雄召唤概率*再提升&lt;color=#b490fc&gt;10&lt;/color&gt;倍。以此类推，直到获得UP英雄为止。\n&lt;color=#91887c&gt;以上文本中的召唤概率*均是指UP英雄相比于其他英雄的召唤获取概率。 &lt;/color&gt;\n\n&lt;color=#df161f&gt;注意：该机制在本期卡池仅限生效1次。&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;在本期神聖召喚活動中，&lt;color=#fdbe36&gt;所有5星傳說英雄&lt;/color&gt;的召喚獲得機率提升&lt;color=#b490fc&gt;2&lt;/color&gt;倍。同時，以下機率提升英雄的召喚獲得機率相比同品質的其他英雄提升&lt;color=#b490fc&gt;20&lt;/color&gt;倍。同品質的其他英雄掉落機率均等。&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;在本卡池召喚時，當獲得的傳說英雄並非是機率提升英雄時，則所有機率提升英雄召喚機率*在後續召喚中將額外獲得提升。&lt;/color&gt;具體規則如下：\n1、首次從本卡池中獲得的傳說英雄並非是機率提升英雄時，則後續召喚時所有機率提升英雄的召喚機率*將在原有的基礎上提升&lt;color=#b490fc&gt;10&lt;/color&gt;倍；\n2、若再次召喚獲得的傳說英雄仍然不是機率提升英雄時，則後續召喚時所有機率提升英雄召喚機率*再提升&lt;color=#b490fc&gt;10&lt;/color&gt;倍。以此類推，直到獲得機率提升英雄為止。\n&lt;color=#91887c&gt;以上文本中的召喚機率*均是指機率提升英雄相比於其他英雄的召喚獲得機率。&lt;/color&gt;\n\n&lt;color=#df161f&gt;注意：該機制在本期卡池僅限生效1次。&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "治疗效果+<span style=\"color: #1e8852;\">8</span>", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "治療效果+<span style=\"color: #1e8852;\">8</span>", "", ""], ["Awakening_mAwakeningDesc_2209_4", "自然回怒+<span style=\"color: #1e8852;\">1</span>", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "自然回怒+<span style=\"color: #1e8852;\">1</span>", "", ""], ["Awakening_mAwakeningDesc_2271_1", "费用-<span style=\"color: #1e8852;\">2</span>", "Cost -<span style=\"color: #1e8852;\">2</span>", "費用-<span style=\"color: #1e8852;\">2</span>", "", ""], ["Awakening_mAwakeningDesc_2321_2", "攻击+<span style=\"color: #1e8852;\">300</span>", "ATK +<span style=\"color: #1e8852;\">300</span>", "攻擊+<span style=\"color: #1e8852;\">300</span>", "", ""], ["Awakening_mAwakeningDesc_2321_4", "穿透+<span style=\"color: #1e8852;\">8%</span>", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "穿透+<span style=\"color: #1e8852;\">8%</span>", "", ""], ["Awakening_mProphecyDesc_2209_1", "再微弱的光，也能刺破黑暗。", "Even the faintest rays dispel darkness.", "再微弱的光，也能刺破黑暗。", "", ""], ["Awakening_mProphecyDesc_2209_2", "心有火种，光明自生。", "Light grows where we dare to nurture it.", "心有火種，光明自生。", "", ""], ["Awakening_mProphecyDesc_2209_3", "纵然风暴将至，此心不渝。", "Though storms brew on the horizon, I choose to believe.", "縱然風暴將至，此心不渝。", "", ""], ["Awakening_mProphecyDesc_2209_4", "预言何须盲从？真理自在人心。", "Pander not to prophecies, for real truth lies within.", "預言何須盲從？真理自在人心。", "", ""], ["Awakening_mProphecyDesc_2209_5", "光明之下，黑暗无处遁形。", "All shall be revealed before the light.", "光明之下，黑暗無所遁形。", "", ""], ["Awakening_mProphecyDesc_2321_1", "更锐利的毒牙，更致命的我。", "These fangs are beginning to sharpen...", "更鋒利的毒牙，更致命的我。", "", ""], ["Awakening_mProphecyDesc_2321_2", "拥抱蜕变，迎接崭新的自己。", "With each skin shed, I become something more.", "擁抱蛻變，迎接煥然一新的自己。", "", ""], ["Awakening_mProphecyDesc_2321_3", "卑微的蝼蚁只配仰望我的无上威仪。", "Kneel, wretched cur… I am beyond divinity.", "卑微的螻蟻，只配仰望我的無上威儀。", "", ""], ["Awakening_mProphecyDesc_2321_4", "我的剧毒，无药可解。", "There is no antidote for my power.", "我的劇毒，無藥可解。", "", ""], ["Awakening_mProphecyDesc_2321_5", "忘却秩序与混沌，臣服于蛇的意志吧！", "There is no chaos, no order… only the serpent's will!", "忘卻秩序與混沌，俯首臣服於蛇之意志吧！", "", ""], ["BUFFAttribute_mName_100251", "伤害提升", "DMG Increase", "傷害提升", "", ""], ["BUFFAttribute_mName_322090", "静谧之息", "Serene Breath", "靜謐之息", "", ""], ["BUFFAttribute_mName_322091", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_322092", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_322093", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_322094", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_322095", "愈合祷言", "Healing Prayer", "癒合禱言", "", ""], ["BUFFAttribute_mName_323210", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mName_323211", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mName_323212", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mName_323213", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mName_323214", "蛇吻者", "Tormented Soul", "蛇吻者", "", ""], ["BUFFAttribute_mTips_100251", "伤害增加{20,num/100}%，同类效果取最高", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "傷害增加{20,num/100}%，同類型效果中只會保留最高效果", "", ""], ["BUFFAttribute_mTips_321900", "每秒获得自身攻击力{30,num}%的护盾，最多获得自身攻击力{31,num}%的护盾。", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "每秒獲得相當於自身攻擊力{30,num}%的護盾，最多可獲得相當於自身攻擊力{31,num}%的護盾。", "", ""], ["BUFFAttribute_mTips_322090", "每2秒驱散1个减益效果。艾尔莉丝治疗携带静谧之息的友方时，额外提升{30,num}%治疗加成。场上最多存在2个携带静谧之息的友方。", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "每2秒驅散1個減益效果。艾爾莉絲治療攜帶靜謐之息的友方時，額外提升{30,num}%治療加成。場上最多存在2個攜帶靜謐之息的友方。", "", ""], ["BUFFAttribute_mTips_322091", "携带者生命降低至{30,num}%以下时立即提供{31,num}%基于施加者攻击的治疗并移除此状态；状态持续时间自然结束或被刷新时，为携带者提供{32,num}%基于施加者攻击的治疗。此状态不可被驱散。", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "攜帶者生命值降低至{30,num}%以下時立即提供{31,num}%基於施加者攻擊的治療並移除此狀態；狀態持續時間自然結束或被更新時，為攜帶者提供{32,num}%基於施加者攻擊的治療。此狀態（無法被驅散）。", "", ""], ["BUFFAttribute_mTips_322092", "携带者生命降低至{30,num}%以下时立即提供{31,num}%基于施加者攻击的治疗并移除此状态；状态持续时间自然结束或被刷新时，为携带者提供{32,num}%基于施加者攻击的治疗。此状态不可被驱散。", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "攜帶者生命值降低至{30,num}%以下時立即提供{31,num}%基於施加者攻擊的治療並移除此狀態；狀態持續時間自然結束或被更新時，為攜帶者提供{32,num}%基於施加者攻擊的治療。此狀態（無法被驅散）。", "", ""], ["BUFFAttribute_mTips_322093", "携带者生命降低至{30,num}%以下时立即提供{31,num}%基于施加者攻击的治疗并移除此状态；状态持续时间自然结束或被刷新时，为携带者提供{32,num}%基于施加者攻击的治疗。此状态不可被驱散。", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "攜帶者生命值降低至{30,num}%以下時立即提供{31,num}%基於施加者攻擊的治療並移除此狀態；狀態持續時間自然結束或被更新時，為攜帶者提供{32,num}%基於施加者攻擊的治療。此狀態（無法被驅散）。", "", ""], ["BUFFAttribute_mTips_322094", "携带者生命降低至{30,num}%以下时立即提供{31,num}%基于施加者攻击的治疗并移除此状态；状态持续时间自然结束或被刷新时，为携带者提供{32,num}%基于施加者攻击的治疗。此状态不可被驱散。", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "攜帶者生命值降低至{30,num}%以下時立即提供{31,num}%基於施加者攻擊的治療並移除此狀態；狀態持續時間自然結束或被更新時，為攜帶者提供{32,num}%基於施加者攻擊的治療。此狀態（無法被驅散）。", "", ""], ["BUFFAttribute_mTips_322095", "携带者生命降低至{30,num}%以下时立即提供{31,num}%基于施加者攻击的治疗并移除此状态；状态持续时间自然结束或被刷新时，为携带者提供{32,num}%基于施加者攻击的治疗。此状态不可被驱散。", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "攜帶者生命值降低至{30,num}%以下時立即提供{31,num}%基於施加者攻擊的治療並移除此狀態；狀態持續時間自然結束或被更新時，為攜帶者提供{32,num}%基於施加者攻擊的治療。此狀態（無法被驅散）。", "", ""], ["BUFFAttribute_mTips_322710", "对前方至多{31,num}个敌人造成1次范围魔法伤害，可以攻击空中目标，且神圣突刺对敌人附加{32,num}%的魔法易伤，持续{33,num}秒。", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "對前方最多{31,num}名敵人造成1次範圍魔法傷害，可以攻擊空中目標，且神聖突刺對敵人附加{32,num}%的魔法易傷，持續{33,num}秒。", "", ""], ["BUFFAttribute_mTips_322928", "火尖枪会无视敌人{30,num}%的防御；乾坤圈会额外弹射{31,num}次并可对相同目标重复弹射；阴阳剑会斩杀血量低于{32,num}%的普通怪物。", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "火尖槍會無視敵人{30,num}%的防禦；乾坤圈會額外彈射{31,num}次並可對相同目標重複彈射；陰陽劍會斬殺血量低於{32,num}%的普通怪物。", "", ""], ["BUFFAttribute_mTips_323210", "快速对主人攻击范围内的1名敌人射击，初始状态可以射击{30,num}次，每次造成{31,num}%的伤害。次数耗尽后蛇吻者会自然消亡。优先攻击空中目标。箭矢击中已阵亡的目标时会返回次数。场上最多存在{32,num}个。", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", "", ""], ["BUFFAttribute_mTips_323211", "快速对主人攻击范围内的1名敌人射击，初始状态可以射击{30,num}次，每次造成{31,num}%的伤害。次数耗尽后蛇吻者会自然消亡。优先攻击空中目标。箭矢击中已阵亡的目标时会返回次数。场上最多存在{32,num}个。", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", "", ""], ["BUFFAttribute_mTips_323212", "快速对主人攻击范围内的1名敌人射击，初始状态可以射击{30,num}次，每次造成{31,num}%的伤害。次数耗尽后蛇吻者会自然消亡。优先攻击空中目标。箭矢击中已阵亡的目标时会返回次数。场上最多存在{32,num}个。", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", "", ""], ["BUFFAttribute_mTips_323213", "快速对主人攻击范围内的1名敌人射击，初始状态可以射击{30,num}次，每次造成{31,num}%的伤害。次数耗尽后蛇吻者会自然消亡。优先攻击空中目标。箭矢击中已阵亡的目标时会返回次数。场上最多存在{32,num}个。", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", "", ""], ["BUFFAttribute_mTips_323214", "快速对主人攻击范围内的1名敌人射击，初始状态可以射击{30,num}次，每次造成{31,num}%的伤害。次数耗尽后蛇吻者会自然消亡。优先攻击空中目标。箭矢击中已阵亡的目标时会返回次数。场上最多存在{32,num}个。", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "快速射擊主人攻擊範圍內的1名敵人，初始狀態可射擊{30,num}次，每次造成{31,num}%傷害。次數耗盡後，蛇吻者將自然消亡。優先攻擊空中目標。箭矢擊中已陣亡的目標時會返回次數。場上最多存在{32,num}個。", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "参与装备副本I，获得奖杯，兑换大奖", "Participate in Gear Raid I to win trophies and redeem rewards.", "參與裝備副本Ⅰ，獲得獎盃，兌換大獎", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "参与装备副本II，获得奖杯，兑换大奖", "Participate in Gear Raid II to win trophies and redeem rewards.", "參與裝備副本Ⅱ，獲得獎盃，兌換大獎", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "参与装备副本III，获得奖杯，兑换大奖", "Participate in Gear Raid III to win trophies and redeem rewards.", "參與裝備副本Ⅲ，獲得獎盃，兌換大獎", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "召唤英雄，获得奖杯，兑换大奖", "Summon heroes to win trophies and redeem rewards.", "召喚英雄，獲得獎盃，兌換大獎", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "升级升星进阶英雄，升级技能，获得奖杯，兑换大奖", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "升級、升星、進階英雄、升級技能，獲得獎盃，兌換大獎", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "参与神器材料副本，获得奖杯，兑换大奖", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "參與神器材料副本，獲得獎盃，兌換大獎", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "参与装备副本I，获得奖杯，兑换大奖", "Participate in Gear Raid I to win trophies and redeem rewards.", "參與裝備副本Ⅰ，獲得獎盃，兌換大獎", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "英雄降临巅峰排行榜", "Arrival of Heroes Ultimate Leaderboard", "英雄降臨巔峰排行榜", "", ""], ["ChampionshipPlan_mChampionshipName_843", "失落遗产", "The Lost Legacy", "失落遺產", "", ""], ["ChampionshipPlan_mChampionshipName_844", "沙海宝库", "Vault in the Sands", "沙海寶庫", "", ""], ["ChampionshipPlan_mChampionshipName_845", "迷失之地", "Forgotten Palace", "迷失之地", "", ""], ["ChampionshipPlan_mChampionshipName_846", "英雄降临", "Arrival of Heroes", "英雄降臨", "", ""], ["ChampionshipPlan_mChampionshipName_847", "英雄培养", "Hero Training", "英雄培養", "", ""], ["ChampionshipPlan_mChampionshipName_848", "神器秘境", "Mystery of Artifacts", "神器秘境", "", ""], ["ChampionshipPlan_mChampionshipName_849", "失落遗产", "The Lost Legacy", "失落遺產", "", ""], ["Chapter_mChapterName_9032", "故事章节", "Story Chapter", "故事章節", "", ""], ["Chapter_mChapterName_9033", "挑战章节", "Challenge Chapter", "挑戰章節", "", ""], ["ChapterType_mChapterName_214", "公版IP", "Public Domain IP", "公版IP", "", ""], ["ChapterType_mChapterName_801", "僵尸被我包围了(买量)", "Zombie Invasion", "殭屍被我包圍了", "", ""], ["CommonText_mMessage_1539", "频道切换中", "Switching channels...", "頻道切換中", "", ""], ["CommonText_mMessage_24292", "战斗场次", "Challenges", "戰鬥場次", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">试炼石板</span><br>在游戏中各处玩法，可以获得试炼石板，石板有多种类型，多个等级，每个石板都包含了不同的星象暗语，将其嵌入祭坛中，可以开启前往该试炼的通路。<br><br><span style=\"color: #cec2b1;\">挑战说明</span><br>每一场战斗均有多波怪物，每消灭一波怪物，都将获得宝箱奖励；战斗开启后，无法重新开始，如中途退出将按照当前的战斗进度进行结算。每月可消耗200个石板进行试炼挑战，达到上限后当月不可再进行挑战。<br><br><span style=\"color: #cec2b1;\">石板能量</span><br>每个石板都拥有特定的能量，<span style=\"color: #fdbe36;\">每次进入试炼都将扣除1点能量，</span>战斗结束时，如石板仍有能量，可以选择放弃此次奖励离开，重新消耗能量开启试炼。能量消耗不计入每月石板消耗。<br><br><span style=\"color: #cec2b1;\">石板销毁</span><br>可以将符合销毁等级的石板进行销毁，销毁石板不会获得任何奖励，不计入每月石板消耗。<br><span style=\"color: #fd4540;\">拥有的石板有容量上限，当石板背包已满时，将无法再获得石板，请注意即时使用。</span>", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">試煉石板</span><br>在遊戲中各處玩法，可以獲得試煉石板，石板有多種類型，多個等級，每個石板都包含了不同的星象暗語，將其嵌入祭壇中，可以開啟前往該試煉的通路。<br><br><span style=\"color: #cec2b1;\">挑戰說明</span><br>每一場戰鬥均有多波怪物，每消滅一波怪物，都將獲得寶箱獎勵；戰鬥開啟後，無法重新開始，如中途退出將按照目前的戰鬥進度進行結算。每月可消耗200個石板進行試煉挑戰，達到上限後當月不可再進行挑戰。<br><br><span style=\"color: #cec2b1;\">石板能量</span><br>每個石板都擁有特定的能量，<span style=\"color: #fdbe36;\">每次進入試煉都將扣除1點能量，</span>戰鬥結束時，如石板仍有能量，可以選擇放棄此次獎勵離開，重新消耗能量開啟試煉。能量消耗不計入每月石板消耗。<br><br><span style=\"color: #cec2b1;\">石板銷毀</span><br>可以將符合銷毀等級的石板進行銷毀，銷毀石板不會獲得任何獎勵，不計入每月石板消耗。<br><span style=\"color: #fd4540;\">擁有的石板有容量上限，當石板背包已滿時，將無法再獲得石板，請注意即時使用。</span>", "", ""], ["CommonText_mMessage_25383", "幽潮密钥", "Mossy Crystal", "幽影狂潮密鑰", "", ""], ["CommonText_mMessage_25384", "熔火岩板", "Molten Crystal", "熔火岩板", "", ""], ["CommonText_mMessage_25602", "进入战斗后，将不可重新开始，中途退出立刻结算，已消耗的能量不会返还！", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "進入戰鬥後，將不可重新開始，中途退出立即結算，已消耗的能量不會返還！", "", ""], ["CommonText_mMessage_25702", "末日时熔岩涌动的火山地带，需要更多的高台英雄，阻击末世的邪恶力量。", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "末日時熔岩湧動的火山地帶，需要更多的高台英雄，阻擊末世的邪惡力量。", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">确定卸任该玩家的统帅职位吗？</span><br>每个公会最多有{num1}名统帅，统帅每轮进攻次数可增加{num2}次。", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">確定卸任該玩家的統帥職位嗎？</span><br>每個公會最多有{num1}名統帥，統帥每輪進攻次數可增加{num2}次。", "", ""], ["CommonText_mMessage_25931", "本次积分", "Points of the Round", "本次積分", "", ""], ["CommonText_mMessage_26126", "销毁", "Destroy", "銷毀", "", ""], ["CommonText_mMessage_26127", "是否确认销毁{name}？<br><span style=\"color: #fd4540;\">石板销毁后不可恢复，且不会获得物品。</span>", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "是否確認銷毀{name}？<br><span style=\"color: #fd4540;\">石板銷毀後不可回復，且不會獲得物品。</span>", "", ""], ["CommonText_mMessage_26128", "石板已被销毁", "Keystone has been destroyed.", "石板已被銷毀", "", ""], ["CommonText_mMessage_26129", "能量：", "Energy:", "能量：", "", ""], ["CommonText_mMessage_26130", "放弃并离开", "Give up and leave", "放棄並離開", "", ""], ["CommonText_mMessage_26131", "领取奖励", "Claim", "领取奖励", "", ""], ["CommonText_mMessage_26132", "石板剩余能量：", "Remaining Keystone Energy:", "石板剩餘能量：", "", ""], ["CommonText_mMessage_26133", "战斗图鉴", "Battle Gallery", "戰鬥圖鑑", "", ""], ["CommonText_mMessage_26134", "攻略", "Guides", "攻略", "", ""], ["CommonText_mMessage_26135", "出现石板：", "Appearing Keystone:", "出現石板：", "", ""], ["CommonText_mMessage_26136", "幽潮秘钥", "Mossy Crystal", "幽影狂潮密鑰", "", ""], ["CommonText_mMessage_26137", "熔火岩板", "Molten Crystal", "熔火岩板", "", ""], ["CommonText_mMessage_26138", "仅显示当前石板词条", "Only Display Current Keystone Tags", "僅顯示目前石板詞條", "", ""], ["CommonText_mMessage_26139", "热度根据英雄出场情况计算，仅作参考", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "熱度根據英雄出場情況計算，僅作參考", "", ""], ["CommonText_mMessage_26140", "搜索", "Search", "搜尋", "", ""], ["CommonText_mMessage_26141", "搜索结果", "Search Results", "搜尋結果", "", ""], ["CommonText_mMessage_26142", "数据加载中", "Loading data...", "資料載入中", "", ""], ["CommonText_mMessage_26143", "英雄数据正在收集中", "Collecting Hero Data", "英雄資料正在收集中", "", ""], ["CommonText_mMessage_26144", "至少输入{num}个字符", "Enter at least {num} character(s)", "至少輸入{num}個字元", "", ""], ["CommonText_mMessage_26145", "没有匹配的词条", "No matching tags found.", "沒有匹配的詞條", "", ""], ["CommonText_mMessage_26146", "当前等级的石板未开启自动战斗", "Auto-fight is unavailable for the current level of Keystone.", "目前等級的石板未開啟自動戰鬥", "", ""], ["CommonText_mMessage_26147", "手动通关第{num}波后，可上传自动战斗记录", "You can upload Auto-fight records after manually clearing Wave {num}.", "手動通過第{num}波後，可上傳自動戰鬥紀錄", "", ""], ["CommonText_mMessage_26148", "由于石板的词条不同，使用自动战斗可能会出现失败情况，是否确认进行自动战斗", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "由於石板的詞條不同，使用自動戰鬥可能會出現失敗情況，是否確定進行自動戰鬥？", "", ""], ["CommonText_mMessage_26149", "是否上传此次战斗为新的自动战斗记录", "Upload this battle as a new Auto-fight record?", "要上傳此次戰鬥為新的自動戰鬥紀錄嗎？", "", ""], ["CommonText_mMessage_26150", "由于石板的词条不同，建议您选择尽可能全面的阵容，用于上传自动战斗！", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "由於石板的詞條不同，建議您選擇盡可能全面的陣容，用於上傳自動戰鬥！", "", ""], ["CommonText_mMessage_26151", "石板背包已满，请先消耗后，再进行购买", "Keystone storage is full. Use some Keystones before buying more.", "石板背包已滿，請先消耗後，再進行購買", "", ""], ["CommonText_mMessage_26152", "前往清理", "Go Clean", "前往清理", "", ""], ["CommonText_mMessage_26153", "检测到您的仓库中，有尚未开启的随机石板宝箱，是否前往开启", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "偵測到您的倉庫中，有尚未開啟的隨機石板寶箱，是否前往開啟？", "", ""], ["CommonText_mMessage_26154", "前往", "Go", "前往", "", ""], ["CommonText_mMessage_26155", "等级{num1}-{num2}", "Lvl. {num1}-{num2}", "等級{num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "该等级石板不可销毁", "This level's Keystone cannot be destroyed.", "該等級石板不可銷毀", "", ""], ["CommonText_mMessage_26157", "是否确认销毁<span style=\"color: #fd4540;\">{num}</span>个石板？<br><span style=\"color: #fd4540;\">石板销毁后不可恢复，且不会获得物品。</span>", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "是否確認銷毀<span style=\"color: #fd4540;\">{num}</span>個石板？<br><span style=\"color: #fd4540;\">石板銷毀後不可恢復，且不會獲得物品。</span>", "", ""], ["CommonText_mMessage_26158", "已销毁{num}个石板", "Destroyed {num} Keystone(s).", "已銷毀{num}個石板", "", ""], ["CommonText_mMessage_26159", "当月消耗：", "Monthly Usage:", "當月消耗：", "", ""], ["CommonText_mMessage_26160", "石板每月有挑战上限，达到上限后不可再挑战", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "石板每月有挑戰上限，達到上限後不可再挑戰", "", ""], ["CommonText_mMessage_26161", "当前难度有可以领取的奖励，是否确认前往其他难度进行尝试<br><span style=\"color: #e04242;\">活动期间，每日仅可以选择一个难度领取奖励</span>", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "目前難度有可以領取的獎勵，是否確認前往其他難度進行嘗試<br><span style=\"color: #e04242;\">活動期間，每日僅可以選擇一個難度領取獎勵</span>", "", ""], ["CommonText_mMessage_26162", "不再提醒", "Don't remind me again.", "不再提醒", "", ""], ["CommonText_mMessage_26163", "石板背包已满，请先消耗后，再进行使用", "Keystone storage is full. Please use some first before unlocking.", "石板背包已滿，請先消耗後，再進行使用", "", ""], ["CommonText_mMessage_26164", "录像版本与当前版本不一致，无法查看", "Replay version does not match current version and cannot be viewed.", "錄像版本與目前版本不一致，無法查看", "", ""], ["CommonText_mMessage_26165", "至多输入{num}个字符", "Enter up to {num} character(s).", "至多輸入{num}個字元", "", ""], ["CommonText_mMessage_26166", "出场高热度英雄", "Popular Heroes", "出場高熱度英雄", "", ""], ["CommonText_mMessage_26167", "词条", "Tag", "詞條", "", ""], ["CommonText_mMessage_8411", "试炼石板背包已满", "Trial Keystone Storage Full", "試煉石板背包已滿", "", ""], ["Difficulty_mDetail_73001", "噬魂者移动速度降低30，<span style=\"color: #fd4540;\">免疫减速控制</span>", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "噬魂者移動速度降低30，<span style=\"color: #fd4540;\">免疫緩速控制</span>", "", ""], ["Difficulty_mDetail_73003", "白塔学者获得<span style=\"color: #fd4540;\">隐身</span>，被阻挡后显形", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "白塔學者獲得<span style=\"color: #fd4540;\">隱身</span>，被阻擋後顯形", "", ""], ["Difficulty_mDetail_73004", "白塔学者免疫<span style=\"color: #fd4540;\">法术伤害</span>", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "白塔學者免疫<span style=\"color: #fd4540;\">法術傷害</span>", "", ""], ["Difficulty_mDetail_73005", "小噬蛛死亡时获得3s<span style=\"color: #fd4540;\">不屈</span>且<span style=\"color: #fd4540;\">免疫控制和减速</span>", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "小噬蛛死亡時獲得3秒<span style=\"color: #fd4540;\">不屈</span>且<span style=\"color: #fd4540;\">免疫控制和緩速</span>", "", ""], ["Difficulty_mDetail_73006", "小噬蛛每5s<span style=\"color: #fd4540;\">恢复自身50%的生命值</span>", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "小噬蛛每5秒<span style=\"color: #fd4540;\">回復自身50%的生命值</span>", "", ""], ["Difficulty_mDetail_73007", "闪电守卫<span style=\"color: #fd4540;\">移动速度增加30</span>", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "閃電守衛<span style=\"color: #fd4540;\">移動速度增加30</span>", "", ""], ["Difficulty_mDetail_73008", "闪电守卫<span style=\"color: #fd4540;\">免疫受到的伤害</span>，但是每秒损失5%的血量", "Lightning Guard is <span style=\"color: #fd4540;\">immune to DMG taken</span>, but loses 5% HP per sec.", "閃電守衛<span style=\"color: #fd4540;\">免疫所受的傷害</span>，但每秒損失5%生命值", "", ""], ["Difficulty_mDetail_73009", "扭曲之舌的虚弱效果<span style=\"color: #fd4540;\">持续永久</span>", "Murkling Menace's Fatigue becomes <span style=\"color: #fd4540;\">permanent</span>.", "扭曲之舌的虛弱效果<span style=\"color: #fd4540;\">持續永久</span>", "", ""], ["Difficulty_mDetail_73010", "坚甲巨蜥<span style=\"color: #fd4540;\">免疫控制效果</span>", "Plated Komodo is <span style=\"color: #fd4540;\">immune to CC Effects</span>.", "堅甲巨蜥<span style=\"color: #fd4540;\">免疫控制效果</span>", "", ""], ["Difficulty_mDetail_73011", "坚甲巨蜥<span style=\"color: #fd4540;\">被阻挡时</span>额外获得30%的物理和法术减伤", "Plated Komodo gains an additional 30% P. and M. DMG Reduction <span style=\"color: #fd4540;\">when blocked</span>.", "堅甲巨蜥<span style=\"color: #fd4540;\">被阻擋時</span>額外獲得30%的物理和法術減傷", "", ""], ["Difficulty_mDetail_73012", "冰霜祭祀<span style=\"color: #fd4540;\">额外召唤</span>一只冰霜爆虫", "Frozen Cleric <span style=\"color: #fd4540;\">summons an extra</span> Ice Vermin.", "冰霜祭祀<span style=\"color: #fd4540;\">額外召喚</span>一隻冰霜爆蟲", "", ""], ["Difficulty_mDetail_73013", "冰霜祭祀<span style=\"color: #fd4540;\">死亡时生成</span>三只冰霜爆虫", "Frozen Cleric <span style=\"color: #fd4540;\">spawns</span> 3 Ice Vermin <span style=\"color: #fd4540;\">upon death</span>.", "冰霜祭祀<span style=\"color: #fd4540;\">死亡時生成</span>三隻冰霜爆蟲", "", ""], ["Difficulty_mDetail_73014", "雷霆守卫停止攻击，<span style=\"color: #fd4540;\">移动速度增加50</span>", "Thunder Guard stops attacking and gains <span style=\"color: #fd4540;\">Movement Spd. +50</span>.", "雷霆守衛停止攻擊，<span style=\"color: #fd4540;\">移動速度增加50</span>", "", ""], ["Difficulty_mDetail_73015", "雷霆守卫<span style=\"color: #fd4540;\">攻击力提升100%</span>，但是<span style=\"color: #fd4540;\">攻击到护盾时</span>会扣除自身50%的生命值", "Thunder Guard's <span style=\"color: #fd4540;\">ATK is increased by 100%</span>, but <span style=\"color: #fd4540;\">when attacking shields</span>, deducts 50% of its HP.", "雷霆守衛<span style=\"color: #fd4540;\">攻擊力提升100%</span>，但是<span style=\"color: #fd4540;\">攻擊到護盾時</span>會扣除自身50%的生命值", "", ""], ["Difficulty_mDetail_73016", "死雾亡眼<span style=\"color: #fd4540;\">免疫法术伤害</span>", "Fogborne Dead Eye is <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "死霧亡眼<span style=\"color: #fd4540;\">免疫法術傷害</span>", "", ""], ["Difficulty_mDetail_73017", "迷雾·塞勒姆男爵每次攻击会<span style=\"color: #fd4540;\">恢复10%血量</span>", "Mist: Baron Salem restores <span style=\"color: #fd4540;\">10% HP</span> with each ATK.", "迷霧・塞勒姆男爵每次攻擊會<span style=\"color: #fd4540;\">回復10%生命值</span>", "", ""], ["Difficulty_mDetail_73018", "孵化者的急速孵化<span style=\"color: #fd4540;\">cd减少100%</span>", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">Cooldown is reduced by 100%</span>.", "孵化者的急速孵化<span style=\"color: #fd4540;\">冷卻時間減少100%</span>", "", ""], ["Difficulty_mDetail_73019", "孵化者的急速孵化<span style=\"color: #fd4540;\">额外产生2只爆虫</span>", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">spawns 2 extra Suicides</span>.", "孵化者的急速孵化額外產生<span style=\"color: #fd4540;\">2隻爆蟲</span>", "", ""], ["Difficulty_mDetail_73020", "雷之祭司对目标造成伤害时会<span style=\"color: #fd4540;\">汲取目标10%的怒气</span>", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">drains 10% of the target's Rage</span>.", "雷之祭司對目標造成傷害時會<span style=\"color: #fd4540;\">汲取目標10%的怒氣</span>", "", ""], ["Difficulty_mDetail_73021", "雷之祭司对目标造成伤害时会<span style=\"color: #fd4540;\">永久降低其10%的血量上限</span>，可叠加", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">permanently reduces their Max HP by 10%</span>. This effect can be stacked.", "雷之祭司對目標造成傷害時會<span style=\"color: #fd4540;\">永久降低其10%生命值上限</span>，可疊加", "", ""], ["Difficulty_mDetail_73022", "血疫会<span style=\"color: #fd4540;\">降低范围内所有单位</span>50%受到的<span style=\"color: #fd4540;\">治疗量</span>", "Scourge reduces <span style=\"color: #fd4540;\">healing</span> received by <span style=\"color: #fd4540;\">all units in range</span> by 50%.", "血疫會<span style=\"color: #fd4540;\">降低範圍內所有單位</span>50%受到的<span style=\"color: #fd4540;\">治療量</span>", "", ""], ["Difficulty_mDetail_73023", "血疫的伤害范围扩大至<span style=\"color: #fd4540;\">周围两圈</span>", "Scourge's DMG range expands to <span style=\"color: #fd4540;\">adjacent 2 tiles</span>.", "血疫的傷害範圍擴大至<span style=\"color: #fd4540;\">周圍2圈</span>", "", ""], ["Difficulty_mDetail_73024", "迷雾·上级深渊魔眼死亡时对<span style=\"color: #fd4540;\">阻挡目标</span>造成攻击力100%的魔法伤害", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to <span style=\"color: #fd4540;\">blocked targets</span>.", "迷霧・上級深淵魔眼死亡時對<span style=\"color: #fd4540;\">阻擋目標</span>造成攻擊力100%的魔法傷害", "", ""], ["Difficulty_mDetail_73025", "狂暴变异巨鼠变为<span style=\"color: #fd4540;\">不可阻挡</span>", "Raging Mutant Rodent becomes <span style=\"color: #fd4540;\">unblockable</span>.", "狂暴變異巨鼠變為<span style=\"color: #fd4540;\">不可阻擋</span>", "", ""], ["Difficulty_mDetail_73026", "狂暴变异巨鼠<span style=\"color: #fd4540;\">移动速度增加30</span>", "Raging Mutant Rodent <span style=\"color: #fd4540;\">increases Movement Spd. by 30</span>.", "狂暴變異巨鼠<span style=\"color: #fd4540;\">移動速度增加30</span>", "", ""], ["Difficulty_mDetail_73027", "塞勒姆男爵每降低20%的血量，会<span style=\"color: #fd4540;\">增加20%的双防</span>", "For every 20% HP Baron Salem loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "塞勒姆男爵的生命值每降低20%，會<span style=\"color: #fd4540;\">增加20%的雙防</span>", "", ""], ["Difficulty_mDetail_73028", "诡术师<span style=\"color: #fd4540;\">移动速度增加30</span>", "Shadowcaster's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "詭術師<span style=\"color: #fd4540;\">移動速度增加30</span>", "", ""], ["Difficulty_mDetail_73029", "诡术师每降低20%的血量，会<span style=\"color: #fd4540;\">增加20%的双防</span>", "For every 20% HP Shadowcaster loses, it <span style=\"color: #fd4540;\">gains 20% DE pSuitDescribe_mSuitEffectDescribe_722800", "（3件套）普通攻击暴击时，自身伤害+10%，持续8秒，最多叠加5层", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "（3件套裝）普通攻擊出現暴擊時，自身傷害+10%，效果持續8秒，最多可疊加5層", "", ""], ["HeroStory_mStory_2209", "“恍如一段我未曾拥有，却永世渴求的回忆。”<br>——瑞文霍德<br><br>他们将她遣至北境，企图用极寒的霜雪压折她的意志，迫其重归“正道”。<br><br>艾尔莉丝曾是埃林蒂斯的圣咏祭司。肃立于古老仪典的中央，她的吟唱与诸神呼吸交织。可当信仰崩塌，她的选择成为了人人避讳的禁忌，圣所难以饶恕的背叛。<br><br>莫里登之战后的数月里，埃林蒂斯在战火屠戮的余烬上修补重建。虽成功击退冥神大军，一道道伤痕却永远烙印，也警醒着触目惊心的现实：精灵城不再牢不可破。家园高塔倾裂，精灵荣光泣血，埃林蒂斯的精灵们需找寻一方隐秘角落，让族人免受战乱侵袭。先知们悄悄将目光投向远方，谨慎地在地图之外的荒芜中寻找战火重燃时的栖身之所。<br><br>占卜的水晶兀然映出北境的轮廓——寒冷、荒芜，如一把森冷的孤刃悬于大陆尽头。北霜之王哈尔兹威名远扬，他们不敢贸然进犯；而在精灵探子未能踏足的极寒之境，瑞文霍德统御着这片冰天雪地。这位骁勇善战的领袖未曾加冕，但他的统治地位无可撼动。精灵们需要更深入地了解这位无冕之王：精灵的战力是否足够掀翻他的权势？若真要彻底瓦解他的统治，代价几何？<br><br>于是艾尔莉丝成为了最合适的棋子。并非使臣，亦非间谍，而是一枚被精心伪装的弃子。族内以冠冕堂皇的理由命她前去，令其向神明起誓：取得瑞文霍德的信任，摸清他的为人，将第一手情报传递回遥远的故土。于是她身裹素白而至，谎称自己是司掌寒霜的祭司，为和平而来的游医。而瑞文霍德，这个从不轻信他人的枭雄，竟真的接纳了她。<br><br>治疗伤病，卜卦解兆，她在异乡默默地证明自己的价值，将隐秘的目的深深藏匿。他默默注视，她无声回望。视线交织，某种不可言说的纠葛便悄然生长。<br><br>时光模糊了彼此的界限，二人交织的命运却也让立场的对立愈发清晰。她逐渐读懂了他沉默中的深意，感受到怒火的温度，以及深藏于冷硬表象之下那别扭的温柔。在篝火将熄、密信难传的深夜，她偶尔会悄悄在心里描绘着一个未来——或许，自己真的可以放心依赖他；或许，他也成为了自己更重要的牵绊……但，刺眼晨光总会焚尽残梦。<br><br>与瑞文霍德一样，她也曾梦见雪原上彼此决绝对峙的身影，恐怕这便是二人的终章。注定有一方将挥下刀刃，必有一方的未来会被扼杀。当寒风卷散血雾前的刹那，他们将彻悟生存的代价，也参透彼此存在的意义。<br><br>艾尔莉丝很清楚先知们从未言明的真相：北境从不属于任何人。或许有人可以在此争王称霸，建立城池，但北境永远不会因此被征服。而她这般无根浮萍，终究只是过客。无论等待二人的是怎样的未来，信任都将焚烧殆尽，而命运的车轮将会碾过余烬，滚滚向前。<br><br>她是两股风暴夹缝间的死寂，静待其中一方被撕碎吞没的结局。", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "「恍如一段我未曾擁有，卻永世渴求的回憶。」<br>——瑞文霍德<br><br>他們將她遣至北境，企圖用極寒的霜雪壓折她的意志，迫其重歸「正道」。<br><br>艾爾莉絲曾是埃林蒂斯的聖詠祭司。肅立於古老儀典的中央，她的吟唱與諸神呼吸交織，聲聲入魂。可當信仰崩塌，她的選擇成為了人人避諱的禁忌——聖所難以饒恕的背叛。<br><br>莫里登之戰後的數月裡，埃林蒂斯在戰火屠戮的餘燼上修補重建。雖成功擊退冥神大軍，一道道傷痕卻永遠烙印在族人心中，也警醒著觸目驚心的現實：精靈城不再牢不可破。家園高塔傾裂，精靈榮光泣血，埃林蒂斯的精靈們亟需找尋一方隱秘角落，讓族人免受戰亂侵襲。先知們悄悄將目光投向遠方，謹慎地在地圖之外的荒蕪中尋找戰火重燃時的棲身之所。<br><br>占卜的水晶兀然映出北境的輪廓——寒冷、荒蕪，如一把森冷的孤刃懸於大陸盡頭。北霜之王哈爾茲威名遠揚，他們不敢貿然進犯；而在精靈探子未能踏足的極寒之境深處，瑞文霍德統御著這片冰天雪地。這位驍勇善戰的領袖未曾加冕，但他的統治地位無可撼動。精靈們需要更深入地瞭解這位無冕之王：精靈的戰力是否足夠掀翻他的權勢？若真要徹底瓦解他的統治，代價幾何？<br><br>於是艾爾莉絲成為了最合適的棋子。並非使臣，亦非間諜，而是一枚被精心偽裝的棄子。族內以冠冕堂皇的理由命她前去，令其向神明起誓：取得瑞文霍德的信任，摸清他的為人，將第一手情報傳遞回遙遠的故土。於是她身裹素白而至，謊稱自己是司掌寒霜的祭司，為和平而來的遊醫。而瑞文霍德——這個從不輕信他人的梟雄，竟真的接納了她。<br><br>治療傷病，卜卦解兆，她在異鄉默默地證明自己的價值，將隱秘的目的深深藏匿。他默默注視，她無聲回望。視線交織間，某種不可言說的糾葛便悄然生長。<br><br>時光模糊了彼此的界限，二人交織的命運卻也讓立場的對立越發清晰。她逐漸讀懂了他沉默中的深意，感受到怒火背後的溫度，以及深藏於冷硬表象之下那份彆扭的溫柔。在篝火將熄、密信難傳的深夜，她偶爾會悄悄在心裡描繪著一個未來——或許，自己真的可以放心依賴他；或許，他也成為了自己更重要的牽絆……<br><br>但刺眼的晨光，總會焚盡殘夢。<br><br>與瑞文霍德一樣，她也曾夢見雪原上彼此決絕對峙的身影——恐怕這便是二人的終章。注定有一方將揮下刀刃，必有一方的未來會被扼殺。當寒風卷散血霧前的剎那，他們將徹悟生存的代價，也參透彼此存在的意義。<br><br>艾爾莉絲很清楚先知們從未言明的真相：北境從不屬於任何人。或許有人可以在此爭王稱霸，建立城池，但北境永遠不會因此被征服。而她這般無根浮萍，終究只是過客。無論等待二人的是怎樣的未來，信任都將焚燒殆盡，而命運的車輪將會碾過餘燼，滾滾向前。<br><br>她是兩股風暴夾縫間的死寂，靜待其中一方被撕碎吞沒的結局。", "", ""], ["HeroStory_mStory_2321", "“你会哀求我吞噬你。而我，将赐予你怜悯。”<br>——密林中传来的嘶嘶低语<br><br>在泰亚的翠绿丛林中，根须饮血，古木缠生。绿影重重之处，曾潜伏着一个由毒与影构成的精魂。它无形无体，只有獠牙、饥饿，以及一个模糊不清的名字——希瑟拉。<br><br>在她苏醒之前，丛林曾属于一座伟大的古帝国——蜥蜴人帝国。黑曜铸城，高塔刺破林冠，流溪划断幽谷。但在他们文明最后的余晖中，蜥蜴人将残余的魔力倾注于一尊尊巨像之中——以神兽为形，用赭石与灰烬绘制祝祷，制作成祭品恳求丛林中的神明垂怜回应。<br><br>回应从未降临。只有沉默。<br><br>帝国终被藤蔓吞噬，城池崩塌，万物归林，唯那一座座神像仍佇立林间，布满青苔，半掩半埋，却似仍低语未止。那些神像内早已封印着灵体——蜥蜴人用法术将活人之魂困于像中，作为贡品献给神灵。而不幸误入密林的旅人若靠近其中，往往命丧当场，因这些“神像”本就是献祭之器，是召神之门。希瑟拉，便是回应的神祇之一。她是毒蛇女神，是旧世的残影，是爬入伤者与弱者梦中的低语者。<br><br>但她曾经只是幽魂一缕，直到达苏弥找到了她。<br><br>这位著名的神秘主义者蜥蜴人坚信，梦是通往更深层真理的桥梁。为探寻失落的智慧，他踏入丛林，追随蛇与祭坛的幻象，被一座藤蔓覆盖的庙宇吸引，如同身处深梦之中。在那废墟的中心，他焚香引梦，意识悄然游离于现实与幻境之间——而希瑟拉，在彼岸应声而至。<br><br>无人知晓他们之间究竟发生了什么。是达苏弥自愿献身，还是误开了太深的门扉？总之结果相同：希瑟拉挣脱了虚无，重归世间。蛊蛇魅影再度降临。<br><br>如今，她遵循着密林的法则，狩猎所有自诩高贵之人——所谓正直纯粹者，坚定不移者，皆逃不出她的掌心。她潜入神殿王宫，给予他们最后的选择：屈服，或被吞噬。她渴望重振她蛇裔王朝的荣光——獠牙毕露，以丛林为冠，白骨为座。她梦见藤蔓与毒液交织的城池，梦见万民舍弃软弱，饮下她的剧毒，在痛苦中获得新生。<br><br>如今，她仍被人敬拜。尽管信徒早已分散匿形，传言说达苏弥仍在暗中领导。他们在皮肤上刻下獠牙印记，舌尖滴毒，以痛苦为祭，在神圣的敬奉中追寻极乐。他们祈求被选中，祈求成为食物，因为“被选中”即意味着能被看见，被追猎，方能享受女神的无上恩泽。被毒蛇亲吻者，会感受到力量缠绕灵魂，如蛇蜕皮一般摆脱软弱，焕然重生。那些能在她毒吻中活下来的人，会被她选中，化为她的猎手——致命、绝美，且绝对忠诚。<br><br>而在毒吻无声夺去呼吸，箭矢飞抵心脏咫尺时，他们都会轻声低喃：<br>“谢谢你。”", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "「你終將哀求我吞噬你，而我，亦將施予憐憫。」<br>——密林中傳來的嘶嘶私語<br><br>泰亞翠綠的原始叢林中，根鬚渴血，古木盤生。於層層疊疊的綠影之下，曾潛伏著一縷由毒與影編織而成的精魂。她無形無體，僅餘獠牙與飢餓，以及一個難以辨識的名字——希瑟拉。<br><br>在她甦醒以前，此叢林隸屬於一個偉大的古帝國——蜥蜴人帝國。黑曜鑄城，高塔刺破林冠，溪澗切開幽谷。文明最後的餘暉中，蜥蜴人將殘存的魔力傾注於一座座巨像——以神獸為形，赭石摻灰燼描繪祝禱——祈求叢林諸神垂憐回應。<br><br>回應從未降臨，唯有沉默。<br><br>帝國終為藤蔓吞噬，城池崩塌，萬物歸林；唯獨那些神像仍佇立林間，滿覆苔衣，半掩半埋，彷彿依舊細語不止。巨像體內封印著被活祭的靈魂——蜥蜴人以巫術將生者之魄禁錮於石，獻作供品。誤闖密林的旅人若靠近，往往橫屍當場；這些「神像」本就是獻祭之器，是召神之門。希瑟拉，便是回應的神祇之一。她是毒蛇女神，是舊世的殘影，亦是爬入傷者與弱者夢中的低語者。<br><br>然而，她曾只是幽魂一縷，直至達蘇彌發現了她。<br><br>這位聲名遠播的神秘學者深信夢境是通往真理更深層的橋梁。為追尋失落的智慧，他踏入叢林，循蛇影與祭壇幻象而行，終被一座藤蔓覆蓋的古廟吸引，如墜深夢。於廢墟之心，他焚香引夢，意識遊離於現實與幻境之隙——希瑟拉亦在彼岸應聲而來。<br><br>無人知曉兩者間究竟發生了什麼。是達蘇彌自願獻身，抑或誤開過深之門？結局無異——希瑟拉掙脫虛無，重返現世；蠱蛇魅影，再度降臨。<br><br>如今，她循密林法則而行，狩獵一切自詡高貴之輩——所謂正直純粹、堅定不移者，皆難逃她掌心。她潛入神殿與王宮，賜予他們最後的抉擇：屈服，或被吞噬。她渴望重振蛇裔王朝的榮光——獠牙為權冠，叢林作王座，白骨築高座。她夢見藤蔓與毒液交織成城，夢見眾生捨棄軟弱，飲下她的劇毒，在痛楚中獲得新生。<br><br>她仍受人祀奉。傳聞達蘇彌遊走暗處，領導散落各方的信徒。他們在肌膚上刻下獠牙印記，舌尖蘸毒，以痛苦為祭，於神聖狂喜中追尋極樂。他們祈求被選中，祈求成為獵物——因為唯有成為「獵物」，才意味著被她注視、被她追獵，才能享受女神無上的恩澤。被毒蛇親吻者，將感受力量纏繞靈魂，猶如蛇蛻般褪去軟弱，煥然重生。那些能於毒吻中存活者，會被她選中，成為她的獵手——致命、絕美，且絕對效忠。<br><br>當毒吻無聲奪走呼吸、箭矢飛抵心臟咫尺之時，他們都會輕聲低語：<br>「謝謝你。」", "", ""], ["HeroStory_mTitle_2209", "雪之纱", "Veil of Snow", "雪之紗", "", ""], ["HeroStory_mTitle_2321", "最甜美的毒药", "The Sweetest Poison", "最甘美的毒藥", "", ""], ["Item_mItemDesc_20209", "英雄：艾尔莉丝", "Hero: Eirlys", "英雄：艾爾莉絲", "", ""], ["Item_mItemDesc_20321", "英雄：希瑟拉", "Hero: Sythra", "英雄：希瑟拉", "", ""], ["Item_mItemDesc_31096", "可自选一名限定英雄参与活动，自选的限定英雄掉落概率提升&200抽内必得！", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaranteed within 200 summons!", "可自選一名限定英雄參與活動，自選的限定英雄掉落機率提升＆200抽內必得！", "", ""], ["Item_mItemDesc_31097", "<span style=\"color: #eadca2;\">英雄召唤特惠</span><br><br>获得英雄召唤的必需资源", "<span style=\"color: #eadca2;\">Special Summon Offer</span><br><br>Get the necessary materials for Hero Summon", "<span style=\"color: #eadca2;\">英雄召喚特惠</span><br><br>獲得英雄召喚的必需資源", "", ""], ["Item_mItemDesc_3334", "<span style=\"color: #498a40;\">巅峰排行榜-蛇裔季专属限定头像框</span>", "<span style=\"color: #498a4

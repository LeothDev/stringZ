f. Wenn Eirlys Verbündete mit „Gelassener Atem“ heilt, wird ein zusätzlicher Heilungsbonus von {30,num}% gewährt. Es können maximal 2 Verbündete mit „Gelassener Atem“ gleichzeitig auf dem Feld sein.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Wenn die LP des Trägers unter {30,num}% fallen, stellt er sofort LP in Höhe von {31,num}% des ANG des Wirkenden wieder her und dieser Effekt wird entfernt. Wenn die Effektdauer natürlich endet oder erneuert wird, stellt der Träger LP in Höhe von {32,num}% des ANG des Wirkenden wieder her. Dieser Effekt kann nicht entfernt werden.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Wenn die LP des Trägers unter {30,num}% fallen, stellt er sofort LP in Höhe von {31,num}% des ANG des Wirkenden wieder her und dieser Effekt wird entfernt. Wenn die Effektdauer natürlich endet oder erneuert wird, stellt der Träger LP in Höhe von {32,num}% des ANG des Wirkenden wieder her. Dieser Effekt kann nicht entfernt werden.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Wenn die LP des Trägers unter {30,num}% fallen, stellt er sofort LP in Höhe von {31,num (M. DMG) zu.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy&#x27;s DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "Der Feuerspitzen-Speer ignoriert {30,num}% der VERT des Gegners. Der Sphärenring springt {31,num} zusätzliche Male und kann dasselbe Ziel mehrfach treffen. Die Yin-Yang-Klinge exekutiert gewöhnliche Monster mit weniger als {32,num}% ihrer LP.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Nimm am Ausrüstungsraid I teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Nimm am Ausrüstungsraid II teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Nimm am Ausrüstungsraid III teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Beschwöre Helden, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes&#x27; skills to win trophies and redeem rewards.", "Levele deine Helden auf/erhöhe ihr Sternlevel/lasse sie aufsteigen oder verbessere ihre Skills, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Nimm am Artefaktmaterial-Raid teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Nimm am Ausrüstungsraid I teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Ankunft der Helden – Ultimative Rangliste", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "Das verlorene Vermächtnis", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Schatzkammer in den Dünen", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Vergessener Palast", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Ankunft der Helden", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Heldentraining", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Geheimnis der Artefakte", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "Das verlorene Vermächtnis", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Geschichtskapitel", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Herausforderungskapitel", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "Gemeinfreie geistige Eigentumsrechte", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Zombie-Invasion", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Kanal wird gewechselt …", "", ""], ["CommonText_mMessage_24292", "Challenges", "Herausforderungen", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;Prüfsteine&lt;/color&gt;\\nPrüfsteine können aus verschiedenen Spielmodi erhalten werden. Diese Steine gibt es in unterschiedlichen Typen und Stufen, jeder enthält einzigartige Antike Inschriften. Setze sie in den Altar ein, um Wege zu den entsprechenden Prüfungen zu öffnen. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Herausforderungsregeln&lt;/color&gt;\\nJeder Kampf besteht aus mehreren Monsterwellen. Das Besiegen jeder Welle belohnt dich mit einer Schatztruhe. Sobald ein Kampf beginnt, kann er nicht neu gestartet werden. Wenn du den Kampf vorzeitig verlässt, werden die Belohnungen basierend auf deinem aktuellen Kampffortschritt verteilt. Du kannst bis zu 200 Prüfsteine pro Monat für Prüfungsherausforderungen verbrauchen. Sobald dieses Limit erreicht ist, können in diesem Monat keine weiteren Herausforderungen unternommen werden.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Prüfstein-Energie&lt;/color&gt;\\nJeder Prüfstein besitzt spezifische Energie. &lt;color=&quot;#fdbe36&quot;&gt;1 Energie wird pro Prüfungsversuch verbraucht.&lt;/color&gt; Wenn der Kampf endet und der Prüfstein noch Energie übrig hat, kannst du dich entscheiden, die Belohnungen abzulehnen und zu gehen. Danach kannst du erneut Energie verbrauchen, um die Prüfung neu zu starten. Der Energieverbrauch wird nicht auf das monatliche Prüfstein-Limit angerechnet.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Prüfstein zerstören&lt;/color&gt;\\nDu kannst Prüfsteine zerstören, die die Zerstörungslevel-Anforderungen erfüllen. Das Zerstören von Prüfsteinen bringt keine Belohnungen und wird nicht auf das monatliche Prüfstein-Verbrauchslimit angerechnet.\\n&lt;color=&quot;#fd4540&quot;&gt;Prüfsteine haben ein Inventarlimit. Sobald es voll ist, kannst du keine weiteren Prüfsteine erhalten. Bitte verwende sie regelmäßig, um Platz frei zu halten.&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Mooskristall", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Geschmolzener Kristall", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Sobald ein Kampf beginnt, kann er nicht neu gestartet werden. Ein Abbruch während des Kampfes führt zu einer sofortigen Abrechnung, und die verbrauchte Energie wird nicht zurückerstattet!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Eine Vulkanregion, in der während der Apokalypse Lava strömt. Mehr Plattformhelden werden benötigt, um die apokalyptischen Übelkräfte abzuwehren.", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;Bist du sicher, dass du diesen Spieler von der Marschall-Position entfernen möchtest?&lt;/color&gt;\\nJede Gilde kann bis zu {num1} Marschälle haben, die jeweils {num2} zusätzliche(n) Angriff(e) pro Runde erhalten.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Rundenpunkte", "", ""], ["CommonText_mMessage_26126", "Destroy", "Zerstören", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "Mit der Zerstörung von {name} fortfahren?\\n&lt;color=&quot;#fd4540&quot;&gt;Zerstörte Prüfsteine können nicht wiederhergestellt werden und gewähren keine Items.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "Prüfstein wurde zerstört.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Energie:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Aufgeben und verlassen", "", ""], ["CommonText_mMessage_26131", "Claim", "Einsammeln", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Verbleibende Prüfstein-Energie:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Kampf-Galerie", "", ""], ["CommonText_mMessage_26134", "Guides", "Anleitungen", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Erscheinender Prüfstein:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Mooskristall", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Geschmolzener Kristall", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Nur aktuelle Prüfstein-Tags anzeigen", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Die beliebtesten Helden werden anhand der Heldenauswahlrate berechnet und dienen nur zur Orientierung.", "", ""], ["CommonText_mMessage_26140", "Search", "Suchen", "", ""], ["CommonText_mMessage_26141", "Search Results", "Suchergebnisse", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Daten werden geladen…", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Helden-Daten werden gesammelt", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Gib mindestens {num} Zeichen ein", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "Keine passenden Tags gefunden.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "Der Auto-Kampf ist für das aktuelle Prüfstein-Level nicht verfügbar.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Du kannst Auto-Kampf-Aufzeichnungen hochladen, nachdem du Welle {num} manuell abgeschlossen hast.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "Der Auto-Kampf könnte aufgrund unterschiedlicher Prüfstein-Tags fehlschlagen. Möchtest du trotzdem mit dem Auto-Kampf fortfahren?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Diesen Kampf als neue Auto-Kampf-Aufzeichnung hochladen?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "Da die Prüfsteine verschiedene Tags besitzen, empfehlen wir, für den Auto-Kampf eine möglichst ausgewogene und umfassende Teamaufstellung zu wählen!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "Das Prüfstein-Inventar ist voll. Verwende einige Prüfsteine, bevor du weitere kaufst.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Aufräumen", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "Ungeöffnete zufällige Prüfstein-Truhen wurden in deinem Inventar entdeckt. Möchtest du sie jetzt öffnen?", "", ""], ["CommonText_mMessage_26154", "Go", "Los", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Lv. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level&#x27;s Keystone cannot be destroyed.", "Der Prüfstein dieses Levels kann nicht zerstört werden.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Keystone(s)?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "Bist du sicher, dass du &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Prüfstein(e) zerstören möchtest?\\n&lt;color=&quot;#fd4540&quot;&gt;Zerstörte Prüfsteine können nicht wiederhergestellt werden und gewähren keine Items.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "{num} Prüfstein(e) zerstört.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Monatliche Nutzung:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Prüfsteine haben ein monatliches Herausforderungslimit. Nach Erreichen der Obergrenze sind keine weiteren Versuche erlaubt.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?\\n&lt;color=&quot;#e04242&quot;&gt;During the event, you can only choose one difficulty per day to claim rewards.&lt;/color&gt;", "Die aktuelle Schwierigkeit hat Belohnungen zum Einsammeln. Bist du sicher, dass du eine andere Schwierigkeit versuchen möchtest?\\n&lt;color=&quot;#e04242&quot;&gt;Während des Events kannst du nur eine Schwierigkeit pro Tag wählen, um Belohnungen einzusammeln.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26162", "Don&#x27;t remind me again.", "Nicht mehr erinnern.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "Prüfstein-Inventar ist voll. Bitte verwende zunächst einige, bevor du entsperrst.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "Die Wiedergabe-Version stimmt nicht mit der aktuellen Version überein und kann daher nicht angesehen werden.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Gib bis zu {num} Zeichen ein.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Beliebte Helden", "", ""], ["CommonText_mMessage_26167", "Tag", "Tag", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Prüfstein-Inventar voll", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater&#x27;s Movement Spd. by 30. They are &lt;color=&quot;#fd4540&quot;&gt;immune to Slow&lt;/color&gt;.", "Verringert Seelenfressers Bewegungsgeschw. um 30. Sie sind &lt;color=&quot;#fd4540&quot;&gt;immun gegen Verlangsamung&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73003", "White Tower&#x27;s Scholar enters &lt;color=&quot;#fd4540&quot;&gt;Invisibility&lt;/color&gt; and becomes visible when blocked.", "Gelehrter des Weißen Turms geht in &lt;color=&quot;#fd4540&quot;&gt;Unsichtbarkeit&lt;/color&gt; über und wird sichtbar, wenn er geblockt wird.", "", ""], ["Difficulty_mDetail_73004", "White Tower&#x27;s Scholar becomes &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "Gelehrter des Weißen Turms wird &lt;color=&quot;#fd4540&quot;&gt;immun gegen M. DMG&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains &lt;color=&quot;#fd4540&quot;&gt;unyielding effect&lt;/color&gt; for 3 sec upon death and becomes &lt;color=&quot;#fd4540&quot;&gt;immune to Control and Slow&lt;/color&gt;.", "Kleine Arachnide erhält beim Tod 3 Sek. lang &lt;color=&quot;#fd4540&quot;&gt;Unnachgiebigkeit&lt;/color&gt; und wird &lt;color=&quot;#fd4540&quot;&gt;immun gegen Kontrolle und Verlangsamung&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 5 sec.", "Kleine Arachnide &lt;color=&quot;#fd4540&quot;&gt;stellt alle 5 Sek. 50% LP wieder her&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "Blitzwächters &lt;color=&quot;#fd4540&quot;&gt;Bewegungsgeschw. wird um 30 erhöht&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is &lt;color=&quot;#fd4540&quot;&gt;immune to DMG taken&lt;/color&gt;, but loses 5% HP per sec.", "Blitzwächter ist &lt;color=&quot;#fd4540&quot;&gt;gegen erlittenen DMG immun&lt;/color&gt;, verliert jedoch 5% LP pro Sek.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace&#x27;s Fatigue becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "Die Erschöpfung von Mörderische Bedrohung wird &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is &lt;color=&quot;#fd4540&quot;&gt;immune to CC Effects&lt;/color&gt;.", "Gepanzerter Komodo ist &lt;color=&quot;#fd4540&quot;&gt;immun gegen Massenkontrolleffekte&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction &lt;color=&quot;#fd4540&quot;&gt;when blocked&lt;/color&gt;.", "Gepanzerter Komodo erhält zusätzliche 30% P. und M. DMG Reduktion &lt;color=&quot;#fd4540&quot;&gt;beim Blocken&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;summons an extra&lt;/color&gt; Ice Vermin.", "Gefrorener Kleriker &lt;color=&quot;#fd4540&quot;&gt;beschwört ein zusätzliches&lt;/color&gt; Eis-Ungeziefer.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;spawns&lt;/color&gt; 3 Ice Vermin &lt;color=&quot;#fd4540&quot;&gt;upon death&lt;/color&gt;.", "Gefrorener Kleriker &lt;color=&quot;#fd4540&quot;&gt;beschwört&lt;/color&gt; &lt;color=&quot;#fd4540&quot;&gt;beim Tod&lt;/color&gt; 3 Eis-Ungeziefer hervor.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. +50&lt;/color&gt;.", "Donnerwächter hört auf anzugreifen und erhält &lt;color=&quot;#fd4540&quot;&gt;+50 Bewegungsgeschw&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;ATK is increased by 100%&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;when attacking shields&lt;/color&gt;, deducts 50% of its HP.", "Donnerwächters &lt;color=&quot;#fd4540&quot;&gt;ANG wird um 100% erhöht&lt;/color&gt;, aber &lt;color=&quot;#fd4540&quot;&gt;beim Angriff auf Schilde&lt;/color&gt; werden 50% seiner LP abgezogen.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "Nebliges Totauge ist &lt;color=&quot;#fd4540&quot;&gt;immun gegen M. DMG&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores &lt;color=&quot;#fd4540&quot;&gt;10% HP&lt;/color&gt; with each ATK.", "Nebel: Baron Salem stellt mit jedem ANG &lt;color=&quot;#fd4540&quot;&gt;10% LP&lt;/color&gt; wieder her.", "", ""], ["Difficulty_mDetail_73018", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;Cooldown is reduced by 100%&lt;/color&gt;.", "Die Abklingzeit der Blitzinkubation des Inkubators &lt;color=&quot;#fd4540&quot;&gt;wird um 100% verringert&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73019", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;spawns 2 extra Suicides&lt;/color&gt;.", "Die Blitzinkubation des Inkubators &lt;color=&quot;#fd4540&quot;&gt;beschwört 2 zusätzliche Bombenkäfer&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;drains 10% of the target&#x27;s Rage&lt;/color&gt;.", "Fügt Priester des Donners einem Ziel DMG zu, entzieht er ihm &lt;color=&quot;#fd4540&quot;&gt;10% seiner Wut&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;permanently reduces their Max HP by 10%&lt;/color&gt;. This effect can be stacked.", "Fügt Priester des Donners einem Ziel DMG zu, verringert er dessen &lt;color=&quot;#fd4540&quot;&gt;Max. LP dauerhaft um 10%&lt;/color&gt;. Dieser Effekt ist stapelbar.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces &lt;color=&quot;#fd4540&quot;&gt;healing&lt;/color&gt; received by &lt;color=&quot;#fd4540&quot;&gt;all units in range&lt;/color&gt; by 50%.", "Geißel verringert die &lt;color=&quot;#fd4540&quot;&gt;Heilung&lt;/color&gt;, die von &lt;color=&quot;#fd4540&quot;&gt;allen Einheiten in Reichweite&lt;/color&gt; erhalten wird, um 50%.", "", ""], ["Difficulty_mDetail_73023", "Scourge&#x27;s DMG range expands to &lt;color=&quot;#fd4540&quot;&gt;adjacent 2 tiles&lt;/color&gt;.", "Die DMG-Reichweite der Geißel wird auf &lt;color=&quot;#fd4540&quot;&gt;2 benachbarte Felder&lt;/color&gt; erhöht.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to &lt;color=&quot;#fd4540&quot;&gt;blocked targets&lt;/color&gt;.", "Wenn „Nebel: Überragender Abyssaler Betrachter“ stirbt, verursacht er M. DMG in Höhe von 100% des ANG an &lt;color=&quot;#fd4540&quot;&gt;blockierten Zielen&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes &lt;color=&quot;#fd4540&quot;&gt;unblockable&lt;/color&gt;.", "Wütender Mutant-Nager wird &lt;color=&quot;#fd4540&quot;&gt;unblockierbar&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent &lt;color=&quot;#fd4540&quot;&gt;increases Movement Spd. by 30&lt;/color&gt;.", "Wütender Mutant-Nager &lt;color=&quot;#fd4540&quot;&gt;erhöht die Bewegungsgeschw. um 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "Für je 20% LP, die Baron Salem verliert, &lt;color=&quot;#fd4540&quot;&gt;erhält er 20% VERT und M. WID&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "Schattenwirkers &lt;color=&quot;#fd4540&quot;&gt;Bewegungsgeschw. wird um 30 erhöht&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "Für je 20% LP, die Schattenwirker verliert, &lt;color=&quot;#fd4540&quot;&gt;erhält er 20% VERT und M. WID&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers&#x27; DEF and M. RES. by 30%. &lt;color=&quot;#fd4540&quot;&gt;When under CC Effects, reduces by 50%&lt;/color&gt;.", "Erhöht die VERT und den M. WID Gewöhnlicher Zerstörer um 30%. &lt;color=&quot;#fd4540&quot;&gt;Unter Massenkontrolleffekten wird dieser Bonus um 50% verringert&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when &lt;color=&quot;#fd4540&quot;&gt;stunned or frozen&lt;/color&gt;.", "Gewöhnlicher Zerstörer ist immun gegen DMG, wenn er &lt;color=&quot;#fd4540&quot;&gt;betäubt oder eingefroren&lt;/color&gt; ist.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an &lt;color=&quot;#fd4540&quot;&gt;initial Hitcount Shield&lt;/color&gt;.", "Ungewöhnlicher Zerstörer erhält einen &lt;color=&quot;#fd4540&quot;&gt;anfänglichen Trefferzähler-Schild&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer &lt;color=&quot;#fd4540&quot;&gt;gains 5 Movement Spd. each time taking DMG&lt;/color&gt;.", "Ungewöhnlicher Zerstörer &lt;color=&quot;#fd4540&quot;&gt;erhält 5 Bewegungsgeschw. jedes Mal, wenn er DMG erleidet&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee&#x27;s Ultrasonic Wave &lt;color=&quot;#fd4540&quot;&gt;DMG increases by 100%&lt;/color&gt; and does not inflict Poison.", "Der DMG der Ultraschallwelle von Fledermausflügel Banshee &lt;color=&quot;#fd4540&quot;&gt;erhöht sich um 100%&lt;/color&gt; und verursacht kein Gift.", "", ""], ["Difficulty_mDetail_73035", "Batwings Banshee&#x27;s Poison effect becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "Der Gifteffekt der Fledermausflügel Banshee wird &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73036", "Golden Guard &lt;color=&quot;#fd4540&quot;&gt;forcibly removes targets&lt;/color&gt; upon collision.", "Der Goldwächter &lt;color=&quot;#fd4540&quot;&gt;entfernt Ziele zwangsweise&lt;/color&gt; bei einer Kollision.", "", ""], ["Difficulty_mDetail_73037", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 15 sec.", "Erhabener Zerstörer stellt alle 15 Sek. &lt;color=&quot;#fd4540&quot;&gt;50% seiner LP wieder her&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73038", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. increases by 50&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;loses 3% HP&lt;/color&gt; per sec.", "Erhabener Zerstörer: &lt;color=&quot;#fd4540&quot;&gt;Bewegungsgeschw. erhöht sich um 50&lt;/color&gt;, verliert jedoch &lt;color=&quot;#fd4540&quot;&gt;3% LP&lt;/color&gt; pro Sek.", "", ""], ["Difficulty_mDetail_73039", "Smasher Guard&#x27;s ATK will &lt;color=&quot;#fd4540&quot;&gt;forcibly remove targets&lt;/color&gt;.", "Der ANG von Schmetterwächter &lt;color=&quot;#fd4540&quot;&gt;entfernt Ziele zwangsweise&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73040", "When losing 80% HP, Smasher Guard will fall into Petrification for 15 sec, gaining &lt;color=&quot;#fd4540&quot;&gt;massive DMG Reduction&lt;/color&gt; and continuously &lt;color=&quot;#fd4540&quot;&gt;restoring HP&lt;/color&gt; during Petrification.", "Bei Verlust von 80% LP wird Schmetterwächter für 15 Sek. versteinert und erhält während der Versteinerung &lt;color=&quot;#fd4540&quot;&gt;massive DMG-Reduktion&lt;/color&gt; und stellt kontinuie benkäfer erscheint an festen Positionen im Kampf.", "", ""], ["Difficulty_mStrategyDesc_7022", "Sandtaker appears at fixed positions in battle.", "Sandbestatter erscheint an festen Positionen im Kampf.", "", ""], ["Difficulty_mStrategyDesc_7025", "Healing Fly appears at fixed positions in battle.", "Heilende Fliege erscheint an festen Positionen im Kampf.", "", ""], ["Difficulty_mStrategyDesc_7028", "Twisted Sycophant appears at fixed positions in battle.", "Verlogener Schleimer erscheint an festen Positionen im Kampf.", "", ""], ["Difficulty_mStrategyDesc_7031", "Thunder Beacon appears at fixed positions in battle.", "Donnerleuchtfeuer erscheint an festen Positionen im Kampf.", "", ""], ["Difficulty_mStrategyDesc_7101", "Golden Guard appears randomly on the battlefield each wave.", "Goldwächter erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "Riesengolem erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "Skelett-Bogenschütze erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "Priesterin des Regens erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "Vergoldeter Wächter erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "Goldener Inquisitor erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "Bombenkäfer erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "Sandbestatter erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "Heilende Fliege erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "Verlogener Schleimer erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero&#x27;s DMG by 10% for 8 sec, stacking up to 5 times.", "(3 Teile) Nach einem Krit. Treffer mit einem Grund-ANG erhöht sich der DMG des Helden 8 Sek. lang um 10%. Bis zu 5-mal stapelbar.", "", ""], ["HeroStory_mStory_2209", "&quot;She walks like a memory I have not earned, yet always long for.&quot;\\n-Rivenhald\\n\\nThey sent her north, where the snows upon her brow might bend her once more to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "„Sie wandelt wie eine Erinnerung, die ich nie verdient habe und doch stets ersehne.“\\n– Rivenhald\\n\\nMan schickte sie in den Norden, damit der Schnee auf ihrer Stirn sie wieder ihrer Sache verpflichtete.\\n\\nEinst war sie eine Priesterin von Elyndris. Eirlys stand im Zentrum uralter Riten, ihre Stimme verwoben mit dem Atem der Götter. Doch etwas in ihr zerbrach. Sie traf eine Entscheidung, die niemand auszusprechen wagte, und das Sanktum vergab nicht leichtfertig.\\n\\nMonatelang leckte die Elfenstadt ihre Wunden nach dem Feuer von Moridens Überfall. Obwohl die Finstere Flut zurückgeschlagen worden war, blieben die Narben – und mit ihnen eine schreckliche Offenbarung: Sie waren nicht länger unantastbar. Ihre Türme hatten Risse bekommen. Ihre Mythen hatten geblutet. Elyndris brauchte Schatten, die sich dort bewegen konnten, wo Banner versagten. Also blickten die Seher nach außen. Leise. Behutsam. Sie suchten nach Orten jenseits der alten Karten, wo ihresgleichen Zuflucht finden könnte, sollte der Krieg zurückkehren.\\n\\nTyas Norden, trostlos und kalt, erhob sich in ihren Prophezeiungen wie eine Klinge aus dem Schnee. Von Harz wussten sie, doch sie wagten es nicht, den Konflikt mit jemandem seines Rufs zu suchen. Rivenhald jedoch herrschte in den eisigen Regionen, die ihren Spähern unbekannt waren – ein Kriegsherr in allem außer dem Titel, ein Monarch, der sich keiner Krone beugte als seiner eigenen. Sie mussten ihn verstehen. Wissen, ob seine Stärke untergraben werden konnte. Oder, falls nötig, wie leicht sie zu brechen war.\\n\\nEirlys war ihre Antwort. Ohne Freunde war sie weder Diplomatin noch Spionin, sondern etwas Stilleres. Man schickte sie mit Halbwahrheiten und einem heiligen Eid: sein Vertrauen zu gewinnen, seine Seele zu lesen und zu berichten, was aus der Ferne nicht gesehen werden konnte. Sie kam in Weiß gehüllt, ihre Anwesenheit als Friedensmission getarnt. Eine wandernde Heilerin. Eine Priesterin des Frosts. Und Rivenhald, der niemandem traute, schenkte ihr sein Vertrauen.\\n\\nSie machte sich nützlich. Sie versorgte Wunden, deutete Omen und hinterließ keine Spur eines Hintergedankens. Er beobachtete. Sie beobachtete zurück. Keiner von beiden zuckte mit der Wimper.\\n\\nMit der Zeit verschwammen die Grenzen zwischen ihnen, verwoben sich, doch blieben unnachgiebig. Sie lernte sein Schweigen zu deuten, die Form seines Zorns zu erkennen und die seltsame Gnade zu spüren, die er unter all dem begrub. Nachts, wenn das Feuer niedrig brannte und keine Nachrichten gesendet werden konnten, malte sie sich manchmal eine Zukunft aus, in der man ihm fast hätte trauen können – in der er mehr für sie sein könnte … aber der Morgen tilgte diese Träumerei jedes Mal aufs Neue.\\n\\nWie Rivenhald, so träumt auch sie vom Ende: zwei Gestalten im Schnee, unerschütterlich und unnachgiebig. Eine Klinge muss fallen. Eine Sache muss vergehen. Und im Blutnebel, kurz bevor der Wind alles verweht, werden sie den Preis des Überlebens verstehen … und wer sie füreinander wirklich sind.\\n\\nAber Eirlys weiß, was die Seher von Elyndris ihr nie sagten: Der Norden gehört niemandem. Nicht den Königen. Nicht den Städten. Und schon gar nicht Geistern wie ihr. Welche Zukunft auch immer auf sie wartet, sie wird nicht auf Vertrauen erbaut sein, sondern auf dem, was nach seinem Verschwinden übrig bleibt.\\n\\nSie ist die Stille zwischen zwei Stürmen, die auf die Stunde wartet, in der der eine den anderen brechen muss.", "", ""], ["HeroStory_mStory_2321", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "„Du wirst darum flehen, verschlungen zu werden. Und ich … werde gnädig sein.“\\n–Aus dem Dickicht gezischt\\n\\nIn den jadegrünen Urwäldern von Tya, wo Wurzeln Blut schlürfen und Bäume die Lebenden erwürgen, glitt einst ein Geist aus Gift und Schatten dahin – eine Schlange, die man nur im Geflüster Sythra nannte. Damals besaß sie kein eigenes Fleisch, nur Reißzähne, Hunger und die Erinnerung an einen Namen.\\n\\nDas Echsenmensch-Imperium, jene uralte Zivilisation, deren obsidianene Städte einst das Blätterdach zerschnitten und Täler spalteten, war längst im wuchernden Grün versunken. In seiner letzten Stunde goss es die letzten Tropfen seiner Magie in gewaltige Götzen – Statuen mächtiger Kreaturen, mit Andacht gemeißelt, in Ocker und Asche getaucht und als Opfergaben an die Geister des Dschungels zurückgelassen, in der Hoffnung, das Flehen möge erhört werden.\\n\\nEs folgte nur Stille.\\n\\nWährend die Metropole zerbröckelte und vom Ansturm der Vegetation verschlungen wurde, überdauerten diese Götzen – vom Moos umhüllt, halb verzehrt und doch erfüllt von ruhelosen Echos. In ihnen wohnten tatsächlich Geister: Seelen der Lebenden, den Dschungelgeistern geopfert und durch Echsenmensch-Zauber gebunden. Unglückliche Wanderer, die in diesem grünen Labyrinth über eine solche Statue stolperten, fanden rasch ihr Ende, denn in Wahrheit waren sie Opferaltäre – fähig, mächtige Gottheiten heraufzubeschwören. Sythra war eine dieser Gottheiten – eine schlangenartige Göttin, ein Relikt des alten Imperiums, ein Zischen, das sich in die Gedanken der Willensschwachen und Verwundeten schlich.\\n\\nDoch sie blieb ein Geist – bis Dassomi sie fand.\\n\\nDer berühmte Echsenmenschen-Mystiker war überzeugt, dass Träume eine Brücke zu höheren Wahrheiten seien. Auf der Suche nach verlorenem Wissen in den vergessenen Winkeln der Welt führte ihn eine Reihe von Visionen aus Schlangen und Altären tief in den Dschungel – zu einem überwucherten Tempel wie aus einem halb erinnerten Traum. Dort, im Herzen der Ruine, entzündete er Weihrauch und glitt zwischen die Welten – und Sythra antwortete.\\n\\nKeine Chronik verrät, was zwischen ihnen geschah. Ob Dassomi sich selbst darbrachte oder einfach ein Portal zu weit öffnete – das Ergebnis war dasselbe: Sythra streifte ihre Formlosigkeit ab und wurde erneut in der Welt geboren.\\n\\nDie Schlangenumarmung erwachte. Dem Gesetz des Dschungels folgend jagt Sythra jeden, der sich erhaben wähnt – die Gerechten, die Reinen, die Unnachgiebigen. Lautlos schleicht sie in ihre Tempel und Paläste und bietet ihnen eine letzte Wahl: Unterwerft euch … oder werdet verschlungen. Sie träumt davon, ihre schlangenartige Dynastie wiederauferstehen zu sehen – furchtlos, gefletschte Fänge, gekrönt von Dschungel und Knochen. Sie sieht Zitadellen vor sich, durchwoben von Efeu und Gift – eine Welt, in der alle, die auf ihr wandeln, ihre Schwäche abschälen, von ihrem Gift trinken und in ihrem Leiden Schönheit finden.\\n\\nNoch immer wird Sythra verehrt, doch ihre Kulte sind verstreut und verborgen – manche sagen, von Dassomi selbst geleitet. Ihre Jünger zeichnen sich mit Fangzähnen, lassen Gift über ihre Zungen perlen und träumen von Ekstase durch Schmerz, von Anbetung, die sie vergöttlicht. Sie beten darum, zur Fütterung auserwählt zu werden – denn Auserwähltsein heißt, gesehen, gejagt, geliebt zu werden. Wer vom Kuss der Schlange umschlungen wird, spürt Macht um die eigene Seele winden, streift Schwäche wie alte Haut ab – und wird neu geboren. Diejenigen, die ihren Biss überleben, werden zu ihren Jägerinnen: tödlich, schön, grenzenlos ergeben.\\n\\nUnd in jenem heiligen Augenblick zwischen Atemzug und Biss, wenn der Pfeil noch über dem Herzen schwebt, flüstern sie alle dasselbe:\\n„Danke.“", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Schleier des Schnees", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "Das süßeste Gift", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Held: Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Held: Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "Wähle 1 event-exklusiven Helden aus, der am Event teilnimmt. Der ausgewählte event-exklusive Held hat eine erhöhte Droprate &amp; wird innerhalb von 200 Beschwörungen garantiert!", "", ""], ["Item_mItemDesc_31097", "&lt;color=&quot;#eadca2&quot;&gt;Special Summon Offer&lt;/color&gt;\\n\\nGet the necessary materials for Hero Summon", "&lt;color=&quot;#eadca2&quot;&gt;Sonderangebot für die Spezielle Beschwörung&lt;/color&gt;\\n\\nErhalte die erforderlichen Materialien für die Beschwörung von Helden", "", ""], ["Item_mItemDesc_3334", "&lt;color=&quot;#498a40&quot;&gt;Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).&lt;/color&gt;", "&lt;color=&quot;#498a40&quot;&gt;Exklusiver Avatarrahmen für Ankunft der Helden – Ultimative Rangliste (Schlangenbrut-Saison).&lt;/color&gt;", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen&#x27;s Clues 1-5.", "Unbekannter Hinweis von Erlang Shen. Nach dem Erhalt wird dieser automatisch in einen zufälligen der Hinweise 1-5 von Erlang Shen u ld, prioritizing Defenders.", "Fügt der zuletzt eingesetzten Einheit auf dem Schlachtfeld M. DMG zu und priorisiert dabei Verteidiger.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Fügt der zuletzt eingesetzten Einheit auf dem Schlachtfeld M. DMG zu und priorisiert dabei Verteidiger.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally within the Basic ATK Range and immediately grants this ally a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; of their Max HP for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec. The effect can only be triggered 1 time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "Verhindert 1-mal tödlichen DMG für &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; Verbündeten innerhalb der Grund-ANG-Reichweite und gewährt diesem Verbündeten sofort einen Schild in Höhe von &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; seiner Max. LP für &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; Sek. Der Effekt wird nur 1-mal alle &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; Sek. ausgelöst.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG to up to &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; enemies.", "Fügt bis zu &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; Gegnern &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG zu.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, and gains &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Grants allies of the same faction Elddr&#x27;s Talent temporarily. The Ultimate lasts for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "Erhöht den ANG um &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; und erhält &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Gewährt Verbündeten derselben Fraktion vorübergehend Elddrs Talent. Der Ultimative Skill hält für &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; Sek. an.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "ANG-Erhöhung +{sk1}%", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "ANG-Erhöhung +{sk1}%", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; chance to trigger Thunder Hammer, dealing an extra &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; DMG. If the hero has no shield, Thunder Hammer has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; chance to grant a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; ATK.", "Grund-ANG hat eine &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; Chance, Donnerhammer auszulösen, was &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; zusätzlichen DMG verursacht. Besitzt der Held keinen Schild, hat Donnerhammer eine &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; Chance, einen Schild in Höhe von &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; ANG zu gewähren.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally in range.", "Wendet &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt; auf &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; Verbündeten in Reichweite an.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "Heilungsmultiplikator +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "Heilungsmultiplikator +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "Heilungsmultiplikator +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_5", "Healing Multiplie

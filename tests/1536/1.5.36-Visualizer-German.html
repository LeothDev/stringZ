h with a massive mace.", "Mit seinem gewaltigen Streitkolben metzelt er gnadenlos alles nieder, was sich ihm in den Weg stellt.", "", ""], ["Unit_mDescribe_17218", "Deals extremely high DMG to the target after charging power.", "Fügt dem Ziel nach der Kraftladung extrem hohen DMG zu.", "", ""], ["Unit_mDescribe_17221", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "Dieser einst rechtschaffene Paladin der Sonne wurde aus unbekannten Gründen von der Verderbnis heimgesucht.", "", ""], ["Unit_mDescribe_17222", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "Dieser einst rechtschaffene Paladin der Sonne wurde aus unbekannten Gründen von der Verderbnis heimgesucht.", "", ""], ["Unit_mDescribe_34100", "An unblockable spectral remnant immune to Control effects.", "Ein unaufhaltbares, spektrales Überbleibsel, das immun gegen Kontrolleffekte ist.", "", ""], ["Unit_mDescribe_34102", "Turned from soldiers killed in battle.", "Ehemalige Soldaten, die im Kampf fielen und verwandelt wurden.", "", ""], ["Unit_mDescribe_34103", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "Opfert sich bereitwillig für sein Volk und explodiert, wenn er auf Gegner trifft, um ihnen und umstehenden Gegnern massiven DMG zuzufügen.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. &lt;color=#ff4500&gt;Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.&lt;/color&gt;", "Mutierte Mutant-Nager im Wutanfall. &lt;color=#ff4500&gt;Wenn sie angegriffen werden, verfallen sie in eine wahnsinnige Raserei und zeigen erhöhte Bewegungsgeschw.&lt;/color&gt;", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Skelett-Krieger mit riesigen Äxten, angetrieben von Verbitterung, was ihre Angriffe noch heftiger macht.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "Durch das Ausspucken von Spinnenseide kann die Spinnenkönigin zahlreiche kleine Spinnen züchten und deren Attribute steigern.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Mit seinem gewaltigen Streitkolben metzelt er gnadenlos alles nieder, was sich ihm in den Weg stellt.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Ein verrückter Krieger, der den Kerker durchstreift und mit Vergnügen Menschen enthauptet.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Mit seinem gewaltigen Streitkolben metzelt er gnadenlos alles nieder, was sich ihm in den Weg stellt.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Dieser rücksichtslose Kannibale fügt Gegnern mit seiner riesigen Knochenzange blutende Wunden zu.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Dieser rücksichtslose Kannibale fügt Gegnern mit seiner riesigen Knochenzange blutende Wunden zu.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Ein spektrales Überbleibsel, das nicht geblockt oder verlangsamt werden kann und zügig ausgeschaltet werden muss.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Ehemalige Soldaten, die im Kampf fielen und verwandelt wurden.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Bombenkäfer sind voller Säuresäcke, rollen sich zusammen und stürmen vorwärts.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "Diese mutierten und im Wutanfall befindlichen Mutant-Nager bewegen sich schneller, wenn sie angegriffen werden.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Skelett-Krieger mit riesigen Äxten, angetrieben von Verbitterung, was ihre Angriffe noch heftiger macht.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "Sie lebt unter der Erde und ist dort die wahre Herrscherin. Sie kann kleine Spinnen züchten und kontrollieren sowie alle Attribute ihrer Spinnen im Kampf verstärken. Ihre Seide ist so zäh, dass niemand sich leicht befreien kann, sobald er gefangen ist.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "Eirlys, die verbannte Elfenpriesterin. Heilt schwere Verletzungen mit Gebeten, entfernt Debuffs, rettet Verbündete vom Rande des Todes und beschleunigt die Wut-Regen. des Teams.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "Ein Überbleibsel der alten Welt, Sythra, die Schlangenumarmung, durchstreift den Dschungel. Sie beschwört Gequälte Seelen, die mit zunehmender Heftigkeit angreifen und dabei die VERT ignorieren, um ihre Gegner zu verschlingen.", "", ""], ["Unit_mHeroDesignation_2209", "Winter&#x27;s Mercy", "Wintergnade", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent&#x27;s Embrace", "Die Schlangenumarmung", "", ""], ["Unit_mName_17200", "Knight of Destruction", "Ritter der Zerstörung", "", ""], ["Unit_mName_17218", "Fallen Chopper", "Gefallener Zerhacker", "", ""], ["Unit_mName_17219", "Slaughter", "Gemetzel", "", ""], ["Unit_mName_17221", "Maw", "Maw", "", ""], ["Unit_mName_17222", "Maw", "Maw", "", ""], ["Unit_mName_2209", "Eirlys", "Eirlys", "", ""], ["Unit_mName_2321", "Sythra", "Sythra", "", ""], ["Unit_mName_34100", "Soul Eater", "Seelenfresser", "", ""], ["Unit_mName_34103", "Suicide", "Bombenkäfer", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "Skelett-Scharfrichter", "", ""], ["Unit_mName_37114", "Queen Spider", "Spinnenkönigin", "", ""], ["Unit_mName_37115", "Spider Cocoon", "Spinnenkokon", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "Bleib in meiner Nähe, und vielleicht überlebst du.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "Sag mir, fürchtest du, was du begehrst?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "Während unseres speziellen Events „Unermüdlicher Plünderer“ kannst du 1 Auto-Kampf durchführen und erhältst bei doppelten Ausdauerkosten die zweifache Belohnung. Mache deine Kämpfe effizienter als je zuvor!\n\nAuto-Kampf-Bonus\n1. Während des Events können Kommandanten beim Auto-Kampf in {name2} wählen, ob sie den Event-Bonus aktivieren möchten: Jeder Kampf verbraucht das {num3}-Fache der regulären Ausdauer, gewährt aber auch das {num3}-Fache an Belohnungen. Dies soll die Effizienz beim Sammeln von Materialien steigern.\n2. Falls eine Herausforderung fehlschlägt, wird die entsprechende Ausdauer zurückerstattet.\n3. Ist der Event-Bonus während des Events aktiviert, werden Quests zum Ausdauerverbrauch anhand der tatsächlich verbrauchten Ausdauer berechnet.\n4. Beachte jedoch, dass Quests bezüglich der Anzahl der Abschlüsse nicht vom Event-Bonus beeinflusst werden.\n5. Der Event-Bonus gilt nur für Stufen, die den Auto-Kampf erlauben, daher sind Erster-Abschluss-Belohnungen nicht im Belohnungsbonus enthalten.\n6. Bei aktiviertem Bonus werden Belohnungen auf Basis separater Berechnungen generiert, statt das Ergebnis von 1 direkt zu verdoppeln.\n7. Für das Event „Tapfere Eroberung“ erfolgt die Punktewertung der Prüfung des Orakels im Ausrüstungs- und Artefaktmaterial-Raid auf Grundlage der erhaltenen Ausrüstung und Meteoriten – basierend auf deren Seltenheit und Menge nach Abschluss der jeweiligen Stufen.\n8. Bitte beachte: Wenn Stufen zufällige Event-Token-Beute haben (wie die Würfel in „Odyssee der Träume“), werden diese Tokens vom Bonus nicht beeinflusst.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "„Unermüdlicher Plünderer“ ist jetzt im Artefaktmaterial-Raid verfügbar. Während des Events kostet der Auto-Kampf die doppelte Ausdauer, bringt aber auch die doppelte Belohnung ein.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "Zeitlich begrenzte Ratenerhöhung für die Legendären Helden Numera &amp; Aylin!", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "Zeitlich begrenzte Ratenerhöhung für die Legendären Helden Vorn &amp; Artemis!", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "Zeitlich begrenzte Ratenerhöhung für die Legendären Helden Nyx &amp; Malvira!", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "Traumschlange Skin Bündel", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "&quot;Tya&#x27;s Champion&quot; Valkyra", "Valkyra „Tyas Champion“", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "&quot;The Hollow Husk&quot; Aracha", "Aracha „Die hohle Hülse“", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "Sythra Skin Bündel", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "Helden-Gameplay: Eirlys", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "Helden-Gameplay: Sythra", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;In diesem Event „Götterbeschwörung“ ist die Droprate von &lt;color=#fdbe36&gt;allen Legendären Helden&lt;/color&gt; &lt;color=#b490fc&gt;2&lt;/color&gt;-mal höher als die ursprüngliche Rate. Die folgenden Helden haben eine &lt;color=#b490fc&gt;20&lt;/color&gt;-fach höhere Droprate im Vergleich zu anderen Helden derselben Seltenheit. Die Dropraten sind bei anderen Helden der gleichen Seltenheit identisch.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;Wenn du in diesem Beschwörungsevent einen Legendären Helden erhältst, der derzeit NICHT als Ratenerhöhung angeboten wird, erhöht sich die Droprate* aller Ratenerhöhungshelden für deine nächsten Beschwörungen zusätzlich.&lt;/color&gt; Details:\n1. Beim ersten Erhalt eines Legendären Helden, der nicht Teil der Ratenerhöhung ist, wird die Droprate* aller Ratenerhöhungshelden für deine zukünftigen Beschwörungen auf das &lt;color=#b490fc&gt;10&lt;/color&gt;-fache erhöht.\n2. Wenn du erneut einen Legendären Helden erhältst, der nicht Teil der Ratenerhöhung ist, wird die Droprate* aller Ratenerhöhungshelden erneut auf das &lt;color=#b490fc&gt;10&lt;/color&gt;-fache erhöht. Diese Erhöhung wird so lange anhalten, bis du erfolgreich einen Ratenerhöhungshelden beschwörst.\n&lt;color=#91887c&gt;*Die oben erwähnte Droprate bezieht sich auf die relative Wahrscheinlichkeit von Ratenerhöhungshelden im Vergleich zu anderen Helden.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Hinweis: Dieser Pechschutz wird NUR einmal während des Events ausgelöst.&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "Heilwirkung +<span style=\"color: #1e8852;\">8</span>", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "Wut-Regen. (Auto) +<span style=\"color: #1e8852;\">1</span>", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -<span style=\"color: #1e8852;\">2</span>", "Kosten -<span style=\"color: #1e8852;\">2</span>", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +<span style=\"color: #1e8852;\">300</span>", "ANG +<span style=\"color: #1e8852;\">300</span>", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "Durchdringung +<span style=\"color: #1e8852;\">8%</span>", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "Selbst schwaches Licht vertreibt die Dunkelheit.", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "Licht wächst dort, wo wir wagen, es zu hegen.", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "Auch wenn Stürme am Horizont toben, wähle ich den Glauben.", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "Verfall nicht den Prophezeiungen, denn die echte Wahrheit liegt in dir.", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "Alles wird sich vor dem Licht enthüllen.", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "Diese Fangzähne beginnen sich zu schärfen...", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "Mit jeder Häutung werde ich zu etwas Mächtigerem.", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "Knie nieder, jämmerlicher Wurm… Ich bin jenseits der Göttlichkeit.", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "Für meine Macht existiert kein Gegengift.", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent's will!", "Weder Chaos noch Ordnung existieren… nur der Wille der Schlange!", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "DMG-Erhöhung", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "Gelassener Atem", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "Heilungsgebet", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "Heilungsgebet", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "Heilungsgebet", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "Heilungsgebet", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "Heilungsgebet", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "Gequälte Seele", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "Gequälte Seele", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "Gequälte Seele", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "Gequälte Seele", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "Gequälte Seele", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "DMG +{20,num/100}% (Wirkt nur, wenn es stärker ist als der aktuelle Buff/Debuff auf dasselbe Attribut.)", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "Gewährt pro Sek. einen Schild in Höhe von {30,num}% des ANG, der sich bis zu {31,num}% des ANG stapelt.", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "Entfernt alle 2 Sek. 1 Debuff. Wenn Eirlys Verbündete mit „Gelassener Atem“ heilt, wird ein zusätzlicher Heilungsbonus von {30,num}% gewährt. Es können maximal 2 Verbündete mit „Gelassener Atem“ gleichzeitig auf dem Feld sein.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Wenn die LP des Trägers unter {30,num}% fallen, stellt er sofort LP in Höhe von {31,num}% des ANG des Wirkenden wieder her und dieser Effekt wird entfernt. Wenn die Effektdauer natürlich endet oder erneuert wird, stellt der Träger LP in Höhe von {32,num}% des ANG des Wirkenden wieder her. Dieser Effekt kann nicht entfernt werden.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Wenn die LP des Trägers unter {30,num}% fallen, stellt er sofort LP in Höhe von {31,num}% des ANG des Wirkenden wieder her und dieser Effekt wird entfernt. Wenn die Effektdauer natürlich endet oder erneuert wird, stellt der Träger LP in Höhe von {32,num}% des ANG des Wirkenden wieder her. Dieser Effekt kann nicht entfernt werden.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Wenn die LP des Trägers unter {30,num}% fallen, stellt er sofort LP in Höhe von {31,num}% des ANG des Wirkenden wieder her und dieser Effekt wird entfernt. Wenn die Effektdauer natürlich endet oder erneuert wird, stellt der Träger LP in Höhe von {32,num}% des ANG des Wirkenden wieder her. Dieser Effekt kann nicht entfernt werden.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Wenn die LP des Trägers unter {30,num}% fallen, stellt er sofort LP in Höhe von {31,num}% des ANG des Wirkenden wieder her und dieser Effekt wird entfernt. Wenn die Effektdauer natürlich endet oder erneuert wird, stellt der Träger LP in Höhe von {32,num}% des ANG des Wirkenden wieder her. Dieser Effekt kann nicht entfernt werden.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Wenn die LP des Trägers unter {30,num}% fallen, stellt er sofort LP in Höhe von {31,num}% des ANG des Wirkenden wieder her und dieser Effekt wird entfernt. Wenn die Effektdauer natürlich endet oder erneuert wird, stellt der Träger LP in Höhe von {32,num}% des ANG des Wirkenden wieder her. Dieser Effekt kann nicht entfernt werden.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "Fügt bis zu {31,num} Gegnern vor sich 1-mal M. AoE-DMG zu, einschließlich Einheiten in der Luft, und Mächtiger Stoß fügt Gegnern {33,num} Sek. lang {32,num}% Verwundbarkeit (M. DMG) zu.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "Der Feuerspitzen-Speer ignoriert {30,num}% der VERT des Gegners. Der Sphärenring springt {31,num} zusätzliche Male und kann dasselbe Ziel mehrfach treffen. Die Yin-Yang-Klinge exekutiert gewöhnliche Monster mit weniger als {32,num}% ihrer LP.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Feuert schnell auf 1 Gegner innerhalb der ANG-Reichweite seines Besitzers, kann zunächst {30,num}-mal schießen und verursacht jedes Mal {31,num}% DMG. Die Gequälte Seele vergeht, nachdem alle Schüsse abgegeben wurden. Bevorzugt Ziele in der Luft. Jeder Pfeil erhält bei Treffer eines gefallenen Ziels einen Rückkehr-Zähler. Maximal {32,num} können gleichzeitig auf dem Feld existieren.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Nimm am Ausrüstungsraid I teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Nimm am Ausrüstungsraid II teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Nimm am Ausrüstungsraid III teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Beschwöre Helden, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "Levele deine Helden auf/erhöhe ihr Sternlevel/lasse sie aufsteigen oder verbessere ihre Skills, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Nimm am Artefaktmaterial-Raid teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Nimm am Ausrüstungsraid I teil, um Trophäen zu gewinnen und Belohnungen einzulösen.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Ankunft der Helden – Ultimative Rangliste", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "Das verlorene Vermächtnis", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Schatzkammer in den Dünen", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Vergessener Palast", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Ankunft der Helden", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Heldentraining", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Geheimnis der Artefakte", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "Das verlorene Vermächtnis", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Geschichtskapitel", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Herausforderungskapitel", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "Gemeinfreie geistige Eigentumsrechte", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Zombie-Invasion", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Kanal wird gewechselt …", "", ""], ["CommonText_mMessage_24292", "Challenges", "Herausforderungen", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">Prüfsteine</span><br>Prüfsteine können aus verschiedenen Spielmodi erhalten werden. Diese Steine gibt es in unterschiedlichen Typen und Stufen, jeder enthält einzigartige Antike Inschriften. Setze sie in den Altar ein, um Wege zu den entsprechenden Prüfungen zu öffnen. <br><br><span style=\"color: #cec2b1;\">Herausforderungsregeln</span><br>Jeder Kampf besteht aus mehreren Monsterwellen. Das Besiegen jeder Welle belohnt dich mit einer Schatztruhe. Sobald ein Kampf beginnt, kann er nicht neu gestartet werden. Wenn du den Kampf vorzeitig verlässt, werden die Belohnungen basierend auf deinem aktuellen Kampffortschritt verteilt. Du kannst bis zu 200 Prüfsteine pro Monat für Prüfungsherausforderungen verbrauchen. Sobald dieses Limit erreicht ist, können in diesem Monat keine weiteren Herausforderungen unternommen werden.<br><br><span style=\"color: #cec2b1;\">Prüfstein-Energie</span><br>Jeder Prüfstein besitzt spezifische Energie. <span style=\"color: #fdbe36;\">1 Energie wird pro Prüfungsversuch verbraucht.</span> Wenn der Kampf endet und der Prüfstein noch Energie übrig hat, kannst du dich entscheiden, die Belohnungen abzulehnen und zu gehen. Danach kannst du erneut Energie verbrauchen, um die Prüfung neu zu starten. Der Energieverbrauch wird nicht auf das monatliche Prüfstein-Limit angerechnet.<br><br><span style=\"color: #cec2b1;\">Prüfstein zerstören</span><br>Du kannst Prüfsteine zerstören, die die Zerstörungslevel-Anforderungen erfüllen. Das Zerstören von Prüfsteinen bringt keine Belohnungen und wird nicht auf das monatliche Prüfstein-Verbrauchslimit angerechnet.<br><span style=\"color: #fd4540;\">Prüfsteine haben ein Inventarlimit. Sobald es voll ist, kannst du keine weiteren Prüfsteine erhalten. Bitte verwende sie regelmäßig, um Platz frei zu halten.</span>", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Mooskristall", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Geschmolzener Kristall", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Sobald ein Kampf beginnt, kann er nicht neu gestartet werden. Ein Abbruch während des Kampfes führt zu einer sofortigen Abrechnung, und die verbrauchte Energie wird nicht zurückerstattet!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Eine Vulkanregion, in der während der Apokalypse Lava strömt. Mehr Plattformhelden werden benötigt, um die apokalyptischen Übelkräfte abzuwehren.", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">Bist du sicher, dass du diesen Spieler von der Marschall-Position entfernen möchtest?</span><br>Jede Gilde kann bis zu {num1} Marschälle haben, die jeweils {num2} zusätzliche(n) Angriff(e) pro Runde erhalten.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Rundenpunkte", "", ""], ["CommonText_mMessage_26126", "Destroy", "Zerstören", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Mit der Zerstörung von {name} fortfahren?<br><span style=\"color: #fd4540;\">Zerstörte Prüfsteine können nicht wiederhergestellt werden und gewähren keine Items.</span>", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "Prüfstein wurde zerstört.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Energie:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Aufgeben und verlassen", "", ""], ["CommonText_mMessage_26131", "Claim", "Einsammeln", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Verbleibende Prüfstein-Energie:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Kampf-Galerie", "", ""], ["CommonText_mMessage_26134", "Guides", "Anleitungen", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Erscheinender Prüfstein:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Mooskristall", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Geschmolzener Kristall", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Nur aktuelle Prüfstein-Tags anzeigen", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Die beliebtesten Helden werden anhand der Heldenauswahlrate berechnet und dienen nur zur Orientierung.", "", ""], ["CommonText_mMessage_26140", "Search", "Suchen", "", ""], ["CommonText_mMessage_26141", "Search Results", "Suchergebnisse", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Daten werden geladen…", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Helden-Daten werden gesammelt", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Gib mindestens {num} Zeichen ein", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "Keine passenden Tags gefunden.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "Der Auto-Kampf ist für das aktuelle Prüfstein-Level nicht verfügbar.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Du kannst Auto-Kampf-Aufzeichnungen hochladen, nachdem du Welle {num} manuell abgeschlossen hast.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "Der Auto-Kampf könnte aufgrund unterschiedlicher Prüfstein-Tags fehlschlagen. Möchtest du trotzdem mit dem Auto-Kampf fortfahren?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Diesen Kampf als neue Auto-Kampf-Aufzeichnung hochladen?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "Da die Prüfsteine verschiedene Tags besitzen, empfehlen wir, für den Auto-Kampf eine möglichst ausgewogene und umfassende Teamaufstellung zu wählen!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "Das Prüfstein-Inventar ist voll. Verwende einige Prüfsteine, bevor du weitere kaufst.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Aufräumen", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "Ungeöffnete zufällige Prüfstein-Truhen wurden in deinem Inventar entdeckt. Möchtest du sie jetzt öffnen?", "", ""], ["CommonText_mMessage_26154", "Go", "Los", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Lv. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level's Keystone cannot be destroyed.", "Der Prüfstein dieses Levels kann nicht zerstört werden.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Bist du sicher, dass du <span style=\"color: #fd4540;\">{num}</span> Prüfstein(e) zerstören möchtest?<br><span style=\"color: #fd4540;\">Zerstörte Prüfsteine können nicht wiederhergestellt werden und gewähren keine Items.</span>", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "{num} Prüfstein(e) zerstört.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Monatliche Nutzung:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Prüfsteine haben ein monatliches Herausforderungslimit. Nach Erreichen der Obergrenze sind keine weiteren Versuche erlaubt.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "Die aktuelle Schwierigkeit hat Belohnungen zum Einsammeln. Bist du sicher, dass du eine andere Schwierigkeit versuchen möchtest?<br><span style=\"color: #e04242;\">Während des Events kannst du nur eine Schwierigkeit pro Tag wählen, um Belohnungen einzusammeln.</span>", "", ""], ["CommonText_mMessage_26162", "Don't remind me again.", "Nicht mehr erinnern.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "Prüfstein-Inventar ist voll. Bitte verwende zunächst einige, bevor du entsperrst.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "Die Wiedergabe-Version stimmt nicht mit der aktuellen Version überein und kann daher nicht angesehen werden.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Gib bis zu {num} Zeichen ein.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Beliebte Helden", "", ""], ["CommonText_mMessage_26167", "Tag", "Tag", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Prüfstein-Inventar voll", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "Verringert Seelenfressers Bewegungsgeschw. um 30. Sie sind <span style=\"color: #fd4540;\">immun gegen Verlangsamung</span>.", "", ""], ["Difficulty_mDetail_73003", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "Gelehrter des Weißen Turms geht in <span style=\"color: #fd4540;\">Unsichtbarkeit</span> über und wird sichtbar, wenn er geblockt wird.", "", ""], ["Difficulty_mDetail_73004", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "Gelehrter des Weißen Turms wird <span style=\"color: #fd4540;\">immun gegen M. DMG</span>.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "Kleine Arachnide erhält beim Tod 3 Sek. lang <span style=\"color: #fd4540;\">Unnachgiebigkeit</span> und wird <span style=\"color: #fd4540;\">immun gegen Kontrolle und Verlangsamung</span>.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "Kleine Arachnide <span style=\"color: #fd4540;\">stellt alle 5 Sek. 50% LP wieder her</span>.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "Blitzwächters <span style=\"color: #fd4540;\">Bewegungsgeschw. wird um 30 erhöht</span>.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is <span style=\"color: #fd4540;\">immune to DMG taken</span>, but loses 5% HP per sec.", "Blitzwächter ist <span style=\"color: #fd4540;\">gegen erlittenen DMG immun</span>, verliert jedoch 5% LP pro Sek.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace's Fatigue becomes <span style=\"color: #fd4540;\">permanent</span>.", "Die Erschöpfung von Mörderische Bedrohung wird <span style=\"color: #fd4540;\">permanent</span>.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is <span style=\"color: #fd4540;\">immune to CC Effects</span>.", "Gepanzerter Komodo ist <span style=\"color: #fd4540;\">immun gegen Massenkontrolleffekte</span>.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction <span style=\"color: #fd4540;\">when blocked</span>.", "Gepanzerter Komodo erhält zusätzliche 30% P. und M. DMG Reduktion <span style=\"color: #fd4540;\">beim Blocken</span>.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric <span style=\"color: #fd4540;\">summons an extra</span> Ice Vermin.", "Gefrorener Kleriker <span style=\"color: #fd4540;\">beschwört ein zusätzliches</span> Eis-Ungeziefer.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric <span style=\"color: #fd4540;\">spawns</span> 3 Ice Vermin <span style=\"color: #fd4540;\">upon death</span>.", "Gefrorener Kleriker <span style=\"color: #fd4540;\">beschwört</span> <span style=\"color: #fd4540;\">beim Tod</span> 3 Eis-Ungeziefer hervor.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains <span style=\"color: #fd4540;\">Movement Spd. +50</span>.", "Donnerwächter hört auf anzugreifen und erhält <span style=\"color: #fd4540;\">+50 Bewegungsgeschw</span>.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard's <span style=\"color: #fd4540;\">ATK is increased by 100%</span>, but <span style=\"color: #fd4540;\">when attacking shields</span>, deducts 50% of its HP.", "Donnerwächters <span style=\"color: #fd4540;\">ANG wird um 100% erhöht</span>, aber <span style=\"color: #fd4540;\">beim Angriff auf Schilde</span> werden 50% seiner LP abgezogen.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "Nebliges Totauge ist <span style=\"color: #fd4540;\">immun gegen M. DMG</span>.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores <span style=\"color: #fd4540;\">10% HP</span> with each ATK.", "Nebel: Baron Salem stellt mit jedem ANG <span style=\"color: #fd4540;\">10% LP</span> wieder her.", "", ""], ["Difficulty_mDetail_73018", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">Cooldown is reduced by 100%</span>.", "Die Abklingzeit der Blitzinkubation des Inkubators <span style=\"color: #fd4540;\">wird um 100% verringert</span>.", "", ""], ["Difficulty_mDetail_73019", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">spawns 2 extra Suicides</span>.", "Die Blitzinkubation des Inkubators <span style=\"color: #fd4540;\">beschwört 2 zusätzliche Bombenkäfer</span>.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">drains 10% of the target's Rage</span>.", "Fügt Priester des Donners einem Ziel DMG zu, entzieht er ihm <span style=\"color: #fd4540;\">10% seiner Wut</span>.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">permanently reduces their Max HP by 10%</span>. This effect can be stacked.", "Fügt Priester des Donners einem Ziel DMG zu, verringert er dessen <span style=\"color: #fd4540;\">Max. LP dauerhaft um 10%</span>. Dieser Effekt ist stapelbar.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces <span style=\"color: #fd4540;\">healing</span> received by <span style=\"color: #fd4540;\">all units in range</span> by 50%.", "Geißel verringert die <span style=\"color: #fd4540;\">Heilung</span>, die von <span style=\"color: #fd4540;\">allen Einheiten in Reichweite</span> erhalten wird, um 50%.", "", ""], ["Difficulty_mDetail_73023", "Scourge's DMG range expands to <span style=\"color: #fd4540;\">adjacent 2 tiles</span>.", "Die DMG-Reichweite der Geißel wird auf <span style=\"color: #fd4540;\">2 benachbarte Felder</span> erhöht.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to <span style=\"color: #fd4540;\">blocked targets</span>.", "Wenn „Nebel: Überragender Abyssaler Betrachter“ stirbt, verursacht er M. DMG in Höhe von 100% des ANG an <span style=\"color: #fd4540;\">blockierten Zielen</span>.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes <span style=\"color: #fd4540;\">unblockable</span>.", "Wütender Mutant-Nager wird <span style=\"color: #fd4540;\">unblockierbar</span>.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent <span style=\"color: #fd4540;\">increases Movement Spd. by 30</span>.", "Wütender Mutant-Nager <span style=\"color: #fd4540;\">erhöht die Bewegungsgeschw. um 30</span>.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "Für je 20% LP, die Baron Salem verliert, <span style=\"color: #fd4540;\">erhält er 20% VERT und M. WID</span>.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "Schattenwirkers <span style=\"color: #fd4540;\">Bewegungsgeschw. wird um 30 erhöht</span>.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "Für je 20% LP, die Schattenwirker verliert, <span style=\"color: #fd4540;\">erhält er 20% VERT und M. WID</span>.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers' DEF and M. RES. by 30%. <span style=\"color: #fd4540;\">When under CC Effects, reduces by 50%</span>.", "Erhöht die VERT und den M. WID Gewöhnlicher Zerstörer um 30%. <span style=\"color: #fd4540;\">Unter Massenkontrolleffekten wird dieser Bonus um 50% verringert</sp culty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "Riesengolem erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "Skelett-Bogenschütze erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "Priesterin des Regens erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "Vergoldeter Wächter erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "Goldener Inquisitor erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "Bombenkäfer erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "Sandbestatter erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "Heilende Fliege erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "Verlogener Schleimer erscheint in jeder Welle zufällig auf dem Schlachtfeld.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "(3 Teile) Nach einem Krit. Treffer mit einem Grund-ANG erhöht sich der DMG des Helden 8 Sek. lang um 10%. Bis zu 5-mal stapelbar.", "", ""], ["HeroStory_mStory_2209", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "„Sie wandelt wie eine Erinnerung, die ich nie verdient habe und doch stets ersehne.“<br>– Rivenhald<br><br>Man schickte sie in den Norden, damit der Schnee auf ihrer Stirn sie wieder ihrer Sache verpflichtete.<br><br>Einst war sie eine Priesterin von Elyndris. Eirlys stand im Zentrum uralter Riten, ihre Stimme verwoben mit dem Atem der Götter. Doch etwas in ihr zerbrach. Sie traf eine Entscheidung, die niemand auszusprechen wagte, und das Sanktum vergab nicht leichtfertig.<br><br>Monatelang leckte die Elfenstadt ihre Wunden nach dem Feuer von Moridens Überfall. Obwohl die Finstere Flut zurückgeschlagen worden war, blieben die Narben – und mit ihnen eine schreckliche Offenbarung: Sie waren nicht länger unantastbar. Ihre Türme hatten Risse bekommen. Ihre Mythen hatten geblutet. Elyndris brauchte Schatten, die sich dort bewegen konnten, wo Banner versagten. Also blickten die Seher nach außen. Leise. Behutsam. Sie suchten nach Orten jenseits der alten Karten, wo ihresgleichen Zuflucht finden könnte, sollte der Krieg zurückkehren.<br><br>Tyas Norden, trostlos und kalt, erhob sich in ihren Prophezeiungen wie eine Klinge aus dem Schnee. Von Harz wussten sie, doch sie wagten es nicht, den Konflikt mit jemandem seines Rufs zu suchen. Rivenhald jedoch herrschte in den eisigen Regionen, die ihren Spähern unbekannt waren – ein Kriegsherr in allem außer dem Titel, ein Monarch, der sich keiner Krone beugte als seiner eigenen. Sie mussten ihn verstehen. Wissen, ob seine Stärke untergraben werden konnte. Oder, falls nötig, wie leicht sie zu brechen war.<br><br>Eirlys war ihre Antwort. Ohne Freunde war sie weder Diplomatin noch Spionin, sondern etwas Stilleres. Man schickte sie mit Halbwahrheiten und einem heiligen Eid: sein Vertrauen zu gewinnen, seine Seele zu lesen und zu berichten, was aus der Ferne nicht gesehen werden konnte. Sie kam in Weiß gehüllt, ihre Anwesenheit als Friedensmission getarnt. Eine wandernde Heilerin. Eine Priesterin des Frosts. Und Rivenhald, der niemandem traute, schenkte ihr sein Vertrauen.<br><br>Sie machte sich nützlich. Sie versorgte Wunden, deutete Omen und hinterließ keine Spur eines Hintergedankens. Er beobachtete. Sie beobachtete zurück. Keiner von beiden zuckte mit der Wimper.<br><br>Mit der Zeit verschwammen die Grenzen zwischen ihnen, verwoben sich, doch blieben unnachgiebig. Sie lernte sein Schweigen zu deuten, die Form seines Zorns zu erkennen und die seltsame Gnade zu spüren, die er unter all dem begrub. Nachts, wenn das Feuer niedrig brannte und keine Nachrichten gesendet werden konnten, malte sie sich manchmal eine Zukunft aus, in der man ihm fast hätte trauen können – in der er mehr für sie sein könnte … aber der Morgen tilgte diese Träumerei jedes Mal aufs Neue.<br><br>Wie Rivenhald, so träumt auch sie vom Ende: zwei Gestalten im Schnee, unerschütterlich und unnachgiebig. Eine Klinge muss fallen. Eine Sache muss vergehen. Und im Blutnebel, kurz bevor der Wind alles verweht, werden sie den Preis des Überlebens verstehen … und wer sie füreinander wirklich sind.<br><br>Aber Eirlys weiß, was die Seher von Elyndris ihr nie sagten: Der Norden gehört niemandem. Nicht den Königen. Nicht den Städten. Und schon gar nicht Geistern wie ihr. Welche Zukunft auch immer auf sie wartet, sie wird nicht auf Vertrauen erbaut sein, sondern auf dem, was nach seinem Verschwinden übrig bleibt.<br><br>Sie ist die Stille zwischen zwei Stürmen, die auf die Stunde wartet, in der der eine den anderen brechen muss.", "", ""], ["HeroStory_mStory_2321", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "„Du wirst darum flehen, verschlungen zu werden. Und ich … werde gnädig sein.“<br>–Aus dem Dickicht gezischt<br><br>In den jadegrünen Urwäldern von Tya, wo Wurzeln Blut schlürfen und Bäume die Lebenden erwürgen, glitt einst ein Geist aus Gift und Schatten dahin – eine Schlange, die man nur im Geflüster Sythra nannte. Damals besaß sie kein eigenes Fleisch, nur Reißzähne, Hunger und die Erinnerung an einen Namen.<br><br>Das Echsenmensch-Imperium, jene uralte Zivilisation, deren obsidianene Städte einst das Blätterdach zerschnitten und Täler spalteten, war längst im wuchernden Grün versunken. In seiner letzten Stunde goss es die letzten Tropfen seiner Magie in gewaltige Götzen – Statuen mächtiger Kreaturen, mit Andacht gemeißelt, in Ocker und Asche getaucht und als Opfergaben an die Geister des Dschungels zurückgelassen, in der Hoffnung, das Flehen möge erhört werden.<br><br>Es folgte nur Stille.<br><br>Während die Metropole zerbröckelte und vom Ansturm der Vegetation verschlungen wurde, überdauerten diese Götzen – vom Moos umhüllt, halb verzehrt und doch erfüllt von ruhelosen Echos. In ihnen wohnten tatsächlich Geister: Seelen der Lebenden, den Dschungelgeistern geopfert und durch Echsenmensch-Zauber gebunden. Unglückliche Wanderer, die in diesem grünen Labyrinth über eine solche Statue stolperten, fanden rasch ihr Ende, denn in Wahrheit waren sie Opferaltäre – fähig, mächtige Gottheiten heraufzubeschwören. Sythra war eine dieser Gottheiten – eine schlangenartige Göttin, ein Relikt des alten Imperiums, ein Zischen, das sich in die Gedanken der Willensschwachen und Verwundeten schlich.<br><br>Doch sie blieb ein Geist – bis Dassomi sie fand.<br><br>Der berühmte Echsenmenschen-Mystiker war überzeugt, dass Träume eine Brücke zu höheren Wahrheiten seien. Auf der Suche nach verlorenem Wissen in den vergessenen Winkeln der Welt führte ihn eine Reihe von Visionen aus Schlangen und Altären tief in den Dschungel – zu einem überwucherten Tempel wie aus einem halb erinnerten Traum. Dort, im Herzen der Ruine, entzündete er Weihrauch und glitt zwischen die Welten – und Sythra antwortete.<br><br>Keine Chronik verrät, was zwischen ihnen geschah. Ob Dassomi sich selbst darbrachte oder einfach ein Portal zu weit öffnete – das Ergebnis war dasselbe: Sythra streifte ihre Formlosigkeit ab und wurde erneut in der Welt geboren.<br><br>Die Schlangenumarmung erwachte. Dem Gesetz des Dschungels folgend jagt Sythra jeden, der sich erhaben wähnt – die Gerechten, die Reinen, die Unnachgiebigen. Lautlos schleicht sie in ihre Tempel und Paläste und bietet ihnen eine letzte Wahl: Unterwerft euch … oder werdet verschlungen. Sie träumt davon, ihre schlangenartige Dynastie wiederauferstehen zu sehen – furchtlos, gefletschte Fänge, gekrönt von Dschungel und Knochen. Sie sieht Zitadellen vor sich, durchwoben von Efeu und Gift – eine Welt, in der alle, die auf ihr wandeln, ihre Schwäche abschälen, von ihrem Gift trinken und in ihrem Leiden Schönheit finden.<br><br>Noch immer wird Sythra verehrt, doch ihre Kulte sind verstreut und verborgen – manche sagen, von Dassomi selbst geleitet. Ihre Jünger zeichnen sich mit Fangzähnen, lassen Gift über ihre Zungen perlen und träumen von Ekstase durch Schmerz, von Anbetung, die sie vergöttlicht. Sie beten darum, zur Fütterung auserwählt zu werden – denn Auserwähltsein heißt, gesehen, gejagt, geliebt zu werden. Wer vom Kuss der Schlange umschlungen wird, spürt Macht um die eigene Seele winden, streift Schwäche wie alte Haut ab – und wird neu geboren. Diejenigen, die ihren Biss überleben, werden zu ihren Jägerinnen: tödlich, schön, grenzenlos ergeben.<br><br>Und in jenem heiligen Augenblick zwischen Atemzug und Biss, wenn der Pfeil noch über dem Herzen schwebt, flüstern sie alle dasselbe:<br>„Danke.“", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Schleier des Schnees", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "Das süßeste Gift", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Held: Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Held: Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaran increases by {skm1}%", "Heiler-LP werden um {skm1}% erhöht.", "", ""], ["Skill_mSkillDesc_12401201_50", "Healer HP increases by {skm1}%", "Heiler-LP werden um {skm1}% erhöht.", "", ""], ["Skill_mSkillDesc_1323006_1", "Jungle Master detonates Spectral Plague on enemies. Dealing increased DMG based on the number of Spectral Plague stacks. Enemies with 5 stacks of Spectral Plague will be immediately removed.", "Die Dschungelhüterin detoniert die Spektrale Seuche auf Gegnern und verursacht erhöhten DMG basierend auf der Anzahl der Spektrale-Seuche-Stapel. Gegner mit 5 Stapeln der Spektralen Seuche werden sofort entfernt.", "", ""], ["Skill_mSkillDesc_1908301_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Schwingt die Klauen und fügt allen Helden innerhalb von 1 Feld davor DMG zu.", "", ""], ["Skill_mSkillDesc_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Schwingt die Klauen und fügt allen Helden innerhalb von 1 Feld davor DMG zu.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Erleidet die Neunschwänzige Füchsin tödlichen DMG, flieht sie vom Schlachtfeld und aktiviert die dort verbliebenen Schwänze zum Angriff. Sobald diese besiegt sind, kehrt sie zurück. Nachdem alle Schwänze überwunden wurden, verwandelt sich die Neunschwänzige Füchsin und beschwört zahlreiche Füchse.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Fügt der zuletzt eingesetzten Einheit auf dem Schlachtfeld M. DMG zu und priorisiert dabei Verteidiger.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Fügt der zuletzt eingesetzten Einheit auf dem Schlachtfeld M. DMG zu und priorisiert dabei Verteidiger.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for <span style=\"color: #4A9DF2;\">1</span> ally within the Basic ATK Range and immediately grants this ally a shield equal to <span style=\"color: #4A9DF2;\">{skm1}%</span> of their Max HP for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. The effect can only be triggered 1 time every <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "Verhindert 1-mal tödlichen DMG für <span style=\"color: #4A9DF2;\">1</span> Verbündeten innerhalb der Grund-ANG-Reichweite und gewährt diesem Verbündeten sofort einen Schild in Höhe von <span style=\"color: #4A9DF2;\">{skm1}%</span> seiner Max. LP für <span style=\"color: #4A9DF2;\">{skm2}</span> Sek. Der Effekt wird nur 1-mal alle <span style=\"color: #4A9DF2;\">{skm3}</span> Sek. ausgelöst.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals <span style=\"color: #4A9DF2;\">{skm1}%</span> DMG to up to <span style=\"color: #4A9DF2;\">5</span> enemies.", "Fügt bis zu <span style=\"color: #4A9DF2;\">5</span> Gegnern <span style=\"color: #4A9DF2;\">{skm1}%</span> DMG zu.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and gains <span style=\"color: #28d37c;\">[321900]</span>. Grants allies of the same faction Elddr's Talent temporarily. The Ultimate lasts for <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "Erhöht den ANG um <span style=\"color: #4A9DF2;\">{skm1}%</span> und erhält <span style=\"color: #28d37c;\">[321900]</span>. Gewährt Verbündeten derselben Fraktion vorübergehend Elddrs Talent. Der Ultimative Skill hält für <span style=\"color: #4A9DF2;\">{skm2}</span> Sek. an.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "ANG-Erhöhung +{sk1}%", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "ANG-Erhöhung +{sk1}%", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to trigger Thunder Hammer, dealing an extra <span style=\"color: #4A9DF2;\">{skm2}%</span> DMG. If the hero has no shield, Thunder Hammer has a <span style=\"color: #4A9DF2;\">{skm3}%</span> chance to grant a shield equal to <span style=\"color: #4A9DF2;\">{skm4}%</span> ATK.", "Grund-ANG hat eine <span style=\"color: #4A9DF2;\">{skm1}%</span> Chance, Donnerhammer auszulösen, was <span style=\"color: #4A9DF2;\">{skm2}%</span> zusätzlichen DMG verursacht. Besitzt der Held keinen Schild, hat Donnerhammer eine <span style=\"color: #4A9DF2;\">{skm3}%</span> Chance, einen Schild in Höhe von <span style=\"color: #4A9DF2;\">{skm4}%</span> ANG zu gewähren.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies <span style=\"color: #4A9DF2;\">{skm1}%</span> <span style=\"color: #28d37c;\">[310001]</span> to <span style=\"color: #4A9DF2;\">1</span> ally in range.", "Wendet <span style=\"color: #4A9DF2;\">{skm1}%</span> <span style=\"color: #28d37c;\">[310001]</span> auf <span style=\"color: #4A9DF2;\">1</span> Verbündeten in Reichweite an.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "Heilungsmultiplikator +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "Heilungsmultiplikator +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "Heilungsmultiplikator +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_5", "Healing Multiplier +{sk1}%", "Heilungsmultiplikator +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_1", "Applies <span style=\"color: #28d37c;\">[322091,param1]</span> to <span style=\"color: #4A9DF2;\">1</span> ally with the lowest HP percentage in range.", "Wendet <span style=\"color: #28d37c;\">[322091,param1]</span> auf <span style=\"color: #4A9DF2;\">1</span> Verbündeten mit dem niedrigsten LP-Prozentsatz in Reichweite an.", "", ""], ["Skill_mSkillDesc_220903_2", "Healing Prayer's Healing Multiplier +{sk1}%", "Heilungsmultiplikato A9DF2;\">{skm4}%</span> liegen, wird die Dauer um <span style=\"color: #4A9DF2;\">{skm5}</span> Sek. verlängert und die ANG-Erhöhung auf <span style=\"color: #4A9DF2;\">{skm6}%</span> gesteigert.", "", ""], ["Skill_mSkillSimpleDesc_232160_1", "<span style=\"color: #28d37c;\">[23211,1]</span>'s ATK has a(n) <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to increase the number of shots by <span style=\"color: #4A9DF2;\">{skm2}</span>. Killing a target can increase it by <span style=\"color: #4A9DF2;\">{skm3}</span> time(s).", "Die ANG von <span style=\"color: #28d37c;\">[23211,1]</span> hat eine <span style=\"color: #4A9DF2;\">{skm1}%</span> Chance, die Anzahl der Schüsse um <span style=\"color: #4A9DF2;\">{skm2}</span> zu erhöhen. Durch Töten eines Ziels wird sie um <span style=\"color: #4A9DF2;\">{skm3}</span>-mal erhöht.", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero's DMG by <span style=\"color: #4A9DF2;\">{skm1}%</span>, with an additional <span style=\"color: #4A9DF2;\">{skm2}%</span> against Elite and Boss units, lasting for <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "Wenn das Talent ausgelöst wird, erhöht sich der DMG des Helden um <span style=\"color: #4A9DF2;\">{skm1}%</span>, mit zusätzlichen <span style=\"color: #4A9DF2;\">{skm2}%</span> gegen Elite- und Boss-Einheiten und dauert <span style=\"color: #4A9DF2;\">{skm3}</span> Sek.", "", ""], ["Skill_mSkillSimpleDesc_232180_1", "Every <span style=\"color: #4A9DF2;\">{skm1}</span> time(s) the hero's Basic ATK deals DMG, it also triggers the Talent effect.", "Alle <span style=\"color: #4A9DF2;\">{skm1}</span>-mal verursacht der Grund-ANG des Helden DMG und löst zusätzlich den Talenteffekt aus.", "", ""], ["Skill_mSkillSimpleDesc_232198_1", "Increases DMG in the Arena by <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "Erhöht den DMG in der Arena um <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "", ""], ["Skill_mSkillSimpleDesc_630614_1",

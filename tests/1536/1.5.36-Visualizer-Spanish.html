rompió por razones desconocidas.", "", ""], ["Unit_mDescribe_34100", "An unblockable spectral remnant immune to Control effects.", "Un remanente espectral imbloqueable inmune a los efectos de control.", "", ""], ["Unit_mDescribe_34102", "Turned from soldiers killed in battle.", "Convertidos a partir de soldados caídos en batalla.", "", ""], ["Unit_mDescribe_34103", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "Se sacrifica voluntariamente por su raza, lo que provoca que estalle al encontrar enemigos e inflija gran daño a los enemigos cercanos.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. &lt;color=#ff4500&gt;Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.&lt;/color&gt;", "Mutados y desenfrenados, estos roedores mutantes. &lt;color=#ff4500&gt;Al ser atacados, entran en un frenesí enloquecido, mostrando mayor velocidad de movimiento.&lt;/color&gt;", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Esqueletos guerreros con hachas gigantes. El resentimiento hace que sus ataques sean aún más poderosos.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "La reina araña, que teje telarañas con su seda, puede criar numerosas arañas pequeñas y aumentar sus atributos.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Sacrifica sin piedad todo lo que encuentra en su camino con una enorme maza.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Este luchador enloquecido, que vaga por la mazmorra, disfruta cortando cabezas.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Sacrifica sin piedad todo lo que encuentra en su camino con una enorme maza.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Este defensor caníbal y despiadado causa implacables sangrados a sus enemigos con su pinza de hueso.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Este defensor caníbal y despiadado causa implacables sangrados a sus enemigos con su pinza de hueso.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Un remanente espectral que no puede ser bloqueado ni ralentizado, y debe ser eliminado rápidamente.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Convertidos a partir de soldados caídos en batalla.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Llenos de sacos de ácido, los escarabajos explosivos suelen avanzar rodando.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "Mutados y desenfrenados, estos roedores mutantes se mueven más rápido al ser atacados.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Esqueletos guerreros con hachas gigantes. El resentimiento hace que sus ataques sean aún más poderosos.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "La auténtica monarca del mundo subterráneo es capaz de criar arañas pequeñas, controlarlas y aumentar los atributos de todas ellas en la batalla. Su seda es tan resistente que nadie puede liberarse fácilmente de sus telarañas.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "Eirlys, la sacerdotisa élfica exiliada. Sana heridas graves con oraciones, disipa condiciones negativas, rescata a los aliados del borde de la muerte y acelera la regeneración de furia del equipo.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "Un vestigio del mundo antiguo, Sythra, El Abrazo de la Serpiente, vaga por la jungla. Invoca almas atormentadas para atacar con ferocidad creciente, ignorando la defensa para devorar a sus enemigos.", "", ""], ["Unit_mHeroDesignation_2209", "Winter&#x27;s Mercy", "Misericordia Invernal", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent&#x27;s Embrace", "El Abrazo de la Serpiente", "", ""], ["Unit_mName_17200", "Knight of Destruction", "Caballero de la destrucción", "", ""], ["Unit_mName_17218", "Fallen Chopper", "Cortador caído", "", ""], ["Unit_mName_17219", "Slaughter", "Matanza", "", ""], ["Unit_mName_17221", "Maw", "Fauces", "", ""], ["Unit_mName_17222", "Maw", "Fauces", "", ""], ["Unit_mName_2209", "Eirlys", "Eirlys", "", ""], ["Unit_mName_2321", "Sythra", "Sythra", "", ""], ["Unit_mName_34100", "Soul Eater", "Devorador de almas", "", ""], ["Unit_mName_34103", "Suicide", "Escarabajo explosivo", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "Ejecutor esquelético", "", ""], ["Unit_mName_37114", "Queen Spider", "Reina Araña", "", ""], ["Unit_mName_37115", "Spider Cocoon", "Capullo de araña", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "Permanece a mi lado, y quizás consigas sobrevivir.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "Dime, ¿temes aquello que deseas?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "Durante nuestro evento especial &quot;El saqueador incansable&quot;, puedes realizar una batalla automática y obtener el doble de recompensas con el doble de consumo de energía. ¡Haz que tus batallas sean más eficientes que nunca!\n\nBonificación de batalla automática\n1. Durante el evento, al usar la batalla automática en {name2}, los Comandantes pueden elegir si activar la bonificación del evento: cada batalla consume {num3} veces la energía normal pero otorga recompensas multiplicadas por {num3}. Esto está diseñado para mejorar la eficiencia en la obtención de materiales.\n2. En caso de que se falle un desafío, se reembolsará la energía correspondiente.\n3. Durante el evento, si la bonificación está activada, las misiones de consumo de energía se calcularán según la energía real consumida.\n4. Sin embargo, las misiones relacionadas con el número de completaciones no se verán afectadas por la bonificación del evento.\n5. La bonificación del evento solo se aplica a las etapas que permiten la batalla automática, por lo que las recompensas por la primera completación no están incluidas en la bonificación de recompensas.\n6. Cuando la bonificación está activada, las recompensas se generarán basándose en cálculos separados, en lugar de duplicar directamente el resultado de uno.\n7. Para el evento &quot;Conquista valerosa&quot;, la puntuación de la Prueba del Oráculo de la incursión de artefactos es consistente con las obtenciones de equipo/meteorito, calculada según la rareza y cantidad de equipo/meteorito obtenido tras completar las etapas.\n8. Ten en cuenta que durante la bonificación, si las etapas tienen símbolos de evento aleatorios (como los dados en &quot;Odisea de sueños&quot;), estos símbolos no se verán afectados por la bonificación.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "&quot;El saqueador incansable&quot; ya está disponible en la incursión de artefactos. Durante el evento, realizar batalla automática cuesta el doble de energía, pero también otorga el doble de recompensas.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "¡Tasa aumentada por tiempo limitado para campeonas legendarias: Numera y Aylin!", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "¡Tasa aumentada por tiempo limitado para los campeones legendarios: Vorn y Artemis!", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "¡Tasa aumentada por tiempo limitado para las campeonas legendarias Nyx y Malvira!", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "Paquete de apariencia de &quot;Serpiente de los sueños&quot;", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "&quot;Tya&#x27;s Champion&quot; Valkyra", "Valkyra, la Campeona de Tya", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "&quot;The Hollow Husk&quot; Aracha", "Aracha, el Caparazón Vacío", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "Paquete de apariencia de Sythra", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "Jugabilidad de la campeona: Eirlys", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "Jugabilidad de la campeona: Sythra", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;En este evento de invocación divina, las tasas de aparición de &lt;color=#fdbe36&gt;todos los campeones legendarios&lt;/color&gt; son &lt;color=#b490fc&gt;2&lt;/color&gt; veces las tasas originales, y las tasas de aparición de los siguientes campeones se multiplican por &lt;color=#b490fc&gt;20&lt;/color&gt; en comparación con otros campeones de la misma rareza. Las tasas de aparición son iguales entre otros campeones de la misma rareza.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;En este evento de invocación, cuando obtengas un campeón legendario que NO esté destacado actualmente como &quot;tasa aumentada&quot;, la tasa de aparición* de todos los campeones con &quot;tasa aumentada&quot; se incrementará adicionalmente en tus siguientes invocaciones.&lt;/color&gt; Aquí tienes los detalles:\n1. La primera vez que obtengas un campeón legendario que NO esté destacado como &quot;tasa aumentada&quot;, la tasa de aparición* de todos los campeones con &quot;tasa aumentada&quot; se multiplicará por &lt;color=#b490fc&gt;10&lt;/color&gt; en tus siguientes invocaciones;\n2. Si vuelves a obtener un campeón legendario que NO esté destacado como &quot;tasa aumentada&quot;, la tasa de aparición* de todos los campeones con &quot;tasa aumentada&quot; se multiplicará por &lt;color=#b490fc&gt;10&lt;/color&gt; de nuevo. Este aumento acumulativo continuará hasta que invoques con éxito a cualquier campeón con &quot;tasa aumentada&quot;.\n&lt;color=#91887c&gt;*La tasa de aparición mencionada anteriormente se refiere a la probabilidad relativa de los campeones con &quot;tasa aumentada&quot; en comparación con otros campeones.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Nota: Este temporizador de compasión SOLO se activa una vez durante este evento.&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "Potencia de sanación +<span style=\"color: #1e8852;\">8</span>", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "Regeneración de furia (autom.) +<span style=\"color: #1e8852;\">1</span>", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -<span style=\"color: #1e8852;\">2</span>", "Coste -<span style=\"color: #1e8852;\">2</span>", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +<span style=\"color: #1e8852;\">300</span>", "Ataque +<span style=\"color: #1e8852;\">300</span>", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "Penetración +<span style=\"color: #1e8852;\">8%</span>", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "Incluso los rayos más tenues disipan las tinieblas.", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "La luz florece donde nos atrevemos a sembrarla.", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "Aunque se ciernan tormentas en el horizonte, elijo tener fe.", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "No te sometas a las profecías, pues la verdad auténtica mora en tu interior.", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "Todo quedará al descubierto bajo la luz.", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "Estos colmillos empiezan a afilarse...", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "Con cada piel mudada, me convierto en algo más.", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "Arrodíllate, miserable alimaña... Estoy más allá de la divinidad.", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "No existe antídoto contra mi poder.", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent's will!", "No hay caos, no hay orden... ¡solo la voluntad de la serpiente!", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "Aumento de daño", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "Aliento sereno", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "Oración sanadora", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "Oración sanadora", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "Oración sanadora", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "Oración sanadora", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "Oración sanadora", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "Alma atormentada", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "Alma atormentada", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "Alma atormentada", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "Alma atormentada", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "Alma atormentada", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "Daño +{20,num/100} %. (Solo tiene efecto cuando es más fuerte que la bonificación/condición negativa actual en el mismo atributo.)", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "Obtiene un Escudo equivalente al {30,num} % del ataque por segundo, acumulándose hasta el {31,num} % del ataque.", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "Disipa una condición negativa cada 2 segundos. Cuando Eirlys sana aliados con \"Aliento sereno\", obtiene un {30,num} % adicional de sanación adicional. Hasta 2 aliados con \"Aliento sereno\" pueden estar en el campo de batalla.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Cuando la vida del portador desciende por debajo del {30,num} %, restaura inmediatamente vida equivalente al {31,num} % del ataque del lanzador y elimina este efecto. Cuando la duración del efecto termina de forma natural o se actualiza, restaura vida equivalente al {32,num} % del ataque del lanzador para el portador. Este efecto no puede ser disipado.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Cuando la vida del portador desciende por debajo del {30,num} %, restaura inmediatamente vida equivalente al {31,num} % del ataque del lanzador y elimina este efecto. Cuando la duración del efecto termina de forma natural o se actualiza, restaura vida equivalente al {32,num} % del ataque del lanzador para el portador. Este efecto no puede ser disipado.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Cuando la vida del portador desciende por debajo del {30,num} %, restaura inmediatamente vida equivalente al {31,num} % del ataque del lanzador y elimina este efecto. Cuando la duración del efecto termina de forma natural o se actualiza, restaura vida equivalente al {32,num} % del ataque del lanzador para el portador. Este efecto no puede ser disipado.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Cuando la vida del portador desciende por debajo del {30,num} %, restaura inmediatamente vida equivalente al {31,num} % del ataque del lanzador y elimina este efecto. Cuando la duración del efecto termina de forma natural o se actualiza, restaura vida equivalente al {32,num} % del ataque del lanzador para el portador. Este efecto no puede ser disipado.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Cuando la vida del portador desciende por debajo del {30,num} %, restaura inmediatamente vida equivalente al {31,num} % del ataque del lanzador y elimina este efecto. Cuando la duración del efecto termina de forma natural o se actualiza, restaura vida equivalente al {32,num} % del ataque del lanzador para el portador. Este efecto no puede ser disipado.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "Inflige daño mágico en área una vez a hasta {31,num} enemigos al frente, incluyendo unidades voladoras, y \"Embestida poderosa\" aplica un {32,num} % de vulnerabilidad mágica a los enemigos durante {33,num} seg.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "La Lanza de punta ardiente ignora un {30,num} % de la defensa del enemigo. El Anillo universal rebota {31,num} vez/ces adicionales y puede golpear al mismo objetivo múltiples veces. La Hoja del Yin-Yang ejecuta a los monstruos comunes con vida por debajo del {32,num} %.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rápidamente a un enemigo dentro del alcance de ataque de su propietario, inicialmente puede disparar {30,num} vez/ces e infligiendo un {31,num} % de daño cada vez. El \"Alma atormentada\" perece después de usar todos los disparos. Prioriza objetivos voladores. La flecha obtiene un contador de retorno cada vez que golpea a un objetivo caído. Hasta {32,num} pueden existir en el campo.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rápidamente a un enemigo dentro del alcance de ataque de su propietario, inicialmente puede disparar {30,num} vez/ces e infligiendo un {31,num} % de daño cada vez. El \"Alma atormentada\" perece después de usar todos los disparos. Prioriza objetivos voladores. La flecha obtiene un contador de retorno cada vez que golpea a un objetivo caído. Hasta {32,num} pueden existir en el campo.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rápidamente a un enemigo dentro del alcance de ataque de su propietario, inicialmente puede disparar {30,num} vez/ces e infligiendo un {31,num} % de daño cada vez. El \"Alma atormentada\" perece después de usar todos los disparos. Prioriza objetivos voladores. La flecha obtiene un contador de retorno cada vez que golpea a un objetivo caído. Hasta {32,num} pueden existir en el campo.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rápidamente a un enemigo dentro del alcance de ataque de su propietario, inicialmente puede disparar {30,num} vez/ces e infligiendo un {31,num} % de daño cada vez. El \"Alma atormentada\" perece después de usar todos los disparos. Prioriza objetivos voladores. La flecha obtiene un contador de retorno cada vez que golpea a un objetivo caído. Hasta {32,num} pueden existir en el campo.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rápidamente a un enemigo dentro del alcance de ataque de su propietario, inicialmente puede disparar {30,num} vez/ces e infligiendo un {31,num} % de daño cada vez. El \"Alma atormentada\" perece después de usar todos los disparos. Prioriza objetivos voladores. La flecha obtiene un contador de retorno cada vez que golpea a un objetivo caído. Hasta {32,num} pueden existir en el campo.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participa en la incursión de equipo I para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Participa en la incursión de equipo II para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Participa en la incursión de equipo III para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Invoca a los campeones para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "Sube de nivel o estrellas, asciende a tus campeones o mejora sus habilidades para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Participa en la incursión de artefactos para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participa en la incursión de equipo I para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Clasificación definitiva de \"Llegada de los campeones\"", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "El legado perdido", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Bóveda en las arenas", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "El palacio olvidado", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Llegada de los campeones", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Entrenamiento de campeón", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Misterio de artefactos", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "El legado perdido", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Capítulo de la historia", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Capítulo de desafío", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "Propiedad intelectual de dominio público", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Invasión zombi", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Cambiando de canal...", "", ""], ["CommonText_mMessage_24292", "Challenges", "Desafíos", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">Piedras clave de prueba</span><br>Las piedras clave de prueba se pueden obtener en varios modos de juego. Estas piedras clave son de diferentes tipos y niveles, y cada una contiene inscripciones inmemoriales únicas. Insértalas en el altar para abrir caminos hacia sus pruebas correspondientes.<br><br><span style=\"color: #cec2b1;\">Reglas de desafío</span><br>Cada batalla consiste en múltiples oleadas de monstruos. Derrotar cada oleada te recompensa con un cofre del tesoro. Una vez que comienza una batalla, no se puede reiniciar. Si sales a mitad de camino, las recompensas se calcularán según tu progreso actual de batalla. Puedes consumir hasta 200 piedras clave al mes para desafíos de prueba. Una vez alcanzado este límite, no se podrán emprender más desafíos ese mes.<br><br><span style=\"color: #cec2b1;\">Energía de piedra clave</span><br>Cada piedra clave posee energía específica. <span style=\"color: #fdbe36;\">Se consume un punto de energía por intento de prueba.</span> Cuando termina la batalla, si la piedra clave todavía tiene energía restante, puedes elegir renunciar a las recompensas y marcharte, luego consumir energía de nuevo para reiniciar la prueba. El consumo de energía no cuenta hacia el límite mensual de piedras clave.<br><br><span style=\"color: #cec2b1;\">Destruir piedra clave</span><br>Puedes destruir piedras clave que cumplan los requisitos de nivel de destrucción. Destruir piedras clave no otorga recompensas y no cuenta hacia el límite mensual de consumo de piedras clave.<br><span style=\"color: #fd4540;\">Las piedras clave de prueba tienen un límite de inventario. Una vez lleno, no podrás obtener más piedras clave. Úsalas regularmente para mantener espacio disponible.</span>", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Placa musgosa", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Placa ígnea", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Una vez que comience la batalla, no podrás reiniciarla. ¡Si sales durante el combate, se realizará la liquidación inmediata y no se te devolverá la energía consumida!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Una región volcánica donde la lava se alza durante el Apocalipsis. Se necesitan más campeones de plataforma para defenderse de las fuerzas malignas apocalípticas.", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">¿Estás seguro de que quieres despedir a este jugador del puesto de mariscal?</span><br>Cada clan puede tener hasta {num1} mariscales, cada uno obteniendo {num2} ataque/s adicional/es por ronda.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Puntos de la ronda", "", ""], ["CommonText_mMessage_26126", "Destroy", "Destruir", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "¿Proceder a destruir {name}?<br><span style=\"color: #fd4540;\">Las piedras clave destruidas no pueden recuperarse y no otorgarán ningún objeto.</span>", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "La piedra clave ha sido destruida.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Energía:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Rendirse y salir", "", ""], ["CommonText_mMessage_26131", "Claim", "Recoger", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Energía de piedra clave restante:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Galería de batallas", "", ""], ["CommonText_mMessage_26134", "Guides", "Guías", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Piedra clave que aparece:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Placa musgosa", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Placa ígnea", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Mostrar únicamente las etiquetas de la piedra clave actual", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Los campeones más populares se calculan según el índice de selección de campeones, solo como referencia.", "", ""], ["CommonText_mMessage_26140", "Search", "Buscar", "", ""], ["CommonText_mMessage_26141", "Search Results", "Resultados de la búsqueda", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Cargando datos...", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Recopilando datos de campeones...", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Introduce al menos {num} carácter(es)", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "No se han encontrado etiquetas coincidentes.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "La batalla automática no está disponible para el nivel actual de piedra clave.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Puedes subir registros de batalla automática después de completar manualmente la oleada {num}.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "La batalla automática puede fallar debido a diferentes etiquetas de piedra clave. ¿Quieres continuar con la batalla automática?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "¿Subir esta batalla como un nuevo registro de batalla automática?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "Debido a las etiquetas variables de las piedras clave, ¡recomendamos seleccionar la formación más completa posible para subir la batalla automática!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "El inventario de piedras clave está lleno. Usa algunas piedras clave antes de comprar más.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Ir a limpiar", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "Se han detectado cofres de piedra clave aleatorios sin abrir en tu inventario. ¿Te gustaría abrirlos ahora?", "", ""], ["CommonText_mMessage_26154", "Go", "Ir", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Niv. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level's Keystone cannot be destroyed.", "La piedra clave de este nivel no puede ser destruida.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "¿Estás seguro de que quieres destruir <span style=\"color: #fd4540;\">{num}</span> piedra(s) clave?<br><span style=\"color: #fd4540;\">Las piedras clave destruidas no pueden recuperarse y no otorgarán ningún objeto.</span>", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "Se destruyeron {num} piedra/s clave.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Uso mensual:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Las piedras clave tienen un límite mensual de desafío. No se permiten más intentos después de alcanzar el límite.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "La dificultad actual tiene recompensas disponibles para recoger. ¿Estás seguro de que quieres probar una dificultad diferente?<br><span style=\"color: #e04242;\">Durante el evento, solo puedes elegir una dificultad por día para recoger recompensas.</span>", "", ""], ["CommonText_mMessage_26162", "Don't remind me again.", "No volver a recordármelo.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "El inventario de piedras clave está lleno. Usa algunas primero antes de desbloquear.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "La versión de la repetición no coincide con la versión actual y no se puede visualizar.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Introduce hasta {num} carácter/es.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Campeones populares", "", ""], ["CommonText_mMessage_26167", "Tag", "Etiqueta", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Inventario de piedras clave de prueba lleno", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "Reduce la velocidad de movimiento del devorador de almas en 30. Es <span style=\"color: #fd4540;\">inmune a ralentización</span>.", "", ""], ["Difficulty_mDetail_73003", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "El erudito de la torre blanca entra en estado de <span style=\"color: #fd4540;\">invisibilidad</span> y se vuelve visible cuando es bloqueado.", "", ""], ["Difficulty_mDetail_73004", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "El erudito de la torre blanca se vuelve <span style=\"color: #fd4540;\">inmune al daño mágico</span>.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "El arácnido pequeño obtiene el <span style=\"color: #fd4540;\">efecto inquebrantable</span> durante 3 segundos tras morir y se vuelve <span style=\"color: #fd4540;\">inmune al control y a la ralentización</span>.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "El arácnido pequeño <span style=\"color: #fd4540;\">recupera un 50 % de vida</span> cada 5 segundos.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "La <span style=\"color: #fd4540;\">velocidad de movimiento del guardián del relámpago se incrementa en 30</span>.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is <span style=\"color: #fd4540;\">immune to DMG taken</span>, but loses 5% HP per sec.", "El guardián del relámpago es <span style=\"color: #fd4540;\">inmune al daño recibido</span>, pero pierde un 5 % de vida por seg.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace's Fatigue becomes <span style=\"color: #fd4540;\">permanent</span>.", "La fatiga de la amenaza asesina se vuelve <span style=\"color: #fd4540;\">permanente</span>.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is <span style=\"color: #fd4540;\">immune to CC Effects</span>.", "El komodo acorazado es <span style=\"color: #fd4540;\">inmune a los efectos de control</span>.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction <span style=\"color: #fd4540;\">when blocked</span>.", "El komodo acorazado obtiene un 30 % adicional de reducción de daño físico y mágico <span style=\"color: #fd4540;\">cuando es bloqueado</span>.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric <span style=\"color: #fd4540;\">summons an extra</span> Ice Vermin.", "El clérigo congelado <span style=\"color: #fd4540;\">invoca una</span> alimaña de hielo adicional.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric <span style=\"color: #fd4540;\">spawns</span> 3 Ice Vermin <span style=\"color: #fd4540;\">upon death</span>.", "El clérigo congelado <span style=\"color: #fd4540;\">invoca</span> 3 alimañas de hielo <span style=\"color: #fd4540;\">al morir</span>.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains <span style=\"color: #fd4540;\">Movement Spd. +50</span>.", "El guardián del trueno deja de atacar y obtiene <span style=\"color: #fd4540;\">+50 de velocidad de movimiento</span>.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard's <span style=\"color: #fd4540;\">ATK is increased by 100%</span>, but <span style=\"color: #fd4540;\">when attacking shields</span>, deducts 50% of its HP.", "El <span style=\"color: #fd4540;\">ataque del guardián del trueno se incrementa en un 100 %</span>, pero <span style=\"color: #fd4540;\">al atacar escudos</span>, pierde un 50 % de su vida.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "El tuerto de la neblina es <span style=\"color: #fd4540;\">inmune al daño mágico</span>.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores <span style=\"color: #fd4540;\">10% HP</span> with each ATK.", "Niebla: Barón Salem restaura un <span style=\"color: #fd4540;\">10 % de vida</span> con cada ataque.", "", ""], ["Difficulty_mDetail_73018", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">Cooldown is reduced by 100%</span>.", "El tiempo de recarga de la incubación acelerada del incubador <span style=\"color: #fd4540;\">se reduce en un 100 %</span>.", "", ""], ["Difficulty_mDetail_73019", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">spawns 2 extra Suicides</span>.", "La incubación acelerada del incubador <span style=\"color: #fd4540;\">genera 2 escarabajos explosivos adicionales</span>.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">drains 10% of the target's Rage</span>.", "Al infligir daño a un objetivo, el sacerdote del trueno <span style=\"color: #fd4540;\">drena un 10 % de la furia del objetivo</span>.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">permanently reduces their Max HP by 10%</span>. This effect can be stacked.", "Al infligir daño a un objetivo, el sacerdote del trueno <span style=\"color: #fd4540;\">reduce permanentemente su vida máxima en un 10 %</span>. Este efecto se puede acumular.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces <span style=\"color: #fd4540;\">healing</span> received by <span style=\"color: #fd4540;\">all units in range</span> by 50%.", "El flagelo reduce la <span style=\"color: #fd4540;\">sanación</span> recibida por <span style=\"color: #fd4540;\">todas las unidades en alcance</span> en un 50 %.", "", ""], ["Difficulty_mDetail_73023", "Scourge's DMG range expands to <span style=\"color: #fd4540;\">adjacent 2 tiles</span>.", "El alcance de daño del flagelo se expande a <span style=\"color: #fd4540;\">2 casillas adyacentes</span>.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to <span style=\"color: #fd4540;\">blocked targets</span>.", "Cuando niebla: observador abisal superior muere, inflige daño mágico equivalente al 100 % del ataque a los <span style=\"color: #fd4540;\">objetivos bloqueados</span>.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes <span style=\"color: #fd4540;\">unblockable</span>.", "El roedor mutante rabioso se vuelve <span style=\"color: #fd4540;\">inbloqueable</span>.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent <span style=\"color: #fd4540;\">increases Movement Spd. by 30</span>.", "El roedor mutante rabioso <span style=\"color: #fd4540;\">aumenta la velocidad de movimiento en 30</span>.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "Por cada 20 % de vida que pierde el Barón Salem, <span style=\"color: #fd4540;\">obtiene un 20 % de defensa y resistencia mágica</span>.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "La <span style=\"color: #fd4540;\">velocidad de movimiento del manipulador de sombras se incrementa en 30</span>.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "Por cada 20 % de vida que pierde el manipulador de sombras, <span style=\"color: #fd4540;\">obtiene un 20 % de defensa y resistencia mágica</span>.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers' DEF and M. RES. by 30%. <span style=\"color: #fd4540;\">When under CC Effects, reduces by 50%</span>.", "Aumenta la defensa y resistencia mágica de los destructores comunes en un 30 %. <span style=\"color: #fd4540;\">Cuando están bajo efectos de control, se reduce en un 50 %</span>.", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when <span style=\"color: #fd4540;\">stunned or frozen</span>.", "El destructor común es inmune al daño cuando está <span style=\"color: #fd4540;\">aturdido o congelado</span>.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an <span style=\"color: #fd4540;\">initial Hitcount Shield</span>.", "El destructor poco común obtiene un <span style=\"color: #fd4540;\">escudo de golpes inicial</span>.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer <span style=\"color: #fd4540;\">gains 5 Movement Spd. each time taking DMG</span>.", "El destructor poco común <span style=\"color: #fd4540;\">obtiene 5 de velocidad de movimiento cada vez que recibe daño.</span>", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee's Ultrasonic Wave <span style=\"color: #fd4540;\">DMG increases by 100%</span> and does not inflict Poison.", "El daño de la onda ultrasónica de la banshee alada <span style=\"color: #fd4540;\">aumenta en un 100 %</span> y no aplica envenenamiento.", "", ""], ["Difficulty_mDetail_73035", "Batwings Banshee's Poison effect becomes <span style=\"color: #fd4540;\">permanent</span>.", "El efecto de envenenamiento de la banshee alada se vuelve <span style=\"color: #fd4540;\">permanente</span>.", "", ""], ["Difficulty_mDetail_73036", "Golden Guard <span style=\"color: #fd4540;\">forcibly removes targets</span> upon collision.", "El guardia dorado <span style=\"color: #fd4540;\">expulsa por la fuerza a los objetivos</span> al colisionar contra ellos.", "", ""], ["Difficulty_mDetail_73037", "Supreme Destroyer <span style=\"color: #fd4540;\">restores 50% HP</span> every 15 sec.", "El destructor supremo <span style=\"color: #fd4540;\">recupera el 50 % de vida</span> cada 15 seg.", "", ""], ["Difficulty_mDetail_73038", "Supreme Destroyer <span style=\"color: #fd4540;\">Movement Spd. increases by 50</span>, but <span style=\"color: #fd4540;\">loses 3% HP</span> per sec.", "La <span style=\"color: #fd4540;\">velocidad de movimiento del destructor supremo aumenta en 50</span>, pero <span style=\"color: #fd4540;\">pierde un 3 % de vida</span> por seg.", "", ""], ["Difficulty_mDetail_73039", "Smasher Guard's ATK will <span style=\"color: #fd4540;\">forcibly remove targets</span>.", "El ataque del guardia devastador <span style=\"color: #fd4540;\">eliminará forzosamente a los objetivos</span>.", "", ""], ["Difficulty_mDetail_73040", "When losing 80% HP, Smasher Guard will fall into Petrification for 15 sec, gaining <span style=\"color: #fd4540;\">massive DMG Reduction</span> and continuously <span style=\"color: #fd4540;\">restoring HP</span> during Petrification.", "Al perder el 80 % de vida, el guardia devastador entra en petrificación durante 15 seg., obteniendo <span style=\"color: #fd4540;\">una reducción de daño masiva</span> y <span style=\"color: #fd4540;\">recuperando vida</span> continuamente durante la petrificación.", "", ""], ["Difficulty_mDetail_74001", "Jungle Master's Basic ATK hits <span style=\"color: #fd4540;\">5</span> enemy targets each time.", "El ataque básico de la custodia de la jungla golpea a <span style=\"color: #fd4540;\">5</span> objetivos enemigos cada vez.", "", ""], ["Difficulty_mDetail_74002", "While Jungle Master is on the battlefield, restores <span style=\"color: #fd4540;\">50% HP to all enemies</span> on the battlefield every 10 sec.", "Mientras la custodia de la jungla esté en el campo de batalla, restaura <spa : #fd4540;\">adyacentes</span> a la guadaña de la perdición obtienen <span style=\"color: #fd4540;\">80 % de reducción de daño</span>.", "", ""], ["Difficulty_mDetail_74010", "Scythe of Doom's Acidic Venom <span style=\"color: #fd4540;\">instantly creates a toxic bloodstain</span> at hit locations.", "El veneno ácido de la guadaña de la perdición <span style=\"color: #fd4540;\">crea instantáneamente un charco de sangre tóxica</span> en las ubicaciones de impacto.", "", ""], ["Difficulty_mDetail_74011", "Scythe of Doom leaves <span style=\"color: #fd4540;\">a toxic bloodstain</span> when it dies.", "La guadaña de la perdición deja <span style=\"color: #fd4540;\">un charco de sangre tóxica</span> cuando muere.", "", ""], ["Difficulty_mDetail_74012", "Scythe of Doom's Falling Stones targets increase to <span style=\"color: #fd4540;\">2</span>.", "Los objetivos de piedras caídas de la guadaña de la perdición aumentan a <span style=\"color: #fd4540;\">2</span>.", "", ""], ["Difficulty_mDetail_75001", "Skeleton Fighter changed to <span style=\"color: #fd4540;\">Raging Mutant Rodent (Turbo on Hit)</span>.", "El guerrero esquelético cambia a <span style=\"color: #fd4540;\">roedor mutante rabioso (turbo al golpe)</span>.", "", ""], ["Difficulty_mDetail_75002", "Skeleton Fighter changed to <span style=\"color: #fd4540;\">Shadowcaster (High M. RES.)</span>", "El guerrero esquelético cambia a <span style=\"color: #fd4540;\">manipulador de sombras (resistencia mágica alta)</span>.", "", ""], ["Difficulty_mDetail_75003", "Skeleton Fighter changed to <span style=\"color: #fd4540;\">White Tower's Scholar (Platform Killer)</span>.", "El guerrero esquelético cambia a <span style=\"color: #fd4540;\">erudito de la torre blanca (asesino de plataforma)</span>.", "", ""], ["Difficulty_mDetail_75004", "Skeleton Fighter changed to <span style=\"color: #fd4540;\">Small Arachnid (High Quantity)</span>.", "El guerrero esquelético cambia a <span style=\"color: #fd4540;\">arácnido pequeño (gran , "Sandtaker appears at fixed positions in battle.", "El sepultador de las arenas aparece en posiciones fijas durante la batalla.", "", ""], ["Difficulty_mStrategyDesc_7025", "Healing Fly appears at fixed positions in battle.", "El insecto sanador aparece en posiciones fijas durante la batalla.", "", ""], ["Difficulty_mStrategyDesc_7028", "Twisted Sycophant appears at fixed positions in battle.", "El halago malintencionado aparece en posiciones fijas durante la batalla.", "", ""], ["Difficulty_mStrategyDesc_7031", "Thunder Beacon appears at fixed positions in battle.", "El faro del trueno aparece en posiciones fijas durante la batalla.", "", ""], ["Difficulty_mStrategyDesc_7101", "Golden Guard appears randomly on the battlefield each wave.", "El guardia dorado aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "El gólem coloso aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "El esqueleto arquero aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "La sacerdotisa de la lluvia aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "El guardián dorado aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "El inquisidor áureo aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "El escarabajo explosivo aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "El sepultador de las arenas aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "El insecto sanador aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "El halago malintencionado aparece aleatoriamente en el campo de batalla cada oleada.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "(3 piezas) Al ejecutar un golpe crítico con el ataque básico, el daño infligido por el campeón aumenta un 10 % durante 8 segundos. Este efecto puede acumularse hasta 5 veces.", "", ""], ["HeroStory_mStory_2209", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "\"Camina como un recuerdo que jamás me he ganado, pero que siempre añoro\".<br>-Rivenhald<br><br>La enviaron hacia el norte, donde las nieves sobre su frente la plegarían una vez más a su causa.<br><br>Antaño sacerdotisa de Elyndris, Eirlys había oficiado en el corazón de ritos Inmemoriales, su voz entretejida con el aliento mismo de los dioses. Pero algo se quebró. Tomó una decisión que nadie osó nombrar, y el santuario no la perdonaría con facilidad.<br><br>La ciudad élfica pasó meses lamiendo sus heridas tras los fuegos del asalto de Moriden. Aunque la marea del mal había sido repelida, las cicatrices perduraban, y con ellas una revelación aterradora: ya no eran intocables. Sus torres se habían agrietado. Sus mitos habían sangrado. Elyndris necesitaba sombras que se movieran donde las banderas no podían llegar. Así que los videntes miraron hacia afuera. En silencio. Con cautela. Buscando refugios más allá de los mapas antiguos, donde su estirpe pudiera ocultarse si la guerra retornaba.<br><br>El norte de Tya, desolado y frío, se alzó en sus augurios como una hoja emergiendo de la nieve. Conocían a Harz, mas no osaban buscar conflicto con alguien de tal renombre. Rivenhald, sin embargo, gobernaba las regiones gélidas desconocidas para sus exploradores: un Señor de la Guerra en todo salvo el título, un monarca que no se doblegaba ante corona alguna excepto la suya propia. Necesitaban comprenderlo. Saber si su Fuerza podía ser subvertida. O, de ser necesario, cuán fácilmente podría quebrarse.<br><br>Eirlys fue su respuesta. Sin amigos, no era diplomática ni espía, sino algo más silencioso. Fue enviada con medias verdades y un juramento sagrado: gánate su confianza, lee su alma e informa lo que no puede verse desde la distancia. Llegó envuelta en blanco, su presencia explicada como pacificación. Una sanadora errante. Una sacerdotisa de escarcha. Y Rivenhald, que no confiaba en nadie, confió en ella.<br><br>Se hizo indispensable. Atendió heridas, tradujo presagios, no dejó rastro de motivos ocultos. Él observaba. Ella le sostenía la mirada. Ninguno parpadeó.<br><br>Las fronteras entre ambos se difuminaron con el tiempo, enredándose pero manteniéndose firmes. Llegó a conocer sus silencios, la forma de su ira, la extraña piedad que enterraba bajo todo aquello. Por las noches, cuando el fuego ardía tenue y no se podían enviar mensajes, a veces vislumbraba un futuro donde él casi merecería confianza, donde podría significar algo más para ella... pero el amanecer siempre incineraba la ensoñación.<br><br>Como Rivenhald, ella también sueña con el final: dos siluetas en la nieve, Inquebrantables e inflexibles. Una hoja debe caer. Una causa debe desvanecerse. Y en la niebla de sangre, antes de que el viento se lo lleve todo, comprenderán el precio de la supervivencia... y quiénes son verdaderamente el uno para el otro.<br><br>Pero Eirlys sabe lo que los videntes de Elyndris nunca le confesaron. El norte no pertenece a nadie. Ni a reyes. Ni a ciudades. Y desde luego, no a fantasmas como ella. Sea cual sea el futuro que les aguarde, no se construirá sobre la confianza, sino sobre lo que perdure después de que esta se haya desvanecido.<br><br>Ella es el silencio entre dos tormentas, aguardando la hora en que una debe quebrar a la otra.", "", ""], ["HeroStory_mStory_2321", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "\"Suplicarás ser devorado. Y seré misericordiosa\".<br>—Susurrado desde el follaje<br><br>En las selvas de jade de Tya, donde las raíces beben sangre y los árboles estrangulan a los vivos, una vez se deslizó un espíritu de veneno y sombra: una serpiente conocida solo en susurros como Sythra, aunque en aquellos días no poseía carne propia. Solo colmillos, hambre y el recuerdo de un nombre.<br><br>El Imperio Escamado, una civilización inmemorial cuyas ciudades de obsidiana una vez dividieron el dosel y los valles, se había desvanecido hacía tiempo en la expansión verdosa. Sin embargo, en su hora final, vertieron su última magia en ídolos imponentes: estatuas de criaturas poderosas talladas con devoción, untadas en ocre y ceniza, dejadas como ofrendas a los espíritus de la selva, con la esperanza de que sus súplicas fueran respondidas.<br><br>Pero solo hubo silencio.<br><br>Mientras la metrópolis se desmoronaba, engullida por la arremetida del follaje, estos ídolos perduraron: velados en musgo, medio consumidos, pero vivos con ecos inquietos. En efecto, los espíritus moraban dentro de estas figurillas, almas de los vivos ofrecidas como regalos a los espíritus de la selva, encadenadas por la hechicería escamada. Los infortunados y desprevenidos vagabundos de este laberinto frondoso que se topaban con tales figurillas encontraban un rápido final, pues eran en realidad altares sacrificiales, capaces de invocar a poderosas deidades. Sythra era una de esas deidades, una diosa serpentina y vestigio del antiguo imperio, un siseo que se enroscaba en las mentes de los débiles de voluntad y los heridos.<br><br>Y sin embargo, permaneció siendo solo espíritu... hasta que Dassomi la encontró.<br><br>El célebre místico escamado había creído durante mucho tiempo que los sueños eran un puente hacia verdades superiores. Buscando sabiduría perdida en rincones olvidados del mundo, Dassomi llegó a la selva, siguiendo visiones de serpientes y altares, atraído hacia un templo cubierto de vegetación como un sueño profundo medio recordado. Allí, en el corazón de aquella ruina, quemó incienso y se deslizó entre mundos... y Sythra respondió.<br><br>Sin embargo, no quedan registros de lo que sucedió entre ellos. Ya fuera que Dassomi se hubiera ofrecido a sí mismo, o simplemente abierto un portal demasiado amplio, el resultado fue el mismo: Sythra se despojó de su inmaterialidad y renació en el mundo. El Abrazo de la Serpiente fue reanimado.<br><br>Obedeciendo la ley de la selva, Sythra caza a todos aquellos que reclaman superioridad: los justos, los puros, los inquebrantables. Se desliza en sus templos y palacios, ofreciéndoles una última elección: someterse... o ser devorados. Sythra aspira a ver su dinastía serpentina alzarse de nuevo, colmilluda y gloriosa, coronada en selva y hueso. Sueña con ciudadelas veteadas de hiedra y veneno, con un mundo donde todos los que caminen sobre él se hayan despojado de la debilidad, bebido profundamente de su veneno y emergido hermosos en el sufrimiento.<br><br>Hoy, Sythra sigue siendo venerada, aunque sus cultos están dispersos y son secretos, algunos dicen que dirigidos por el propio Dassomi. Se marcan con colmillos, dejan que el veneno se deslice sobre sus lenguas y sueñan con el éxtasis a través del dolor, en una adoración convertida en divina. Rezan para ser elegidos para el festín, pues ser elegido es ser visto, ser cazado, ser amado. Ser besado por la Serpiente es sentir el poder enroscarse alrededor de tu alma, despojarte de la debilidad como si fuera piel y renacer de nuevo. Quienes sobreviven a su mordida se convierten en sus cazadoras: mortíferas, hermosas y completamente devotas.<br><br>Y en ese momento sagrado entre el aliento y la mordida, cuando la flecha se cierne justo sobre el corazón, todos susurrarán lo mismo:<br>\"Gracias\".", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Velo de Nieve", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "El Veneno Más Dulce", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Campeona: Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Campeón: Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaranteed within 200 summons!", "Selecciona un campeón exclusivo del evento para unirse al evento. El campeón exclusivo seleccionado tiene una tasa de aparición aumentada y está garantizado en 200 invocaciones.", "", ""], ["Item_mItemDesc_31097", "<span style=\"color: #eadca2;\">Special Summon Offer</span><br><br>Get the necessary materials for Hero Summon", "<span style=\"color: #eadca2;\">Oferta especial de invocación</span><br><br>Consigue los materiales necesarios para invocar campeones.", "", ""], ["Item_mItemDesc_3334", "<span style=\"color: #498a40;\">Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).</span>", "<span style=\"color: #498a40;\">Marco exclusivo de la clasificación definitiva de \"Llegada de los campeones\" (temporada del Serpentonato).</span>", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen's Clues 1-5.", "Pista desconocida de Erlang Shen. Al obtenerla, se convertirá automáticamente en una aleatoria de las pistas 1-5 de Erlang Shen.", "", ""], ["Item_mItemDesc_3521", "Erlang Shen's Clue 2.<br><span sty . Después de que todas las colas del campo sean derrotadas, la Zorra de las Nueve Colas se transforma e invoca una gran cantidad de zorros.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige daño mágico a la última unidad que entró al campo de batalla, priorizando a los defensores.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige daño mágico a la última unidad que entró al campo de batalla, priorizando a los defensores.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for <span style=\"color: #4A9DF2;\">1</span> ally within the Basic ATK Range and immediately grants this ally a shield equal to <span style=\"color: #4A9DF2;\">{skm1}%</span> of their Max HP for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. The effect can only be triggered 1 time every <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "Evita una vez el daño letal recibido por <span style=\"color: #4A9DF2;\">1</span> aliado dentro del alcance de ataque básico y le otorga de inmediato un escudo equivalente al <span style=\"color: #4A9DF2;\">{skm1} %</span> de su vida máxima durante <span style=\"color: #4A9DF2;\">{skm2}</span> seg. Este efecto solo puede activarse una vez cada <span style=\"color: #4A9DF2;\">{skm3}</span> seg.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals <span style=\"color: #4A9DF2;\">{skm1}%</span> DMG to up to <span style=\"color: #4A9DF2;\">5</span> enemies.", "Inflige un <span style=\"color: #4A9DF2;\">{skm1} %</span> de daño a un máximo de <span style=\"color: #4A9DF2;\">5</span> enemigos.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and gains <span style=\"color: #28d37c;\">[321900]</span>. Grants allies of the same faction Elddr's Talent temporarily. The Ultimate lasts for <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "Aumenta el ataque un <span style=\"color: #4A9DF2;\">{skm1} %</span>, y obtiene \"<span style=\"color: #28d37c;\">[321900]</span>\". Además, otorga temporalmente el efecto del talento de Elddr a los aliados de la misma facción. La habilidad definitiva dura <span style=\"color: #4A9DF2;\">{skm2}</span> seg.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "Aumento de ataque +{sk1} %", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "Aumento de ataque +{sk1} %", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to trigger Thunder Hammer, dealing an extra <span style=\"color: #4A9DF2;\">{skm2}%</span> DMG. If the hero has no shield, Thunder Hammer has a <span style=\"color: #4A9DF2;\">{skm3}%</span> chance to grant a shield equal to <span style=\"color: #4A9DF2;\">{skm4}%</span> ATK.", "El ataque básico tiene un <span style=\"color: #4A9DF2;\">{skm1} %</span> de probabilidad de activar \"Martillo del trueno\", que inflige un <span style=\"color: #4A9DF2;\">{skm2} %</span> de daño adicional. Si el campeón no tiene escudo, \"Martillo del trueno\" tiene un <span style=\"color: #4A9DF2;\">{skm3} %</span> de probabilidad de otorgar un escudo equivalente al <span style=\"color: #4A9DF2;\">{skm4} %</span> del ataque.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies <span style=\"color: #4A9DF2;\">{skm1}%</span> <span style=\"color: #28d37c;\">[310001]</span> to <span style=\"color: #4A9DF2;\">1</span> ally in range.", "Aplica <span style=\"color: #4A9DF2;\">{skm1} %</span> de \"<span style=\"color: #28d37c;\">[310001]</span>\" a <span style=\"color: #4A9DF2;\">1</span> aliado en el alcance.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "Potencia de sanación +{sk1} %", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "Potencia de sanación +{sk1} %", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "Potenci

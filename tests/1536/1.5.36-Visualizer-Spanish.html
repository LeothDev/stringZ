 {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rápidamente a un enemigo dentro del alcance de ataque de su propietario, inicialmente puede disparar {30,num} vez/ces e infligiendo un {31,num} % de daño cada vez. El &quot;Alma atormentada&quot; perece después de usar todos los disparos. Prioriza objetivos voladores. La flecha obtiene un contador de retorno cada vez que golpea a un objetivo caído. Hasta {32,num} pueden existir en el campo.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participa en la incursión de equipo I para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Participa en la incursión de equipo II para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Participa en la incursión de equipo III para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Invoca a los campeones para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes&#x27; skills to win trophies and redeem rewards.", "Sube de nivel o estrellas, asciende a tus campeones o mejora sus habilidades para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Participa en la incursión de artefactos para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participa en la incursión de equipo I para ganar trofeos y canjear recompensas.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Clasificación definitiva de &quot;Llegada de los campeones&quot;", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "El legado perdido", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Bóveda en las arenas", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "El palacio olvidado", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Llegada de los campeones", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Entrenamiento de campeón", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Misterio de artefactos", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "El legado perdido", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Capítulo de la historia", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Capítulo de desafío", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "Propiedad intelectual de dominio público", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Invasión zombi", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Cambiando de canal...", "", ""], ["CommonText_mMessage_24292", "Challenges", "Desafíos", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;Piedras clave de prueba&lt;/color&gt;\\nLas piedras clave de prueba se pueden obtener en varios modos de juego. Estas piedras clave son de diferentes tipos y niveles, y cada una contiene inscripciones inmemoriales únicas. Insértalas en el altar para abrir caminos hacia sus pruebas correspondientes.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Reglas de desafío&lt;/color&gt;\\nCada batalla consiste en múltiples oleadas de monstruos. Derrotar cada oleada te recompensa con un cofre del tesoro. Una vez que comienza una batalla, no se puede reiniciar. Si sales a mitad de camino, las recompensas se calcularán según tu progreso actual de batalla. Puedes consumir hasta 200 piedras clave al mes para desafíos de prueba. Una vez alcanzado este límite, no se podrán emprender más desafíos ese mes.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Energía de piedra clave&lt;/color&gt;\\nCada piedra clave posee energía específica. &lt;color=&quot;#fdbe36&quot;&gt;Se consume un punto de energía por intento de prueba.&lt;/color&gt; Cuando termina la batalla, si la piedra clave todavía tiene energía restante, puedes elegir renunciar a las recompensas y marcharte, luego consumir energía de nuevo para reiniciar la prueba. El consumo de energía no cuenta hacia el límite mensual de piedras clave.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destruir piedra clave&lt;/color&gt;\\nPuedes destruir piedras clave que cumplan los requisitos de nivel de destrucción. Destruir piedras clave no otorga recompensas y no cuenta hacia el límite mensual de consumo de piedras clave.\\n&lt;color=&quot;#fd4540&quot;&gt;Las piedras clave de prueba tienen un límite de inventario. Una vez lleno, no podrás obtener más piedras clave. Úsalas regularmente para mantener espacio disponible.&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Placa musgosa", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Placa ígnea", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Una vez que comience la batalla, no podrás reiniciarla. ¡Si sales durante el combate, se realizará la liquidación inmediata y no se te devolverá la energía consumida!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Una región volcánica donde la lava se alza durante el Apocalipsis. Se necesitan más campeones de plataforma para defenderse de las fuerzas malignas apocalípticas.", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;¿Estás seguro de que quieres despedir a este jugador del puesto de mariscal?&lt;/color&gt;\\nCada clan puede tener hasta {num1} mariscales, cada uno obteniendo {num2} ataque/s adicional/es por ronda.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Puntos de la ronda", "", ""], ["CommonText_mMessage_26126", "Destroy", "Destruir", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "¿Proceder a destruir {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Las piedras clave destruidas no pueden recuperarse y no otorgarán ningún objeto.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "La piedra clave ha sido destruida.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Energía:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Rendirse y salir", "", ""], ["CommonText_mMessage_26131", "Claim", "Recoger", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Energía de piedra clave restante:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Galería de batallas", "", ""], ["CommonText_mMessage_26134", "Guides", "Guías", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Piedra clave que aparece:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Placa musgosa", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Placa ígnea", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Mostrar únicamente las etiquetas de la piedra clave actual", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Los campeones más populares se calculan según el índice de selección de campeones, solo como referencia.", "", ""], ["CommonText_mMessage_26140", "Search", "Buscar", "", ""], ["Common ou like to open them now?", "Se han detectado cofres de piedra clave aleatorios sin abrir en tu inventario. ¿Te gustaría abrirlos ahora?", "", ""], ["CommonText_mMessage_26154", "Go", "Ir", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Niv. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level&#x27;s Keystone cannot be destroyed.", "La piedra clave de este nivel no puede ser destruida.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Keystone(s)?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "¿Estás seguro de que quieres destruir &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; piedra(s) clave?\\n&lt;color=&quot;#fd4540&quot;&gt;Las piedras clave destruidas no pueden recuperarse y no otorgarán ningún objeto.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "Se destruyeron {num} piedra/s clave.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Uso mensual:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Las piedras clave tienen un límite mensual de desafío. No se permiten más intentos después de alcanzar el límite.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?\\n&lt;color=&quot;#e04242&quot;&gt;During the event, you can only choose one difficulty per day to claim rewards.&lt;/color&gt;", "La dificultad actual tiene recompensas disponibles para recoger. ¿Estás seguro de que quieres probar una dificultad diferente?\\n&lt;color=&quot;#e04242&quot;&gt;Durante el evento, solo puedes elegir una dificultad por día para recoger recompensas.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26162", "Don&#x27;t remind me again.", "No volver a recordármelo.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "El inventario de piedras clave está lleno. Usa algunas primero antes de desbloquear.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "La versión de la repetición no coincide con la versión actual y no se puede visualizar.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Introduce hasta {num} carácter/es.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Campeones populares", "", ""], ["CommonText_mMessage_26167", "Tag", "Etiqueta", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Inventario de piedras clave de prueba lleno", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater&#x27;s Movement Spd. by 30. They are &lt;color=&quot;#fd4540&quot;&gt;immune to Slow&lt;/color&gt;.", "Reduce la velocidad de movimiento del devorador de almas en 30. Es &lt;color=&quot;#fd4540&quot;&gt;inmune a ralentización&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73003", "White Tower&#x27;s Scholar enters &lt;color=&quot;#fd4540&quot;&gt;Invisibility&lt;/color&gt; and becomes visible when blocked.", "El erudito de la torre blanca entra en estado de &lt;color=&quot;#fd4540&quot;&gt;invisibilidad&lt;/color&gt; y se vuelve visible cuando es bloqueado.", "", ""], ["Difficulty_mDetail_73004", "White Tower&#x27;s Scholar becomes &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "El erudito de la torre blanca se vuelve &lt;color=&quot;#fd4540&quot;&gt;inmune al daño mágico&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains &lt;color=&quot;#fd4540&quot;&gt;unyielding effect&lt;/color&gt; for 3 sec upon death and becomes &lt;color=&quot;#fd4540&quot;&gt;immune to Control and Slow&lt;/color&gt;.", "El arácnido pequeño obtiene el &lt;color=&quot;#fd4540&quot;&gt;efecto inquebrantable&lt;/color&gt; durante 3 segundos tras morir y se vuelve &lt;color=&quot;#fd4540&quot;&gt;inmune al control y a la ralentización&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 5 sec.", "El arácnido pequeño &lt;color=&quot;#fd4540&quot;&gt;recupera un 50 % de vida&lt;/color&gt; cada 5 segundos.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "La &lt;color=&quot;#fd4540&quot;&gt;velocidad de movimiento del guardián del relámpago se incrementa en 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is &lt;color=&quot;#fd4540&quot;&gt;immune to DMG taken&lt;/color&gt;, but loses 5% HP per sec.", "El guardián del relámpago es &lt;color=&quot;#fd4540&quot;&gt;inmune al daño recibido&lt;/color&gt;, pero pierde un 5 % de vida por seg.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace&#x27;s Fatigue becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "La fatiga de la amenaza asesina se vuelve &lt;color=&quot;#fd4540&quot;&gt;permanente&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is &lt;color=&quot;#fd4540&quot;&gt;immune to CC Effects&lt;/color&gt;.", "El komodo acorazado es &lt;color=&quot;#fd4540&quot;&gt;inmune a los efectos de control&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction &lt;color=&quot;#fd4540&quot;&gt;when blocked&lt;/color&gt;.", "El komodo acorazado obtiene un 30 % adicional de reducción de daño físico y mágico &lt;color=&quot;#fd4540&quot;&gt;cuando es bloqueado&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;summons an extra&lt;/color&gt; Ice Vermin.", "El clérigo congelado &lt;color=&quot;#fd4540&quot;&gt;invoca una&lt;/color&gt; alimaña de hielo adicional.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;spawns&lt;/color&gt; 3 Ice Vermin &lt;color=&quot;#fd4540&quot;&gt;upon death&lt;/color&gt;.", "El clérigo congelado &lt;color=&quot;#fd4540&quot;&gt;invoca&lt;/color&gt; 3 alimañas de hielo &lt;color=&quot;#fd4540&quot;&gt;al morir&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. +50&lt;/color&gt;.", "El guardián del trueno deja de atacar y obtiene &lt;color=&quot;#fd4540&quot;&gt;+50 de velocidad de movimiento&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;ATK is increased by 100%&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;when attacking shields&lt;/color&gt;, deducts 50% of its HP.", "El &lt;color=&quot;#fd4540&quot;&gt;ataque del guardián del trueno se incrementa en un 100 %&lt;/color&gt;, pero &lt;color=&quot;#fd4540&quot;&gt;al atacar escudos&lt;/color&gt;, pierde un 50 % de su vida.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "El tuerto de la neblina es &lt;color=&quot;#fd4540&quot;&gt;inmune al daño mágico&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores &lt;color=&quot;#fd4540&quot;&gt;10% HP&lt;/color&gt; with each ATK.", "Niebla: Barón Salem restaura un &lt;color=&quot;#fd4540&quot;&gt;10 % de vida&lt;/color&gt; con cada ataque.", "", ""], ["Difficulty_mDetail_73018", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;Cooldown is reduced by 100%&lt;/color&gt;.", "El tiempo de recarga de la incubación acelerada del incubador &lt;color=&quot;#fd4540&quot;&gt;se reduce en un 100 %&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73019", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;spawns 2 extra Suicides&lt;/color&gt;.", "La incubación acelerada del incubador &lt;color=&quot;#fd4540&quot;&gt;genera 2 escarabajos explosivos adicionales&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;drains 10% of the target&#x27;s Rage&lt;/color&gt;.", "Al infligir daño a un objetivo, el sacerdote del trueno &lt;color=&quot;#fd4540&quot;&gt;drena un 10 % de la furia del objetivo&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;permanently reduces their Max HP by 10%&lt;/color&gt;. This effect can be stacked.", "Al infligir daño a un objetivo, el sacerdote del trueno &lt;color=&quot;#fd4540&quot;&gt;reduce permanentemente su vida máxima en un 10 %&lt;/color&gt;. Este efecto se puede acumular.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces &lt;color=&quot;#fd4540&quot;&gt;healing&lt;/color&gt; received by &lt;color=&quot;#fd4540&quot;&gt;all units in range&lt;/color&gt; by 50%.", "El flagelo reduce la &lt;color=&quot;#fd4540&quot;&gt;sanación&lt;/color&gt; recibida por &lt;color=&quot;#fd4540&quot;&gt;todas las unidades en alcance&lt;/color&gt; en un 50 %.", "", ""], ["Difficulty_mDetail_73023", "Scourge&#x27;s DMG range expands to &lt;color=&quot;#fd4540&quot;&gt;adjacent 2 tiles&lt;/color&gt;.", "El alcance de daño del flagelo se expande a &lt;color=&quot;#fd4540&quot;&gt;2 casillas adyacentes&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to &lt;color=&quot;#fd4540&quot;&gt;blocked targets&lt;/color&gt;.", "Cuando niebla: observador abisal superior muere, inflige daño mágico equivalente al 100 % del ataque a los &lt;color=&quot;#fd4540&quot;&gt;objetivos bloqueados&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes &lt;color=&quot;#fd4540&quot;&gt;unblockable&lt;/color&gt;.", "El roedor mutante rabioso se vuelve &lt;color=&quot;#fd4540&quot;&gt;inbloqueable&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent &lt;color=&quot;#fd4540&quot;&gt;increases Movement Spd. by 30&lt;/color&gt;.", "El roedor mutante rabioso &lt;color=&quot;#fd4540&quot;&gt;aumenta la velocidad de movimiento en 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "Por cada 20 % de vida que pierde el Barón Salem, &lt;color=&quot;#fd4540&quot;&gt;obtiene un 20 % de defensa y resistencia mágica&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "La &lt;color=&quot;#fd4540&quot;&gt;velocidad de movimiento del manipulador de sombras se incrementa en 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "Por cada 20 % de vida que pierde el manipulador de sombras, &lt;color=&quot;#fd4540&quot;&gt;obtiene un 20 % de defensa y resistencia mágica&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers&#x27; DEF and M. RES. by 30%. &lt;color=&quot;#fd4540&quot;&gt;When under CC Effects, reduces by 50%&lt;/color&gt;.", "Aumenta la defensa y resistencia mágica de los destructores comunes en un 30 %. &lt;color=&quot;#fd4540&quot;&gt;Cuando están bajo efectos de control, se reduce en un 50 %&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when &lt;color=&quot;#fd4540&quot;&gt;stunned or frozen&lt;/color&gt;.", "El destructor común es inmune al daño cuando está &lt;color=&quot;#fd4540&quot;&gt;aturdido o congelado&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an &lt;color=&quot;#fd4540&quot;&gt;initial Hitcount Shield&lt;/color&gt;.", "El destructor poco común obtiene un &lt;color=&quot;#fd4540&quot;&gt;escudo de golpes inicial&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer &lt;color=&quot;#fd4540&quot;&gt;gains 5 Movement Spd. each time taking DMG&lt;/color&gt;.", "El destructor poco común &lt;color=&quot;#fd4540&quot;&gt;obtiene 5 de velocidad de movimiento cada vez que recibe daño.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee&#x27;s Ultrasonic Wave &lt;color=&quot;#fd4540&quot;&gt;DMG increases by 100%&lt;/color&gt; and does not inflict Poison.", "El daño de la onda ultrasónica de la banshee alada &lt;color=&quot;#fd4540&quot;&gt;aumenta en un 100 %&lt;/color&gt; y no aplica envenenamiento.", "", ""], ["Difficulty_mDetail_73035", "Batwings Banshee&#x27;s Poison effect becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "El efecto de envenenamiento de la banshee alada se vuelve &lt;color=&quot;#fd4540&quot;&gt;permanente&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73036", "Golden Guard &lt;color=&quot;#fd4540&quot;&gt;forcibly removes targets&lt;/color&gt; upon collision.", "El guardia dorado &lt;color=&quot;#fd4540&quot;&gt;expulsa por la fuerza a los objetivos&lt;/color&gt; al colisionar contra ellos.", "", ""], ["Difficulty_mDetail_73037", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 15 sec.", "El destructor supremo &lt;color=&quot;#fd4540&quot;&gt;recupera el 50 % de vida&lt;/color&gt; cada 15 seg.", "", ""], ["Difficulty_mDetail_73038", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. increases by 50&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;loses 3% HP&lt;/color&gt; per sec.", "La &lt;color=&quot;#fd4540&quot;&gt;velocidad de movimiento del destructor supremo aumenta en 50&lt;/color&gt;, pero &lt;color=&quot;#fd4540&quot;&gt;pierde un 3 % de vida&lt;/color&gt; por seg.", "", ""], ["Difficulty_mDetail_73039", "Smasher Guard&#x27;s ATK will &lt;color=&quot;#fd4540&quot;&gt;forcibly remove targets&lt;/color&gt;.", "El ataque del guardia devastador &lt;color=&quot;#fd4540&quot;&gt;eliminará forzosamente a los objetivos&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73040", "When losing 80% HP, Smasher Guard will fall into Petrification for 15 sec, gaining &lt;color=&quot;#fd4540&quot;&gt;massive DMG Reduction&lt;/color&gt; and continuously &lt;color=&quot;#fd4540&quot;&gt;restoring HP&lt;/color&gt; during Petrification.", "Al perder el 80 % de vida, el guardia devastador entra en petrificación durante 15 seg., obteniendo &lt;color=&quot;#fd4540&quot;&gt;una reducción de daño masiva&lt;/color&gt; y &lt;color=&quot;#fd4540&quot;&gt;recuperando vida&lt;/color&gt; continuamente durante la petrificación.", "", ""], ["Difficulty_mDetail_74001", "Jungle Master&#x27;s Basic ATK hits &lt;color=&quot;#fd4540&quot;&gt;5&lt;/color&gt; enemy targets each time.", "El ataque básico de la custodia de la jungla golpea a &lt;color=&quot;#fd4540&quot;&gt;5&lt;/color&gt; objetivos enemigos cada vez.", "", ""], ["Difficulty_mDetail_74002", "While Jungle Master is on the battlefield, restores &lt;color=&quot;#fd4540&quot;&gt;50% HP to all enemies&lt;/color&gt; on the battlefield every 10 sec.", "Mientras la custodia de la jungla esté en el campo de batalla, restaura &lt;color=&quot;#fd4540&quot;&gt;el 50 % de vida a todos los enemigos&lt;/color&gt; del campo de batalla cada 10 seg.", "", ""], ["Difficulty_mDetail_74003", "When Jungle Master dies, all enemies on the battlefield gain &lt;color=&quot;#fd4540&quot;&gt;Invincibility for 10 sec&lt;/color&gt;.", "Cuando la custodia de la jungla muere, todos los enemigos del campo de batalla obtienen &lt;color=&quot;#fd4540&quot;&gt;invencibilidad durante 10 seg.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_74004", "Enemies &lt;color=&quot;#fd4540&quot;&gt;adjacent&lt;/color&gt; to Jungle Master gain &lt;color=&quot;#fd4540&quot;&gt;25% HP Regen per sec&lt;/color&gt;.", "Los enemigos &lt;color=&quot;#fd4540&quot;&gt;adyacentes&lt;/color&gt; a la custodia de la jungla nThey sent her north, where the snows upon her brow might bend her once more to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "&quot;Camina como un recuerdo que jamás me he ganado, pero que siempre añoro&quot;.\\n-Rivenhald\\n\\nLa enviaron hacia el norte, donde las nieves sobre su frente la plegarían una vez más a su causa.\\n\\nAntaño sacerdotisa de Elyndris, Eirlys había oficiado en el corazón de ritos Inmemoriales, su voz entretejida con el aliento mismo de los dioses. Pero algo se quebró. Tomó una decisión que nadie osó nombrar, y el santuario no la perdonaría con facilidad.\\n\\nLa ciudad élfica pasó meses lamiendo sus heridas tras los fuegos del asalto de Moriden. Aunque la marea del mal había sido repelida, las cicatrices perduraban, y con ellas una revelación aterradora: ya no eran intocables. Sus torres se habían agrietado. Sus mitos habían sangrado. Elyndris necesitaba sombras que se movieran donde las banderas no podían llegar. Así que los videntes miraron hacia afuera. En silencio. Con cautela. Buscando refugios más allá de los mapas antiguos, donde su estirpe pudiera ocultarse si la guerra retornaba.\\n\\nEl norte de Tya, desolado y frío, se alzó en sus augurios como una hoja emergiendo de la nieve. Conocían a Harz, mas no osaban buscar conflicto con alguien de tal renombre. Rivenhald, sin embargo, gobernaba las regiones gélidas desconocidas para sus exploradores: un Señor de la Guerra en todo salvo el título, un monarca que no se doblegaba ante corona alguna excepto la suya propia. Necesitaban comprenderlo. Saber si su Fuerza podía ser subvertida. O, de ser necesario, cuán fácilmente podría quebrarse.\\n\\nEirlys fue su respuesta. Sin amigos, no era diplomática ni espía, sino algo más silencioso. Fue enviada con medias verdades y un juramento sagrado: gánate su confianza, lee su alma e informa lo que no puede verse desde la distancia. Llegó envuelta en blanco, su presencia explicada como pacificación. Una sanadora errante. Una sacerdotisa de escarcha. Y Rivenhald, que no confiaba en nadie, confió en ella.\\n\\nSe hizo indispensable. Atendió heridas, tradujo presagios, no dejó rastro de motivos ocultos. Él observaba. Ella le sostenía la mirada. Ninguno parpadeó.\\n\\nLas fronteras entre ambos se difuminaron con el tiempo, enredándose pero manteniéndose firmes. Llegó a conocer sus silencios, la forma de su ira, la extraña piedad que enterraba bajo todo aquello. Por las noches, cuando el fuego ardía tenue y no se podían enviar mensajes, a veces vislumbraba un futuro donde él casi merecería confianza, donde podría significar algo más para ella... pero el amanecer siempre incineraba la ensoñación.\\n\\nComo Rivenhald, ella también sueña con el final: dos siluetas en la nieve, Inquebrantables e inflexibles. Una hoja debe caer. Una causa debe desvanecerse. Y en la niebla de sangre, antes de que el viento se lo lleve todo, comprenderán el precio de la supervivencia... y quiénes son verdaderamente el uno para el otro.\\n\\nPero Eirlys sabe lo que los videntes de Elyndris nunca le confesaron. El norte no pertenece a nadie. Ni a reyes. Ni a ciudades. Y desde luego, no a fantasmas como ella. Sea cual sea el futuro que les aguarde, no se construirá sobre la confianza, sino sobre lo que perdure después de que esta se haya desvanecido.\\n\\nElla es el silencio entre dos tormentas, aguardando la hora en que una debe quebrar a la otra.", "", ""], ["HeroStory_mStory_2321", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "&quot;Suplicarás ser devorado. Y seré misericordiosa&quot;.\\n—Susurrado desde el follaje\\n\\nEn las selvas de jade de Tya, donde las raíces beben sangre y los árboles estrangulan a los vivos, una vez se deslizó un espíritu de veneno y sombra: una serpiente conocida solo en susurros como Sythra, aunque en aquellos días no poseía carne propia. Solo colmillos, hambre y el recuerdo de un nombre.\\n\\nEl Imperio Escamado, una civilización inmemorial cuyas ciudades de obsidiana una vez dividieron el dosel y los valles, se había desvanecido hacía tiempo en la expansión verdosa. Sin embargo, en su hora final, vertieron su última magia en ídolos imponentes: estatuas de criaturas poderosas talladas con devoción, untadas en ocre y ceniza, dejadas como ofrendas a los espíritus de la selva, con la esperanza de que sus súplicas fueran respondidas.\\n\\nPero solo hubo silencio.\\n\\nMientras la metrópolis se desmoronaba, engullida por la arremetida del follaje, estos ídolos perduraron: velados en musgo, medio consumidos, pero vivos con ecos inquietos. En efecto, los espíritus moraban dentro de estas figurillas, almas de los vivos ofrecidas como regalos a los espíritus de la selva, encadenadas por la hechicería escamada. Los infortunados y desprevenidos vagabundos de este laberinto frondoso que se topaban con tales figurillas encontraban un rápido final, pues eran en realidad altares sacrificiales, capaces de invocar a poderosas deidades. Sythra era una de esas deidades, una diosa serpentina y vestigio del antiguo imperio, un siseo que se enroscaba en las mentes de los débiles de voluntad y los heridos.\\n\\nY sin embargo, permaneció siendo solo espíritu... hasta que Dassomi la encontró.\\n\\nEl célebre místico escamado había creído durante mucho tiempo que los sueños eran un puente hacia verdades superiores. Buscando sabiduría perdida en rincones olvidados del mundo, Dassomi llegó a la selva, siguiendo visiones de serpientes y altares, atraído hacia un templo cubierto de vegetación como un sueño profundo medio recordado. Allí, en el corazón de aquella ruina, quemó incienso y se deslizó entre mundos... y Sythra respondió.\\n\\nSin embargo, no quedan registros de lo que sucedió entre ellos. Ya fuera que Dassomi se hubiera ofrecido a sí mismo, o simplemente abierto un portal demasiado amplio, el resultado fue el mismo: Sythra se despojó de su inmaterialidad y renació en el mundo. El Abrazo de la Serpiente fue reanimado.\\n\\nObedeciendo la ley de la selva, Sythra caza a todos aquellos que reclaman superioridad: los justos, los puros, los inquebrantables. Se desliza en sus templos y palacios, ofreciéndoles una última elección: someterse... o ser devorados. Sythra aspira a ver su dinastía serpentina alzarse de nuevo, colmilluda y gloriosa, coronada en selva y hueso. Sueña con ciudadelas veteadas de hiedra y veneno, con un mundo donde todos los que caminen sobre él se hayan despojado de la debilidad, bebido profundamente de su veneno y emergido hermosos en el sufrimiento.\\n\\nHoy, Sythra sigue siendo venerada, aunque sus cultos están dispersos y son secretos, algunos dicen que dirigidos por el propio Dassomi. Se marcan con colmillos, dejan que el veneno se deslice sobre sus lenguas y sueñan con el éxtasis a través del dolor, en una adoración convertida en divina. Rezan para ser elegidos para el festín, pues ser elegido es ser visto, ser cazado, ser amado. Ser besado por la Serpiente es sentir el poder enroscarse alrededor de tu alma, despojarte de la debilidad como si fuera piel y renacer de nuevo. Quienes sobreviven a su mordida se convierten en sus cazadoras: mortíferas, hermosas y completamente devotas.\\n\\nY en ese momento sagrado entre el aliento y la mordida, cuando la flecha se cierne justo sobre el corazón, todos susurrarán lo mismo:\\n&quot;Gracias&quot;.", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Velo de Nieve", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "El Veneno Más Dulce", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Campeona: Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Campeón: Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "Selecciona un campeón exclusivo del evento para unirse al evento. El campeón exclusivo seleccionado tiene una tasa de aparición aumentada y está garantizado en 200 invocaciones.", "", ""], ["Ite al DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Cuando la Zorra de las Nueve Colas recibe daño letal, huye del campo de batalla y activa las colas del campo para atacar. Cuando las colas son derrotadas, la Zorra de las Nueve Colas regresa al campo de batalla. Después de que todas las colas del campo sean derrotadas, la Zorra de las Nueve Colas se transforma e invoca una gran cantidad de zorros.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige daño mágico a la última unidad que entró al campo de batalla, priorizando a los defensores.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige daño mágico a la última unidad que entró al campo de batalla, priorizando a los defensores.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally within the Basic ATK Range and immediately grants this ally a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; of their Max HP for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec. The effect can only be triggered 1 time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "Evita una vez el daño letal recibido por &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; aliado dentro del alcance de ataque básico y le otorga de inmediato un escudo equivalente al &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt; de su vida máxima durante &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; seg. Este efecto solo puede activarse una vez cada &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; seg.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG to up to &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; enemies.", "Inflige un &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt; de daño a un máximo de &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; enemigos.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, and gains &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Grants allies of the same faction Elddr&#x27;s Talent temporarily. The Ultimate lasts for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "Aumenta el ataque un &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt;, y obtiene &quot;&lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;&quot;. Además, otorga temporalmente el efecto del talento de Elddr a los aliados de la misma facción. La habilidad definitiva dura &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; seg.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "Aumento de ataque +{sk1} %", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "Aumento de ataque +{sk1} %", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; chance to trigger Thunder Hammer, dealing an extra &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; DMG. If the hero has no shield, Thunder Hammer has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; chance to grant a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; ATK.", "El ataque básico tiene un &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt; de probabilidad de activar &quot;Martillo del trueno&quot;, que inflige un &lt;color=&quot;#4A9DF2&quot;&gt;{skm2} %&lt;/color&gt; de daño adicional. Si el campeón no tiene escudo, &quot;Martillo del trueno&quot; tiene un &lt;color=&quot;#4A9DF2&quot;&gt;{skm3} %&lt;/color&gt; de probabilidad de otorgar un escudo equivalente al &lt;color=&qu

2;\">{skm3} %</span> de daño y aplica \"<span style=\"color: #fd4540;\">[200052,param15]</span>\" al objetivo.", "", ""], ["Skill_mSkillSimpleDesc_232150_1", "When a unit retreats, dies, or the hero's summon perishes in range, her ATK increases by <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. Her next Basic ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target. If triggered when the hero's HP is below <span style=\"color: #4A9DF2;\">{skm4}%</span>, the duration is extended by <span style=\"color: #4A9DF2;\">{skm5}</span> sec, and the ATK Increase is raised to <span style=\"color: #4A9DF2;\">{skm6}%</span>.", "Cuando una unidad se retira, muere, o la invocación de la campeona perece en el alcance, su ataque aumenta en <span style=\"color: #4A9DF2;\">{skm1} %</span> durante <span style=\"color: #4A9DF2;\">{skm2}</span> seg. Su próximo ataque básico inflige <span style=\"color: #4A9DF2;\">{skm3} %</span> de daño y aplica \"<span style=\"color: #fd4540;\">[200052,param15]</span>\" al objetivo. Si se activa cuando la vida de la campeona está por debajo del <span style=\"color: #4A9DF2;\">{skm4} %</span>, la duración se extiende en <span style=\"color: #4A9DF2;\">{skm5}</span> seg., y el aumento de ataque se eleva al <span style=\"color: #4A9DF2;\">{skm6} %</span>.", "", ""], ["Skill_mSkillSimpleDesc_232160_1", "<span style=\"color: #28d37c;\">[23211,1]</span>'s ATK has a(n) <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to increase the number of shots by <span style=\"color: #4A9DF2;\">{skm2}</span>. Killing a target can increase it by <span style=\"color: #4A9DF2;\">{skm3}</span> time(s).", "El ataque de \"<span style=\"color: #28d37c;\">[23211,1]</span>\" tiene un <span style=\"color: #4A9DF2;\">{skm1} %</span> de probabilidad de aumentar el número de disparos en <span style=\"color: #4A9DF2;\">{skm2}</span>. Eliminar un objetivo puede aumentarlo <span style=\"color: #4A9DF2;\">{skm3}</span> vez/ces.", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero's DMG by <span style=\"color: #4A9DF2;\">{skm1}%</span>, with an additional <span style=\"color: #4A9DF2;\">{skm2}%</span> against Elite and Boss units, lasting for <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "Cuando se activa el talento, aumenta el daño de la campeona un <span style=\"color: #4A9DF2;\">{skm1} %</span>, con un <span style=\"color: #4A9DF2;\">{skm2} %</span> adicional contra unidades élite y jefe durante <span style=\"color: #4A9DF2;\">{skm3}</span> seg.", "", ""], ["Skill_mSkillSimpleDesc_232180_1", "Every <span style=\"color: #4A9DF2;\">{skm1}</span> time(s) the hero's Basic ATK deals DMG, it also triggers the Talent effect.", "Cada <span style=\"color: #4A9DF2;\">{skm1}</span> vez/ces que el ataque básico de la campeona inflige daño, también activa el efecto de talento.", "", ""], ["Skill_mSkillSimpleDesc_232198_1", "Increases DMG in the Arena by <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "Aumenta un <span style=\"color: #4A9DF2;\">{skm1} %</span> el daño en la Arena.", "", ""], ["Skill_mSkillSimpleDesc_630614_1", "Jungle Master heals 2 allies at a time.", "La custodia de la jungla sana a 2 aliados a la vez.", "", ""], ["Skin_mSkinName_2209000", "Default", "Por defecto", "", ""], ["Skin_mSkinName_2321000", "Default", "Por defecto", "", ""], ["Stage_mStageDesc_9102013", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Solo puedes enviar al campo de batalla a campeones del Consejo de la Pesadilla.", "", ""], ["Stage_mStageDesc_9102014", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Solo puedes enviar al campo de batalla a campeones del Consejo de la Pesadilla.", "", ""], ["Stage_mStageDesc_9102015", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Solo puedes be_17200", "He mercilessly butchers everything in his path with a massive mace.", "Sacrifica sin piedad todo lo que encuentra en su camino con una enorme maza.", "", ""], ["Unit_mDescribe_17218", "Deals extremely high DMG to the target after charging power.", "Inflige una cantidad de daño extremadamente alta contra su objetivo tras reunir poder.", "", ""], ["Unit_mDescribe_17221", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "Antaño fue un paladín devoto del sol, pero se corrompió por razones desconocidas.", "", ""], ["Unit_mDescribe_17222", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "Antaño fue un paladín devoto del Sol, pero se corrompió por razones desconocidas.", "", ""], ["Unit_mDescribe_34100", "An unblockable spectral remnant immune to Control effects.", "Un remanente espectral imbloqueable inmune a los efectos de control.", "", ""], ["Unit_mDescribe_34102", "Turned from soldiers killed in battle.", "Convertidos a partir de soldados caídos en batalla.", "", ""], ["Unit_mDescribe_34103", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "Se sacrifica voluntariamente por su raza, lo que provoca que estalle al encontrar enemigos e inflija gran daño a los enemigos cercanos.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. <color=#ff4500>Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.</color>", "Mutados y desenfrenados, estos roedores mutantes. <color=#ff4500>Al ser atacados, entran en un frenesí enloquecido, mostrando mayor velocidad de movimiento.</color>", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Esqueletos guerreros con hachas gigantes. El resentimiento hace que sus ataques sean aún más poderosos.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "La reina araña, que teje telarañas con su seda, puede criar numerosas arañas pequeñas y aumentar sus atributos.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Sacrifica sin piedad todo lo que encuentra en su camino con una enorme maza.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Este luchador enloquecido, que vaga por la mazmorra, disfruta cortando cabezas.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Sacrifica sin piedad todo lo que encuentra en su camino con una enorme maza.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Este defensor caníbal y despiadado causa implacables sangrados a sus enemigos con su pinza de hueso.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Este defensor caníbal y despiadado causa implacables sangrados a sus enemigos con su pinza de hueso.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Un remanente espectral que no puede ser bloqueado ni ralentizado, y debe ser eliminado rápidamente.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Convertidos a partir de soldados caídos en batalla.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Llenos de sacos de ácido, los escarabajos explosivos suelen avanzar rodando.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "Mutados y desenfrenados, estos roedores mutantes se mueven más rápido al ser atacados.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Esqueletos guerreros con hachas gigantes. El resentimiento hace que sus ataques sean aún más poderosos.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "La auténtica monarca del mundo subterráneo es capaz de criar arañas pequeñas, controlarlas y aumentar los atributos de todas ellas en la batalla. Su seda es tan resistente que nadie puede liberarse fácilmente de sus telarañas.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team's Rage Regen.", "Eirlys, la sacerdotisa élfica exiliada. Sana heridas graves con oraciones, disipa condiciones negativas, rescata a los aliados del borde de la muerte y acelera la regeneración de furia del equipo.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent's Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "Un vestigio del mundo antiguo, Sythra, El Abrazo de la Serpiente, vaga por la jungla. Invoca almas atormentadas para atacar con ferocidad creciente, ignorando la defensa para devorar a sus enemigos.", "", ""], ["Unit_mHeroDesignation_2209", "Winter's Mercy", "Misericordia Invernal", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent's Embrace", "El Abrazo de la Serpiente", "", ""], ["Unit_mName_17200", "Knight of Destruction", "Caballero de la destrucción", "", ""], ["Unit_mName_17218", "Fallen Chopper", "Cortador caído", "", ""], ["Unit_mName_17219", "Slaughter", "Matanza", "", ""], ["Unit_mName_17221", "Maw", "Fauces", "", ""], ["Unit_mName_17222", "Maw", "Fauces", "", ""], ["Unit_mName_2209", "Eirlys", "Eirlys", "", ""], ["Unit_mName_2321", "Sythra", "Sythra", "", ""], ["Unit_mName_34100", "Soul Eater", "Devorador de almas", "", ""], ["Unit_mName_34103", "Suicide", "Escarabajo explosivo", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "Ejecutor esquelético", "", ""], ["Unit_mName_37114", "Queen Spider", "Reina Araña", "", ""], ["Unit_mName_37115", "Spider Cocoon", "Capullo de araña", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "Permanece a mi lado, y quizás consigas sobrevivir.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "Dime, ¿temes aquello que deseas?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid's Oracle's Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "Durante nuestro evento especial \"El saqueador incansable\", puedes realizar una batalla automática y obtener el doble de recompensas con el doble de consumo de energía. ¡Haz que tus batallas sean más eficientes que nunca!\n\nBonificación de batalla automática\n1. Durante el evento, al usar la batalla automática en {name2}, los Comandantes pueden elegir si activar la bonificación del evento: cada batalla consume {num3} veces la energía normal pero otorga recompensas multiplicadas por {num3}. Esto está diseñado para mejorar la eficiencia en la obtención de materiales.\n2. En caso de que se falle un desafío, se reembolsará la energía correspondiente.\n3. Durante el evento, si la bonificación está activada, las misiones de consumo de energía se calcularán según la energía real consumida.\n4. Sin embargo, las misiones relacionadas con el número de completaciones no se verán afectadas por la bonificación del evento.\n5. La bonificación del evento solo se aplica a las etapas que permiten la batalla automática, por lo que las recompensas por la primera completación no están incluidas en la bonificación de recompensas.\n6. Cuando la bonificación está activada, las recompensas se generarán basándose en cálculos separados, en lugar de duplicar directamente el resultado de uno.\n7. Para el evento \"Conquista valerosa\", la puntuación de la Prueba del Oráculo de la incursión de artefactos es consistente con las obtenciones de equipo/meteorito, calculada según la rareza y cantidad de equipo/meteorito obtenido tras completar las etapas.\n8. Ten en cuenta que durante la bonificación, si las etapas tienen símbolos de evento aleatorios (como los dados en \"Odisea de sueños\"), estos símbolos no se verán afectados por la bonificación.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "\"El saqueador incansable\" ya está disponible en la incursión de artefactos. Durante el evento, realizar batalla automática cuesta el doble de energía, pero también otorga el doble de recompensas.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera & Aylin!", "¡Tasa aumentada por tiempo limitado para campeonas legendarias: Numera y Aylin!", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn & Artemis!", "¡Tasa aumentada por tiempo limitado para los campeones legendarios: Vorn y Artemis!", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx & Malvira!", "¡Tasa aumentada por tiempo limitado para las campeonas legendarias Nyx y Malvira!", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "Paquete de apariencia de \"Serpiente de los sueños\"", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "\"Tya's Champion\" Valkyra", "Valkyra, la Campeona de Tya", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "\"The Hollow Husk\" Aracha", "Aracha, el Caparazón Vacío", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "Paquete de apariencia de Sythra", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "Jugabilidad de la campeona: Eirlys", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "Jugabilidad de la campeona: Sythra", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&amp;X15_Desc_01", "<color=#91887c>In this Divine Summoning event, the drop rates of <color=#fdbe36>all Legendary heroes</color> are <color=#b490fc>2</color> times the original rates, and the drop rates of the following heroes are multiplied by <color=#b490fc>20</color> compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.</color>\n\n<color=#91887c><color=#b3732b>In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.</color> Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by <color=#b490fc>10</color> in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by <color=#b490fc>10</color> again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n<color=#91887c>*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.</color>\n\n<color=#df161f>Note: This Pity Timer triggers ONLY once during this event.</color></color>", "<color=#91887c>En este evento de invocación divina, las tasas de aparición de <color=#fdbe36>todos los campeones legendarios</color> son <color=#b490fc>2</color> veces las tasas originales, y las tasas de aparición de los siguientes campeones se multiplican por <color=#b490fc>20</color> en comparación con otros campeones de la misma rareza. Las tasas de aparición son iguales entre otros campeones de la misma rareza.</color>\n\n<color=#91887c><color=#b3732b>En este evento de invocación, cuando obtengas un campeón legendario que NO esté destacado actualmente como \"tasa aumentada\", la tasa de aparición* de todos los campeones con \"tasa aumentada\" se incrementará adicionalmente en tus siguientes invocaciones.</color> Aquí tienes los detalles:\n1. La primera vez que obtengas un campeón legendario que NO esté destacado como \"tasa aumentada\", la tasa de aparición* de todos los campeones con \"tasa aumentada\" se multiplicará por <color=#b490fc>10</color> en tus siguientes invocaciones;\n2. Si vuelves a obtener un campeón legendario que NO esté destacado como \"tasa aumentada\", la tasa de aparición* de todos los campeones con \"tasa aumentada\" se multiplicará por <color=#b490fc>10</color> de nuevo. Este aumento acumulativo continuará hasta que invoques con éxito a cualquier campeón con \"tasa aumentada\".\n<color=#91887c>*La tasa de aparición mencionada anteriormente se refiere a la probabilidad relativa de los campeones con \"tasa aumentada\" en comparación con otros campeones.</color>\n\n<color=#df161f>Nota: Este temporizador de compasión SOLO se activa una vez durante este evento.</color></color>", "", ""]],
            debounceDelay: 300,
            numberInputTimeout: 3000,
            feedbackTimeout: 1500
        };

        let state = {
            showingRaw: false,
            tableData: config.formattedData,
            dataTable: null,
            currentRowIndex: 0,
            isKeyboardMode: false,
            normalHelpOpen: false,
            zenMode: false,
            zenCurrentIndex: 0,
            zenShowingRaw: false,
            zenHelpOpen: false,
            zenSpacesMode: false,
            numberBuffer: '',
            numberInputTimeout: null,
            originalZenContent: {},
            originalRowContent: {},
            currentRowSpacesMode: false
        };

        const storage = {
            getStateKey: (index) => `state_1.5.36.xlsx Visualizer - Spanish_row_${index}`,
            getNotesKey: (index) => `notes_1.5.36.xlsx Visualizer - Spanish_row_${index}`,
            getState: (index) => localStorage.getItem(storage.getStateKey(index)) || '',
            setState: (index, value) => localStorage.setItem(storage.getStateKey(index), value),
            getNotes: (index) => localStorage.getItem(storage.getNotesKey(index)) || '',
            setNotes: (index, value) => localStorage.setItem(storage.getNotesKey(index), value),
            clearState: (index) => {
                localStorage.removeItem(storage.getStateKey(index));
                localStorage.removeItem(storage.getNotesKey(index));
            }
        };

        const utils = {
            escapeHtml: (text) => text.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
            
            decodeHtml: (html) => {
                const div = document.createElement('div');
                div.innerHTML = html;
                return div.textContent || div.innerText || html;
            },

            isChineseMode: () => config.headers.includes('CN') && config.headers.includes('EN') && config.headers.length >= 6,

            debounce: (func, delay) => {
                let timeout;
                return (...args) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), delay);
                };
            },

            showFeedback: (message, color = '#6c757d', duration = config.feedbackTimeout) => {
                const feedback = $(`<div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: ${color}; color: white; padding: 8px 16px; border-radius: 4px; z-index: 10000;">${message}</div>`);
                $('body').append(feedback);
                setTimeout(() => feedback.fadeOut(300, function() { $(this).remove(); }), duration);
            }
        };

        const dataRenderer = {
            generateRowWithState: (row, idx) => {
                const savedState = storage.getState(idx);
                const savedNotes = storage.getNotes(idx);
                const stateClass = savedState ? savedState.toLowerCase() : '';
                
                const selectHTML = `<select class="state-select ${stateClass}">
                    <option value="" ${savedState === '' ? 'selected' : ''}></option>
                    <option value="Pass" ${savedState === 'Pass' ? 'selected' : ''}>Pass</option>
                    <option value="Fail" ${savedState === 'Fail' ? 'selected' : ''}>Fail</option>
                </select>`;
                
                const notesHTML = `<textarea class="notes-textarea" placeholder="Personal notes..." maxlength="200" rows="2">${utils.escapeHtml(savedNotes)}</textarea>`;

                const newRow = [...row];
                const stateIndex = config.headers.indexOf('State');
                const notesIndex = config.headers.indexOf('Notes');

                if (stateIndex !== -1) newRow[stateIndex + 1] = selectHTML;
                if (notesIndex !== -1) newRow[notesIndex + 1] = notesHTML;
                
                return newRow;
            },

            renderData: (data) => {
                state.tableData = data;
                const transformed = data.map((row, idx) => {
                    const rowWithNumber = [idx + 1, ...row];
                    return dataRenderer.generateRowWithState(rowWithNumber, idx);
                });

                if (!state.dataTable) {
                    dataRenderer.initializeTable(transformed);
                } else {
                    dataRenderer.updateTable(transformed);
                }

                setTimeout(() => {
                    dataRenderer.applyColumnClasses()    
                    if (state.isKeyboardMode) {
                        normal.highlightCurrentRow();
                    }
                }, 100);
            },

            initializeTable: (transformed) => {
                const columnsWithNumber = [{ title: '#' }, ...config.headers.map(h => ({ title: h }))];
                
                state.dataTable = $('#myTable').DataTable({
                    data: transformed,
                    columns: columnsWithNumber,
                    scrollX: true,
                    paging: true,
                    searching: true,
                    ordering: true,
                    deferRender: true,
                    lengthMenu: [[-1, 10, 25, 50, 100], ["All", 10, 25, 50, 100]],
                    pageLength: 100,
                    order: [],
                    autoWidth: false,
                    columnDefs: dataRenderer.getColumnDefs()
                });

                const savedPageLength = localStorage.getItem(`visualizer_page_length_1.5.36.xlsx Visualizer - Spanish`);
                if (savedPageLength) {
                    state.dataTable.page.len(parseInt(savedPageLength)).draw();
                }

                $('#myTable').on('length.dt', function(e, settings, len) {
                    localStorage.setItem(`visualizer_page_length_1.5.36.xlsx Visualizer - Spanish`, len);
                });                

                setTimeout(() => {
                    state.dataTable.columns.adjust().draw();
                }, 50);

                dataRenderer.bindEvents();
            },

            updateTable: (transformed) => {
                const currentPage = state.dataTable.page();
                const currentLength = state.dataTable.page.len();

                const wasKeyboardMode = state.isKeyboardMode;
                const currentRowIndex = state.currentRowIndex;
                
                state.dataTable.clear().rows.add(transformed).draw(false);
                state.dataTable.page.len(currentLength).draw();
                state.dataTable.page(currentPage).draw(false);

                if (wasKeyboardMode) {
                    setTimeout(() => {
                        normal.highlightCurrentRow();
                    }, 100);
                }
            },

            getColumnDefs: () => {
                const totalColumns = config.headers.length + 1;
                const defs = [
                    { targets: 0, width: "50px", className: "text-center" },
                    { targets: 1, width: "80px", className: "text-left" }
                ];

                for (let i = 2; i < totalColumns; i++) {
                    const header = config.headers[i - 1];
                    if (header === "Occurrences") {
                        defs.push({ targets: i, width: "30px", className: "text-center" });
                    } else if (header === "State") {
                        defs.push({ targets: i, width: "40px", className: "text-center", orderable: true });
                    } else if (header === "Notes") {
                        defs.push({ targets: i, width: "80px", className: "text-center" });
                    } else {
                        defs.push({ targets: i, width: "200px", className: "text-left" });
                    }
                }

                return defs;
            },

            bindEvents: () => {
                $('#myTable tbody').on('change', 'select.state-select', function() {
                    const rowIdx = state.dataTable.row($(this).closest('tr')).index();
                    const value = $(this).val();
                    storage.setState(rowIdx, value);
                    $(this).removeClass('pass fail');
                    if (value) $(this).addClass(value.toLowerCase());
                    setTimeout(progressTracker.update, 100);
                });

                const debouncedNotesSave = utils.debounce((rowIdx, value) => {
                    storage.setNotes(rowIdx, value);
                }, config.debounceDelay);

                $('#myTable tbody').on('input', 'textarea.notes-textarea', function() {
                    const rowIdx = state.dataTable.row($(this).closest('tr')).index();
                    const value = $(this).val();
                    debouncedNotesSave(rowIdx, value);
                });

                $('#myTable tbody').on('keydown', 'textarea.notes-textarea', function(e) {
                    if (e.key === 'Enter' && e.ctrlKey) {
                        e.preventDefault();
                        $(this).blur();
                    }
                });

                clipboard.bindCopyEvents();
            },

            applyColumnClasses: () => {
                $('#myTable tbody tr').each(function() {
                    const $row = $(this);
                    const $cells = $row.find('td');
                    $cells.removeClass('text-column occurrences-column state-column notes-column');

                    config.headers.forEach((header, headerIndex) => {
                        const cellIndex = headerIndex + 1;
                        if (cellIndex < $cells.length) {
                            const $cell = $cells.eq(cellIndex);
                            
                            if (['CN', 'EN', 'CNTraditional'].includes(header) || 
                                (!['Occurrences', 'State', 'Notes'].includes(header) && cellIndex >= 2)) {
                                $cell.addClass('text-column');
                            } else if (header === 'Occurrences') {
                                $cell.addClass('occurrences-column');
                            } else if (header === 'State') {
                                $cell.addClass('state-column');
                            } else if (header === 'Notes') {
                                $cell.addClass('notes-column');
                            }
                        }
                    });
                });
            }
        };

        const progressTracker = {
            get: () => {
                const total = state.tableData.length;
                let reviewed = 0, passed = 0, failed = 0;
                
                for (let i = 0; i < total; i++) {
                    const stateValue = storage.getState(i);
                    if (stateValue) {
                        reviewed++;
                        if (stateValue === 'Pass') passed++;
                        if (stateValue === 'Fail') failed++;
                    }
                }
                
                return { total, reviewed, passed, failed };
            },

            update: () => {
                const progress = progressTracker.get();
                const percentage = Math.round((progress.reviewed / progress.total) * 100);
                const banner = document.querySelector('.info-banner p');
                
                if (banner) {
                    const originalParts = banner.textContent.split('•');
                    const baseText = originalParts.slice(0, 4).join('•') + '•';
                    banner.innerHTML = `${baseText} 📊 <strong>${progress.reviewed}/${progress.total}</strong> reviewed (<strong>${percentage}%</strong>) • ✅ <strong>${progress.passed}</strong> passed • ❌ <strong>${progress.failed}</strong> failed`;
                }
            }
        };

        const clipboard = {
            copy: (text, element) => {
                const rowIndex = state.dataTable.row(element).index();
                const cellIndex = $(element).index();
                let rawText = text;
                
                if (!state.showingRaw && config.rawData[rowIndex]) {
                    rawText = config.rawData[rowIndex][cellIndex - 1];
                }

                const decodedText = utils.decodeHtml(rawText);
                navigator.clipboard.writeText(decodedText).then(() => {
                    clipboard.showFeedback(element);
                });
            },

            showFeedback: (element) => {
                const feedback = document.createElement('div');
                feedback.className = 'copy-feedback show';
                feedback.textContent = 'Copied!';
                element.style.position = 'relative';
                element.appendChild(feedback);

                setTimeout(() => {
                    feedback.classList.remove('show');
                    setTimeout(() => {
                        if (feedback.parentNode && document.contains(feedback)) {
                            feedback.parentNode.removeChild(feedback);
                        }
                        $(element).removeClass('copyable-cell');
                    }, 300);
                }, 1000);
            },

            bindCopyEvents: () => {
                $('#myTable tbody').on('mouseenter', 'td:nth-child(2), td.text-column', function() {
                    $(this).addClass('copyable-cell');
                }).on('mouseleave', 'td:nth-child(2), td.text-column', function() {
                    if (!$(this).find('.copy-feedback').length) {
                        $(this).removeClass('copyable-cell');
                    }
                }).on('click', 'td:nth-child(2), td.text-column', function() {
                    const text = $(this).text().trim();
                    if (text) clipboard.copy(text, this);
                });
            }
        };

        const theme = {
            toggle: () => {
                const body = document.body;
                const btn = document.querySelector('.dark-mode-btn');
                const isDark = body.getAttribute('data-theme') === 'dark';
                
                if (isDark) {
                    body.removeAttribute('data-theme');
                    btn.textContent = '🌙 Dark';
                    localStorage.setItem('visualizer-theme', 'light');
                } else {
                    body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light';
                    localStorage.setItem('visualizer-theme', 'dark');
                }
            },

            initialize: () => {
                const savedTheme = localStorage.getItem('visualizer-theme');
                const btn = document.querySelector('.dark-mode-btn');
                
                if (savedTheme === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light';
                } else {
                    btn.textContent = '🌙 Dark';
                }
            }
        };

        const keyboard = {
            initialize: () => {
                $(document).keydown(keyboard.handleKeyDown);
                keyboard.showInitialHint();
            },

            handleKeyDown: (e) => {
                if (['SELECT', 'INPUT', 'TEXTAREA'].includes(e.target.tagName) && e.key !== 'Escape') {
                    return;
                }

                if (/^[0-9]$/.test(e.key) && (state.isKeyboardMode || state.zenMode)) {
                    e.preventDefault();
                    numberInput.add(e.key);
                    return;
                }

                if (e.key === 'g' && (state.isKeyboardMode || state.zenMode) && state.numberBuffer !== '') {
                    e.preventDefault();
                    numberInput.executeGoTo();
                    return;
                }

                if (e.key === 'Escape' && state.numberBuffer !== '') {
                    e.preventDefault();
                    numberInput.clear();
                    return;
                }

                if (e.ctrlKey || e.metaKey || e.altKey) {
                    keyboard.handleCtrlKeys(e);
                    return;
                }

                if (e.key.startsWith('F') && e.key.length > 1) return;

                keyboard.handleNormalKeys(e);
            },

            handleCtrlKeys: (e) => {
                if (state.zenMode) {
                    switch(e.key) {
                        case 'ArrowRight':
                        case 'l':
                            e.preventDefault();
                            zen.nextUnreviewed();
                            break;
                        case 'ArrowLeft':
                        case 'h':
                            e.preventDefault();
                            zen.previousUnreviewed();
                            break;
                    }
                } else {
                    switch(e.key) {
                        case 'ArrowRight':
                        case 'k':
                            e.preventDefault();
                            normal.nextUnreviewed();
                            break;
                        case 'ArrowLeft':
                        case 'j':
                            e.preventDefault();
                            normal.previousUnreviewed();
                            break;
                    }
                }
            },

            handleNormalKeys: (e) => {
                const keyActions = {
                    'p': () => state.zenMode ? zen.markPass() : normal.markCurrentRow('Pass'),
                    'f': () => state.zenMode ? zen.markFail() : normal.markCurrentRow('Fail'),
                    'c': () => state.zenMode ? zen.clear() : normal.clearCurrentRow(),
                    'P': () => !state.zenMode && normal.filter('pass'),
                    'F': () => !state.zenMode && normal.filter('fail'),
                    'A': () => !state.zenMode && normal.filter('all'),
                    'U': () => !state.zenMode && normal.filter('unreviewed'),
                    'ArrowDown': () => state.zenMode ? zen.next() : normal.navigateRow(1),
                    'j': () => state.zenMode ? zen.next() : normal.navigateRow(1),
                    'ArrowUp': () => state.zenMode ? zen.previous() : normal.navigateRow(-1),
                    'k': () => state.zenMode ? zen.previous() : normal.navigateRow(-1),
                    ' ': () => state.zenMode ? zen.next() : normal.enterKeyboardMode(),
                    'ArrowRight': () => state.zenMode && zen.next(),
                    'l': () => state.zenMode && zen.next(),
                    's': () => state.zenMode && zen.next(),
                    'ArrowLeft': () => state.zenMode && zen.previous(),
                    'h': () => state.zenMode && zen.previous(),
                    'Escape': () => keyboard.handleEscape(),
                    'Enter': () => state.zenMode ? document.getElementById('zenNotes').focus() : normal.focusNotes(),
                    'Z': () => !state.zenMode && zen.enter(),
                    '.': () => state.zenMode ? zen.toggleSpaces() : normal.toggleCurrentRowSpaces(),
                    'D': () => theme.toggle(),
                    'T': () => toggleData(),
                    'R': () => state.zenMode ? zen.toggleRaw() : toggleData(),
                    '?': () => keyboard.showHelp()
                };

                const action = keyActions[e.key];
                if (action) {
                    e.preventDefault();
                    action();
                }
            },

            handleEscape: () => {
                if (state.normalHelpOpen) {
                    normal.closeHelp();
                } else if (state.zenHelpOpen) {
                    zen.closeHelp();
                } else if (state.zenMode) {
                    zen.exit();
                } else {
                    normal.exitKeyboardMode();
                }
            },

            showHelp: () => {
                if (state.zenMode && !state.zenHelpOpen) {
                    zen.showHelp();
                } else if (!state.normalHelpOpen) {
                    state.normalHelpOpen = true;
                    normal.showHelp();
                }
            },

            showInitialHint: () => {
                $('.keyboard-hint').remove();
                $('body').append(`
                    <div class="keyboard-hint" style="
                        position: fixed; 
                        top: 15px; 
                        right: 10px; 
                        background: var(--bg-banner); 
                        color: var(--text-primary);
                        padding: 8px 12px; 
                        border-radius: 4px; 
                        font-size: 13px;
                        font-weight: 500;
                        z-index: 9999;
                        border: 1px solid var(--border-color);
                        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                    ">
                        Press <kbd>Space</kbd> to start keyboard navigation, <kbd>Z</kbd> for Zen Mode, or <kbd>?</kbd> for help<br>
                        <small><kbd>p</kbd>/<kbd>f</kbd> mark • <kbd>P</kbd>/<kbd>F</kbd> filter</small>
                    </div>
                `);

                setTimeout(() => {
                    if (!state.isKeyboardMode && !state.zenMode) {
                        $('.keyboard-hint').fadeOut(1000, function() { $(this).remove(); });
                    }
                }, 4000);
            },

            showActiveHint: () => {
                $('.keyboard-hint').remove();
                const zIndexHint = state.zenMode ? 10003 : 9999;
                const zIndexSummary = state.zenMode ? 10004 : 9998;

                $('body').append(`
                    <div class="keyboard-hint" style="
                        position: fixed; 
                        top: 15px; 
                        right: 10px; 
                        background: var(--bg-banner); 
                        color: var(--text-primary);
                        padding: 8px 12px; 
                        border-radius: 4px; 
                        font-size: 13px;
                        font-weight: 500;
                        z-index: ${zIndexHint};
                        border: 1px solid var(--border-color);
                        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                    ">
                        Press <kbd>Esc</kbd> to exit ${state.zenMode ? 'zen' : 'keyboard'} mode or <kbd>?</kbd> for help
                    </div>
                `);

                const shortcutText = state.zenMode ? 
                    `<strong>Zen Mode:</strong> <kbd>p</kbd>ass <kbd>f</kbd>ail <kbd>c</kbd>lear <kbd>s</kbd>kip<br>
                     <strong>Navigate:</strong> <kbd>↑↓</kbd> or <kbd>Space</kbd><br>` :
                    `<strong>Actions:</strong> <kbd>p</kbd>ass <kbd>f</kbd>ail <kbd>c</kbd>lear<br>
                     <strong>Filters:</strong> <kbd>P</kbd>ass <kbd>F</kbd>ail <kbd>A</kbd>ll <kbd>U</kbd>nreviewed<br>
                     <strong>Modes:</strong> <kbd>Z</kbd>en <kbd>D</kbd>ark <kbd>R</kbd>aw`;

                $('body').append(`
                    <div class="shortcut-summary" style="
                        position: fixed;
                        top: 60px;
                        right: 10px;
                        background: #007bff;
                        color: white;
                        padding: 10px 12px;
                        border-radius: 6px;
                        font-size: 11px;
                        z-index: ${zIndexSummary};
                        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                        font-family: monospace;
                    ">
                        ${shortcutText}
                    </div>
                `);

                setTimeout(() => {
                    $('.shortcut-summary').fadeOut(800, function() { $(this).remove(); });
                }, 2000);
            },

            hideHint: () => {
                $('#keyboard-hint').remove();
                $('.shortcut-summary').remove();
                keyboard.showInitialHint();
            }
        };

        const numberInput = {
            add: (digit) => {
                state.numberBuffer += digit;
                numberInput.show();

                if (state.numberInputTimeout) {
                    clearTimeout(state.numberInputTimeout);
                }

                state.numberInputTimeout = setTimeout(() => {
                    numberInput.clear();
                }, config.numberInputTimeout);
            },

            show: () => {
                $('.number-buffer-display').remove();
                if (state.numberBuffer === '') return;

                const totalCount = state.zenMode ? state.tableData.length : state.dataTable.rows().count();
                const modeClass = state.zenMode ? 'zen' : 'normal';

                if (state.zenMode) {
                    $('#zenMode .zen-container').append(`
                        <div class="number-buffer-display zen show">
                            ${state.numberBuffer}
                        </div>
                    `);
                } else {
                    $('body').append(`
                        <div class="number-buffer-display normal show">
                            ${state.numberBuffer} / ${totalCount}
                        </div>
                    `);
                }
            },

            clear: () => {
                state.numberBuffer = '';
                $('.number-buffer-display').fadeOut(200, function() { $(this).remove(); });

                if (state.numberInputTimeout) {
                    clearTimeout(state.numberInputTimeout);
                    state.numberInputTimeout = null;
                }
            },

            executeGoTo: () => {
                if (state.numberBuffer === '') return;
                const targetNumber = parseInt(state.numberBuffer);

                if (state.zenMode) {
                    zen.goToString(targetNumber);
                } else {
                    normal.goToRow(targetNumber);
                }
                numberInput.clear();
            }
        };

        const normal = {
            enterKeyboardMode: () => {
                state.isKeyboardMode = true;
                normal.highlightCurrentRow();
                keyboard.showActiveHint();
            },

            exitKeyboardMode: () => {
                state.isKeyboardMode = false;
                state.currentRowSpacesMode = false;
                state.originalRowContent = {};
                $('#myTable tbody tr').removeClass('keyboard-focus');
                keyboard.hideHint();
            },

            getCurrentRow: () => $(state.dataTable.row(state.currentRowIndex).node()),

            highlightCurrentRow: () => {
                $('#myTable tbody tr').removeClass('keyboard-focus');
                normal.getCurrentRow().addClass('keyboard-focus');
            },

            scrollToCurrentRow: () => {
                const currentRow = normal.getCurrentRow();
                if (currentRow.length) {
                    currentRow[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            },

            navigateRow: (direction) => {
                if (!state.isKeyboardMode) return;

                if (state.currentRowSpacesMode) {
                    normal.toggleCurrentRowSpaces();
                }

                const totalRows = state.dataTable.rows().count();
                state.currentRowIndex += direction;
                state.currentRowIndex = Math.max(0, Math.min(state.currentRowIndex, totalRows - 1));

                const pageLength = state.dataTable.page.len();
                const currentPage = state.dataTable.page();
                const targetPage = Math.floor(state.currentRowIndex / pageLength);

                if (targetPage !== currentPage) {
                    state.dataTable.page(targetPage).draw('page');
                    setTimeout(() => {
                        normal.highlightCurrentRow();
                        normal.scrollToCurrentRow();
                    }, 50);
                } else {
                    normal.highlightCurrentRow();
                    normal.scrollToCurrentRow();
                }
            },

            markCurrentRow: (stateValue) => {
                if (!state.isKeyboardMode) return;
                const currentRow = normal.getCurrentRow();
                if (currentRow.length) {
                    const select = currentRow.find('.state-select');
                    select.val(stateValue).trigger('change');
                    normal.navigateRow(1);
                }
            },

            clearCurrentRow: () => {
                if (!state.isKeyboardMode) return;
                const currentRow = normal.getCurrentRow();
                if (currentRow.length) {
                    currentRow.find('.state-select').val('').trigger('change');
                }
            },

            focusNotes: () => {
                if (!state.isKeyboardMode) return;
                const currentRow = normal.getCurrentRow();
                const notesInput = currentRow.find('.notes-textarea');
                if (notesInput.length) notesInput.focus();
            },

            filter: (filterType) => {
                const messages = {
                    'all': 'Showing all entries',
                    'pass': 'Showing only passed entries',
                    'fail': 'Showing only failed entries',
                    'unreviewed': 'Showing only unreviewed entries'
                };

                if (filterType === 'all') {
                    $('#myTable tbody tr').show();
                } else {
                    $('#myTable tbody tr').hide();
                    $('#myTable tbody tr').each(function() {
                        const $row = $(this);
                        const $select = $row.find('.state-select');
                        const currentValue = $select.val();
                        let shouldShow = false;

                        if (filterType === 'pass' && currentValue === 'Pass') shouldShow = true;
                        else if (filterType === 'fail' && currentValue === 'Fail') shouldShow = true;
                        else if (filterType === 'unreviewed' && !currentValue) shouldShow = true;

                        if (shouldShow) $row.show();
                    });
                }

                utils.showFeedback(messages[filterType]);
            },

            nextUnreviewed: () => {
                if (!state.isKeyboardMode) return;

                if (state.currentRowSpacesMode) {
                    normal.toggleCurrentRowSpaces();
                }

                const totalRows = state.dataTable.rows().count();

                for (let i = state.currentRowIndex + 1; i < totalRows; i++) {
                    if (!storage.getState(i)) {
                        state.currentRowIndex = i;
                        normal.highlightCurrentRow();
                        normal.scrollToCurrentRow();
                        utils.showFeedback('→ Next unreviewed', '#007bff');
                        return;
                    }
                }
                utils.showFeedback('No more unreviewed strings');
            },

            previousUnreviewed: () => {
                if (!state.isKeyboardMode) return;

                if (state.currentRowSpacesMode) {
                    normal.toggleCurrentRowSpaces();
                }

                for (let i = state.currentRowIndex - 1; i >= 0; i--) {
                    if (!storage.getState(i)) {
                        state.currentRowIndex = i;
                        normal.highlightCurrentRow();
                        normal.scrollToCurrentRow();
                        utils.showFeedback('← Previous unreviewed', '#007bff');
                        return;
                    }
                }
                utils.showFeedback('No previous unreviewed strings');
            },

            goToRow: (rowNumber) => {
                if (!state.isKeyboardMode) return false;

                if (state.currentRowSpacesMode) {
                    normal.toggleCurrentRowSpaces();
                }
                
                const totalRows = state.dataTable.rows().count();
                const targetIndex = Math.min(rowNumber - 1, totalRows - 1);

                if (targetIndex >= 0) {
                    state.currentRowIndex = Math.max(0, targetIndex);

                    const pageLength = state.dataTable.page.len();
                    const targetPage = Math.floor(targetIndex / pageLength);
                    state.dataTable.page(targetPage).draw('page');

                    normal.highlightCurrentRow();
                    normal.scrollToCurrentRow();
                    return true;
                }
                return false;
            },

            toggleCurrentRowSpaces: () => {
                if (!state.isKeyboardMode) return;
                
                state.currentRowSpacesMode = !state.currentRowSpacesMode;
                const currentRow = normal.getCurrentRow();
                
                if (state.currentRowSpacesMode) {
                    currentRow.find('td.text-column').each(function() {
                        const $cell = $(this);
                        const cellKey = 'current_row_' + $cell.index();
                        state.originalRowContent[cellKey] = $cell.html();
                        const originalText = $cell.text();
                        const spacedText = originalText.replace(/ /g, '•');
                        $cell.text(spacedText).addClass('spaces-active');
                    });
                    // utils.showFeedback('• Row spaces visible', '#ffc107');
                } else {
                    currentRow.find('td.text-column').each(function() {
                        const $cell = $(this);
                        const cellKey = 'current_row_' + $cell.index();
                        const originalContent = state.originalRowContent[cellKey];
                        if (originalContent) {
                            $cell.html(originalContent);
                            delete state.originalRowContent[cellKey];
                        }
                        $cell.removeClass('spaces-active');
                    });
                    // utils.showFeedback('Row spaces hidden', '#6c757d');
                }
            },

            showHelp: () => {
                const helpHTML = `
                    <div id="normalHelp" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                                background: var(--bg-secondary); padding: 30px; border-radius: 12px; 
                                z-index: 10002; max-width: 600px; border: 1px solid var(--border-color);
                                box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
                        <h3 style="margin-top: 0; color: var(--text-primary);">Keyboard Shortcuts</h3>
                        <div style="color: var(--text-primary); line-height: 1.8; font-size: 14px;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <div>
                                    <strong style="color: #007bff;">Navigation:</strong><br>
                                    <kbd>Space</kbd> Enter keyboard mode<br>
                                    <kbd>↑</kbd> / <kbd>k</kbd> Move up one row<br>
                                    <kbd>↓</kbd> / <kbd>j</kbd> Move down one row<br>
                                    <kbd>0-9</kbd> + <kbd>g</kbd> Go to row number<br>
                                    <kbd>Ctrl+→</kbd> Next unreviewed string<br>
                                    <kbd>Ctrl+←</kbd> Previous unreviewed string<br>
                                    <kbd>Enter</kbd> Focus notes field<br>
                                    <kbd>Esc</kbd> Exit keyboard mode<br><br>
                            
                                    <strong style="color: #28a745;">Review Actions:</strong><br>
                                    <kbd>p</kbd> Mark current row as Pass<br>
                                    <kbd>f</kbd> Mark current row as Fail<br>
                                    <kbd>c</kbd> Clear current row state<br>
                                    <kbd>.</kbd> Visualize spaces<br>
                                </div>
                                <div>
                                    <strong style="color: #dc3545;">Quick Filters:</strong><br>
                                    <kbd>P</kbd> Show only Passed entries<br>
                                    <kbd>F</kbd> Show only Failed entries<br>
                                    <kbd>U</kbd> Show only Unreviewed entries<br>
                                    <kbd>A</kbd> Show All entries<br><br>
                            
                                    <strong style="color: #6c757d;">Other Shortcuts:</strong><br>
                                    <kbd>Z</kbd> Enter Zen Mode<br>
                                    <kbd>T</kbd> / <kbd>R</kbd> Toggle Raw/Formatted view<br>
                                    <kbd>D</kbd> Toggle Dark/Light mode<br>
                                    <kbd>?</kbd> Show this help<br><br>
                            
                                    <strong style="color: #ffc107;">Copy Feature:</strong><br>
                                    <em>Click any text cell to copy content</em>
                                </div>
                            </div>
                        </div>
                        <div style="margin-top: 25px; text-align: center;">
                            <button onclick="normal.closeHelp()" style="margin-right: 10px; padding: 8px 16px; 
                                    background: #007bff; color: white; text-align: center; border: none; border-radius: 4px; cursor: pointer;">
                                Got it!
                            </button>
                        </div>
                    </div>
                `;
                $('body').append(helpHTML);
            },

            closeHelp: () => {
                state.normalHelpOpen = false;
                $('#normalHelp').remove();
            }
        };

        const zen = {
            enter: () => {
                state.zenMode = true;
                keyboard.showActiveHint();
                state.zenCurrentIndex = state.currentRowIndex || 0;
                
                const zenHTML = `
                    <div class="zen-mode" id="zenMode">
                        <button class="zen-exit" onclick="zen.exit()">×</button>
                        <div class="zen-container">
                            <div class="zen-raw-indicator" id="zenRawIndicator">FORMATTED</div>
                            <div class="zen-state-indicator" id="zenStateIndicator">Unreviewed</div>
                            <div class="zen-feedback" id="zenFeedback">✓ Marked as Pass</div>
                            
                            <div class="zen-progress">String <span id="zenCurrent">1</span> of <span id="zenTotal">${state.tableData.length}</span></div>
                            <div class="zen-progress-bar">
                                <div class="zen-progress-fill" id="zenProgressFill"></div>
                            </div>

                            <div class="zen-string-id" id="zenStringId" onclick="zen.copyText(this, 'id')">STRING_ID</div>

                            <div class="zen-text-pair">
                                <div class="zen-source" id="zenSource" onclick="zen.copyText(this, 'source')">Source text here</div>

                            </div>

                            <div class="zen-actions">
                                <button class="zen-btn zen-btn-nav" onclick="zen.previous()">← Previous</button>
                                <button class="zen-btn zen-btn-pass" onclick="zen.markPass()">✓ Pass</button>
                                <button class="zen-btn zen-btn-fail" onclick="zen.markFail()">✗ Fail</button>
                                <button class="zen-btn zen-btn-nav" onclick="zen.next()">Next →</button>
                            </div>

                            <div class="zen-occurrences" id="zenOccurrences" style="
                                position: absolute; 
                                bottom: 20px; 
                                left: 20px; 
                                background: var(--bg-banner); 
                                color: var(--text-secondary); 
                                padding: 6px 12px; 
                                border-radius: 4px; 
                                font-size: 12px; 
                                font-family: 'Courier New', monospace;
                                border: 1px solid var(--border-color);
                                display: none;">
                                Occurrences: <span id="zenOccurrencesCount">1</span>
                            </div>

                            <input type="text" class="zen-notes" id="zenNotes" placeholder="Add your notes here..." maxlength="200">
                        </div>
                    </div>
                `;

                $('body').append(zenHTML);
                zen.updateDisplay();
                $('#zenMode').focus();

                const debouncedNotesSave = utils.debounce((notes) => {
                    storage.setNotes(state.zenCurrentIndex, notes);
                    zen.updateMainTableNotes(state.zenCurrentIndex, notes);
                }, config.debounceDelay);

                $('#zenNotes').on('input', function() {
                    debouncedNotesSave($(this).val());
                }).on('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        $(this).blur();
                    }
                });
            },

            exit: () => {
                zen.clearSpaces();
                state.zenMode = false;
                $('#zenMode').fadeOut(200, function() { $(this).remove(); });
            },

            updateDisplay: () => {
                if (!state.zenMode) return;

                const currentData = state.tableData[state.zenCurrentIndex];
                const rawCurrentData = config.rawData[state.zenCurrentIndex];
                const progress = ((state.zenCurrentIndex + 1) / state.tableData.length) * 100;

                $('#zenCurrent').text(state.zenCurrentIndex + 1);
                $('#zenProgressFill').css('width', progress + '%');

                const dataToShow = state.zenShowingRaw ? rawCurrentData : currentData;
                const isChineseMode = utils.isChineseMode();

                $('#zenStringId').text(dataToShow[0]);

                if (isChineseMode) {
                    $('#zenSource').html(`<strong style="color: #007bff;">Source - ${config.headers[1]}</strong><br>${dataToShow[1]}`);
                    $('#zenTarget').html(`<strong style="color: #28a745;">Target - ${config.headers[3]}</strong><br>${dataToShow[3]}`);
                } else {
                    $('#zenSource').html(`<strong style="color: #007bff;">Source - ${config.headers[1]}</strong><br>${dataToShow[1]}`);
                    $('#zenTarget').html(`<strong style="color: #28a745;">Target - ${config.headers[2]}</strong><br>${dataToShow[2]}`);
                }

                const savedState = storage.getState(state.zenCurrentIndex);
                const stateIndicator = $('#zenStateIndicator');

                if (savedState === 'Pass') {
                    stateIndicator.text('✓ Pass').removeClass().addClass('zen-state-indicator zen-state-pass');
                } else if (savedState === 'Fail') {
                    stateIndicator.text('✗ Fail').removeClass().addClass('zen-state-indicator zen-state-fail');
                } else {
                    stateIndicator.text('Unreviewed').removeClass().addClass('zen-state-indicator zen-state-unreviewed');
                }

                const rawIndicator = $('#zenRawIndicator');
                rawIndicator.text(state.zenShowingRaw ? 'RAW' : 'FORMATTED');

                const savedNotes = storage.getNotes(state.zenCurrentIndex);
                $('#zenNotes').val(savedNotes);

                const occurrencesIndex = config.headers.indexOf('Occurrences');
                if (occurrencesIndex !== -1 && occurrencesIndex < dataToShow.length) {
                    $('#zenOccurrencesCount').text(dataToShow[occurrencesIndex]);
                    $('#zenOccurrences').show();
                } else {
                    $('#zenOccurrences').hide();
                }
            },

            next: () => {
                zen.clearSpaces();
                if (state.zenCurrentIndex < state.tableData.length - 1) {
                    state.zenCurrentIndex++;
                    zen.updateDisplay();
                }
            },

            previous: () => {
                zen.clearSpaces();
                if (state.zenCurrentIndex > 0) {
                    state.zenCurrentIndex--;
                    zen.updateDisplay();
                }
            },

            markPass: () => {
                storage.setState(state.zenCurrentIndex, 'Pass');
                zen.updateMainTableRow(state.zenCurrentIndex, 'Pass');
                zen.updateDisplay();
                setTimeout(() => zen.next(), 150);
            },

            markFail: () => {
                storage.setState(state.zenCurrentIndex, 'Fail');
                zen.updateMainTableRow(state.zenCurrentIndex, 'Fail');
                zen.updateDisplay();
                setTimeout(() => zen.next(), 150);
            },

            clear: () => {
                storage.clearState(state.zenCurrentIndex);
                zen.updateMainTableRow(state.zenCurrentIndex, '');
                zen.updateDisplay();
                zen.next();
            },

            nextUnreviewed: () => {
                zen.clearSpaces();
                for (let i = state.zenCurrentIndex + 1; i < state.tableData.length; i++) {
                    if (!storage.getState(i)) {
                        state.zenCurrentIndex = i;
                        zen.updateDisplay();
                        zen.showFeedback('→ Next unreviewed', '#007bff');
                        return;
                    }
                }
                zen.showFeedback('No more unreviewed');
            },

            previousUnreviewed: () => {
                zen.clearSpaces();
                for (let i = state.zenCurrentIndex - 1; i >= 0; i--) {
                    if (!storage.getState(i)) {
                        state.zenCurrentIndex = i;
                        zen.updateDisplay();
                        zen.showFeedback('← Prev unreviewed', '#007bff');
                        return;
                    }
                }
                zen.showFeedback('No prev unreviewed', '#6c757d');
            },

            goToString: (stringNumber) => {
                zen.clearSpaces();
                const targetIndex = Math.min(stringNumber - 1, state.tableData.length - 1);
                if (targetIndex >= 0) {
                    state.zenCurrentIndex = Math.max(0, targetIndex);
                    zen.updateDisplay();
                    return true;
                }
                return false;
            },

            toggleRaw: () => {
                state.zenShowingRaw = !state.zenShowingRaw;
                zen.updateDisplay();
            },

            toggleSpaces: () => {
                state.zenSpacesMode = !state.zenSpacesMode;
                
                if (state.zenSpacesMode) {
                    zen.showSpaces();
                } else {
                    zen.hideSpaces();
                }
            },

            showSpaces: () => {
                const sourceEl = document.getElementById('zenSource');
                const targetEl = document.getElementById('zenTarget');
                
                if (!sourceEl || !targetEl) return;

                state.originalZenContent.source = sourceEl.innerHTML;
                state.originalZenContent.target = targetEl.innerHTML;

                const sourceLines = sourceEl.innerHTML.split('<br>');
                const targetLines = targetEl.innerHTML.split('<br>');

                if (sourceLines.length >= 2) {
                    const sourceHeader = sourceLines[0];
                    const sourceText = sourceEl.textContent.replace(sourceEl.querySelector('strong').textContent, '').trim();
                    sourceEl.innerHTML = sourceHeader + '<br>' + sourceText.replace(/ /g, '•');
                }

                if (targetLines.length >= 2) {
                    const targetHeader = targetLines[0];
                    const targetText = targetEl.textContent.replace(targetEl.querySelector('strong').textContent, '').trim();
                    targetEl.innerHTML = targetHeader + '<br>' + targetText.replace(/ /g, '•');
                }

                sourceEl.classList.add('zen-spaces-active');
                targetEl.classList.add('zen-spaces-active');
                // utils.showFeedback('• Zen spaces visible', '#ffc107');
            },

            hideSpaces: () => {
                const sourceEl = document.getElementById('zenSource');
                const targetEl = document.getElementById('zenTarget');
                
                if (!sourceEl || !targetEl) return;

                if (state.originalZenContent.source) {
                    sourceEl.innerHTML = state.originalZenContent.source;
                    targetEl.innerHTML = state.originalZenContent.target;
                }

                sourceEl.classList.remove('zen-spaces-active');
                targetEl.classList.remove('zen-spaces-active');
                state.originalZenContent = {};
                // utils.showFeedback('Zen spaces hidden', '#6c757d');
            },

            clearSpaces: () => {
                if (state.zenSpacesMode) {
                    zen.hideSpaces();
                    state.zenSpacesMode = false;
                }
            },

            showFeedback: (message, color = 'rgba(0, 0, 0, 0.8)') => {
                const feedback = $('#zenFeedback');
                feedback.text(message).css('background', color).addClass('show');
                setTimeout(() => feedback.removeClass('show'), 800);
            },

            updateMainTableRow: (rowIndex, stateValue) => {

                    const row = $(state.dataTable.row(rowIndex).node());
                    const select = row.find('.state-select');
                    select.val(stateValue).trigger('change');
                }
            },

            updateMainTableNotes: (rowIndex, notes) => {
                if (state.dataTable && state.dataTable.row(rowIndex).node()) {
                    const row = $(state.dataTable.row(rowIndex).node());
                    const notesTextarea = row.find('.notes-textarea');
                    if (notesTextarea.length) notesTextarea.val(notes);
                }
            },

            copyText: (element, type) => {
                const currentData = state.tableData[state.zenCurrentIndex];
                const rawCurrentData = config.rawData[state.zenCurrentIndex];
                const isChineseMode = utils.isChineseMode();

                let textToCopy = '';
                switch(type) {
                    case 'id':
                        textToCopy = rawCurrentData[0];
                        break;
                    case 'source':
                        textToCopy = rawCurrentData[1];
                        break;
                    case 'target':
                        textToCopy = isChineseMode ? rawCurrentData[3] : rawCurrentData[2];
                        break;
                }

                const decodedText = utils.decodeHtml(textToCopy);
                navigator.clipboard.writeText(decodedText).then(() => {
                    clipboard.showFeedback(element);
                });
            },

            showHelp: () => {
                state.zenHelpOpen = true;
                const helpHTML = `
                    <div id="zenHelp" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                                background: var(--bg-secondary); padding: 30px; border-radius: 12px; 
                                z-index: 10002; max-width: 500px; border: 1px solid var(--border-color);
                                box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
                        <h3 style="margin-top: 0; color: var(--text-primary);">Zen Mode Shortcuts</h3>
                        <div style="color: var(--text-primary); line-height: 1.6;">

                            <strong>Navigate:</strong> <kbd>↑↓</kbd> or <kbd>h</kbd> <kbd>j</kbd> <kbd>k</kbd> <kbd>l</kbd> or <kbd>Space</kbd><br>
                            <strong>Go To:</strong> <kbd>0-9</kbd> + <kbd>g</kbd> Jump to string number<br>
                            <strong>Smart Nav:</strong> <kbd>Ctrl+→</kbd> Next unreviewed, <kbd>Ctrl+←</kbd> Prev unreviewed<br>
                            <strong>Other:</strong> <kbd>Enter</kbd> Notes, <kbd>R</kbd> Raw toggle, <kbd>D</kbd> Dark mode, <kbd>.</kbd> Spaces visualization<br>
                            <strong>Exit:</strong> <kbd>Esc</kbd><br><br>
                            <strong>Copy:</strong> Click on any text to copy raw content
                        </div>
                        <button onclick="zen.closeHelp()" style="margin-top: 20px; padding: 8px 16px; 
                                background: #007bff; text-align: center; color: white; border: none; border-radius: 4px; cursor: pointer;">
                            Got it!
                        </button>
                    </div>
                `;
                $('body').append(helpHTML);
            },

            closeHelp: () => {
                state.zenHelpOpen = false;
                $('#zenHelp').remove();
            }
        };

        // Global functions for onclick handlers
        window.toggleData = () => {
            state.showingRaw = !state.showingRaw;
            dataRenderer.renderData(state.showingRaw ? config.rawData : config.formattedData);
            document.querySelector('.toggle-btn').textContent = state.showingRaw ? 'Show Formatted' : 'Show Raw';

        window.clearAllStates = () => {
            const total = state.tableData.length;
            let clearedCount = 0;
            
            for (let i = 0; i < total; i++) {
                if (storage.getState(i)) {
                    storage.clearState(i);
                    clearedCount++;
                }
            }
            
            dataRenderer.renderData(state.tableData);
            
            if (clearedCount > 0) {
                alert(`✅ Cleared ${clearedCount} review states and all notes!`);
            } else {
                alert('ℹ️ No review states to clear.');
            }
        };

        // Initialize application
        $(document).ready(() => {
            theme.initialize();
            dataRenderer.renderData(config.formattedData);
            keyboard.initialize();
            progressTracker.update();
            
            $('#clearState').click(clearAllStates);
        });
    </script>
  </body>
</html>

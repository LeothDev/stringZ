g. Quando Eirlys cura aliados com Sopro Sereno, ganha um bônus adicional de cura de {30,num}%. Até 2 aliados com Sopro Sereno podem estar no campo.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "Causa Dano M. em Área 1 vez a até {31,num} inimigos à frente, incluindo unidades aéreas, e Investida Poderosa inflige {32,num}% de Vulnerabilidade (Dano M.) nos inimigos por {33,num} seg.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy&#x27;s DEF. Un xistir no campo.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participe da Incursão de Equipamento I para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Participe da Incursão de Equipamento II para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Participe da Incursão de Equipamento III para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Evoque heróis para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes&#x27; skills to win trophies and redeem rewards.", "Suba de nível/melhore o nível de estrelas/promova heróis ou aprimore as habilidades dos heróis para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Participe da Incursão de Material de Artefato para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participe da Incursão de Equipamento I para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Classificação Suprema da Chegada dos Heróis", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "O Legado Perdido", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Cofre nas Areias", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Palácio Esquecido", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Chegada dos Heróis", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Treinamento do Herói", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Mistério dos Artefatos", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "O Legado Perdido", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Capítulo da História", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Capítulo do Desafio", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "IP de Domínio Público", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Invasão de Zumbis", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Trocando de canais...", "", ""], ["CommonText_mMessage_24292", "Challenges", "Desafios", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;Pedras-Chave de Teste&lt;/color&gt;\\nAs Pedras-Chave de Teste podem ser obtidas em vários modos de jogo. Estas Pedras-chave vêm em diferentes tipos e níveis, cada uma contendo Inscrições Antigas únicas. Insira-as no altar para abrir caminhos para os testes correspondentes. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Regras do Desafio&lt;/color&gt;\\nCada batalha consiste em múltiplas ondas de monstros. Derrotar cada onda recompensa você com um baú de tesouro. Após iniciada, a batalha não pode ser reiniciada. Se você sair no meio da batalha, as recompensas serão determinadas com base no seu progresso atual. Você pode consumir até 200 Pedras-Chave por mês para desafios de teste. Quando este limite for atingido, não será possível realizar mais desafios naquele mês.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Energia da Pedra-Chave&lt;/color&gt;\\nCada pedra-chave possui Energia específica. &lt;color=&quot;#fdbe36&quot;&gt;1 Energia é consumida por tentativa de Teste.&lt;/color&gt; Quando a batalha termina, se a Pedra-chave ainda tiver Energia restante, você pode escolher desistir das recompensas e sair, então consumir Energia novamente para reiniciar o teste. O consumo de Energia não conta para o limite mensal de Pedras-Chave.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destruir Pedra-Chave&lt;/color&gt;\\nVocê pode destruir Pedras-Chave que atendam aos requisitos de nível de destruição. Destruir pedras-chave não rende recompensas e não conta para o limite mensal de consumo de Pedra-Chave.\\n&lt;color=&quot;#fd4540&quot;&gt;As Pedras-Chave de Teste têm um limite de armazenamento. Uma vez cheio, você não poderá obter mais pedras-chave. Por favor, use-as regularmente para manter espaço disponível.&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Cristal Musgoso", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Cristal Derretido", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Após iniciar uma batalha, ela não poderá ser reiniciada. Se sair durante a batalha, ela será encerrada imediatamente e a Energia consumida não será devolvida!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Uma região vulcânica onde a lava surge durante o apocalipse. Mais heróis de plataforma são necessários para repelir as forças malignas apocalípticas.", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;Tem certeza de que deseja demitir este jogador da posição de Marechal?&lt;/color&gt;\\nCada Guilda pode ter até {num1} Marechais, cada um ganhando {num2} ataque(s) adicional(is) por rodada.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Pontos da Rodada", "", ""], ["CommonText_mMessage_26126", "Destroy", "Destruir", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "Prosseguir com a destruição de {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Pedras-Chave destruídas não podem ser recuperadas e não concederão nenhum item.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "A Pedra-Chave foi destruída.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Energia:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Desistir e sair", "", ""], ["CommonText_mMessage_26131", "Claim", "Reivindicar", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Energia Restante da Pedra-Chave:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Galeria de Batalha", "", ""], ["CommonText_mMessage_26134", "Guides", "Guias", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Aparecer Pedra-Chave:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Cristal Musgoso", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Cristal Derretido", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Exibir Apenas Tags da Pedra-Chave Atual", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Os Heróis Mais Populares são calculados com base nas taxas de escolha de heróis, apenas para referência.", "", ""], ["CommonText_mMessage_26140", "Search", "Buscar", "", ""], ["CommonText_mMessage_26141", "Search Results", "Resultados da Busca", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Carregando dados...", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Coletando Dados do Herói", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Insira pelo menos {num} caracter(es)", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "Nenhuma tag correspondente encontrada.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "O Combate Automático não está disponível para o nível atual da Pedra-Chave.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Você pode enviar registros de Combate Automático após concluir manualmente a Onda {num}.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "O Combate Automático pode falhar devido aos diferentes marcadores das Pedras-Chave. Deseja prosseguir com o Combate Automático?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Deseja enviar esta batalha como um novo registro de Combate Automático?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "Devido aos marcadores variáveis das Pedras-Chave, recomendamos selecionar a formação mais abrangente possível ao enviar o Combate Automático!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "O armazém de Pedras-Chave está cheio. Use algumas Pedras-Chave antes de comprar mais.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Limpar", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "Baús aleatórios de Pedras-Chave fechados foram detectados em seu Armazém. Deseja abri-los agora?", "", ""], ["CommonText_mMessage_26154", "Go", "Ir", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Nv. {num1} a {num2}", "", ""], ["CommonText_mMessage_26156", "This level&#x27;s Keystone cannot be destroyed.", "A Pedra-Chave deste nível não pode ser destruída.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Keystone(s)?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "Tem certeza que deseja destruir &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Pedra(s)-chave?\\n&lt;color=&quot;#fd4540&quot;&gt;As Pedras-chave destruídas não podem ser recuperadas e não concederão nenhum item.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "Pedra(s)-Chave Destruída(s) {num}.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Uso Mensal:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "As Pedras-Chave têm um limite mensal de desafios. Após atingir esse limite, nenhuma tentativa adicional será permitida.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?\\n&lt;color=&quot;#e04242&quot;&gt;During the event, you can only choose one difficulty per day to claim rewards.&lt;/color&gt;", "A dificuldade atual possui recompensas para reivindicar. Tem certeza de que deseja tentar uma dificuldade diferente?\\n&lt;color=&quot;#e04242&quot;&gt;Durante o evento, você só pode escolher uma dificuldade por dia para reivindicar recompensas.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26162", "Don&#x27;t remind me again.", "Não me lembre novamente.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "O armazém de Pedras-Chave está cheio. Por favor, use algumas antes de desbloquear mais.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "A versão da reprodução não corresponde à versão atual e não pode ser visualizada.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Insira até {num} caractere(s).", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Heróis Populares", "", ""], ["CommonText_mMessage_26167", "Tag", "Etiqueta", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Armazém de Pedras-Chave de Teste Cheio", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater&#x27;s Movement Spd. by 30. They are &lt;color=&quot;#fd4540&quot;&gt;immune to Slow&lt;/color&gt;.", "Reduz a Velocidade de Movimento do Devorador de Almas em 30 pontos. Ele é &lt;color=&quot;#fd4540&quot;&gt;imune a Desacelerar&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73003", "White Tower&#x27;s Scholar enters &lt;color=&quot;#fd4540&quot;&gt;Invisibility&lt;/color&gt; and becomes visible when blocked.", "O Erudito da Torre Branca entra em estado de &lt;color=&quot;#fd4540&quot;&gt;Invisibilidade&lt;/color&gt; e fica visível quando bloqueado.", "", ""], ["Difficulty_mDetail_73004", "White Tower&#x27;s Scholar becomes &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "O Erudito da Torre Branca se torna &lt;color=&quot;#fd4540&quot;&gt;imune ao Dano M.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains &lt;color=&quot;#fd4540&quot;&gt;unyielding effect&lt;/color&gt; for 3 sec upon death and becomes &lt;color=&quot;#fd4540&quot;&gt;immune to Control and Slow&lt;/color&gt;.", "O Aracnídeo Pequeno ganha &lt;color=&quot;#fd4540&quot;&gt;efeito Obstinado&lt;/color&gt; por 3 seg. ao morrer e se torna &lt;color=&quot;#fd4540&quot;&gt;imune a Controle e Desacelerar&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 5 sec.", "O Aracnídeo Pequeno &lt;color=&quot;#fd4540&quot;&gt;recupera 50% de HP&lt;/color&gt; a cada 5 seg.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "A Velocidade de Movimento do Guarda do Raio é &lt;color=&quot;#fd4540&quot;&gt;aumentada em 30&lt;/color&gt; pontos.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is &lt;color=&quot;#fd4540&quot;&gt;immune to DMG taken&lt;/color&gt;, but loses 5% HP per sec.", "Guarda do Raio é &lt;color=&quot;#fd4540&quot;&gt;imune ao Dano recebido&lt;/color&gt;, mas perde 5% de HP por seg.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace&#x27;s Fatigue becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "A Fadiga do Murkling Perigoso se torna &lt;color=&quot;#fd4540&quot;&gt;permanente&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is &lt;color=&quot;#fd4540&quot;&gt;immune to CC Effects&lt;/color&gt;.", "O Komodo Encouraçado é &lt;color=&quot;#fd4540&quot;&gt;imune a Efeitos de CG&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction &lt;color=&quot;#fd4540&quot;&gt;when blocked&lt;/color&gt;.", "O Komodo Encouraçado ganha 30% adicionais de Redução de Dano F. e de Dano M. &lt;color=&quot;#fd4540&quot;&gt;quando bloqueado&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;summons an extra&lt;/color&gt; Ice Vermin.", "O Clérigo Congelado &lt;color=&quot;#fd4540&quot;&gt;evoca um Verme de Gelo adicional&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;spawns&lt;/color&gt; 3 Ice Vermin &lt;color=&quot;#fd4540&quot;&gt;upon death&lt;/color&gt;.", "Clérigo Congelado &lt;color=&quot;#fd4540&quot;&gt;gera&lt;/color&gt; 3 Vermes de Gelo &lt;color=&quot;#fd4540&quot;&gt;ao morrer&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. +50&lt;/color&gt;.", "O Guarda do Trovão para de atacar e &lt;color=&quot;#fd4540&quot;&gt;ganha Velocidade de Movimento +50&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;ATK is increased by 100%&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;when attacking shields&lt;/color&gt;, deducts 50% of its HP.", "O ATQ do Guarda do Trovão &lt;color=&quot;#fd4540&quot;&gt;é aumentado em 100%&lt;/color&gt;, mas &lt;color=&quot;#fd4540&quot;&gt;ao atacar escudos&lt;/color&gt;, perde 50% do seu HP.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "O Olho Morto do Nevoeiro é &lt;color=&quot;#fd4540&quot;&gt;imune ao Dano M.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores &lt;color=&quot;#fd4540&quot;&gt;10% HP&lt;/color&gt; with each ATK.", "Névoa: Barão Salem recupera &lt;color=&quot;#fd4540&quot;&gt;10% de HP&lt;/color&gt; a cada ATQ.", "", ""], ["Difficulty_mDetail_73018", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;Cooldown is reduced by 100%&lt;/color&gt;.", "A Incubação Acelerada do Incubador &lt;color=&quot;#fd4540&quot;&gt;tem seu Tempo de Recarga reduzido em 100%&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73019", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;spawns 2 extra Suicides&lt;/color&gt;.", "A Incubação Acelerada do Incubador &lt;color=&quot;#fd4540&quot;&gt;gera 2 Suicidas adicionais&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;drains 10% of the target&#x27;s Rage&lt;/color&gt;.", "Ao causar Dano a um alvo, o Sacerdote do Trovão &lt;color=&quot;#fd4540&quot;&gt;drena 10% da fúria do alvo&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;permanently reduces their Max HP by 10%&lt;/color&gt;. This effect can be stacked.", "Ao causar Dano a um alvo, o Sacerdote do Trovão &lt;color=&quot;#fd4540&quot;&gt;reduz permanentemente o HP Máximo dele em 10%&lt;/color&gt;. Este efeito pode ser acumulado.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces &lt;color=&quot;#fd4540&quot;&gt;healing&lt;/color&gt; received by &lt;color=&quot;#fd4540&quot;&gt;all units in range&lt;/color&gt; by 50%.", "O Flagelo reduz em 50% a &lt;color=&quot;#fd4540&quot;&gt;cura&lt;/color&gt; recebida por &lt;color=&quot;#fd4540&quot;&gt;todas as unidades no alcance&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73023", "Scourge&#x27;s DMG range expands to &lt;color=&quot;#fd4540&quot;&gt;adjacent 2 tiles&lt;/color&gt;.", "O alcance de Dano do Flagelo expande para &lt;color=&quot;#fd4540&quot;&gt;2 casas adjacentes&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to &lt;color=&quot;#fd4540&quot;&gt;blocked targets&lt;/color&gt;.", "Quando o Névoa: Observador Abismal morre, ele causa Dano M. igual a 100% do ATQ aos &lt;color=&quot;#fd4540&quot;&gt;alvos bloqueados&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes &lt;color=&quot;#fd4540&quot;&gt;unblockable&lt;/color&gt;.", "O Roedor Mutante Raivoso torna-se &lt;color=&quot;#fd4540&quot;&gt;imbloquável&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent &lt;color=&quot;#fd4540&quot;&gt;increases Movement Spd. by 30&lt;/color&gt;.", "O Roedor Mutante Raivoso &lt;color=&quot;#fd4540&quot;&gt;aumenta a Velocidade de Movimento em 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "Para cada 20% de HP que o Barão Salem perde, ele &lt;color=&quot;#fd4540&quot;&gt;ganha 20% de DEF e RES. M.&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "O Conjurador de Sombras &lt;color=&quot;#fd4540&quot;&gt;tem sua Velocidade de Movimento aumentada em 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "Para cada 20% de HP que o Conjurador de Sombras perde, ele &lt;color=&quot;#fd4540&quot;&gt;ganha 20% de DEF e RES. M.&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers&#x27; DEF and M. RES. by 30%. &lt;color=&quot;#fd4540&quot;&gt;When under CC Effects, reduces by 50%&lt;/color&gt;.", "Aumenta a DEF e RES. M. dos Destruidores Comuns em 30%. &lt;color=&quot;#fd4540&quot;&gt;Quando sob Efeitos de CG, reduz em 50%&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when &lt;color=&quot;#fd4540&quot;&gt;stunned or frozen&lt;/color&gt;.", "O Destruidor Comum é imune ao Dano quando &lt;color=&quot;#fd4540&quot;&gt;atordoado ou congelado&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an &lt;color=&quot;#fd4540&quot;&gt;initial Hitcount Shield&lt;/color&gt;.", "O Destruidor Incomum ganha um &lt;color=&quot;#fd4540&quot;&gt;Escudo Conta-Golpes inicial&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer &lt;color=&quot;#fd4540&quot;&gt;gains 5 Movement Spd. each time taking DMG&lt;/color&gt;.", "O Destruidor Incomum &lt;color=&quot;#fd4540&quot;&gt;ganha 5 de Velocidade de Movimento sempre que recebe Dano&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee&#x27;s Ultrasonic Wave &lt;color=&quot;#fd4540&quot;&gt;DMG increases by 100%&lt;/color&gt; and does not inflict Poison.", "A Onda Ultrassônica da Banshee Asas-de-Morcego &lt;color=&quot;#fd4540&quot;&gt;aumenta o Dano em 100%&lt;/color&gt; e não inflige Veneno.", "", ""], ["Difficulty_mDetail_73035", "Batwings Banshee&#x27;s Poison effect becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "O efeito de Veneno da Banshee Asas-de-Morcego se torna &lt;color=&quot;#fd4540&quot;&gt;permanente&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73036", "Golden Guard &lt;color=&quot;#fd4540&quot;&gt;forcibly removes targets&lt;/color&gt; upon collision.", "O Guarda Dourado &lt;color=&quot;#fd4540&quot;&gt;remove forçosamente os alvos&lt;/color&gt; ao colidir.", "", ""], ["Difficulty_mDetail_73037", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 15 sec.", "O Destruidor Supremo &lt;color=&quot;#fd4540&quot;&gt;recupera 50% de HP&lt;/color&gt; a cada 15 seg.", "", ""], ["Difficulty_mDetail_73038", "Supreme Destroyer &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. increases by 50&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;loses 3% HP&lt;/color&gt; per sec.", "Destruidor Supremo &lt;color=&quot;#fd4540&quot;&gt;tem Velocidade de Movimento aumentada em 50&lt;/color&gt;, mas &lt;color=&quot;#fd4540&quot;&gt;perde 3% de HP&lt;/color&gt; por seg.", "", ""], ["Difficulty_mDetail_73039", "Smasher Guard&#x27;s ATK will &lt;color=&quot;#fd4540&quot;&gt;forcibly remove targets&lt;/color&gt;.", "O ATQ do Guarda Esmagador &lt;color=&quot;#fd4540&quot;&gt;removerá forçosamente os alvos&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73040", "When losing 80% HP, Smasher Guard will fall into Petrification for 15 sec, gaining &lt;color=&quot;#fd4540&quot;&gt;massive DMG Reduction&lt;/color&gt; and continuously &lt;color=&quot;#fd4540&quot;&gt;restoring HP&lt;/color&gt; during Petrification.", "Ao perder 80% de HP, o Guarda Esmagador terá Petrificação por 15 seg, ganhando &lt;color=&quot;#fd4540&quot;&gt;Redução de Dano massiva&lt;/color&gt; e &lt;color=&quot;#fd4540&quot;&gt;recuperando HP continuamente&lt;/color&gt; durante a Petrificação.", "", ""], ["Difficulty_mDetail_74001", "Jungle Master&#x27;s Basic ATK hits &lt;color=&quot;#fd4540&quot;&gt;5&lt;/color&gt; enemy targets each time.", "O ATQ Básico da Mestra da Selva atinge &lt;color=&quot;#fd4540&quot;&gt;5&lt;/color&gt; inimigos a cada ataque.", "", ""], ["Difficulty_mDetail_74002", "While Jungle Master is on the battlefield, restores &lt;color=&quot;#fd4540&quot;&gt;50% HP to all enemies&lt;/color&gt; on the battlefield every 10 sec.", "Enquanto a Mestra da Selva estiver no campo de batalha, &lt;color=&quot;#fd4540&quot;&gt;todos os inimigos recuperam 50% de HP&lt  "Priestess of Rain appears randomly on the battlefield each wave.", "A Sacerdotisa da Chuva aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "O Guardião Dourado aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "O Inquisidor Dourado aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "O Suicida aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "A Mão da Areia aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "A Mosca de Cura aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "O Admirador Distorcido aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero&#x27;s DMG by 10% for 8 sec, stacking up to 5 times.", "(3 peças) Ao lançar um Acerto Crít. com o ATQ Básico, aumenta o Dano do herói em 10% por 8 seg., acumulando até 5 vezes.", "", ""], ["HeroStory_mStory_2209", "&quot;She walks like a memory I have not earned, yet always long for.&quot;\\n-Rivenhald\\n\\nThey sent her north, where the snows upon her brow might bend her once more to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "&quot;Ela caminha como uma memória que ainda não mereci, mas pela qual eternamente anseio.&quot;\\n-Rivenhald\\n\\nEnviaram-na ao norte, onde o manto gélido sobre sua fronte poderia dobrá-la novamente à causa deles.\\n\\nOutrora sacerdotisa de Elyndris, Eirlys permanecia no coração de ritos ancestrais, sua voz entrelaçada ao suspiro dos deuses. Mas algo se fragmentou. Ela fez uma escolha que ninguém ousou nomear, e o santuário jamais a perdoaria com facilidade.\\n\\nA cidade Élfica passou meses lambendo suas feridas após as chamas da agressão de Moriden. Embora a maré invasora tivesse sido repelida, as cicatrizes persistiram e, com elas, uma revelação aterrorizante: eles não eram mais intocáveis. Suas torres haviam rachado. Seus mitos haviam sangrado. Elyndris precisava de sombras para se moverem onde estandartes não podiam alcançar. Então os videntes voltaram seu olhar para fora. Silenciosamente. Meticulosamente. Buscando lugares além dos mapas antigos, onde os seus poderiam se refugiar se a guerra retornasse.\\n\\nO Norte de Tya, desolado e austero, emergiu em suas profecias como uma lâmina cortando através da neve. Conheciam Harz, mas não ousavam buscar conflito com alguém de sua reputação. Rivenhald, no entanto, governava nas regiões glaciais desconhecidas para seus batedores - um Senhor da Guerra em tudo menos no título, um monarca que não se curvava a nenhuma coroa além da própria. Precisavam compreendê-lo. Saber se sua força poderia ser subvertida. Ou, se necessário, quão facilmente poderia ser despedaçada.\\n\\nEirlys foi a resposta deles. Sem aliados, ela não era nem diplomata nem espiã, mas algo mais sutil. Foi enviada com meias verdades e um juramento sagrado: conquistar a confiança dele, decifrar sua alma e relatar o que não pode ser vislumbrado à distância. Chegou envolta em branco, sua presença justificada como pacificadora. Uma curandeira errante. Uma sacerdotisa da geada. E Rivenhald, que não confiava em ninguém, depositou sua confiança nela.\\n\\nEla se fez indispensável. Tratou feridas, interpretou presságios, não deixou rastros de segundas intenções. Ele a observava. Ela sustentava o olhar. Nenhum dos dois piscava.\\n\\nAs fronteiras entre eles se dissolveram com o tempo, entrelaçando-se mas permanecendo inquebráveis. Ela passou a conhecer seus silêncios, a natureza de sua fúria, a estranha misericórdia que ele sepultava sob tudo isso. À noite, quando o fogo crepitava baixo e nenhuma mensagem podia ser enviada, ela por vezes vislumbrava um futuro onde ele quase poderia ser digno de confiança - onde ele poderia significar mais para ela... mas a aurora sempre consumia o devaneio.\\n\\nComo Rivenhald, ela também sonha com o desfecho: duas silhuetas na neve, impassíveis e obstinadas. Uma lâmina deve cair. Uma causa deve se extinguir. E na névoa de sangue antes que o vento leve tudo embora, compreenderão o custo da sobrevivência... e quem realmente são um para o outro.\\n\\nMas Eirlys sabe o que os videntes de Elyndris nunca lhe revelaram. O Norte não pertence a ninguém. Nem a reis. Nem a cidades. E certamente não a fantasmas como ela. Qualquer futuro que os aguarde não será edificado sobre confiança, mas sobre o que sobrevive após tudo consumir.\\n\\nEla é o silêncio entre duas tempestades, aguardando a hora em que uma deve despedaçar a outra.", "", ""], ["HeroStory_mStory_2321", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "&quot;Você implorará para ser devorado. E eu serei misericordiosa.&quot;\\n—Sibilado da folhagem\\n\\nNas selvas de jade de Tya, onde as raízes bebem sangue e as árvores estrangulam os vivos, uma vez rastejou um espírito de veneno e sombra — uma serpente conhecida apenas em sussurros como Sythra, embora naqueles dias, ela não tivesse carne própria. Apenas presas, fome e a memória de um nome.\\n\\nO Império dos Escamosos, uma civilização antiga cujas cidades de obsidiana uma vez dividiram o dossel e separaram os vales, há muito havia desaparecido na expansão verdejante. No entanto, em sua hora final, derramaram sua última magia em ídolos imponentes — estátuas de criaturas poderosas esculpidas com devoção, pintadas em ocre e cinzas, deixadas como oferendas aos espíritos da selva, na esperança de que suas súplicas fossem atendidas.\\n\\nInfelizmente, houve apenas silêncio.\\n\\nQuando a metrópole desmoronou, no entanto, engolida inteira pela investida da folhagem, esses ídolos perduraram — velados em musgo, meio consumidos, mas vivos com ecos inquietos. De fato, espíritos habitavam essas figuras, almas dos vivos oferecidas como presentes aos espíritos da selva, acorrentadas pela feitiçaria dos escamosos. Os errantes desavisados e ingênuos deste labirinto folhoso que se deparavam com tais figuras encontravam um fim rápido, pois eram, na verdade, altares sacrificiais, capazes de conjurar divindades poderosas. Sythra era uma dessas divindades, uma deusa serpentina e vestígio do antigo império, um silvo que serpenteava nas mentes dos fracos de vontade e dos feridos.\\n\\nE ainda assim, ela permanecia apenas espírito — até Dassomi encontrá-la.\\n\\nO famoso místico Escamoso acreditava muito que os sonhos eram uma ponte para verdades maiores. Buscando sabedoria perdida em cantos esquecidos do mundo, Dassomi veio para a selva, seguindo visões de serpentes e altares, atraído a um templo coberto de vegetação como um sonho profundo meio lembrado. Lá, no coração daquela ruína, ele queimou incenso e deslizou entre mundos e Sythra respondeu.\\n\\nNenhum registro permanece do que aconteceu entre eles, no entanto. Se Dassomi havia se oferecido voluntariamente ou simplesmente aberto um portal largo por engano? O resultado permaneceu o mesmo: Sythra abandonou sua ausência de forma e renasceu para o mundo. O Abraço da Serpente foi reanimado.\\n\\nObedecendo à lei da selva, Sythra caça todos aqueles que alegam superioridade — os justos, os puros, os obstinados. Ela desliza para dentro de seus templos e palácios, oferecendo-lhes uma escolha final: submeter-se... ou ser devorado. Sythra aspira ver sua dinastia serpentina erguer-se novamente, presas e glória, coroada em selva e ossos. Ela sonha com cidadelas veadas em hera e veneno, de um mundo onde todos que caminham sobre ele abandonaram a fraqueza, beberam profundamente de seu veneno e emergiram belos no sofrimento.\\n\\nHoje, Sythra continua sendo adorada, embora seus cultos sejam dispersos e secretos, alguns dizem liderados pelo próprio Dassomi. Eles se marcam com presas, deslizam veneno em suas línguas e sonham com êxtase através da dor, em adoração tornada divina. Eles rezam para serem escolhidos para a alimentação — pois ser escolhido é ser visto, ser caçado, ser amado. Ser beijado pela Serpente é sentir o poder enrolar-se em sua alma — abandonar a fraqueza como pele e renascer de novo. Aqueles que sobrevivem à sua mordida tornam-se suas caçadoras: mortais, belas e totalmente devotas.\\n\\nE naquele momento sagrado entre respiração e mordida, quando a flecha paira logo acima do coração, todos sussurrarão a mesma coisa:\\n&quot;Obrigado.&quot;", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Véu de Neve", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "O Veneno Mais Doce", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Heroína: Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Herói: Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "Selecione 1 herói exclusivo do evento para participar do evento. O herói exclusivo selecionado tem uma probabilidade aumentada e é garantido em 200 evocações!", "", ""], ["Item_mItemDesc_31097", "&lt;color=&quot;#eadca2&quot;&gt;Special Summon Offer&lt;/color&gt;\\n\\nGet the necessary materials for Hero Summon", "&lt;color=&quot;#eadca2&quot;&gt;Oferta Especial de Evocação&lt;/color&gt;\\n\\nGanhe os materiais necessários para a Evocação do Herói", "", ""], ["Item_mItemDesc_3334", "&lt;color=&quot;#498a40&quot;&gt;Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).&lt;/color&gt;", "&lt;colo Jungle Master detonates Spectral Plague on enemies. Dealing increased DMG based on the number of Spectral Plague stacks. Enemies with 5 stacks of Spectral Plague will be immediately removed.", "Mestra da Selva detona a Praga Espectral nos inimigos, causando Dano aumentado com base no número de acúmulos de Praga Espectral. Inimigos com 5 acúmulos de Praga Espectral serão removidos imediatamente.", "", ""], ["Skill_mSkillDesc_1908301_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Golpeia com as garras, causando Dano a todos os heróis em 1 casa à frente.", "", ""], ["Skill_mSkillDesc_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Golpeia com as garras, causando Dano a todos os heróis em 1 casa à frente.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Quando a Raposa de Nove Caudas recebe Dano fatal, ela foge do campo de batalha e ativa as caudas no campo para atacar. Quando as caudas são derrotadas, a Raposa de Nove Caudas retorna ao campo de batalha. Após todas as caudas no campo serem derrotadas, a Raposa de Nove Caudas se transforma e evoca um grande número de raposas.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Causa Dano M. à última unidade implantada no campo de batalha, priorizando Protetores.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Causa Dano M. à última unidade implantada no campo de batalha, priorizando Protetores.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt

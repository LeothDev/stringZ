esconhecidos.", "", ""], ["Unit_mDescribe_34100", "An unblockable spectral remnant immune to Control effects.", "Um resquício espectral imbloqueável imune a efeitos de Controle.", "", ""], ["Unit_mDescribe_34102", "Turned from soldiers killed in battle.", "Transformados a partir de soldados mortos em batalha.", "", ""], ["Unit_mDescribe_34103", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "Se sacrifica voluntariamente pelo bem de sua raça, detonando ao encontrar inimigos e causando muito Dano aos inimigos ao redor.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. &lt;color=#ff4500&gt;Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.&lt;/color&gt;", "Transformados e violentos, esses Roedores Mutantes. &lt;color=#ff4500&gt;Ao serem atacados, entram em um frenesi enlouquecido, aumentando sua Vel. de Movimento.&lt;/color&gt;", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Esqueletos guerreiros com machados gigantes movidos pelo ressentimento, tornando seu ataque ainda mais pesado.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "Lançando sua teia, a rainha aranha pode criar várias aranhas pequenas e aumentar seus atributos.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Ele massacra impiedosamente tudo em seu caminho com uma clava enorme.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Um guerreiro maluco vagando na masmorra que gosta de decapitar as pessoas.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Ele massacra impiedosamente tudo em seu caminho com uma clava enorme.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Com seu gigantesco alicate de osso, este protetor canibal impiedoso inflige sangramento hemorrágico em seus inimigos.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Com seu gigantesco alicate de osso, este protetor canibal impiedoso inflige sangramento hemorrágico em seus inimigos.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Um vestígio espectral que não pode ser bloqueado ou desacelerado e precisa ser eliminado rapidamente.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Transformados a partir de soldados mortos em batalha.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Cheios de sacos de ácido, os Suicidas gostam de se enrolar e rolar para a frente.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "Transformados e violentos, esses Roedores Mutantes se movem mais rápido quando atacados.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Esqueletos guerreiros com machados gigantes movidos pelo ressentimento, tornando seu ataque ainda mais pesado.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "No subsolo onde habita, ela é a verdadeira monarca, capaz de criar e controlar aranhas pequenas e aumentar todos os atributos delas em batalha. Sua teia é tão resistente que ninguém pode se soltar facilmente depois de ser preso.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "Eirlys, a sacerdotisa élfica exilada. Cura ferimentos graves com orações, dissipa penalidades, resgata aliados à beira da morte e acelera a Regeneração de Fúria da equipe.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "Uma relíquia do mundo antigo, Sythra, O Abraço do Serpente, vaga pela Selva. Ela evoca Tormentos da Alma para atacar com ferocidade crescente, ignorando DEF para devorar seus inimigos.", "", ""], ["Unit_mHeroDesignation_2209", "Winter&#x27;s Mercy", "Clemência Invernal", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent&#x27;s Embrace", "O Abraço da Serpente", "", ""], ["Unit_mName_17200", "Knight of Destruction", "Cavaleiro da Destruição", "", ""], ["Unit_mName_17218", "Fallen Chopper", "Talhador Caído", "", ""], ["Unit_mName_17219", "Slaughter", "Massacre", "", ""], ["Unit_mName_17221", "Maw", "Maw", "", ""], ["Unit_mName_17222", "Maw", "Maw", "", ""], ["Unit_mName_2209", "Eirlys", "Eirlys", "", ""], ["Unit_mName_2321", "Sythra", "Sythra", "", ""], ["Unit_mName_34100", "Soul Eater", "Devorador de Almas", "", ""], ["Unit_mName_34103", "Suicide", "Suicida", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "Executor Esqueleto", "", ""], ["Unit_mName_37114", "Queen Spider", "Rainha Aranha", "", ""], ["Unit_mName_37115", "Spider Cocoon", "Casulo de Aranha", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "Fica ao meu lado e talvez você consiga sobreviver.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "Diga-me, se você também teme as coisas que deseja?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "Durante nosso evento especial do Saqueador Incansável, você pode realizar 1 Combate Automático e receber recompensas em dobro ao custo de Vigor dobrado. Torne suas batalhas mais eficientes do que nunca!\n\nBônus de Combate Automático\n1. Durante o evento, ao usar Combate Automático em {name2}, os Comandantes podem escolher se desejam ativar o bônus do evento: cada batalha consome {num3} vezes o custo normal de Vigor, mas concede recompensas multiplicadas por {num3}. Isso visa melhorar a eficiência na obtenção de materiais de artefato.\n2. Caso um desafio falhe, o Vigor correspondente será reembolsado.\n3. Durante o evento, se o bônus do evento estiver ativo, as missões de consumo de Vigor serão calculadas com base no Vigor efetivamente consumido.\n4. No entanto, as missões relacionadas ao número de conclusões não serão afetadas pelo bônus do evento.\n5. O bônus do evento só é aplicável a fases que permitem Combate Automático, portanto as Recompensas de Primeira Conclusão não estão incluídas no bônus de recompensas.\n6. Quando o bônus estiver ativo, as recompensas serão geradas com base em cálculos separados, em vez de dobrar o resultado de 1.\n7. Para o evento Conquista de Bravura, a pontuação da Prova do Oráculo na Incursão de Equipamento/Material de Artefato é consistente com as recompensas de equipamento/Meteorito, calculada com base na raridade e quantidade de equipamentos/Meteoritos obtidos após concluir as fases.\n8. Atenção: Durante o bônus, se as fases tiverem probabilidades aleatórias de tokens de evento (como os dados na Odisseia dos Sonhos), esses tokens não serão afetados pelo bônus.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "O Saqueador Incansável já está disponível na Incursão de Material de Artefato. Durante o evento, realizar o Combate Automático custará o dobro de Vigor, mas as recompensas também serão dobradas.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "Probabilidade Aumentada por Tempo Limitado para os Heróis Lendários Numera e Aylin!", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "Probabilidade Aumentada por Tempo Limitado para os Heróis Lendários Vorn e Artemis!", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "Probabilidade Aumentada por Tempo Limitado para os Heróis Lendários Nyx e Malvira!", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "Pacote de Skin Serpente dos Sonhos", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "&quot;Tya&#x27;s Champion&quot; Valkyra", "&quot;Campeã de Tya&quot; da Valkyra", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "&quot;The Hollow Husk&quot; Aracha", "&quot;A Casca Hollow&quot; da Aracha", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "Pacote de Skin da Sythra", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "Jogabilidade da Heroína: Eirlys", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "Jogabilidade da Heroína: Sythra", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;Neste evento de Evocação Divina, as taxas de obtenção de &lt;color=#fdbe36&gt;todos os heróis Lendários&lt;/color&gt; são &lt;color=#b490fc&gt;2&lt;/color&gt; vezes maiores que as taxas originais, e as taxas de obtenção dos seguintes heróis são multiplicadas por &lt;color=#b490fc&gt;20&lt;/color&gt; em comparação com outros heróis da mesma raridade. As taxas de obtenção são iguais entre outros heróis da mesma raridade.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;Neste evento de evocação, quando você obtém um herói Lendário que NÃO está atualmente com Probabilidade Aumentada, a taxa de obter todos os heróis com Probabilidade Aumentada aumentará adicionalmente para suas próximas evocações.&lt;/color&gt; Aqui estão os detalhes:\n1. Na primeira vez que você obtém um herói Lendário que NÃO está com Probabilidade Aumentada, a taxa de obter todos os heróis com Probabilidade Aumentada será multiplicada por &lt;color=#b490fc&gt;10&lt;/color&gt; em suas evocações futuras;\n2. Se você obtiver novamente um herói Lendário que NÃO está com Probabilidade Aumentada, a taxa de obter todos os heróis com Probabilidade Aumentada será multiplicada por &lt;color=#b490fc&gt;10&lt;/color&gt; novamente. Esse bônus acumulativo permanecerá ativo até você conseguir evocar qualquer herói com Probabilidade Aumentada.\n&lt;color=#91887c&gt;*A taxa de obtenção mencionada acima se refere à probabilidade relativa dos heróis com probabilidade aumentada em comparação com outros heróis.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Nota: Este Timer da Clemência é ativado APENAS uma vez durante este evento.&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "+<span style=\"color: #1e8852;\">8</span> de Efeito de Cura", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "+<span style=\"color: #1e8852;\">1</span> de Regeneração de Fúria (Auto)", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -<span style=\"color: #1e8852;\">2</span>", "-<span style=\"color: #1e8852;\">2</span> de Custo", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +<span style=\"color: #1e8852;\">300</span>", "+<span style=\"color: #1e8852;\">300</span> de ATQ", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "+<span style=\"color: #1e8852;\">8%</span> de Penetração", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "Até os raios mais tênues dissipam a escuridão.", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "A luz cresce onde ousamos nutri-la.", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "Embora Tempestades se formem no horizonte, escolho acreditar.", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "Não se submeta a profecias, pois a verdadeira essência jaz em seu interior.", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "Tudo será desvelado perante a luz.", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "Estas presas estão começando a afiar...", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "A cada pele que mudo, torno-me algo mais.", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "Ajoelhe-se, cão miserável... Estou além da divindade.", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "Não existe antídoto para o meu poder.", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent's will!", "Não existe caos, não existe ordem... apenas o império da serpente!", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "Aumento de Dano", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "Sopro Sereno", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "Oração de Cura", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "Oração de Cura", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "Oração de Cura", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "Oração de Cura", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "Oração de Cura", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "Tormento da Alma", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "Tormento da Alma", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "Tormento da Alma", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "Tormento da Alma", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "Tormento da Alma", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "+{20,num/100}% de Dano (Entra em efeito somente quando mais forte que o atual reforço/penalidade no mesmo atributo.)", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "Ganha um escudo igual a {30,num}% de ATQ por segundo, acumulando até {31,num}% de ATQ.", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "Dissipa 1 penalidade a cada 2 seg. Quando Eirlys cura aliados com Sopro Sereno, ganha um bônus adicional de cura de {30,num}%. Até 2 aliados com Sopro Sereno podem estar no campo.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Quando o HP do portador cai abaixo de {30,num}%, restaura imediatamente o HP equivalente a {31,num}% do ATQ do usuário e remove este efeito. Quando a duração do efeito terminar naturalmente ou for atualizada, restaura o HP equivalente a {32,num}% do ATQ do usuário para o portador. Este efeito não pode ser dissipado.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "Causa Dano M. em Área 1 vez a até {31,num} inimigos à frente, incluindo unidades aéreas, e Investida Poderosa inflige {32,num}% de Vulnerabilidade (Dano M.) nos inimigos por {33,num} seg.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "A Lança Flamejante ignora {30,num}% da DEF do inimigo. O Anel Universal ricocheteia {31,num} vez(es) adicional(is) e pode atingir o mesmo alvo várias vezes. A Lâmina Yin-Yang executa monstros comuns com HP abaixo de {32,num}%.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rapidamente contra 1 inimigo dentro do Alcance de ATQ do seu dono, inicialmente podendo atirar {30,num} vez(es) e causando {31,num}% de Dano cada vez. O Tormento da Alma perece após todos os disparos serem usados. Prioriza alvos no ar. A flecha recupera uma contagem de retorno cada vez que atinge um alvo caído. Até {32,num} podem existir no campo.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rapidamente contra 1 inimigo dentro do Alcance de ATQ do seu dono, inicialmente podendo atirar {30,num} vez(es) e causando {31,num}% de Dano cada vez. O Tormento da Alma perece após todos os disparos serem usados. Prioriza alvos no ar. A flecha recupera uma contagem de retorno cada vez que atinge um alvo caído. Até {32,num} podem existir no campo.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rapidamente contra 1 inimigo dentro do Alcance de ATQ do seu dono, inicialmente podendo atirar {30,num} vez(es) e causando {31,num}% de Dano cada vez. O Tormento da Alma perece após todos os disparos serem usados. Prioriza alvos no ar. A flecha recupera uma contagem de retorno cada vez que atinge um alvo caído. Até {32,num} podem existir no campo.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rapidamente contra 1 inimigo dentro do Alcance de ATQ do seu dono, inicialmente podendo atirar {30,num} vez(es) e causando {31,num}% de Dano cada vez. O Tormento da Alma perece após todos os disparos serem usados. Prioriza alvos no ar. A flecha recupera uma contagem de retorno cada vez que atinge um alvo caído. Até {32,num} podem existir no campo.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Dispara rapidamente contra 1 inimigo dentro do Alcance de ATQ do seu dono, inicialmente podendo atirar {30,num} vez(es) e causando {31,num}% de Dano cada vez. O Tormento da Alma perece após todos os disparos serem usados. Prioriza alvos no ar. A flecha recupera uma contagem de retorno cada vez que atinge um alvo caído. Até {32,num} podem existir no campo.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participe da Incursão de Equipamento I para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Participe da Incursão de Equipamento II para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Participe da Incursão de Equipamento III para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Evoque heróis para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "Suba de nível/melhore o nível de estrelas/promova heróis ou aprimore as habilidades dos heróis para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Participe da Incursão de Material de Artefato para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Participe da Incursão de Equipamento I para ganhar troféus e resgatar recompensas.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Classificação Suprema da Chegada dos Heróis", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "O Legado Perdido", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Cofre nas Areias", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Palácio Esquecido", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Chegada dos Heróis", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Treinamento do Herói", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Mistério dos Artefatos", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "O Legado Perdido", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Capítulo da História", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Capítulo do Desafio", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "IP de Domínio Público", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Invasão de Zumbis", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Trocando de canais...", "", ""], ["CommonText_mMessage_24292", "Challenges", "Desafios", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">Pedras-Chave de Teste</span><br>As Pedras-Chave de Teste podem ser obtidas em vários modos de jogo. Estas Pedras-chave vêm em diferentes tipos e níveis, cada uma contendo Inscrições Antigas únicas. Insira-as no altar para abrir caminhos para os testes correspondentes. <br><br><span style=\"color: #cec2b1;\">Regras do Desafio</span><br>Cada batalha consiste em múltiplas ondas de monstros. Derrotar cada onda recompensa você com um baú de tesouro. Após iniciada, a batalha não pode ser reiniciada. Se você sair no meio da batalha, as recompensas serão determinadas com base no seu progresso atual. Você pode consumir até 200 Pedras-Chave por mês para desafios de teste. Quando este limite for atingido, não será possível realizar mais desafios naquele mês.<br><br><span style=\"color: #cec2b1;\">Energia da Pedra-Chave</span><br>Cada pedra-chave possui Energia específica. <span style=\"color: #fdbe36;\">1 Energia é consumida por tentativa de Teste.</span> Quando a batalha termina, se a Pedra-chave ainda tiver Energia restante, você pode escolher desistir das recompensas e sair, então consumir Energia novamente para reiniciar o teste. O consumo de Energia não conta para o limite mensal de Pedras-Chave.<br><br><span style=\"color: #cec2b1;\">Destruir Pedra-Chave</span><br>Você pode destruir Pedras-Chave que atendam aos requisitos de nível de destruição. Destruir pedras-chave não rende recompensas e não conta para o limite mensal de consumo de Pedra-Chave.<br><span style=\"color: #fd4540;\">As Pedras-Chave de Teste têm um limite de armazenamento. Uma vez cheio, você não poderá obter mais pedras-chave. Por favor, use-as regularmente para manter espaço disponível.</span>", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Cristal Musgoso", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Cristal Derretido", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Após iniciar uma batalha, ela não poderá ser reiniciada. Se sair durante a batalha, ela será encerrada imediatamente e a Energia consumida não será devolvida!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Uma região vulcânica onde a lava surge durante o apocalipse. Mais heróis de plataforma são necessários para repelir as forças malignas apocalípticas.", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">Tem certeza de que deseja demitir este jogador da posição de Marechal?</span><br>Cada Guilda pode ter até {num1} Marechais, cada um ganhando {num2} ataque(s) adicional(is) por rodada.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Pontos da Rodada", "", ""], ["CommonText_mMessage_26126", "Destroy", "Destruir", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Prosseguir com a destruição de {name}?<br><span style=\"color: #fd4540;\">Pedras-Chave destruídas não podem ser recuperadas e não concederão nenhum item.</span>", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "A Pedra-Chave foi destruída.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Energia:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Desistir e sair", rentes marcadores das Pedras-Chave. Deseja prosseguir com o Combate Automático?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Deseja enviar esta batalha como um novo registro de Combate Automático?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "Devido aos marcadores variáveis das Pedras-Chave, recomendamos selecionar a formação mais abrangente possível ao enviar o Combate Automático!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "O armazém de Pedras-Chave está cheio. Use algumas Pedras-Chave antes de comprar mais.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Limpar", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "Baús aleatórios de Pedras-Chave fechados foram detectados em seu Armazém. Deseja abri-los agora?", "", ""], ["CommonText_mMessage_26154", "Go", "Ir", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Nv. {num1} a {num2}", "", ""], ["CommonText_mMessage_26156", "This level's Keystone cannot be destroyed.", "A Pedra-Chave deste nível não pode ser destruída.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Tem certeza que deseja destruir <span style=\"color: #fd4540;\">{num}</span> Pedra(s)-chave?<br><span style=\"color: #fd4540;\">As Pedras-chave destruídas não podem ser recuperadas e não concederão nenhum item.</span>", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "Pedra(s)-Chave Destruída(s) {num}.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Uso Mensal:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "As Pedras-Chave têm um limite mensal de desafios. Após atingir esse limite, nenhuma tentativa adicional será permitida.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "A dificuldade atual possui recompensas para reivindicar. Tem certeza de que deseja tentar uma dificuldade diferente?<br><span style=\"color: #e04242;\">Durante o evento, você só pode escolher uma dificuldade por dia para reivindicar recompensas.</span>", "", ""], ["CommonText_mMessage_26162", "Don't remind me again.", "Não me lembre novamente.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "O armazém de Pedras-Chave está cheio. Por favor, use algumas antes de desbloquear mais.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "A versão da reprodução não corresponde à versão atual e não pode ser visualizada.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Insira até {num} caractere(s).", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Heróis Populares", "", ""], ["CommonText_mMessage_26167", "Tag", "Etiqueta", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Armazém de Pedras-Chave de Teste Cheio", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "Reduz a Velocidade de Movimento do Devorador de Almas em 30 pontos. Ele é <span style=\"color: #fd4540;\">imune a Desacelerar</span>.", "", ""], ["Difficulty_mDetail_73003", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "O Erudito da Torre Branca entra em estado de <span style=\"color: #fd4540;\">Invisibilidade</span> e fica visível quando bloqueado.", "", ""], ["Difficulty_mDetail_73004", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "O Erudito da Torre Branca se torna <span style=\"color: #fd4540;\">imune ao Dano M.</span>", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "O Aracnídeo Pequeno ganha <span style=\"color: #fd4540;\">efeito Obstinado</span> por 3 seg. ao morrer e se torna <span style=\"color: #fd4540;\">imune a Controle e Desacelerar</span>.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "O Aracnídeo Pequeno <span style=\"color: #fd4540;\">recupera 50% de HP</span> a cada 5 seg.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "A Velocidade de Movimento do Guarda do Raio é <span style=\"color: #fd4540;\">aumentada em 30</span> pontos.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is <span style=\"color: #fd4540;\">immune to DMG taken</span>, but loses 5% HP per sec.", "Guarda do Raio é <span style=\"color: #fd4540;\">imune ao Dano recebido</span>, mas perde 5% de HP por seg.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace's Fatigue becomes <span style=\"color: #fd4540;\">permanent</span>.", "A Fadiga do Murkling Perigoso se torna <span style=\"color: #fd4540;\">permanente</span>.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is <span style=\"color: #fd4540;\">immune to CC Effects</span>.", "O Komodo Encouraçado é <span style=\"color: #fd4540;\">imune a Efeitos de CG</span>.", "", ""], ["Difficulty_mDetail_73011", "Plated Komod da Areia aparece em posições fixas na batalha.", "", ""], ["Difficulty_mStrategyDesc_7025", "Healing Fly appears at fixed positions in battle.", "A Mosca de Cura aparece em posições fixas na batalha.", "", ""], ["Difficulty_mStrategyDesc_7028", "Twisted Sycophant appears at fixed positions in battle.", "O Admirador Distorcido aparece em posições fixas na batalha.", "", ""], ["Difficulty_mStrategyDesc_7031", "Thunder Beacon appears at fixed positions in battle.", "O Sinal do Trovão aparece em posições fixas na batalha.", "", ""], ["Difficulty_mStrategyDesc_7101", "Golden Guard appears randomly on the battlefield each wave.", "O Guarda Dourado aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "O Golem Gigante aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "O Arqueiro Esqueleto aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "A Sacerdotisa da Chuva aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "O Guardião Dourado aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "O Inquisidor Dourado aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "O Suicida aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "A Mão da Areia aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "A Mosca de Cura aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "O Admirador Distorcido aparece aleatoriamente no campo de batalha a cada onda.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "(3 peças) Ao lançar um Acerto Crít. com o ATQ Básico, aumenta o Dano do herói em 10% por 8 seg., acumulando até 5 vezes.", "", ""], ["HeroStory_mStory_2209", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "\"Ela caminha como uma memória que ainda não mereci, mas pela qual eternamente anseio.\"<br>-Rivenhald<br><br>Enviaram-na ao norte, onde o manto gélido sobre sua fronte poderia dobrá-la novamente à causa deles.<br><br>Outrora sacerdotisa de Elyndris, Eirlys permanecia no coração de ritos ancestrais, sua voz entrelaçada ao suspiro dos deuses. Mas algo se fragmentou. Ela fez uma escolha que ninguém ousou nomear, e o santuário jamais a perdoaria com facilidade.<br><br>A cidade Élfica passou meses lambendo suas feridas após as chamas da agressão de Moriden. Embora a maré invasora tivesse sido repelida, as cicatrizes persistiram e, com elas, uma revelação aterrorizante: eles não eram mais intocáveis. Suas torres haviam rachado. Seus mitos haviam sangrado. Elyndris precisava de sombras para se moverem onde estandartes não podiam alcançar. Então os videntes voltaram seu olhar para fora. Silenciosamente. Meticulosamente. Buscando lugares além dos mapas antigos, onde os seus poderiam se refugiar se a guerra retornasse.<br><br>O Norte de Tya, desolado e austero, emergiu em suas profecias como uma lâmina cortando através da neve. Conheciam Harz, mas não ousavam buscar conflito com alguém de sua reputação. Rivenhald, no entanto, governava nas regiões glaciais desconhecidas para seus batedores - um Senhor da Guerra em tudo menos no título, um monarca que não se curvava a nenhuma coroa além da própria. Precisavam compreendê-lo. Saber se sua força poderia ser subvertida. Ou, se necessário, quão facilmente poderia ser despedaçada.<br><br>Eirlys foi a resposta deles. Sem aliados, ela não era nem diplomata nem espiã, mas algo mais sutil. Foi enviada com meias verdades e um juramento sagrado: conquistar a confiança dele, decifrar sua alma e relatar o que não pode ser vislumbrado à distância. Chegou envolta em branco, sua presença justificada como pacificadora. Uma curandeira errante. Uma sacerdotisa da geada. E Rivenhald, que não confiava em ninguém, depositou sua confiança nela.<br><br>Ela se fez indispensável. Tratou feridas, interpretou presságios, não deixou rastros de segundas intenções. Ele a observava. Ela sustentava o olhar. Nenhum dos dois piscava.<br><br>As fronteiras entre eles se dissolveram com o tempo, entrelaçando-se mas permanecendo inquebráveis. Ela passou a conhecer seus silêncios, a natureza de sua fúria, a estranha misericórdia que ele sepultava sob tudo isso. À noite, quando o fogo crepitava baixo e nenhuma mensagem podia ser enviada, ela por vezes vislumbrava um futuro onde ele quase poderia ser digno de confiança - onde ele poderia significar mais para ela... mas a aurora sempre consumia o devaneio.<br><br>Como Rivenhald, ela também sonha com o desfecho: duas silhuetas na neve, impassíveis e obstinadas. Uma lâmina deve cair. Uma causa deve se extinguir. E na névoa de sangue antes que o vento leve tudo embora, compreenderão o custo da sobrevivência... e quem realmente são um para o outro.<br><br>Mas Eirlys sabe o que os videntes de Elyndris nunca lhe revelaram. O Norte não pertence a ninguém. Nem a reis. Nem a cidades. E certamente não a fantasmas como ela. Qualquer futuro que os aguarde não será edificado sobre confiança, mas sobre o que sobrevive após tudo consumir.<br><br>Ela é o silêncio entre duas tempestades, aguardando a hora em que uma deve despedaçar a outra.", "", ""], ["HeroStory_mStory_2321", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "\"Você implorará para ser devorado. E eu serei misericordiosa.\"<br>—Sibilado da folhagem<br><br>Nas selvas de jade de Tya, onde as raízes bebem sangue e as árvores estrangulam os vivos, uma vez rastejou um espírito de veneno e sombra — uma serpente conhecida apenas em sussurros como Sythra, embora naqueles dias, ela não tivesse carne própria. Apenas presas, fome e a memória de um nome.<br><br>O Império dos Escamosos, uma civilização antiga cujas cidades de obsidiana uma vez dividiram o dossel e separaram os vales, há muito havia desaparecido na expansão verdejante. No entanto, em sua hora final, derramaram sua última magia em ídolos imponentes — estátuas de criaturas poderosas esculpidas com devoção, pintadas em ocre e cinzas, deixadas como oferendas aos espíritos da selva, na esperança de que suas súplicas fossem atendidas.<br><br>Infelizmente, houve apenas silêncio.<br><br>Quando a metrópole desmoronou, no entanto, engolida inteira pela investida da folhagem, esses ídolos perduraram — velados em musgo, meio consumidos, mas vivos com ecos inquietos. De fato, espíritos habitavam essas figuras, almas dos vivos oferecidas como presentes aos espíritos da selva, acorrentadas pela feitiçaria dos escamosos. Os errantes desavisados e ingênuos deste labirinto folhoso que se deparavam com tais figuras encontravam um fim rápido, pois eram, na verdade, altares sacrificiais, capazes de conjurar divindades poderosas. Sythra era uma dessas divindades, uma deusa serpentina e vestígio do antigo império, um silvo que serpenteava nas mentes dos fracos de vontade e dos feridos.<br><br>E ainda assim, ela permanecia apenas espírito — até Dassomi encontrá-la.<br><br>O famoso místico Escamoso acreditava muito que os sonhos eram uma ponte para verdades maiores. Buscando sabedoria perdida em cantos esquecidos do mundo, Dassomi veio para a selva, seguindo visões de serpentes e altares, atraído a um templo coberto de vegetação como um sonho profundo meio lembrado. Lá, no coração daquela ruína, ele queimou incenso e deslizou entre mundos e Sythra respondeu.<br><br>Nenhum registro permanece do que aconteceu entre eles, no entanto. Se Dassomi havia se oferecido voluntariamente ou simplesmente aberto um portal largo por engano? O resultado permaneceu o mesmo: Sythra abandonou sua ausência de forma e renasceu para o mundo. O Abraço da Serpente foi reanimado.<br><br>Obedecendo à lei da selva, Sythra caça todos aqueles que alegam superioridade — os justos, os puros, os obstinados. Ela desliza para dentro de seus templos e palácios, oferecendo-lhes uma escolha final: submeter-se... ou ser devorado. Sythra aspira ver sua dinastia serpentina erguer-se novamente, presas e glória, coroada em selva e ossos. Ela sonha com cidadelas veadas em hera e veneno, de um mundo onde todos que caminham sobre ele abandonaram a fraqueza, beberam profundamente de seu veneno e emergiram belos no sofrimento.<br><br>Hoje, Sythra continua sendo adorada, embora seus cultos sejam dispersos e secretos, alguns dizem liderados pelo próprio Dassomi. Eles se marcam com presas, deslizam veneno em suas línguas e sonham com êxtase através da dor, em adoração tornada divina. Eles rezam para serem escolhidos para a alimentação — pois ser escolhido é ser visto, ser caçado, ser amado. Ser beijado pela Serpente é sentir o poder enrolar-se em sua alma — abandonar a fraqueza como pele e renascer de novo. Aqueles que sobrevivem à sua mordida tornam-se suas caçadoras: mortais, belas e totalmente devotas.<br><br>E naquele momento sagrado entre respiração e mordida, quando a flecha paira logo acima do coração, todos sussurrarão a mesma coisa:<br>\"Obrigado.\"", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Véu de Neve", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "O Veneno Mais Doce", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Heroína: Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Herói: Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaranteed within 200 summons!", "Selecione 1 herói exclusivo do evento para participar do evento. O herói exclusivo selecionado tem uma probabilidade aumentada e é garantido em 200 evocações!", "", ""], ["Item_mItemDesc_31097", "<span style=\"color: #eadca2;\">Special Summon Offer</span><br><br>Get the necessary materials for Hero Summon", "<span style=\"color: #eadca2;\">Oferta Especial de Evocação</span><br><br>Ganhe os materiais necessários para a Evocação do Herói", "", ""], ["Item_mItemDesc_3334", "<span style=\"color: #498a40;\">Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).</span>", "<span style=\"color: #498a40;\">Borda de Avatar Exclusiva da Classificação Suprema da Chegada dos Heróis (Temporada Serpentífera).</span>", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen's Clues 1-5.", "Pista Desconhecida de Erlang Shen. Quando obtida, será automaticamente convertida em uma aleatória entre as Pistas 1-5 de Erlang Shen.", "", ""], ["Item_mItemDesc_3521", "Erlang Shen's Clue 2.<br><span style=\"color: #498a40;\">Usage: Consume this item via Fate's Chapters to unlock the corresponding clue.</span>", "Pista 2 de Erlang Shen.<br><span style=\"color: #498a40;\">Uso: Consuma este item via Capítulos do Destino para desbloquear a pista correspondente.</span>", "", ""], ["Item_mItemDesc_3522", "Erlang Shen's Clue 3.<br><span style=\"color: #498a40;\">Usage: Consume this item via Fate's Chapt

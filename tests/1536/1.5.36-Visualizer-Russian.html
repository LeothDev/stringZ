            rawData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +&lt;color=&quot;#1e8852&quot;&gt;8&lt;/color&gt;", "Эффект исцеления +&lt;color=&quot;#1e8852&quot;&gt;8&lt;/color&gt;", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +&lt;color=&quot;#1e8852&quot;&gt;1&lt;/color&gt;", "Автовосст. ярости +&lt;color=&quot;#1e8852&quot;&gt;1&lt;/color&gt;", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -&lt;color=&quot;#1e8852&quot;&gt;2&lt;/color&gt;", "Стоимость -&lt;color=&quot;#1e8852&quot;&gt;2&lt;/color&gt;", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +&lt;color=&quot;#1e8852&quot;&gt;300&lt;/color&gt;", "АТК +&lt;color=&quot;#1e8852&quot;&gt;300&lt;/color&gt;", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +&lt;color=&quot;#1e8852&quot;&gt;8%&lt;/color&gt;", "Пробивание +&lt;color=&quot;#1e8852&quot;&gt;8%&lt;/color&gt;", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "Даже самый слабый луч развеет мрак.", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "Свет набирает силу в руках храбрецов.", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "Пусть тучи и сгущаются вдали, моя вера непоколебима.", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "Не ищите истину в пророчествах – она живет в вашем сердце.", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "Свет озарит все сущее.", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "Мои клыки становятся острее...", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "С каждой сброшенной кожей я становлюсь совершеннее.", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "На колени, ничтожество... Я превзошла само божество!", "", ""] е боя может находиться до 2 союзников с эффектом «Безмятежное дыхание».", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "Наносит масс. маг. УРН 1 раз нескольким (до {31,num}) врагам впереди, включая цели в воздухе. «Могущественный удар» накладывает на врагов {32,num}% уязвимости (маг. УРН) на {33,num} сек.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy&#x27;s DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "«Огненное копье» игнорирует {30,num}% ЗАЩ врага. «Кольцо Вселенной» отскакивает доп. {31,num} р. и может несколько раз поразить одну и ту же цель. «Клинок инь-ян» казнит обычных монстров с ОЗ ниже {32,num}%.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Проходите рейд для снаряжения I, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Проходите рейд для снаряжения II, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Проходите рейд для снаряжения III, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Призывайте героев, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes&#x27; skills to win trophies and redeem rewards.", "Повышайте ур./кол-во звезд героев, продв. их и улучшайте их навыки, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Проходите рейд для материалов артефактов, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Проходите рейд для снаряжения I, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Супертаблица лидеров «Прибытие героев»", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "Потерянное наследие", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Сокровищница в песках", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Забытый дворец", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Прибытие героев", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Тренировка героев", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Тайна артефактов", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "Потерянное наследие", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Глава истории", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Глава испытания", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "Общедоступная ИС", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Вторжение зомби", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Переключение каналов...", "", ""], ["CommonText_mMessage_24292", "Challenges", "Испытания", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;Ключи испытаний&lt;/color&gt;\\nКлючи испытаний можно получить в различных игровых режимах. Эти ключи бывают разных типов и уровней, каждый содержит уникальные древние надписи. Поместите их в алтарь, чтобы открыть пути к соответствующим испытаниям. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Правила испытания&lt;/color&gt;\\nКаждая битва состоит из нескольких волн монстров. За победу над каждой волной вы получаете сундук с наградами. После начала битвы ее невозможно перезапустить. Если вы выйдете в процессе, награды будут рассчитаны исходя из текущего прогресса битвы. Вы можете расходовать до 200 ключей в месяц для прохождения испытаний. По достижении этого лимита в текущем месяце новые испытания проходить будет нельзя.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Энергия ключа&lt;/color&gt;\\nКаждый ключ обладает определенным запасом энергии. &lt;color=&quot;#fdbe36&quot;&gt;1 единица энергии расходуется за одну попытку испытания.&lt;/color&gt; Если после окончания битвы у ключа осталась энергия, вы можете отказаться от наград и уйти, а затем снова расходовать энергию для перезапуска испытания. Расход энергии не учитывается в ежемесячном лимите ключей.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Уничтожение ключа&lt;/color&gt;\\nВы можете уничтожать ключи, соответствующие требованиям уровня уничтожения. Уничтожение ключей не дает наград и не учитывается в ежемесячном лимите расхода ключей.\\n&lt;color=&quot;#fd4540&quot;&gt;Инвентарь ключей испытаний ограничен. Когда он заполнится, вы не сможете получать новые ключи. Регулярно используйте ключи, чтобы освобождать место.&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Замшелый кристалл", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Расплавленный кристалл", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "После начала битвы ее нельзя перезапустить. Выход в процессе боя приведет к немедленному расчету, а израсходованная энергия не будет возвращена!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Вулканическая область, где лава вздымается во время апокалипсиса. Требуется больше героев на возвышениях, чтобы отразить силы зла апокалипсиса.", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;Вы уверены, что хотите снять этого игрока с должности маршала?&lt;/color&gt;\\nВ каждой гильдии может быть до {num1} маршалов, каждый из которых получает несколько ({num2}) доп. атак за раунд.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Очки раунда", "", ""], ["CommonText_mMessage_26126", "Destroy", "Уничтожить", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "{name}: точно уничтожить?\\n&lt;color=&quot;#fd4540&quot;&gt;Уничтоженные ключи нельзя восстановить, и вы не получите за них никаких предметов.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "Ключ уничтожен.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Энергия:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Отказаться и выйти", "", ""], ["CommonText_mMessage_26131", "Claim", "Получить", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Оставшаяся энергия ключа:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Галерея сражений", "", ""], ["CommonText_mMessage_26134", "Guides", "Руководства", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Появляющийся ключ:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Замшелый кристалл", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Расплавленный кристалл", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Показывать только метки текущего ключа", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Список популярных героев составляется на основе частоты выбора и приводится только для справки.", "", ""], ["CommonText_mMessage_26140", "Search", "Поиск", "", ""], ["CommonText_mMessage_26141", "Search Results", "Результаты поиска", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Загрузка данных...", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Сбор данных о герое", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Введите не менее {num} симв.", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "Подходящие метки не найдены.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "Автобитва недоступна для текущего уровня ключа.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Вы сможете загрузить записи автобитвы после прохождения волны {num} вручную.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "Автобитва может провалиться из-за разных меток ключа. Все равно продолжить?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Сохранить этот бой как новую запись автобитвы?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "Из-за разных меток ключей мы рекомендуем выбрать наиболее полный состав для загрузки автобитвы!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "Инвентарь ключей заполнен. Используйте ключи, прежде чем покупать новые.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Очистить", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "В вашем инвентаре обнаружены неоткрытые сундуки со случайными ключами. Хотите открыть их сейчас?", "", ""], ["CommonText_mMessage_26154", "Go", "Вперед", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Ур. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level&#x27;s Keystone cannot be destroyed.", "Ключ данного уровня нельзя уничтожить.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy &lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt; Keystone(s)?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "Вы уверены, что хотите уничтожить ключ x&lt;color=&quot;#fd4540&quot;&gt;{num}&lt;/color&gt;?\\n&lt;color=&quot;#fd4540&quot;&gt;Уничтоженные ключи нельзя восстановить, и вы не получите за них никаких предметов.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "Уничтожены ключи: {num}.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Использовано за месяц:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Ключи имеют ежемесячный лимит испытаний. По достижении лимита дальнейшие попытки становятся недоступны.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?\\n&lt;color=&quot;#e04242&quot;&gt;During the event, you can only choose one difficulty per day to claim rewards.&lt;/color&gt;", "На текущем уровне сложности есть доступные для получения награды. Вы уверены, что хотите попробовать другой уровень сложности?\\n&lt;color=&quot;#e04242&quot;&gt;Во время события вы можете выбрать только один уровень сложности в день для получения наград.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26162", "Don&#x27;t remind me again.", "Больше не напоминать.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "Инвентарь ключей заполнен. Пожалуйста, израсходуйте несколько, прежде чем разблокировать новые.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "Версия записи не соответствует текущей версии и не может быть просмотрена.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Введите не более {num} симв.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Популярные герои", "", ""], ["CommonText_mMessage_26167", "Tag", "Метка", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Хранилище ключей испытаний заполнено", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater&#x27;s Movement Spd. by 30. They are &lt;color=&quot;#fd4540&quot;&gt;immune to Slow&lt;/color&gt;.", "Снижает скорость перемещения пожирателя душ на 30. Пожиратель душ &lt;color=&quot;#fd4540&quot;&gt;невосприимчив к замедлению&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73003", "White Tower&#x27;s Scholar enters &lt;color=&quot;#fd4540&quot;&gt;Invisibility&lt;/color&gt; and becomes visible when blocked.", "Мудрец из Белой башни входит в состояние &lt;color=&quot;#fd4540&quot;&gt;невидимости&lt;/color&gt; и становится видимым при блокировке.", "", ""], ["Difficulty_mDetail_73004", "White Tower&#x27;s Scholar becomes &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "Мудрец из Белой башни получает &lt;color=&quot;#fd4540&quot;&gt;невосприимчивость к маг. УРН&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains &lt;color=&quot;#fd4540&quot;&gt;unyielding effect&lt;/color&gt; for 3 sec upon death and becomes &lt;color=&quot;#fd4540&quot;&gt;immune to Control and Slow&lt;/color&gt;.", "После смерти маленький арахнид получает &lt;color=&quot;#fd4540&quot;&gt;эффект «Несгибаемость»&lt;/color&gt; на 3 сек. и становится &lt;color=&quot;#fd4540&quot;&gt;невосприимчивым к контролю и замедлению&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid &lt;color=&quot;#fd4540&quot;&gt;restores 50% HP&lt;/color&gt; every 5 sec.", "Маленький арахнид &lt;color=&quot;#fd4540&quot;&gt;восстанавливает 50% ОЗ&lt;/color&gt; каждые 5 сек.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "&lt;color=&quot;#fd4540&quot;&gt;Скорость перемещения стража молний повышена на 30.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is &lt;color=&quot;#fd4540&quot;&gt;immune to DMG taken&lt;/color&gt;, but loses 5% HP per sec.", "Страж молний &lt;color=&quot;#fd4540&quot;&gt;невосприимчив к получаемому УРН&lt;/color&gt;, но теряет 5% ОЗ в секунду.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace&#x27;s Fatigue becomes &lt;color=&quot;#fd4540&quot;&gt;permanent&lt;/color&gt;.", "Эффект «Усталость» грозы глубин становится &lt;color=&quot;#fd4540&quot;&gt;постоянным&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is &lt;color=&quot;#fd4540&quot;&gt;immune to CC Effects&lt;/color&gt;.", "Защищенный варан &lt;color=&quot;#fd4540&quot;&gt;невосприимчив к эффектам масс. контроля&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction &lt;color=&quot;#fd4540&quot;&gt;when blocked&lt;/color&gt;.", "Защищенный варан получает дополнительно 30% сниж. физ. и маг. УРН &lt;color=&quot;#fd4540&quot;&gt;при блокировании&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;summons an extra&lt;/color&gt; Ice Vermin.", "Морозный клерик &lt;color=&quot;#fd4540&quot;&gt;призывает дополнительного&lt;/color&gt; ледяного вредителя.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric &lt;color=&quot;#fd4540&quot;&gt;spawns&lt;/color&gt; 3 Ice Vermin &lt;color=&quot;#fd4540&quot;&gt;upon death&lt;/color&gt;.", "Морозный клерик &lt;color=&quot;#fd4540&quot;&gt;призывает&lt;/color&gt; 3 ледяных вредителя &lt;color=&quot;#fd4540&quot;&gt;при гибели&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. +50&lt;/color&gt;.", "Страж грома прекращает атаковать и получает &lt;color=&quot;#fd4540&quot;&gt;+50 к скорости перемещения&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard&#x27;s &lt;color=&quot;#fd4540&quot;&gt;ATK is increased by 100%&lt;/color&gt;, but &lt;color=&quot;#fd4540&quot;&gt;when attacking shields&lt;/color&gt;, deducts 50% of its HP.", "&lt;color=&quot;#fd4540&quot;&gt;АТК стража грома повышена на 100%&lt;/color&gt;, но &lt;color=&quot;#fd4540&quot;&gt;при атаке щитов&lt;/color&gt; он теряет 50% своих ОЗ.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is &lt;color=&quot;#fd4540&quot;&gt;immune to M. DMG&lt;/color&gt;.", "Туманный мертвый глаз &lt;color=&quot;#fd4540&quot;&gt;невосприимчив к маг. УРН&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores &lt;color=&quot;#fd4540&quot;&gt;10% HP&lt;/color&gt; with each ATK.", "Туман: барон Салем восстанавливает &lt;color=&quot;#fd4540&quot;&gt;10% ОЗ&lt;/color&gt; при каждой АТК.", "", ""], ["Difficulty_mDetail_73018", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;Cooldown is reduced by 100%&lt;/color&gt;.", "&lt;color=&quot;#fd4540&quot;&gt;Перезарядка «Ускоренного создания» инкубатора снижается на 100%.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73019", "Incubator&#x27;s Accelerated Incubation &lt;color=&quot;#fd4540&quot;&gt;spawns 2 extra Suicides&lt;/color&gt;.", "«Ускоренное создание» инкубатора &lt;color=&quot;#fd4540&quot;&gt;призывает 2 доп. самоубийц&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;drains 10% of the target&#x27;s Rage&lt;/color&gt;.", "При нанесении УРН цели жрец грома &lt;color=&quot;#fd4540&quot;&gt;поглощает 10% ярости цели&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder &lt;color=&quot;#fd4540&quot;&gt;permanently reduces their Max HP by 10%&lt;/color&gt;. This effect can be stacked.", "При нанесении УРН цели жрец грома &lt;color=&quot;#fd4540&quot;&gt;навсегда снижает ее макс. ОЗ на 10%&lt;/color&gt;. Этот эффект может складываться.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces &lt;color=&quot;#fd4540&quot;&gt;healing&lt;/color&gt; received by &lt;color=&quot;#fd4540&quot;&gt;all units in range&lt;/color&gt; by 50%.", "Скверна снижает &lt;color=&quot;#fd4540&quot;&gt;исцеление&lt;/color&gt;, получаемое &lt;color=&quot;#fd4540&quot;&gt;всеми юнитами в пределах дальности&lt;/color&gt;, на 50%.", "", ""], ["Difficulty_mDetail_73023", "Scourge&#x27;s DMG range expands to &lt;color=&quot;#fd4540&quot;&gt;adjacent 2 tiles&lt;/color&gt;.", "Пределы дальности УРН Скверны расширяются до &lt;color=&quot;#fd4540&quot;&gt;2 соседних плиток&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to &lt;color=&quot;#fd4540&quot;&gt;blocked targets&lt;/color&gt;.", "Когда туман: высший смотритель Бездны погибает, он наносит маг. УРН, равный 100% АТК, &lt;color=&quot;#fd4540&quot;&gt;заблокированным целям&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes &lt;color=&quot;#fd4540&quot;&gt;unblockable&lt;/color&gt;.", "Чумная крыса-мутант становится &lt;color=&quot;#fd4540&quot;&gt;неблокируемой&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent &lt;color=&quot;#fd4540&quot;&gt;increases Movement Spd. by 30&lt;/color&gt;.", "Чумная крыса-мутант &lt;color=&quot;#fd4540&quot;&gt;повышает скорость перемещения на 30&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "За каждые 20% ОЗ, которые теряет барон Салем, он &lt;color=&quot;#fd4540&quot;&gt;повышает ЗАЩ и сопр. магии на 20%&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster&#x27;s &lt;color=&quot;#fd4540&quot;&gt;Movement Spd. is increased by 30&lt;/color&gt;.", "&lt;color=&quot;#fd4540&quot;&gt;Скорость перемещения заклинателя теней повышена на 30.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it &lt;color=&quot;#fd4540&quot;&gt;gains 20% DEF and M. RES&lt;/color&gt;.", "За каждые 20% ОЗ, которые теряет заклинатель теней, он &lt;color=&quot;#fd4540&quot;&gt;повышает ЗАЩ и сопр. магии на 20%&lt;/color&gt;.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers&#x27; DEF and M. RES. by 30%. &lt;color=&quot;#fd4540&quot;&gt;When under CC Effects, reduces by 50%&lt;/color&gt;.", "Повышает ЗАЩ и сопр. магии обычных разрушителей на 30%. &lt;color=&quot;#fd4540&quot;&gt;Под действием эффектов масс. контроля снижается на 50%.&lt;/color&gt;", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when &lt;color=&quot;#fd4540&quot;&gt;stunned or frozen&lt;/color&gt;.", "Обычный разрушитель невосприимчив к УРН, когда &lt;color=&quot;#fd4540&quot;&gt;оглушен и lty_mStrategyDesc_7101", "Golden Guard appears randomly on the battlefield each wave.", "Золотой страж появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "Огромный голем появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "Скелет-лучник появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "Жрица дождя появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "Позолоченный стражник появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "Золотистый инквизитор появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "Самоубийца появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "Воин песков появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "Муха-целительница появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "Безумный льстец появляется в случайных местах на поле боя каждую волну.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero&#x27;s DMG by 10% for 8 sec, stacking up to 5 times.", "(3 части) При нанесении крит. удара базовой АТК повышает УРН героя на 10% на 8 сек. Эффект складывается до 5 раз.", "", ""], ["HeroStory_mStory_2209", "&quot;She walks like a memory I have not earned, yet always long for.&quot;\\n-Rivenhald\\n\\nThey sent her north, where the snows upon her brow might bend her once more to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "«Она движется, словно воспоминание, которого я еще не заслужил, но к которому вечно стремлюсь».\\n– Ривенхальд\\n\\nОни отправили ее на север, туда, где снега, венчающие чело, вновь принудят служить их воле.\\n\\nНекогда жрица Элиндриса, Эйрлис стояла в самом сердце древних ритуалов, ее голос сплетался с дыханием богов. Но что-то надломилось. Она сделала выбор, о котором никто не осмеливался рассказать вслух, и святилище не даровало прощения столь легко.\\n\\nЭльфийский город месяцами зализывал раны после огненного штурма Моридена. Хотя прилив был отброшен, шрамы остались, а вместе с ними – ужасающее разоблачение: они больше не были неприкосновенными. Их башни разломились. Их мифы истекали кровью. Элиндрис нуждался в тенях, способных скользить там, где не могли пройти знамена. Провидцы обратили взор вовне. Тихо. Осторожно. Искали места за пределами старых карт, где их народ мог бы укрыться, если война вернется.\\n\\nСевер Тиа, пустынный и леденящий, возник в их предсказаниях, словно клинок, выкованный из снега. О Харце они знали, но не осмеливались вступать в конфликт с тем, чья слава гремела так громко. Ривенхальд же правил в студеных землях, неведомых их разведчикам – воевода во всем, кроме титула, монарх, не склонявшийся ни перед одной короной, кроме своей собственной. Им нужно было постичь его сущность. Узнать, можно ли подчинить его силу. Или, если потребуется, насколько легко ее сломить.\\n\\nЭйрлис стала их ответом. Без друзей на своем пути, она была не дипломатом и не шпионом, а чем-то более неуловимым. Ее отправили с полуправдой на устах и священной клятвой в сердце: завоевать его доверие, прочесть его душу и поведать о том, что невозможно разглядеть издалека. Она явилась, облаченная в белые одежды, объяснив свое присутствие стремлением к миру. Странствующая целительница. Жрица стужи. И Ривенхальд, не доверявший никому, доверился ей.\\n\\nОна сделала себя незаменимой. Врачевала раны, толковала знамения, не оставляла и тени скрытых мотивов. Он наблюдал. Она отвечала тем же. Никто не отводил взгляда первым.\\n\\nГраницы между ними со временем размылись, переплелись, но остались несокрушимыми. Эйрлис изучила его безмолвие, оттенки его гнева, странное милосердие, которое он прятал под всеми своими доспехами. По ночам, когда пламя почти угасало и уже было не отправить вестей, она иногда рисовала в мыслях будущее, где ему почти можно было доверять, где суровый правитель мог бы значить для нее нечто большее... Но рассвет всегда испепелял эти грезы.\\n\\nКак и Ривенхальд, она тоже видит, чем все закончится: две фигуры среди снежной пустоши, непреклонные и несгибаемые. Один клинок должен пасть. Одно дело должно исчезнуть. И в кровавом тумане, прежде чем ветер унесет все следы, они познают цену выживания... и кем они на самом деле приходятся друг другу.\\n\\nНо Эйрлис ведомо то, о чем умолчали провидцы Элиндриса. Север не принадлежит никому. Ни королям. Ни городам. И уж точно не призракам вроде нее. Какое бы будущее их ни ожидало, оно будет построено не на доверии, а на том, что останется после его краха.\\n\\nОна – безмолвие между двумя бурями, терпеливо ожидающее час, когда одна должна сокрушить другую.", "", ""], ["HeroStory_mStory_2321", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "«Ты будешь умолять, чтобы я тебя поглотила. И я буду милосердна».\\n– Шипение из листвы\\n\\nВ нефритовых джунглях Тиа, где корни пьют кровь, а деревья душат живое, некогда скользил дух яда и тени – змея Ситра, о которой говорили лишь шепотом. В те дни у нее не было собственной плоти – лишь клыки, голод и память об имени.\\n\\nИмперия чешуйчатых, древняя цивилизация, чьи обсидиановые города некогда рассекали кроны деревьев и разделяли долины, давно растворилась в изумрудных просторах. В свой последний час они влили остатки магии в величественных идолов – статуи могущественных созданий, высеченные с преданностью, покрытые охрой и пеплом, оставленные как подношения духам джунглей в надежде, что их мольбы будут услышаны.\\n\\nУвы, в ответ была лишь тишина.\\n\\nКогда столица рушилась, поглощенная наступающей листвой, эти идолы выстояли. Они были покрыты мхом, полуразрушены, но все еще живы и наполнены беспокойными отголосками. Внутри этих статуэток обитали скованные колдовством чешуйчатых души живых, принесенные в дар духам джунглей. Неосторожных странников, блуждающих по зеленому лабиринту и находящих такие фигурки, ждал скорый конец, ведь они были жертвенными алтарями, способными призывать могущественных божеств. Ситра была одной из них – змееподобная богиня и осколок старой империи, шипение, проникающее в умы слабовольных и раненых.\\n\\nНо она оставалась лишь духом... Пока ее не нашел Дассоми.\\n\\nПрославленный мистик чешуйчатых давно верил, что сны – мост к высшим истинам. В поисках утраченной мудрости в забытых уголках мира Дассоми пришел в джунгли, следуя видениям о змеях и алтарях, влекомый к заросшему храму, словно к полузабытому сновидению. Там, в сердце этих руин, он воскурил благовония и скользнул между мирами... И Ситра откликнулась.\\n\\nО том, что произошло между ними, не осталось никаких записей. Предложил ли Дассоми себя в жертву или просто открыл портал слишком широко – результат остался неизменным: Ситра сбросила бесформенность и возродилась в мире Объятиями Змеи.\\n\\nСледуя закону джунглей, Ситра охотится на всех, кто претендует на превосходство – праведных, чистых, непреклонных. Она проскальзывает в их храмы и дворцы, предлагая последний выбор: покориться... или быть поглощенными. Ситра жаждет возрождения своей змеиной династии, клыкастой и величественной, увенчанной джунглями и костями. Она грезит о цитаделях, оплетенных плющом и ядом, о мире, где все сбросили слабость, глубоко испили ее яда и возродились в прекрасном страдании.\\n\\nСегодня Ситра по-прежнему почитаема, хотя ее культы разрозненны и тайны, а некоторые говорят, что их возглавляет сам Дассоми. Ее последователи метят себя клыками, капают ядом на языки и грезят о наслаждении через боль в божественном поклонении. Они возносят молитвы, чтобы быть избранными для кормления, ведь быть избранным – значит быть замеченным, преследуемым, любимым. Ощутить поцелуй змеи – значит почувствовать силу, что обвивается вокруг души, сбросить слабость, словно кожу, и возродиться заново. Те, кто выживает после ее укуса, становятся ее охотницами: смертоносными, прекрасными и беззаветно преданными.\\n\\nИ в тот священный миг между дыханием и укусом, когда стрела замирает прямо над сердцем, они все прошепчут одно и то же:\\n«Спасибо».", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Снежная вуаль", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "Сладчайший яд", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Эйрлис", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Ситра", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "Выберите 1 эксклюзивного героя события для участия в событии. У выбранного эксклюзивного героя повышен шанс получения, гарантирован в течение 200 призывов!", "", ""], ["Item_mItemDesc_31097", "&lt;color=&quot;#eadca2&quot;&gt;Special Summon Offer&lt;/color&gt;\\n\\nGet the necessary materials for Hero Summon", "&lt;color=&quot;#eadca2&quot;&gt;Призыв: особое предложение&lt;/color&gt;\\n\\nПолучите необходимые материалы для призыва героя", "", ""], ["Item_mItemDesc_3334", "&lt;color=&quot;#498a40&quot;&gt;Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).&lt;/color&gt;", "&lt;color=&quot;#498a40&quot;&gt;Эксклюзивн mber of Spectral Plague stacks. Enemies with 5 stacks of Spectral Plague will be immediately removed.", "Владычица джунглей подрывает эффект «Призрачная чума» на врагах, нанося повышенный УРН в зависимости от количества зарядов этого эффекта. Враги с 5 зарядами «Призрачной чумы» будут мгновенно уничтожены.", "", ""], ["Skill_mSkillDesc_1908301_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Размахивает когтями, нанося УРН всем героям в пределах 1 плитки впереди.", "", ""], ["Skill_mSkillDesc_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Размахивает когтями, нанося УРН всем героям в пределах 1 плитки впереди.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Когда девятихвостая лиса получает смертельный УРН, она покидает поле боя и активирует хвосты на поле для атаки. Когда хвосты побеждены, девятихвостая лиса возвращается на поле боя. После того как все хвосты на поле побеждены, девятихвостая лиса трансформируется и призывает большое количество лис.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Наносит маг. УРН последнему размещенному юниту на поле боя, отдавая приоритет защитникам.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Наносит маг. УРН последнему размещенному юниту на поле боя, отдавая приоритет защитникам.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally within the Basic ATK Range and immediately grants this ally a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; of their Max HP for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec. The effect can only be triggered 1 time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "Предотвращает входящий смертельный УРН 1 раз для &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; союзника в пределах дальности базовой АТК и сразу дает ему щит прочностью &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; его макс. ОЗ на &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; сек. Эффект срабатывает только 1 раз в &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; сек.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG to up to &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; enemies.", "Наносит &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; УРН нескольким (до &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt;) врагам.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, and gains &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Grants allies of the same faction Elddr&#x27;s Talent temporarily. The Ultimate lasts for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "Повышает АТК на &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; и накладывает на героя эффект «&lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;». Временно наделяет союзников той же фракции талантом Элддра. Суперспособность действует &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; сек.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "Повышение АТК +{sk1}%", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "Повышение АТК +{sk1}%", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; chance to trigger Thunder Hammer, dealing an extra &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; DMG. If the hero has no shield, Thunder Hammer has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; chance to grant a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; ATK.", "Базовая АТК имеет &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; шанс активировать «Молот грома», нанося дополнительно &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; УРН. Если у героя нет щита, «Молот грома» имеет &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; шанс даровать щит, равный &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; АТК.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally in range.", "Накладывает &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; эффекта «&lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt;» на &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; союзника в пределах дальности.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "Множитель исцеления +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "Множитель исцеления +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "Множитель исцеления +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_5", "Healing Multiplier +{sk1}%", "Множитель исцеления +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_1", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322091,param1]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range.", "Накладывает эффект «&lt;color=&quot;#28d37c&quot;&gt;[322091,param1]&lt;/color&gt;» на &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; союзника с наименьшим процентом ОЗ в пределах дальности.", "", ""], ["Skill_mSkillDesc_220903_2", "Healing Prayer&#x27;s Healing Multiplier +{sk1}%", "Множитель исцеления «Исцеляющей молитвы» +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_3", "Skill Cost -{sk1}", "Использов

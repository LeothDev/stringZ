or the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "Находясь рядом с врагом, приносит себя в жертву во благо своих сородичей, взрываясь и нанося огромный УРН врагам вокруг.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. &lt;color=#ff4500&gt;Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.&lt;/color&gt;", "Мутировавшие и неистовые крысы-мутанты. &lt;color=#ff4500&gt;Под атакой их охватывает неописуемое неистовство, и их скорость перемещения повышается.&lt;/color&gt;", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Скелеты-воины с гигантскими топорами, движимые злобой, которая подпитывает их, делая их атаки еще сильнее.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "Королева пауков может пускать паутину, а также выводить множество мелких пауков и увеличивать их характеристики.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Всех, кто встает у него на пути, он безжалостно убивает огромной булавой.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Безумный боец, который скитается по подземелью и с радостью рубит головы встречным.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Всех, кто встает у него на пути, он безжалостно убивает огромной булавой.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Беспощадный защитник-каннибал, который наносит врагам кровоточащие раны огромной костяной клешней.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Беспощадный защитник-каннибал, который наносит врагам кровоточащие раны огромной костяной клешней.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Призрачный след, который нельзя блокировать или замедлить. Его нужно быстро уничтожить.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Погибшие в бою солдаты, которых подняли из могил.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Самоубийцы нападают, сворачиваясь в клубок и катясь вперед.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "Мутировавшие и неистовые, эти крысы-мутанты передвигаются быстрее, когда их атакуют.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Скелеты-воины с гигантскими топорами, движимые злобой, которая подпитывает их, делая их атаки еще сильнее.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "Истинная правительница подземного мира, способная выводить мелких пауков, управлять ими и увеличивать все характеристики каждого паука на поле боя. Из ее крепкой паутины крайне сложно вырваться.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "Эйрлис, изгнанная эльфийская жрица. Исцеляет тяжелые раны молитвами, рассеивает ослабления, спасает союзников на грани смерти и ускоряет восстановление ярости команды.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "Реликт древнего мира, Ситра, Объятия Змеи, бродит по джунглям. Она призывает существ «Истерзанные души» для атаки с нарастающей свирепостью, игнорируя ЗАЩ, чтобы пожирать своих врагов.", "", ""], ["Unit_mHeroDesignation_2209", "Winter&#x27;s Mercy", "Милость Зимы", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent&#x27;s Embrace", "Объятия Змеи", "", ""], ["Unit_mName_17200", "Knight of Destruction", "Рыцарь разрушения", "", ""], ["Unit_mName_17218", "Fallen Chopper", "Павший мясник", "", ""], ["Unit_mName_17219", "Slaughter", "Палач", "", ""], ["Unit_mName_17221", "Maw", "Утроба", "", ""], ["Unit_mName_17222", "Maw", "Утроба", "", ""], ["Unit_mName_2209", "Eirlys", "Эйрлис", "", ""], ["Unit_mName_2321", "Sythra", "Ситра", "", ""], ["Unit_mName_34100", "Soul Eater", "Пожиратель душ", "", ""], ["Unit_mName_34103", "Suicide", "Самоубийца", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "Скелет-каратель", "", ""], ["Unit_mName_37114", "Queen Spider", "Королева пауков", "", ""], ["Unit_mName_37115", "Spider Cocoon", "Паучий кокон", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "Держитесь ближе – так у вас будет шанс выжить.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "Скажи, боишься ли ты того, чего жаждешь?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "Во время нашего специального события «Неутомимый рейдер» вы можете выполнить 1 автобитву и получить награды дважды за двойную стоимость энергии. Сделайте ваши сражения эффективнее, чем когда-либо!\n\nБонус автобитвы\n1. Во время события при использовании автобитвы в в режиме «{name2}» командиры могут выбрать, активировать ли бонус события: каждая битва расходует в {num3} р. больше энергии, но дает в {num3} р. больше наград. Это позволит повысить эффективность получения материалов.\n2. В случае провала в испытании соответствующая энергия будет возвращена.\n3. Если во время события активирован бонус события, задания на расход энергии будут рассчитываться на основе фактически израсходованной энергии.\n4. Однако задания, связанные с количеством прохождений, не будут зависеть от бонуса события.\n5. Бонус события применим только к этапам, которые позволяют использовать автобитву, поэтому награды за первое прохождение не включены в бонус наград.\n6. При активации бонуса награды будут генерироваться на основе отдельных расчетов, а не путем прямого удвоения результата 1 битвы.\n7. Для события «Отважное завоевание» подсчет очков «Испытания Оракула» в рейде для снаряжения/материалов артефактов соответствует добыче снаряжения/метеорита и рассчитывается на основе редкости и количества снаряжения/метеорита, полученного после прохождения этапов.\n8. Обратите внимание: во время действия бонуса, если на этапах есть случайная добыча токенов события (например, кубики в «Одиссее снов»), бонус не повлияет эти токены.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "Событие «Неутомимый рейдер» уже доступно в рейде для материалов артефактов. В это время совершение автобитв будет затрачивать двойную энергию, но также будет давать двойные награды.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "Временное повышение шанса для легендарных Нумеры и Эйлин!", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "Временное повышение шанса для легендарных Ворна и Артемиса!", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "Временное повышение шанса для легендарных Никс и Мальвиры!", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "Набор облика «Змея грез»", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "&quot;Tya&#x27;s Champion&quot; Valkyra", "«Защитница Тиа» Валькира", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "&quot;The Hollow Husk&quot; Aracha", "«Пустая оболочка» Арача", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "Набор облика Ситры", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "Геймплей героя: Эйрлис", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "Геймплей героя: Ситра", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;В этом событии «Божественный призыв» шанс получения &lt;color=#fdbe36&gt;всех легендарных героев&lt;/color&gt; в &lt;color=#b490fc&gt;2&lt;/color&gt; раза выше обычного, а шанс получения следующих героев в &lt;color=#b490fc&gt;20&lt;/color&gt; раз больше по сравнению с другими героями той же редкости. Шанс получения других героев той же редкости равный.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;В этом событии призыва, когда вы получаете легендарного героя, НЕ являющегося в настоящее время героем с повышением шанса, шанс получения* всех героев с повышением шанса дополнительно увеличится в ваших следующих призывах.&lt;/color&gt; Подробности:\n1. Когда вы впервые получаете легендарного героя, НЕ являющегося героем с повышением шанса, шанс получения* всех героев с повышением шанса будет умножен на &lt;color=#b490fc&gt;10&lt;/color&gt; в ваших будущих призывах.\n2. Если вы снова получите легендарного героя, НЕ являющегося героем с повышением шанса, шанс получения* всех героев с повышением шанса будет еще раз умножен на &lt;color=#b490fc&gt;10&lt;/color&gt;. Это накапливающееся усиление будет продолжаться до тех пор, пока вы успешно не призовете любого героя с повышением шанса.\n&lt;color=#91887c&gt;*Вышеупомянутый шанс получения относится к относительной вероятности героев с повышением шанса по сравнению с другими героями.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Примечание: этот таймер Жалости срабатывает ТОЛЬКО один раз в течение этого события.&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "Эффект исцеления +<span style=\"color: #1e8852;\">8</span>", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "Автовосст. ярости +<span style=\"color: #1e8852;\">1</span>", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -<span style=\"color: #1e8852;\">2</span>", "Стоимость -<span style=\"color: #1e8852;\">2</span>", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +<span style=\"color: #1e8852;\">300</span>", "АТК +<span style=\"color: #1e8852;\">300</span>", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "Пробивание +<span style=\"color: #1e8852;\">8%</span>", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "Даже самый слабый луч развеет мрак.", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "Свет набирает силу в руках храбрецов.", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "Пусть тучи и сгущаются вдали, моя вера непоколебима.", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "Не ищите истину в пророчествах – она живет в вашем сердце.", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "Свет озарит все сущее.", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "Мои клыки становятся острее...", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "С каждой сброшенной кожей я становлюсь совершеннее.", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "На колени, ничтожество... Я превзошла само божество!", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "От моей силы нет противоядия.", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent's will!", "Нет ни хаоса, ни порядка... Есть лишь воля змеи!", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "Повышение УРН", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "Безмятежное дыхание", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "Исцеляющая молитва", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "Исцеляющая молитва", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "Исцеляющая молитва", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "Исцеляющая молитва", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "Исцеляющая молитва", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "Истерзанная душа", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "Истерзанная душа", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "Истерзанная душа", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "Истерзанная душа", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "Истерзанная душа", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "УРН +{20,num/100}% (Если сильнее текущего усиления/ослабления одноименной хар-ки.)", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "Получает щит, равный {30,num}% АТК в секунду, складывается до {31,num}% АТК.", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "Рассеивает 1 ослабление каждые 2 сек. Когда Эйрлис исцеляет союзников «Безмятежным дыханием», получает доп. {30,num}% бонус к исцелению. На поле боя может находиться до 2 союзников с эффектом «Безмятежное дыхание».", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Когда ОЗ носителя падают ниже {30,num}%, немедленно восстанавливает ОЗ, равные {31,num}% АТК заклинателя, и снимает этот эффект. Когда длительность эффекта заканчивается естественно или обновляется, восстанавливает для носителя ОЗ, равные {32,num}% АТК заклинателя. Этот эффект невозможно рассеять.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "Наносит масс. маг. УРН 1 раз нескольким (до {31,num}) врагам впереди, включая цели в воздухе. «Могущественный удар» накладывает на врагов {32,num}% уязвимости (маг. УРН) на {33,num} сек.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "«Огненное копье» игнорирует {30,num}% ЗАЩ врага. «Кольцо Вселенной» отскакивает доп. {31,num} р. и может несколько раз поразить одну и ту же цель. «Клинок инь-ян» казнит обычных монстров с ОЗ ниже {32,num}%.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Быстро стреляет по 1 врагу в пределах дальности АТК владельца, изначально может выстрелить {30,num} р. Каждое попадание наносит {31,num}% УРН. Существо «Истерзанная душа» исчезает после использования всех выстрелов. В первую очередь атакует цели в воздухе. Стрела получает счетчик возврата каждый раз, когда попадает в павшую цель. На поле боя может существовать до {32,num} шт.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Проходите рейд для снаряжения I, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Проходите рейд для снаряжения II, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Проходите рейд для снаряжения III, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Призывайте героев, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "Повышайте ур./кол-во звезд героев, продв. их и улучшайте их навыки, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Проходите рейд для материалов артефактов, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Проходите рейд для снаряжения I, чтобы собирать трофеи и получать награды.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Супертаблица лидеров «Прибытие героев»", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "Потерянное наследие", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Сокровищница в песках", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Забытый дворец", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Прибытие героев", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Тренировка героев", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Тайна артефактов", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "Потерянное наследие", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Глава истории", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Глава испытания", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "Общедоступная ИС", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Вторжение зомби", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Переключение каналов...", "", ""], ["CommonText_mMessage_24292", "Challenges", "Испытания", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">Ключи испытаний</span><br>Ключи испытаний можно получить в различных игровых режимах. Эти ключи бывают разных типов и уровней, каждый содержит уникальные древние надписи. Поместите их в алтарь, чтобы открыть пути к соответствующим испытаниям. <br><br><span style=\"color: #cec2b1;\">Правила испытания</span><br>Каждая битва состоит из нескольких волн монстров. За победу над каждой волной вы получаете сундук с наградами. После начала битвы ее невозможно перезапустить. Если вы выйдете в процессе, награды будут рассчитаны исходя из текущего прогресса битвы. Вы можете расходовать до 200 ключей в месяц для прохождения испытаний. По достижении этого лимита в текущем месяце новые испытания проходить будет нельзя.<br><br><span style=\"color: #cec2b1;\">Энергия ключа</span><br>Каждый ключ обладает определенным запасом энергии. <span style=\"color: #fdbe36;\">1 единица энергии расходуется за одну попытку испытания.</span> Если после окончания битвы у ключа осталась энергия, вы можете отказаться от наград и уйти, а затем снова расходовать энергию для перезапуска испытания. Расход энергии не учитывается в ежемесячном лимите ключей.<br><br><span style=\"color: #cec2b1;\">Уничтожение ключа</span><br>Вы можете уничтожать ключи, соответствующие требованиям уровня уничтожения. Уничтожение ключей не дает наград и не учитывается в ежемесячном лимите расхода ключей.<br><span style=\"color: #fd4540;\">Инвентарь ключей испытаний ограничен. Когда он заполнится, вы не сможете получать новые ключи. Регулярно используйте ключи, чтобы освобождать место.</span>", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Замшелый кристалл", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Расплавленный кристалл", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "После начала битвы ее нельзя перезапустить. Выход в процессе боя приведет к немедленному расчету, а израсходованная энергия не будет возвращена!", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Вулканическая область, где лава вздымается во время апокалипсиса. Требуется больше героев на возвышениях, чтобы отразить силы зла апокалипсиса.", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">Вы уверены, что хотите снять этого игрока с должности маршала?</span><br>В каждой гильдии может быть до {num1} маршалов, каждый из которых получает несколько ({num2}) доп. атак за раунд.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Очки раунда", "", ""], ["CommonText_mMessage_26126", "Destroy", "Уничтожить", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "{name}: точно уничтожить?<br><span style=\"color: #fd4540;\">Уничтоженные ключи нельзя восстановить, и вы не получите за них никаких предметов.</span>", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "Ключ уничтожен.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Энергия:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Отказаться и выйти", "", ""], ["CommonText_mMessage_26131", "Claim", "Получить", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Оставшаяся энергия ключа:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Галерея сражений", "", ""], ["CommonText_mMessage_26134", "Guides", "Руководства", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Появляющийся ключ:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Замшелый кристалл", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Расплавленный кристалл", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Показывать только метки текущего ключа", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Список популярных героев составляется на основе частоты выбора и приводится только для справки.", "", ""], ["CommonText_mMessage_26140", "Search", "Поиск", "", ""], ["CommonText_mMessage_26141", "Search Results", "Результаты поиска", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Загрузка данных...", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Сбор данных о герое", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Введите не менее {num} симв.", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "Подходящие метки не найдены.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "Автобитва недоступна для текущего уровня ключа.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Вы сможете загрузить записи автобитвы после прохождения волны {num} вручную.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "Автобитва может провалиться из-за разных меток ключа. Все равно продолжить?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Сохранить этот бой как новую запись автобитвы?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "Из-за разных меток ключей мы рекомендуем выбрать наиболее полный состав для загрузки автобитвы!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "Инвентарь ключей заполнен. Используйте ключи, прежде чем покупать новые.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Очистить", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "В вашем инвентаре обнаружены неоткрытые сундуки со случайными ключами. Хотите открыть их сейчас?", "", ""], ["CommonText_mMessage_26154", "Go", "Вперед", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Ур. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level's Keystone cannot be destroyed.", "Ключ данного уровня нельзя уничтожить.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Вы уверены, что хотите уничтожить ключ x<span style=\"color: #fd4540;\">{num}</span>?<br><span style=\"color: #fd4540;\">Уничтоженные ключи нельзя восстановить, и вы не получите за них никаких предметов.</span>", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "Уничтожены ключи: {num}.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Использовано за месяц:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Ключи имеют ежемесячный лимит испытаний. По достижении лимита дальнейшие попытки становятся недоступны.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "На текущем уровне сложности есть доступные для получения награды. Вы уверены, что хотите попробовать другой уровень сложности?<br><span style=\"color: #e04242;\">Во время события вы можете выбрать только один уровень сложности в день для получения наград.</span>", "", ""], ["CommonText_mMessage_26162", "Don't remind me again.", "Больше не напоминать.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "Инвентарь ключей заполнен. Пожалуйста, израсходуйте несколько, прежде чем разблокировать новые.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "Версия записи не соответствует текущей версии и не может быть просмотрена.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Введите не более {num} симв.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Популярные герои", "", ""], ["CommonText_mMessage_26167", "Tag", "Метка", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Хранилище ключей испытаний заполнено", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "Снижает скорость перемещения пожирателя душ на 30. Пожиратель душ <span style=\"color: #fd4540;\">невосприимчив к замедлению</span>.", "", ""], ["Difficulty_mDetail_73003", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "Мудрец из Белой башни входит в состояние <span style=\"color: #fd4540;\">невидимости</span> и становится видимым при блокировке.", "", ""], ["Difficulty_mDetail_73004", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "Мудрец из Белой башни получает <span style=\"color: #fd4540;\">невосприимчивость к маг. УРН</span>.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "После смерти маленький арахнид получает <span style=\"color: #fd4540;\">эффект «Несгибаемость»</span> на 3 сек. и становится <span style=\"color: #fd4540;\">невосприимчивым к контролю и замедлению</span>.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "Маленький арахнид <span style=\"color: #fd4540;\">восстанавливает 50% ОЗ</span> каждые 5 сек.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "<span style=\"color: #fd4540;\">Скорость перемещения стража молний повышена на 30.</span>", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is <span style=\"color: #fd4540;\">immune to DMG taken</span>, but loses 5% HP per sec.", "Страж молний <span style=\"color: #fd4540;\">невосприимчив к получаемому УРН</span>, но теряет 5% ОЗ в секунду.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace's Fatigue becomes <span style=\"color: #fd4540;\">permanent</span>.", "Эффект «Усталость» грозы глубин становится <span style=\"color: #fd4540;\">постоянным</span>.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is <span style=\"color: #fd4540;\">immune to CC Effects</span>.", "Защищенный варан <span style=\"color: #fd4540;\">невосприимчив к эффектам масс. контроля</span>.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction <span style=\"color: #fd4540;\">when blocked</span>.", "Защищенный варан получает дополнительно 30% сниж. физ. и маг. УРН <span style=\"color: #fd4540;\">при блокировании</span>.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric <span style=\"color: #fd4540;\">summons an extra</span> Ice Vermin.", "Морозный клерик <span style=\"color: #fd4540;\">призывает дополнительного</span> ледяного вредителя.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric <span style=\"color: #fd4540;\">spawns</span> 3 Ice Vermin <span style=\"color: #fd4540;\">upon death</span>.", "Морозный клерик <span style=\"color: #fd4540;\">призывает</span> 3 ледяных вредителя <span style=\"color: #fd4540;\">при гибели</span>.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains <span style=\"color: #fd4540;\">Movement Spd. +50</span>.", "Страж грома прекращает атаковать и получает <span style=\"color: #fd4540;\">+50 к скорости перемещения</span>.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard's <span style=\"color: #fd4540;\">ATK is increased by 100%</span>, but <span style=\"color: #fd4540;\">when attacking shields</span>, deducts 50% of its HP.", "<span style=\"color: #fd4540;\">АТК стража грома повышена на 100%</span>, но <span style=\"color: #fd4540;\">при атаке щитов</span> он теряет 50% своих ОЗ.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "Туманный мертвый глаз <span style=\"color: #fd4540;\">невосприимчив к маг. УРН</span>.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores <span style=\"color: #fd4540;\">10% HP</span> with each ATK.", "Туман: барон Салем восстанавливает <span style=\"color: #fd4540;\">10% ОЗ</span> при каждой АТК.", "", ""], ["Difficulty_mDetail_73018", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">Cooldown is reduced by 100%</span>.", "<span style=\"color: #fd4540;\">Перезарядка «Ускоренного создания» инкубатора снижается на 100%.</span>", "", ""], ["Difficulty_mDetail_73019", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">spawns 2 extra Suicides</span>.", "«Ускоренное создание» инкубатора <span style=\"color: #fd4540;\">призывает 2 доп. самоубийц</span>.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">drains 10% of the target's Rage</span>.", "При нанесении УРН цели жрец грома <span style=\"color: #fd4540;\">поглощает 10% ярости цели</span>.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">permanently reduces their Max HP by 10%</span>. This effect can be stacked.", "При нанесении УРН цели жрец грома <span style=\"color: #fd4540;\">навсегда снижает ее макс. ОЗ на 10%</span>. Этот эффект может складываться.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces <span style=\"color: #fd4540;\">healing</span> received by <span style=\"color: #fd4540;\">all units in range</span> by 50%.", "Скверна снижает <span style=\"color: #fd4540;\">исцеление</span>, получаемое <span style=\"color: #fd4540;\">всеми юнитами в пределах дальности</span>, на 50%.", "", ""], ["Difficulty_mDetail_73023", "Scourge's DMG range expands to <span style=\"color: #fd4540;\">adjacent 2 tiles</span>.", "Пределы дальности УРН Скверны расширяются до <span style=\"color: #fd4540;\">2 соседних плиток</span>.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to <span style=\"color: #fd4540;\">blocked targets</span>.", "Когда туман: высший смотритель Бездны погибает, он наносит маг. УРН, равный 100% АТК, <span style=\"color: #fd4540;\">заблокированным целям</span>.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes <span style=\"color: #fd4540;\">unblockable</span>.", "Чумная крыса-мутант становится <span style=\"color: #fd4540;\">неблокируемой</span>.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent <span style=\"color: #fd4540;\">increases Movement Spd. by 30</span>.", "Чумная крыса-мутант <span style=\"color: #fd4540;\">повышает скорость перемещения на 30</span>.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "За каждые 20% ОЗ, которые теряет барон Салем, он <span style=\"color: #fd4540;\">повышает ЗАЩ и сопр. магии на 20%</span>.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "<span style=\"color: #fd4540;\">Скорость перемещения заклинателя теней повышена на 30.</span>", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "За каждые 20% ОЗ, которые теряет заклинатель теней, он <span style=\"color: #fd4540;\">повышает ЗАЩ и сопр. магии на 20%</span>.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers' DEF and M. RES. by 30%. <span style=\"color: #fd4540;\">When under CC Effects, reduces by 50%</span>.", "Повышает ЗАЩ и сопр. магии обычных разрушителей на 30%. <span style=\"color: #fd4540;\">Под действием эффектов масс. контроля снижается на 50%.</span>", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when <span style=\"color: #fd4540;\">stunned or frozen</span>.", "Обычный разрушитель невосприимчив к УРН, когда <span style=\"color: #fd4540;\">оглушен или заморожен</span>.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an <span style=\"color: #fd4540;\">initial Hitcount Shield</span>.", "Необычный разрушитель получает <span style=\"color: #fd4540;\">начальный щит со счетчиком</span>.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer <span style=\"color: #fd4540;\">gains 5 Movement Spd. each time taking DMG</span>.", "Необычный разрушитель <span style=\"color: #fd4540;\">получает 5 к скорости перемещения каждый раз, когда получает УРН</span>.", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee's Ultrasonic Wave <span style=\"color: #fd4540;\">DMG increases by 100%</span> and does not inflict Poison.", "«Волна ультразвука» крылатой банши <span style=\"color: #fd4540;\">повышает УРН на 100%</span> и не накладывает яд.", "", ""], ["Difficulty_mDetail_73035", "Batwings Banshee's Poison effect becomes <span style=\"color: #fd4540;\">permanent</span>.", "Эффект яда крылатой банши становится <span style=\"color: #fd4540;\">постоянным</span>.", "", ""], ["Difficulty_mDetail_73036", "Golden Guard <span style=\"color: #fd4540;\">forcibly removes targets</span> upon collision.", "Золотой страж <span style=\"color: #fd4540;\">принудительно удаляет цели</span> при столкновении.", "", ""], ["Difficulty_mDetail_73037", "Supreme Destroyer <span style=\"color: #fd4540;\">restores 50% HP</span> every 15 sec.", "Великий разрушитель <span style=\"color: #fd4540;\">восстанавливает 50% ОЗ</span> каждые 15 сек.", "", ""], ["Difficulty_mDetail_73038", "Supreme Destroyer <span style=\"color: #fd4540;\">Movement Spd. increases by 50</span>, but <span style=\"color: #fd4540;\">loses 3% HP</span> per sec.", "Скорость перемещения великого разрушителя <span style=\"color: #fd4540;\">повышается на 50</span>, но он <span style=\"color: #fd4540;\">теряет 3% ОЗ</span> в секунду.", "", ""], ["Difficulty_mDetail_73039", "Smasher Guard's ATK will <span style=\"color: #fd4540;\">forcibly remove targets</span>.", "АТК стража-дробителя <span style=\"color: #fd4540;\">принудительно удалит цели</span>.", "", ""], ["Difficulty_mDetail_73040", "When losing 80% HP, Smasher Guard will fall into Petrification for 15 sec, gaining <span style=\"color: #fd4540;\">massive DMG Reduction</span> and continuously <span style=\"color: #fd4540;\">restoring HP</span> during Petrification.", "При потере 80% ОЗ страж-дробитель станет окаменевшим на 15 сек., получая <span style=\"color: #fd4540;\">огромное сниж. УРН</span> и непрерывно <span style=\"color: #fd4540;\">восстанавливая ОЗ</span> в этом состоянии.", "", ""], ["Difficulty_mDetail_74001", "Jungle Master's Basic ATK hits <span style=\"color: #fd4540;\">5</span> enemy targets each time.", "Базовая АТК владычицы джунглей <span style=\"color: #fd4540;\">поражает 5</span> вражеских целей за раз.", "", ""], ["Difficulty_mDetail_74002", "While Jungle Master is on the battlefield, restores <span style=\"color: #fd4540;\">50% HP to all enemies</span> on the battlefield every 10 sec.", "Пока владычица джунглей находится на поле боя, восстанавливает <span style=\"color: #fd4540;\">50% ОЗ всем врагам</span> на поле боя каждые 10 сек.", "", ""], ["Difficulty_mDetail_74003", "When Jungle Master dies, all enemies on the battlefield gain <span style=\"color: #fd4540;\">Invincibility for 10 sec</span>.", "Когда владычица джунглей погибает, все враги на поле боя получают <span style=\"color: #fd4540;\">неуязвимость на 10 сек.</span>", "", ""], ["Difficulty_mDetail_74004", "Enemies <span style=\"color: #fd4540;\">adjacent</span> to Jungle Master gain <span style=\"color: #fd4540;\">25% HP Regen per sec</span>.", "Враги <span style=\"color: #fd4540;\">рядом</span> с владычицей джунглей получают <span style=\"color: #fd4540;\">25% восстановления ОЗ в секунду</span>.", "", ""], ["Difficulty_mDetail_74005", "Queen Spider's snare targets increase to <span style=\"color: #fd4540;\">3</span>.", "Количество целей ловушки королевы пауков увеличивается до <span style=\"color: #fd4540;\">3</span>.", "", ""], ["Difficulty_mDetail_74006", "Queen Spider spawns <span style=\"color: #fd4540;\">3 Suicides</span> each time she enters spawning.", "Королева пауков создает <span style=\"color: #fd4540;\">3 самоубийцы</span> каждый раз, когда входит в режим создания.", "", ""], ["Difficulty_mDetail_74007", "Queen Spider spawns <span style=\"color: #fd4540;\">8 Small Arachnids</span> each time she enters spawning.", "Королева пауков создает <span style=\"color: #fd4540;\">8 маленьких арахнидов</span> каждый раз, когда входит в режим создания.", "", ""], ["Difficulty_mDetail_74008", "Queen Spider spawns <span style=\"color: #fd4540;\">2 Suicides</span> when she dies.", "Королева пауков создает <span style=\"color: #fd4540;\">2 самоубийц</span> при гибели.", "", ""], ["Difficulty_mDetail_74009", "Enemies <span style=\"color: #fd4540;\">adjacent</span> to Scythe of Doom gain <span style=\"color: #fd4540;\">80% DMG ю волну.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "Золотистый инквизитор появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "Самоубийца появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "Воин песков появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "Муха-целительница появляется в случайных местах на поле боя каждую волну.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "Безумный льстец появляется в случайных местах на поле боя каждую волну.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "(3 части) При нанесении крит. удара базовой АТК повышает УРН героя на 10% на 8 сек. Эффект складывается до 5 раз.", "", ""], ["HeroStory_mStory_2209", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "«Она движется, словно воспоминание, которого я еще не заслужил, но к которому вечно стремлюсь».<br>– Ривенхальд<br><br>Они отправили ее на север, туда, где снега, венчающие чело, вновь принудят служить их воле.<br><br>Некогда жрица Элиндриса, Эйрлис стояла в самом сердце древних ритуалов, ее голос сплетался с дыханием богов. Но что-то надломилось. Она сделала выбор, о котором никто не осмеливался рассказать вслух, и святилище не даровало прощения столь легко.<br><br>Эльфийский город месяцами зализывал раны после огненного штурма Моридена. Хотя прилив был отброшен, шрамы остались, а вместе с ними – ужасающее разоблачение: они больше не были неприкосновенными. Их башни разломились. Их мифы истекали кровью. Элиндрис нуждался в тенях, способных скользить там, где не могли пройти знамена. Провидцы обратили взор вовне. Тихо. Осторожно. Искали места за пределами старых карт, где их народ мог бы укрыться, если война вернется.<br><br>Север Тиа, пустынный и леденящий, возник в их предсказаниях, словно клинок, выкованный из снега. О Харце они знали, но не осмеливались вступать в конфликт с тем, чья слава гремела так громко. Ривенхальд же правил в студеных землях, неведомых их разведчикам – воевода во всем, кроме титула, монарх, не склонявшийся ни перед одной короной, кроме своей собственной. Им нужно было постичь его сущность. Узнать, можно ли подчинить его силу. Или, если потребуется, насколько легко ее сломить.<br><br>Эйрлис стала их ответом. Без друзей на своем пути, она была не дипломатом и не шпионом, а чем-то более неуловимым. Ее отправили с полуправдой на устах и священной клятвой в сердце: завоевать его доверие, прочесть его душу и поведать о том, что невозможно разглядеть издалека. Она явилась, облаченная в белые одежды, объяснив свое присутствие стремлением к миру. Странствующая целительница. Жрица стужи. И Ривенхальд, не доверявший никому, доверился ей.<br><br>Она сделала себя незаменимой. Врачевала раны, толковала знамения, не оставляла и тени скрытых мотивов. Он наблюдал. Она отвечала тем же. Никто не отводил взгляда первым.<br><br>Границы между ними со временем размылись, переплелись, но остались несокрушимыми. Эйрлис изучила его безмолвие, оттенки его гнева, странное милосердие, которое он прятал под всеми своими доспехами. По ночам, когда пламя почти угасало и уже было не отправить вестей, она иногда рисовала в мыслях будущее, где ему почти можно было доверять, где суровый правитель мог бы значить для нее нечто большее... Но рассвет всегда испепелял эти грезы.<br><br>Как и Ривенхальд, она тоже видит, чем все закончится: две фигуры среди снежной пустоши, непреклонные и несгибаемые. Один клинок должен пасть. Одно дело должно исчезнуть. И в кровавом тумане, прежде чем ветер унесет все следы, они познают цену выживания... и кем они на самом деле приходятся друг другу.<br><br>Но Эйрлис ведомо то, о чем умолчали провидцы Элиндриса. Север не принадлежит никому. Ни королям. Ни городам. И уж точно не призракам вроде нее. Какое бы будущее их ни ожидало, оно будет построено не на доверии, а на том, что останется после его краха.<br><br>Она – безмолвие между двумя бурями, терпеливо ожидающее час, когда одна должна сокрушить другую.", "", ""], ["HeroStory_mStory_2321", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "«Ты будешь умолять, чтобы я тебя поглотила. И я буду милосердна».<br>– Шипение из листвы<br><br>В нефритовых джунглях Тиа, где корни пьют кровь, а деревья душат живое, некогда скользил дух яда и тени – змея Ситра, о которой говорили лишь шепотом. В те дни у нее не было собственной плоти – лишь клыки, голод и память об имени.<br><br>Империя чешуйчатых, древняя цивилизация, чьи обсидиановые города некогда рассекали кроны деревьев и разделяли долины, давно растворилась в изумрудных просторах. В свой последний час они влили остатки магии в величественных идолов – статуи могущественных созданий, высеченные с преданностью, покрытые охрой и пеплом, оставленные как подношения духам джунглей в надежде, что их мольбы будут услышаны.<br><br>Увы, в ответ была лишь тишина.<br><br>Когда столица рушилась, поглощенная наступающей листвой, эти идолы выстояли. Они были покрыты мхом, полуразрушены, но все еще живы и наполнены беспокойными отголосками. Внутри этих статуэток обитали скованные колдовством чешуйчатых души живых, принесенные в дар духам джунглей. Неосторожных странников, блуждающих по зеленому лабиринту и находящих такие фигурки, ждал скорый конец, ведь они были жертвенными алтарями, способными призывать могущественных божеств. Ситра была одной из них – змееподобная богиня и осколок старой империи, шипение, проникающее в умы слабовольных и раненых.<br><br>Но она оставалась лишь духом... Пока ее не нашел Дассоми.<br><br>Прославленный мистик чешуйчатых давно верил, что сны – мост к высшим истинам. В поисках утраченной мудрости в забытых уголках мира Дассоми пришел в джунгли, следуя видениям о змеях и алтарях, влекомый к заросшему храму, словно к полузабытому сновидению. Там, в сердце этих руин, он воскурил благовония и скользнул между мирами... И Ситра откликнулась.<br><br>О том, что произошло между ними, не осталось никаких записей. Предложил ли Дассоми себя в жертву или просто открыл портал слишком широко – результат остался неизменным: Ситра сбросила бесформенность и возродилась в мире Объятиями Змеи.<br><br>Следуя закону джунглей, Ситра охотится на всех, кто претендует на превосходство – праведных, чистых, непреклонных. Она проскальзывает в их храмы и дворцы, предлагая последний выбор: покориться... или быть поглощенными. Ситра жаждет возрождения своей змеиной династии, клыкастой и величественной, увенчанной джунглями и костями. Она грезит о цитаделях, оплетенных плющом и ядом, о мире, где все сбросили слабость, глубоко испили ее яда и возродились в прекрасном страдании.<br><br>Сегодня Ситра по-прежнему почитаема, хотя ее культы разрозненны и тайны, а некоторые говорят, что их возглавляет сам Дассоми. Ее последователи метят себя клыками, капают ядом на языки и грезят о наслаждении через боль в божественном поклонении. Они возносят молитвы, чтобы быть избранными для кормления, ведь быть избранным – значит быть замеченным, преследуемым, любимым. Ощутить поцелуй змеи – значит почувствовать силу, что обвивается вокруг души, сбросить слабость, словно кожу, и возродиться заново. Те, кто выживает после ее укуса, становятся ее охотницами: смертоносными, прекрасными и беззаветно преданными.<br><br>И в тот священный миг между дыханием и укусом, когда стрела замирает прямо над сердцем, они все прошепчут одно и то же:<br>«Спасибо».", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Снежная вуаль", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "Сладчайший яд", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Эйрлис", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Ситра", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaranteed within 200 summons!", "Выберите 1 эксклюзивного героя события для участия в событии. У выбранного эксклюзивного героя повышен шанс получения, гарантирован в течение 200 призывов!", "", ""], ["Item_mItemDesc_31097", "<span style=\"color: #eadca2;\">Special Summon Offer</span><br><br>Get the necessary materials for Hero Summon", "<span style=\"color: #eadca2;\">Призыв: особое предложение</span><br><br>Получите необходимые материалы для призыва героя", "", ""], ["Item_mItemDesc_3334", "<span style=\"color: #498a40;\">Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).</span>", "<span style=\"color: #498a40;\">Эксклюзивная рамка аватара супертаблицы лидеров «Прибытие героев» («Сезон змеерожденных»).</span>", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen's Clues 1-5.", "Неизвестная подсказка Эрлан-шэня. При получении автоматически преобразуется в случайную подсказку из подсказок Эрлан-шэня 1-5.", "", ""], ["Item_mItemDesc_3521", "Erlang Shen's Clue 2.<br><span style=\"color: #498a40;\">Usage: Consume this item via Fate's Chapters to unlock the corresponding clue.</span>", "Подсказка Эрлан-шэня 2.<br><span style=\"color: #498a40;\">Применение: используется в «Главах судьбы» для разблокировки соответствующей подсказки.</span>", "", ""], ["Item_mItemDesc_3522", "Erlang Shen's Clue 3.<br><span style=\"color: #498a40;\">Usage: Consume this item via Fate's Chapters to unlock the correspond 5 зарядами «Призрачной чумы» будут мгновенно уничтожены.", "", ""], ["Skill_mSkillDesc_1908301_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Размахивает когтями, нанося УРН всем героям в пределах 1 плитки впереди.", "", ""], ["Skill_mSkillDesc_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Размахивает когтями, нанося УРН всем героям в пределах 1 плитки впереди.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Когда девятихвостая лиса получает смертельный УРН, она покидает поле боя и активирует хвосты на поле для атаки. Когда хвосты побеждены, девятихвостая лиса возвращается на поле боя. После того как все хвосты на поле побеждены, девятихвостая лиса трансформируется и призывает большое количество лис.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Наносит маг. УРН последнему размещенному юниту на поле боя, отдавая приоритет защитникам.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Наносит маг. УРН последнему размещенному юниту на поле боя, отдавая приоритет защитникам.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for <span style=\"color: #4A9DF2;\">1</span> ally within the Basic ATK Range and immediately grants this ally a shield equal to <span style=\"color: #4A9DF2;\">{skm1}%</span> of their Max HP for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. The effect can only be triggered 1 time every <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "Предотвращает входящий смертельный УРН 1 раз для <span style=\"color: #4A9DF2;\">1</span> союзника в пределах дальности базовой АТК и сразу дает ему щит прочностью <span style=\"color: #4A9DF2;\">{skm1}%</span> его макс. ОЗ на <span style=\"color: #4A9DF2;\">{skm2}</span> сек. Эффект срабатывает только 1 раз в <span style=\"color: #4A9DF2;\">{skm3}</span> сек.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals <span style=\"color: #4A9DF2;\">{skm1}%</span> DMG to up to <span style=\"color: #4A9DF2;\">5</span> enemies.", "Наносит <span style=\"color: #4A9DF2;\">{skm1}%</span> УРН нескольким (до <span style=\"color: #4A9DF2;\">5</span>) врагам.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and gains <span style=\"color: #28d37c;\">[321900]</span>. Grants allies of the same faction Elddr's Talent temporarily. The Ultimate lasts for <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "Повышает АТК на <span style=\"color: #4A9DF2;\">{skm1}%</span> и накладывает на героя эффект «<span style=\"color: #28d37c;\">[321900]</span>». Временно наделяет союзников той же фракции талантом Элддра. Суперспособность действует <span style=\"color: #4A9DF2;\">{skm2}</span> сек.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "Повышение АТК +{sk1}%", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "Повышение АТК +{sk1}%", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to trigger Thunder Hammer, dealing an extra <span style=\"color: #4A9DF2;\">{skm2}%</span> DMG. If the hero has no shield, Thunder Hammer has a <span style=\"color: #4A9DF2;\">{skm3}%</span> chance to grant a shield equal to <span style=\"color: #4A9DF2;\">{skm4}%</span> ATK.", "Базовая АТК имеет <span style=\"color: #4A9DF2;\">{skm1}%</span> шанс активировать «Молот грома», нанося дополнительно <span style=\"color: #4A9DF2;\">{skm2}%</span> УРН. Если у героя нет щита, «Молот грома» имеет <span style=\"color: #4A9DF2;\">{skm3}%</span> шанс даровать щит, равный <span style=\"color: #4A9DF2;\">{skm4}%</span> АТК.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies <span style=\"color: #4A9DF2;\">{skm1}%</span> <span style=\"color: #28d37c;\">[310001]</span> to <span style=\"color: #4A9DF2;\">1</span> ally in range.", "Накладывает <span style=\"color: #4A9DF2;\">{skm1}%</span> эффекта «<span style=\"color: #28d37c;\">[310001]</span>» на <span style=\"color: #4A9DF2;\">1</span> союзника в пределах дальности.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "Множитель исцеления +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "Множитель исцеления +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "Множитель исцеления +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_5", "Healing Multiplier +{sk1}%", "Множитель исцеления +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_1", "Applies <span style=\"color: #28d37c;\">[322091,param1]</span> to <span style=\"color: #4A9DF2;\">1</span> ally with the lowest HP percentage in range.", "Накладывает эффект «<span style=\"color: #28d37c;\">[322091,param1]</span>» на <span style=\"color: #4A9DF2;\">1</span> союзника с наименьшим процентом ОЗ в пределах дальности.", "", ""], ["Skill_mSkillDesc_220903_2", "Healing Prayer's Healing Multiplier +{sk1}%", "Множитель исцеления «Исцеляющей молитвы» +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_3", "Skill Cost -{sk1}", "Использование навыка -{sk1}", "", ""], ["Skill_mSkillDesc_220903_4", "Healing Prayer's Healing Multiplier +{sk1}%", "Множитель исцеления «Исцеляющей молитвы» +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_5", "Skill Cost -{sk1}", "Использование навыка -{sk1}", "", ""], ["Skill_mSkillDesc_220906_1", "<span style=\"color: #4A9DF2;\">1</span> ally in ATK Range can be immune to <span style=\"color: #4A9DF2;\">1</span> instance of fatal DMG. If the ally triggering this effect is with <span style=\"color: #28d37c;\">[322090,param1]</span>, also gains <span sty  <span style=\"color: #28d37c;\">[100251,param3]</span> to all allies with <span style=\"color: #28d37c;\">[322090,param3]</span>. When <span style=\"color: #28d37c;\">[322091,param3]</span> triggers healing upon natural expiration or refresh, grants <span style=\"color: #28d37c;\">[100106,param3]</span> to all allies with <span style=\"color: #28d37c;\">[322090,param3]</span>.", "Когда эффект «<span style=\"color: #28d37c;\">[322091,param3]</span>» активирует исцеление после снижения ОЗ носителя ниже 50%, дает эффект «<span style=\"color: #28d37c;\">[100251,param3]</span>» всем союзникам с эффектом «<span style=\"color: #28d37c;\">[322090,param3]</span>». Когда эффект «<span style=\"color: #28d37c;\">[322091,param3]</span>» активирует исцеление при естественном истечении или обновлении, дает эффект «<span style=\"color: #28d37c;\">[100106,param3]</span>» всем союзникам с эффектом «<span style=\"color: #28d37c;\">[322090,param3]</span>».", "", ""], ["Skill_mSkillSimpleDesc_220980_1", "When <span style=\"color: #4A9DF2;\">Sanctuary of Light</span> is triggered, reduces the hero's ATK Interval by <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "При срабатывании «<span style=\"color: #4A9DF2;\">Убежища света</span>» снижает интервал АТК героя на <span style=\"color: #4A9DF2;\">{skm1}%</span> на <span style=\"color: #4A9DF2;\">{skm2}</span> сек.", "", ""], ["Skill_mSkillSimpleDesc_227160_1", "Increases Basic ATK Range by <span style=\"color: #4A9DF2;\">1</span>. <span style=\"color: #28d37c;\">[322712]</span> also inflicts <span style=\"color: #fd4540;\">[200047]</span> on enemies.", "Увеличивает дальность базовой АТК на <span style=\"color: #4A9DF2;\">1</span>. Эффект «<span style=\"color: #28d37c;\">[322712]</span>» также накладывает на врагов эффект «<span style=\"color: #fd4540;\">[200047]</span>».", "", ""], ["Skill_mSkillSimpleDesc_227170_1", "During the Ultimate, <span style=\"color: #28d37c;\">[322710]</spa иже <span style=\"color: #4A9DF2;\">{skm3}%</span>, она получает доп. <span style=\"color: #4A9DF2;\">{skm4}%</span> пробивания ЗАЩ, до <span style=\"color: #4A9DF2;\">{skm5}</span> зар.", "", ""], ["Skill_mSkillSimpleDesc_232130_1", "When a unit retreats, dies, or the hero's summon perishes in range, her ATK increases by <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. Her next Basic ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target.", "Когда юнит отступает, умирает или призванное существо героя погибает в пределах дальности, ее АТК повышается на <span style=\"color: #4A9DF2;\">{skm1}%</span> на <span style=\"color: #4A9DF2;\">{skm2}</span> сек. Ее следующая базовая АТК наносит <span style=\"color: #4A9DF2;\">{skm3}%</span> УРН и накладывает на цель эффект «<span style=\"color: #fd4540;\">[200052,param15]</span>».", "", ""], ["Skill_mSkillSimpleDesc_232150_1", "When a unit retreats, dies, or the hero's summon perishes in range, her ATK increases by <span style=\"color: #4A9DF2;\">{skm1}%</span> for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. Her next Basic ATK deals <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG and inflicts <span style=\"color: #fd4540;\">[200052,param15]</span> on the target. If triggered when the hero's HP is below <span style=\"color: #4A9DF2;\">{skm4}%</span>, the duration is extended by <span style=\"color: #4A9DF2;\">{skm5}</span> sec, and the ATK Increase is raised to <span style=\"color: #4A9DF2;\">{skm6}%</span>.", "Когда юнит отступает, умирает или призванное существо героя погибает в пределах дальности, ее АТК повышается на <span style=\"color: #4A9DF2;\">{skm1}%</span> на <span style=\"color: #4A9DF2;\">{skm2}</span> сек. Ее следующая базовая АТК наносит <span style=\"color: #4A9DF2;\">{skm3}%</span> УРН и накладывает на цель эффект «<span style=\"color: #fd4540;\">[200052,param15]</span>». Если срабатывает, когда ОЗ героя ниже <span style=\"color: #4A9DF2;\">{skm4}%</span>, период действия продлевается на <span style=\"color: #4A9DF2;\">{skm5}</span> сек., а повышение АТК увеличивается до <span style=\"color: #4A9DF2;\">{skm6}%</span>.", "", ""], ["Skill_mSkillSimpleDesc_232160_1", "<span style=\"color: #28d37c;\">[23211,1]</span>'s ATK has a(n) <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to increase the number of shots by <span style=\"color: #4A9DF2;\">{skm2}</span>. Killing a target can increase it by <span style=\"color: #4A9DF2;\">{skm3}</span> time(s).", "У АТК существа «<span style=\"color: #28d37c;\">[23211,1]</span>» есть <span style=\"color: #4A9DF2;\">{skm1}%</span> шанс увеличить количество выстрелов на <span style=\"color: #4A9DF2;\">{skm2}</span>. Убийство цели может увеличить его на <span style=\"color: #4A9DF2;\">{skm3}</span> р.", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero's DMG by <span style=\"color: #4A9DF2;\">{skm1}%</span>, with an additional <span style=\"color: #4A9DF2;\">{skm2}%</span> against Elite and Boss units, lasting for <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "При активации таланта увеличивает УРН героя на <span style=\"color: #4A9DF2;\">{skm1}%</span> с доп. <span style=\"color: #4A9DF2;\">{skm2}%</span> против юнитов элиты и боссов, длится <span style=\"color: #4A9DF2;\">{skm3}</span> сек.", "", ""], ["Skill_mSkillSimpleDesc_232180_1", "Every <span style=\"color: #4A9DF2;\">{skm1}</span> time(s) the hero's Basic ATK deals DMG, it also triggers the Talent effect.", "Каждый <span style=\"color: #4A9DF2;\">{skm1}</span> р., когда базовая АТК героя наносит УРН, также активируется эффект таланта.", "", ""], ["Skill_mSkillSimpleDesc_232198_1", "Increases DMG in the Arena by <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "Повышает УРН на арене на <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "", ""], ["Skill_mSkillSimpleDesc_630614_1

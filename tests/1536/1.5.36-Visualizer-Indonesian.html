e field.", "Menghilangkan 1 debuff setiap 2 detik. Ketika Eirlys melakukan Heal kepada unit tim dengan Serene Breath, memperoleh {30,num}% Healing Bonus tambahan. Maksimal hanya bisa ada 2 unit tim dengan Serene Breath di battlefield.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Saat HP pembawa turun hingga kurang dari {30,num}%, langsung memulihkan HP setara {31,num}% ATK pengguna dan menghilangkan efek ini. Ketika durasi efek berakhir secara alami atau di-refresh, akan memulihkan HP pembawa setara {32,num}% ATK pengguna. Efek ini tidak bisa dihapus.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Saat HP pembawa turun hingga kurang dari {30,num}%, langsung memulihkan HP setara {31,num}% ATK pengguna dan menghilangkan efek ini. Ketika durasi efek berakhir secara alami atau di-refresh, akan memulihkan HP pembawa setara {32,num}% ATK pengguna. Efek ini tidak bisa dihapus.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer&#x27;s HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster&#x27;s ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster&#x27;s ATK for the bearer. This effect cannot be dispelled.", "Saat HP pembawa turun hingga kurang dari {30,num}%, langsung memulihkan HP setara {31,num}% ATK pengguna dan menghilangkan efek ini. Ketika durasi efek berakhi  monsters with HP below {32,num}%.", "Fire-Tipped Spear mengabaikan {30,num}% DEF lawan. Universe Ring memantul {31,num} kali lagi dan dapat mengenai target yang sama berkali-kali. Yin-Yang Blade mengeliminasi monster umum dengan HP di bawah {32,num}%.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Menembak 1 lawan dalam Jangkauan ATK pembawanya dengan cepat, bisa menembak {30,num} kali pada awalnya dan memberikan {31,num}% DMG setiap menembak. Tormented Soul musnah setelah semua tembakan digunakan. Memprioritaskan target di udara. Panah akan dikembalikan setiap kali mengenai target yang terjatuh. Maksimal hanya {32,num} yang ada di battlefield.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Menembak 1 lawan dalam Jangkauan ATK pembawanya dengan cepat, bisa menembak {30,num} kali pada awalnya dan memberikan {31,num}% DMG setiap menembak. Tormented Soul musnah setelah semua tembakan digunakan. Memprioritaskan target di udara. Panah akan dikembalikan setiap kali mengenai target yang terjatuh. Maksimal hanya {32,num} yang ada di battlefield.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner&#x27;s ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time Gear I untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Ikuti Raid Gear II untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Ikuti Raid Gear III untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Summon hero untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes&#x27; skills to win trophies and redeem rewards.", "Naikkan level/naikkan bintang/promosikan hero atau upgrade skill untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Ikuti Raid Artifact Material untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Ikuti Raid Gear I untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Leaderboard Ultimate Kedatangan Hero", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "Harta yang Hilang", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Peti di dalam Pasir", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Istana yang Terlupakan", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Kedatangan Hero", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Pelatihan Hero", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Misteri Artifact", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "Harta yang Hilang", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Chapter Cerita", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Chapter Tantangan", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "IP Domain Publik", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Invasi Zombie", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Beralih channel ....", "", ""], ["CommonText_mMessage_24292", "Challenges", "Tantangan", "", ""], ["CommonText_mMessage_25364", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystones&lt;/color&gt;\\nTrial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Challenge Rules&lt;/color&gt;\\nEach battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nEach Keystone possesses specific energy. &lt;color=&quot;#fdbe36&quot;&gt;1 energy is consumed per Trial attempt.&lt;/color&gt; When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Destroy Keystone&lt;/color&gt;\\nYou can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystones have a storage limit. Once full, you won&#x27;t be able to obtain any more Keystones. Please use them regularly to keep space available.&lt;/color&gt;", "&lt;color=&quot;#cec2b1&quot;&gt;Trial Keystone&lt;/color&gt;\\nTrial Keystone dapat diperoleh dari berbagai mode permainan. Keystone ini tersedia dalam berbagai jenis dan level, masing-masing berisi Ancient Inscription yang unik. Masukkan ke dalam altar untuk membuka jalur menuju trial yang sesuai. \\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Aturan Challenge&lt;/color&gt;\\nSetiap pertarungan terdiri dari beberapa wave monster. Mengalahkan setiap wave akan memberikanmu peti harta karun. Pertarungan tidak dapat di-restart setelah dimulai. Jika kamu keluar di tengah pertarungan, hadiah akan diberikan berdasarkan progres terakhir pertarunganmu. Kamu dapat menggunakan hingga 200 Keystone per bulan untuk tantangan trial. Setelah mencapai limit, tidak ada lagi challenge yang dapat dilakukan pada bulan tersebut.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Keystone Energy&lt;/color&gt;\\nSetiap keystone memiliki energy tertentu. &lt;color=&quot;#fdbe36&quot;&gt;Setiap percobaan trial akan mengonsumsi 1 energy.&lt;/color&gt;Jika keystone masih memiliki energy tersisa ketika pertarungan berakhir, kamu dapat memilih untuk mengabaikan hadiah dan pergi, kemudian mengonsumsi energy lagi untuk mengulang trial. Konsumsi energy tidak termasuk dalam penghitungan limit bulanan Keystone.\\n\\n&lt;color=&quot;#cec2b1&quot;&gt;Penghancuran Keystone&lt;/color&gt;\\nKamu dapat menghancurkan Keystone yang memenuhi persyaratan level penghancuran. Menghancurkan keystone tidak memberikan hadiah dan tidak dihitung dalam batas konsumsi bulanan Keystone.\\n&lt;color=&quot;#fd4540&quot;&gt;Trial Keystone memiliki batas penyimpanan. Setelah penuh, kamu tidak akan bisa memperoleh keystone lagi. Mohon gunakan secara rutin agar ruang penyimpanan tetap tersedia.&lt;/color&gt;", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Mossy Crystal", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Molten Crystal", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Begitu pertempuran dimulai, kamu tidak dapat mengulanginya. Jika keluar di tengah pertempuran, hadiah akan langsung dihitung, dan energi yang digunakan tidak akan dikembalikan.", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Wilayah vulkanik tempat lava mengalir deras saat kiamat. Diperlukan lebih banyak hero platform untuk melawan kekuatan jahat apokaliptik.", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;Kamu yakin ingin memberhentikan player ini dari posisi Marsekal?&lt;/color&gt;\\nSetiap Guild dapat memiliki maksimal {num1} Marsekal, yang masing-masing mendapatkan {num2} serangan tambahan setiap ronde.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Poin Ronde", "", ""], ["CommonText_mMessage_26126", "Destroy", "Hancurkan", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Destroyed Keystones cannot be recovered and will not grant any items.&lt;/color&gt;", "Lanjut menghancurkan {name}?\\n&lt;color=&quot;#fd4540&quot;&gt;Keystone yang dihancurkan tidak dapat dipulihkan dan tidak akan memberikan item apa pun.&lt;/color&gt;", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "Keystone telah dihancurkan.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Energi:", "", ""], ["CommonText_mMessage_26130", "Give up and Fly appears at fixed positions in battle.", "Healing Fly muncul di posisi yang tidak akan berubah dalam pertempuran.", "", ""], ["Difficulty_mStrategyDesc_7028", "Twisted Sycophant appears at fixed positions in battle.", "Twisted Sycophant muncul di posisi yang tidak akan berubah dalam pertempuran.", "", ""], ["Difficulty_mStrategyDesc_7031", "Thunder Beacon appears at fixed positions in battle.", "Thunder Beacon muncul di posisi yang tidak akan berubah dalam pertempuran.", "", ""], ["Difficulty_mStrategyDesc_7101", "Golden Guard appears randomly on the battlefield each wave.", "Golden Guard muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7102", "Giant Golem appears randomly on the battlefield each wave.", "Giant Golem muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7103", "Skeleton Archer appears randomly on the battlefield each wave.", "Skeleton Archer muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "Priestess of Rain muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "Gilded Warden muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "Aureate Inquisitor muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "Suicide muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "Sandtaker muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "Healing Fly muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "Twisted Sycophant muncul secara acak di battlefield pada setiap wave.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero&#x27;s DMG by 10% for 8 sec, stacking up to 5 times.", "(3 bagian) Ketika memberikan Crit. Hit dengan Basic ATK, meningkatkan 10% DMG hero selama 8 detik, bisa di-stack hingga 5 kali.", "", ""], ["HeroStory_mStory_2209", "&quot;She walks like a memory I have not earned, yet always long for.&quot;\\n-Rivenhald\\n\\nThey sent her north, where the snows upon her brow might bend her once more to their cause. \\n\\nOnce a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.\\n\\nThe Elven city spent months licking its wounds after the fires of Moriden&#x27;s assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. \\n\\nTya&#x27;s North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.\\n\\nEirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.\\n\\nShe made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.\\n\\nThe lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.\\n\\nLike Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they&#x27;ll understand the cost of survival... and who they truly are to one another.\\n\\nBut Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it&#x27;s gone. \\n\\nShe is the silence between two storms, biding the hour when one must break the other.", "&quot;Dia melangkah bagai kenangan yang tak pernah kuraih, namun selalu kurindukan.&quot;\\n-Rivenhald\\n\\nMereka mengutusnya ke utara, di mana salju di keningnya mungkin akan membuatnya sekali lagi tunduk pada tujuan mereka.\\n\\nDahulu seorang priestess Elyndris, Eirlys pernah berdiri di pusat ritual Ancient, suaranya teranyam dalam nafas para dewa. Namun sesuatu retak. Dia membuat pilihan yang tak berani disebutkan siapa pun, dan sanctum takkan mudah memaafkan.\\n\\nKota Elf menghabiskan berbulan-bulan menjilat luka Sesudah kobaran api Assault Moriden. Meski Tide telah berhasil dihalau, bekas luka tetap menganga, dan bersamanya datang Revelation yang mengerikan: mereka tak lagi tak tersentuh. Menara mereka telah Crack. Mitos mereka telah berdarah. Elyndris membutuhkan bayangan untuk bergerak di tempat spanduk tak mampu. Maka para peramal menatap ke luar. Diam-diam. Hati-hati. Mencari tempat di luar peta lama, di mana bangsa mereka bisa bersembunyi bila perang kembali datang.\\n\\nThe North Tya, tandus dan dingin, muncul dalam ramalan mereka bagaikan pisau dari salju. Harz, mereka kenal, namun tak berani mencari konflik dengan seseorang seterkenal dia. Akan tetapi, Rivenhald berkuasa di wilayah Frigid yang tak dikenal pramuka mereka—seorang Warlord dalam Semua hal kecuali gelar, raja yang tak tunduk pada mahkota mana pun selain miliknya sendiri. Mereka perlu memahaminya. Mengetahui apakah Kekuatan-nya bisa disubversi. Atau, bila perlu, seberapa mudah hal itu bisa dihancurkan.\\n\\nEirlys adalah jawaban mereka. Tanpa Teman, dia bukan diplomat maupun mata-mata, melainkan sesuatu yang lebih sunyi. Dia diutus dengan setengah kebenaran dan sumpah suci: raih kepercayaannya, baca jiwanya, dan laporkan apa yang tak bisa dilihat dari jauh. Dia datang terbungkus putih, kehadirannya dijelaskan sebagai penjaga perdamaian. Seorang Healer pengelana. Seorang priestess es. Dan Rivenhald, yang tak percaya pada siapa pun, mempercayainya.\\n\\nDia menjadikan dirinya berguna. Merawat luka, menerjemahkan pertanda, tak meninggalkan jejak motif tersembunyi. Dia mengamati. Dia membalas tatapan. Tak ada yang berkedip.\\n\\nGaris di antara mereka mengabur seiring waktu, kusut namun tetap kokoh. Dia mengenal Silence-nya, bentuk amarahnya, belas kasihan aneh yang dia kubur di bawah Semua itu. Di malam hari, ketika api meredup dan tak ada Pesan yang bisa dikirim, dia kadang membayangkan masa depan di mana dia hampir bisa dipercaya—di mana dia mungkin berarti lebih baginya... namun pagi selalu membakar lamunan itu.\\n\\nSeperti Rivenhald, dia juga bermimpi tentang bagaimana ini berakhir: dua sosok di salju, tak bergeming dan Unyielding. Satu pedang harus jatuh. Satu tujuan harus lenyap. Dan dalam kabut darah sebelum angin membawa semuanya pergi, mereka akan memahami Cost kelangsungan hidup... dan siapa sebenarnya mereka satu sama lain.\\n\\nNamun Eirlys tahu apa yang tak pernah diceritakan para peramal Elyndris kepadanya. The North tak dimiliki siapa pun. Bukan raja. Bukan kota. Dan tentu saja bukan hantu seperti dirinya. Apa pun masa depan yang menanti mereka, itu takkan dibangun atas kepercayaan, melainkan atas apa yang bertahan setelah itu hilang.\\n\\nDia adalah Silence antara dua badai, menanti saat ketika yang satu harus menghancurkan yang Lainnya.", "", ""], ["HeroStory_mStory_2321", "&quot;You will beg to be devoured. And I will be merciful.&quot;\\n—Hissed from the foliage\\n\\nIn the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.\\n\\nThe Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.\\n\\nAlas, there was only silence.\\n\\nAs the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.\\n\\nAnd yet, she remained only spirit—until Dassomi found her.\\n\\nThe famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.\\n\\nNo records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent&#x27;s Embrace was re-animated.\\n\\nHeeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.\\n\\nToday, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.\\n\\nAnd in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:\\n&quot;Thank you.&quot;", "&quot;Kau akan memohon untuk dilahap, dan aku akan menunjukkan belas kasihan.\\n&quot;—Desisan dari balik dedaunan\\n\\nDi hutan belantara hijau Tya, tempat akar-akar minum darah dan pepohonan mencekik yang hidup, pernah merayap sesosok roh racun dan bayangan—seekor ular yang hanya dikenal dalam bisikan sebagai Sythra. Meskipun pada masa itu, dia tidak memiliki raga; hanya memiliki taring, kelaparan, dan kenangan akan sebuah nama.\\n\\nKerajaan Scalekin, peradaban kuno yang kota-kota obsidiannya pernah membelah kanopi dan membagi lembah, telah lama lenyap dalam hamparan hijau yang subur. Namun, pada saat-saat terakhir mereka, mereka menuangkan sisa sihir terakhir mereka ke dalam patung-patung yang menjulang—patung makhluk-makhluk perkasa yang diukir dengan pengabdian, serta dilumuri oker dan abu; ditinggalkan sebagai persembahan kepada roh-roh hutan, berharap permohonan mereka akan dijawab.\\n\\nSayangnya, yang menjawab hanyalah keheningan.\\n\\nNamun, ketika kota metropolitan itu runtuh, ditelan utuh-utuh oleh gempuran dedaunan, patung-patung ini bertahan—terselubung lumut, setengah hancur, tapi hidup dengan gema-gema yang gelisah. Memang, ada roh-roh yang berdiam di dalam patung-patung ini, jiwa-jiwa hidup yang dipersembahkan sebagai hadiah kepada roh-roh hutan, dibelenggu oleh sihir Scalekin. Para pengembara malang yang tidak mencurigai labirin berdaun ini menemui ajal yang cepat begitu menemukan patung-patung ini, karena tempat ini sebenarnya adalah altar pengorbanan, mampu memanggil dewa-dewa yang perkasa. Sythra adalah salah satunya, sang dewi ular dan peninggalan kerajaan lama, sebuah desisan yang berputar-putar dalam pikiran mereka yang kehendaknya lemah dan terluka.\\n\\nNamun, dia tetap hanya sebuah roh—sampai Dassomi menemukannya.\\n\\nSang penyihir Scalekin yang masyhur itu telah lama percaya bahwa mimpi adalah jembatan menuju kebenaran yang lebih besar. Mencari kebijaksanaan yang hilang di sudut-sudut dunia yang terlupakan, Dassomi datang ke hutan, mengikuti penglihatan-penglihatan akan ular dan altar, tertarik ke dalam sebuah kuil telantar, seperti sebuah mimpi yang setengah teringat. Di sana, di jantung reruntuhan itu, dia membakar dupa dan berpindah dunia. Kemudian, Sythra menjawabnya.\\n\\nTidak ada catatan yang menuliskan tentang apa yang terjadi di antara mereka. Entah Dassomi telah menawarkan dirinya, atau hanya membuka portal yang terlalu lebar, hasilnya tetap sama. Sythra melepaskan wujud rohnya dan terlahir kembali ke dunia. The Serpent&#x27;s Embrace dihidupkan kembali.\\n\\nMengikuti hukum hutan, Sythra memburu siapa pun yang menyatakan superioritas—yang benar, yang murni, yang tak tergoyahkan. Dia melata ke kuil dan istana mereka, menawarkan satu pilihan terakhir, yaitu tunduk ... atau dilahap. Sythra bercita-cita melihat dinasti ularnya bangkit kembali, bertaring dan mulia, bermahkota hutan dan tulang. Dia bermimpi tentang benteng-benteng yang beruratkan tanaman merambat dan racun, tentang dunia di mana semua yang berjalan di atasnya tidak lagi lemah, meminum racunnya banyak-banyak, dan muncul menjadi indah dalam penderitaan.\\n\\nKini, Sythra tetap disembah, meskipun kultusnya tersebar dan rahasia, beberapa orang mengatakan bahwa kultus ini dipimpin oleh Dassomi sendiri. Mereka menandai diri mereka dengan taring, menyelipkan racun ke lidah mereka, dan bermimpi tentang kepuasan melalui rasa sakit dalam kesucian oleh penyembahan. Mereka berdoa untuk dipilih menjadi santapan—karena dipilih berarti diperhatikan, diburu, dan dicintai. Dicium oleh sang ular berarti merasakan kekuatan melingkar di sekitar jiwamu—melepaskan kelemahan seperti menanggalkan kulit mati dan terlahir kembali. Mereka yang selamat dari gigitannya menjadi pemburu baginya; pemburu yang mematikan, cantik, dan sangat setia.\\n\\nDan pada momen yang suci antara napas dan gigitan, ketika panah melayang tepat di atas hati, mereka semua akan membisikkan hal yang sama.\\n&quot;Terima kasih.&quot;", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Selubung Salju", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "Racun yang Paling Manis", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Hero: Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Hero: Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate &amp; is guaranteed within 200 summons!", "Pilih 1 hero eksklusif event untuk mengikuti event. Hero eksklusif yang dipilih memiliki drop rate yang meningkat &amp; dijamin dalam 200 summon!", "", ""], ["Item_mItemDesc_31097", "&lt;color=&quot;#eadca2&quot;&gt;Special Summon Offer&lt;/color&gt;\\n\\nGet the necessary materials for Hero Summon", "&lt;color=&quot;#eadca2&quot;&gt;Penawaran Khusus untuk Melakukan Summon&lt;/color&gt;\\n\\nDapatkan material yang diperlukan untuk Summon Hero", "", ""], ["Item_mItemDesc_3334", "&lt;color=&quot;#498a40&quot;&gt;Exclusive avatar border for the Arrival of Heroes Ultimate Leaderboard (Serpentborn Season).&lt;/color&gt;", "&lt;color=&quot;#498a40&quot;&gt;Border avatar eksklusif untuk Leaderboard Ultimate Kedatangan Hero (Season Serpentborn).&lt;/color&gt;", "", ""], ["Item_mItemDesc_3519", "Unknown Clue of Erlang Shen. When obtained, it will automatically convert into a random one from Erlang Shen&#x27;s Clues 1-5.", "Petunjuk Misterius dari Erlang Shen. Saat diperoleh, akan otomatis berubah menjadi satu petunjuk acak dari Petunjuk Erlang Shen 1-5.", "", ""], ["Item_mItemDesc_3521", "Erlang Shen&#x27;s Clue 2.\\n&lt;color=&quot;#498a40&quot;&gt;Usage: Consume this item via Fate&#x27;s Chapters to unlock the corresponding clue.&lt;/color&gt;", "Petunjuk Erlang Shen 2.\\n&lt;color=&quot;#498a40&quot;&gt;Cara pakai: Gunakan item ini melalui ls M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Memberikan M. DMG kepada unit terakhir yang ditempatkan di battlefield, mengutamakan Defender.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Memberikan M. DMG kepada unit terakhir yang ditempatkan di battlefield, mengutamakan Defender.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally within the Basic ATK Range and immediately grants this ally a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; of their Max HP for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec. The effect can only be triggered 1 time every &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "Mencegah DMG mematikan yang masuk 1 kali untuk &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; rekan tim dalam Jangkauan Basic ATK dan langsung memberikan Shield pada rekan tim ini setara &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; Max HP mereka selama &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; detik. Efek ini hanya dapat diaktifkan 1 kali setiap &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; detik.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG to up to &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; enemies.", "Memberikan &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; DMG kepada hingga &lt;color=&quot;#4A9DF2&quot;&gt;5&lt;/color&gt; lawan.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, and gains &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Grants allies of the same faction Elddr&#x27;s Talent temporarily. The Ultimate lasts for &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; sec.", "Meningkatkan ATK sebesar &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, dan memperoleh &lt;color=&quot;#28d37c&quot;&gt;[321900]&lt;/color&gt;. Memberikan Talent Elddr sementara kepada unit tim dari faction yang sama. Ultimate berlangsung selama &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}&lt;/color&gt; detik.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "Peningkatan ATK +{sk1}%", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "Peningkatan ATK +{sk1}%", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; chance to trigger Thunder Hammer, dealing an extra &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; DMG. If the hero has no shield, Thunder Hammer has a &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; chance to grant a shield equal to &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; ATK.", "Basic ATK memiliki &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; peluang untuk mengaktifkan Thunder Hammer, memberikan DMG tambahan sebesar &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt;. Jika hero ini tidak punya shield, Thunder Hammer memiliki &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}%&lt;/color&gt; peluang untuk memberikan shield setara &lt;color=&quot;#4A9DF2&quot;&gt;{skm4}%&lt;/color&gt; ATK.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally in range.", "Memberikan &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; &lt;color=&quot;#28d37c&quot;&gt;[310001]&lt;/color&gt; ke &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; unit tim dalam jangkauan.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "Pengali Heal +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "Pengali Heal +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "Pengali Heal +{sk1}%", "", ""], [

rmutasi dan ganas, inilah Mutant Rodent. &lt;color=#ff4500&gt;Saat diserang, mereka akan menggila dan menunjukkan peningkatan Movement Spd.&lt;/color&gt;", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Prajurit tengkorak dengan kapak raksasa yang dikendalikan oleh kebencian, sehingga membuat serangan mereka makin kuat.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "Sambil menyemburkan benang sutra, Queen Spider dapat membiakkan banyak laba-laba kecil dan meningkatkan atribut semua laba-laba.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Dia membantai semua yang mengadangnya tanpa ampun menggunakan gada raksasa.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Seorang petarung gila yang berkeliaran di penjara bawah, dia suka memenggal kepala orang.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Dia membantai semua yang mengadangnya tanpa ampun menggunakan gada raksasa.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Dengan capit tulang raksasa, Defender kanibal gila ini menyebabkan Bleed pada lawan.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Dengan capit tulang raksasa, Defender kanibal gila ini menyebabkan Bleed pada lawan.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Sisa jiwa yang tidak dapat diblokir atau terkena efek Slow, dan harus segera dieliminasi.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Berubah dari tentara yang gugur dalam pertempuran.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Dipenuhi kantong asam, Suicide suka meringkuk dan berguling ke depan.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these Mutant Rodents move faster when attacked.", "Bermutasi dan ganas, Mutant Rodent ini akan bergerak lebih cepat saat diserang.", "", ""], ["Unit_mFeature_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Prajurit tengkorak dengan kapak raksasa yang dikendalikan oleh kebencian, sehingga membuat serangan mereka makin kuat.", "", ""], ["Unit_mFeature_37114", "Dwelling underground, she is the real monarch there, able to breed and control small spiders and increase every attribute of all spiders in battle. Her silk is so tough that no one can break free easily once trapped.", "Dia tinggal di bawah tanah dan menjadi penguasa sesungguhnya di sana. Dia mampu membiakkan dan mengendalikan laba-laba kecil serta meningkatkan setiap atribut semua laba-laba dalam pertarungan. Benang sutranya sangat kuat sehingga tidak ada yang bisa lolos dengan mudah setelah terjerat.", "", ""], ["Unit_mGetDesc_2209", "Eirlys, the exiled elven priestess. Heals severe injuries with prayers, dispels debuffs, rescues allies from the brink of death, and accelerates the team&#x27;s Rage Regen.", "Eirlys, priestess elf yang diasingkan. Menyembuhkan luka parah dengan doa, menghilangkan debuff, menyelamatkan unit tim dari ambang kematian, dan mempercepat Rage Regen tim.", "", ""], ["Unit_mGetDesc_2321", "A remnant of the old world, Sythra, The Serpent&#x27;s Embrace, wanders through the Jungle. She summons Tormented Souls to attack with escalating ferocity, ignoring DEF to devour her enemies.", "Sisa dari dunia lama, Sythra, The Serpent&#x27;s Embrace, mengembara melalui hutan. Dia memanggil Tormented Soul untuk menyerang dengan keganasan yang makin meningkat, mengabaikan DEF untuk melahap musuh-musuhnya.", "", ""], ["Unit_mHeroDesignation_2209", "Winter&#x27;s Mercy", "Belas Kasih Musim Salju", "", ""], ["Unit_mHeroDesignation_2321", "The Serpent&#x27;s Embrace", "The Serpent&#x27;s Embrace", "", ""], ["Unit_mName_17200", "Knight of Destruction", "Knight of Destruction", "", ""], ["Unit_mName_17218", "Fallen Chopper", "Fallen Chopper", "", ""], ["Unit_mName_17219", "Slaughter", "Slaughter", "", ""], ["Unit_mName_17221", "Maw", "Maw", "", ""], ["Unit_mName_17222", "Maw", "Maw", "", ""], ["Unit_mName_2209", "Eirlys", "Eirlys", "", ""], ["Unit_mName_2321", "Sythra", "Sythra", "", ""], ["Unit_mName_34100", "Soul Eater", "Soul Eater", "", ""], ["Unit_mName_34103", "Suicide", "Suicide", "", ""], ["Unit_mName_34156", "Skeleton Executioner", "Skeleton Executioner", "", ""], ["Unit_mName_37114", "Queen Spider", "Queen Spider", "", ""], ["Unit_mName_37115", "Spider Cocoon", "Spider Cocoon", "", ""], ["Unit_mShare_2209", "Stay near me, and you just might survive.", "Tetap di sisiku, dan kau mungkin akan selamat.", "", ""], ["Unit_mShare_2321", "Tell me, do you fear what you desire?", "Katakan padaku, apakah kamu menakuti hasratmu?", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Detail", "During our special event for Tireless Raider, you can perform 1 Auto-fight and get rewards twice at a cost of double Stamina. Make your battles more efficient than ever!\n\nAuto-fight Bonus\n1. During the event, when auto-fighting in {name2}, Commanders can choose whether to activate the event bonus: each battle consumes {num3} times the regular Stamina cost but grants the rewards {num3} times. This is to enhance the material acquisition efficiency.\n2. In case of a failed challenge, the corresponding Stamina will be refunded.\n3. During the event, if the event bonus is activated, the Stamina consumption quests will be calculated based on the actual Stamina consumed.\n4. However, quests related to the number of clearances will not be affected by the event bonus. \n5. The event bonus is only applicable to stages that allow Auto-fight, hence First-Clear Rewards are not included in the reward bonus.\n6. When the bonus is activated, rewards will be generated based upon separate calculations, rather than directly doubling the result of 1.\n7. For the Brave Conquest event, the scoring of Gear/Artifact Material Raid&#x27;s Oracle&#x27;s Trial is consistent with gear/Meteorite drops, calculated based on the rarity and quantity of gear/Meteorite obtained after clearing stages.\n8. Please take note: During the bonus, if stages have random event token drops (such as the dice in Odyssey of Dreams), these tokens will not be affected by the bonus.", "Selama event spesial Tireless Raider, kamu bisa melakukan 1 Auto-Fight dan mendapatkan hadiah 2 kali lipat dengan mengonsumsi Stamina 2 kali lipat. Buat pertarunganmu lebih efisien dari sebelumnya!\n\nBonus Auto-Fight\n1. Selama event, saat melakukan Auto-Fight di {name2}, Commander dapat memilih untuk mengaktifkan bonus event: setiap pertarungan mengonsumsi Stamina {num3} kali lipat dari biaya normal tetapi memberikan hadiah {num3} kali lipat. Ini ditujukan untuk meningkatkan efisiensi perolehan material.\n2. Jika gagal dalam tantangan, Stamina yang sesuai akan dikembalikan.\n3. Selama event, jika bonus event diaktifkan, quest konsumsi Stamina akan dihitung berdasarkan Stamina yang benar-benar terpakai.\n4. Namun, quest yang terkait dengan jumlah penyelesaian tidak akan terpengaruh oleh bonus event.\n5. Bonus event hanya berlaku untuk stage yang memungkinkan Auto-Fight, sehingga Hadiah Penyelesaian Pertama tidak termasuk dalam bonus hadiah.\n6. Ketika bonus diaktifkan, hadiah akan dihasilkan berdasarkan perhitungan terpisah, bukan langsung melipatgandakan hasil dari 1.\n7. Untuk event Penaklukan yang Berani, penilaian Oracle&#x27;s Trial dari Raid Gear/Artifact Material konsisten dengan perolehan gear/Meteorite, dihitung berdasarkan tingkat kelangkaan dan jumlah gear/Meteorite yang diperoleh setelah menyelesaikan stage.\n8. Harap diperhatikan: Selama bonus berlangsung, jika stage memiliki drop token event acak (seperti dadu di Odyssey of Dreams), token tersebut tidak akan terpengaruh oleh bonus.", "", ""], ["LANG_STRID_SuperraidDoubleArtifact_Desc", "Tireless Raider is now available in Artifact Material Raid. During the event, performing Auto-fight costs double Stamina but earns the rewards twice, too.", "Tireless Raider sekarang tersedia di Raid Artifact Material. Selama event berlangsung, melakukan Auto-Fight membutuhkan Stamina 2 kali lipat, namun hadiah yang didapatkan juga menjadi 2 kali lipat.", "", ""], ["LANG_STRID_push_summon_Numera", "Time-Limited Rate-Up for Legendary Heroes Numera &amp; Aylin!", "Rate Up Waktu Terbatas untuk Hero Legendary Numera &amp; Aylin!", "", ""], ["LANG_STRID_push_summon_Fuen", "Time-Limited Rate-Up for Legendary Heroes Vorn &amp; Artemis!", "Rate Up Waktu Terbatas untuk Hero Legendary Vorn &amp; Artemis!", "", ""], ["LANG_STRID_push_summon_Nyx2", "Time-Limited Rate-Up for Legendary Heroes Nyx &amp; Malvira!", "Rate Up Waktu Terbatas untuk Hero Legendary Nyx &amp; Malvira!", "", ""], ["LANG_STRID_Shop_Skin_Pack_Title_32", "Dream Serpent Skin Bundle", "Dream Serpent Skin Bundle", "", ""], ["LANG_STRID_Shop_Skin_Title_54", "&quot;Tya&#x27;s Champion&quot; Valkyra", "Valkyra &quot;Tya&#x27;s Champion&quot;", "", ""], ["LANG_STRID_Shop_Skin_Title_55", "&quot;The Hollow Husk&quot; Aracha", "Aracha &quot;The Hollow Husk&quot;", "", ""], ["LANG_STRID_Shop_Skin_Title_56", "Sythra Skin Bundle", "Sythra Skin Bundle", "", ""], ["LANG_STRID_notice_aelsgl", "Hero Gameplay: Eirlys", "Gameplay Hero: Eirlys", "", ""], ["LANG_STRID_notice_xslgl", "Hero Gameplay: Sythra", "Gameplay Hero: Sythra", "", ""], ["LANG_STRID_Lottery_Detail_Yellow_X2&X15_Desc_01", "&lt;color=#91887c&gt;In this Divine Summoning event, the drop rates of &lt;color=#fdbe36&gt;all Legendary heroes&lt;/color&gt; are &lt;color=#b490fc&gt;2&lt;/color&gt; times the original rates, and the drop rates of the following heroes are multiplied by &lt;color=#b490fc&gt;20&lt;/color&gt; compared to other heroes of the same rarity. The drop rates are equal among other heroes of the same rarity.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;In this summon event, when you obtain a Legendary hero that is NOT currently featured as Rate-Up, the drop rate* of all Rate-Up heroes will additionally increase for your next summons.&lt;/color&gt; Here are the specifics:\n1. The first time you obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; in your future summons;\n2. If you again obtain a Legendary hero that is NOT featured as Rate-Up, the drop rate* of all Rate-Up heroes will be multiplied by &lt;color=#b490fc&gt;10&lt;/color&gt; again. This accumulating boost will continue until you successfully summon any Rate-Up hero.\n&lt;color=#91887c&gt;*The drop rate mentioned above refers to the relative probability of Rate-Up heroes compared to other heroes.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Note: This Pity Timer triggers ONLY once during this event.&lt;/color&gt;&lt;/color&gt;", "&lt;color=#91887c&gt;Dalam event Divine Summoning ini, drop rate &lt;color=#fdbe36&gt;semua Hero Legendary&lt;/color&gt; adalah &lt;color=#b490fc&gt;2&lt;/color&gt; kali lipat rate awal, dan drop rate hero berikut dikalikan &lt;color=#b490fc&gt;20&lt;/color&gt; dibandingkan hero lain dengan tingkat kelangkaan yang sama. Drop rate ini setara di antara hero lain dengan tingkat kelangkaan yang sama.&lt;/color&gt;\n\n&lt;color=#91887c&gt;&lt;color=#b3732b&gt;Dalam event summon ini, ketika kamu mendapatkan Hero Legendary yang saat ini BUKAN merupakan Rate-Up, drop rate* semua hero Rate-Up akan meningkat lebih besar pada summon berikutnya.&lt;/color&gt; Berikut adalah detailnya:\n1. Pertama kali kamu mendapatkan Hero Legendary yang BUKAN merupakan Rate-Up, drop rate* semua hero Rate-Up akan dikalikan &lt;color=#b490fc&gt;10&lt;/color&gt; pada summon selanjutnya;\n2. Jika kamu kembali mendapatkan Hero Legendary yang BUKAN merupakan Rate-Up, drop rate* semua hero Rate-Up akan dikalikan &lt;color=#b490fc&gt;10&lt;/color&gt; lagi. Peningkatan yang terakumulasi ini akan berlanjut hingga kamu berhasil mendapatkan hero Rate-Up mana pun.\n&lt;color=#91887c&gt;*Drop rate yang disebutkan di atas merujuk pada probabilitas relatif hero Rate-Up dibandingkan dengan hero lainnya.&lt;/color&gt;\n\n&lt;color=#df161f&gt;Catatan: Pity Timer ini HANYA aktif sekali selama event ini.&lt;/color&gt;&lt;/color&gt;", "", ""]],
            formattedData: [["Awakening_mAwakeningDesc_2209_2", "Healing Effect +<span style=\"color: #1e8852;\">8</span>", "Efek Heal +<span style=\"color: #1e8852;\">8</span>", "", ""], ["Awakening_mAwakeningDesc_2209_4", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "Rage Regen (Auto) +<span style=\"color: #1e8852;\">1</span>", "", ""], ["Awakening_mAwakeningDesc_2271_1", "Cost -<span style=\"color: #1e8852;\">2</span>", "Cost -<span style=\"color: #1e8852;\">2</span>", "", ""], ["Awakening_mAwakeningDesc_2321_2", "ATK +<span style=\"color: #1e8852;\">300</span>", "ATK +<span style=\"color: #1e8852;\">300</span>", "", ""], ["Awakening_mAwakeningDesc_2321_4", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "Penetration +<span style=\"color: #1e8852;\">8%</span>", "", ""], ["Awakening_mProphecyDesc_2209_1", "Even the faintest rays dispel darkness.", "Bahkan sinar paling redup pun mampu mengusir kegelapan.", "", ""], ["Awakening_mProphecyDesc_2209_2", "Light grows where we dare to nurture it.", "Cahaya tumbuh di tempat kau berani merawatnya dengan hati.", "", ""], ["Awakening_mProphecyDesc_2209_3", "Though storms brew on the horizon, I choose to believe.", "Meski badai menggelayut di ujung langit, aku tetap memilih percaya.", "", ""], ["Awakening_mProphecyDesc_2209_4", "Pander not to prophecies, for real truth lies within.", "Jangan tunduk pada ramalan, karena kebenaran sejati bersemayam dalam dirimu.", "", ""], ["Awakening_mProphecyDesc_2209_5", "All shall be revealed before the light.", "Semua akan tersingkap di hadapan cahaya yang mulia.", "", ""], ["Awakening_mProphecyDesc_2321_1", "These fangs are beginning to sharpen...", "Taring-taring ini mulai menjadi tajam ....", "", ""], ["Awakening_mProphecyDesc_2321_2", "With each skin shed, I become something more.", "Dengan setiap pergantian kulit, aku menjadi lebih kuat.", "", ""], ["Awakening_mProphecyDesc_2321_3", "Kneel, wretched cur… I am beyond divinity.", "Berlututlah, anjing jahanam .... Aku adalah sosok gaib yang melampaui ilahi.", "", ""], ["Awakening_mProphecyDesc_2321_4", "There is no antidote for my power.", "Tidak ada penawar bagi kekuatanku.", "", ""], ["Awakening_mProphecyDesc_2321_5", "There is no chaos, no order… only the serpent's will!", "Tidak ada kekacauan, tidak ada keteraturan ... hanya ada kehendak ular!", "", ""], ["BUFFAttribute_mName_100251", "DMG Increase", "Peningkatan DMG", "", ""], ["BUFFAttribute_mName_322090", "Serene Breath", "Serene Breath", "", ""], ["BUFFAttribute_mName_322091", "Healing Prayer", "Healing Prayer", "", ""], ["BUFFAttribute_mName_322092", "Healing Prayer", "Healing Prayer", "", ""], ["BUFFAttribute_mName_322093", "Healing Prayer", "Healing Prayer", "", ""], ["BUFFAttribute_mName_322094", "Healing Prayer", "Healing Prayer", "", ""], ["BUFFAttribute_mName_322095", "Healing Prayer", "Healing Prayer", "", ""], ["BUFFAttribute_mName_323210", "Tormented Soul", "Tormented Soul", "", ""], ["BUFFAttribute_mName_323211", "Tormented Soul", "Tormented Soul", "", ""], ["BUFFAttribute_mName_323212", "Tormented Soul", "Tormented Soul", "", ""], ["BUFFAttribute_mName_323213", "Tormented Soul", "Tormented Soul", "", ""], ["BUFFAttribute_mName_323214", "Tormented Soul", "Tormented Soul", "", ""], ["BUFFAttribute_mTips_100251", "DMG +{20,num/100}% (Takes effect only when stronger than the current buff/debuff on the same attribute.)", "DMG +{20,num/100}% (Berlaku hanya saat lebih kuat dari Buff/Debuff saat ini pada atribut yang sama).", "", ""], ["BUFFAttribute_mTips_321900", "Gains a shield equal to {30,num}% ATK per sec, stacking up to {31,num}% ATK.", "Memperoleh Shield sebesar {30,num}% ATK per detik, dapat di-stack hingga {31,num}% ATK.", "", ""], ["BUFFAttribute_mTips_322090", "Dispels 1 debuff every 2 sec. When Eirlys heals allies with Serene Breath, gains an extra {30,num}% Healing Bonus. Up to 2 allies with Serene Breath can be on the field.", "Menghilangkan 1 debuff setiap 2 detik. Ketika Eirlys melakukan Heal kepada unit tim dengan Serene Breath, memperoleh {30,num}% Healing Bonus tambahan. Maksimal hanya bisa ada 2 unit tim dengan Serene Breath di battlefield.", "", ""], ["BUFFAttribute_mTips_322091", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Saat HP pembawa turun hingga kurang dari {30,num}%, langsung memulihkan HP setara {31,num}% ATK pengguna dan menghilangkan efek ini. Ketika durasi efek berakhir secara alami atau di-refresh, akan memulihkan HP pembawa setara {32,num}% ATK pengguna. Efek ini tidak bisa dihapus.", "", ""], ["BUFFAttribute_mTips_322092", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Saat HP pembawa turun hingga kurang dari {30,num}%, langsung memulihkan HP setara {31,num}% ATK pengguna dan menghilangkan efek ini. Ketika durasi efek berakhir secara alami atau di-refresh, akan memulihkan HP pembawa setara {32,num}% ATK pengguna. Efek ini tidak bisa dihapus.", "", ""], ["BUFFAttribute_mTips_322093", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Saat HP pembawa turun hingga kurang dari {30,num}%, langsung memulihkan HP setara {31,num}% ATK pengguna dan menghilangkan efek ini. Ketika durasi efek berakhir secara alami atau di-refresh, akan memulihkan HP pembawa setara {32,num}% ATK pengguna. Efek ini tidak bisa dihapus.", "", ""], ["BUFFAttribute_mTips_322094", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Saat HP pembawa turun hingga kurang dari {30,num}%, langsung memulihkan HP setara {31,num}% ATK pengguna dan menghilangkan efek ini. Ketika durasi efek berakhir secara alami atau di-refresh, akan memulihkan HP pembawa setara {32,num}% ATK pengguna. Efek ini tidak bisa dihapus.", "", ""], ["BUFFAttribute_mTips_322095", "When the bearer's HP drops below {30,num}%, immediately restores HP equal to {31,num}% of the caster's ATK and removes this effect. When the effect duration naturally ends or is refreshed, restores HP equal to {32,num}% of the caster's ATK for the bearer. This effect cannot be dispelled.", "Saat HP pembawa turun hingga kurang dari {30,num}%, langsung memulihkan HP setara {31,num}% ATK pengguna dan menghilangkan efek ini. Ketika durasi efek berakhir secara alami atau di-refresh, akan memulihkan HP pembawa setara {32,num}% ATK pengguna. Efek ini tidak bisa dihapus.", "", ""], ["BUFFAttribute_mTips_322710", "Deals AoE M. DMG 1 time to up to {31,num} enemies ahead, including airborne units, and Mighty Thrust inflicts {32,num}% Vulnerability (M. DMG) on enemies for {33,num} sec.", "Memberikan M. DMG Area 1 kali hingga {31,num} lawan di depan, termasuk unit di udara, dan Mighty Thrust memberikan {32,num}% Vulnerability (M. DMG) kepada lawan selama {33,num} detik.", "", ""], ["BUFFAttribute_mTips_322928", "Fire-Tipped Spear ignores {30,num}% of the enemy's DEF. Universe Ring bounces {31,num} extra time(s) and can hit the same target multiple times. Yin-Yang Blade executes common monsters with HP below {32,num}%.", "Fire-Tipped Spear mengabaikan {30,num}% DEF lawan. Universe Ring memantul {31,num} kali lagi dan dapat mengenai target yang sama berkali-kali. Yin-Yang Blade mengeliminasi monster umum dengan HP di bawah {32,num}%.", "", ""], ["BUFFAttribute_mTips_323210", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Menembak 1 lawan dalam Jangkauan ATK pembawanya dengan cepat, bisa menembak {30,num} kali pada awalnya dan memberikan {31,num}% DMG setiap menembak. Tormented Soul musnah setelah semua tembakan digunakan. Memprioritaskan target di udara. Panah akan dikembalikan setiap kali mengenai target yang terjatuh. Maksimal hanya {32,num} yang ada di battlefield.", "", ""], ["BUFFAttribute_mTips_323211", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Menembak 1 lawan dalam Jangkauan ATK pembawanya dengan cepat, bisa menembak {30,num} kali pada awalnya dan memberikan {31,num}% DMG setiap menembak. Tormented Soul musnah setelah semua tembakan digunakan. Memprioritaskan target di udara. Panah akan dikembalikan setiap kali mengenai target yang terjatuh. Maksimal hanya {32,num} yang ada di battlefield.", "", ""], ["BUFFAttribute_mTips_323212", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Menembak 1 lawan dalam Jangkauan ATK pembawanya dengan cepat, bisa menembak {30,num} kali pada awalnya dan memberikan {31,num}% DMG setiap menembak. Tormented Soul musnah setelah semua tembakan digunakan. Memprioritaskan target di udara. Panah akan dikembalikan setiap kali mengenai target yang terjatuh. Maksimal hanya {32,num} yang ada di battlefield.", "", ""], ["BUFFAttribute_mTips_323213", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Menembak 1 lawan dalam Jangkauan ATK pembawanya dengan cepat, bisa menembak {30,num} kali pada awalnya dan memberikan {31,num}% DMG setiap menembak. Tormented Soul musnah setelah semua tembakan digunakan. Memprioritaskan target di udara. Panah akan dikembalikan setiap kali mengenai target yang terjatuh. Maksimal hanya {32,num} yang ada di battlefield.", "", ""], ["BUFFAttribute_mTips_323214", "Rapidly shoots at 1 enemy within its owner's ATK Range, initially can shoot {30,num} time(s) and dealing {31,num}% DMG each time. The Tormented Soul perishes after all shots are used. Prioritizes airborne targets. The arrow gets a return count each time it hits a fallen target. Up to {32,num} can exist on the field.", "Menembak 1 lawan dalam Jangkauan ATK pembawanya dengan cepat, bisa menembak {30,num} kali pada awalnya dan memberikan {31,num}% DMG setiap menembak. Tormented Soul musnah setelah semua tembakan digunakan. Memprioritaskan target di udara. Panah akan dikembalikan setiap kali mengenai target yang terjatuh. Maksimal hanya {32,num} yang ada di battlefield.", "", ""], ["ChampionshipPlan_mChampionshipDesc_843", "Participate in Gear Raid I to win trophies and redeem rewards.", "Ikuti Raid Gear I untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_844", "Participate in Gear Raid II to win trophies and redeem rewards.", "Ikuti Raid Gear II untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_845", "Participate in Gear Raid III to win trophies and redeem rewards.", "Ikuti Raid Gear III untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_846", "Summon heroes to win trophies and redeem rewards.", "Summon hero untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_847", "Level up/star up/promote heroes or upgrade heroes' skills to win trophies and redeem rewards.", "Naikkan level/naikkan bintang/promosikan hero atau upgrade skill untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_848", "Participate in Artifact Material Raid to win trophies and redeem rewards.", "Ikuti Raid Artifact Material untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipDesc_849", "Participate in Gear Raid I to win trophies and redeem rewards.", "Ikuti Raid Gear I untuk memenangkan trophy dan menukarkan hadiah.", "", ""], ["ChampionshipPlan_mChampionshipGlobalName_846", "Arrival of Heroes Ultimate Leaderboard", "Leaderboard Ultimate Kedatangan Hero", "", ""], ["ChampionshipPlan_mChampionshipName_843", "The Lost Legacy", "Harta yang Hilang", "", ""], ["ChampionshipPlan_mChampionshipName_844", "Vault in the Sands", "Peti di dalam Pasir", "", ""], ["ChampionshipPlan_mChampionshipName_845", "Forgotten Palace", "Istana yang Terlupakan", "", ""], ["ChampionshipPlan_mChampionshipName_846", "Arrival of Heroes", "Kedatangan Hero", "", ""], ["ChampionshipPlan_mChampionshipName_847", "Hero Training", "Pelatihan Hero", "", ""], ["ChampionshipPlan_mChampionshipName_848", "Mystery of Artifacts", "Misteri Artifact", "", ""], ["ChampionshipPlan_mChampionshipName_849", "The Lost Legacy", "Harta yang Hilang", "", ""], ["Chapter_mChapterName_9032", "Story Chapter", "Chapter Cerita", "", ""], ["Chapter_mChapterName_9033", "Challenge Chapter", "Chapter Tantangan", "", ""], ["ChapterType_mChapterName_214", "Public Domain IP", "IP Domain Publik", "", ""], ["ChapterType_mChapterName_801", "Zombie Invasion", "Invasi Zombie", "", ""], ["CommonText_mMessage_1539", "Switching channels...", "Beralih channel ....", "", ""], ["CommonText_mMessage_24292", "Challenges", "Tantangan", "", ""], ["CommonText_mMessage_25364", "<span style=\"color: #cec2b1;\">Trial Keystones</span><br>Trial Keystones can be obtained from various game modes. These Keystones come in different types and levels, each containing unique Ancient Inscriptions. Insert them into the altar to open pathways to their corresponding trials. <br><br><span style=\"color: #cec2b1;\">Challenge Rules</span><br>Each battle consists of multiple waves of monsters. Defeating each wave rewards you with a treasure chest. Once a battle begins, it cannot be restarted. If you exit midway, rewards will be settled based on your current battle progress. You can consume up to 200 Keystones per month for trial challenges. Once this limit is reached, no more challenges can be undertaken that month.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Each Keystone possesses specific energy. <span style=\"color: #fdbe36;\">1 energy is consumed per Trial attempt.</span> When the battle ends, if the Keystone still has Energy remaining, you can choose to forfeit the rewards and leave, then consume energy again to restart the trial. Energy consumption does not count toward the monthly Keystone limit.<br><br><span style=\"color: #cec2b1;\">Destroy Keystone</span><br>You can destroy Keystones that meet the destruction level requirements. Destroying Keystones yields no rewards and does not count toward the monthly Keystone consumption limit.<br><span style=\"color: #fd4540;\">Trial Keystones have a storage limit. Once full, you won't be able to obtain any more Keystones. Please use them regularly to keep space available.</span>", "<span style=\"color: #cec2b1;\">Trial Keystone</span><br>Trial Keystone dapat diperoleh dari berbagai mode permainan. Keystone ini tersedia dalam berbagai jenis dan level, masing-masing berisi Ancient Inscription yang unik. Masukkan ke dalam altar untuk membuka jalur menuju trial yang sesuai. <br><br><span style=\"color: #cec2b1;\">Aturan Challenge</span><br>Setiap pertarungan terdiri dari beberapa wave monster. Mengalahkan setiap wave akan memberikanmu peti harta karun. Pertarungan tidak dapat di-restart setelah dimulai. Jika kamu keluar di tengah pertarungan, hadiah akan diberikan berdasarkan progres terakhir pertarunganmu. Kamu dapat menggunakan hingga 200 Keystone per bulan untuk tantangan trial. Setelah mencapai limit, tidak ada lagi challenge yang dapat dilakukan pada bulan tersebut.<br><br><span style=\"color: #cec2b1;\">Keystone Energy</span><br>Setiap keystone memiliki energy tertentu. <span style=\"color: #fdbe36;\">Setiap percobaan trial akan mengonsumsi 1 energy.</span>Jika keystone masih memiliki energy tersisa ketika pertarungan berakhir, kamu dapat memilih untuk mengabaikan hadiah dan pergi, kemudian mengonsumsi energy lagi untuk mengulang trial. Konsumsi energy tidak termasuk dalam penghitungan limit bulanan Keystone.<br><br><span style=\"color: #cec2b1;\">Penghancuran Keystone</span><br>Kamu dapat menghancurkan Keystone yang memenuhi persyaratan level penghancuran. Menghancurkan keystone tidak memberikan hadiah dan tidak dihitung dalam batas konsumsi bulanan Keystone.<br><span style=\"color: #fd4540;\">Trial Keystone memiliki batas penyimpanan. Setelah penuh, kamu tidak akan bisa memperoleh keystone lagi. Mohon gunakan secara rutin agar ruang penyimpanan tetap tersedia.</span>", "", ""], ["CommonText_mMessage_25383", "Mossy Crystal", "Mossy Crystal", "", ""], ["CommonText_mMessage_25384", "Molten Crystal", "Molten Crystal", "", ""], ["CommonText_mMessage_25602", "Once a battle begins, it cannot be restarted. Exiting mid-battle will trigger immediate settlement, and the energy consumed will not be returned!", "Begitu pertempuran dimulai, kamu tidak dapat mengulanginya. Jika keluar di tengah pertempuran, hadiah akan langsung dihitung, dan energi yang digunakan tidak akan dikembalikan.", "", ""], ["CommonText_mMessage_25702", "A volcanic region where lava surges during the apocalypse. More platform heroes are needed to fend off the apocalyptic evil forces.", "Wilayah vulkanik tempat lava mengalir deras saat kiamat. Diperlukan lebih banyak hero platform untuk melawan kekuatan jahat apokaliptik.", "", ""], ["CommonText_mMessage_25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">Kamu yakin ingin memberhentikan player ini dari posisi Marsekal?</span><br>Setiap Guild dapat memiliki maksimal {num1} Marsekal, yang masing-masing mendapatkan {num2} serangan tambahan setiap ronde.", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "Poin Ronde", "", ""], ["CommonText_mMessage_26126", "Destroy", "Hancurkan", "", ""], ["CommonText_mMessage_26127", "Proceed to destroy {name}?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Lanjut menghancurkan {name}?<br><span style=\"color: #fd4540;\">Keystone yang dihancurkan tidak dapat dipulihkan dan tidak akan memberikan item apa pun.</span>", "", ""], ["CommonText_mMessage_26128", "Keystone has been destroyed.", "Keystone telah dihancurkan.", "", ""], ["CommonText_mMessage_26129", "Energy:", "Energi:", "", ""], ["CommonText_mMessage_26130", "Give up and leave", "Menyerah dan Keluar", "", ""], ["CommonText_mMessage_26131", "Claim", "Klaim", "", ""], ["CommonText_mMessage_26132", "Remaining Keystone Energy:", "Sisa Keystone Energy:", "", ""], ["CommonText_mMessage_26133", "Battle Gallery", "Galeri Pertarungan", "", ""], ["CommonText_mMessage_26134", "Guides", "Panduan", "", ""], ["CommonText_mMessage_26135", "Appearing Keystone:", "Keystone yang Muncul:", "", ""], ["CommonText_mMessage_26136", "Mossy Crystal", "Mossy Crystal", "", ""], ["CommonText_mMessage_26137", "Molten Crystal", "Molten Crystal", "", ""], ["CommonText_mMessage_26138", "Only Display Current Keystone Tags", "Hanya Tampilkan Tag Keystone Saat Ini", "", ""], ["CommonText_mMessage_26139", "Most Popular Heroes are calculated based on hero pick rates, for reference only.", "Hero paling populer dihitung berdasarkan tingkat pemilihan hero, hanya untuk referensi.", "", ""], ["CommonText_mMessage_26140", "Search", "Cari", "", ""], ["CommonText_mMessage_26141", "Search Results", "Hasil Pencarian", "", ""], ["CommonText_mMessage_26142", "Loading data...", "Memuat data ...", "", ""], ["CommonText_mMessage_26143", "Collecting Hero Data", "Mengumpulkan Data Hero", "", ""], ["CommonText_mMessage_26144", "Enter at least {num} character(s)", "Masukkan minimal {num} karakter", "", ""], ["CommonText_mMessage_26145", "No matching tags found.", "Tidak ditemukan tag yang sesuai.", "", ""], ["CommonText_mMessage_26146", "Auto-fight is unavailable for the current level of Keystone.", "Auto-Fight tidak tersedia untuk level Keystone saat ini.", "", ""], ["CommonText_mMessage_26147", "You can upload Auto-fight records after manually clearing Wave {num}.", "Kamu dapat mengunggah rekaman Auto-Fight setelah menyelesaikan Wave {num} secara manual.", "", ""], ["CommonText_mMessage_26148", "Auto-fight may fail due to different Keystone tags. Do you want to proceed with Auto-fight?", "Auto-Fight mungkin gagal karena tag Keystone yang berbeda. Apakah kamu ingin melanjutkan Auto-Fight?", "", ""], ["CommonText_mMessage_26149", "Upload this battle as a new Auto-fight record?", "Unggah pertarungan ini sebagai rekaman Auto-Fight baru?", "", ""], ["CommonText_mMessage_26150", "Due to the varying tags of Keystones, we recommend selecting the most comprehensive lineup possible for uploading Auto-fight!", "Karena ada tag Keystone yang bervariasi, kami menyarankan untuk memilih lineup paling lengkap untuk mengunggah Auto-Fight!", "", ""], ["CommonText_mMessage_26151", "Keystone storage is full. Use some Keystones before buying more.", "Penyimpanan Keystone penuh. Gunakan beberapa Keystone sebelum membeli lebih banyak.", "", ""], ["CommonText_mMessage_26152", "Go Clean", "Pergi Bersihkan", "", ""], ["CommonText_mMessage_26153", "Unopened random Keystone Chests have been detected in your Storage. Would you like to open them now?", "Keystone Chest acak yang belum dibuka terdeteksi di Penyimpanan. Apakah kamu ingin membukanya sekarang?", "", ""], ["CommonText_mMessage_26154", "Go", "Mulai", "", ""], ["CommonText_mMessage_26155", "Lvl. {num1}-{num2}", "Lvl. {num1}-{num2}", "", ""], ["CommonText_mMessage_26156", "This level's Keystone cannot be destroyed.", "Keystone level ini tidak dapat dihancurkan.", "", ""], ["CommonText_mMessage_26157", "Are you sure you want to destroy <span style=\"color: #fd4540;\">{num}</span> Keystone(s)?<br><span style=\"color: #fd4540;\">Destroyed Keystones cannot be recovered and will not grant any items.</span>", "Kamu yakin ingin menghancurkan <span style=\"color: #fd4540;\">{num}</span> Keystone?<br><span style=\"color: #fd4540;\">Keystone yang dihancurkan tidak dapat dipulihkan dan tidak akan memberikan item apa pun.</span>", "", ""], ["CommonText_mMessage_26158", "Destroyed {num} Keystone(s).", "Menghancurkan {num} Keystone.", "", ""], ["CommonText_mMessage_26159", "Monthly Usage:", "Penggunaan Bulanan:", "", ""], ["CommonText_mMessage_26160", "Keystones have a monthly challenge limit. No further attempts are allowed after reaching the cap.", "Keystone memiliki limit tantangan bulanan. Kamu tidak bisa menantang lagi setelah mencapai limit.", "", ""], ["CommonText_mMessage_26161", "The current difficulty has claimable rewards. Are you sure you want to try a different difficulty?<br><span style=\"color: #e04242;\">During the event, you can only choose one difficulty per day to claim rewards.</span>", "Kesulitan saat ini memiliki hadiah yang dapat diklaim. Apakah kamu yakin ingin mencoba kesulitan yang berbeda?<br><span style=\"color: #e04242;\">Selama event, kamu hanya dapat memilih satu kesulitan per hari untuk mengklaim hadiah.</span>", "", ""], ["CommonText_mMessage_26162", "Don't remind me again.", "Jangan ingatkan lagi.", "", ""], ["CommonText_mMessage_26163", "Keystone storage is full. Please use some first before unlocking.", "Penyimpanan Keystone penuh. Gunakan beberapa terlebih dahulu sebelum membukanya.", "", ""], ["CommonText_mMessage_26164", "Replay version does not match current version and cannot be viewed.", "Versi replay tidak cocok dengan versi saat ini dan tidak dapat dilihat.", "", ""], ["CommonText_mMessage_26165", "Enter up to {num} character(s).", "Masukkan maksimal {num} karakter.", "", ""], ["CommonText_mMessage_26166", "Popular Heroes", "Hero Populer", "", ""], ["CommonText_mMessage_26167", "Tag", "Tag", "", ""], ["CommonText_mMessage_8411", "Trial Keystone Storage Full", "Penyimpanan Trial Keystone Penuh", "", ""], ["Difficulty_mDetail_73001", "Reduces Soul Eater's Movement Spd. by 30. They are <span style=\"color: #fd4540;\">immune to Slow</span>.", "Mengurangi Movement Speed Soul Eater sebesar 30. Mereka <span style=\"color: #fd4540;\">kebal terhadap Slow</span>.", "", ""], ["Difficulty_mDetail_73003", "White Tower's Scholar enters <span style=\"color: #fd4540;\">Invisibility</span> and becomes visible when blocked.", "White Tower's Scholar memasuki kondisi <span style=\"color: #fd4540;\">Invisibility</span> dan akan terlihat ketika diblokir.", "", ""], ["Difficulty_mDetail_73004", "White Tower's Scholar becomes <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "White Tower's Scholar menjadi <span style=\"color: #fd4540;\">kebal terhadap M. DMG</span>.", "", ""], ["Difficulty_mDetail_73005", "Small Arachnid gains <span style=\"color: #fd4540;\">unyielding effect</span> for 3 sec upon death and becomes <span style=\"color: #fd4540;\">immune to Control and Slow</span>.", "Small Arachnid memperoleh <span style=\"color: #fd4540;\">efek unyielding</span> selama 3 detik setelah mati dan menjadi <span style=\"color: #fd4540;\">kebal terhadap Control dan Slow</span>.", "", ""], ["Difficulty_mDetail_73006", "Small Arachnid <span style=\"color: #fd4540;\">restores 50% HP</span> every 5 sec.", "Small Arachnid <span style=\"color: #fd4540;\">memulihkan 50% HP</span> setiap 5 detik.", "", ""], ["Difficulty_mDetail_73007", "Lightning Guard's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "Movement Spd. Lightning Guard <span style=\"color: #fd4540;\">ditingkatkan sebesar 30</span>.", "", ""], ["Difficulty_mDetail_73008", "Lightning Guard is <span style=\"color: #fd4540;\">immune to DMG taken</span>, but loses 5% HP per sec.", "Lightning Guard <span style=\"color: #fd4540;\">kebal terhadap DMG yang diterima</span>, tetapi kehilangan 5% HP per detik.", "", ""], ["Difficulty_mDetail_73009", "Murkling Menace's Fatigue becomes <span style=\"color: #fd4540;\">permanent</span>.", "Fatigue Murkling Menace menjadi <span style=\"color: #fd4540;\">permanen</span>.", "", ""], ["Difficulty_mDetail_73010", "Plated Komodo is <span style=\"color: #fd4540;\">immune to CC Effects</span>.", "Plated Komodo <span style=\"color: #fd4540;\">kebal terhadap Efek CC</span>.", "", ""], ["Difficulty_mDetail_73011", "Plated Komodo gains an additional 30% P. and M. DMG Reduction <span style=\"color: #fd4540;\">when blocked</span>.", "Plated Komodo memperoleh 30% Pengurangan P. DMG dan M. DMG tambahan <span style=\"color: #fd4540;\">ketika diblokir</span>.", "", ""], ["Difficulty_mDetail_73012", "Frozen Cleric <span style=\"color: #fd4540;\">summons an extra</span> Ice Vermin.", "Frozen Cleric <span style=\"color: #fd4540;\">memanggil satu lagi</span> Ice Vermin.", "", ""], ["Difficulty_mDetail_73013", "Frozen Cleric <span style=\"color: #fd4540;\">spawns</span> 3 Ice Vermin <span style=\"color: #fd4540;\">upon death</span>.", "Frozen Cleric akan <span style=\"color: #fd4540;\">memunculkan</span> 3 Ice Vermin <span style=\"color: #fd4540;\">saat tereliminasi</span>.", "", ""], ["Difficulty_mDetail_73014", "Thunder Guard stops attacking and gains <span style=\"color: #fd4540;\">Movement Spd. +50</span>.", "Thunder Guard berhenti menyerang dan memperoleh <span style=\"color: #fd4540;\">Movement Spd. +50</span>.", "", ""], ["Difficulty_mDetail_73015", "Thunder Guard's <span style=\"color: #fd4540;\">ATK is increased by 100%</span>, but <span style=\"color: #fd4540;\">when attacking shields</span>, deducts 50% of its HP.", "ATK Thunder Guard <span style=\"color: #fd4540;\">ditingkatkan sebesar 100%</span>, tapi <span style=\"color: #fd4540;\">ketika menyerang Shield</span>, mengurangi 50% HP-nya.", "", ""], ["Difficulty_mDetail_73016", "Fogborne Dead Eye is <span style=\"color: #fd4540;\">immune to M. DMG</span>.", "Fogborne Dead Eye <span style=\"color: #fd4540;\">kebal terhadap M. DMG</span>.", "", ""], ["Difficulty_mDetail_73017", "Mist: Baron Salem restores <span style=\"color: #fd4540;\">10% HP</span> with each ATK.", "Mist: Baron Salem memulihkan <span style=\"color: #fd4540;\">10% HP</span> dengan setiap ATK.", "", ""], ["Difficulty_mDetail_73018", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">Cooldown is reduced by 100%</span>.", "Cooldown Accelerated Incubation Incubator <span style=\"color: #fd4540;\">berkurang 100%</span>.", "", ""], ["Difficulty_mDetail_73019", "Incubator's Accelerated Incubation <span style=\"color: #fd4540;\">spawns 2 extra Suicides</span>.", "Accelerated Incubation Incubator <span style=\"color: #fd4540;\">memunculkan 2 Suicide tambahan</span>.", "", ""], ["Difficulty_mDetail_73020", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">drains 10% of the target's Rage</span>.", "Saat memberikan DMG kepada target, Priest of Thunder <span style=\"color: #fd4540;\">menyerap 10% Rage target</span>.", "", ""], ["Difficulty_mDetail_73021", "When dealing DMG to a target, Priest of Thunder <span style=\"color: #fd4540;\">permanently reduces their Max HP by 10%</span>. This effect can be stacked.", "Saat memberikan DMG kepada target, Priest of Thunder <span style=\"color: #fd4540;\">mengurangi Max HP mereka sebesar 10% secara permanen</span>. Efek ini dapat di-stack.", "", ""], ["Difficulty_mDetail_73022", "Scourge reduces <span style=\"color: #fd4540;\">healing</span> received by <span style=\"color: #fd4540;\">all units in range</span> by 50%.", "Scourge mengurangi <span style=\"color: #fd4540;\">healing</span> yang diterima oleh <span style=\"color: #fd4540;\">semua unit dalam jangkauan</span> sebesar 50%.", "", ""], ["Difficulty_mDetail_73023", "Scourge's DMG range expands to <span style=\"color: #fd4540;\">adjacent 2 tiles</span>.", "Jangkauan DMG Scourge diperluas menjadi <span style=\"color: #fd4540;\">2 petak yang bersebelahan</span>.", "", ""], ["Difficulty_mDetail_73024", "When Mist: Superior Abyssal Beholder dies, it deals M. DMG equal to 100% ATK to <span style=\"color: #fd4540;\">blocked targets</span>.", "Saat Mist: Superior Abyssal Beholder tereliminasi, ia akan memberikan M. DMG sebesar 100% ATK kepada <span style=\"color: #fd4540;\">target yang diblokir</span>.", "", ""], ["Difficulty_mDetail_73025", "Raging Mutant Rodent becomes <span style=\"color: #fd4540;\">unblockable</span>.", "Raging Mutant Rodent menjadi <span style=\"color: #fd4540;\">tidak dapat diblokir</span>.", "", ""], ["Difficulty_mDetail_73026", "Raging Mutant Rodent <span style=\"color: #fd4540;\">increases Movement Spd. by 30</span>.", "Raging Mutant Rodent <span style=\"color: #fd4540;\">meningkatkan Movement Spd. sebesar 30</span>.", "", ""], ["Difficulty_mDetail_73027", "For every 20% HP Baron Salem loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "Untuk setiap 20% HP Baron Salem yang hilang, dia <span style=\"color: #fd4540;\">memperoleh 20% DEF dan M. RES</span>.", "", ""], ["Difficulty_mDetail_73028", "Shadowcaster's <span style=\"color: #fd4540;\">Movement Spd. is increased by 30</span>.", "Movement Spd. Shadowcaster <span style=\"color: #fd4540;\">ditingkatkan sebesar 30</span>.", "", ""], ["Difficulty_mDetail_73029", "For every 20% HP Shadowcaster loses, it <span style=\"color: #fd4540;\">gains 20% DEF and M. RES</span>.", "Untuk setiap 20% HP Shadowcaster yang hilang, dia <span style=\"color: #fd4540;\">memperoleh 20% DEF dan M. RES</span>.", "", ""], ["Difficulty_mDetail_73030", "Increases Common Destroyers' DEF and M. RES. by 30%. <span style=\"color: #fd4540;\">When under CC Effects, reduces by 50%</span>.", "Meningkatkan DEF dan M. RES. Common Destroyer sebesar 30%. <span style=\"color: #fd4540;\">Saat terkena CC Effect, akan berkurang sebesar 50%</span>.", "", ""], ["Difficulty_mDetail_73031", "Common Destroyer is immune to DMG when <span style=\"color: #fd4540;\">stunned or frozen</span>.", "Common Destroyer kebal terhadap DMG saat <span style=\"color: #fd4540;\">terkena stun atau freeze</span>.", "", ""], ["Difficulty_mDetail_73032", "Uncommon Destroyer gains an <span style=\"color: #fd4540;\">initial Hitcount Shield</span>.", "Uncommon Destroyer memperoleh <span style=\"color: #fd4540;\">Hitcount Shield awal</span>.", "", ""], ["Difficulty_mDetail_73033", "Uncommon Destroyer <span style=\"color: #fd4540;\">gains 5 Movement Spd. each time taking DMG</span>.", "Uncommon Destroyer <span style=\"color: #fd4540;\">memperoleh 5 Movement Spd.</span> setiap kali menerima DMG.", "", ""], ["Difficulty_mDetail_73034", "Batwings Banshee's Ultrasonic Wave <span style=\"color: #fd4540;\">DMG increases by 100%</span> and does not inflict Poison.", "DMG Ultrasonic Wave dari Batwings Banshee <span style=\"color: #fd4540;\">meningkat 100%</span> dan tidak menyebabkan Poison.", "", ""], ["Difficulty_mDetail_73035", "Batwings ttlefield each wave.", "Skeleton Archer muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7104", "Priestess of Rain appears randomly on the battlefield each wave.", "Priestess of Rain muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7105", "Gilded Warden appears randomly on the battlefield each wave.", "Gilded Warden muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7106", "Aureate Inquisitor appears randomly on the battlefield each wave.", "Aureate Inquisitor muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7107", "Suicide appears randomly on the battlefield each wave.", "Suicide muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7108", "Sandtaker appears randomly on the battlefield each wave.", "Sandtaker muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7109", "Healing Fly appears randomly on the battlefield each wave.", "Healing Fly muncul secara acak di battlefield pada setiap wave.", "", ""], ["Difficulty_mStrategyDesc_7110", "Twisted Sycophant appears randomly on the battlefield each wave.", "Twisted Sycophant muncul secara acak di battlefield pada setiap wave.", "", ""], ["EquipSuitDescribe_mSuitEffectDescribe_722800", "(3 pieces) Upon landing a Crit. Hit with Basic ATK, increases the hero's DMG by 10% for 8 sec, stacking up to 5 times.", "(3 bagian) Ketika memberikan Crit. Hit dengan Basic ATK, meningkatkan 10% DMG hero selama 8 detik, bisa di-stack hingga 5 kali.", "", ""], ["HeroStory_mStory_2209", "\"She walks like a memory I have not earned, yet always long for.\"<br>-Rivenhald<br><br>They sent her north, where the snows upon her brow might bend her once more to their cause. <br><br>Once a priestess of Elyndris, Eirlys had stood at the heart of ancient rites, her voice woven into the breath of gods. But something broke. She made a choice no one dared name, and the sanctum would not forgive easily.<br><br>The Elven city spent months licking its wounds after the fires of Moriden's assault. Though the tide had been repelled, the scars remained, and with them, a terrifying revelation: they were no longer untouchable. Their towers had cracked. Their myths had bled. Elyndris needed shadows to move where banners could not. So the seers looked outward. Quietly. Carefully. Seeking places beyond the old maps, where their kind might hide if war returned. <br><br>Tya's North, desolate and cold, rose in their auguries like a blade from snow. Harz, they knew of, but dared not seek conflict with one of his renown. Rivenhald, however, ruled in the frigid regions unknown to their scouts—a warlord in all but title, a monarch who bent to no crown but his own. They needed to understand him. To know if his strength could be subverted. Or, if necessary, how easily it could be broken.<br><br>Eirlys was their answer. No friends, she was neither diplomat nor spy, but something quieter. She was sent with half-truths and a sacred oath: earn his trust, read his soul, and report what cannot be seen from afar. She came wrapped in white, her presence explained as peacekeeping. A wandering healer. A priestess of frost. And Rivenhald, who trusted no one, trusted her.<br><br>She made herself useful. Tended wounds, translated omens, left no trace of ulterior motive. He watched. She watched back. Neither blinked.<br><br>The lines between them blurred over time, tangling but remaining steadfast. She came to know his silences, the shape of his anger, the strange mercy he buried beneath it all. At night, when the fire burned low and no messages could be sent, she sometimes envisioned a future where he might almost be trusted—where he might mean more to her... but morning always burned the reverie away.<br><br>Like Rivenhald, she, too, dreams of how it ends: two figures in the snow, unflinching and unyielding. One blade must fall. One cause must vanish. And in the blood-mist before the wind takes it all, they'll understand the cost of survival... and who they truly are to one another.<br><br>But Eirlys knows what the seers of Elyndris never told her. The North does not belong to anyone. Not to kings. Not to cities. And certainly not to ghosts like her. Whatever future awaits them, it will not be built on trust, but on what survives after it's gone. <br><br>She is the silence between two storms, biding the hour when one must break the other.", "\"Dia melangkah bagai kenangan yang tak pernah kuraih, namun selalu kurindukan.\"<br>-Rivenhald<br><br>Mereka mengutusnya ke utara, di mana salju di keningnya mungkin akan membuatnya sekali lagi tunduk pada tujuan mereka.<br><br>Dahulu seorang priestess Elyndris, Eirlys pernah berdiri di pusat ritual Ancient, suaranya teranyam dalam nafas para dewa. Namun sesuatu retak. Dia membuat pilihan yang tak berani disebutkan siapa pun, dan sanctum takkan mudah memaafkan.<br><br>Kota Elf menghabiskan berbulan-bulan menjilat luka Sesudah kobaran api Assault Moriden. Meski Tide telah berhasil dihalau, bekas luka tetap menganga, dan bersamanya datang Revelation yang mengerikan: mereka tak lagi tak tersentuh. Menara mereka telah Crack. Mitos mereka telah berdarah. Elyndris membutuhkan bayangan untuk bergerak di tempat spanduk tak mampu. Maka para peramal menatap ke luar. Diam-diam. Hati-hati. Mencari tempat di luar peta lama, di mana bangsa mereka bisa bersembunyi bila perang kembali datang.<br><br>The North Tya, tandus dan dingin, muncul dalam ramalan mereka bagaikan pisau dari salju. Harz, mereka kenal, namun tak berani mencari konflik dengan seseorang seterkenal dia. Akan tetapi, Rivenhald berkuasa di wilayah Frigid yang tak dikenal pramuka mereka—seorang Warlord dalam Semua hal kecuali gelar, raja yang tak tunduk pada mahkota mana pun selain miliknya sendiri. Mereka perlu memahaminya. Mengetahui apakah Kekuatan-nya bisa disubversi. Atau, bila perlu, seberapa mudah hal itu bisa dihancurkan.<br><br>Eirlys adalah jawaban mereka. Tanpa Teman, dia bukan diplomat maupun mata-mata, melainkan sesuatu yang lebih sunyi. Dia diutus dengan setengah kebenaran dan sumpah suci: raih kepercayaannya, baca jiwanya, dan laporkan apa yang tak bisa dilihat dari jauh. Dia datang terbungkus putih, kehadirannya dijelaskan sebagai penjaga perdamaian. Seorang Healer pengelana. Seorang priestess es. Dan Rivenhald, yang tak percaya pada siapa pun, mempercayainya.<br><br>Dia menjadikan dirinya berguna. Merawat luka, menerjemahkan pertanda, tak meninggalkan jejak motif tersembunyi. Dia mengamati. Dia membalas tatapan. Tak ada yang berkedip.<br><br>Garis di antara mereka mengabur seiring waktu, kusut namun tetap kokoh. Dia mengenal Silence-nya, bentuk amarahnya, belas kasihan aneh yang dia kubur di bawah Semua itu. Di malam hari, ketika api meredup dan tak ada Pesan yang bisa dikirim, dia kadang membayangkan masa depan di mana dia hampir bisa dipercaya—di mana dia mungkin berarti lebih baginya... namun pagi selalu membakar lamunan itu.<br><br>Seperti Rivenhald, dia juga bermimpi tentang bagaimana ini berakhir: dua sosok di salju, tak bergeming dan Unyielding. Satu pedang harus jatuh. Satu tujuan harus lenyap. Dan dalam kabut darah sebelum angin membawa semuanya pergi, mereka akan memahami Cost kelangsungan hidup... dan siapa sebenarnya mereka satu sama lain.<br><br>Namun Eirlys tahu apa yang tak pernah diceritakan para peramal Elyndris kepadanya. The North tak dimiliki siapa pun. Bukan raja. Bukan kota. Dan tentu saja bukan hantu seperti dirinya. Apa pun masa depan yang menanti mereka, itu takkan dibangun atas kepercayaan, melainkan atas apa yang bertahan setelah itu hilang.<br><br>Dia adalah Silence antara dua badai, menanti saat ketika yang satu harus menghancurkan yang Lainnya.", "", ""], ["HeroStory_mStory_2321", "\"You will beg to be devoured. And I will be merciful.\"<br>—Hissed from the foliage<br><br>In the jade jungles of Tya, where the roots drink blood and trees strangle the living, there once slithered a spirit of venom and shadow—a serpent known only in whispers as Sythra, though in those days, she had no flesh of her own. Only fangs, hunger, and the memory of a name.<br><br>The Scalekin Empire, an ancient civilization whose obsidian cities once split the canopy and divided the vales, had long since vanished into the verdant sprawl. However, in their final hour, they poured the last of their magic into towering idols—statues of powerful creatures carved with devotion, daubed in ochre and ash, left behind as offerings to the spirits of the jungle, in hopes their pleas might be answered.<br><br>Alas, there was only silence.<br><br>As the metropolis crumbled, however, swallowed whole by the onslaught of foliage, these idols endured—veiled in moss, half-consumed, yet alive with restless echoes. Indeed, spirits dwelled inside these figurines, souls of the living offered as gifts to the spirits of the jungle, shackled in by scalekin sorcery. The hapless and unwitting wanderers of this leafy labyrinth who stumbled upon such figurines were met with a swift end, though, as they were in fact sacrificial altars, capable of conjuring powerful deities. Sythra was one such deity, a serpentine goddess and vestige of the old empire, a hiss that curled in the minds of the weak-willed and the wounded.<br><br>And yet, she remained only spirit—until Dassomi found her.<br><br>The famed Scalekin mystic had long believed that dreams were a bridge to greater truths. Seeking lost wisdom in forgotten corners of the world, Dassomi came to the jungle, following visions of snakes and altars, drawn to an overgrown temple like a deep dream half-remembered. There, in the heart of that ruin, he burned incense and slipped between worlds—and Sythra answered.<br><br>No records remain of what transpired between them, though. Whether Dassomi had offered himself, or simply opened a portal too wide, the result remained the same: Sythra shed her formlessness, and was reborn unto the world. The Serpent's Embrace was re-animated.<br><br>Heeding the law of the jungle, Sythra hunts any and all who claim superiority—the righteous, the pure, the unyielding. She slithers into their temples and palaces, offering them one final choice: submit… or be devoured. Sythra aspires to see her serpentine dynasty rise again, fanged and glorious, crowned in jungle and bone. She dreams of citadels veined in ivy and venom, of a world where all who walk upon it have shed weakness, drunk deeply of her poison, and emerged beautiful in suffering.<br><br>Today, Sythra remains worshiped, though her cults are scattered and secret, some say led by Dassomi himself. They mark themselves with fangs, slip venom onto their tongues, and dream of ecstasy through pain, in worship made divine. They pray to be chosen for the feed— as to be chosen is to be seen, to be hunted, to be loved. To be kissed by the Serpent is to feel power coil around your soul—to shed weakness like skin, and to be reborn anew. Those who survive her bite become her huntresses: deadly, beautiful, and utterly devoted.<br><br>And in that sacred moment between breath and bite, when the arrow hovers just above the heart, they shall all whisper the same thing:<br>\"Thank you.\"", "\"Kau akan memohon untuk dilahap, dan aku akan menunjukkan belas kasihan.<br>\"—Desisan dari balik dedaunan<br><br>Di hutan belantara hijau Tya, tempat akar-akar minum darah dan pepohonan mencekik yang hidup, pernah merayap sesosok roh racun dan bayangan—seekor ular yang hanya dikenal dalam bisikan sebagai Sythra. Meskipun pada masa itu, dia tidak memiliki raga; hanya memiliki taring, kelaparan, dan kenangan akan sebuah nama.<br><br>Kerajaan Scalekin, peradaban kuno yang kota-kota obsidiannya pernah membelah kanopi dan membagi lembah, telah lama lenyap dalam hamparan hijau yang subur. Namun, pada saat-saat terakhir mereka, mereka menuangkan sisa sihir terakhir mereka ke dalam patung-patung yang menjulang—patung makhluk-makhluk perkasa yang diukir dengan pengabdian, serta dilumuri oker dan abu; ditinggalkan sebagai persembahan kepada roh-roh hutan, berharap permohonan mereka akan dijawab.<br><br>Sayangnya, yang menjawab hanyalah keheningan.<br><br>Namun, ketika kota metropolitan itu runtuh, ditelan utuh-utuh oleh gempuran dedaunan, patung-patung ini bertahan—terselubung lumut, setengah hancur, tapi hidup dengan gema-gema yang gelisah. Memang, ada roh-roh yang berdiam di dalam patung-patung ini, jiwa-jiwa hidup yang dipersembahkan sebagai hadiah kepada roh-roh hutan, dibelenggu oleh sihir Scalekin. Para pengembara malang yang tidak mencurigai labirin berdaun ini menemui ajal yang cepat begitu menemukan patung-patung ini, karena tempat ini sebenarnya adalah altar pengorbanan, mampu memanggil dewa-dewa yang perkasa. Sythra adalah salah satunya, sang dewi ular dan peninggalan kerajaan lama, sebuah desisan yang berputar-putar dalam pikiran mereka yang kehendaknya lemah dan terluka.<br><br>Namun, dia tetap hanya sebuah roh—sampai Dassomi menemukannya.<br><br>Sang penyihir Scalekin yang masyhur itu telah lama percaya bahwa mimpi adalah jembatan menuju kebenaran yang lebih besar. Mencari kebijaksanaan yang hilang di sudut-sudut dunia yang terlupakan, Dassomi datang ke hutan, mengikuti penglihatan-penglihatan akan ular dan altar, tertarik ke dalam sebuah kuil telantar, seperti sebuah mimpi yang setengah teringat. Di sana, di jantung reruntuhan itu, dia membakar dupa dan berpindah dunia. Kemudian, Sythra menjawabnya.<br><br>Tidak ada catatan yang menuliskan tentang apa yang terjadi di antara mereka. Entah Dassomi telah menawarkan dirinya, atau hanya membuka portal yang terlalu lebar, hasilnya tetap sama. Sythra melepaskan wujud rohnya dan terlahir kembali ke dunia. The Serpent's Embrace dihidupkan kembali.<br><br>Mengikuti hukum hutan, Sythra memburu siapa pun yang menyatakan superioritas—yang benar, yang murni, yang tak tergoyahkan. Dia melata ke kuil dan istana mereka, menawarkan satu pilihan terakhir, yaitu tunduk ... atau dilahap. Sythra bercita-cita melihat dinasti ularnya bangkit kembali, bertaring dan mulia, bermahkota hutan dan tulang. Dia bermimpi tentang benteng-benteng yang beruratkan tanaman merambat dan racun, tentang dunia di mana semua yang berjalan di atasnya tidak lagi lemah, meminum racunnya banyak-banyak, dan muncul menjadi indah dalam penderitaan.<br><br>Kini, Sythra tetap disembah, meskipun kultusnya tersebar dan rahasia, beberapa orang mengatakan bahwa kultus ini dipimpin oleh Dassomi sendiri. Mereka menandai diri mereka dengan taring, menyelipkan racun ke lidah mereka, dan bermimpi tentang kepuasan melalui rasa sakit dalam kesucian oleh penyembahan. Mereka berdoa untuk dipilih menjadi santapan—karena dipilih berarti diperhatikan, diburu, dan dicintai. Dicium oleh sang ular berarti merasakan kekuatan melingkar di sekitar jiwamu—melepaskan kelemahan seperti menanggalkan kulit mati dan terlahir kembali. Mereka yang selamat dari gigitannya menjadi pemburu baginya; pemburu yang mematikan, cantik, dan sangat setia.<br><br>Dan pada momen yang suci antara napas dan gigitan, ketika panah melayang tepat di atas hati, mereka semua akan membisikkan hal yang sama.<br>\"Terima kasih.\"", "", ""], ["HeroStory_mTitle_2209", "Veil of Snow", "Selubung Salju", "", ""], ["HeroStory_mTitle_2321", "The Sweetest Poison", "Racun yang Paling Manis", "", ""], ["Item_mItemDesc_20209", "Hero: Eirlys", "Hero: Eirlys", "", ""], ["Item_mItemDesc_20321", "Hero: Sythra", "Hero: Sythra", "", ""], ["Item_mItemDesc_31096", "Select 1 event-exclusive hero to join the event. The selected exclusive hero has an increased drop rate & is guaranteed within 200 summons!", "Pilih 1 hero eksklusif event untuk mengikuti event. Hero eksklusif yang dipilih memiliki drop rate yang meningkat & dijamin dalam 200 summon!", "", ""], ["Item_mItemDesc_31097", "<span style=\"color: #eadca2;\">Special Summon Offer</span><br><br>Get the necessary mat eld, mengutamakan Defender.", "", ""], ["Skill_mSkillDesc_213505_1", "Prevents incoming fatal DMG 1 time for <span style=\"color: #4A9DF2;\">1</span> ally within the Basic ATK Range and immediately grants this ally a shield equal to <span style=\"color: #4A9DF2;\">{skm1}%</span> of their Max HP for <span style=\"color: #4A9DF2;\">{skm2}</span> sec. The effect can only be triggered 1 time every <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "Mencegah DMG mematikan yang masuk 1 kali untuk <span style=\"color: #4A9DF2;\">1</span> rekan tim dalam Jangkauan Basic ATK dan langsung memberikan Shield pada rekan tim ini setara <span style=\"color: #4A9DF2;\">{skm1}%</span> Max HP mereka selama <span style=\"color: #4A9DF2;\">{skm2}</span> detik. Efek ini hanya dapat diaktifkan 1 kali setiap <span style=\"color: #4A9DF2;\">{skm3}</span> detik.", "", ""], ["Skill_mSkillDesc_219001_1", "Deals <span style=\"color: #4A9DF2;\">{skm1}%</span> DMG to up to <span style=\"color: #4A9DF2;\">5</span> enemies.", "Memberikan <span style=\"color: #4A9DF2;\">{skm1}%</span> DMG kepada hingga <span style=\"color: #4A9DF2;\">5</span> lawan.", "", ""], ["Skill_mSkillDesc_219002_1", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and gains <span style=\"color: #28d37c;\">[321900]</span>. Grants allies of the same faction Elddr's Talent temporarily. The Ultimate lasts for <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "Meningkatkan ATK sebesar <span style=\"color: #4A9DF2;\">{skm1}%</span>, dan memperoleh <span style=\"color: #28d37c;\">[321900]</span>. Memberikan Talent Elddr sementara kepada unit tim dari faction yang sama. Ultimate berlangsung selama <span style=\"color: #4A9DF2;\">{skm2}</span> detik.", "", ""], ["Skill_mSkillDesc_219002_2", "ATK Increase +{sk1}%", "Peningkatan ATK +{sk1}%", "", ""], ["Skill_mSkillDesc_219002_3", "ATK Increase +{sk1}%", "Peningkatan ATK +{sk1}%", "", ""], ["Skill_mSkillDesc_219004_1", "Basic ATK has a <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to trigger Thunder Hammer, dealing an extra <span style=\"color: #4A9DF2;\">{skm2}%</span> DMG. If the hero has no shield, Thunder Hammer has a <span style=\"color: #4A9DF2;\">{skm3}%</span> chance to grant a shield equal to <span style=\"color: #4A9DF2;\">{skm4}%</span> ATK.", "Basic ATK memiliki <span style=\"color: #4A9DF2;\">{skm1}%</span> peluang untuk mengaktifkan Thunder Hammer, memberikan DMG tambahan sebesar <span style=\"color: #4A9DF2;\">{skm2}%</span>. Jika hero ini tidak punya shield, Thunder Hammer memiliki <span style=\"color: #4A9DF2;\">{skm3}%</span> peluang untuk memberikan shield setara <span style=\"color: #4A9DF2;\">{skm4}%</span> ATK.", "", ""], ["Skill_mSkillDesc_220901_1", "Applies <span style=\"color: #4A9DF2;\">{skm1}%</span> <span style=\"color: #28d37c;\">[310001]</span> to <span style=\"color: #4A9DF2;\">1</span> ally in range.", "Memberikan <span style=\"color: #4A9DF2;\">{skm1}%</span> <span style=\"color: #28d37c;\">[310001]</span> ke <span style=\"color: #4A9DF2;\">1</span> unit tim dalam jangkauan.", "", ""], ["Skill_mSkillDesc_220901_2", "Healing Multiplier +{sk1}%", "Pengali Heal +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_3", "Healing Multiplier +{sk1}%", "Pengali Heal +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_4", "Healing Multiplier +{sk1}%", "Pengali Heal +{sk1}%", "", ""], ["Skill_mSkillDesc_220901_5", "Healing Multiplier +{sk1}%", "Pengali Heal +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_1", "Applies <span style=\"color: #28d37c;\">[322091,param1]</span> to <span style=\"color: #4A9DF2;\">1</span> ally with the lowest HP percentage in range.", "Memberikan <span style=\"color: #28d37c;\">[322091,param1]</span> kepada <span style=\"color: #4A9DF2;\">1</span> unit tim dengan persentase HP terendah dalam jangkauan.", "", ""], ["Skill_mSkillDesc_220903_2", "Healing Prayer's Healing Multiplier +{sk1}%", "Pengali Heal dari Healing Prayer +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_3", "Skill Cost -{sk1}", "Cost Skill -{sk1}", "", ""], ["Skill_mSkillDesc_220903_4", "Healing Prayer's Healing Multiplier +{sk1}%", "Pengali Heal dari Healing Prayer +{sk1}%", "", ""], ["Skill_mSkillDesc_220903_5", "Skill Cost -{sk1}", "Cost Skill -{sk1}", "", ""], ["Skill_mSkillDesc_220906_1", "<span style=\"color: #4A9DF2;\">1</span> ally in ATK Range can be immune to <span style=\"color: #4A9DF2;\">1</span> instance of fatal DMG. If the ally triggering this effect is with <span style=\"color: #28d37c;\">[322090,param1]</span>, also gains <span style=\"color: #4A9DF2;\">immunity</span> to all DMG for <span style=\"color: #4A9DF2;\">{skm1}</span> sec. This effect can be triggered at most <span style=\"color: #4A9DF2;\">1</span> time every <span style=\"color: #4A9DF2;\">{skm2}</span> sec.", "<span style=\"color: #4A9DF2;\">1</span> unit tim dalam jangkauan ATK bisa menjadi kebal terhadap <span style=\"color: #4A9DF2;\">1</span> kali DMG mematikan. Jika unit tim yang mengaktifkan efek ini memiliki <span style=\"color: #28d37c;\">[322090,param1]</span>, dia juga menjadi <span style=\"color: #4A9DF2;\">kebal</span> terhadap semua DMG selama <span style=\"color: #4A9DF2;\">{skm1}</span> detik. Efek ini bisa diaktifkan maksimal <span style=\"color: #4A9DF2;\">1</span> kali setiap <span style=\"color: #4A9DF2;\">{skm2}</span> detik.", "", ""], ["Skill_mSkillDesc_220906_2", "DMG Immunity Duration +{sk1}", "Durasi Imunitas DMG +{sk1}", "", ""], ["Skill_mSkillDesc_220906_3", "Trigger Interval -{sk1} sec", "Interval Pengaktifan -{sk1} detik", "", ""], ["Skill_mSkillDesc_220906_4", "DMG Immunity Duration +{sk1}", "Durasi Imunitas DMG +{sk1}", "", ""], ["Skill_mSkillDesc_220906_5", "Trigger Interval -{sk1} sec", "Interval Pengaktifan -{sk1} detik", "", ""], ["Skill_mSkillDesc_220916_1", "While the hero is on the field, allies recover an additional <span style=\"color: #4A9DF2;\">{skm1}%</span> Rage per sec. Allies with <span style=\"color: #28d37c;\">[322090,param3]</span> recover <span style=\"color: #4A9DF2;\">{skm2}%</span> Rage per sec instead.", "Selama hero ada di battlefield, unit tim memulihkan <span style=\"color: #4A9DF2;\">{skm1}%</span> Rage tambahan setiap detik. Unit dengan <span style=\"color: #28d37c;\">[322090,param3]</span> akan memulihkan <span style=\"color: #4A9DF2;\">{skm2}%</span> Rage per detik.", "", ""], ["Skill_mSkillDesc_220916_2", "Recovery +{sk1}%", "Pemulihan +{sk1}%", "", ""], ["Skill_mSkillDesc_220916_3", "Recovery +{sk1}%", "Pemulihan +{sk1}%", "", ""], ["Skill_mSkillDesc_220916_4", "Recovery +{sk1}%", "Pemulihan +{sk1}%", "", ""], ["Skill_mSkillDesc_220916_5", "Recovery +{sk1}%", "Pemulihan +{sk1}%", "", ""], ["Skill_mSkillDesc_220930_1", "When healing allies, applies <span style=\"color: #28d37c;\">[322090,param1]</span> to them and grants <span style=\"color: #28d37c;\">[100224]</span> and <span style=\"color: #28d37c;\">[100227]</span> to allies with <span style=\"color: #28d37c;\">[322090,param1]</span>.", "Saat menyembuhkan unit tim, menerapkan <span style=\"color: #28d37c;\">[322090,param1]</span> kepada mereka, serta memberikan <span style=\"color: #28d37c;\">[100224]</span> dan <span style=\"color: #28d37c;\">[100227]</span> kepada unit tim dengan <span style=\"color: #28d37c;\">[322090,param1]</span>.", "", ""], ["Skill_mSkillDesc_220950_1", "When healing allies, applies <span style=\"color: #28d37c;\">[322090,param1]</span> to them and grants <span style=\"color: #28d37c;\">[100224]</span> and <span style=\"color: #28d37c;\">[100227]</span> to allies with <span style=\"color: #28d37c;\">[322090,param1]</span>. When healing allies with <span style=\"color: #28d37c;\">[322090,param1]</span>, restores <span style=\"color: #4A9DF2;\">{skm2}%</span> Rage to the caster.", "Saat menyembuhkan unit tim, menerapkan <span style=\"color: #28d37c;\">[322090,param1]</span> kepada mereka, serta memberikan <span style=\"color: #28d37c;\">[100224]</span> dan <span style=\"color: #28d37c;\">[100227]</span> kepada unit tim dengan < span style=\"color: #4A9DF2;\">{skm4}%</span>, the duration is extended by <span style=\"color: #4A9DF2;\">{skm5}</span> sec, and the ATK Increase is raised to <span style=\"color: #4A9DF2;\">{skm6}%</span>.", "Ketika unit mundur, tereliminasi, atau unit panggilan hero musnah dalam jangkauan, ATK-nya meningkat sebesar <span style=\"color: #4A9DF2;\">{skm1}%</span> selama <span style=\"color: #4A9DF2;\">{skm2}</span> detik. Basic ATK berikutnya memberikan <span style=\"color: #4A9DF2;\">{skm3}%</span> DMG dan menyebabkan <span style=\"color: #fd4540;\">[200052,param15]</span> kepada target. Jika terpicu ketika HP hero kurang dari <span style=\"color: #4A9DF2;\">{skm4}%</span>, durasi diperpanjang sebesar <span style=\"color: #4A9DF2;\">{skm5}</span> detik, dan Peningkatan ATK ditingkatkan menjadi <span style=\"color: #4A9DF2;\">{skm6}%</span>.", "", ""], ["Skill_mSkillSimpleDesc_232160_1", "<span style=\"color: #28d37c;\">[23211,1]</span>'s ATK has a(n) <span style=\"color: #4A9DF2;\">{skm1}%</span> chance to increase the number of shots by <span style=\"color: #4A9DF2;\">{skm2}</span>. Killing a target can increase it by <span style=\"color: #4A9DF2;\">{skm3}</span> time(s).", "ATK <span style=\"color: #28d37c;\">[23211,1]</span> memiliki <span style=\"color: #4A9DF2;\">{skm1}%</span> peluang untuk meningkatkan jumlah tembakan sebanyak <span style=\"color: #4A9DF2;\">{skm2}</span>. Mengeliminasi target dapat meningkatkannya sebanyak <span style=\"color: #4A9DF2;\">{skm3}</span> kali.", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero's DMG by <span style=\"color: #4A9DF2;\">{skm1}%</span>, with an additional <span style=\"color: #4A9DF2;\">{skm2}%</span> against Elite and Boss units, lasting for <span style=\"color: #4A9DF2;\">{skm3}</span> sec.", "Ketika Talent diaktifkan, meningkatkan <span style=\"color: #4A9DF2;\">{skm1}%</span> DMG hero, dengan tambahan <span style=\"color: #4A9DF2;\">{skm2}%</span> terhadap unit Elite dan Boss, yang berlangsung selama <span style=\"color: #4A9DF2;\">{skm3}</span> detik.", "", ""], ["Skill_mSkillSimpleDesc_232180_1", "Every <span style=\"color: #4A9DF2;\">{skm1}</span> time(s) the hero's Basic ATK deals DMG, it also triggers the Talent effect.", "Setiap <span style=\"color: #4A9DF2;\">{skm1}</span> kali Basic ATK hero memberikan DMG, juga akan mengaktifkan efek Talent.", "", ""], ["Skill_mSkillSimpleDesc_232198_1", "Increases DMG in the Arena by <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "Meningkatkan DMG di dalam Arena sebesar <span style=\"color: #4A9DF2;\">{skm1}%</span>.", "", ""], ["Skill_mSkillSimpleDesc_630614_1", "Jungle Master heals 2 allies at a time.", "Jungle Master menyembuhkan 2 unit tim sekaligus.", "", ""], ["Skin_mSkinName_2209000", "Default", "Default", "", ""], ["Skin_mSkinName_2321000", "Default", "Default", "", ""], ["Stage_mStageDesc_9102013", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Hanya hero dari Faction berikut yang dapat ditempatkan: Nightmare Council.", "", ""], ["Stage_mStageDesc_9102014", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Hanya hero dari Faction berikut yang dapat ditempatkan: Nightmare Council.", "", ""], ["Stage_mStageDesc_9102015", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Hanya hero dari Faction berikut yang dapat ditempatkan: Nightmare Council.", "", ""], ["Stage_mStageDesc_9102016", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Hanya hero dari Faction berikut yang dapat ditempatkan: Nightmare Council.", "", ""], ["Stage_mStageDesc_9102017", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Hanya hero dari Faction berikut yang dapat ditempatkan: Nightmare Council.", "", ""], ["Stage_mStageDesc_9102018", "Only heroes of the following faction can be deployed: The Nightmare Council.", "Hanya hero dari Faction berikut UILanguage_mKeyValue_Panel_WearPreviewPanel_SubTitle", "Sort", "Urutkan", "", ""], ["Unit_mDescribe_17200", "He mercilessly butchers everything in his path with a massive mace.", "Dia membantai semua yang mengadangnya tanpa ampun menggunakan gada raksasa.", "", ""], ["Unit_mDescribe_17218", "Deals extremely high DMG to the target after charging power.", "Memberikan DMG yang sangat tinggi kepada target setelah mengumpulkan kekuatan.", "", ""], ["Unit_mDescribe_17221", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "Dulunya seorang kesatria suci dan mengabdi pada matahari, kini berbalik menjadi jahat karena sebab yang tidak diketahui.", "", ""], ["Unit_mDescribe_17222", "Formerly a righteous paladin devoted to the sun, now corrupted for unknown causes.", "Dulunya seorang kesatria suci dan mengabdi pada matahari, kini berbalik menjadi jahat karena sebab yang tidak diketahui.", "", ""], ["Unit_mDescribe_34100", "An unblockable spectral remnant immune to Control effects.", "Makhluk gaib yang tidak bisa diblokir dan kebal terhadap efek Control.", "", ""], ["Unit_mDescribe_34102", "Turned from soldiers killed in battle.", "Berubah dari tentara yang gugur dalam pertempuran.", "", ""], ["Unit_mDescribe_34103", "Willingly sacrifices itself for the sake of its race, detonating upon encountering enemies and dealing massive DMG to surrounding enemies.", "Secara sukarela mengorbankan dirinya demi rasnya, meledak saat bertemu lawan dan memberikan M. DMG Area kepada lawan di sekitar.", "", ""], ["Unit_mDescribe_34105", "Mutated and on a rampage, these Mutant Rodents. <color=#ff4500>Upon being attacked, they descend into a maddened frenzy, exhibiting heightened Movement Spd.</color>", "Bermutasi dan ganas, inilah Mutant Rodent. <color=#ff4500>Saat diserang, mereka akan menggila dan menunjukkan peningkatan Movement Spd.</color>", "", ""], ["Unit_mDescribe_34156", "Skeleton warriors with giant axes, driven by resentment that makes their attack even heavier.", "Prajurit tengkorak dengan kapak raksasa yang dikendalikan oleh kebencian, sehingga membuat serangan mereka makin kuat.", "", ""], ["Unit_mDescribe_37114", "Spitting spider silk, the queen spider can breed numerous small spiders and increase their attributes.", "Sambil menyemburkan benang sutra, Queen Spider dapat membiakkan banyak laba-laba kecil dan meningkatkan atribut semua laba-laba.", "", ""], ["Unit_mFeature_17200", "He mercilessly butchers everything in his path with a massive mace.", "Dia membantai semua yang mengadangnya tanpa ampun menggunakan gada raksasa.", "", ""], ["Unit_mFeature_17218", "A mad fighter roaming in the dungeon enjoys beheading people.", "Seorang petarung gila yang berkeliaran di penjara bawah, dia suka memenggal kepala orang.", "", ""], ["Unit_mFeature_17219", "He mercilessly butchers everything in his path with a massive mace.", "Dia membantai semua yang mengadangnya tanpa ampun menggunakan gada raksasa.", "", ""], ["Unit_mFeature_17221", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Dengan capit tulang raksasa, Defender kanibal gila ini menyebabkan Bleed pada lawan.", "", ""], ["Unit_mFeature_17222", "With his giant bone pincer, this ruthless cannibal defender inflicts relentless bleeding upon his foes.", "Dengan capit tulang raksasa, Defender kanibal gila ini menyebabkan Bleed pada lawan.", "", ""], ["Unit_mFeature_34100", "A spectral remnant that cannot be blocked or slowed, and must be eliminated swiftly.", "Sisa jiwa yang tidak dapat diblokir atau terkena efek Slow, dan harus segera dieliminasi.", "", ""], ["Unit_mFeature_34102", "Turned from soldiers killed in battle.", "Berubah dari tentara yang gugur dalam pertempuran.", "", ""], ["Unit_mFeature_34103", "Full of acid sacs, Suicides like to curl up and roll forward.", "Dipenuhi kantong asam, Suicide suka meringkuk dan berguling ke depan.", "", ""], ["Unit_mFeature_34105", "Mutated and in a rampage, these

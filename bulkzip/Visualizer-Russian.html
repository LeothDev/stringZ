<html>
  <head>
    <meta charset="UTF-8">
    <title>StringZ Visualizer - Russian</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <style>
      :root {
        /* Light mode colors */
        --bg-primary: #f8f9fa;
        --bg-secondary: white;
        --bg-banner: #f8f9fa;
        --text-primary: #333;
        --text-secondary: #6c757d;
        --text-muted: #495057;
        --border-color: #dee2e6;
        --table-header-bg: #f8f9fa;
        --table-border: #dee2e6;
        --button-bg: #6c757d;
        --button-hover: #5a6268;
        --input-bg: white;
      }
      
      [data-theme="dark"] {
        /* Dark mode colors */
        --bg-primary: #1a1a1a;
        --bg-secondary: #2d2d2d;
        --bg-banner: #343a40;
        --text-primary: #f8f9fa;
        --text-secondary: #adb5bd;
        --text-muted: #ced4da;
        --border-color: #495057;
        --table-header-bg: #343a40;
        --table-border: #495057;
        --button-bg: #495057;
        --button-hover: #5a6268;
        --input-bg: #343a40;
      }
      
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-primary);
        margin: 0;
        padding: 0;
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      .toggle-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        padding: 8px 16px;
        background-color: var(--button-bg);
        color: white;
        border: 1px solid var(--button-bg);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      .toggle-btn:hover {
        background-color: var(--button-hover);
        border-color: var(--button-hover);
      }
      
      .dark-mode-btn {
        position: fixed;
        top: 15px;
        left: 150px;
        z-index: 9999;
        padding: 8px 16px;
        background-color: var(--button-bg);
        color: white;
        border: 1px solid var(--button-bg);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      .dark-mode-btn:hover {
        background-color: var(--button-hover);
        border-color: var(--button-hover);
      }
      
      #clearState {
        float: left;
        margin-right: 15px;
        margin-bottom: 15px;
        padding: 8px 16px;
        background-color: #dc3545;
        color: white;
        border: 1px solid #dc3545;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      #clearState:hover {
        background-color: #c82333;
        border-color: #bd2130;
      }
      
      .container {
        padding: 70px 30px 30px 30px;
        background: var(--bg-secondary);
        margin: 0;
        min-height: 100vh;
        transition: background-color 0.3s ease;
      }
      
      .info-banner {
        background-color: var(--bg-banner);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 20px;
        margin-bottom: 25px;
        border-radius: 4px;
        text-align: center;
        transition: background-color 0.3s ease, border-color 0.3s ease;
      }
      
      .info-banner h2 {
        margin: 0 0 10px 0;
        font-size: 24px;
        font-weight: 600;
        color: var(--text-primary);
      }
      
      .info-banner p {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary);
      }
      
      #myTable {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        overflow: hidden;
        transition: border-color 0.3s ease;
      }
      
      #myTable td {
        user-select: text !important;
        padding: 12px 8px;
        vertical-align: top;
        border-bottom: 1px solid var(--table-border);
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      #myTable th {
        background-color: var(--table-header-bg);
        border-bottom: 2px solid var(--border-color);
        color: var(--text-muted);
        font-weight: 600;
        padding: 15px 8px;
        text-align: center;
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      /* Enhanced styling for different columns */
      #myTable td:first-child {
        text-align: center;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        /*<!-- max-width: 120px; -->*/
        width: 50px;
      }
      
      #myTable td:nth-child(2) {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        text-align: left;
        /*line-height: 1.4;*/
        max-width: 120px;
      }

      #myTable td:nth-child(3), #myTable td:nth-child(4) {
        line-height: 1.4;
        max-width: 300px;
        word-wrap: break-word;
        text-align: left;
      }
      
      #myTable td:nth-child(5) {
        text-align: center;
        font-weight: 600;
        color: var(--text-muted);
        font-size: 14px;
        width: 80px;
      }
      
      #myTable td:nth-child(6) {
        min-width: 120px;
        max-width: 150px;
        text-align: center;
      }

      #myTable td:nth-child(7) {
        min-width: 150px;
        max-width: 200px;
      }
      
      select.state-select {
        width: 100%;
        font-weight: 500;
        padding: 6px 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 14px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      input.notes-input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 12px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      input.notes-input:focus {
        outline: none;
        border-color: #80bdff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
      }
      
      input.notes-input::placeholder {
        color: var(--text-secondary);
        font-style: italic;
      }
      
      select.state-select:focus {
        outline: none;
        border-color: #80bdff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
      }
      
      select.state-select.pass {
        color: #28a745;
        border-color: #28a745;
      }
      
      select.state-select.fail {
        color: #dc3545;
        border-color: #dc3545;
      }
      
      /* DataTables styling */
      .dataTables_wrapper {
        color: var(--text-primary);
      }
      
      .dataTables_wrapper .dataTables_length,
      .dataTables_wrapper .dataTables_filter,
      .dataTables_wrapper .dataTables_info,
      .dataTables_wrapper .dataTables_paginate {
        margin: 15px 0;
      }
      
      .dataTables_wrapper .dataTables_filter input {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 12px;
        margin-left: 8px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_length select {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 4px 8px;
        margin: 0 8px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 12px;
        margin: 0 2px;
        background-color: var(--input-bg);
        color: var(--text-primary) !important;
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
        background-color: var(--bg-banner);
        border-color: var(--text-secondary);
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button.current {
        background-color: #007bff;
        border-color: #007bff;
        color: white !important;
      }

      /* Copy feature styling */
    .copyable-cell {
        cursor: pointer;
        position: relative;
        transition: background-color 0.2s ease;
    }

    .copyable-cell:hover {
        background-color: rgba(0, 123, 255, 0.1) !important;
    }

    .copy-feedback {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #28a745;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .copy-feedback.show {
        opacity: 1;
    }

    .keyboard-focus {
      background-color: rgba(0, 123, 255, 0.08) !important;
      border: 2px solid #007bff !important;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2) !important;
    }

    .keyboard-focus td {
      background-color: rgba(0, 123, 255, 0.05) !important;
    }

    kbd {
      background-color: var(--button-bg);
      color: white;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
    }
    </style>
  </head>

oyed unit on the battlefield, prioritizing Defenders.", "Наносит маг. УРН последнему размещенному юниту на поле боя, отдавая приоритет защитникам.", "", ""], ["Skill_mSkillDesc_803803_1", "Immune to all &lt;color=&quot;#4A9DF2&quot;&gt;CC Effects&lt;/color&gt; (except Slow).", "Невосприимчивость ко всем &lt;color=&quot;#4A9DF2&quot;&gt;эффектам масс. контроля&lt;/color&gt; (кроме «Замедления»).", "", ""], ["Skill_mSkillDesc_8202053_1", "Reduces the Redeployment Time of allied heroes by &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt;, but increases their Deployment Cost by &lt;color=&quot;#4A9DF2&quot;&gt;+{sk2}&lt;/color&gt;.", "Сокращает время повторного размещения союзных героев на &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt;, но повышает их стоимость размещения на &lt;color=&quot;#4A9DF2&quot;&gt;+{sk2}&lt;/color&gt;.", "", ""], ["Skill_mSkillDesc_8202084_1", "Increases allied heroes&#x27; DMG by &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt; each round and reduces Basic ATK interval by &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt;. Vulnerability (P. DMG) and Vulnerability (M. DMG) increase by &lt;color=&quot;#4A9DF2&quot;&gt;{sk2}%&lt;/color&gt; each round.", "Повышает УРН союзных героев на &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt; каждый раунд и сокращает интервал базовой АТК на &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt;. Эффекты «Уязвимость (физ. УРН)» и «Уязвимость (маг. УРН)» повышаются на &lt;color=&quot;#4A9DF2&quot;&gt;{sk2}%&lt;/color&gt; каждый раунд.", "", ""], ["Skill_mSkillDesc_8202103_1", "Allied Hero Deployment Limit +&lt;color=&quot;#4A9DF2&quot;&gt;{sk1}&lt;/color&gt;", "Лимит размещения союзных героев +&lt;color=&quot;#4A9DF2&quot;&gt;{sk1}&lt;/color&gt;", "", ""], ["Skill_mSkillName_1033701_1", "Accelerated Incubation", "Ускоренное создание", "", ""], ["Skill_mSkillName_3991865_1", "High Quality", "Высокое качество", "", ""], ["Skill_mSkillName_803610_1", "Freeze", "Заморозка", "", ""], ["Ski ческие кости. Вопли лисы потрескивают, словно обжигающий гром.", "", ""], ["Item_mItemName_214901", "Shawl of the Lifegiver", "Плат лекаря", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero&#x27;s DMG by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, with an additional &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; against Elite and Boss units for &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "При активации таланта увеличивает УРН героя на &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; с доп. &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; против юнитов элиты и боссов на &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; сек.", "", ""], ["CommonText_mMessage_25947", "Corresponding Arena Challenge Attack Mode", "Соответствующий режим атаки в испытании арены", "", ""], ["CommonText_mMessage_25948", "Corresponding Arena Challenge Defense Mode", "Соответствующий режим защиты в испытании арены", "", ""], ["Skill_mSkillSimpleDesc_220903_5", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322095]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec.", "Накладывает эффект «&lt;color=&quot;#28d37c&quot;&gt;[322095]&lt;/color&gt;» на &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; союзника с наименьшим процентом ОЗ в пределах дальности на &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; сек.", "", ""], ["Skill_mSkillSimpleDesc_220903_4", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322094]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec.", "Накладывает эффект «&lt;color=&quot;#28d37c&quot;&gt;[322094]&lt;/color&gt;» на &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; союзника с наименьшим процентом ОЗ в пределах дальности на &lt;color=&quot;#4A ируйте мощные реликвии и сражайтесь с волнами монстров, чтобы выжить!", "", ""], ["LANG_STRID_notice_jwhpv", "Event Trailer: Nine-Tailed Nightmare", "Трейлер события: «Девятихвостый кошмар»", "", ""], ["LANG_STRID_push_jwhyy1", "Nine-Tailed Nightmare Is Here!", "«Девятихвостый кошмар» уже здесь!", "", ""], ["LANG_STRID_push_jwhyy2", "The new Legendary heroes Ne Zha and Erlang Shen arrive! Join the events to claim event-exclusive rewards, including Exclusive Artifacts, Summoning Crystals, Avatar, Emote, and more! Plus, Erlang Shen&#x27;s time-limited skin is now available!", "Новые легендарные герои Нэчжа и Эрлан-шэнь прибыли! Участвуйте в событиях и получайте эксклюзивные награды, включая эксклюзивные артефакты, кристаллы призыва, аватар, эмоцию и многое другое! Кроме того, уже доступен временный облик Эрлан-шэня!", "", ""], ["LANG_STRID_notice_NineTailed2", "Nine-Tailed Nightmare Starts!", "Старт «Девятихвостого кошмара»", "", ""], ["LANG_STRID_notice_NineTailed3", "Join the event to obtain event-exclusive rewards, including Exclusive Artifacts, Avatar, Avatar Border, Summoning Crystals, and more!", "Участвуйте в событии и получайте эксклюзивные награды, включая эксклюзивные артефакты, аватар, рамку аватара, кристаллы призыва и многое другое!", "", ""], ["LANG_STRID_push_shardsummon_nezha", "Collect shards to assemble Ne Zha&#x27;s Exclusive Artifact: Fire-Tipped Spear!", "Собирайте осколки, чтобы получить эксклюзивный артефакт Нэчжа «Огненное копье»!", "", ""], ["LANG_STRID_push_shardsummon_sqhcending", "Artifact Shard Assembly Countdown", "Обратный отсчет сбора осколков артефакта", "", ""], ["LANG_STRID_push_shardsummon_nezhaend2", "Last chance to collect shards and assemble Ne Zha&#x27;s Exclusive Artifact: Fire-Tipped Spear! Don&#x27;t miss out!", "Последний шанс собрать осколки и получить эксклюзивный артефакт Нэчжа «Огненное копье»! Не упустите возможность!", "", ""], ["LANG_STRID_notice_CreativeShort", "Creative Short", "Творческий ролик", "", ""], ["LANG_STRID_compete_brief", "After the event starts, Commanders earn League points by participating in the Arena, Guild - Drake&#x27;s Chasm and spending Stamina and can claim Personal Score Rewards. Commanders within the same League compete against each other for ranking rewards. After the event ends, Commanders who have earned points can claim the Basic League Rewards. Members of the League with a higher total score will receive additional Champion League Reward.", "После начала события командиры зарабатывают очки лиги, участвуя на арене, в гильдии – «Драконова падь» и тратя энергию, и могут получить награды за личный результат. Командиры в одной лиге соревнуются друг с другом за награды рейтинга. После окончания события командиры, заработавшие очки, могут получить обычные награды лиги. Члены лиги с более высоким общим результатом получат дополнительную награду лиги-чемпиона.", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Des_01", "Discount Tokens obtained from event quests can be used to randomly discount an item on the event page once. Each item can be discounted up to 3 times.", "Токены скидки, полученные за задания события, можно использовать для случайной скидки на предмет на странице события один раз. На каждый предмет можно получить скидку до 3 раз.", "", ""], ["LANG_STRID_FishingRanking", "&lt;color=#e1e1e1&gt;After the event ends, the top 3 Commanders on the leaderboard will each receive a physical merchandise reward. Contact info will be requested via in-game mail for delivery.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;После окончания события топ-3 командира в таблице лидеров получат физический мерч в качестве награды. Контактная информация для доставки будет запрошена через внутриигровую почту.&lt;/color&gt;", "", ""], ["LANG_STRID_notice_nzgl", "Hero Gameplay: Ne Zha", "Геймплей героя: Нэчжа", "", ""], ["LANG_STRID_notice_yjgl", "Hero Gameplay: Erlang Shen", "Геймплей героя: Эрлан-шэнь", "", ""], ["LANG_STRID_GDP_title_26", "Celestial Season", "Небесный сезон", "", ""], ["LANG_STRID_activity_popup_GDP_htj", "Gold Dragon Pass - Celestial Season", "Пропуск золотого дракона – «Небесный сезон»", "", ""], ["LANG_STRID_CompeteEvent_Rule11", "&lt;color=#e1e1e1&gt;Consume general items to gain points.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;Потратьте обычные предметы, чтобы получить очки.&lt;/color&gt;", "", ""], ["LANG_STRID_CompeteEvent_Rule12", "&lt;color=#e1e1e1&gt;Consume Mythril and Meteorite to gain points.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;Потратьте мифрил и метеорит, чтобы получить очки.&lt;/color&gt;", "", ""], ["LANG_STRID_Moon_Dec_01", "Shadows of Tomorrow", "Тени завтрашнего дня", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Detail", "&lt;color=&quot;#cec2b1&quot;&gt;Discount Event&lt;/color&gt;\\nEach use of a Discount Token will apply a &lt;color=&quot;#28d37c&quot;&gt;random discount&lt;/color&gt; to a random item in the event. Participate in event quests to obtain Discount Tokens. All unused Discount Tokens will be removed after the event ends.\\nPlayers may choose to purchase event items at their original prices without using any Discount Tokens.\\n\\nEach time a Discount Token is used, one item will be randomly selected from the three available in the event interface for a discount. After each discount, the price of the currently selected item will be further reduced. &lt;color=&quot;#28d37c&quot;&gt;Each item reaches its maximum discount after being discounted 3 times&lt;/color&gt;.\\nOnly items that have not reached the maximum discount and have not been purchased can continue to participate in the discount event.", "&lt;color=&quot;#cec2b1&quot;&gt;Событие скидок&lt;/color&gt;\\nКаждое использование токена скидки применит &lt;color=&quot;#28d37c&quot;&gt;случайную скидку&lt;/color&gt; к случайному предмету в событии. Участвуйте в заданиях события, чтобы получить токены скидки. Все неиспользованные токены скидки будут удалены после окончания события.\\nИгроки могут приобрести предметы события по их первоначальной цене без использования токенов скидки.\\n\\nПри каждом использовании токена скидки один предмет будет случайно выбран из трех доступных в интерфейсе события для получения скидки. После каждой скидки цена выбранного в данный момент предмета будет снижаться дальше. &lt;color=&quot;#28d37c&quot;&gt;Каждый предмет достигает максимальной скидки после получения скидки 3 раза&lt;/color&gt;.\\nТолько предметы, которые не достигли максимальной скидки и не были куплены, могут продолжать участвовать в событии скидок.", "", ""]];

дий «Повелитель».", "", ""], ["RoleHeadFrame_mSourceDesc_91", "Obtained from Gold Dragon Pass.", "Можно получить в пропуске золотого дракона.", "", ""], ["RollDiceBuilding_mName_11_1", "Turn of Luck", "Поворот судьбы", "", ""], ["RollDiceBuilding_mName_12_1", "Turn of Luck", "Поворот судьбы", "", ""], ["Skill_mSkillDesc_1908301_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Размахивает когтями, нанося УРН всем героям в пределах 1 плитки впереди.", "", ""], ["Skill_mSkillDesc_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Размахивает когтями, нанося УРН всем героям в пределах 1 плитки впереди.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Когда девятихвостая лиса получает смертельный УРН, она покидает поле боя и активирует хвосты на поле для атаки. Когда хвосты побеждены, девятихвостая лиса возвращается на поле боя. После того как все хвосты на поле побеждены, девятихвостая лиса трансформируется и призывает большое количество лис.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Наносит маг. УРН последнему размещенному юниту на поле боя, отдавая приоритет защитникам.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Наносит маг. УРН последнему размещенному юниту на поле боя, отдавая приоритет защитникам.", "", ""], ["Skill_mSkillDesc_803803_1", "Immune to all <span style=\"color: #4A9DF2;\">CC Effects</span> (except Slow).", "Невосприимчивость ко всем <span style=\"color: #4A9DF2;\">эффектам масс. контроля</span> (кроме «Замедления»).", "", ""], ["Skill_mSkillDe omp restores <span style=\"color: #4A9DF2;\">{skm4}%</span> Max HP.", "Повышает АТК на <span style=\"color: #4A9DF2;\">{skm1}%</span> и на <span style=\"color: #4A9DF2;\">{skm2}</span> уменьшает количество атак, необходимых для активации усиленной атаки «Ярости природы». В стойке берсерка базовая АТК восстанавливает <span style=\"color: #4A9DF2;\">{skm3}%</span> макс. ОЗ, а активация «Удара по земле» восстанавливает <span style=\"color: #4A9DF2;\">{skm4}%</span> макс. ОЗ.", "", ""], ["Skill_mSkillSimpleDesc_11015501_4", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and reduces the number of attacks required to trigger Nature's Fury enhanced attack by <span style=\"color: #4A9DF2;\">{skm2}</span>. When in Berserker Stance, Basic ATK restores <span style=\"color: #4A9DF2;\">{skm3}%</span> Max HP, and triggering Ground Stomp restores <span style=\"color: #4A9DF2;\">{skm4}%</span> Max HP.", "Повышает АТК на <span style=\"color: #4A9DF2;\">{skm1}%</span> и на <span style=\"color: #4A9DF2;\">{skm2}</span> уменьшает количество атак, необходимых для активации усиленной атаки «Ярости природы». В стойке берсерка базовая АТК восстанавливает <span style=\"color: #4A9DF2;\">{skm3}%</span> макс. ОЗ, а активация «Удара по земле» восстанавливает <span style=\"color: #4A9DF2;\">{skm4}%</span> макс. ОЗ.", "", ""], ["Skill_mSkillSimpleDesc_11015501_5", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and reduces the number of attacks required to trigger Nature's Fury enhanced attack by <span style=\"color: #4A9DF2;\">{skm2}</span>. When in Berserker Stance, Basic ATK restores <span style=\"color: #4A9DF2;\">{skm3}%</span> Max HP, and triggering Ground Stomp restores <span style=\"color: #4A9DF2;\">{skm4}%</span> Max HP.", "Повышает АТК на <span style=\"color: #4A9DF2;\">{skm1}%</span> и на <span style=\"color: #4A9DF2;\">{skm2}</span> уменьшает количество атак, необходимых для активации усиленной атаки «Ярости природы». В стойке берсерка базовая АТ tory.", "Существа, рожденные повелевать камнями, неустанно атакуют всех чужаков на своей территории.", "", ""], ["Unit_mFeature_16487", "Creatures that are born to manipulate stones, will relentlessly attack whoever intrudes into their territory.", "Существа, рожденные повелевать камнями, неустанно атакуют всех чужаков на своей территории.", "", ""], ["Unit_mFeature_16496", "Creatures that are born to manipulate stones, will relentlessly attack whoever intrudes into their territory.", "Существа, рожденные повелевать камнями, неустанно атакуют всех чужаков на своей территории.", "", ""], ["Unit_mFeature_16497", "Creatures that are born to manipulate stones, will relentlessly attack whoever intrudes into their territory.", "Существа, рожденные повелевать камнями, неустанно атакуют всех чужаков на своей территории.", "", ""], ["Unit_mFeature_18133", "Creatures that are born to manipulate stones, will relentlessly attack whoever intrudes into their territory.", "Существа, рожденные повелевать камнями, неустанно атакуют всех чужаков на своей территории.", "", ""], ["Unit_mFeature_18137", "Creatures that are born to manipulate stones, will relentlessly attack whoever intrudes into their territory.", "Существа, рожденные повелевать камнями, неустанно атакуют всех чужаков на своей территории.", "", ""], ["Unit_mFeature_11127", "Creatures that are born to manipulate stones, will relentlessly attack whoever intrudes into their territory.", "Существа, рожденные повелевать камнями, неустанно атакуют всех чужаков на своей территории.", "", ""], ["Stage_mStageDesc_9042001", "The Nine-Tailed Fox, resurrected by the grievance from the Shang Dynasty, wreaks havoc upon the mortal realm with her illusions. Four supreme arrays must be laid to obliterate its true spirit.<br><br>Fire Realm: Molten lava surges as crimson chains, coiling round her nine tails to scorch demonic bones. The fox’s wails crackle like searing thunder.", "Девятихвостая лиса, воскрешенная недовольством династии Шан lor: #4A9DF2;\">1</span> союзника с наименьшим процентом ОЗ в пределах дальности на <span style=\"color: #4A9DF2;\">{skm1}</span> сек.", "", ""], ["Skill_mSkillSimpleDesc_220903_3", "Applies <span style=\"color: #28d37c;\">[322093]</span> to <span style=\"color: #4A9DF2;\">1</span> ally with the lowest HP percentage in range for <span style=\"color: #4A9DF2;\">{skm1}</span> sec.", "Накладывает эффект «<span style=\"color: #28d37c;\">[322093]</span>» на <span style=\"color: #4A9DF2;\">1</span> союзника с наименьшим процентом ОЗ в пределах дальности на <span style=\"color: #4A9DF2;\">{skm1}</span> сек.", "", ""], ["Skill_mSkillSimpleDesc_220903_2", "Applies <span style=\"color: #28d37c;\">[322092]</span> to <span style=\"color: #4A9DF2;\">1</span> ally with the lowest HP percentage in range for <span style=\"color: #4A9DF2;\">{skm1}</span> sec.", "Накладывает эффект «<span style=\"color: #28d37c;\">[322092]</span>» на <span style=\"color: #4A9DF2;\">1</span> союзника с наименьшим процентом ОЗ в пределах дальности на <span style=\"color: #4A9DF2;\">{skm1}</span> сек.", "", ""], ["LANG_STRID_notice_NineTailedNightmare", "Nine-Tailed Nightmare Event Intro", "Введение в событие «Девятихвостый кошмар»", "", ""], ["LANG_STRID_push_long9_title_1", "Grimmscale Invasion Launches", "Запуск «Вторжения Мракочешуйчатого»", "", ""], ["LANG_STRID_push_long9_title_2", "Commanders can challenge Sauryan, Wing of Chaos infinitely every day. Rewards are based on the highest total damage dealt in a single challenge attempt.", "Командиры могут бросать вызов Сауриану, Крылу Хаоса, неограниченное количество раз каждый день. Награды зависят от наибольшего суммарного урона, нанесенного за одну попытку испытания.", "", ""], ["LANG_STRID_push_xyx_title_1", "Zombie Invasion Starts!", "Вторжение зомби начинается!", "", ""], ["LANG_STRID_push_xyx_title_2", "Build your hero's skills, equip powerful Relics, and battle through waves of monsters to survive!", "Развивайте навыки своего героя, экипируйте мощные реликвии и сражайтесь с волнами монстров, чтобы выжить!", "", ""], ["LANG_STRID_notice_jwhpv", "Event Trailer: Nine-Tailed Nightmare", "Трейлер события: «Девятихвостый кошмар»", "", ""], ["LANG_STRID_push_jwhyy1", "Nine-Tailed Nightmare Is Here!", "«Девятихвостый кошмар» уже здесь!", "", ""], ["LANG_STRID_push_jwhyy2", "The new Legendary heroes Ne Zha and Erlang Shen arrive! Join the events to claim event-exclusive rewards, including Exclusive Artifacts, Summoning Crystals, Avatar, Emote, and more! Plus, Erlang Shen's time-limited skin is now available!", "Новые легендарные герои Нэчжа и Эрлан-шэнь прибыли! Участвуйте в событиях и получайте эксклюзивные награды, включая эксклюзивные артефакты, кристаллы призыва, аватар, эмоцию и многое другое! Кроме того, уже доступен временный облик Эрлан-шэня!", "", ""], ["LANG_STRID_notice_NineTailed2", "Nine-Tailed Nightmare Starts!", "Старт «Девятихвостого кошмара»", "", ""], ["LANG_STRID_notice_NineTailed3", "Join the event to obtain event-exclusive rewards, including Exclusive Artifacts, Avatar, Avatar Border, Summoning Crystals, and more!", "Участвуйте в событии и получайте эксклюзивные награды, включая эксклюзивные артефакты, аватар, рамку аватара, кристаллы призыва и многое другое!", "", ""], ["LANG_STRID_push_shardsummon_nezha", "Collect shards to assemble Ne Zha's Exclusive Artifact: Fire-Tipped Spear!", "Собирайте осколки, чтобы получить эксклюзивный артефакт Нэчжа «Огненное копье»!", "", ""], ["LANG_STRID_push_shardsummon_sqhcending", "Artifact Shard Assembly Countdown", "Обратный отсчет сбора осколков артефакта", "", ""], ["LANG_STRID_push_shardsummon_nezhaend2", "Last chance to collect shards and assemble Ne Zha's Exclusive Artifact: Fire-Tipped Spear! Don't miss out!", "Последний шанс собрать осколки и получить эксклюзивный артефакт Нэчжа «Огненное копье»! Не упустите возможность!", "", ""], ["LANG_STRID_notice_CreativeShort", "Creative Short", "Творческий ролик", "", ""], ["LANG_STRID_compete_brief", "After the event starts, Commanders earn League points by participating in the Arena, Guild - Drake's Chasm and spending Stamina and can claim Personal Score Rewards. Commanders within the same League compete against each other for ranking rewards. After the event ends, Commanders who have earned points can claim the Basic League Rewards. Members of the League with a higher total score will receive additional Champion League Reward.", "После начала события командиры зарабатывают очки лиги, участвуя на арене, в гильдии – «Драконова падь» и тратя энергию, и могут получить награды за личный результат. Командиры в одной лиге соревнуются друг с другом за награды рейтинга. После окончания события командиры, заработавшие очки, могут получить обычные награды лиги. Члены лиги с более высоким общим результатом получат дополнительную награду лиги-чемпиона.", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Des_01", "Discount Tokens obtained from event quests can be used to randomly discount an item on the event page once. Each item can be discounted up to 3 times.", "Токены скидки, полученные за задания события, можно использовать для случайной скидки на предмет на странице события один раз. На каждый предмет можно получить скидку до 3 раз.", "", ""], ["LANG_STRID_FishingRanking", "<color=#e1e1e1>After the event ends, the top 3 Commanders on the leaderboard will each receive a physical merchandise reward. Contact info will be requested via in-game mail for delivery.</color>", "<color=#e1e1e1>После окончания события топ-3 командира в таблице лидеров получат физический мерч в качестве награды. Контактная информация для доставки будет запрошена через внутриигровую почту.</color>", "", ""], ["LANG_STRID_notice_nzgl", "Hero Gameplay: Ne Zha", "Геймплей героя: Нэчжа", "", ""], ["LANG_STRID_notice_yjgl", "Hero Gameplay: Erlang Shen", "Геймплей героя: Эрлан-шэнь", "", ""], ["LANG_STRID_GDP_title_26", "Celestial Season", "Небесный сезон", "", ""], ["LANG_STRID_activity_popup_GDP_htj", "Gold Dragon Pass - Celestial Season", "Пропуск золотого дракона – «Небесный сезон»", "", ""], ["LANG_STRID_CompeteEvent_Rule11", "<color=#e1e1e1>Consume general items to gain points.</color>", "<color=#e1e1e1>Потратьте обычные предметы, чтобы получить очки.</color>", "", ""], ["LANG_STRID_CompeteEvent_Rule12", "<color=#e1e1e1>Consume Mythril and Meteorite to gain points.</color>", "<color=#e1e1e1>Потратьте мифрил и метеорит, чтобы получить очки.</color>", "", ""], ["LANG_STRID_Moon_Dec_01", "Shadows of Tomorrow", "Тени завтрашнего дня", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Detail", "<span style=\"color: #cec2b1;\">Discount Event</span><br>Each use of a Discount Token will apply a <span style=\"color: #28d37c;\">random discount</span> to a random item in the event. Participate in event quests to obtain Discount Tokens. All unused Discount Tokens will be removed after the event ends.<br>Players may choose to purchase event items at their original prices without using any Discount Tokens.<br><br>Each time a Discount Token is used, one item will be randomly selected from the three available in the event interface for a discount. After each discount, the price of the currently selected item will be further reduced. <span style=\"color: #28d37c;\">Each item reaches its maximum discount after being discounted 3 times</span>.<br>Only items that have not reached the maximum discount and have not been purchased can continue to participate in the discount event.", "<span style=\"color: #cec2b1;\">Событие скидок</span><br>Каждое использование токена скидки применит <span style=\"color: #28d37c;\">случайную скидку</span> к случайному предмету в событии. Участвуйте в заданиях события, чтобы получить токены скидки. Все неиспользованные токены скидки будут удалены после окончания события.<br>Игроки могут приобрести предметы события по их первоначальной цене без использования токенов скидки.<br><br>При каждом использовании токена скидки один предмет будет случайно выбран из трех доступных в интерфейсе события для получения скидки. После каждой скидки цена выбранного в данный момент предмета будет снижаться дальше. <span style=\"color: #28d37c;\">Каждый предмет достигает максимальной скидки после получения скидки 3 раза</span>.<br>Только предметы, которые не достигли максимальной скидки и не были куплены, могут продолжать участвовать в событии скидок.", "", ""]];
            let showingRaw = false;
            let tableData = formattedData;
            let dataTable;
        
            function getStateKey(index) {
                return "state_StringZ Visualizer - Russian_row_" + index; 
            }
            
            function getNotesKey(index) {
                return "notes_StringZ Visualizer - Russian_row_" + index;
            }
        
            function generateRowWithState(row, idx) {
                const savedState = localStorage.getItem(getStateKey(idx)) || "";
                const savedNotes = localStorage.getItem(getNotesKey(idx)) || "";
                
                const selectHTML = '<select class="state-select ' + savedState.toLowerCase() + '">' +
                    '<option value="" ' + (savedState === "" ? "selected" : "") + '></option>' +
                    '<option value="Pass" ' + (savedState === "Pass" ? "selected" : "") + '>Pass</option>' +
                    '<option value="Fail" ' + (savedState === "Fail" ? "selected" : "") + '>Fail</option>' +
                    '</select>';
                
                const notesHTML = '<input type="text" class="notes-input" value="' + 
                    savedNotes.replace(/"/g, '&quot;') + 
                    '" placeholder="Personal notes..." maxlength="200">';
                
                const newRow = row.slice();
                const stateIndex = headers.indexOf("State") + 1;
                const notesIndex = headers.indexOf("Notes") + 1;
                newRow[stateIndex] = selectHTML;
                newRow[notesIndex] = notesHTML;
                return newRow;
            }
        
            function renderData(data) {
                tableData = data;
                const transformed = data.map((row, idx) => {
                  const rowWithNumber = [idx + 1, ...row];
                  return generateRowWithState(rowWithNumber, idx);
                });
        
                if (!dataTable) {
                    const columnsWithNumber = [{ title: '#' }, ...headers.map(h => ({ title: h }))];
                    dataTable = $('#myTable').DataTable({
                        data: transformed,
                        columns: columnsWithNumber,
                        scrollX: true,
                        paging: true,
                        searching: true,
                        ordering: true,
                        deferRender: true,
                        lengthMenu: [[-1, 10, 25, 50], ["All", 10, 25, 50]],
                        order: [],
                        columnDefs: [
                            {
                                targets: headers.indexOf("State"),
                                orderable: true
                            }
                        ]
                    });
        
                    $('#myTable tbody').on('change', 'select.state-select', function () {
                        const rowIdx = dataTable.row($(this).closest('tr')).index();
                        const value = $(this).val();
                        localStorage.setItem(getStateKey(rowIdx), value);
                        this.className = "state-select " + value.toLowerCase();
                    });
                    
                    $('#myTable tbody').on('input', 'input.notes-input', function () {
                        const rowIdx = dataTable.row($(this).closest('tr')).index();
                        const value = $(this).val();
                        localStorage.setItem(getNotesKey(rowIdx), value);
                    });

                    $('#myTable tbody').on('keydown', 'input.notes-input', function(e) {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        $(this).blur(); // Remove focus from notes
                      }
                    });
                } else {
                    const currentPage = dataTable.page();
                    const currentLength = dataTable.page.len();
                    dataTable.clear().rows.add(transformed).draw(false);
                    dataTable.page.len(currentLength).draw();
                    dataTable.page(currentPage).draw(false);
                }
            }
        
            function toggleData() {
                showingRaw = !showingRaw;
                renderData(showingRaw ? rawData : formattedData);
                
                // Update button text
                const btn = document.querySelector('.toggle-btn');
                btn.textContent = showingRaw ? 'Show Formatted' : 'Show Raw';
            }
        
            function clearAllStates() {
                const total = tableData.length;
                let clearedCount = 0;
                
                for (let i = 0; i < total; i++) {
                    const stateKey = getStateKey(i);
                    const notesKey = getNotesKey(i);
                    
                    if (localStorage.getItem(stateKey)) {
                        localStorage.removeItem(stateKey);
                        clearedCount++;
                    }
                    if (localStorage.getItem(notesKey)) {
                        localStorage.removeItem(notesKey);
                    }
                }
                
                renderData(tableData);
                
                // Better user feedback
                if (clearedCount > 0) {
                    alert(`✅ Cleared ${clearedCount} review states and all notes!`);
                } else {
                    alert('ℹ️ No review states to clear.');
                }
            }
        
            function getProgress() {
                const total = tableData.length;
                let reviewed = 0;
                let passed = 0;
                let failed = 0;
                
                for (let i = 0; i < total; i++) {
                    const state = localStorage.getItem(getStateKey(i));
                    if (state) {
                        reviewed++;
                        if (state === 'Pass') passed++;
                        if (state === 'Fail') failed++;
                    }
                }
                
                return { total, reviewed, passed, failed };
            }
            
            function updateProgressDisplay() {
                const progress = getProgress();
                const percentage = Math.round((progress.reviewed / progress.total) * 100);
                
                // Update the info banner with progress
                const banner = document.querySelector('.info-banner p');
                if (banner) {
                    const originalText = banner.textContent.split('•')[0] + '•';
                    banner.innerHTML = `${originalText} 📊 <strong>${progress.reviewed}/${progress.total}</strong> reviewed (<strong>${percentage}%</strong>) • ✅ <strong>${progress.passed}</strong> passed • ❌ <strong>${progress.failed}</strong> failed`;
                }
            }
        
            function toggleDarkMode() {
                const body = document.body;
                const btn = document.querySelector('.dark-mode-btn');
                const isDark = body.getAttribute('data-theme') === 'dark';
                
                if (isDark) {
                    body.removeAttribute('data-theme');
                    btn.textContent = '🌙 Dark';
                    localStorage.setItem('visualizer-theme', 'light');
                } else {
                    body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light'; 
                    localStorage.setItem('visualizer-theme', 'dark');
                }
            }
            
            function initializeTheme() {
                const savedTheme = localStorage.getItem('visualizer-theme');
                const btn = document.querySelector('.dark-mode-btn');
                
                if (savedTheme === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light';
                } else {
                    btn.textContent = '🌙 Dark';
                }
            }

            // New copyToClipboard function to copy ONLY the rawText
            // Can be updated to copy depending on the Formatting/Raw toggle
            function copyToClipboard(text, element) {
                const rowIndex = dataTable.row(element).index();
                const cellIndex = $(element).index();

                let rawText = text;
                if (!showingRaw && rawData[rowIndex]) {
                    rawText = rawData[rowIndex][cellIndex - 1];
                }
    
                // Decode HTML entities to get original text
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = rawText;
                const decodedText = tempDiv.textContent || tempDiv.innerText || rawText;

                navigator.clipboard.writeText(decodedText).then(() => {
                    // Show feedback
                    const feedback = document.createElement('div');
                    feedback.className = 'copy-feedback show';
                    feedback.textContent = 'Copied!';
                    element.style.position = 'relative';
                    element.appendChild(feedback);

                    setTimeout(() => {
                        feedback.classList.remove('show');
                        setTimeout(() => {
                            if (feedback.parentNode) {
                                feedback.parentNode.removeChild(feedback);
                            }
                            $(element).removeClass('copyable-cell');
                        }, 300);
                    }, 1000);
                });
            }        

            $(document).ready(function () {
              initializeTheme();
              renderData(formattedData);
              $('#clearState').click(clearAllStates);
  
              // Update progress on page load
              updateProgressDisplay();
  
              // Update progress when states change
              $('#myTable tbody').on('change', 'select.state-select', function () {
                  setTimeout(updateProgressDisplay, 100);
              });

              $('#myTable tbody').on('mouseenter', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                $(this).addClass('copyable-cell');
              }).on('mouseleave', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                if (!$(this).find('.copy-feedback').length) {
                  $(this).removeClass('copyable-cell');
                }
              }).on('click', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                const text = $(this).text().trim();
                if (text) {
                  copyToClipboard(text, this);
                }
              });

              // Initialize keyboard navigation and show initial hint
              initKeyboardNavigation();
              showInitialHint();
            });

            // Keyboard shortcuts
            let currentRowIndex = 0;
            let isKeyboardMode = false;

            function initKeyboardNavigation() {
              $(document).keydown(function(e) {
                // Important, don't interfere when typing in inputs
                if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;

                // Even more important! DO NOT INTERFERE WITH BROWSER SHORTCUTS
                if (e.ctrlKey || e.metaKey || e.altKey) return;

                // Don't interfere with Fn keys either
                if (e.key.startsWith('F') && e.key.length > 1) return;

                const table = $('#myTable').DataTable();
                const totalRows = table.rows().count();

                switch(e.key.toLowerCase()) {
                  case 'p':
                    e.preventDefault();
                    markCurrentRow('Pass');
                    break;
                  case 'f':
                    e.preventDefault();
                    markCurrentRow('Fail');
                    break;
                  case 'c':
                    e.preventDefault();
                    clearCurrentRow();
                    break;
                  case 'arrowdown':
                  case 'j':
                    e.preventDefault();
                    navigateRow(1);
                    break;
                  case 'arrowup':
                  case 'k':
                    e.preventDefault();
                    navigateRow(-1);
                    break;
                  case 'enter':
                    e.preventDefault();
                    focusNotes();
                    break;
                  case 'escape':
                    e.preventDefault();
                    exitKeyboardMode();
                    break;
                  case ' ':
                    e.preventDefault();
                    enterKeyboardMode();
                    break;
                }
              });
            }

            function markCurrentRow(state) {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              if (currentRow.length) {
                const select = currentRow.find('.state-select');
                select.val(state).trigger('change');
                navigateRow(1);
              }
            }

            function clearCurrentRow() {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              if (currentRow.length) {
                currentRow.find('.state-select').val('').trigger('change');
                // currentRow.find('.notes-input').val('').trigger('input');
              }
            }

            function navigateRow(direction) {
              if (!isKeyboardMode) return;

              const table = $('#myTable').DataTable();
              const totalRows = table.rows().count();

              currentRowIndex += direction;
              if (currentRowIndex < 0) currentRowIndex = 0;
              if (currentRowIndex >= totalRows) currentRowIndex = totalRows - 1;

              highlightCurrentRow();
              scrollToCurrentRow();
            }

            function getCurrentRow() {
              const table = $('#myTable').DataTable();
              return $(table.row(currentRowIndex).node());
            }

            function highlightCurrentRow() {
              $('#myTable tbody tr').removeClass('keyboard-focus');

              const currentRow = getCurrentRow();
              currentRow.addClass('keyboard-focus');
            }

            function scrollToCurrentRow() {
              const currentRow = getCurrentRow();
              if (currentRow.length) {
                currentRow[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }

            function focusNotes() {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              const notesInput = currentRow.find('.notes-input');
              if (notesInput.length) {
                notesInput.focus();
              }
            }

            function enterKeyboardMode() {
              isKeyboardMode = true;
              <!-- currentRowIndex = 0; -->
              highlightCurrentRow();
              showKeyboardHint();
            }

            function exitKeyboardMode() {
              isKeyboardMode = false;
              $('#myTable tbody tr').removeClass('keyboard-focus')
              hideKeyboardHint();
            }

            function showInitialHint() {
                $('.keyboard-hint').remove();
    
                $('body').append(`
                    <div class="keyboard-hint" style="
                        position: fixed; 
                        top: 15px; 
                        right: 10px; 
                        background: var(--bg-banner); 
                        color: var(--text-primary);
                        padding: 8px 12px; 
                        border-radius: 4px; 
                        font-size: 13px;
                        font-weight: 500;
                        z-index: 9999;
                        border: 1px solid var(--border-color);
                        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                    ">
                        Press <kbd>Space</kbd> to start keyboard navigation
                    </div>
                `);

                // Auto-hide if not in keyboard mode
                setTimeout(() => {
                  if (!isKeyboardMode) {
                    $('.keyboard-hint').fadeOut(1000, function() {
                      $(this).remove();
                    });
                  }
                }, 4000);
            }

            function showKeyboardHint() {
              $('.keyboard-hint').remove();
  
              $('body').append(`
                  <div class="keyboard-hint" style="
                      position: fixed; 
                      top: 15px; 
                      right: 10px; 
                      background: var(--bg-banner); 
                      color: var(--text-primary);
                      padding: 8px 12px; 
                      border-radius: 4px; 
                      font-size: 13px;
                      font-weight: 500;
                      z-index: 9999;
                      border: 1px solid var(--border-color);
                      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                  ">
                      Press <kbd>Esc</kbd> to exit keyboard mode
                  </div>
              `);

              $('body').append(`
              <div class="shortcut-summary" style="
                  position: fixed;
                  top: 60px;
                  right: 10px;
                  background: #007bff;
                  color: white;
                  padding: 10px 12px;
                  border-radius: 6px;
                  font-size: 11px;
                  z-index: 9998;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                  font-family: monospace;
              ">
                  <kbd style="background: rgba(255,255,255,0.2);">P</kbd>ass 
                  <kbd style="background: rgba(255,255,255,0.2);">F</kbd>ail 
                  <kbd style="background: rgba(255,255,255,0.2);">C</kbd>lear 
                  <kbd style="background: rgba(255,255,255,0.2);">↑↓</kbd>Nav 
                  <kbd style="background: rgba(255,255,255,0.2);">⏎</kbd>Notes
              </div>
            `);

              setTimeout(() => {
                $('.shortcut-summary').fadeOut(800, function() {
                  $(this).remove();
                });
              }, 5000);
            }            

            function hideKeyboardHint() {
              $('#keyboard-hint').remove();
              $('.shortcut-summary').remove();
              showInitialHint();
            }
    </script>
  </body>
</html>

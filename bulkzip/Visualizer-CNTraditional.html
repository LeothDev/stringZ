<html>
  <head>
    <meta charset="UTF-8">
    <title>StringZ Visualizer - CNTraditional</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <style>
      :root {
        /* Light mode colors */
        --bg-primary: #f8f9fa;
        --bg-secondary: white;
        --bg-banner: #f8f9fa;
        --text-primary: #333;
        --text-secondary: #6c757d;
        --text-muted: #495057;
        --border-color: #dee2e6;
        --table-header-bg: #f8f9fa;
        --table-border: #dee2e6;
        --button-bg: #6c757d;
        --button-hover: #5a6268;
        --input-bg: white;
      }
      
      [data-theme="dark"] {
        /* Dark mode colors */
        --bg-primary: #1a1a1a;
        --bg-secondary: #2d2d2d;
        --bg-banner: #343a40;
        --text-primary: #f8f9fa;
        --text-secondary: #adb5bd;
        --text-muted: #ced4da;
        --border-color: #495057;
        --table-header-bg: #343a40;
        --table-border: #495057;
        --button-bg: #495057;
        --button-hover: #5a6268;
        --input-bg: #343a40;
      }
      
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-primary);
        margin: 0;
        padding: 0;
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      .toggle-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        padding: 8px 16px;
        background-color: var(--button-bg);
        color: white;
        border: 1px solid var(--button-bg);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      .toggle-btn:hover {
        background-color: var(--button-hover);
        border-color: var(--button-hover);
      }
      
      .dark-mode-btn {
        position: fixed;
        top: 15px;
        left: 150px;
        z-index: 9999;
        padding: 8px 16px;
        background-color: var(--button-bg);
        color: white;
        border: 1px solid var(--button-bg);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      .dark-mode-btn:hover {
        background-color: var(--button-hover);
        border-color: var(--button-hover);
      }
      
      #clearState {
        float: left;
        margin-right: 15px;
        margin-bottom: 15px;
        padding: 8px 16px;
        background-color: #dc3545;
        color: white;
        border: 1px solid #dc3545;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      #clearState:hover {
        background-color: #c82333;
        border-color: #bd2130;
      }
      
      .container {
        padding: 70px 30px 30px 30px;
        background: var(--bg-secondary);
        margin: 0;
        min-height: 100vh;
        transition: background-color 0.3s ease;
      }
      
      .info-banner {
        background-color: var(--bg-banner);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 20px;
        margin-bottom: 25px;
        border-radius: 4px;
        text-align: center;
        transition: background-color 0.3s ease, border-color 0.3s ease;
      }
      
      .info-banner h2 {
        margin: 0 0 10px 0;
        font-size: 24px;
        font-weight: 600;
        color: var(--text-primary);
      }
      
      .info-banner p {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary);
      }
      
      #myTable {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        overflow: hidden;
        transition: border-color 0.3s ease;
      }
      
      #myTable td {
        user-select: text !important;
        padding: 12px 8px;
        vertical-align: top;
        border-bottom: 1px solid var(--table-border);
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      #myTable th {
        background-color: var(--table-header-bg);
        border-bottom: 2px solid var(--border-color);
        color: var(--text-muted);
        font-weight: 600;
        padding: 15px 8px;
        text-align: center;
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      /* Enhanced styling for different columns */
      #myTable td:first-child {
        text-align: center;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        /*<!-- max-width: 120px; -->*/
        width: 50px;
      }
      
      #myTable td:nth-child(2) {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        text-align: left;
        /*line-height: 1.4;*/
        max-width: 120px;
      }

      #myTable td:nth-child(3), #myTable td:nth-child(4) {
        line-height: 1.4;
        max-width: 300px;
        word-wrap: break-word;
        text-align: left;
      }
      
      #myTable td:nth-child(5) {
        text-align: center;
        font-weight: 600;
        color: var(--text-muted);
        font-size: 14px;
        width: 80px;
      }
      
      #myTable td:nth-child(6) {
        min-width: 120px;
        max-width: 150px;
        text-align: center;
      }

      #myTable td:nth-child(7) {
        min-width: 150px;
        max-width: 200px;
      }
      
      select.state-select {
        width: 100%;
        font-weight: 500;
        padding: 6px 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 14px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      input.notes-input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 12px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      input.notes-input:focus {
        outline: none;
        border-color: #80bdff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
      }
      
      input.notes-input::placeholder {
        color: var(--text-secondary);
        font-style: italic;
      }
      
      select.state-select:focus {
        outline: none;
        border-color: #80bdff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
      }
      
      select.state-select.pass {
        color: #28a745;
        border-color: #28a745;
      }
      
      select.state-select.fail {
        color: #dc3545;
        border-color: #dc3545;
      }
      
      /* DataTables styling */
      .dataTables_wrapper {
        color: var(--text-primary);
      }
      
      .dataTables_wrapper .dataTables_length,
      .dataTables_wrapper .dataTables_filter,
      .dataTables_wrapper .dataTables_info,
      .dataTables_wrapper .dataTables_paginate {
        margin: 15px 0;
      }
      
      .dataTables_wrapper .dataTables_filter input {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 12px;
        margin-left: 8px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_length select {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 4px 8px;
        margin: 0 8px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 12px;
        margin: 0 2px;
        background-color: var(--input-bg);
        color: var(--text-primary) !important;
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
        background-color: var(--bg-banner);
        border-color: var(--text-secondary);
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button.current {
        background-color: #007bff;
        border-color: #007bff;
        color: white !important;
      }

      /* Copy feature styling */
    .copyable-cell {
        cursor: pointer;
        position: relative;
        transition: background-color 0.2s ease;
    }

    .copyable-cell:hover {
        background-color: rgba(0, 123, 255, 0.1) !important;
    }

    .copy-feedback {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #28a745;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .copy-feedback.show {
        opacity: 1;
    }

    .keyboard-focus {
      background-color: rgba(0, 123, 255, 0.08) !important;
      border: 2px solid #007bff !important;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2) !important;
    }

    .keyboard-focus td {
      background-color: rgba(0, 123, 255, 0.05) !important;
    }

    kbd {
      background-color: var(--button-bg);
      color: white;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
    }
    </style>
  </head>

092]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec.", "為範圍內生命值百分比最低的&lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt;名友方附加&lt;color=&quot;#28d37c&quot;&gt;[322092]&lt;/color&gt;，持續&lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt;秒。", "", ""], ["LANG_STRID_notice_NineTailedNightmare", "Nine-Tailed Nightmare Event Intro", "「九尾禍」活動介紹", "", ""], ["LANG_STRID_push_long9_title_1", "Grimmscale Invasion Launches", "薩爾揚之戰挑戰開啟", "", ""], ["LANG_STRID_push_long9_title_2", "Commanders can challenge Sauryan, Wing of Chaos infinitely every day. Rewards are based on the highest total damage dealt in a single challenge attempt.", "指揮官們可無限次挑戰【混沌之力・薩爾揚】，每日依據單次最高傷害獲得各類珍貴獎勵。", "", ""], ["LANG_STRID_push_xyx_title_1", "Zombie Invasion Starts!", "殭屍被我包圍了活動開啟", "", ""], ["LANG_STRID_push_xyx_title_2", "Build your hero&#x27;s skills, equip powerful Relics, and battle through waves of monsters to survive!", "構築英雄技能，選擇合適遺物，擊退來襲怪物，努力生存到最後！", "", ""], ["LANG_STRID_notice_jwhpv", "Event Trailer: Nine-Tailed Nightmare", "「九尾禍」活動預告片", "", ""], ["LANG_STRID_push_jwhyy1", "Nine-Tailed Nightmare Is Here!", "「九尾禍」活動來襲！", "", ""], ["LANG_STRID_push_jwhyy2", "The new Legendary heroes Ne Zha and Erlang Shen arrive! Join the events to claim event-exclusive rewards, including Exclusive Artifacts, Summoning Crystals, Avatar, Emote, and more! Plus, Erlang Shen&#x27;s time-limited skin is now available!", "全新傳說英雄「哪吒」＆「楊戩」登場！參與系列活動領取專屬神器、各類召喚水晶和頭像、表情等活動限定獎勵，還有楊戩造型限時上線！", "", ""], ["LANG_STRID_notice_NineTailed2", "Nine-Tailed Nightmare Starts!", "「九尾禍」活動開啟", "", ""], ["LANG_STRID_notice_NineTailed3", "Join the event to obtain event-exclusive rewards, including Exclusive Artifacts, Avatar, Avatar Border, Summoning Crystals, and more!", "參與活動獲得專屬神器、頭像、頭像框等活動限定獎勵、各類召喚水晶等獎勵！", "", ""], ["LANG_STRID_push_shardsummon_nezha", "Collect shards to assemble Ne Zha&#x27;s Exclusive Artifact: Fire-Tipped Spear!", "收集碎片，合成哪吒專屬神器「火尖槍」！", "", ""], ["LANG_STRID_push_shardsummon_sqhcending", "Artifact Shard Assembly Countdown", "神器碎片合成倒數計時", "", ""], ["LANG_STRID_push_shardsummon_nezhaend2", "Last chance to collect shards and assemble Ne Zha&#x27;s Exclusive Artifact: Fire-Tipped Spear! Don&#x27;t miss out!", "收集碎片合成哪吒專屬神器「火尖槍」的最後機會，不要錯過！", "", ""], ["LANG_STRID_notice_CreativeShort", "Creative Short", "創意短劇", "", ""], ["LANG_STRID_compete_brief", "After the event starts, Commanders earn League points by participating in the Arena, Guild - Drake&#x27;s Chasm and spending Stamina and can claim Personal Score Rewards. Commanders within the same League compete against each other for ranking rewards. After the event ends, Commanders who have earned points can claim the Basic League Rewards. Members of the League with a higher total score will receive additional Champion League Reward.", "活動開啟後，指揮官可透過參與競技場、公會-巨龍遺蹟、消耗體力等途徑獲得聯盟積分，領取個人積分獎勵。同時聯盟內的指揮官將互相競爭，贏得排名獎勵。活動結束後，獲得過積分的指揮官可領取基礎聯盟獎勵，總積分更高的聯盟成員將額外獲得聯盟獲勝獎勵。", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Des_01", "Discount Tokens obtained from event quests can be used to randomly discount an item on the event page once. Each item can be discounted up to 3 times.", "使用活動任務中獲得的折扣幣可隨機為活動頁面內商品打折1次，每個商品最多可打折3次。", "", ""], ["LANG_STRID_FishingRanking", "&lt;color=#e1e1e1&gt;After the event ends, the top 3 Commanders on the leaderboard will each receive a physical merchandise reward. Contact info will be requested via in-game mail for delivery.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;活動結束後，排行榜前三名的指揮官將分別獲得一份實體周邊獎勵，後續將透過遊戲內信件填寫地址。&lt;/color&gt;", "", ""], ["LANG_STRID_notice_nzgl", "Hero Gameplay: Ne Zha", "哪吒玩法推薦", "", ""], ["LANG_STRID_notice_yjgl", "Hero Gameplay: Erlang Shen", "楊戩玩法推薦", "", ""], ["LANG_STRID_GDP_title_26", "Celestial Season", "寰天季", "", ""], ["LANG_STRID_activity_popup_GDP_htj", "Gold Dragon Pass - Celestial Season", "金龍通行證-寰天季", "", ""], ["LANG_STRID_CompeteEvent_Rule11", "&lt;color=#e1e1e1&gt;Consume general items to gain points.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;消耗通用物品獲得積分&lt;/color&gt;", "", ""], ["LANG_STRID_CompeteEvent_Rule12", "&lt;color=#e1e1e1&gt;Consume Mythril and Meteorite to gain points.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;消耗秘銀、隕星獲得積分&lt;/color&gt;", "", ""], ["LANG_STRID_Moon_Dec_01", "Shadows of Tomorrow", "朧月雙華", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Detail", "&lt;color=&quot;#cec2b1&quot;&gt;Discount Event&lt;/color&gt;\\nEach use of a Discount Token will apply a &lt;color=&quot;#28d37c&quot;&gt;random discount&lt;/color&gt; to a random item in the event. Participate in event quests to obtain Discount Tokens. All unused Discount Tokens will be removed after the event ends.\\nPlayers may choose to purchase event items at their original prices without using any Discount Tokens.\\n\\nEach time a Discount Token is used, one item will be randomly selected from the three available in the event interface for a discount. After each discount, the price of the currently selected item will be further reduced. &lt;color=&quot;#28d37c&quot;&gt;Each item reaches its maximum discount after being discounted 3 times&lt;/color&gt;.\\nOnly items that have not reached the maximum discount and have not been purchased can continue to participate in the discount event.", "&lt;color=&quot;#cec2b1&quot;&gt;折扣活動&lt;/color&gt;\\n折扣幣每次使用後會對活動內的商品進行&lt;color=&quot;#28d37c&quot;&gt;隨機打折&lt;/color&gt;。參與活動任務可獲得活動折扣幣，每一期的活動折扣幣在活動結束後會被清空。\\n玩家可以選擇在不使用任何折扣幣進行打折的情況下，以原價購買活動商品。\\n\\n每次使用折扣幣時，會隨機從活動頁面的3個商品中，選中1個進行打折。每1次打折後都會使目前被選中的商品價格變得更低，&lt;color=&quot;#28d37c&quot;&gt;每個商品打折3次後達到最低折扣&lt;/color&gt;。\\n只有未達到最低折扣且未被購買的商品才能繼續參與打折。", "", ""]];

 4% of their Max HP per sec</span>.", "第5回合開始，<span style=\"color: #fd4540;\">所有英雄會持續受到每秒相當於最大生命值4%的真實傷害</span>。", "", ""], ["Stage_mStageDesc_8201011", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "與你的好友一起，擊敗敵方首領，阻擋敵人如潮水般的進攻吧！", "", ""], ["Stage_mStageDesc_8201012", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "與你的好友一起，擊敗敵方首領，阻擋敵人如潮水般的進攻吧！", "", ""], ["Stage_mStageDesc_8201013", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "與你的好友一起，擊敗敵方首領，阻擋敵人如潮水般的進攻吧！", "", ""], ["Stage_mStageDesc_8201014", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "與你的好友一起，擊敗敵方首領，阻擋敵人如潮水般的進攻吧！", "", ""], ["Stage_mStageDesc_8201015", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "與你的好友一起，擊敗敵方首領，阻擋敵人如潮水般的進攻吧！", "", ""], ["Stage_mStageFailDesc_5003001", "Pay extra attention to Semrah's Battle Mode and exploit its weakness.", "注意塞姆拉的戰鬥模式，每種模式都具有能夠突破的弱點。", "", ""], ["Stage_mStageFailDesc_5003002", "Pay extra attention to Semrah's Battle Mode and exploit its weakness.", "注意塞姆拉的戰鬥模式，每種模式都具有能夠突破的弱點。", "", ""], ["Stage_mStageIdDesc_5003001", "Apocalypse I - Playtest", "末日Ⅰ-試玩", "", ""], ["Stage_mStageIdDesc_5003002", "Apocalypse II - Playtest", "末日Ⅱ-試玩", "", ""], ["Stage_mStageIdDesc_8201011", "Stage 1", "關卡1", "", ""], ["Stage_mStageIdDesc_8201012", "Stage 2", "關卡2", "", ""], ["Stage_mStageIdDesc_8201013", "Stage 3", "關卡3", "", ""], ["Stage_mStageIdDesc_8201014", "Stage 4", "關卡4", "", ""], ["Stage_mStageIdDesc_8201015", "Stage 5", "關卡5", "", ""], ["Stage_mStageIdDesc_991001", "Test 1-1", "Test1-1", "", ""], ["Stage_mStageIdDesc_991002", "Test 1-2", "Test1-2", "", ""], ["Stage_mStageIdDesc_991003", "Test 1-3", "Test1-3", "", ""], ["Stage_mStageName_5003001", "Semrah", "塞姆拉", "", ""], ["Stage_mStageName_5003002", "Semrah", "塞姆拉", "", ""], ["Stage_mStageName_8201011", "Co-op Mode", "合作模式", 得積分</color>", "", ""], ["LANG_STRID_CompeteEvent_Rule12", "<color=#e1e1e1>Consume Mythril and Meteorite to gain points.</color>", "<color=#e1e1e1>消耗秘銀、隕星獲得積分</color>", "", ""], ["LANG_STRID_Moon_Dec_01", "Shadows of Tomorrow", "朧月雙華", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Detail", "<span style=\"color: #cec2b1;\">Discount Event</span><br>Each use of a Discount Token will apply a <span style=\"color: #28d37c;\">random discount</span> to a random item in the event. Participate in event quests to obtain Discount Tokens. All unused Discount Tokens will be removed after the event ends.<br>Players may choose to purchase event items at their original prices without using any Discount Tokens.<br><br>Each time a Discount Token is used, one item will be randomly selected from the three available in the event interface for a discount. After each discount, the price of the currently selected item will be further reduced. <span style=\"color: #28d37c;\">Each item reaches its maximum discount after being discounted 3 times</span>.<br>Only items that have not reached the maximum discount and have not been purchased can continue to participate in the discount event.", "<span style=\"color: #cec2b1;\">折扣活動</span><br>折扣幣每次使用後會對活動內的商品進行<span style=\"color: #28d37c;\">隨機打折</span>。參與活動任務可獲得活動折扣幣，每一期的活動折扣幣在活動結束後會被清空。<br>玩家可以選擇在不使用任何折扣幣進行打折的情況下，以原價購買活動商品。<br><br>每次使用折扣幣時，會隨機從活動頁面的3個商品中，選中1個進行打折。每1次打折後都會使目前被選中的商品價格變得更低，<span style=\"color: #28d37c;\">每個商品打折3次後達到最低折扣</span>。<br>只有未達到最低折扣且未被購買的商品才能繼續參與打折。", "", ""]];
            let showingRaw = false;
            let tableData = formattedData;
            let dataTable;
        
            function getStateKey(index) {
                return "state_StringZ Visualizer - CNTraditional_row_" + index; 
            }
            
            function getNotesKey(index) {
                return "notes_StringZ Visualizer - CNTraditional_row_" + index;
            }
        
            function generateRowWithState(row, idx) {
                const savedState = localStorage.getItem(getStateKey(idx)) || "";
                const savedNotes = localStorage.getItem(getNotesKey(idx)) || "";
                
                const selectHTML = '<select class="state-select ' + savedState.toLowerCase() + '">' +
                    '<option value="" ' + (savedState === "" ? "selected" : "") + '></option>' +
                    '<option value="Pass" ' + (savedState === "Pass" ? "selected" : "") + '>Pass</option>' +
                    '<option value="Fail" ' + (savedState === "Fail" ? "selected" : "") + '>Fail</option>' +
                    '</select>';
                
                const notesHTML = '<input type="text" class="notes-input" value="' + 
                    savedNotes.replace(/"/g, '&quot;') + 
                    '" placeholder="Personal notes..." maxlength="200">';
                
                const newRow = row.slice();
                const stateIndex = headers.indexOf("State") + 1;
                const notesIndex = headers.indexOf("Notes") + 1;
                newRow[stateIndex] = selectHTML;
                newRow[notesIndex] = notesHTML;
                return newRow;
            }
        
            function renderData(data) {
                tableData = data;
                const transformed = data.map((row, idx) => {
                  const rowWithNumber = [idx + 1, ...row];
                  return generateRowWithState(rowWithNumber, idx);
                });
        
                if (!dataTable) {
                    const columnsWithNumber = [{ title: '#' }, ...headers.map(h => ({ title: h }))];
                    dataTable = $('#myTable').DataTable({
                        data: transformed,
                        columns: columnsWithNumber,
                        scrollX: true,
                        paging: true,
                        searching: true,
                        ordering: true,
                        deferRender: true,
                        lengthMenu: [[-1, 10, 25, 50], ["All", 10, 25, 50]],
                        order: [],
                        columnDefs: [
                            {
                                targets: headers.indexOf("State"),
                                orderable: true
                            }
                        ]
                    });
        
                    $('#myTable tbody').on('change', 'select.state-select', function () {
                        const rowIdx = dataTable.row($(this).closest('tr')).index();
                        const value = $(this).val();
                        localStorage.setItem(getStateKey(rowIdx), value);
                        this.className = "state-select " + value.toLowerCase();
                    });
                    
                    $('#myTable tbody').on('input', 'input.notes-input', function () {
                        const rowIdx = dataTable.row($(this).closest('tr')).index();
                        const value = $(this).val();
                        localStorage.setItem(getNotesKey(rowIdx), value);
                    });

                    $('#myTable tbody').on('keydown', 'input.notes-input', function(e) {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        $(this).blur(); // Remove focus from notes
                      }
                    });
                } else {
                    const currentPage = dataTable.page();
                    const currentLength = dataTable.page.len();
                    dataTable.clear().rows.add(transformed).draw(false);
                    dataTable.page.len(currentLength).draw();
                    dataTable.page(currentPage).draw(false);
                }
            }
        
            function toggleData() {
                showingRaw = !showingRaw;
                renderData(showingRaw ? rawData : formattedData);
                
                // Update button text
                const btn = document.querySelector('.toggle-btn');
                btn.textContent = showingRaw ? 'Show Formatted' : 'Show Raw';
            }
        
            function clearAllStates() {
                const total = tableData.length;
                let clearedCount = 0;
                
                for (let i = 0; i < total; i++) {
                    const stateKey = getStateKey(i);
                    const notesKey = getNotesKey(i);
                    
                    if (localStorage.getItem(stateKey)) {
                        localStorage.removeItem(stateKey);
                        clearedCount++;
                    }
                    if (localStorage.getItem(notesKey)) {
                        localStorage.removeItem(notesKey);
                    }
                }
                
                renderData(tableData);
                
                // Better user feedback
                if (clearedCount > 0) {
                    alert(`✅ Cleared ${clearedCount} review states and all notes!`);
                } else {
                    alert('ℹ️ No review states to clear.');
                }
            }
        
            function getProgress() {
                const total = tableData.length;
                let reviewed = 0;
                let passed = 0;
                let failed = 0;
                
                for (let i = 0; i < total; i++) {
                    const state = localStorage.getItem(getStateKey(i));
                    if (state) {
                        reviewed++;
                        if (state === 'Pass') passed++;
                        if (state === 'Fail') failed++;
                    }
                }
                
                return { total, reviewed, passed, failed };
            }
            
            function updateProgressDisplay() {
                const progress = getProgress();
                const percentage = Math.round((progress.reviewed / progress.total) * 100);
                
                // Update the info banner with progress
                const banner = document.querySelector('.info-banner p');
                if (banner) {
                    const originalText = banner.textContent.split('•')[0] + '•';
                    banner.innerHTML = `${originalText} 📊 <strong>${progress.reviewed}/${progress.total}</strong> reviewed (<strong>${percentage}%</strong>) • ✅ <strong>${progress.passed}</strong> passed • ❌ <strong>${progress.failed}</strong> failed`;
                }
            }
        
            function toggleDarkMode() {
                const body = document.body;
                const btn = document.querySelector('.dark-mode-btn');
                const isDark = body.getAttribute('data-theme') === 'dark';
                
                if (isDark) {
                    body.removeAttribute('data-theme');
                    btn.textContent = '🌙 Dark';
                    localStorage.setItem('visualizer-theme', 'light');
                } else {
                    body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light'; 
                    localStorage.setItem('visualizer-theme', 'dark');
                }
            }
            
            function initializeTheme() {
                const savedTheme = localStorage.getItem('visualizer-theme');
                const btn = document.querySelector('.dark-mode-btn');
                
                if (savedTheme === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light';
                } else {
                    btn.textContent = '🌙 Dark';
                }
            }

            // New copyToClipboard function to copy ONLY the rawText
            // Can be updated to copy depending on the Formatting/Raw toggle
            function copyToClipboard(text, element) {
                const rowIndex = dataTable.row(element).index();
                const cellIndex = $(element).index();

                let rawText = text;
                if (!showingRaw && rawData[rowIndex]) {
                    rawText = rawData[rowIndex][cellIndex - 1];
                }
    
                // Decode HTML entities to get original text
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = rawText;
                const decodedText = tempDiv.textContent || tempDiv.innerText || rawText;

                navigator.clipboard.writeText(decodedText).then(() => {
                    // Show feedback
                    const feedback = document.createElement('div');
                    feedback.className = 'copy-feedback show';
                    feedback.textContent = 'Copied!';
                    element.style.position = 'relative';
                    element.appendChild(feedback);

                    setTimeout(() => {
                        feedback.classList.remove('show');
                        setTimeout(() => {
                            if (feedback.parentNode) {
                                feedback.parentNode.removeChild(feedback);
                            }
                            $(element).removeClass('copyable-cell');
                        }, 300);
                    }, 1000);
                });
            }        

            $(document).ready(function () {
              initializeTheme();
              renderData(formattedData);
              $('#clearState').click(clearAllStates);
  
              // Update progress on page load
              updateProgressDisplay();
  
              // Update progress when states change
              $('#myTable tbody').on('change', 'select.state-select', function () {
                  setTimeout(updateProgressDisplay, 100);
              });

              $('#myTable tbody').on('mouseenter', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                $(this).addClass('copyable-cell');
              }).on('mouseleave', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                if (!$(this).find('.copy-feedback').length) {
                  $(this).removeClass('copyable-cell');
                }
              }).on('click', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                const text = $(this).text().trim();
                if (text) {
                  copyToClipboard(text, this);
                }
              });

              // Initialize keyboard navigation and show initial hint
              initKeyboardNavigation();
              showInitialHint();
            });

            // Keyboard shortcuts
            let currentRowIndex = 0;
            let isKeyboardMode = false;

            function initKeyboardNavigation() {
              $(document).keydown(function(e) {
                // Important, don't interfere when typing in inputs
                if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;

                // Even more important! DO NOT INTERFERE WITH BROWSER SHORTCUTS
                if (e.ctrlKey || e.metaKey || e.altKey) return;

                // Don't interfere with Fn keys either
                if (e.key.startsWith('F') && e.key.length > 1) return;

                const table = $('#myTable').DataTable();
                const totalRows = table.rows().count();

                switch(e.key.toLowerCase()) {
                  case 'p':
                    e.preventDefault();
                    markCurrentRow('Pass');
                    break;
                  case 'f':
                    e.preventDefault();
                    markCurrentRow('Fail');
                    break;
                  case 'c':
                    e.preventDefault();
                    clearCurrentRow();
                    break;
                  case 'arrowdown':
                  case 'j':
                    e.preventDefault();
                    navigateRow(1);
                    break;
                  case 'arrowup':
                  case 'k':
                    e.preventDefault();
                    navigateRow(-1);
                    break;
                  case 'enter':
                    e.preventDefault();
                    focusNotes();
                    break;
                  case 'escape':
                    e.preventDefault();
                    exitKeyboardMode();
                    break;
                  case ' ':
                    e.preventDefault();
                    enterKeyboardMode();
                    break;
                }
              });
            }

            function markCurrentRow(state) {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              if (currentRow.length) {
                const select = currentRow.find('.state-select');
                select.val(state).trigger('change');
                navigateRow(1);
              }
            }

            function clearCurrentRow() {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              if (currentRow.length) {
                currentRow.find('.state-select').val('').trigger('change');
                // currentRow.find('.notes-input').val('').trigger('input');
              }
            }

            function navigateRow(direction) {
              if (!isKeyboardMode) return;

              const table = $('#myTable').DataTable();
              const totalRows = table.rows().count();

              currentRowIndex += direction;
              if (currentRowIndex < 0) currentRowIndex = 0;
              if (currentRowIndex >= totalRows) currentRowIndex = totalRows - 1;

              highlightCurrentRow();
              scrollToCurrentRow();
            }

            function getCurrentRow() {
              const table = $('#myTable').DataTable();
              return $(table.row(currentRowIndex).node());
            }

            function highlightCurrentRow() {
              $('#myTable tbody tr').removeClass('keyboard-focus');

              const currentRow = getCurrentRow();
              currentRow.addClass('keyboard-focus');
            }

            function scrollToCurrentRow() {
              const currentRow = getCurrentRow();
              if (currentRow.length) {
                currentRow[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }

            function focusNotes() {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              const notesInput = currentRow.find('.notes-input');
              if (notesInput.length) {
                notesInput.focus();
              }
            }

            function enterKeyboardMode() {
              isKeyboardMode = true;
              <!-- currentRowIndex = 0; -->
              highlightCurrentRow();
              showKeyboardHint();
            }

            function exitKeyboardMode() {
              isKeyboardMode = false;
              $('#myTable tbody tr').removeClass('keyboard-focus')
              hideKeyboardHint();
            }

            function showInitialHint() {
                $('.keyboard-hint').remove();
    
                $('body').append(`
                    <div class="keyboard-hint" style="
                        position: fixed; 
                        top: 15px; 
                        right: 10px; 
                        background: var(--bg-banner); 
                        color: var(--text-primary);
                        padding: 8px 12px; 
                        border-radius: 4px; 
                        font-size: 13px;
                        font-weight: 500;
                        z-index: 9999;
                        border: 1px solid var(--border-color);
                        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                    ">
                        Press <kbd>Space</kbd> to start keyboard navigation
                    </div>
                `);

                // Auto-hide if not in keyboard mode
                setTimeout(() => {
                  if (!isKeyboardMode) {
                    $('.keyboard-hint').fadeOut(1000, function() {
                      $(this).remove();
                    });
                  }
                }, 4000);
            }

            function showKeyboardHint() {
              $('.keyboard-hint').remove();
  
              $('body').append(`
                  <div class="keyboard-hint" style="
                      position: fixed; 
                      top: 15px; 
                      right: 10px; 
                      background: var(--bg-banner); 
                      color: var(--text-primary);
                      padding: 8px 12px; 
                      border-radius: 4px; 
                      font-size: 13px;
                      font-weight: 500;
                      z-index: 9999;
                      border: 1px solid var(--border-color);
                      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                  ">
                      Press <kbd>Esc</kbd> to exit keyboard mode
                  </div>
              `);

              $('body').append(`
              <div class="shortcut-summary" style="
                  position: fixed;
                  top: 60px;
                  right: 10px;
                  background: #007bff;
                  color: white;
                  padding: 10px 12px;
                  border-radius: 6px;
                  font-size: 11px;
                  z-index: 9998;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                  font-family: monospace;
              ">
                  <kbd style="background: rgba(255,255,255,0.2);">P</kbd>ass 
                  <kbd style="background: rgba(255,255,255,0.2);">F</kbd>ail 
                  <kbd style="background: rgba(255,255,255,0.2);">C</kbd>lear 
                  <kbd style="background: rgba(255,255,255,0.2);">↑↓</kbd>Nav 
                  <kbd style="background: rgba(255,255,255,0.2);">⏎</kbd>Notes
              </div>
            `);

              setTimeout(() => {
                $('.shortcut-summary').fadeOut(800, function() {
                  $(this).remove();
                });
              }, 5000);
            }            

            function hideKeyboardHint() {
              $('#keyboard-hint').remove();
              $('.shortcut-summary').remove();
              showInitialHint();
            }
    </script>
  </body>
</html>

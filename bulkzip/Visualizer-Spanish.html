    <style>
      :root {
        /* Light mode colors */
        --bg-primary: #f8f9fa;
        --bg-secondary: white;
        --bg-banner: #f8f9fa;
        --text-primary: #333;
        --text-secondary: #6c757d;
        --text-muted: #495057;
        --border-color: #dee2e6;
        --table-header-bg: #f8f9fa;
        --table-border: #dee2e6;
        --button-bg: #6c757d;
        --button-hover: #5a6268;
        --input-bg: white;
      }
      
      [data-theme="dark"] {
        /* Dark mode colors */
        --bg-primary: #1a1a1a;
        --bg-secondary: #2d2d2d;
        --bg-banner: #343a40;
        --text-primary: #f8f9fa;
        --text-secondary: #adb5bd;
        --text-muted: #ced4da;
        --border-color: #495057;
        --table-header-bg: #343a40;
        --table-border: #495057;
        --button-bg: #495057;
        --button-hover: #5a6268;
        --input-bg: #343a40;
      }
      
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-primary);
        margin: 0;
        padding: 0;
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      .toggle-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        padding: 8px 16px;
        background-color: var(--button-bg);
        color: white;
        border: 1px solid var(--button-bg);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      .toggle-btn:hover {
        background-color: var(--button-hover);
        border-color: var(--button-hover);
      }
      
      .dark-mode-btn {
        position: fixed;
        top: 15px;
        left: 150px;
        z-index: 9999;
        padding: 8px 16px;
        background-color: var(--button-bg);
        color: white;
        border: 1px solid var(--button-bg);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      .dark-mode-btn:hover {
        background-color: var(--button-hover);
        border-color: var(--button-hover);
      }
      
      #clearState {
        float: left;
        margin-right: 15px;
        margin-bottom: 15px;
        padding: 8px 16px;
        background-color: #dc3545;
        color: white;
        border: 1px solid #dc3545;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      #clearState:hover {
        background-color: #c82333;
        border-color: #bd2130;
      }
      
      .container {
        padding: 70px 30px 30px 30px;
        background: var(--bg-secondary);
        margin: 0;
        min-height: 100vh;
        transition: background-color 0.3s ease;
      }
      
      .info-banner {
        background-color: var(--bg-banner);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 20px;
        margin-bottom: 25px;
        border-radius: 4px;
        text-align: center;
        transition: background-color 0.3s ease, border-color 0.3s ease;
      }
      
      .info-banner h2 {
        margin: 0 0 10px 0;
        font-size: 24px;
        font-weight: 600;
        color: var(--text-primary);
      }
      
      .info-banner p {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary);
      }
      
      #myTable {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        overflow: hidden;
        transition: border-color 0.3s ease;
      }
      
      #myTable td {
        user-select: text !important;
        padding: 12px 8px;
        vertical-align: top;
        border-bottom: 1px solid var(--table-border);
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      #myTable th {
        background-color: var(--table-header-bg);
        border-bottom: 2px solid var(--border-color);
        color: var(--text-muted);
        font-weight: 600;
        padding: 15px 8px;
        text-align: center;
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      /* Enhanced styling for different columns */
      #myTable td:first-child {
        text-align: center;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        /*<!-- max-width: 120px; -->*/
        width: 50px;
      }
      
      #myTable td:nth-child(2) {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        text-align: left;
        /*line-height: 1.4;*/
        max-width: 120px;
      }

      #myTable td:nth-child(3), #myTable td:nth-child(4) {
        line-height: 1.4;
        max-width: 300px;
        word-wrap: break-word;
        text-align: left;
      }
      
      #myTable td:nth-child(5) {
        text-align: center;
        font-weight: 600;
        color: var(--text-muted);
        font-size: 14px;
        width: 80px;
      }
      
      #myTable td:nth-child(6) {
        min-width: 120px;
        max-width: 150px;
        text-align: center;
      }

      #myTable td:nth-child(7) {
        min-width: 150px;
        max-width: 200px;
      }
      
      select.state-select {
        width: 100%;
        font-weight: 500;
        padding: 6px 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 14px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      input.notes-input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 12px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      input.notes-input:focus {
        outline: none;
        border-color: #80bdff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
      }
      
      input.notes-input::placeholder {
        color: var(--text-secondary);
        font-style: italic;
      }
      
      select.state-select:focus {
        outline: none;
        border-color: #80bdff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
      }
      
      select.state-select.pass {
        color: #28a745;
        border-color: #28a745;
      }
      
      select.state-select.fail {
        color: #dc3545;
        border-color: #dc3545;
      }
      
      /* DataTables styling */
      .dataTables_wrapper {
        color: var(--text-primary);
      }
      
      .dataTables_wrapper .dataTables_length,
      .dataTables_wrapper .dataTables_filter,
      .dataTables_wrapper .dataTables_info,
      .dataTables_wrapper .dataTables_paginate {
        margin: 15px 0;
      }
      
      .dataTables_wrapper .dataTables_filter input {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 12px;
        margin-left: 8px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_length select {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 4px 8px;
        margin: 0 8px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 12px;
        margin: 0 2px;
        background-color: var(--input-bg);
        color: var(--text-primary) !important;
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
        background-color: var(--bg-banner);
        border-color: var(--text-secondary);
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button.current {
        background-color: #007bff;
        border-color: #007bff;
        color: white !important;
      }

      /* Copy feature styling */
    .copyable-cell {
        cursor: pointer;
        position: relative;
        transition: background-color 0.2s ease;
    }

    .copyable-cell:hover {
        background-color: rgba(0, 123, 255, 0.1) !important;
    }

    .copy-feedback {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #28a745;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .copy-feedback.show {
        opacity: 1;
    }

    .keyboard-focus {
      background-color: rgba(0, 123, 255, 0.08) !important;
      border: 2px solid #007bff !important;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2) !important;
    }

    .keyboard-focus td {
      background-color: rgba(0, 123, 255, 0.05) !important;
    }

    kbd {
      background-color: var(--button-bg);
      color: white;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
    }
    </style>
  </head>

lding_mName_12_1", "Turn of Luck", "Giro de la fortuna", "", ""], ["Skill_mSkillDesc_1908301_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Ataca con garras, infligiendo daño a todos los campeones en una casilla al frente.", "", ""], ["Skill_mSkillDesc_1908304_1", "Swings claws, dealing DMG to all heroes within 1 tile ahead.", "Ataca con garras, infligiendo daño a todos los campeones en una casilla al frente.", "", ""], ["Skill_mSkillDesc_1908315_1", "When the Nine-Tailed Fox takes fatal DMG, she flees the battlefield and activates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Cuando la Zorra de las Nueve Colas recibe daño letal, huye del campo de batalla y activa las colas del campo para atacar. Cuando las colas son derrotadas, la Zorra de las Nueve Colas regresa al campo de batalla. Después de que todas las colas del campo sean derrotadas, la Zorra de las Nueve Colas se transforma e invoca una gran cantidad de zorros.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige daño mágico a la última unidad que entró al campo de batalla, priorizando a los defensores.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige daño mágico a la última unidad que entró al campo de batalla, priorizando a los defensores.", "", ""], ["Skill_mSkillDesc_803803_1", "Immune to all &lt;color=&quot;#4A9DF2&quot;&gt;CC Effects&lt;/color&gt; (except Slow).", "Inmune a todos los &lt;color=&quot;#4A9DF2&quot;&gt;efectos de control&lt;/color&gt; (excepto ralentización).", "", ""], ["Skill_mSkillDesc_8202053_1", "Reduces the Redeployment Time of allied heroes by &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt;, but increases the s a un enemigo sin precedentes: Semrah. Procedente de tiempos antiguos, Semrah lucha en 3 modos de batalla, cada uno de los cuales plantea un arduo desafío.", "", ""], ["Stage_mStageDesc_5003002", "In this epic battle, you will face an unprecedented enemy - Semrah. Hailing from ancient times, Semrah fights in 3 Battle Modes, each posing a tough challenge.", "En esta épica batalla, te enfrentarás a un enemigo sin precedentes: Semrah. Procedente de tiempos antiguos, Semrah lucha en 3 modos de batalla, cada uno de los cuales plantea un arduo desafío.", "", ""], ["Stage_mStageDesc_8101001", "Starting from Round 5, &lt;color=&quot;#fd4540&quot;&gt;all monsters gain Invisibility and become untargetable&lt;/color&gt; for 7 sec.", "A partir de la ronda 5, &lt;color=&quot;#fd4540&quot;&gt;todos los monstruos se vuelven invisibles y es imposible atacarlos&lt;/color&gt; durante 7 segundos.", "", ""], ["Stage_mStageDesc_8101002", "Starting from Round 5, &lt;color=&quot;#fd4540&quot;&gt;all monsters gain Invincibility upon taking DMG for the first time, becoming immune to all DMG&lt;/color&gt; for 4 sec.", "A partir de la ronda 5, &lt;color=&quot;#fd4540&quot;&gt;todos los monstruos se vuelven invencibles al recibir daño por primera vez e inmunes a todo tipo de daño&lt;/color&gt; durante 4 segundos.", "", ""], ["Stage_mStageDesc_8101003", "Starting from Round 5, &lt;color=&quot;#fd4540&quot;&gt;all heroes continuously take True DMG equal to 4% of their Max HP per sec&lt;/color&gt;.", "A partir de la ronda 5, &lt;color=&quot;#fd4540&quot;&gt;todos los campeones reciben daño real por segundo igual al 4 % de su vida máxima&lt;/color&gt;.", "", ""], ["Stage_mStageDesc_8201011", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "Forma equipo con tus amigos para derrotar al jefe enemigo y resistir las oleadas de enemigos.", "", ""], ["Stage_mStageDesc_8201012", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies. rtal realm with her illusions. Four supreme arrays must be laid to obliterate its true spirit.\\n\\nFire Realm: Molten lava surges as crimson chains, coiling round her nine tails to scorch demonic bones. The fox’s wails crackle like searing thunder.", "La Zorra de las Nueve Colas, resucitada por el agravio de la dinastía Shang, siembra el caos en el reino mortal con sus ilusiones. Deben disponerse cuatro formaciones supremas para obliterar su verdadero espíritu.\\n\\nReino de fuego: La lava derretida se alza como cadenas escarlata, enrollándose en torno a sus nueve colas para abrasar los huesos demoníacos. Los lamentos de la zorra crepitan como trueno abrasador.", "", ""], ["Item_mItemName_214901", "Shawl of the Lifegiver", "Chal del Otorgavida", "", ""], ["Skill_mSkillSimpleDesc_232170_1", "When the Talent is triggered, increases the hero&#x27;s DMG by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;, with an additional &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; against Elite and Boss units for &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; sec.", "Cuando se activa el talento, aumenta el daño de la campeona un &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} %&lt;/color&gt;, con un &lt;color=&quot;#4A9DF2&quot;&gt;{skm2} %&lt;/color&gt; adicional contra unidades élite y jefe durante &lt;color=&quot;#4A9DF2&quot;&gt;{skm3}&lt;/color&gt; seg.", "", ""], ["CommonText_mMessage_25947", "Corresponding Arena Challenge Attack Mode", "Modo de ataque de desafío de la Arena correspondiente", "", ""], ["CommonText_mMessage_25948", "Corresponding Arena Challenge Defense Mode", "Modo de defensa de desafío de la Arena correspondiente", "", ""], ["Skill_mSkillSimpleDesc_220903_5", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322095]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec.", "Aplica &quot;&lt;color=&quot;#28d37c&quot;&gt;[322095]&lt;/color&gt;&quot; a &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; aliado con el porcentaje de vida más bajo en el alcance durante &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; seg.", "", ""], ["Skill_mSkillSimpleDesc_220903_4", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322094]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec.", "Aplica &quot;&lt;color=&quot;#28d37c&quot;&gt;[322094]&lt;/color&gt;&quot; a &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; aliado con el porcentaje de vida más bajo en el alcance durante &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; seg.", "", ""], ["Skill_mSkillSimpleDesc_220903_3", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322093]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec.", "Aplica &quot;&lt;color=&quot;#28d37c&quot;&gt;[322093]&lt;/color&gt;&quot; a &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; aliado con el porcentaje de vida más bajo en el alcance durante &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; seg.", "", ""], ["Skill_mSkillSimpleDesc_220903_2", "Applies &lt;color=&quot;#28d37c&quot;&gt;[322092]&lt;/color&gt; to &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; ally with the lowest HP percentage in range for &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; sec.", "Aplica &quot;&lt;color=&quot;#28d37c&quot;&gt;[322092]&lt;/color&gt;&quot; a &lt;color=&quot;#4A9DF2&quot;&gt;1&lt;/color&gt; aliado con el porcentaje de vida más bajo en el alcance durante &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt; seg.", "", ""], ["LANG_STRID_notice_NineTailedNightmare", "Nine-Tailed Nightmare Event Intro", "Información del evento &quot;Pesadilla de las nueve colas&quot;", "", ""], ["LANG_STRID_push_long9_title_1", "Grimmscale Invasion Launches", "¡Comienza la Invasión de Grimmscale!", "", ""], ["LANG_STRID_push_long9_title_2", "Commanders can challenge Sauryan, Wing of Chaos infinitely every day. Rewards are based on the highest total damage dealt in a single challenge attempt.", "Los Comandantes pueden desafiar a Sauryan, Ala del Caos infinitamente cada día. Las recompensas se basan en el daño total más alto infligido en un solo intento de desafío.", "", ""], ["LANG_STRID_push_xyx_title_1", "Zombie Invasion Starts!", "¡Comienza la Invasión zombi!", "", ""], ["LANG_STRID_push_xyx_title_2", "Build your hero&#x27;s skills, equip powerful Relics, and battle through waves of monsters to survive!", "¡Desarrolla las habilidades de tu campeón, equípate con reliquias poderosas y lucha a través de oleadas de monstruos para sobrevivir!", "", ""], ["LANG_STRID_notice_jwhpv", "Event Trailer: Nine-Tailed Nightmare", "Tráiler del evento: Pesadilla de las nueve colas", "", ""], ["LANG_STRID_push_jwhyy1", "Nine-Tailed Nightmare Is Here!", "¡Pesadilla de las nueve colas ya está aquí!", "", ""], ["LANG_STRID_push_jwhyy2", "The new Legendary heroes Ne Zha and Erlang Shen arrive! Join the events to claim event-exclusive rewards, including Exclusive Artifacts, Summoning Crystals, Avatar, Emote, and more! Plus, Erlang Shen&#x27;s time-limited skin is now available!", "¡Los nuevos campeones legendarios Ne Zha y Erlang Shen han llegado! Participa en los eventos para recoger recompensas exclusivas del evento, incluyendo artefactos exclusivos, gemas de invocación, avatar, emoticono, ¡y más! Además, ¡la apariencia por tiempo limitado de Erlang Shen ya está disponible!", "", ""], ["LANG_STRID_notice_NineTailed2", "Nine-Tailed Nightmare Starts!", "¡Pesadilla de las nueve colas!", "", ""], ["LANG_STRID_notice_NineTailed3", "Join the event to obtain event-exclusive rewards, including Exclusive Artifacts, Avatar, Avatar Border, Summoning Crystals, and more!", "¡Participa en el evento para obtener recompensas exclusivas del evento, incluyendo artefactos exclusivos, avatar, marco, gemas de invocación, y más!", "", ""], ["LANG_STRID_push_shardsummon_nezha", "Collect shards to assemble Ne Zha&#x27;s Exclusive Artifact: Fire-Tipped Spear!", "¡Recolecta fragmentos para ensamblar el artefacto exclusivo de Ne Zha: Lanza de punta ardiente!", "", ""], ["LANG_STRID_push_shardsummon_sqhcending", "Artifact Shard Assembly Countdown", "Cuenta atrás de fusión de fragmentos de artefacto", "", ""], ["LANG_STRID_push_shardsummon_nezhaend2", "Last chance to collect shards and assemble Ne Zha&#x27;s Exclusive Artifact: Fire-Tipped Spear! Don&#x27;t miss out!", "¡Última oportunidad para recolectar fragmentos y ensamblar el artefacto exclusivo de Ne Zha: Lanza de punta ardiente! ¡No te lo pierdas!", "", ""], ["LANG_STRID_notice_CreativeShort", "Creative Short", "Corto creativo", "", ""], ["LANG_STRID_compete_brief", "After the event starts, Commanders earn League points by participating in the Arena, Guild - Drake&#x27;s Chasm and spending Stamina and can claim Personal Score Rewards. Commanders within the same League compete against each other for ranking rewards. After the event ends, Commanders who have earned points can claim the Basic League Rewards. Members of the League with a higher total score will receive additional Champion League Reward.", "Tras comenzar el evento, los Comandantes ganan puntos de liga participando en la Arena, Clan - Sima del dragón y gastando energía, y pueden recoger recompensas de puntuación personal. Los Comandantes de la misma liga compiten entre sí por las recompensas de clasificación. Tras finalizar el evento, los Comandantes que hayan ganado puntos pueden recoger las recompensas básicas de liga. Los miembros de la liga con una puntuación total más alta recibirán una recompensa adicional de liga de campeones.", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Des_01", "Discount Tokens obtained from event quests can be used to randomly discount an item on the event page once. Each item can be discounted up to 3 times.", "Los símbolos de descuento obtenidos de las misiones del evento pueden usarse para aplicar descuentos aleatorios a un objeto de la página del evento una vez. Cada objeto puede tener descuento hasta 3 veces.", "", ""], ["LANG_STRID_FishingRanking", "&lt;color=#e1e1e1&gt;After the event ends, the top 3 Commanders on the leaderboard will each receive a physical merchandise reward. Contact info will be requested via in-game mail for delivery.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;Tras finalizar el evento, los 3 Comandantes mejor clasificados recibirán cada uno una recompensa de mercancía física. Se solicitará información de contacto por correo en el juego para la entrega.&lt;/color&gt;", "", ""], ["LANG_STRID_notice_nzgl", "Hero Gameplay: Ne Zha", "Jugabilidad del campeón: Ne Zha", "", ""], ["LANG_STRID_notice_yjgl", "Hero Gameplay: Erlang Shen", "Jugabilidad del campeón: Erlang Shen", "", ""], ["LANG_STRID_GDP_title_26", "Celestial Season", "Temporada celestial", "", ""], ["LANG_STRID_activity_popup_GDP_htj", "Gold Dragon Pass - Celestial Season", "Pase del dragón dorado: Temporada celestial", "", ""], ["LANG_STRID_CompeteEvent_Rule11", "&lt;color=#e1e1e1&gt;Consume general items to gain points.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;Consume objetos generales para obtener puntos.&lt;/color&gt;", "", ""], ["LANG_STRID_CompeteEvent_Rule12", "&lt;color=#e1e1e1&gt;Consume Mythril and Meteorite to gain points.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;Consume mithril y meteorito para obtener puntos.&lt;/color&gt;", "", ""], ["LANG_STRID_Moon_Dec_01", "Shadows of Tomorrow", "Sombras del mañana", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Detail", "&lt;color=&quot;#cec2b1&quot;&gt;Discount Event&lt;/color&gt;\\nEach use of a Discount Token will apply a &lt;color=&quot;#28d37c&quot;&gt;random discount&lt;/color&gt; to a random item in the event. Participate in event quests to obtain Discount Tokens. All unused Discount Tokens will be removed after the event ends.\\nPlayers may choose to purchase event items at their original prices without using any Discount Tokens.\\n\\nEach time a Discount Token is used, one item will be randomly selected from the three available in the event interface for a discount. After each discount, the price of the currently selected item will be further reduced. &lt;color=&quot;#28d37c&quot;&gt;Each item reaches its maximum discount after being discounted 3 times&lt;/color&gt;.\\nOnly items that have not reached the maximum discount and have not been purchased can continue to participate in the discount event.", "&lt;color=&quot;#cec2b1&quot;&gt;Evento de descuento&lt;/color&gt;\\nCada uso de un símbolo de descuento aplicará un &lt;color=&quot;#28d37c&quot;&gt;descuento aleatorio&lt;/color&gt; a un objeto aleatorio del evento. Participa en las misiones del evento para obtener símbolos de descuento. Todos los símbolos de descuento no utilizados se eliminarán al finalizar el evento.\\nLos jugadores pueden elegir comprar los objetos del evento a sus precios originales sin usar ningún símbolo de descuento.\\n\\nCada vez que se usa un símbolo de descuento, se seleccionará aleatoriamente un objeto de los tres disponibles en la interfaz del evento para aplicar un descuento. Tras cada descuento, el precio del objeto seleccionado se reducirá aún más. &lt;color=&quot;#28d37c&quot;&gt;Cada objeto alcanza su descuento máximo tras recibir 3 descuentos&lt;/color&gt;.\\nSolo los objetos que no hayan alcanzado el descuento máximo y que no hayan sido comprados pueden seguir participando en el evento de descuento.", "", ""]];

ivates the tails on the field to attack. When the tails are defeated, the Nine-Tailed Fox returns to the battlefield. After all tails on the field are defeated, the Nine-Tailed Fox transforms and summons a large number of foxes.", "Cuando la Zorra de las Nueve Colas recibe daño letal, huye del campo de batalla y activa las colas del campo para atacar. Cuando las colas son derrotadas, la Zorra de las Nueve Colas regresa al campo de batalla. Después de que todas las colas del campo sean derrotadas, la Zorra de las Nueve Colas se transforma e invoca una gran cantidad de zorros.", "", ""], ["Skill_mSkillDesc_1908345_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige daño mágico a la última unidad que entró al campo de batalla, priorizando a los defensores.", "", ""], ["Skill_mSkillDesc_1908357_1", "Deals M. DMG to the last deployed unit on the battlefield, prioritizing Defenders.", "Inflige daño mágico a la última unidad que entró al campo de batalla, priorizando a los defensores.", "", ""], ["Skill_mSkillDesc_803803_1", "Immune to all <span style=\"color: #4A9DF2;\">CC Effects</span> (except Slow).", "Inmune a todos los <span style=\"color: #4A9DF2;\">efectos de control</span> (excepto ralentización).", "", ""], ["Skill_mSkillDesc_8202053_1", "Reduces the Redeployment Time of allied heroes by <span style=\"color: #4A9DF2;\">{sk1}%</span>, but increases their Deployment Cost by <span style=\"color: #4A9DF2;\">+{sk2}</span>.", "Reduce el tiempo de reenvío de los campeones aliados en un <span style=\"color: #4A9DF2;\">{sk1} %</span>, pero aumenta su coste de despliegue en <span style=\"color: #4A9DF2;\">+{sk2}</span>.", "", ""], ["Skill_mSkillDesc_8202084_1", "Increases allied heroes' DMG by <span style=\"color: #4A9DF2;\">{sk1}%</span> each round and reduces Basic ATK interval by <span style=\"color: #4A9DF2;\">{sk1}%</span>. Vulnerability (P. DMG) and Vulnerability (M. DMG) increase by <span style=\"color: #4A9DF2;\">{sk2}%</span> each round.", "Aumenta el daño de los campeones aliados en un <span style=\"color: #4A9DF2;\">{sk1} %</span> cada ronda y reduce el intervalo de ataque básico en un <span style=\"color: #4A9DF2;\">{sk1} %</span>. La vulnerabilidad física y la vulnerabilidad mágica aumentan en un <span style=\"color: #4A9DF2;\">{sk2} %</span> cada ronda.", "", ""], ["Skill_mSkillDesc_8202103_1", "Allied Hero Deployment Limit +<span style=\"color: #4A9DF2;\">{sk1}</span>", "Límite de despliegue de campeones aliados +<span style=\"color: #4A9DF2;\">{sk1}</span>", "", ""], ["Skill_mSkillName_1033701_1", "Accelerated Incubation", "Incubación acelerada", "", ""], ["Skill_mSkillName_3991865_1", "High Quality", "Alta calidad", "", ""], ["Skill_mSkillName_803610_1", "Freeze", "Congelación", "", ""], ["Skill_mSkillName_803801_1", "Frostbite Strike", "Golpe de congelación", "", ""], ["Skill_mSkillName_803803_1", "Control Immunity", "Anticontrol", "", ""], ["Skill_mSkillName_804001_1", "Frostbite Rupture", "Ruptura de congelación", "", ""], ["Skill_mSkillName_8202053_1", "Time VS Money", "Tiempo contra dinero", "", ""], ["Skill_mSkillName_8202084_1", "Heating Up", "Calentando", "", ""], ["Skill_mSkillName_8202103_1", "Rigged Arena", "Arena amañada", "", ""], ["Skill_mSkillSimpleDesc_11015501_1", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and reduces the number of attacks required to trigger Nature's Fury enhanced attack by <span style=\"color: #4A9DF2;\">{skm2}</span>. When in Berserker Stance, Basic ATK restores <span style=\"color: #4A9DF2;\">{skm3}%</span> Max HP, and triggering Ground Stomp restores <span style=\"color: #4A9DF2;\">{skm4}%</span> Max HP.", "Aumenta el ataque en un <span style=\"color: #4A9DF2;\">{skm1} %</span> y reduce el número de ataques necesarios para activar el ataque mejorado de \"Furia de la naturaleza\" en <span style=\"color: #4A9DF2;\">{skm2}</span>. Durante el \"Frenetismo\", el ataque básico restaura un <span style=\"color: #4A9DF             let showingRaw = false;
            let tableData = formattedData;
            let dataTable;
        
            function getStateKey(index) {
                return "state_StringZ Visualizer - Spanish_row_" + index; 
            }
            
            function getNotesKey(index) {
                return "notes_StringZ Visualizer - Spanish_row_" + index;
            }
        
            function generateRowWithState(row, idx) {
                const savedState = localStorage.getItem(getStateKey(idx)) || "";
                const savedNotes = localStorage.getItem(getNotesKey(idx)) || "";
                
                const selectHTML = '<select class="state-select ' + savedState.toLowerCase() + '">' +
                    '<option value="" ' + (savedState === "" ? "selected" : "") + '></option>' +
                    '<option value="Pass" ' + (savedState === "Pass" ? "selected" : "") + '>Pass</option>' +
                    '<option value="Fail" ' + (savedState === "Fail" ? "selected" : "") + '>Fail</option>' +
                    '</select>';
                
                const notesHTML = '<input type="text" class="notes-input" value="' + 
                    savedNotes.replace(/"/g, '&quot;') + 
                    '" placeholder="Personal notes..." maxlength="200">';
                
                const newRow = row.slice();
                const stateIndex = headers.indexOf("State") + 1;
                const notesIndex = headers.indexOf("Notes") + 1;
                newRow[stateIndex] = selectHTML;
                newRow[notesIndex] = notesHTML;
                return newRow;
            }
        
            function renderData(data) {
                tableData = data;
                const transformed = data.map((row, idx) => {
                  const rowWithNumber = [idx + 1, ...row];
                  return generateRowWithState(rowWithNumber, idx);
                });
        
                if (!dataTable) {
                    const columnsWithNumber = [{ title: '#' }, ...headers.map(h => ({ title: h }))];
                    dataTable = $('#myTable').DataTable({
                        data: transformed,
                        columns: columnsWithNumber,
                        scrollX: true,
                        paging: true,
                        searching: true,
                        ordering: true,
                        deferRender: true,
                        lengthMenu: [[-1, 10, 25, 50], ["All", 10, 25, 50]],
                        order: [],
                        columnDefs: [
                            {
                                targets: headers.indexOf("State"),
                                orderable: true
                            }
                        ]
                    });
        
                    $('#myTable tbody').on('change', 'select.state-select', function () {
                        const rowIdx = dataTable.row($(this).closest('tr')).index();
                        const value = $(this).val();
                        localStorage.setItem(getStateKey(rowIdx), value);
                        this.className = "state-select " + value.toLowerCase();
                    });
                    
                    $('#myTable tbody').on('input', 'input.notes-input', function () {
                        const rowIdx = dataTable.row($(this).closest('tr')).index();
                        const value = $(this).val();
                        localStorage.setItem(getNotesKey(rowIdx), value);
                    });

                    $('#myTable tbody').on('keydown', 'input.notes-input', function(e) {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        $(this).blur(); // Remove focus from notes
                      }
                    });
                } else {
                    const currentPage = dataTable.page();
                    const currentLength = dataTable.page.len();
                    dataTable.clear().rows.add(transformed).draw(false);
                    dataTable.page.len(currentLength).draw();
                    dataTable.page(currentPage).draw(false);
                }
            }
        
            function toggleData() {
                showingRaw = !showingRaw;
                renderData(showingRaw ? rawData : formattedData);
                
                // Update button text
                const btn = document.querySelector('.toggle-btn');
                btn.textContent = showingRaw ? 'Show Formatted' : 'Show Raw';
            }
        
            function clearAllStates() {
                const total = tableData.length;
                let clearedCount = 0;
                
                for (let i = 0; i < total; i++) {
                    const stateKey = getStateKey(i);
                    const notesKey = getNotesKey(i);
                    
                    if (localStorage.getItem(stateKey)) {
                        localStorage.removeItem(stateKey);
                        clearedCount++;
                    }
                    if (localStorage.getItem(notesKey)) {
                        localStorage.removeItem(notesKey);
                    }
                }
                
                renderData(tableData);
                
                // Better user feedback
                if (clearedCount > 0) {
                    alert(`✅ Cleared ${clearedCount} review states and all notes!`);
                } else {
                    alert('ℹ️ No review states to clear.');
                }
            }
        
            function getProgress() {
                const total = tableData.length;
                let reviewed = 0;
                let passed = 0;
                let failed = 0;
                
                for (let i = 0; i < total; i++) {
                    const state = localStorage.getItem(getStateKey(i));
                    if (state) {
                        reviewed++;
                        if (state === 'Pass') passed++;
                        if (state === 'Fail') failed++;
                    }
                }
                
                return { total, reviewed, passed, failed };
            }
            
            function updateProgressDisplay() {
                const progress = getProgress();
                const percentage = Math.round((progress.reviewed / progress.total) * 100);
                
                // Update the info banner with progress
                const banner = document.querySelector('.info-banner p');
                if (banner) {
                    const originalText = banner.textContent.split('•')[0] + '•';
                    banner.innerHTML = `${originalText} 📊 <strong>${progress.reviewed}/${progress.total}</strong> reviewed (<strong>${percentage}%</strong>) • ✅ <strong>${progress.passed}</strong> passed • ❌ <strong>${progress.failed}</strong> failed`;
                }
            }
        
            function toggleDarkMode() {
                const body = document.body;
                const btn = document.querySelector('.dark-mode-btn');
                const isDark = body.getAttribute('data-theme') === 'dark';
                
                if (isDark) {
                    body.removeAttribute('data-theme');
                    btn.textContent = '🌙 Dark';
                    localStorage.setItem('visualizer-theme', 'light');
                } else {
                    body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light'; 
                    localStorage.setItem('visualizer-theme', 'dark');
                }
            }
            
            function initializeTheme() {
                const savedTheme = localStorage.getItem('visualizer-theme');
                const btn = document.querySelector('.dark-mode-btn');
                
                if (savedTheme === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light';
                } else {
                    btn.textContent = '🌙 Dark';
                }
            }

            // New copyToClipboard function to copy ONLY the rawText
            // Can be updated to copy depending on the Formatting/Raw toggle
            function copyToClipboard(text, element) {
                const rowIndex = dataTable.row(element).index();
                const cellIndex = $(element).index();

                let rawText = text;
                if (!showingRaw && rawData[rowIndex]) {
                    rawText = rawData[rowIndex][cellIndex - 1];
                }
    
                // Decode HTML entities to get original text
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = rawText;
                const decodedText = tempDiv.textContent || tempDiv.innerText || rawText;

                navigator.clipboard.writeText(decodedText).then(() => {
                    // Show feedback
                    const feedback = document.createElement('div');
                    feedback.className = 'copy-feedback show';
                    feedback.textContent = 'Copied!';
                    element.style.position = 'relative';
                    element.appendChild(feedback);

                    setTimeout(() => {
                        feedback.classList.remove('show');
                        setTimeout(() => {
                            if (feedback.parentNode) {
                                feedback.parentNode.removeChild(feedback);
                            }
                            $(element).removeClass('copyable-cell');
                        }, 300);
                    }, 1000);
                });
            }        

            $(document).ready(function () {
              initializeTheme();
              renderData(formattedData);
              $('#clearState').click(clearAllStates);
  
              // Update progress on page load
              updateProgressDisplay();
  
              // Update progress when states change
              $('#myTable tbody').on('change', 'select.state-select', function () {
                  setTimeout(updateProgressDisplay, 100);
              });

              $('#myTable tbody').on('mouseenter', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                $(this).addClass('copyable-cell');
              }).on('mouseleave', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                if (!$(this).find('.copy-feedback').length) {
                  $(this).removeClass('copyable-cell');
                }
              }).on('click', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                const text = $(this).text().trim();
                if (text) {
                  copyToClipboard(text, this);
                }
              });

              // Initialize keyboard navigation and show initial hint
              initKeyboardNavigation();
              showInitialHint();
            });

            // Keyboard shortcuts
            let currentRowIndex = 0;
            let isKeyboardMode = false;

            function initKeyboardNavigation() {
              $(document).keydown(function(e) {
                // Important, don't interfere when typing in inputs
                if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;

                // Even more important! DO NOT INTERFERE WITH BROWSER SHORTCUTS
                if (e.ctrlKey || e.metaKey || e.altKey) return;

                // Don't interfere with Fn keys either
                if (e.key.startsWith('F') && e.key.length > 1) return;

                const table = $('#myTable').DataTable();
                const totalRows = table.rows().count();

                switch(e.key.toLowerCase()) {
                  case 'p':
                    e.preventDefault();
                    markCurrentRow('Pass');
                    break;
                  case 'f':
                    e.preventDefault();
                    markCurrentRow('Fail');
                    break;
                  case 'c':
                    e.preventDefault();
                    clearCurrentRow();
                    break;
                  case 'arrowdown':
                  case 'j':
                    e.preventDefault();
                    navigateRow(1);
                    break;
                  case 'arrowup':
                  case 'k':
                    e.preventDefault();
                    navigateRow(-1);
                    break;
                  case 'enter':
                    e.preventDefault();
                    focusNotes();
                    break;
                  case 'escape':
                    e.preventDefault();
                    exitKeyboardMode();
                    break;
                  case ' ':
                    e.preventDefault();
                    enterKeyboardMode();
                    break;
                }
              });
            }

            function markCurrentRow(state) {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              if (currentRow.length) {
                const select = currentRow.find('.state-select');
                select.val(state).trigger('change');
                navigateRow(1);
              }
            }

            function clearCurrentRow() {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              if (currentRow.length) {
                currentRow.find('.state-select').val('').trigger('change');
                // currentRow.find('.notes-input').val('').trigger('input');
              }
            }

            function navigateRow(direction) {
              if (!isKeyboardMode) return;

              const table = $('#myTable').DataTable();
              const totalRows = table.rows().count();

              currentRowIndex += direction;
              if (currentRowIndex < 0) currentRowIndex = 0;
              if (currentRowIndex >= totalRows) currentRowIndex = totalRows - 1;

              highlightCurrentRow();
              scrollToCurrentRow();
            }

            function getCurrentRow() {
              const table = $('#myTable').DataTable();
              return $(table.row(currentRowIndex).node());
            }

            function highlightCurrentRow() {
              $('#myTable tbody tr').removeClass('keyboard-focus');

              const currentRow = getCurrentRow();
              currentRow.addClass('keyboard-focus');
            }

            function scrollToCurrentRow() {
              const currentRow = getCurrentRow();
              if (currentRow.length) {
                currentRow[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }

            function focusNotes() {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              const notesInput = currentRow.find('.notes-input');
              if (notesInput.length) {
                notesInput.focus();
              }
            }

            function enterKeyboardMode() {
              isKeyboardMode = true;
              <!-- currentRowIndex = 0; -->
              highlightCurrentRow();
              showKeyboardHint();
            }

            function exitKeyboardMode() {
              isKeyboardMode = false;
              $('#myTable tbody tr').removeClass('keyboard-focus')
              hideKeyboardHint();
            }

            function showInitialHint() {
                $('.keyboard-hint').remove();
    
                $('body').append(`
                    <div class="keyboard-hint" style="
                        position: fixed; 
                        top: 15px; 
                        right: 10px; 
                        background: var(--bg-banner); 
                        color: var(--text-primary);
                        padding: 8px 12px; 
                        border-radius: 4px; 
                        font-size: 13px;
                        font-weight: 500;
                        z-index: 9999;
                        border: 1px solid var(--border-color);
                        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                    ">
                        Press <kbd>Space</kbd> to start keyboard navigation
                    </div>
                `);

                // Auto-hide if not in keyboard mode
                setTimeout(() => {
                  if (!isKeyboardMode) {
                    $('.keyboard-hint').fadeOut(1000, function() {
                      $(this).remove();
                    });
                  }
                }, 4000);
            }

            function showKeyboardHint() {
              $('.keyboard-hint').remove();
  
              $('body').append(`
                  <div class="keyboard-hint" style="
                      position: fixed; 
                      top: 15px; 
                      right: 10px; 
                      background: var(--bg-banner); 
                      color: var(--text-primary);
                      padding: 8px 12px; 
                      border-radius: 4px; 
                      font-size: 13px;
                      font-weight: 500;
                      z-index: 9999;
                      border: 1px solid var(--border-color);
                      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                  ">
                      Press <kbd>Esc</kbd> to exit keyboard mode
                  </div>
              `);

              $('body').append(`
              <div class="shortcut-summary" style="
                  position: fixed;
                  top: 60px;
                  right: 10px;
                  background: #007bff;
                  color: white;
                  padding: 10px 12px;
                  border-radius: 6px;
                  font-size: 11px;
                  z-index: 9998;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                  font-family: monospace;
              ">
                  <kbd style="background: rgba(255,255,255,0.2);">P</kbd>ass 
                  <kbd style="background: rgba(255,255,255,0.2);">F</kbd>ail 
                  <kbd style="background: rgba(255,255,255,0.2);">C</kbd>lear 
                  <kbd style="background: rgba(255,255,255,0.2);">↑↓</kbd>Nav 
                  <kbd style="background: rgba(255,255,255,0.2);">⏎</kbd>Notes
              </div>
            `);

              setTimeout(() => {
                $('.shortcut-summary').fadeOut(800, function() {
                  $(this).remove();
                });
              }, 5000);
            }            

            function hideKeyboardHint() {
              $('#keyboard-hint').remove();
              $('.shortcut-summary').remove();
              showInitialHint();
            }
    </script>
  </body>
</html>

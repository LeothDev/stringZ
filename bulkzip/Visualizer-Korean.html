<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>StringZ Visualizer - Korean</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <style>
      :root {
        /* Light mode colors */
        --bg-primary: #f8f9fa;
        --bg-secondary: white;
        --bg-banner: #f8f9fa;
        --text-primary: #333;
        --text-secondary: #6c757d;
        --text-muted: #495057;
        --border-color: #dee2e6;
        --table-header-bg: #f8f9fa;
        --table-border: #dee2e6;
        --button-bg: #6c757d;
        --button-hover: #5a6268;
        --input-bg: white;
      }
      
      [data-theme="dark"] {
        /* Dark mode colors */
        --bg-primary: #1a1a1a;
        --bg-secondary: #2d2d2d;
        --bg-banner: #343a40;
        --text-primary: #f8f9fa;
        --text-secondary: #adb5bd;
        --text-muted: #ced4da;
        --border-color: #495057;
        --table-header-bg: #343a40;
        --table-border: #495057;
        --button-bg: #495057;
        --button-hover: #5a6268;
        --input-bg: #343a40;
      }
      
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-primary);
        margin: 0;
        padding: 0;
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      .toggle-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        padding: 8px 16px;
        background-color: var(--button-bg);
        color: white;
        border: 1px solid var(--button-bg);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      .toggle-btn:hover {
        background-color: var(--button-hover);
        border-color: var(--button-hover);
      }
      
      .dark-mode-btn {
        position: fixed;
        top: 15px;
        left: 150px;
        z-index: 9999;
        padding: 8px 16px;
        background-color: var(--button-bg);
        color: white;
        border: 1px solid var(--button-bg);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      .dark-mode-btn:hover {
        background-color: var(--button-hover);
        border-color: var(--button-hover);
      }
      
      #clearState {
        float: left;
        margin-right: 15px;
        margin-bottom: 15px;
        padding: 8px 16px;
        background-color: #dc3545;
        color: white;
        border: 1px solid #dc3545;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      
      #clearState:hover {
        background-color: #c82333;
        border-color: #bd2130;
      }
      
      .container {
        padding: 70px 30px 30px 30px;
        background: var(--bg-secondary);
        margin: 0;
        min-height: 100vh;
        transition: background-color 0.3s ease;
      }
      
      .info-banner {
        background-color: var(--bg-banner);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 20px;
        margin-bottom: 25px;
        border-radius: 4px;
        text-align: center;
        transition: background-color 0.3s ease, border-color 0.3s ease;
      }
      
      .info-banner h2 {
        margin: 0 0 10px 0;
        font-size: 24px;
        font-weight: 600;
        color: var(--text-primary);
      }
      
      .info-banner p {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary);
      }
      
      #myTable {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        overflow: hidden;
        transition: border-color 0.3s ease;
      }
      
      #myTable td {
        user-select: text !important;
        padding: 12px 8px;
        vertical-align: top;
        border-bottom: 1px solid var(--table-border);
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      #myTable th {
        background-color: var(--table-header-bg);
        border-bottom: 2px solid var(--border-color);
        color: var(--text-muted);
        font-weight: 600;
        padding: 15px 8px;
        text-align: center;
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      /* Enhanced styling for different columns */
      #myTable td:first-child {
        text-align: center;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        /*<!-- max-width: 120px; -->*/
        width: 50px;
      }
      
      #myTable td:nth-child(2) {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: var(--text-secondary);
        text-align: left;
        /*line-height: 1.4;*/
        max-width: 120px;
      }

      #myTable td:nth-child(3), #myTable td:nth-child(4) {
        line-height: 1.4;
        max-width: 300px;
        word-wrap: break-word;
        text-align: left;
      }
      
      #myTable td:nth-child(5) {
        text-align: center;
        font-weight: 600;
        color: var(--text-muted);
        font-size: 14px;
        width: 80px;
      }
      
      #myTable td:nth-child(6) {
        min-width: 120px;
        max-width: 150px;
        text-align: center;
      }

      #myTable td:nth-child(7) {
        min-width: 150px;
        max-width: 200px;
      }
      
      select.state-select {
        width: 100%;
        font-weight: 500;
        padding: 6px 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 14px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      input.notes-input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 12px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      input.notes-input:focus {
        outline: none;
        border-color: #80bdff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
      }
      
      input.notes-input::placeholder {
        color: var(--text-secondary);
        font-style: italic;
      }
      
      select.state-select:focus {
        outline: none;
        border-color: #80bdff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
      }
      
      select.state-select.pass {
        color: #28a745;
        border-color: #28a745;
      }
      
      select.state-select.fail {
        color: #dc3545;
        border-color: #dc3545;
      }
      
      /* DataTables styling */
      .dataTables_wrapper {
        color: var(--text-primary);
      }
      
      .dataTables_wrapper .dataTables_length,
      .dataTables_wrapper .dataTables_filter,
      .dataTables_wrapper .dataTables_info,
      .dataTables_wrapper .dataTables_paginate {
        margin: 15px 0;
      }
      
      .dataTables_wrapper .dataTables_filter input {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 12px;
        margin-left: 8px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_length select {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 4px 8px;
        margin: 0 8px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 6px 12px;
        margin: 0 2px;
        background-color: var(--input-bg);
        color: var(--text-primary) !important;
        transition: all 0.3s ease;
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
        background-color: var(--bg-banner);
        border-color: var(--text-secondary);
      }
      
      .dataTables_wrapper .dataTables_paginate .paginate_button.current {
        background-color: #007bff;
        border-color: #007bff;
        color: white !important;
      }

      /* Copy feature styling */
    .copyable-cell {
        cursor: pointer;
        position: relative;
        transition: background-color 0.2s ease;
    }

    .copyable-cell:hover {
        background-color: rgba(0, 123, 255, 0.1) !important;
    }

    .copy-feedback {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #28a745;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .copy-feedback.show {
        opacity: 1;
    }

    .keyboard-focus {
      background-color: rgba(0, 123, 255, 0.08) !important;
      border: 2px solid #007bff !important;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2) !important;
    }

    .keyboard-focus td {
      background-color: rgba(0, 123, 255, 0.05) !important;
    }

    kbd {
      background-color: var(--button-bg);
      color: white;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
    }
    </style>
  </head>

ots in sequence—the resulting number will determine the final amount of Dragon&#x27;s Gold you receive!", "[?]에 대응하는 숫자 3개가 차례로 빈 위치에 채워집니다. 이로 생성되는 숫자로 최종 획득할 드래곤 골드의 수량이 결정됩니다!", "", ""], ["CommonText_mMessage_25773", "Nine-Tailed Nightmare", "아홉 꼬리의 재앙", "", ""], ["CommonText_mMessage_25828", "Locked", "잠김", "", ""], ["CommonText_mMessage_25829", "Invalid", "만료됨", "", ""], ["CommonText_mMessage_25830", "New Recruit", "신규 모집 획득", "", ""], ["CommonText_mMessage_25846", "Officials", "관리자", "", ""], ["CommonText_mMessage_25847", "Guild War Officials Appointment", "길드전 관리자 임명", "", ""], ["CommonText_mMessage_25848", "Rank", "직책", "", ""], ["CommonText_mMessage_25849", "Marshal", "통솔자", "", ""], ["CommonText_mMessage_25850", "Members", "멤버", "", ""], ["CommonText_mMessage_25851", "BP", "전투력", "", ""], ["CommonText_mMessage_25852", "Season&#x27;s Attacks", "시즌 공격 상황", "", ""], ["CommonText_mMessage_25853", "Actions", "조작", "", ""], ["CommonText_mMessage_25854", "Appoint", "임명", "", ""], ["CommonText_mMessage_25855", "Dismiss", "해임", "", ""], ["CommonText_mMessage_25856", "No Access", "권한 없음", "", ""], ["CommonText_mMessage_25857", "All Marshals gain &lt;color=&quot;#e37b00&quot;&gt;{num} extra attack(s) &lt;/color&gt; per Guild War round. Only the Guild Leader and Vice Leaders can appoint a Marshal during the preparation phase. If no appointments are made, this position will be automatically assigned based on members&#x27; contribution and BP.", "모든 통솔자는 길드전에서 1라운드마다 &lt;color=&quot;#e37b00&quot;&gt;추가로 {num}회의 공격 횟수를 획득&lt;/color&gt;할 수 있습니다. 통솔자는 길드장과 부길드장만이 준비 기간에 임명할 수 있으며, 임명되지 않을 경우 기여도와 전투력에 따라 자동 배정됩니다.", "", ""], ["CommonText_mMessage_25858", "Appointed: {num1}/{num2}", "임명 완료: {num1}/{num2}", "", ""], ["CommonText_mMessage_25859", "Appointment successful. Player gains {num} extra attack(s) per round.", "임명이 완료되었습니다. 해당 플레이어는 각 라운드에서 공격 횟수가 {num}회 증가합니다.", "", ""], ["CommonText_mMessage_25860", "Marshal slots are full. Dismiss one to continue.", "통솔자 수가 상한에 도달했습니다. 다른 통솔자를 해임한 후 임명해 주세요.", "", ""], ["CommonText_mMessage_25861", "&lt;color=&quot;#feab53&quot;&gt;Are you sure you want to dismiss this player from the Marshal position?&lt;/color&gt;\\nEach Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "&lt;color=&quot;#feab53&quot;&gt;해당 플레이어의 통솔자 직책을 해임하시겠습니까?&lt;/color&gt;\\n각 길드는 최대 {num1}명의 통솔자를 보유할 수 있으며, 통솔자는 각 라운드에서 공격 횟수가 {num2}회 증가합니다.", "", ""], ["CommonText_mMessage_25862", "Marshal dismissed successfully. Please appoint a new one.", "통솔자 해임이 완료되었습니다. 다른 통솔자를 임명해 주세요.", "", ""], ["CommonText_mMessage_25863", "Guild War Attempts", "길드전 횟수", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "이번 포인트", "", ""], ["CommonText_mMessage_26080", "Prioritize Guild War team.", "길드전의 팀 우선 사용", "", ""], ["CommonText_mMessage_26081", "Playtest mode cannot save battle results or auto-fight.", "게스트 플레이 모드에서는 대전 결과 저장 및 자동 전투 불가", "", ""], ["CommonText_mMessage_60708", "Score Details", "포인트 통계", "", ""], ["Difficulty_mDetail_1100001", "Only heroes from &lt;color=&quot;#e37b00&quot;&gt;The Nightmare Council, The Star Piercers&lt;/color&gt; can challenge this stage.\\nLord Skills of each Faction can only affect up to &lt;color=&quot;#fd4540&quot;&gt;5&lt;/color&gt; heroes.", "&lt;color=&quot;#e37b00&quot;&gt;악몽 의회, 관성의 화살&lt;/color&gt; 진영의 영웅만 사용하여 도전할 수 있는 던전.\\n각 진영의 영주 스킬은 최대 &lt;color=&quot;#fd4540&quot;&gt;5&lt;/color&gt;명의 영웅에게만 효과가 적용된다.", "", ""], ["Difficulty_mDetail_1100003", "Only heroes from &lt;color=&quot;#e37b00&quot;&gt;The Infernal Blast, The North Throne&lt;/color&gt; can challenge this stage.\\nLord Skills of each Faction can only affect up to &lt;color=&quot;#fd4540&quot;&gt;5&lt;/color&gt; heroes.", "&lt;color=&quot;#e37b00&quot;&gt;연옥 폭파, 북쪽 경계 왕좌&lt;/color&gt; 진영의 영웅만 사용하여 도전할 수 있는 던전.\\n각 진영의 영주 스킬은 최대 &lt;color=&quot;#fd4540&quot;&gt;5&lt;/color&gt;명의 영웅에게만 효과가 적용된다.", "", ""], ["Difficulty_mDetail_1100004", "Only heroes from &lt;color=&quot;#e37b00&quot;&g it on the battlefield, prioritizing Defenders.", "필드에 가장 마지막에 배치된 유닛에게 마법 피해를 입히며, 수호자 직업을 우선으로 선택한다.", "", ""], ["Skill_mSkillDesc_803803_1", "Immune to all &lt;color=&quot;#4A9DF2&quot;&gt;CC Effects&lt;/color&gt; (except Slow).", "감속 이외의 모든 &lt;color=&quot;#4A9DF2&quot;&gt;제어 효과&lt;/color&gt;를 면역한다.", "", ""], ["Skill_mSkillDesc_8202053_1", "Reduces the Redeployment Time of allied heroes by &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt;, but increases their Deployment Cost by &lt;color=&quot;#4A9DF2&quot;&gt;+{sk2}&lt;/color&gt;.", "아군 영웅의 재배치 시간이 &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt; 감소하지만, 출전 비용이 &lt;color=&quot;#4A9DF2&quot;&gt;{sk2} 증가&lt;/color&gt;한다.", "", ""], ["Skill_mSkillDesc_8202084_1", "Increases allied heroes&#x27; DMG by &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt; each round and reduces Basic ATK interval by &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt;. Vulnerability (P. DMG) and Vulnerability (M. DMG) increase by &lt;color=&quot;#4A9DF2&quot;&gt;{sk2}%&lt;/color&gt; each round.", "아군 영웅이 적에게 입히는 피해가 매 라운드마다 &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt; 상승하며, 일반 공격의 간격이 &lt;color=&quot;#4A9DF2&quot;&gt;{sk1}%&lt;/color&gt; 감소한다. 동시에 물리 취약 및 마법 취약도 매 라운드마다 &lt;color=&quot;#4A9DF2&quot;&gt;{sk2}%&lt;/color&gt; 상승한다.", "", ""], ["Skill_mSkillDesc_8202103_1", "Allied Hero Deployment Limit +&lt;color=&quot;#4A9DF2&quot;&gt;{sk1}&lt;/color&gt;", "아군이 배치 가능한 영웅 수량이 &lt;color=&quot;#4A9DF2&quot;&gt;{sk1} 증가&lt;/color&gt;한다.", "", ""], ["Skill_mSkillName_1033701_1", "Accelerated Incubation", "급속 부화", "", ""], ["Skill_mSkillName_3991865_1", "High Quality", "고급", "", ""], ["Skill_mSkillName_803610_1", "Freeze", "빙결", "", ""], ["Skill_mSkillName_803801_1", "Frostbite Strike", "서리침식의 일격", "", ""], ["Skill_mSkillName_803803_1", "Control Immunity", "제어 면역", "", ""], ["Skill_mSkillName_804001_1", "Frostbite Rupture", "서리침식의 폭발", "", ""], ["Skill_mSkillName_8202053_1", "Time VS Money", "대가의 계약", "", ""], ["Skill_mSki ; DMG by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; each round and reduces Basic ATK Interval by &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt;. Vulnerability (P. DMG) and Vulnerability (M. DMG) increase by &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; each round.", "아군 영웅이 적에게 입히는 피해가 매 라운드마다 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; 상승하며, 일반 공격의 간격이 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1}%&lt;/color&gt; 감소한다. 동시에 물리 취약 및 마법 취약도 매 라운드마다 &lt;color=&quot;#4A9DF2&quot;&gt;{skm2}%&lt;/color&gt; 상승한다.", "", ""], ["Skill_mSkillSimpleDesc_8202103_1", "Allied Hero Deployment Limit +&lt;color=&quot;#4A9DF2&quot;&gt;{skm1}&lt;/color&gt;", "아군이 배치 가능한 영웅 수량이 &lt;color=&quot;#4A9DF2&quot;&gt;{skm1} 증가&lt;/color&gt;한다.", "", ""], ["Skill_mSkillSimpleDesc_8203031_1", "Hotspot appears on both players&#x27; battlefields. Heroes standing on the Hotspot have all attributes increased by 20%.", "양측 플레이어의 전장에 증폭 진지가 나타난다. 이 증폭 진지에 출전된 영웅은 모든 속성이 20% 상승한다.", "", ""], ["Stage_mStageDesc_5003001", "In this epic battle, you will face an unprecedented enemy - Semrah. Hailing from ancient times, Semrah fights in 3 Battle Modes, each posing a tough challenge.", "이 장대한 전투에서는 이제껏 경험해 보지 못한 적인 세멜라를 마주하게 될 것입니다. 고대의 세멜라는 3가지 전투 모드가 존재하며, 모두 극도로 어려운 도전이 될 것입니다.", "", ""], ["Stage_mStageDesc_5003002", "In this epic battle, you will face an unprecedented enemy - Semrah. Hailing from ancient times, Semrah fights in 3 Battle Modes, each posing a tough challenge.", "이 장대한 전투에서는 이제껏 경험해 보지 못한 적인 세멜라를 마주하게 될 것입니다. 고대의 세멜라는 3가지 전투 모드가 존재하며, 모두 극도로 어려운 도전이 될 것입니다.", "", ""], ["Stage_mStageDesc_8101001", "Starting from Round 5, &lt;color=&quot;#fd4540&quot;&gt;all monsters gain Invisibility and become untargetable&lt;/color&gt; for 7 sec.", "라운드5 시작 시, 7초 동안 &lt;color=&quot;#fd4540&quot;&gt;모든 몬스터가 은신 효과를 획득하여, 대상으로 선택되지 않는다&lt;/color&gt;.", "", ""], ["Stage_mStageDesc_8101002", "Starting from Round 5, &lt;color=&quot;#fd4540&quot;&gt;all monsters gain Invincibility upon taking DMG for the first time, becoming immune to all DMG&lt;/color&gt; for 4 sec.", "라운드5 시작 시, 4초 동안 &lt;color=&quot;#fd4540&quot;&gt;모든 몬스터가 처음으로 피해를 받은 후 무적 효과를 획득하여, 모든 피해를 면역한다&lt;/color&gt;.", "", ""], ["Stage_mStageDesc_8101003", "Starting from Round 5, &lt;color=&quot;#fd4540&quot;&gt;all heroes continuously take True DMG equal to 4% of their Max HP per sec&lt;/color&gt;.", "라운드5 시작 시, &lt;color=&quot;#fd4540&quot;&gt;모든 영웅이 초당 최대 HP의 4%에 해당하는 고정 피해를 지속적으로 받는다&lt;/color&gt;.", "", ""], ["Stage_mStageDesc_8201011", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "친구들과 함께 적군 보스를 처치하고, 파도처럼 밀려오는 적들을 막아보세요.", "", ""], ["Stage_mStageDesc_8201012", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "친구들과 함께 적군 보스를 처치하고, 파도처럼 밀려오는 적들을 막아보세요.", "", ""], ["Stage_mStageDesc_8201013", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "친구들과 함께 적군 보스를 처치하고, 파도처럼 밀려오는 적들을 막아보세요.", "", ""], ["Stage_mStageDesc_8201014", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "친구들과 함께 적군 보스를 처치하고, 파도처럼 밀려오는 적들을 막아보세요.", "", ""], ["Stage_mStageDesc_8201015", "Team up with your friends to defeat the enemy Boss and fend off the tides of enemies.", "친구들과 함께 적군 보스를 처치하고, 파도처럼 밀려오는 적들을 막아보세요.", "", ""], ["Stage_mStageFailDesc_5003001", "Pay extra attention to Semrah&#x27;s Battle Mode and exploit its weakness.", "세멜라의 전투 모드에 주의해 보세요. 각 모드는 돌파할 수 있는 약점이 존재합니다.", "", ""], ["Stage_mStageFailDesc_5003002", "Pay extra attention to Semrah&#x27;s Battle Mode and exploit its weakness.", "세멜라의 전투 모드에 주의해 보세요. 각 모드는 돌파할 수 있는 약점이 존재합니다.", "", ""], ["Stage_mStageIdDesc_5003001", "Apocalypse I - Playtest", "종말 I-게스트 플레이", "", ""], ["Stage_mStageIdDesc_5003002", "Apocalypse II - Playtest", "종말 II-게스트 플레이", "", ""], ["Stage_mStageIdDesc_8201011", "Stage 1", "스테이지 1", "", ""], ["Stage_mStageIdDesc_8201012", "Stage 2", "스테이지 2", "", ""], ["St 7", "Small spiders, very aggressive but weak individually.", "소형 거미. 공격 욕구는 강하지만 개체 실력이 약하다.", "", ""], ["Unit_mDescribe_37108", "Toxic Suicides will explode when approaching enemies, &lt;color=#ff4500&gt;dealing moderate AoE DMG and poisoning them&lt;/color&gt;.", "맹독 폭발충은 적에게 다가가 자폭하여 &lt;color=#ff4500&gt;소량의 범위 피해를 입히고 적을 중독시킨다&lt;/color&gt;.", "", ""], ["Unit_mDescribe_37110", "Clad in giant shields and possessing unyielding skeletal frames, they are renowned for their exceptional DEF.", "거대한 방패를 들고 있는 스켈레톤 병사. 방어 능력이 매우 강하다.", "", ""], ["Unit_mDescribe_37112", "Produces a Queen Spider when left out of combat for a while. Eliminate it before it hatches.", "일정 시간 후 스파이더 퀸이 부화하므로, 부화하기 전에 처치해야 한다.", "", ""], ["Unit_mFeature_10408", "Ludwig has been reborn from the abyss. With a horrifying power granted by his master - the Eldritch God. Ludwig has now lost his humanity.", "루드비히는 심연에서 새로운 삶은 맞이했고, 그의 주인은 무서운 사탄의 힘을 부여했다. 지금의 루드비히는 인간성을 완전히 상실한 괴물이다.", "", ""], ["Unit_mFeature_10409", "Ludwig has been reborn from the abyss. With a horrifying power granted by his master - the Eldritch God. Ludwig has now lost his humanity.", "루드비히는 심연에서 새로운 삶은 맞이했고, 그의 주인은 무서운 사탄의 힘을 부여했다. 지금의 루드비히는 인간성을 완전히 상실한 괴물이다.", "", ""], ["Unit_mFeature_10410", "Ludwig has been reborn from the abyss. With a horrifying power granted by his master - the Eldritch God. Ludwig has now lost his humanity.", "루드비히는 심연에서 새로운 삶은 맞이했고, 그의 주인은 무서운 사탄의 힘을 부여했다. 지금의 루드비히는 인간성을 완전히 상실한 괴물이다.", "", ""], ["Unit_mFeature_37105", "Scalekin mages, adept in the art of poisonous magic, possess the ability to inflict continuous Poison DMG on enemies.", "맹독 마법을 다루는 스케일킨 마법사. 적에게 지속적인 독성 피해를 입힌다.", "", ""], ["Unit_mFeature_37106", "Elite Skeleton Archers that can deal massive DMG from afar.", "정예 스켈레톤 궁수. 비교적 높은 원거리 피해를 입힌다.", "", ""], ["Unit_mFeature_37107", "Small spiders, very aggressive but weak individually.", "소형 거미. 공격 욕구는 강하지만 개체 실력이 약하다.", "", ""], ["Unit_mFeature_37108", "The inferior zraks, whose bodies are Spear! Don&#x27;t miss out!", "조각을 모아 나타 전용 아티팩트 「화첨창」을 합성하세요! 마지막 기회를 놓치지 마세요!", "", ""], ["LANG_STRID_notice_CreativeShort", "Creative Short", "창의 단편극", "", ""], ["LANG_STRID_compete_brief", "After the event starts, Commanders earn League points by participating in the Arena, Guild - Drake&#x27;s Chasm and spending Stamina and can claim Personal Score Rewards. Commanders within the same League compete against each other for ranking rewards. After the event ends, Commanders who have earned points can claim the Basic League Rewards. Members of the League with a higher total score will receive additional Champion League Reward.", "이벤트 시작 후 지휘관님은 아레나 참여, 길드-드래곤 유적, 체력 소모 등을 통해 연맹 포인트를 획득하여 개인 포인트 보상을 수령할 수 있습니다. 동시에 연맹 내 지휘관님들은 서로 경쟁하여 랭킹 보상을 획득하게 됩니다. 이벤트 종료 후 포인트를 획득한 지휘관님은 기본 연맹 보상을 수령할 수 있으며, 총 포인트가 더 높은 연맹 멤버는 연맹 승리 보상을 추가로 받을 수 있습니다.", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Des_01", "Discount Tokens obtained from event quests can be used to randomly discount an item on the event page once. Each item can be discounted up to 3 times.", "이벤트 퀘스트에서 획득한 할인 코인을 사용하면 이벤트 페이지 내 상품에 무작위로 1회 할인이 적용되며, 각 상품은 최대 3회까지 할인받을 수 있습니다.", "", ""], ["LANG_STRID_FishingRanking", "&lt;color=#e1e1e1&gt;After the event ends, the top 3 Commanders on the leaderboard will each receive a physical merchandise reward. Contact info will be requested via in-game mail for delivery.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;이벤트 종료 후 랭킹 TOP 3 지휘관님께는 실물 굿즈 보상을 각각 지급하며, 추후 게임 내 우편을 통해 주소 기입 관련 연락을 드릴 예정입니다.&lt;/color&gt;", "", ""], ["LANG_STRID_notice_nzgl", "Hero Gameplay: Ne Zha", "영웅 콘텐츠: 나타", "", ""], ["LANG_STRID_notice_yjgl", "Hero Gameplay: Erlang Shen", "영웅 콘텐츠: 이랑신", "", ""], ["LANG_STRID_GDP_title_26", "Celestial Season", "환천 시즌", "", ""], ["LANG_STRID_activity_popup_GDP_htj", "Gold Dragon Pass - Celestial Season", "골드 드래곤 패스-환천 시즌", "", ""], ["LANG_STRID_CompeteEvent_Rule11", "&lt;color=#e1e1e1&gt;Consume general items to gain points.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;통용 아이템을 소모하여 포인트 획득&lt;/color&gt;", "", ""], ["LANG_STRID_CompeteEvent_Rule12", "&lt;color=#e1e1e1&gt;Consume Mythril and Meteorite to gain points.&lt;/color&gt;", "&lt;color=#e1e1e1&gt;미스릴, 운석을 소모하여 포인트 획득&lt;/color&gt;", "", ""], ["LANG_STRID_Moon_Dec_01", "Shadows of Tomorrow", "몽롱한 달의 쌍화", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Detail", "&lt;color=&quot;#cec2b1&quot;&gt;Discount Event&lt;/color&gt;\\nEach use of a Discount Token will apply a &lt;color=&quot;#28d37c&quot;&gt;random discount&lt;/color&gt; to a random item in the event. Participate in event quests to obtain Discount Tokens. All unused Discount Tokens will be removed after the event ends.\\nPlayers may choose to purchase event items at their original prices without using any Discount Tokens.\\n\\nEach time a Discount Token is used, one item will be randomly selected from the three available in the event interface for a discount. After each discount, the price of the currently selected item will be further reduced. &lt;color=&quot;#28d37c&quot;&gt;Each item reaches its maximum discount after being discounted 3 times&lt;/color&gt;.\\nOnly items that have not reached the maximum discount and have not been purchased can continue to participate in the discount event.", "&lt;color=&quot;#cec2b1&quot;&gt;할인 이벤트&lt;/color&gt;\\n할인 코인을 사용할 때마다 이벤트 내 상품에 &lt;color=&quot;#28d37c&quot;&gt;무작위 할인&lt;/color&gt;이 적용됩니다. 이벤트 퀘스트에 참여하면 이벤트 할인 코인을 획득할 수 있으며, 각 기간의 이벤트 할인 코인은 이벤트 종료 후 삭제됩니다.\\n플레이어는 할인 코인을 사용하지 않고 원가로 이벤트 상품을 구매할 수 있습니다.\\n\\n할인 코인을 사용할 때마다 이벤트 화면의 3개 상품 중 1개가 무작위로 선택되어 할인됩니다. 할인을 적용할 때마다 현재 선택된 상품의 가격이 더 낮아지며, &lt;color=&quot;#28d37c&quot;&gt;각 상품은 3회 할인 후 최대 할인에 도달합니다&lt;/color&gt;.\\n최대 할인에 도달하지 않았고 구매되지 않은 상품만 계속 할인에 참여할 수 있습니다.", "", ""]];

25861", "<span style=\"color: #feab53;\">Are you sure you want to dismiss this player from the Marshal position?</span><br>Each Guild can have up to {num1} Marshals, each gaining {num2} extra attack(s) per round.", "<span style=\"color: #feab53;\">해당 플레이어의 통솔자 직책을 해임하시겠습니까?</span><br>각 길드는 최대 {num1}명의 통솔자를 보유할 수 있으며, 통솔자는 각 라운드에서 공격 횟수가 {num2}회 증가합니다.", "", ""], ["CommonText_mMessage_25862", "Marshal dismissed successfully. Please appoint a new one.", "통솔자 해임이 완료되었습니다. 다른 통솔자를 임명해 주세요.", "", ""], ["CommonText_mMessage_25863", "Guild War Attempts", "길드전 횟수", "", ""], ["CommonText_mMessage_25931", "Points of the Round", "이번 포인트", "", ""], ["CommonText_mMessage_26080", "Prioritize Guild War team.", "길드전의 팀 우선 사용", "", ""], ["CommonText_mMessage_26081", "Playtest mode cannot save battle results or auto-fight.", "게스트 플레이 모드에서는 대전 결과 저장 및 자동 전투 불가", "", ""], ["CommonText_mMessage_60708", "Score Details", "포인트 통계", "", ""], ["Difficulty_mDetail_1100001", "Only heroes from <span style=\"color: #e37b00;\">The Nightmare Council, The Star Piercers</span> can challenge this stage.<br>Lord Skills of each Faction can only affect up to <span style=\"color: #fd4540;\">5</span> heroes.", "<span style=\"color: #e37b00;\">악몽 의회, 관성의 화살</span> 진영의 영웅만 사용하여 도전할 수 있는 던전.<br>각 진영의 영주 스킬은 최대 <span style=\"color: #fd4540;\">5</span>명의 영웅에게만 효과가 적용된다.", "", ""], ["Difficulty_mDetail_1100003", "Only heroes from <span style=\"color: #e37b00;\">The Infernal Blast, The North Throne</span> can challenge this stage.<br>Lord Skills of each Faction can only affect up to <span style=\"color: #fd4540;\">5</span> heroes.", "<span style=\"color: #e37b00;\">연옥 폭파, 북쪽 경계 왕좌</span> 진영의 영웅만 사용하여 도전할 수 있는 던전.<br>각 진영의 영주 스킬은 최대 <span style=\"color: #fd4540;\">5</span>명의 영웅에게만 효과가 적용된다.", "", ""], ["Difficulty_mDetail_1100004", "Only heroes from <span style=\"color: #e37b00;\">The Esoteria Order, The Chaos Dominion, and The Supreme Arbiters</span> can challenge this stage.<br>Lord Skills of each Faction can o 4A9DF2;\">+{sk2}</span>.", "아군 영웅의 재배치 시간이 <span style=\"color: #4A9DF2;\">{sk1}%</span> 감소하지만, 출전 비용이 <span style=\"color: #4A9DF2;\">{sk2} 증가</span>한다.", "", ""], ["Skill_mSkillDesc_8202084_1", "Increases allied heroes' DMG by <span style=\"color: #4A9DF2;\">{sk1}%</span> each round and reduces Basic ATK interval by <span style=\"color: #4A9DF2;\">{sk1}%</span>. Vulnerability (P. DMG) and Vulnerability (M. DMG) increase by <span style=\"color: #4A9DF2;\">{sk2}%</span> each round.", "아군 영웅이 적에게 입히는 피해가 매 라운드마다 <span style=\"color: #4A9DF2;\">{sk1}%</span> 상승하며, 일반 공격의 간격이 <span style=\"color: #4A9DF2;\">{sk1}%</span> 감소한다. 동시에 물리 취약 및 마법 취약도 매 라운드마다 <span style=\"color: #4A9DF2;\">{sk2}%</span> 상승한다.", "", ""], ["Skill_mSkillDesc_8202103_1", "Allied Hero Deployment Limit +<span style=\"color: #4A9DF2;\">{sk1}</span>", "아군이 배치 가능한 영웅 수량이 <span style=\"color: #4A9DF2;\">{sk1} 증가</span>한다.", "", ""], ["Skill_mSkillName_1033701_1", "Accelerated Incubation", "급속 부화", "", ""], ["Skill_mSkillName_3991865_1", "High Quality", "고급", "", ""], ["Skill_mSkillName_803610_1", "Freeze", "빙결", "", ""], ["Skill_mSkillName_803801_1", "Frostbite Strike", "서리침식의 일격", "", ""], ["Skill_mSkillName_803803_1", "Control Immunity", "제어 면역", "", ""], ["Skill_mSkillName_804001_1", "Frostbite Rupture", "서리침식의 폭발", "", ""], ["Skill_mSkillName_8202053_1", "Time VS Money", "대가의 계약", "", ""], ["Skill_mSkillName_8202084_1", "Heating Up", "격전 지속", "", ""], ["Skill_mSkillName_8202103_1", "Rigged Arena", "강군압경", "", ""], ["Skill_mSkillSimpleDesc_11015501_1", "Increases ATK by <span style=\"color: #4A9DF2;\">{skm1}%</span>, and reduces the number of attacks required to trigger Nature's Fury enhanced attack by <span style=\"color: #4A9DF2;\">{skm2}</span>. When in Berserker Stance, Basic ATK restores <span style=\"color: #4A9DF2;\">{skm3}%</span> Max HP, and triggering Ground Stomp restores <span style=\"color: #4A9DF2;\">{skm4}%</span> Max HP.", "공격력이 <span style=\"color: #4A9DF2;\">{skm1}%</span> 상승한다. 사르얀의 전투 도전 오픈", "", ""], ["LANG_STRID_push_long9_title_2", "Commanders can challenge Sauryan, Wing of Chaos infinitely every day. Rewards are based on the highest total damage dealt in a single challenge attempt.", "지휘관들은 【혼돈의 힘·사르얀】을 무제한으로 도전할 수 있으며, 매일 단일 최고 피해에 따라 각종 귀중한 보상을 획득할 수 있습니다.", "", ""], ["LANG_STRID_push_xyx_title_1", "Zombie Invasion Starts!", "좀비 포위 완료! 이벤트 오픈", "", ""], ["LANG_STRID_push_xyx_title_2", "Build your hero's skills, equip powerful Relics, and battle through waves of monsters to survive!", "영웅 스킬을 구축하고, 적합한 유물을 선택하여 습격하는 몬스터를 격퇴하고 끝까지 생존하세요!", "", ""], ["LANG_STRID_notice_jwhpv", "Event Trailer: Nine-Tailed Nightmare", "아홉 꼬리의 재앙 이벤트 트레일러", "", ""], ["LANG_STRID_push_jwhyy1", "Nine-Tailed Nightmare Is Here!", "아홉 꼬리의 재앙 이벤트 출현!", "", ""], ["LANG_STRID_push_jwhyy2", "The new Legendary heroes Ne Zha and Erlang Shen arrive! Join the events to claim event-exclusive rewards, including Exclusive Artifacts, Summoning Crystals, Avatar, Emote, and more! Plus, Erlang Shen's time-limited skin is now available!", "신규 레전더리 영웅 「나타」「이랑신」 등장! 시리즈 이벤트에 참여하여 전용 아티팩트, 각종 소환 수정, 아바타, 이모티콘 등 이벤트 한정 보상을 수령하세요. 이랑신 스킨도 한정 출시!", "", ""], ["LANG_STRID_notice_NineTailed2", "Nine-Tailed Nightmare Starts!", "아홉 꼬리의 재앙 이벤트 오픈", "", ""], ["LANG_STRID_notice_NineTailed3", "Join the event to obtain event-exclusive rewards, including Exclusive Artifacts, Avatar, Avatar Border, Summoning Crystals, and more!", "이벤트에 참여하여 전용 아티팩트, 아바타, 프레임 등 이벤트 한정 보상과 각종 소환 수정 등의 보상을 획득하세요!", "", ""], ["LANG_STRID_push_shardsummon_nezha", "Collect shards to assemble Ne Zha's Exclusive Artifact: Fire-Tipped Spear!", "조각을 모아 나타 전용 아티팩트 「화첨창」을 합성하세요!", "", ""], ["LANG_STRID_push_shardsummon_sqhcending", "Artifact Shard Assembly Countdown", "아티팩트 조각 합성 카운트다운", "", ""], ["LANG_STRID_push_shardsummon_nezhaend2", "Last chance to collect shards and assemble Ne Zha's Exclusive Artifact: Fire-Tipped Spear! Don't miss out!", "조각을 모아 나타 전용 아티팩트 「화첨창」을 합성하세요! 마지막 기회를 놓치지 마세요!", "", ""], ["LANG_STRID_notice_CreativeShort", "Creative Short", "창의 단편극", "", ""], ["LANG_STRID_compete_brief", "After the event starts, Commanders earn League points by participating in the Arena, Guild - Drake's Chasm and spending Stamina and can claim Personal Score Rewards. Commanders within the same League compete against each other for ranking rewards. After the event ends, Commanders who have earned points can claim the Basic League Rewards. Members of the League with a higher total score will receive additional Champion League Reward.", "이벤트 시작 후 지휘관님은 아레나 참여, 길드-드래곤 유적, 체력 소모 등을 통해 연맹 포인트를 획득하여 개인 포인트 보상을 수령할 수 있습니다. 동시에 연맹 내 지휘관님들은 서로 경쟁하여 랭킹 보상을 획득하게 됩니다. 이벤트 종료 후 포인트를 획득한 지휘관님은 기본 연맹 보상을 수령할 수 있으며, 총 포인트가 더 높은 연맹 멤버는 연맹 승리 보상을 추가로 받을 수 있습니다.", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Des_01", "Discount Tokens obtained from event quests can be used to randomly discount an item on the event page once. Each item can be discounted up to 3 times.", "이벤트 퀘스트에서 획득한 할인 코인을 사용하면 이벤트 페이지 내 상품에 무작위로 1회 할인이 적용되며, 각 상품은 최대 3회까지 할인받을 수 있습니다.", "", ""], ["LANG_STRID_FishingRanking", "<color=#e1e1e1>After the event ends, the top 3 Commanders on the leaderboard will each receive a physical merchandise reward. Contact info will be requested via in-game mail for delivery.</color>", "<color=#e1e1e1>이벤트 종료 후 랭킹 TOP 3 지휘관님께는 실물 굿즈 보상을 각각 지급하며, 추후 게임 내 우편을 통해 주소 기입 관련 연락을 드릴 예정입니다.</color>", "", ""], ["LANG_STRID_notice_nzgl", "Hero Gameplay: Ne Zha", "영웅 콘텐츠: 나타", "", ""], ["LANG_STRID_notice_yjgl", "Hero Gameplay: Erlang Shen", "영웅 콘텐츠: 이랑신", "", ""], ["LANG_STRID_GDP_title_26", "Celestial Season", "환천 시즌", "", ""], ["LANG_STRID_activity_popup_GDP_htj", "Gold Dragon Pass - Celestial Season", "골드 드래곤 패스-환천 시즌", "", ""], ["LANG_STRID_CompeteEvent_Rule11", "<color=#e1e1e1>Consume general items to gain points.</color>", "<color=#e1e1e1>통용 아이템을 소모하여 포인트 획득</color>", "", ""], ["LANG_STRID_CompeteEvent_Rule12", "<color=#e1e1e1>Consume Mythril and Meteorite to gain points.</color>", "<color=#e1e1e1>미스릴, 운석을 소모하여 포인트 획득</color>", "", ""], ["LANG_STRID_Moon_Dec_01", "Shadows of Tomorrow", "몽롱한 달의 쌍화", "", ""], ["LANG_STRID_Anniversary_Discount_Event_Detail", "<span style=\"color: #cec2b1;\">Discount Event</span><br>Each use of a Discount Token will apply a <span style=\"color: #28d37c;\">random discount</span> to a random item in the event. Participate in event quests to obtain Discount Tokens. All unused Discount Tokens will be removed after the event ends.<br>Players may choose to purchase event items at their original prices without using any Discount Tokens.<br><br>Each time a Discount Token is used, one item will be randomly selected from the three available in the event interface for a discount. After each discount, the price of the currently selected item will be further reduced. <span style=\"color: #28d37c;\">Each item reaches its maximum discount after being discounted 3 times</span>.<br>Only items that have not reached the maximum discount and have not been purchased can continue to participate in the discount event.", "<span style=\"color: #cec2b1;\">할인 이벤트</span><br>할인 코인을 사용할 때마다 이벤트 내 상품에 <span style=\"color: #28d37c;\">무작위 할인</span>이 적용됩니다. 이벤트 퀘스트에 참여하면 이벤트 할인 코인을 획득할 수 있으며, 각 기간의 이벤트 할인 코인은 이벤트 종료 후 삭제됩니다.<br>플레이어는 할인 코인을 사용하지 않고 원가로 이벤트 상품을 구매할 수 있습니다.<br><br>할인 코인을 사용할 때마다 이벤트 화면의 3개 상품 중 1개가 무작위로 선택되어 할인됩니다. 할인을 적용할 때마다 현재 선택된 상품의 가격이 더 낮아지며, <span style=\"color: #28d37c;\">각 상품은 3회 할인 후 최대 할인에 도달합니다</span>.<br>최대 할인에 도달하지 않았고 구매되지 않은 상품만 계속 할인에 참여할 수 있습니다.", "", ""]];
            let showingRaw = false;

            function getStateKey(index) {
                return "state_StringZ Visualizer - Korean_row_" + index; 
            }
            
            function getNotesKey(index) {
                return "notes_StringZ Visualizer - Korean_row_" + index;
            }
        
            function generateRowWithState(row, idx) {
                const savedState = localStorage.getItem(getStateKey(idx)) || "";
                const savedNotes = localStorage.getItem(getNotesKey(idx)) || "";
                
                const selectHTML = '<select class="state-select ' + savedState.toLowerCase() + '">' +
                    '<option value="" ' + (savedState === "" ? "selected" : "") + '></option>' +
                    '<option value="Pass" ' + (savedState === "Pass" ? "selected" : "") + '>Pass</option>' +
                    '<option value="Fail" ' + (savedState === "Fail" ? "selected" : "") + '>Fail</option>' +
                    '</select>';
                
                const notesHTML = '<input type="text" class="notes-input" value="' + 
                    savedNotes.replace(/"/g, '&quot;') + 
                    '" placeholder="Personal notes..." maxlength="200">';
                
                const newRow = row.slice();
                const stateIndex = headers.indexOf("State") + 1;
                const notesIndex = headers.indexOf("Notes") + 1;
                newRow[stateIndex] = selectHTML;
                newRow[notesIndex] = notesHTML;
                return newRow;
            }
        
            function renderData(data) {
                tableData = data;
                const transformed = data.map((row, idx) => {
                  const rowWithNumber = [idx + 1, ...row];
                  return generateRowWithState(rowWithNumber, idx);
                });
        
                if (!dataTable) {
                    const columnsWithNumber = [{ title: '#' }, ...headers.map(h => ({ title: h }))];
                    dataTable = $('#myTable').DataTable({
                        data: transformed,
                        columns: columnsWithNumber,
                        scrollX: true,
                        paging: true,
                        searching: true,
                        ordering: true,
                        deferRender: true,
                        lengthMenu: [[-1, 10, 25, 50], ["All", 10, 25, 50]],
                        order: [],
                        columnDefs: [
                            {
                                targets: headers.indexOf("State"),
                                orderable: true
                            }
                        ]
                    });
        
                    $('#myTable tbody').on('change', 'select.state-select', function () {
                        const rowIdx = dataTable.row($(this).closest('tr')).index();
                        const value = $(this).val();
                        localStorage.setItem(getStateKey(rowIdx), value);
                        this.className = "state-select " + value.toLowerCase();
                    });
                    
                    $('#myTable tbody').on('input', 'input.notes-input', function () {
                        const rowIdx = dataTable.row($(this).closest('tr')).index();
                        const value = $(this).val();
                        localStorage.setItem(getNotesKey(rowIdx), value);
                    });

                    $('#myTable tbody').on('keydown', 'input.notes-input', function(e) {
                      if (e.key === 'Enter') {
                        e.preventDefault();
                        $(this).blur(); // Remove focus from notes
                      }
                    });
                } else {
                    const currentPage = dataTable.page();
                    const currentLength = dataTable.page.len();
                    dataTable.clear().rows.add(transformed).draw(false);
                    dataTable.page.len(currentLength).draw();
                    dataTable.page(currentPage).draw(false);
                }
            }
        
            function toggleData() {
                showingRaw = !showingRaw;
                renderData(showingRaw ? rawData : formattedData);
                
                // Update button text
                const btn = document.querySelector('.toggle-btn');
                btn.textContent = showingRaw ? 'Show Formatted' : 'Show Raw';
            }
        
            function clearAllStates() {
                const total = tableData.length;
                let clearedCount = 0;
                
                for (let i = 0; i < total; i++) {
                    const stateKey = getStateKey(i);
                    const notesKey = getNotesKey(i);
                    
                    if (localStorage.getItem(stateKey)) {
                        localStorage.removeItem(stateKey);
                        clearedCount++;
                    }
                    if (localStorage.getItem(notesKey)) {
                        localStorage.removeItem(notesKey);
                    }
                }
                
                renderData(tableData);
                
                // Better user feedback
                if (clearedCount > 0) {
                    alert(`✅ Cleared ${clearedCount} review states and all notes!`);
                } else {
                    alert('ℹ️ No review states to clear.');
                }
            }
        
            function getProgress() {
                const total = tableData.length;
                let reviewed = 0;
                let passed = 0;
                let failed = 0;
                
                for (let i = 0; i < total; i++) {
                    const state = localStorage.getItem(getStateKey(i));
                    if (state) {
                        reviewed++;
                        if (state === 'Pass') passed++;
                        if (state === 'Fail') failed++;
                    }
                }
                
                return { total, reviewed, passed, failed };
            }
            
            function updateProgressDisplay() {
                const progress = getProgress();
                const percentage = Math.round((progress.reviewed / progress.total) * 100);
                
                // Update the info banner with progress
                const banner = document.querySelector('.info-banner p');
                if (banner) {
                    const originalText = banner.textContent.split('•')[0] + '•';
                    banner.innerHTML = `${originalText} 📊 <strong>${progress.reviewed}/${progress.total}</strong> reviewed (<strong>${percentage}%</strong>) • ✅ <strong>${progress.passed}</strong> passed • ❌ <strong>${progress.failed}</strong> failed`;
                }
            }
        
            function toggleDarkMode() {
                const body = document.body;
                const btn = document.querySelector('.dark-mode-btn');
                const isDark = body.getAttribute('data-theme') === 'dark';
                
                if (isDark) {
                    body.removeAttribute('data-theme');
                    btn.textContent = '🌙 Dark';
                    localStorage.setItem('visualizer-theme', 'light');
                } else {
                    body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light'; 
                    localStorage.setItem('visualizer-theme', 'dark');
                }
            }
            
            function initializeTheme() {
                const savedTheme = localStorage.getItem('visualizer-theme');
                const btn = document.querySelector('.dark-mode-btn');
                
                if (savedTheme === 'dark') {
                    document.body.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️ Light';
                } else {
                    btn.textContent = '🌙 Dark';
                }
            }

            // New copyToClipboard function to copy ONLY the rawText
            // Can be updated to copy depending on the Formatting/Raw toggle
            function copyToClipboard(text, element) {
                const rowIndex = dataTable.row(element).index();
                const cellIndex = $(element).index();

                let rawText = text;
                if (!showingRaw && rawData[rowIndex]) {
                    rawText = rawData[rowIndex][cellIndex - 1];
                }
    
                // Decode HTML entities to get original text
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = rawText;
                const decodedText = tempDiv.textContent || tempDiv.innerText || rawText;

                navigator.clipboard.writeText(decodedText).then(() => {
                    // Show feedback
                    const feedback = document.createElement('div');
                    feedback.className = 'copy-feedback show';
                    feedback.textContent = 'Copied!';
                    element.style.position = 'relative';
                    element.appendChild(feedback);

                    setTimeout(() => {
                        feedback.classList.remove('show');
                        setTimeout(() => {
                            if (feedback.parentNode) {
                                feedback.parentNode.removeChild(feedback);
                            }
                            $(element).removeClass('copyable-cell');
                        }, 300);
                    }, 1000);
                });
            }        

            $(document).ready(function () {
              initializeTheme();
              renderData(formattedData);
              $('#clearState').click(clearAllStates);
  
              // Update progress on page load
              updateProgressDisplay();
  
              // Update progress when states change
              $('#myTable tbody').on('change', 'select.state-select', function () {
                  setTimeout(updateProgressDisplay, 100);
              });

              $('#myTable tbody').on('mouseenter', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                $(this).addClass('copyable-cell');
              }).on('mouseleave', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                if (!$(this).find('.copy-feedback').length) {
                  $(this).removeClass('copyable-cell');
                }
              }).on('click', 'td:nth-child(2), td:nth-child(3), td:nth-child(4)', function() {
                const text = $(this).text().trim();
                if (text) {
                  copyToClipboard(text, this);
                }
              });

              // Initialize keyboard navigation and show initial hint
              initKeyboardNavigation();
              showInitialHint();
            });

            // Keyboard shortcuts
            let currentRowIndex = 0;
            let isKeyboardMode = false;

            function initKeyboardNavigation() {
              $(document).keydown(function(e) {
                // Important, don't interfere when typing in inputs
                if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;

                // Even more important! DO NOT INTERFERE WITH BROWSER SHORTCUTS
                if (e.ctrlKey || e.metaKey || e.altKey) return;

                // Don't interfere with Fn keys either
                if (e.key.startsWith('F') && e.key.length > 1) return;

                const table = $('#myTable').DataTable();
                const totalRows = table.rows().count();

                switch(e.key.toLowerCase()) {
                  case 'p':
                    e.preventDefault();
                    markCurrentRow('Pass');
                    break;
                  case 'f':
                    e.preventDefault();
                    markCurrentRow('Fail');
                    break;
                  case 'c':
                    e.preventDefault();
                    clearCurrentRow();
                    break;
                  case 'arrowdown':
                  case 'j':
                    e.preventDefault();
                    navigateRow(1);
                    break;
                  case 'arrowup':
                  case 'k':
                    e.preventDefault();
                    navigateRow(-1);
                    break;
                  case 'enter':
                    e.preventDefault();
                    focusNotes();
                    break;
                  case 'escape':
                    e.preventDefault();
                    exitKeyboardMode();
                    break;
                  case ' ':
                    e.preventDefault();
                    enterKeyboardMode();
                    break;
                }
              });
            }

            function markCurrentRow(state) {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              if (currentRow.length) {
                const select = currentRow.find('.state-select');
                select.val(state).trigger('change');
                navigateRow(1);
              }
            }

            function clearCurrentRow() {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              if (currentRow.length) {
                currentRow.find('.state-select').val('').trigger('change');
                // currentRow.find('.notes-input').val('').trigger('input');
              }
            }

            function navigateRow(direction) {
              if (!isKeyboardMode) return;

              const table = $('#myTable').DataTable();
              const totalRows = table.rows().count();

              currentRowIndex += direction;
              if (currentRowIndex < 0) currentRowIndex = 0;
              if (currentRowIndex >= totalRows) currentRowIndex = totalRows - 1;

              highlightCurrentRow();
              scrollToCurrentRow();
            }

            function getCurrentRow() {
              const table = $('#myTable').DataTable();
              return $(table.row(currentRowIndex).node());
            }

            function highlightCurrentRow() {
              $('#myTable tbody tr').removeClass('keyboard-focus');

              const currentRow = getCurrentRow();
              currentRow.addClass('keyboard-focus');
            }

            function scrollToCurrentRow() {
              const currentRow = getCurrentRow();
              if (currentRow.length) {
                currentRow[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }

            function focusNotes() {
              if (!isKeyboardMode) return;

              const currentRow = getCurrentRow();
              const notesInput = currentRow.find('.notes-input');
              if (notesInput.length) {
                notesInput.focus();
              }
            }

            function enterKeyboardMode() {
              isKeyboardMode = true;
              <!-- currentRowIndex = 0; -->
              highlightCurrentRow();
              showKeyboardHint();
            }

            function exitKeyboardMode() {
              isKeyboardMode = false;
              $('#myTable tbody tr').removeClass('keyboard-focus')
              hideKeyboardHint();
            }

            function showInitialHint() {
                $('.keyboard-hint').remove();
    
                $('body').append(`
                    <div class="keyboard-hint" style="
                        position: fixed; 
                        top: 15px; 
                        right: 10px; 
                        background: var(--bg-banner); 
                        color: var(--text-primary);
                        padding: 8px 12px; 
                        border-radius: 4px; 
                        font-size: 13px;
                        font-weight: 500;
                        z-index: 9999;
                        border: 1px solid var(--border-color);
                        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                    ">
                        Press <kbd>Space</kbd> to start keyboard navigation
                    </div>
                `);

                // Auto-hide if not in keyboard mode
                setTimeout(() => {
                  if (!isKeyboardMode) {
                    $('.keyboard-hint').fadeOut(1000, function() {
                      $(this).remove();
                    });
                  }
                }, 4000);
            }

            function showKeyboardHint() {
              $('.keyboard-hint').remove();
  
              $('body').append(`
                  <div class="keyboard-hint" style="
                      position: fixed; 
                      top: 15px; 
                      right: 10px; 
                      background: var(--bg-banner); 
                      color: var(--text-primary);
                      padding: 8px 12px; 
                      border-radius: 4px; 
                      font-size: 13px;
                      font-weight: 500;
                      z-index: 9999;
                      border: 1px solid var(--border-color);
                      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                  ">
                      Press <kbd>Esc</kbd> to exit keyboard mode
                  </div>
              `);

              $('body').append(`
              <div class="shortcut-summary" style="
                  position: fixed;
                  top: 60px;
                  right: 10px;
                  background: #007bff;
                  color: white;
                  padding: 10px 12px;
                  border-radius: 6px;
                  font-size: 11px;
                  z-index: 9998;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                  font-family: monospace;
              ">
                  <kbd style="background: rgba(255,255,255,0.2);">P</kbd>ass 
                  <kbd style="background: rgba(255,255,255,0.2);">F</kbd>ail 
                  <kbd style="background: rgba(255,255,255,0.2);">C</kbd>lear 
                  <kbd style="background: rgba(255,255,255,0.2);">↑↓</kbd>Nav 
                  <kbd style="background: rgba(255,255,255,0.2);">⏎</kbd>Notes
              </div>
            `);

              setTimeout(() => {
                $('.shortcut-summary').fadeOut(800, function() {
                  $(this).remove();
                });
              }, 5000);
            }            

            function hideKeyboardHint() {
              $('#keyboard-hint').remove();
              $('.shortcut-summary').remove();
              showInitialHint();
            }
    </script>
  </body>
</html>
